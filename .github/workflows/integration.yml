---
name: Integration
# The integration suite loads schemas, bootstrap data and this repository into
# a throwaway Infrahub stack (docker compose), so it needs a runner with Docker.
# Manual only (Actions > Integration > Run workflow); not a PR or release gate yet.
# Runs the fast loop: schema + bootstrap + repository sync + the full topology, ~5 min.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      INFRAHUB_TESTING_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
      - name: Run integration suite
        run: uv run invoke test-integration-fast
      - name: Remove leftover test containers
        if: always()
        run: uv run invoke clean-testcontainers
