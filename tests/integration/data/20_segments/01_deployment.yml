---
# C001 production footprint inside DC6 — mirrors the prod entry of
# data/demos/07_customers/c001/01_deployment.yml. Its computed name is
# "C001-P-DC6", which is what the segments below reference. Membership of
# customer_deployments_dc is required: the created-trigger dispatches
# add_customer_deployment_dc and that generator raises for non-members.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C001"
      environment: "p"
      status: active
      parent: "DC6"
      design: "M_DC"
      member_of_groups:
        - customer_deployments_dc
