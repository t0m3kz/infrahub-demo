---
# Engineering is granted the private frontend through an access profile; the
# grant is a dependency whose source is the profile and whose target is the
# frontend component.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityIdentityGroup
  data:
    - name: engineering
      source: manual
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityAccessProfile
  data:
    - name: it001-engineering
      allowed_groups:
        - engineering
---
# Frontend calls the payment-gateway external service — the generator should
# turn this into a ProxyPolicy/ProxyPolicyRule through IT001's egress service,
# not a firewall rule (target_fqdn is not a component, so its ports are listed
# here). Without ports, a component-targeted dependency opens every port of
# its target. Source and target are component fqdns.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: it001-checkout-p-frontend-to-payment-gateway
      source: frontend.internal.it001.demo.local
      target_fqdn: api.paymentgw.example.com
      ports:
        - tcp/443
      access_status: auto
      description: "Checkout frontend calls the payment gateway"
      member_of_groups:
        - app_dependencies

    - name: it001-checkout-p-frontend-to-backend
      source: frontend.internal.it001.demo.local
      target: backend.internal.it001.demo.local
      access_status: auto
      description: "Checkout frontend calls the internal backend API"
      member_of_groups:
        - app_dependencies

    - name: it001-engineering-to-checkout-frontend-private
      source_profile: it001-engineering
      target: frontend.internal.it001.demo.local
      access_status: approved
      description: "Engineering opens the checkout frontend through the ZTNA broker"
      member_of_groups:
        - app_dependencies
