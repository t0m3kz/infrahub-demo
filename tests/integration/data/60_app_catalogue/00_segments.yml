---
# Two isolated IT001 segments used to prove the internal firewall rule path.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "IT001 Test Customer"
      org_id: "IT001"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "checkout-frontend"
            environment: p
            customer_deployments:
              - "C005-P-DC10"
            member_of_groups:
              - vxlan_segments
        - kind: ManagedVxlanSegment
          data:
            customer_name: "checkout-backend"
            environment: p
            customer_deployments:
              - "C005-P-DC10"
            member_of_groups:
              - vxlan_segments
