---
# Minimal self-contained app: a frontend published through the ZTNA broker
# under its fqdn, which also calls an external payment gateway (egress proxy
# generation, see 03_dependencies.yml) and a backend on the other IT001
# segment (internal firewall rule path). Each component lists the ports it
# listens on; the dependencies open them.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: checkout
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: checkout.it001.demo.local
      ingress_mode: dns
      owner: "IT001"
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: frontend
            fqdn: frontend.internal.it001.demo.local
            component_type: frontend
            ports:
              - tcp/443
            network_segment: it001-checkout-frontend-p
            member_of_groups:
              - app_components

          - name: backend
            fqdn: backend.internal.it001.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: it001-checkout-backend-p
            member_of_groups:
              - app_components
