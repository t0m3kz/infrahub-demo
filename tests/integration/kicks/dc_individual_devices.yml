---
# DC15 deployed from pre-created individual DcimPhysicalDevice switches placed directly in racks,
# followed by an idempotency reload verifying zero duplicate devices, cables, or BGP sessions.
kicks:
  dc-individual-devices-suite:
    description: Pre-created individual rack devices (DC15) with BGP/cabling counts and idempotency check.
    stages:
      - name: fabric
        load: [data/demos/14_dc_universal/02_individual_devices]
        generator: dc_pod_cascade
        min_artifacts: 1
        expect:
          count:
            - DcimPhysicalDevice: {role: super-spine, deployment: DC15}
              equals: 2
            - DcimPhysicalDevice: {role: border-leaf, deployment: DC15}
              equals: 2
            - DcimPhysicalDevice: {role: spine, deployment: DC15-15-POD-1}
              equals: 2
            - DcimPhysicalDevice: {role: leaf, deployment: DC15-15-POD-1}
              equals: 2
            - DcimCable: {}
              equals: 12
            - ManagedBGP: {}
              equals: 16
            - ManagedBGPPeering: {}
              equals: 20
          removed: 0

      - name: idempotency
        load: [data/demos/14_dc_universal/02_individual_devices]
        generator: dc_pod_cascade
        min_artifacts: 1
        expect:
          count:
            - DcimPhysicalDevice: {role: super-spine, deployment: DC15}
              equals: 2
            - DcimPhysicalDevice: {role: border-leaf, deployment: DC15}
              equals: 2
            - DcimPhysicalDevice: {role: spine, deployment: DC15-15-POD-1}
              equals: 2
            - DcimPhysicalDevice: {role: leaf, deployment: DC15-15-POD-1}
              equals: 2
            - DcimCable: {}
              equals: 12
            - ManagedBGP: {}
              equals: 16
            - ManagedBGPPeering: {}
              equals: 20
          unchanged:
            DcimPhysicalDevice: [name, role, status]
            ManagedBGP: [local_as]
          removed: 0
