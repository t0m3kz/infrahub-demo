query GetTransitInventory {
  ManagedFirewallContext {
    edges {
      node {
        id
        name {
          value
        }
        vlan_id {
          value
        }
        snat_address {
          node {
            address {
              value
            }
            ip_namespace {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        tenant {
          node {
            id
            ... on TopologyCustomerDC {
              name {
                value
              }
            }
          }
        }
        served_deployments {
          edges {
            node {
              id
              ... on TopologyCustomer {
                name {
                  value
                }
              }
              ... on TopologyEnvironmentScoped {
                environment {
                  value
                }
              }
            }
          }
        }
        # The members: a context has no interface edge, its legs and border ports are derived from them
        # (utils/service_contexts.py, tests/integration/service_inventory_helpers.py _context_legs_and_ports).
        shared_devices {
          edges {
            node {
              __typename
              id
              name {
                value
              }
              role {
                value
              }
              # The HA pair of the member (a context holds no HA edge) and where it stands.
              capabilities {
                edges {
                  node {
                    __typename
                    ... on ManagedFirewallHA {
                      id
                      name {
                        value
                      }
                      capabilities {
                        edges {
                          node {
                            id
                          }
                        }
                      }
                    }
                    ... on ManagedLoadbalancerHA {
                      id
                      name {
                        value
                      }
                      capabilities {
                        edges {
                          node {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimPhysicalDevice {
                deployment {
                  node {
                    __typename
                    name {
                      value
                    }
                  }
                }
              }
              shared_capabilities {
                edges {
                  node {
                    __typename
                    id
                    ... on ManagedSecurityContext {
                      vlan_id {
                        value
                      }
                    }
                  }
                }
              }
              ... on DcimDevice {
                interfaces {
                  edges {
                    node {
                      __typename
                      id
                      name {
                        value
                      }
                      role {
                        value
                      }
                      ...InterfaceRoutingZoneFields
                      ... on DcimPhysicalInterface {
                        cable {
                          node {
                            id
                            endpoints {
                              edges {
                                node {
                                  __typename
                                  ... on DcimPhysicalInterface {
                                    id
                                    name {
                                      value
                                    }
                                    role {
                                      value
                                    }
                                    device {
                                      node {
                                        id
                                        name {
                                          value
                                        }
                                        ... on DcimDeviceManaged {
                                          role {
                                            value
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                      ... on DcimVirtualInterface {
                        vlan_id {
                          value
                        }
                        parent_interface {
                          node {
                            id
                            name {
                              value
                            }
                            ... on DcimPhysicalInterface {
                              cable {
                                node {
                                  id
                                  endpoints {
                                    edges {
                                      node {
                                        __typename
                                        ... on DcimPhysicalInterface {
                                          id
                                          name {
                                            value
                                          }
                                          role {
                                            value
                                          }
                                          device {
                                            node {
                                              id
                                              name {
                                                value
                                              }
                                              ... on DcimDeviceManaged {
                                                role {
                                                  value
                                                }
                                              }
                                            }
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                        ip_address {
                          node {
                            address {
                              value
                            }
                            ip_namespace {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  TopologyRoutedExchange {
    edges {
      node {
        id
        name {
          value
        }
        vrf_a {
          node {
            ...RoutingVrfFields
          }
        }
        vrf_z {
          node {
            ...RoutingVrfFields
          }
        }
        gateway {
          node {
            id
            name {
              value
            }
          }
        }
      }
    }
  }
}
