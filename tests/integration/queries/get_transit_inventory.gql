query GetTransitInventory {
  ManagedFirewallContext {
    edges {
      node {
        id
        name {
          value
        }
        vlan_id {
          value
        }
        snat_address {
          node {
            address {
              value
            }
            ip_namespace {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        tenant {
          node {
            id
            ... on TopologyCustomerDC {
              name {
                value
              }
            }
          }
        }
        cluster {
          node {
            name {
              value
            }
            capabilities {
              edges {
                node {
                  ... on DcimPhysicalDevice {
                    deployment {
                      node {
                        __typename
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        served_deployments {
          edges {
            node {
              id
              ... on TopologyCustomer {
                name {
                  value
                }
              }
              ... on TopologyEnvironmentScoped {
                environment {
                  value
                }
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              id
              name {
                value
              }
              device {
                node {
                  id
                  name {
                    value
                  }
                  ... on DcimDeviceManaged {
                    role {
                      value
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                capabilities {
                  edges {
                    node {
                      __typename
                      ... on TopologyRoutedExchange {
                        id
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  TopologyRoutedExchange {
    edges {
      node {
        id
        name {
          value
        }
        vrf_a {
          node {
            ...RoutingVrfFields
          }
        }
        vrf_z {
          node {
            ...RoutingVrfFields
          }
        }
        gateway {
          node {
            id
            name {
              value
            }
          }
        }
      }
    }
  }
}
