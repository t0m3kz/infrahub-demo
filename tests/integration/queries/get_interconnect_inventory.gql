# The circuit layer of a branch. A location carries its kind, its parent (a cage's metro, a footprint's facility)
# and a footprint's owner, an end its device's deployment: what test_62 checks circuit placement against.
query GetInterconnectInventory {
  TopologyPhysicalCircuit {
    edges {
      node {
        id
        circuit_id {
          value
        }
        circuit_type {
          value
        }
        status {
          value
        }
        provider {
          node {
            name {
              value
            }
          }
        }
        owner {
          node {
            id
            name {
              value
            }
          }
        }
        locations {
          edges {
            node {
              ...CircuitLocation
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              name {
                value
              }
              device {
                node {
                  ...CircuitEndDevice
                }
              }
            }
          }
        }
      }
    }
  }
  TopologyVirtualCircuit {
    edges {
      node {
        id
        name {
          value
        }
        link_type {
          value
        }
        transport_mode {
          value
        }
        owner {
          node {
            id
            name {
              value
            }
          }
        }
        locations {
          edges {
            node {
              ...CircuitLocation
            }
          }
        }
        physical_circuits {
          edges {
            node {
              circuit_id {
                value
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              name {
                value
              }
              device {
                node {
                  ...CircuitEndDevice
                }
              }
            }
          }
        }
        cloud_endpoints {
          edges {
            node {
              __typename
              ... on CloudVirtualInterface {
                name {
                  value
                }
                vif_type {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment CircuitLocation on TopologyConnectableLocation {
  id
  __typename
  name {
    value
  }
  ... on TopologyColocationZone {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomerDC {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomerColocation {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomerCloud {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomer {
    owner {
      node {
        id
        __typename
      }
    }
  }
  ... on TopologyCustomerOffice {
    owner {
      node {
        id
        __typename
      }
    }
  }
}

fragment CircuitEndDevice on DcimDevice {
  id
  name {
    value
  }
  ... on DcimPhysicalDevice {
    deployment {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on DcimVirtualDevice {
    deployment {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
}
