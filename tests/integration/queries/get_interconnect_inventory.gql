query GetInterconnectInventory {
  TopologyCarrierCircuit {
    edges {
      node {
        id
        circuit_id {
          value
        }
        circuit_type {
          value
        }
        status {
          value
        }
        provider {
          node {
            name {
              value
            }
          }
        }
        locations {
          edges {
            node {
              ...CircuitLocation
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              name {
                value
              }
              device {
                node {
                  ...CircuitEndDevice
                }
              }
            }
          }
        }
      }
    }
  }
  TopologySessionCircuit {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        circuit_type {
          value
        }
        locations {
          edges {
            node {
              ...CircuitLocation
            }
          }
        }
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        password {
          node {
            name {
              value
            }
          }
        }
        capabilities {
          edges {
            node {
              ...InterfaceRoutingZoneFields
              id
              __typename
              name {
                value
              }
              ... on DcimPhysicalInterface {
                cable {
                  node {
                    id
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                  }
                }
              }
              encapsulation_capabilities: capabilities {
                edges {
                  node {
                    __typename
                    ... on ManagedInterfaceEncapsulation {
                      vlan_id {
                        value
                      }
                      parent {
                        node {
                          id
                          name {
                            value
                          }
                          ... on DcimPhysicalInterface {
                            cable {
                              node {
                                id
                              }
                            }
                          }
                          capabilities {
                            edges {
                              node {
                                ...CircuitCarrier
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address {
                      value
                    }
                  }
                }
              }
              capabilities {
                edges {
                  node {
                    ...CircuitCarrier
                  }
                }
              }
              device {
                node {
                  ...CircuitEndDevice
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment CircuitCarrier on ManagedGenericInterfaces {
  __typename
  ... on TopologyCarrierCircuit {
    id
    circuit_id {
      value
    }
    status {
      value
    }
  }
}

# The generic has no `name`: every location is a TopologyDeployment.
fragment CircuitLocation on TopologyConnectableLocation {
  id
  __typename
  ... on TopologyDeployment {
    name {
      value
    }
  }
  ... on TopologyColocationZone {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyVirtualColocation {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomerDC {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomerColocation {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomerCloud {
    parent {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  ... on TopologyCustomer {
    owner {
      node {
        ...CircuitOwner
      }
    }
  }
  ... on TopologyCustomerOffice {
    owner {
      node {
        ...CircuitOwner
      }
    }
  }
}

fragment CircuitOwner on OrganizationEntity {
  id
  __typename
  org_id {
    value
  }
  ... on OrganizationCustomer {
    name {
      value
    }
  }
}

fragment CircuitEndDevice on DcimDevice {
  id
  __typename
  name {
    value
  }
  ... on DcimPhysicalDevice {
    deployment {
      node {
        id
        __typename
        name {
          value
        }
        ... on TopologyColocationZone {
          parent {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  ... on DcimVirtualDevice {
    deployment {
      node {
        id
        __typename
        name {
          value
        }
        ... on TopologyColocationZone {
          parent {
            node {
              id
              name {
                value
              }
            }
          }
        }
        ... on TopologyVirtualColocation {
          parent {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  ... on CloudNetworkAppliance {
    deployment {
      node {
        id
        __typename
        # TopologyApplianceHosting has no `name`: every host is a TopologyDeployment.
        ... on TopologyDeployment {
          name {
            value
          }
        }
        ... on TopologyVirtualColocation {
          parent {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  ... on TopologyProviderConnect {
    location {
      node {
        id
        __typename
        name {
          value
        }
        ... on TopologyColocationZone {
          parent {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  ... on CloudTransport {
    region {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
    saas_region {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
}
