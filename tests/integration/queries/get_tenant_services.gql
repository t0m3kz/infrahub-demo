query GetTenantServices {
  ManagedFirewallContext {
    edges {
      node {
        name {
          value
        }
        id
        # The member firewalls (a context is a shared capability with no HA edge): the HA pair each is in, and the
        # DC (or colocation zone) it stands in, so a check can scope contexts to its own DCs.
        shared_devices {
          edges {
            node {
              id
              capabilities {
                edges {
                  node {
                    __typename
                    ... on ManagedFirewallHA {
                      id
                      name {
                        value
                      }
                      capabilities {
                        edges {
                          node {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimPhysicalDevice {
                deployment {
                  node {
                    __typename
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        tenant {
          node {
            __typename
            ... on TopologyCustomerDC {
              name {
                value
              }
              design {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  ManagedSegmentDeployment {
    edges {
      node {
        vni {
          value
        }
        status {
          value
        }
        segment {
          node {
            __typename
            ... on ManagedNetworkSegment {
              name {
                value
              }
            }
          }
        }
        deployment {
          node {
            __typename
            name {
              value
            }
          }
        }
      }
    }
  }
}
