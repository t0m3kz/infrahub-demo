query GetLoadbalancerInventory {
  ManagedLoadbalancerContext {
    edges {
      node {
        id
        name {
          value
        }
        vlan_id {
          value
        }
        tenant {
          node {
            id
            ... on TopologyCustomerDC {
              name {
                value
              }
            }
          }
        }
        cluster {
          node {
            id
            name {
              value
            }
            capabilities {
              edges {
                node {
                  id
                  ... on DcimPhysicalDevice {
                    deployment {
                      node {
                        __typename
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        served_deployments {
          edges {
            node {
              id
              ... on TopologyCustomer {
                name {
                  value
                }
              }
            }
          }
        }
        vip_prefix {
          node {
            prefix {
              value
            }
            ip_namespace {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        # The members: a context has no interface edge, its legs and border ports are derived from them
        # (utils/service_contexts.py, tests/integration/service_inventory_helpers.py _context_legs_and_ports).
        shared_devices {
          edges {
            node {
              __typename
              id
              name {
                value
              }
              role {
                value
              }
              shared_capabilities {
                edges {
                  node {
                    __typename
                    id
                    ... on ManagedSecurityContext {
                      vlan_id {
                        value
                      }
                    }
                  }
                }
              }
              ... on DcimDevice {
                interfaces {
                  edges {
                    node {
                      __typename
                      id
                      name {
                        value
                      }
                      role {
                        value
                      }
                      ...InterfaceRoutingZoneFields
                      ... on DcimPhysicalInterface {
                        cable {
                          node {
                            id
                            endpoints {
                              edges {
                                node {
                                  __typename
                                  ... on DcimPhysicalInterface {
                                    id
                                    name {
                                      value
                                    }
                                    role {
                                      value
                                    }
                                    device {
                                      node {
                                        id
                                        name {
                                          value
                                        }
                                        ... on DcimDeviceManaged {
                                          role {
                                            value
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                      ... on DcimVirtualInterface {
                        vlan_id {
                          value
                        }
                        parent_interface {
                          node {
                            id
                            name {
                              value
                            }
                            ... on DcimPhysicalInterface {
                              cable {
                                node {
                                  id
                                  endpoints {
                                    edges {
                                      node {
                                        __typename
                                        ... on DcimPhysicalInterface {
                                          id
                                          name {
                                            value
                                          }
                                          role {
                                            value
                                          }
                                          device {
                                            node {
                                              id
                                              name {
                                                value
                                              }
                                              ... on DcimDeviceManaged {
                                                role {
                                                  value
                                                }
                                              }
                                            }
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                        ip_address {
                          node {
                            address {
                              value
                            }
                            ip_namespace {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        vips {
          edges {
            node {
              hostname {
                value
              }
              protocol {
                value
              }
              port {
                value
              }
              vip_ip {
                node {
                  address {
                    value
                  }
                }
              }
              pool_members {
                edges {
                  node {
                    __typename
                    name {
                      value
                    }
                    ... on DcimPhysicalDevice {
                      primary_address {
                        node {
                          address {
                            value
                          }
                        }
                      }
                    }
                    ... on DcimVirtualDevice {
                      primary_address {
                        node {
                          address {
                            value
                          }
                        }
                      }
                    }
                  }
                }
              }
              health_checks {
                edges {
                  node {
                    check {
                      value
                    }
                    rise {
                      value
                    }
                    fall {
                      value
                    }
                    timeout {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
