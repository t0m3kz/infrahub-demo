query GetLoadbalancerInventory {
  ManagedLoadbalancerContext {
    edges {
      node {
        id
        name { value }
        vlan_id { value }
        tenant {
          node {
            id
            ... on TopologyCustomerDC { name { value } }
          }
        }
        cluster {
          node {
            id
            name { value }
            # Members: the DC the shared cluster's physical load balancers are
            # deployed in (empty for a dedicated pair of virtual members).
            capabilities {
              edges {
                node {
                  id
                  ... on DcimPhysicalDevice {
                    deployment { node { __typename name { value } } }
                  }
                }
              }
            }
          }
        }
        served_deployments {
          edges {
            node {
              id
              ... on TopologyCustomer { name { value } }
            }
          }
        }
        vip_prefix { node { prefix { value } ip_namespace { node { name { value } } } } }
        # The one leg (each member's VLAN sub-interface) and the border-leaf
        # load-balancer ports tagged with the context, told apart by __typename.
        capabilities {
          edges {
            node {
              __typename
              id
              name { value }
              device { node { id name { value } role { value } } }
              ... on DcimPhysicalInterface { role { value } }
              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } namespace_type { value } } }
                  }
                }
              }
            }
          }
        }
        vips {
          edges {
            node {
              hostname { value }
              protocol { value }
              port { value }
              vip_ip { node { address { value } } }
              pool_members { edges { node { address { value } } } }
              component {
                node {
                  fqdn { value }
                  network_segment {
                    node {
                      name { value }
                      gateway { node { ip_prefix { node { prefix { value } } } } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
