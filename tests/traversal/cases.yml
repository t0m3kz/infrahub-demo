---
# Cases of the traversal check (`uv run invoke check-model`). A case = a schema dir, the data dirs that build a
# small topology on a throwaway branch, and the segment pairs whose L1/L3 path must be visible.
cases:
  - name: full_topology
    schema: schemas
    # the whole sample is ONE directory (numbered folders = load order, see its README); load_topology.py (next to
    # this file) loads it in one `infrahubctl object load` run and then adds the VLAN-domain row of dc90-leaf-02
    data:
      - data/demos/00_full_topology
    # python module with `load(client, branch) -> dict` and `main_walk(d, dc, cloud, quiet) -> dict`
    tracer: utils/path_trace.py
    # a transport port or LAG lists its peerings in `sub_interfaces` (DcimSubInterface, the marker shared with VIFs)
    transport_sub_interfaces: true
    # the pod DC90-9-POD-1 (leaves, spine) in front of the edge: server (bond0) -> vPC leaf pair -> spine -> border
    # leaves (deployed to the DC, as a border role belongs to it) -> edge
    pod:
      server: dc90-srv-01
      bond: bond0
      leaves: [dc90-leaf-01, dc90-leaf-02]
      edge: dc90-edge-01
      segment: c900-demo-web-p
      mlag: dc90-mlag-01
      deployed_to:
        dc90-leaf-01: DC90-9-POD-1
        dc90-leaf-02: DC90-9-POD-1
        dc90-spine-01: DC90-9-POD-1
        dc90-bl-01: DC90
        dc90-bl-02: DC90
        dc90-edge-01: DC90
      # 4 = 2 leaves x 1 spine x 2 border leaves; +1 = the direct uplink leaf-01 -> panel -> edge of the base sample
      l1_paths_to_edge: 5
      l1_paths_via_spine: 4
    # THE INTERNET: one object under the label "Internet" with one shared interface; two ISPs and the public side of a
    # SaaS and of a cloud service attach to it, so from the edge L1 reaches each public side through either ISP
    internet:
      edge: dc90-edge-01
      object: INTERNET
      label: Internet
      bus: bus
      namespace: INTERNET
      golden: full_topology__internet.txt
      isps:
        - {isp_device: EXT-ISP-DEMO-PE1, access_port: Ethernet1/2, access_carrier: INET-DC90-ISP-DEMO, uplink_carrier: UPL-ISP-DEMO}  # yamllint disable-line rule:line-length
        - {isp_device: EXT-ISP-DEMO-B-PE1, access_port: Ethernet1/1, access_carrier: INET-DC90-ISP-DEMO-B, uplink_carrier: UPL-ISP-DEMO-B}  # yamllint disable-line rule:line-length
      public_sides:
        - {endpoint: s3-public, prefix: 192.0.2.0/24, kind: cloud, transport: s3-c900-euc1-pub, port: pub-1, carrier: PUB-S3-EUC1}  # yamllint disable-line rule:line-length
        - {endpoint: webex-public, prefix: 203.0.113.0/24, kind: saas, transport: webex-c900-fra-pub, port: pub-1, carrier: PUB-WEBEX-FRA}  # yamllint disable-line rule:line-length
      # L3 of the first ISP: the eBGP session on the two physical ports of the access carrier
      l3: {isp_device: EXT-ISP-DEMO-PE1, edge_port: Ethernet1/2, isp_port: et-0/0/0}
    pairs:
      - dc_segment: c900-demo-web-p
        cloud_segment: c900-demo-subnet-p
        golden: full_topology__c900-demo-web-p__c900-demo-subnet-p.txt
        # legs per carrier type (L1) and per session circuit type (L3, a session circuit counted once)
        l1_legs:
          internet: 2
          cross_connect: 4
        l3_legs:
          handoff: 2
          vpn: 2
        # the device kinds a circuit may end on (the transport of the cloud side)
        far_end_kinds: [CloudDirectConnect, CloudVPNConnection]
        # what a transport holds as its own interfaces (keys of the tracer's `transports`): ports, LAG, VIFs
        transport_kinds:
          dx-c900-fra-lag: [port, lag, vif]
          vpn-c900-aws-euc1: [vif]
        # the graph kinds (keys of the tracer's `load`) that must not be empty
        non_empty:
          [seg, iface, front, rear, carrier, session, vif, lag, dx, peer, vpn, gw, att, sep, vnet, csg, inst, bgp,
           peering, dev, mlag, vrf, prefix]
      # DC -> cloud through the AWS VPN tunnels only: the internet carrier and the two tunnels, no handoff leg
      - dc_segment: c900-demo-web-p
        cloud_segment: c900-demo-subnet-p
        via: [CloudVPNConnection]
        golden: full_topology__web__subnet__vpn-only.txt
        l1_legs: {internet: 2}
        l3_legs: {vpn: 2}
        far_end_kinds: [CloudVPNConnection]
        transport_kinds:
          vpn-c900-aws-euc1: [vif]
      # DC -> SaaS over a private cross-connect and a BGP handoff (Webex)
      - dc_segment: c900-demo-web-p
        saas_region: WEBEX-FRANKFURT
        golden: full_topology__web__saas-webex.txt
        l1_legs: {cross_connect: 1}
        l3_legs: {handoff: 1}
        far_end_kinds: [CloudDirectConnect]
        transport_kinds:
          webex-c900-fra-xc: [port, vif]
      # DC -> SaaS over a tunnel on the internet carrier, no session (Zscaler)
      - dc_segment: c900-demo-web-p
        saas_region: ZSCALER-MUNICH I
        golden: full_topology__web__saas-zscaler.txt
        l1_legs: {internet: 1}
        l3_legs: {tunnel: 1}
        far_end_kinds: [CloudVPNConnection]
        transport_kinds:
          zscaler-c900-muc: [vif]
      # cloud <-> cloud: the spoke VNet has no gateway of its own, the DC reaches it across `peers` of the hub VNet
      - dc_segment: c900-demo-web-p
        cloud_segment: c900-demo-spoke-p
        golden: full_topology__web__spoke.txt
        reverse: false
        l1_legs: {virtual_connection: 2}
        l3_legs: {handoff: 2}
        far_end_kinds: [CloudDirectConnect]
      # negative: a segment in a VPC with no attachment is reached by nothing, and the walk says exactly that
      - dc_segment: c900-demo-web-p
        cloud_segment: c900-demo-isolated-p
        expect_unreachable: true
        expect_missing:
          - "L1: no physical path found"
          - "L3: no routed path found"
