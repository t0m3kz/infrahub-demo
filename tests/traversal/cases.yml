---
# Cases of the traversal check (`uv run invoke check-model`). A case = a schema dir, the data dirs that build a
# small topology on a throwaway branch, and the segment pairs whose L1/L3 path must be visible.
cases:
  - name: full_topology
    schema: schemas
    # the whole sample is ONE directory (numbered folders = load order, see its README); load_topology.py (next to
    # this file) loads it in one `infrahubctl object load` run and then adds the VLAN-domain row of ktw1-leaf-02
    data:
      - data/demos/00_full_topology
    # every object kind of the bulk read (tests/traversal/graph_read.py QUERIES keys) that must not be empty
    non_empty:
      [seg, iface, front, rear, carrier, session, vif, lag, dx, peer, vpn, gw, att, sep, vnet, csg, inst, bgp,
       peering, dev, mlag, vrf, prefix, vcl, mpc, k8s, vsw, sdn, onk8s]
    # what the chains do not show (peering scope, AS numbers, allowed prefixes, transport interfaces), sorted
    inventory_golden: full_topology__inventory.txt
    # a transport port or LAG lists its peerings in `sub_interfaces` (DcimSubInterface, the marker shared with VIFs)
    transport_sub_interfaces: true
    # the pod of each DC (leaves, spine, server) in front of the edge: server (bond0) -> vPC leaf pair -> spine ->
    # border leaves (deployed to the DC, as a border role belongs to it) -> edge
    pods:
      - server: ktw1-srv-01
        bond: bond0
        leaves: [ktw1-leaf-01, ktw1-leaf-02]
        leaves_to_edge: []
        border_leaves: [ktw1-bl-01, ktw1-bl-02]
        edge: ktw1-edge-01
        segment: c900-web-p
        mlag: ktw1-mlag-01
        deployed_to:
          ktw1-leaf-01: DC-KTW1-9-POD-1
          ktw1-leaf-02: DC-KTW1-9-POD-1
          ktw1-spine-01: DC-KTW1-9-POD-1
          ktw1-srv-01: DC-KTW1-9-POD-1
          ktw1-bl-01: DC-KTW1
          ktw1-bl-02: DC-KTW1
          ktw1-edge-01: DC-KTW1
        # 4 = 2 leaves x 1 spine x 2 border leaves (one `--via` trace each); +1 = the direct uplink leaf-01 ->
        # panel -> edge (and its session), the shortest set of the plain trace; no other pod has it
        l1_paths_to_edge: 5
        l1_paths_via_spine: 4
      - server: waw1-srv-01
        bond: bond0
        leaves: [waw1-leaf-01, waw1-leaf-02]
        leaves_to_edge: []
        border_leaves: [waw1-bl-01, waw1-bl-02]
        edge: waw1-edge-01
        segment: c900-app-p
        mlag: waw1-mlag-01
        deployed_to:
          waw1-leaf-01: DC-WAW1-7-POD-1
          waw1-leaf-02: DC-WAW1-7-POD-1
          waw1-spine-01: DC-WAW1-7-POD-1
          waw1-srv-01: DC-WAW1-7-POD-1
          waw1-bl-01: DC-WAW1
          waw1-bl-02: DC-WAW1
          waw1-edge-01: DC-WAW1
        # the 4 paths through the spine are the shortest set: no direct leaf - edge link
        l1_paths_to_edge: 4
        l1_paths_via_spine: 4
      - server: gdn1-srv-01
        bond: bond0
        leaves: [gdn1-leaf-01, gdn1-leaf-02]
        leaves_to_edge: []
        border_leaves: [gdn1-bl-01, gdn1-bl-02]
        edge: gdn1-edge-01
        segment: c900-db-p
        mlag: gdn1-mlag-01
        deployed_to:
          gdn1-leaf-01: DC-GDN1-8-POD-1
          gdn1-leaf-02: DC-GDN1-8-POD-1
          gdn1-spine-01: DC-GDN1-8-POD-1
          gdn1-srv-01: DC-GDN1-8-POD-1
          gdn1-bl-01: DC-GDN1
          gdn1-bl-02: DC-GDN1
          gdn1-edge-01: DC-GDN1
        # the 4 paths through the spine are the shortest set: no direct leaf - edge link
        l1_paths_to_edge: 4
        l1_paths_via_spine: 4
    # THE INTERNET: one object under the label "Internet" with one shared interface; two ISPs and the public side of a
    # SaaS and of a cloud service attach to it, so from the edge L1 reaches each public side through either ISP
    internet:
      edge: ktw1-edge-01
      object: INTERNET
      label: Internet
      bus: bus
      namespace: INTERNET
      golden: full_topology__internet.txt  # the L1 chains edge port -> public side port, through each ISP
      isps:
        - {isp_device: EXT-ISP-A-PE1, access_port: Ethernet1/2, access_carrier: ISPA-48211, uplink_carrier: UPL-48001}  # yamllint disable-line rule:line-length
        - {isp_device: EXT-ISP-B-PE1, access_port: Ethernet1/1, access_carrier: ISPB-77301, uplink_carrier: UPL-77001}  # yamllint disable-line rule:line-length
      public_sides:
        - {endpoint: s3-public, prefix: 192.0.2.0/24, kind: cloud, transport: EXT-AWS-EUC1, port: pub-1, carrier: PUB-16509}  # yamllint disable-line rule:line-length
        - {endpoint: webex-public, prefix: 203.0.113.0/24, kind: saas, transport: EXT-WEBEX-FRA, port: pub-1, carrier: PUB-13445}  # yamllint disable-line rule:line-length
        - {endpoint: blob-public, prefix: 198.18.0.0/24, kind: cloud, transport: EXT-AZURE-WEU, port: pub-1, carrier: PUB-20113}  # yamllint disable-line rule:line-length
        - {endpoint: gcs-public, prefix: 198.18.1.0/24, kind: cloud, transport: EXT-GCP-EUW3, port: pub-1, carrier: PUB-22407}  # yamllint disable-line rule:line-length
      # the cages on an Equinix Internet Access service: their carrier runs from the connection interface of the
      # provider's Fabric port straight to the bus, no ISP router on the way
      fabric_accesses: [EQX-5A1F2C30, EQX-8D3B6E41]
      # the public tunnel endpoint of the AWS VPN: an internet carrier from the transport port to the bus
      vpn_accesses: [PUB-26501]
      # L3 of the first ISP: the eBGP session on the two physical ports of the access carrier
      l3: {isp_device: EXT-ISP-A-PE1, edge_port: Ethernet1/2, isp_port: et-0/0/0}
    # THE THREE SITES reach THE INTERNET in L1, each through its own access carrier (and then the uplink of the ISP
    # router it is connected to): the DC through its tenant segment and the edge's two ISPs, the colocation cage through
    # its access to the second ISP, the office through its SD-WAN edge's access to the first ISP, and the two
    # edges of the
    # second office each through an ISP of its own
    sites:
      internet: TopologyInternet:INTERNET
      isp_routers: [EXT-ISP-A-PE1, EXT-ISP-B-PE1]
      sites:
        - {site: DC, node: "ManagedVxlanSegment:c900-web-p", carriers: [[ISPA-48211, UPL-48001], [ISPB-77301, UPL-77001]]}  # yamllint disable-line rule:line-length
        - {site: colocation, node: "DcimPhysicalDevice:par-colo1-edge-01", carriers: [[ISPB-77302, UPL-77001]]}
        - {site: colocation-fra, node: "DcimPhysicalDevice:fra-colo1-edge-01", carriers: [[EQX-5A1F2C30]]}
        - {site: colocation-ams, node: "DcimPhysicalDevice:ams-colo1-edge-01", carriers: [[EQX-8D3B6E41]]}
        - {site: office, node: "DcimPhysicalDevice:bcn-office-edge-01", carriers: [[ISPA-48212, UPL-48001]]}
        - {site: office-lisbon-1, node: "DcimPhysicalDevice:lis-office-edge-01", carriers: [[ISPA-48213, UPL-48001]]}
        - {site: office-lisbon-2, node: "DcimPhysicalDevice:lis-office-edge-02", carriers: [[ISPB-77303, UPL-77001]]}
    # where the sites and their legs are (attribute reads): the cloud and SaaS legs end in the cage PAR-COLO1 and not at
    # a DC, each dark fibre joins the two facilities listed for it, the office tunnels end on the office's own edge
    # THE FAR ENDS reach each other: one shortest path per pair and layer, no ECMP set and no golden (the pairs
    # above hold
    # those). The ends are where somebody or something sits: a server (VM), an office (its edge: an access point has no
    # address and no routing, so L3 stops at the edge), a cloud segment, an access point and THE INTERNET (L1
    # only). A broken
    # hop anywhere between two ends fails a row, whichever box it is on. L3 is the full mesh of `l3`. L1 are the
    # pairs of
    # `l1`; the tracer searches 30 nodes deep, so the longer ones go through a waypoint (`via`, two legs).
    reachability:
      # PATHS THROUGH A FIREWALL (L3 with the firewall kinds: the footprint and its context). `via` is
      # the waypoint (two legs), `crosses` the nodes the chain must hold: the model says the traffic goes through them.
      firewall:
        # a server of DC-KTW1 to the first ISP: PROD leaves through the external pair (the default route of the
        # border leaves points at its leg, the return route of its public address back at the border)
        - src: DcimVirtualDevice:ktw1-vm-01
          dst: DcimPhysicalDevice:EXT-ISP-A-PE1
          via: DcimPhysicalDevice:ktw1-xfw-01
        # a leaf of C900 to the border leaf, through the internal context that serves the footprint (the leaf steers,
        # ManagedPBR; the steering and the context's border port are derived, not edges of the graph)
        - src: DcimPhysicalDevice:ktw1-leaf-01
          dst: DcimPhysicalDevice:ktw1-bl-01
          via: ManagedFirewallContext:shared-ktw1-fw-ha-prod
          crosses:
            - TopologyCustomerDC:C900-P-DC-KTW1
        # a server of DC-KTW1 to a server of DC-WAW1 (another segment): each DC steers its segment to its own firewall
        # (the leaf steers the SVI to the context serving the footprint, behind the border leaf), so the chain
        # crosses the context of KTW1 and then the context of WAW1, in that order
        - src: DcimVirtualDevice:ktw1-vm-01
          dst: DcimVirtualDevice:waw1-vm-01
          via:
            - ManagedFirewallContext:shared-ktw1-fw-ha-prod
            - ManagedFirewallContext:shared-waw1-fw-ha-prod
        # a server of DC-WAW1 to the second ISP: WAW1 has no access of its own, the Internet is the cage's (a dark fibre
        # to the PAR-COLO1 edge, the eBGP session of the edge to ISP-B). The segment is steered to the firewall of WAW1,
        # and what the cage sends out leaves through its external firewall pair
        - src: DcimVirtualDevice:waw1-vm-01
          dst: DcimPhysicalDevice:EXT-ISP-B-PE1
          via:
            - ManagedFirewallContext:shared-waw1-fw-ha-prod
            - DcimPhysicalDevice:par-colo1-xfw-01
      l3:
        - DcimVirtualDevice:ktw1-vm-01
        - DcimPhysicalDevice:par-colo1-srv-01
        - CloudInstance:c900-app-euc1-1
        - DcimVirtualDevice:waw1-vm-01
        - DcimVirtualDevice:gdn1-vm-01
        - DcimPhysicalDevice:bcn-office-edge-01
        - DcimPhysicalDevice:lis-office-edge-01
        - DcimPhysicalDevice:lis-office-edge-02
        - CloudNetworkSegment:c900-subnet-p
        - CloudNetworkSegment:c900-payments-aws-p
        - CloudNetworkSegment:c900-spoke-p
        - CloudNetworkSegment:c900-payments-azure-p
      l1:
        # Actual C900 workload ends, not a cage router or an AWS segment substituted for the workload.
        - src: DcimVirtualDevice:ktw1-vm-01
          dst: DcimPhysicalDevice:par-colo1-srv-01
          via: DcimPhysicalDevice:par-colo1-edge-01
        - src: DcimPhysicalDevice:par-colo1-srv-01
          dst: CloudInstance:c900-app-euc1-1
          via: DcimPhysicalDevice:par-colo1-edge-01
        - src: DcimVirtualDevice:ktw1-vm-01
          dst: CloudInstance:c900-app-euc1-1
          via: DcimPhysicalDevice:par-colo1-edge-01
        # access point, server and cloud segment to THE INTERNET
        - {src: "DcimPhysicalDevice:bcn-office-ap-01", dst: "TopologyInternet:INTERNET"}
        - {src: "DcimPhysicalDevice:lis-office-ap-03", dst: "TopologyInternet:INTERNET"}
        - {src: "DcimVirtualDevice:ktw1-vm-01", dst: "TopologyInternet:INTERNET"}
        - {src: "CloudNetworkSegment:c900-subnet-p", dst: "TopologyInternet:INTERNET"}
        - {src: "CloudNetworkSegment:c900-spoke-p", dst: "TopologyInternet:INTERNET"}
        # server to access point, access point to access point: over THE INTERNET (the offices and the DC meet there)
        # yamllint disable-line rule:line-length
        - {src: "DcimVirtualDevice:ktw1-vm-01", dst: "DcimPhysicalDevice:bcn-office-ap-01", via: "TopologyInternet:INTERNET"}
        # yamllint disable-line rule:line-length
        - {src: "DcimVirtualDevice:ktw1-vm-01", dst: "DcimPhysicalDevice:lis-office-ap-03", via: "TopologyInternet:INTERNET"}
        # yamllint disable-line rule:line-length
        - {src: "DcimVirtualDevice:gdn1-vm-01", dst: "DcimPhysicalDevice:lis-office-ap-03", via: "TopologyInternet:INTERNET"}
        # yamllint disable-line rule:line-length
        - {src: "DcimPhysicalDevice:bcn-office-ap-01", dst: "DcimPhysicalDevice:lis-office-ap-03", via: "TopologyInternet:INTERNET"}
        # access point to a cloud segment OVER THE INTERNET: the VPN transport's public endpoint is the way in
        # yamllint disable-line rule:line-length
        - {src: "DcimPhysicalDevice:bcn-office-ap-01", dst: "CloudNetworkSegment:c900-subnet-p", via: "TopologyInternet:INTERNET", with: [CloudVPNConnection], through: "CloudVPNConnection:vpn-c900-aws-euc1"}
        # access point and server to a cloud segment: through the cage, where every cloud leg lands
        # yamllint disable-line rule:line-length
        - {src: "DcimPhysicalDevice:bcn-office-ap-01", dst: "CloudNetworkSegment:c900-subnet-p", via: "DcimPhysicalDevice:par-colo1-edge-01"}
        # yamllint disable-line rule:line-length
        - {src: "DcimPhysicalDevice:lis-office-ap-03", dst: "CloudNetworkSegment:c900-subnet-p", via: "DcimPhysicalDevice:par-colo1-edge-01"}
        # yamllint disable-line rule:line-length
        - {src: "DcimVirtualDevice:ktw1-vm-01", dst: "CloudNetworkSegment:c900-subnet-p", via: "DcimPhysicalDevice:par-colo1-edge-01"}
        # yamllint disable-line rule:line-length
        - {src: "DcimVirtualDevice:gdn1-vm-01", dst: "CloudNetworkSegment:c900-subnet-p", via: "DcimPhysicalDevice:par-colo1-edge-01"}
    layout:
      zone: PAR-COLO1
      colo_edge: par-colo1-edge-01
      fabric_port_device: EXT-FABRIC-PAR
      offices:
        - {office: C900-OFFICE, edges: [bcn-office-edge-01]}
        - {office: C901-OFFICE, edges: [lis-office-edge-01, lis-office-edge-02]}
      # every dark fibre of the DCI mesh with the two facilities it joins (DC - DC, DC - cage, cage - cage)
      dark_fibres:
        DF10001: [DC-KTW1, DC-WAW1]
        DF10002: [DC-KTW1, DC-WAW1]
        DF10003: [DC-KTW1, DC-GDN1]
        DF10004: [DC-KTW1, DC-GDN1]
        DF10005: [DC-WAW1, DC-GDN1]
        DF10006: [DC-WAW1, DC-GDN1]
        DF10007: [DC-KTW1, PAR-COLO1]
        DF10008: [DC-KTW1, PAR-COLO1]
        DF10009: [DC-KTW1, FRA-COLO1]
        DF10010: [DC-KTW1, FRA-COLO1]
        DF10011: [DC-KTW1, AMS-COLO1]
        DF10012: [DC-KTW1, AMS-COLO1]
        DF10013: [DC-WAW1, PAR-COLO1]
        DF10014: [DC-WAW1, PAR-COLO1]
        DF10015: [DC-WAW1, FRA-COLO1]
        DF10016: [DC-WAW1, FRA-COLO1]
        DF10017: [DC-WAW1, AMS-COLO1]
        DF10018: [DC-WAW1, AMS-COLO1]
        DF10019: [DC-GDN1, PAR-COLO1]
        DF10020: [DC-GDN1, PAR-COLO1]
        DF10021: [DC-GDN1, FRA-COLO1]
        DF10022: [DC-GDN1, FRA-COLO1]
        DF10023: [DC-GDN1, AMS-COLO1]
        DF10024: [DC-GDN1, AMS-COLO1]
        DF10025: [PAR-COLO1, FRA-COLO1]
        DF10026: [PAR-COLO1, AMS-COLO1]
        DF10027: [FRA-COLO1, AMS-COLO1]
    # A pair names its ends as `kind:name` (or `kind:hfid`, parts joined by `/`) and is traced by the server
    # (utils/path_trace.py): the plain trace must reach the target in L1 and L3 with a COMPLETE equal-cost set, the
    # reverse direction gives the same chains, and `through` lists each transport the target must also be reached
    # through (a `--via` trace each) with the circuit types on its chains: carriers in l1, session circuits in l3.
    pairs:
      - src: ManagedVxlanSegment:c900-web-p
        dst: CloudNetworkSegment:c900-subnet-p
        golden: full_topology__c900-web-p__c900-subnet-p.txt
        max_paths: 100  # the tenant segment starts on three ports of the pod and crosses both border leaves
        through:
          # the Direct Connect is delivered to the colocation cage: from the DC the path crosses a dark fibre (L1) and
          # the EVPN peering of the DCI (L3: BGP processes and peerings, so no session circuit of type dci on the chain)
          CloudDirectConnect:dx-c900-fra-lag: {l1: [dark_fiber], l3: [handoff]}
          CloudVPNConnection:vpn-c900-aws-euc1: {l3: [vpn]}
        # the kinds of the transport a chain crosses
        far_end_kinds: [CloudDirectConnect, CloudVPNConnection]
        # what a transport holds as its own interfaces: the VIFs (the ports and the LAG are the provider connect's)
        transport_kinds:
          dx-c900-fra-lag: [vif]
          vpn-c900-aws-euc1: [vif]
      # DC -> SaaS over a private cross-connect and a BGP handoff (Webex)
      - src: ManagedVxlanSegment:c900-web-p
        dst: TopologySaasRegion:WEBEX-FRANKFURT
        golden: full_topology__web__saas-webex.txt
        max_paths: 100
        through:
          CloudDirectConnect:webex-c900-fra-xc: {l1: [dark_fiber], l3: [handoff]}
        far_end_kinds: [CloudDirectConnect]
        transport_kinds:
          webex-c900-fra-xc: [vif]
      # DC -> SaaS over a tunnel on the internet carrier, no session (Zscaler): the DC edge is the SD-WAN hub, the
      # office edge holds the tunnel to Zscaler
      - src: ManagedVxlanSegment:c900-web-p
        dst: TopologySaasRegion:ZSCALER-MUNICH I
        # a tunnel is a session circuit: it exists in L3 only (its internet carrier is asserted by `internet` and the
        # tunnel_underlay row), so the physical layer does not reach the SaaS region. In L3 the DC reaches Zscaler
        # through the office edge: tunnel DC edge <-> office edge, then the tunnel office edge <-> Zscaler.
        layers: [l3]
        golden: full_topology__web__saas-zscaler.txt
        through:
          CloudVPNConnection:zscaler-c900-muc: {l3: [tunnel]}
        far_end_kinds: [CloudVPNConnection]
        transport_kinds:
          zscaler-c900-muc: [vif]
      # cloud <-> cloud: the spoke VNet has no gateway of its own, the DC reaches it across `peers` of the hub VNet
      - src: ManagedVxlanSegment:c900-web-p
        dst: CloudNetworkSegment:c900-spoke-p
        golden: full_topology__web__spoke.txt
        max_paths: 100
        through:
          # the Fabric virtual connections start on the Fabric port of the cage, which the edge reaches through the
          # patch panel
          CloudDirectConnect:er-c900-weu: {l1: [dark_fiber, virtual_connection], l3: [handoff]}
        far_end_kinds: [CloudDirectConnect]
      # negative: a segment in a VPC with no attachment is reached by nothing: a complete empty result in both layers
      - src: ManagedVxlanSegment:c900-web-p
        dst: CloudNetworkSegment:c900-isolated-p
        expect_unreachable: true
      # ---- L2: two switches are in one broadcast domain when a chain of segment rows joins them (utils/path_trace.py,
      # the `l2` layer: segment, its realization per DC, the VLAN row per switch). The stretched segment c900-sync-p
      # joins the leaves and the border leaves of the two DCs it is stretched over, with the SAME VLAN id on all of them
      # (vlan_scope shared); the leaves of one DC share two segments, so there are two equal-cost chains; a DC the
      # segment does not reach is in no common domain.
      - src: DcimPhysicalDevice:ktw1-leaf-01
        dst: DcimPhysicalDevice:waw1-leaf-01
        layers: [l2]
        golden: full_topology__l2__ktw1-waw1.txt
      - src: DcimPhysicalDevice:ktw1-leaf-01
        dst: DcimPhysicalDevice:ktw1-leaf-02
        layers: [l2]
        golden: full_topology__l2__ktw1-pair.txt
      - src: DcimPhysicalDevice:ktw1-bl-01
        dst: DcimPhysicalDevice:waw1-bl-01
        layers: [l2]
        golden: full_topology__l2__bl-bl.txt
      - src: DcimPhysicalDevice:ktw1-leaf-01
        dst: DcimPhysicalDevice:gdn1-leaf-01
        layers: [l2]
        expect_unreachable: true
      # ---- the three sites of the sample: the office (its SD-WAN edge), the colocation cage (its edge) and the DC
      # (its tenant segment), and their way to the INTERNET and to the cloud. L1 is cabled and carried, L3 is routed.
      # office <-> DC: L1 through the internet access of both (one ISP router), L3 over the SD-WAN tunnel to the DC edge
      - src: DcimPhysicalDevice:bcn-office-edge-01
        dst: ManagedVxlanSegment:c900-web-p
        golden: full_topology__office__dc.txt
        max_paths: 100
        circuit_types: {l1: [internet], l3: [tunnel]}
      # office <-> colocation: L1 through two ISPs and THE INTERNET, L3 over the tunnel, the DC and the DCI
      - src: DcimPhysicalDevice:bcn-office-edge-01
        dst: DcimPhysicalDevice:par-colo1-edge-01
        golden: full_topology__office__colo.txt
        max_paths: 100
        circuit_types: {l1: [internet], l3: [tunnel]}
      # colocation <-> DC: dark fibre from the cage edge to a border leaf of the DC; in L3 the EVPN peering of the DCI
      - src: DcimPhysicalDevice:par-colo1-edge-01
        dst: ManagedVxlanSegment:c900-web-p
        golden: full_topology__colo__dc.txt
        max_paths: 100
        circuit_types: {l1: [dark_fiber], l3: []}
      # the second office: its first SD-WAN edge reaches the DC like the first office does (L1 through the
      # internet accesses,
      # L3 over its tunnel to the DC edge)
      - src: DcimPhysicalDevice:lis-office-edge-01
        dst: ManagedVxlanSegment:c900-web-p
        golden: full_topology__lis__dc.txt
        max_paths: 100
        circuit_types: {l1: [internet], l3: [tunnel]}
      # the campus below an edge: an access point reaches its edge over the access switch and a distribution switch, L1
      # only (cables; a campus without a fabric generator has no routing here)
      - src: DcimPhysicalDevice:bcn-office-ap-01
        dst: DcimPhysicalDevice:bcn-office-edge-01
        layers: [l1]
        golden: full_topology__bcn__campus.txt
        max_paths: 100
      - src: DcimPhysicalDevice:lis-office-ap-03
        dst: DcimPhysicalDevice:lis-office-edge-02
        layers: [l1]
        golden: full_topology__lis__campus.txt
        max_paths: 100
      # office -> AWS: the shortest L3 chain is the office tunnel to the DC edge and the AWS VPN from there (through the
      # Direct Connect the server finds the cloud's own way, VPN -> transit gateway -> DX gateway, so L3 is traced only
      # through the VPN). L1 reaches the VPC only through the cage: the office access, the internet, the cage access and
      # the cross-connect (the VPN and the tunnels are L3).
      - src: DcimPhysicalDevice:bcn-office-edge-01
        dst: CloudNetworkSegment:c900-subnet-p
        golden: full_topology__office__aws.txt
        max_paths: 100
        through:
          CloudVPNConnection:vpn-c900-aws-euc1: {l3: [tunnel, vpn]}
          CloudDirectConnect:dx-c900-fra-lag: {l1: [internet]}
        far_end_kinds: [CloudDirectConnect, CloudVPNConnection]
      # colocation -> AWS: the cable from the cage edge to the port of the AWS device in the cage, then its LAG and VIFs
      - src: DcimPhysicalDevice:par-colo1-edge-01
        dst: CloudNetworkSegment:c900-subnet-p
        golden: full_topology__colo__aws.txt
        max_paths: 100
        through:
          CloudDirectConnect:dx-c900-fra-lag: {l1: [], l3: [handoff]}
        far_end_kinds: [CloudDirectConnect]
        transport_kinds:
          dx-c900-fra-lag: [vif]
      # colocation -> the ExpressRoute transport: edge Ethernet1/1 -> patch panel -> Fabric port -> virtual connections
      - src: DcimPhysicalDevice:par-colo1-edge-01
        dst: CloudDirectConnect:er-c900-weu
        golden: full_topology__colo__er.txt
        circuit_types: {l1: [virtual_connection], l3: [handoff]}
        transport_kinds:
          er-c900-weu: [vif]
      # the application across the DCs: frontend (DC-KTW1) -> backend (DC-WAW1) -> database (DC-GDN1)
      - src: DcimVirtualDevice:ktw1-vm-01
        dst: DcimVirtualDevice:waw1-vm-01
        layers: [l3]
        golden: full_topology__vm__frontend__backend.txt
        max_paths: 100
        circuit_types: {l3: []}
        through:
          TopologyCarrierCircuit:DF10001: {l1: [dark_fiber]}
        far_end_kinds: [TopologyCarrierCircuit]
      - src: DcimVirtualDevice:waw1-vm-01
        dst: DcimVirtualDevice:gdn1-vm-01
        layers: [l3]
        golden: full_topology__vm__backend__database.txt
        max_paths: 100
        circuit_types: {l3: []}
        through:
          TopologyCarrierCircuit:DF10005: {l1: [dark_fiber]}
        far_end_kinds: [TopologyCarrierCircuit]
      # DC <-> DC between two tenant segments: one dark fibre in L1, the DCI EVPN peering in L3
      - src: ManagedVxlanSegment:c900-db-p
        dst: ManagedVxlanSegment:c900-web-p
        golden: full_topology__gdn1__ktw1.txt
        max_paths: 100
        circuit_types: {l1: [dark_fiber], l3: []}
      # cage <-> cage: one fibre between the two edges; in L3 the `dci` circuit on the two fibre ports is as short as
      # the EVPN peering between the two processes (edge - port - ICX - port - edge), so both are in the equal-cost set
      - src: DcimPhysicalDevice:fra-colo1-edge-01
        dst: DcimPhysicalDevice:ams-colo1-edge-01
        golden: full_topology__fra__ams.txt
        circuit_types: {l1: [dark_fiber], l3: [dci]}
      # cage -> DC: from a transit cage to the tenant segment of a DC
      - src: DcimPhysicalDevice:fra-colo1-edge-01
        dst: ManagedVxlanSegment:c900-db-p
        golden: full_topology__fra__gdn1.txt
        max_paths: 100
        circuit_types: {l1: [dark_fiber], l3: []}
