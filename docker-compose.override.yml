---
name: infrahub

services:
  database:
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_dbms_memory_transaction_total_max=8g
      - NEO4J_dbms_memory_heap_initial__size=2g
      - NEO4J_dbms_memory_heap_max__size=4g
      - NEO4J_dbms_memory_pagecache_size=4g

  infrahub-server:
    ports:
      - "${INFRAHUB_PORT:-8000}:8000"
    environment:
      # redis-py 8 (Infrahub 1.11.10+) caps a pool at 100 connections and raises MaxConnectionsError instead of
      # waiting, which a burst of generator runs exhausts (redis/redis-py#4458).
      INFRAHUB_CACHE_URL: "redis://cache:6379/0?max_connections=10000"
      # Queries wait above this many in flight per process instead of all hitting Neo4j at once (default 0: no cap).
      INFRAHUB_DB_MAX_CONCURRENT_QUERIES: "16"

  task-manager:
    ports:
      - "${PREFECT_PORT:-4200}:4200"

  task-worker:
    volumes:
      - ./:/upstream
    environment:
      INFRAHUB_CACHE_URL: "redis://cache:6379/0?max_connections=10000"
      INFRAHUB_DB_MAX_CONCURRENT_QUERIES: "16"

volumes:
  database_data:
  database_logs:
  storage_data:
