# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/menu/latest.json
---
apiVersion: infrahub.app/v1
kind: Menu
spec:
  data:
    # ===================== ORGANIZATION =====================
    - namespace: Organization
      name: MainMenu
      label: Organization
      icon: "mdi:domain"
      kind: OrganizationGeneric
      children:
        data:
          - namespace: Organization
            name: Manufacturer
            label: Manufacturers
            kind: OrganizationManufacturer
            icon: "mdi:factory"

          - namespace: Organization
            name: Provider
            label: Providers
            kind: OrganizationProvider
            icon: "mdi:cloud-outline"

          - namespace: Organization
            name: Customer
            label: Customers
            kind: OrganizationCustomer
            icon: "mdi:account-group"
    # ===================== LOCATION =====================
    - namespace: Location
      name: Generic
      label: Location
      kind: LocationGeneric
      icon: "mdi:map-marker"
    # ──────────────────────────────────────────────────────────────────────────
    # TOPOLOGY — deployments and network designs
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Topology
      name: TopologyMenu
      label: Topology
      icon: "mdi:graph"
      kind: TopologyDeployment

    # ──────────────────────────────────────────────────────────────────────────
    # CUSTOMER DEPLOYMENTS — customer footprints inside DC/Colo/Cloud topology
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Topology
      name: CustomerMenu
      label: Customer Deployments
      icon: "mdi:account-cog-outline"
      kind: TopologyCustomer

    # ──────────────────────────────────────────────────────────────────────────
    # DESIGN — fabric and pod layout blueprints
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Topology
      name: DesignMenu
      label: Design
      icon: "mdi:pencil-ruler"
      children:
        data:
          - namespace: Topology
            name: DesignElementItem
            label: Network Elements
            kind: TopologyElement
            icon: "mdi:view-grid-outline"

          - namespace: Topology
            name: DesignCustomerTemplateMenu
            label: Customer Templates
            icon: "mdi:account-network"
            children:
              data:
                - namespace: Topology
                  name: DesignCustomerTemplateDCItem
                  label: Data Center
                  kind: TopologyCustomerTemplateDC
                  icon: "mdi:floor-plan"

          - namespace: Topology
            name: DesignFabricTemplateMenu
            label: Fabric Templates
            icon: "mdi:server-network"
            children:
              data:
                - namespace: Topology
                  name: DesignFabricTemplateDCItem
                  label: Data Center
                  kind: TopologyTemplateDC
                  icon: "mdi:floor-plan"

                - namespace: Topology
                  name: DesignFabricTemplatePodItem
                  label: Pod
                  kind: TopologyTemplatePod
                  icon: "mdi:view-grid-outline"

                - namespace: Topology
                  name: DesignFabricTemplateColocationMetroItem
                  label: Colocation Metro
                  kind: TopologyTemplateColocationMetro
                  icon: "mdi:city-variant-outline"

                - namespace: Topology
                  name: DesignFabricTemplateColocationZoneItem
                  label: Colocation Zone
                  kind: TopologyTemplateColocationZone
                  icon: "mdi:server-network"

    # ──────────────────────────────────────────────────────────────────────────
    # INVENTORY — physical devices and hardware
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Inventory
      name: MainMenu
      label: Inventory
      icon: "mdi:warehouse"
      children:
        data:
          # --------- Device Inventory ---------
          - namespace: Dcim
            name: InventoryMenu
            label: Device Inventory
            icon: "mdi:server-plus"
            description: "Hardware devices, interfaces, and modules"
            children:
              data:
                - namespace: Dcim
                  name: Device
                  label: Devices
                  kind: DcimDevice
                  icon: "mdi:server"
                  description: "All physical and virtual devices"

                - name: Interface
                  namespace: Dcim
                  label: Interfaces
                  icon: "mdi:ethernet"
                  kind: DcimInterface
                  description: "Network and management interfaces"

                - name: Cables
                  namespace: Dcim
                  label: Cabling & Connections
                  icon: "mdi:cable-data"
                  kind: DcimCable
                  description: "Cabling between devices"

                - name: PatchPanel
                  namespace: Dcim
                  label: Patch Panels
                  icon: "mdi:ethernet"
                  kind: DcimPatchPanel
                  description: "Passive patch panels and their front and rear ports"

                - name: Mlag
                  namespace: Managed
                  label: MLAG
                  icon: "mdi:link-variant"
                  kind: ManagedMLAG
                  description: "Multi-chassis link aggregation groups"

                - name: HA
                  namespace: Managed
                  label: HA Domains
                  icon: "mdi:heart-pulse"
                  kind: ManagedHA
                  description: "High availability domains (firewall, proxy, load balancer, cloud)"

                - name: Controller
                  namespace: Managed
                  label: Controllers
                  icon: "mdi:remote-desktop"
                  kind: ManagedController
                  description: "Management/orchestration controllers (WLC, ACI APIC, DNA Center, security/LB managers, etc.)"  # yamllint disable-line rule:line-length
          # --------- Device Catalog ---------
          - namespace: Dcim
            name: CatalogMenu
            label: Device Catalog
            icon: "mdi:package-variant-closed"
            description: "Device types and platform definitions"
            children:
              data:
                - namespace: Dcim
                  name: DeviceType
                  label: Device Types
                  kind: DcimDeviceType
                  icon: "mdi:package-variant"
                  description: "Device model definitions and specifications"

                - namespace: Dcim
                  name: Platform
                  label: Platforms
                  kind: DcimPlatform
                  icon: "mdi:chip"
                  description: "Operating system and firmware platforms"

                - namespace: Dcim
                  name: SoftwareImage
                  label: Software Images
                  kind: DcimSoftwareImage
                  icon: "mdi:package-variant"
                  description: "Versioned OS and firmware images"

                - namespace: Dcim
                  name: GroupPolicyProfile
                  label: Group Policy Profiles
                  kind: DcimGroupPolicyProfile
                  icon: "mdi:shield-half-full"
                  description: "Reference fabric profile per platform: device types, release, memory, group-tag pool"
          # ── Circuits ───────────────────────────────────────────────────────
          - namespace: Topology
            name: CircuitsMenu
            label: Circuits
            icon: "mdi:transit-connection-variant"
            children:
              data:
                - namespace: Topology
                  name: CarrierCircuitItem
                  label: Carrier Circuits
                  kind: TopologyCarrierCircuit
                  icon: "mdi:cable-data"

                - namespace: Topology
                  name: SessionCircuitItem
                  label: Session Circuits
                  kind: TopologySessionCircuit
                  icon: "mdi:cloud-sync"
                  description: "DCI, handoff and tunnel circuits: the connections routing is generated on"

          # --------- Cloud Inventory ---------
          - namespace: Cloud
            name: Resource
            label: Public Cloud Resources
            kind: CloudResource
            icon: "mdi:cloud"
            description: "All public cloud resources"

    # ──────────────────────────────────────────────────────────────────────────
    # ROUTING — peerings, protocol configs, static routes
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Managed
      name: RoutingMenu
      label: Routing
      icon: "mdi:router-network"
      children:
        data:

          # ── All Peerings (generic view) ────────────────────────────────────
          - namespace: Managed
            name: AllPeeringsItem
            label: All Peerings
            kind: ManagedPeering
            icon: "mdi:transit-connection-horizontal"

          # ── VRF instances (one per topology and namespace, with their member devices) ──
          - namespace: Managed
            name: VrfItem
            label: VRF Instances
            kind: ManagedVRF
            icon: "mdi:routes"

          # ── BGP ────────────────────────────────────────────────────────────
          - namespace: Managed
            name: BgpMenu
            label: BGP
            icon: "mdi:transit-connection"
            children:
              data:
                - namespace: Managed
                  name: BgpPeeringItem
                  label: BGP Peerings
                  kind: ManagedBGPPeering
                  icon: "mdi:transit-connection"

                - namespace: Routing
                  name: IpAsnItem
                  label: Autonomous Systems
                  kind: RoutingAutonomousSystem
                  icon: "mdi:numeric"


          # ── OSPF ───────────────────────────────────────────────────────────
          - namespace: Managed
            name: OspfMenu
            label: OSPF
            icon: "mdi:transit-connection-variant"
            children:
              data:
                - namespace: Managed
                  name: OspfPeeringItem
                  label: OSPF Peerings
                  kind: ManagedOSPFPeering
                  icon: "mdi:transit-connection-variant"

                - namespace: Routing
                  name: OspfAreaItem
                  label: OSPF Areas
                  kind: RoutingOSPFArea
                  icon: "mdi:hexagon-outline"

    # ──────────────────────────────────────────────────────────────────────────
    # SERVICES — network services organised by function
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Managed
      name: ServicesMenu
      label: Services
      icon: "mdi:cog-transfer"
      children:
        data:
          # ── Network Segments ───────────────────────────────────────────────
          - namespace: Platform
            name: SegmentsItem
            label: Network Segments
            kind: ManagedNetworkSegment
            icon: "mdi:layers-triple"

          # ── Traffic Management ─────────────────────────────────────────────
          - namespace: Managed
            name: TrafficManagementMenu
            label: Traffic Management
            icon: "mdi:transit-connection-variant"
            children:
              data:
                - namespace: Platform
                  name: LoadBalancerItem
                  label: Load Balancers
                  kind: ManagedLoadBalancer
                  icon: "mdi:scale-balance"

    # ──────────────────────────────────────────────────────────────────────────
    # SECURITY — zones, profiles, policies
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Security
      name: SecurityMenu
      label: Security
      icon: "mdi:shield-lock"
      children:
        data:
          - namespace: Security
            name: SecurityZoneItem
            label: Security Zones
            kind: SecurityZone
            icon: "mdi:shield-half-full"

          - namespace: Security
            name: SecurityProfileItem
            label: Security Profiles
            kind: SecuritySecurityProfile
            icon: "mdi:shield-account"

          - namespace: Security
            name: SecurityPolicyItem
            label: Security Policies
            kind: SecurityPolicy
            icon: "mdi:shield-check"

          - namespace: Security
            name: SecurityPolicyRuleItem
            label: Security Policy Rules
            kind: SecurityPolicyRule
            icon: "mdi:file-document-edit-outline"

          - namespace: Security
            name: SecurityTagItem
            label: Security Tags
            kind: SecurityTag
            icon: "mdi:tag-outline"

          - namespace: Proxy
            name: ProxyURLCategoryItem
            label: URL Categories
            kind: ProxyURLCategory
            icon: "mdi:web"

          - namespace: Proxy
            name: ProxyPolicyItem
            label: Proxy Policies
            kind: ProxyPolicy
            icon: "mdi:shield-key-outline"


    # ──────────────────────────────────────────────────────────────────────────
    # APPLICATIONS — business applications and virtual clouds
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: App
      name: ApplicationsMenu
      label: Applications
      kind: AppApplication
      icon: "mdi:application"
