# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/menu/latest.json
---
apiVersion: infrahub.app/v1
kind: Menu
spec:
  data:
    # ===================== ORGANIZATION =====================
    - namespace: Organization
      name: MainMenu
      label: Organization
      icon: "mdi:domain"
      kind: OrganizationGeneric
      children:
        data:
          - namespace: Organization
            name: Manufacturer
            label: Manufacturers
            kind: OrganizationManufacturer
            icon: "mdi:factory"

          - namespace: Organization
            name: Provider
            label: Providers
            kind: OrganizationProvider
            icon: "mdi:cloud-outline"

          - namespace: Organization
            name: Customer
            label: Customers
            kind: OrganizationCustomer
            icon: "mdi:account-group"

    # ===================== LOCATION =====================
    - namespace: Location
      name: Generic
      label: Location
      kind: LocationGeneric
      icon: "mdi:map-marker"

    # ──────────────────────────────────────────────────────────────────────────
    # DESIGN — fabric and pod layout blueprints
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Topology
      name: DesignMenu
      label: Design
      icon: "mdi:pencil-ruler"
      children:
        data:
          - namespace: Topology
            name: DesignElementItem
            label: Network Elements
            kind: TopologyElement
            icon: "mdi:view-grid-outline"

          - namespace: Topology
            name: DesignCustomerTemplateMenu
            label: Customer Templates
            icon: "mdi:account-network"
            children:
              data:
                - namespace: Topology
                  name: DesignCustomerTemplateDCItem
                  label: Data Center
                  kind: TopologyCustomerTemplateDC
                  icon: "mdi:floor-plan"

                - namespace: Topology
                  name: DesignCustomerTemplateColocationItem
                  label: Colocation
                  kind: TopologyCustomerTemplateColo
                  icon: "mdi:server-network"

                - namespace: Topology
                  name: DesignCustomerTemplateCloudItem
                  label: Cloud
                  kind: TopologyCustomerTemplateCloud
                  icon: "mdi:cloud-outline"

          - namespace: Topology
            name: DesignFabricTemplateMenu
            label: Fabric Templates
            icon: "mdi:server-network"
            children:
              data:
                - namespace: Topology
                  name: DesignFabricTemplateDCItem
                  label: Data Center
                  kind: TopologyTemplateDC
                  icon: "mdi:floor-plan"

                - namespace: Topology
                  name: DesignFabricTemplatePodItem
                  label: Pod
                  kind: TopologyTemplatePod
                  icon: "mdi:view-grid-outline"

                - namespace: Topology
                  name: DesignFabricTemplateColocationMetroItem
                  label: Colocation Metro
                  kind: TopologyTemplateColocationMetro
                  icon: "mdi:city-variant-outline"

                - namespace: Topology
                  name: DesignFabricTemplateColocationZoneItem
                  label: Colocation Zone
                  kind: TopologyTemplateColocationZone
                  icon: "mdi:server-network"

    # ──────────────────────────────────────────────────────────────────────────
    # TOPOLOGY — deployments and network designs
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Topology
      name: TopologyMenu
      label: Topology
      icon: "mdi:graph"
      kind: TopologyDeployment

    # ──────────────────────────────────────────────────────────────────────────
    # CUSTOMER DEPLOYMENTS — customer footprints inside DC/Colo/Cloud topology
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Topology
      name: CustomerMenu
      label: Customer Deployments
      icon: "mdi:account-cog-outline"
      kind: TopologyCustomer

    # ──────────────────────────────────────────────────────────────────────────
    # APPLICATIONS — business applications and virtual clouds
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: App
      name: ApplicationsMenu
      label: Applications
      kind: AppApplication
      icon: "mdi:application"

    # ──────────────────────────────────────────────────────────────────────────
    # SERVICES — network services organised by function
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Managed
      name: NetworkServicesMenu
      label: Network Services
      icon: "mdi:cog-transfer"
      children:
        data:
          # ── Overlay: the tenant segments ────────────────────────────────────
          - namespace: Managed
            name: SegmentsItem
            label: Network Segments
            kind: ManagedNetworkSegment
            icon: "mdi:layers-triple"

          # ── Firewalls: a context per tenant namespace on a firewall pair ───
          - namespace: Managed
            name: FirewallContextItem
            label: Firewall Contexts
            kind: ManagedFirewallContext
            icon: "mdi:wall-fire"

          # ── Load balancing ─────────────────────────────────────────────────
          - namespace: Managed
            name: LoadBalancingMenu
            label: Load Balancing
            icon: "mdi:scale-balance"
            children:
              data:
                - namespace: Managed
                  name: LoadBalancerItem
                  label: Load Balancers
                  kind: ManagedLoadBalancer
                  icon: "mdi:scale-balance"

                - namespace: Loadbalancer
                  name: VipItem
                  label: Virtual IPs
                  kind: LoadbalancerVIP
                  icon: "mdi:ip-network"

                - namespace: Loadbalancer
                  name: HealthCheckItem
                  label: Health Checks
                  kind: LoadbalancerHealthCheck
                  icon: "mdi:stethoscope"

          # ── High availability: pairs and multi-chassis bonds ───────────────
          - namespace: Managed
            name: HighAvailabilityMenu
            label: High Availability
            icon: "mdi:heart-pulse"
            children:
              data:
                - namespace: Managed
                  name: HA
                  label: HA Domains
                  icon: "mdi:heart-pulse"
                  kind: ManagedHA
                  description: "High availability domains (firewall, load balancer, cloud)"

                - namespace: Managed
                  name: Mlag
                  label: MLAG Domains
                  icon: "mdi:link-variant"
                  kind: ManagedMLAG
                  description: "Multi-chassis link aggregation groups"

          # ── Cloud & SaaS connectivity: what the provider sells and where it ends ──
          - namespace: Cloud
            name: CloudConnectivityMenu
            label: Cloud & SaaS Connectivity
            icon: "mdi:cloud-sync-outline"
            children:
              data:
                - namespace: Cloud
                  name: CsDirectConnectItem
                  label: Cloud Transports (port / circuit)
                  kind: CloudDirectConnect
                  icon: "mdi:lan-connect"
                  description: "Direct Connect, ExpressRoute, Interconnect, SaaS cross-connects"

                - namespace: Topology
                  name: ProviderConnectItem
                  label: Provider Connects
                  kind: TopologyProviderConnect
                  icon: "mdi:server-network"
                  description: "The provider's own ports at a place: Fabric, Direct Connect, ExpressRoute, public sides"

                - namespace: Cloud
                  name: CsVPNConnectionItem
                  label: Cloud VPN Connections
                  kind: CloudVPNConnection
                  icon: "mdi:vpn"
                  description: "The encrypted way to a cloud or SaaS: the tunnels"

                - namespace: Cloud
                  name: CsPeeringInterfaceItem
                  label: Cloud Peering Interfaces
                  kind: CloudPeeringInterface
                  icon: "mdi:ethernet"
                  description: "The L3/BGP termination of one leg: VLAN or tunnel, provider address and AS"

    # ──────────────────────────────────────────────────────────────────────────
    # ROUTING — peerings, protocol configs, static routes
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Managed
      name: RoutingMenu
      label: Routing
      icon: "mdi:router-network"
      children:
        data:

          # ── All Peerings (generic view) ────────────────────────────────────
          - namespace: Managed
            name: AllPeeringsItem
            label: All Peerings
            kind: ManagedPeering
            icon: "mdi:transit-connection-horizontal"

          # ── VRF instances (one per topology and namespace, with their member devices) ──
          - namespace: Managed
            name: VrfItem
            label: VRF Instances
            kind: ManagedVRF
            icon: "mdi:routes"

          # ── BGP ────────────────────────────────────────────────────────────
          - namespace: Managed
            name: BgpMenu
            label: BGP
            icon: "mdi:transit-connection"
            children:
              data:
                - namespace: Managed
                  name: BgpPeeringItem
                  label: BGP Peerings
                  kind: ManagedBGPPeering
                  icon: "mdi:transit-connection"

                - namespace: Routing
                  name: IpAsnItem
                  label: Autonomous Systems
                  kind: RoutingAutonomousSystem
                  icon: "mdi:numeric"


          # ── Routing policy: what a session accepts and announces ────────────
          - namespace: Routing
            name: PolicyMenu
            label: Routing Policy
            icon: "mdi:routes"
            children:
              data:
                - namespace: Routing
                  name: PolicyItem
                  label: Policies
                  kind: RoutingPolicy
                  icon: "mdi:routes"
                  description: "Ordered terms applied to a BGP session, inside the guard derived from the model"

                - namespace: Routing
                  name: PrefixListItem
                  label: Prefix Lists
                  kind: RoutingPrefixList
                  icon: "mdi:file-document-edit-outline"

                - namespace: Routing
                  name: CommunityListItem
                  label: Community Lists
                  kind: RoutingCommunityList
                  icon: "mdi:tag-outline"

          # ── OSPF ───────────────────────────────────────────────────────────
          - namespace: Managed
            name: OspfMenu
            label: OSPF
            icon: "mdi:transit-connection-variant"
            children:
              data:
                - namespace: Managed
                  name: OspfPeeringItem
                  label: OSPF Peerings
                  kind: ManagedOSPFPeering
                  icon: "mdi:transit-connection-variant"

                - namespace: Routing
                  name: OspfAreaItem
                  label: OSPF Areas
                  kind: RoutingOSPFArea
                  icon: "mdi:hexagon-outline"

    # ──────────────────────────────────────────────────────────────────────────
    # SECURITY — zones, profiles, policies
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Security
      name: SecurityMenu
      label: Security
      icon: "mdi:shield-lock"
      children:
        data:
          - namespace: Security
            name: SecurityZoneItem
            label: Security Zones
            kind: SecurityZone
            icon: "mdi:shield-half-full"

          - namespace: Security
            name: SecurityProfileItem
            label: Security Profiles
            kind: SecuritySecurityProfile
            icon: "mdi:shield-account"

          - namespace: Security
            name: SecurityPolicyItem
            label: Security Policies
            kind: SecurityPolicy
            icon: "mdi:shield-check"

          - namespace: Security
            name: SecurityPolicyRuleItem
            label: Security Policy Rules
            kind: SecurityPolicyRule
            icon: "mdi:file-document-edit-outline"

          - namespace: Security
            name: SecurityTagItem
            label: Security Tags
            kind: SecurityTag
            icon: "mdi:tag-outline"

          - namespace: Proxy
            name: ProxyPolicyItem
            label: Proxy Policies
            kind: ProxyPolicy
            icon: "mdi:shield-key-outline"

    # ===================== CHANGE =====================
    - namespace: Change
      name: RequestMenu
      label: Change Requests
      kind: ChangeRequest
      icon: "mdi:file-document-outline"
      description: "The change request of each Proposed Change (risk, plans, window)"

    # ──────────────────────────────────────────────────────────────────────────
    # INVENTORY — physical devices and hardware
    # ──────────────────────────────────────────────────────────────────────────
    - namespace: Inventory
      name: MainMenu
      label: Inventory
      icon: "mdi:warehouse"
      children:
        data:
          # --------- Device Inventory ---------
          - namespace: Dcim
            name: InventoryMenu
            label: Device Inventory
            icon: "mdi:server-plus"
            description: "Hardware devices, interfaces, and modules"
            children:
              data:
                - namespace: Dcim
                  name: Device
                  label: Devices
                  kind: DcimDeviceManaged
                  icon: "mdi:server"
                  description: "All physical and virtual devices"

                - name: Interface
                  namespace: Dcim
                  label: Interfaces
                  icon: "mdi:ethernet"
                  kind: DcimInterface
                  description: "Network and management interfaces"

                - name: Cables
                  namespace: Dcim
                  label: Cabling & Connections
                  icon: "mdi:cable-data"
                  kind: DcimCable
                  description: "Cabling between devices"

                - name: PatchPanel
                  namespace: Dcim
                  label: Patch Panels
                  icon: "mdi:ethernet"
                  kind: DcimPatchPanel
                  description: "Passive patch panels and their front and rear ports"

                - name: Controller
                  namespace: Managed
                  label: Controllers
                  icon: "mdi:remote-desktop"
                  kind: ManagedController
                  description: "Management/orchestration controllers (WLC, ACI APIC, DNA Center, security/LB managers, etc.)"  # yamllint disable-line rule:line-length

          # ── Clusters: hypervisor and Kubernetes clusters, their SDN and virtual switches ──
          - namespace: Managed
            name: ClustersMenu
            label: Clusters
            icon: "mdi:server-network"
            description: "Hypervisor and Kubernetes clusters, their SDN (NSX, CNI) and virtual switches"
            children:
              data:
                - namespace: Managed
                  name: ClusterItem
                  label: Clusters
                  kind: ManagedCluster
                  icon: "mdi:server-network"
                  description: "On-prem and provider hypervisor clusters, on-prem and managed Kubernetes"

                - namespace: Managed
                  name: ClusterSdnItem
                  label: Cluster SDNs
                  kind: ManagedClusterSdn
                  icon: "mdi:lan-connect"
                  description: "The software network layer of a cluster (NSX or a CNI): ranges and gateway nodes"

                - namespace: Managed
                  name: VirtualSwitchItem
                  label: Virtual Switches
                  kind: ManagedVirtualSwitch
                  icon: "mdi:switch"
                  description: "The L2 element between the VM NICs and the host ports"

                - namespace: Managed
                  name: PortGroupItem
                  label: Port Groups
                  kind: ManagedPortGroup
                  icon: "mdi:lan"
                  description: "A VLAN of a virtual switch and the fabric segment it is"

          # ── Circuits ───────────────────────────────────────────────────────
          - namespace: Topology
            name: CircuitsMenu
            label: Circuits
            icon: "mdi:transit-connection-variant"
            children:
              data:
                - namespace: Topology
                  name: CarrierCircuitItem
                  label: Carrier Circuits
                  kind: TopologyCarrierCircuit
                  icon: "mdi:cable-data"

                - namespace: Topology
                  name: SessionCircuitItem
                  label: Session Circuits
                  kind: TopologySessionCircuit
                  icon: "mdi:cloud-sync"
                  description: "DCI, handoff and tunnel circuits: the connections routing is generated on"

          # ── Cloud & SaaS inventory: gateways, attachments, route tables, endpoints, IPsec ──
          - namespace: Cloud
            name: CloudInventoryMenu
            label: Cloud & SaaS Inventory
            icon: "mdi:router-network"
            children:
              data:
                - namespace: Cloud
                  name: CsGatewayItem
                  label: Cloud Gateways
                  kind: CloudGateway
                  icon: "mdi:router-network"
                  description: "Hub, edge and customer gateways of a provider"

                - namespace: Cloud
                  name: CsGatewayAttachmentItem
                  label: Cloud Gateway Attachments
                  kind: CloudGatewayAttachment
                  icon: "mdi:transit-connection-variant"
                  description: "A gateway attached to a network or another gateway, with its allowed prefixes"

                - namespace: Cloud
                  name: CsGatewayRouteTableItem
                  label: Cloud Gateway Route Tables
                  kind: CloudGatewayRouteTable
                  icon: "mdi:routes"

                - namespace: Cloud
                  name: CsServiceEndpointItem
                  label: Cloud Service Endpoints
                  kind: CloudServiceEndpoint
                  icon: "mdi:cloud-lock-outline"

                - namespace: Security
                  name: CsIPsecProfileItem
                  label: IPsec Profiles
                  kind: SecurityIPsecProfile
                  icon: "mdi:shield-key-outline"

          # --------- Cloud Inventory ---------
          - namespace: Cloud
            name: Resource
            label: Public Cloud Resources
            kind: CloudResource
            icon: "mdi:cloud"
            description: "All public cloud resources"

          # --------- Device Catalog ---------
          - namespace: Dcim
            name: CatalogMenu
            label: Device Catalog
            icon: "mdi:package-variant-closed"
            description: "Device types and platform definitions"
            children:
              data:
                - namespace: Dcim
                  name: DeviceType
                  label: Device Types
                  kind: DcimDeviceType
                  icon: "mdi:package-variant"
                  description: "Device model definitions and specifications"

                - namespace: Dcim
                  name: Platform
                  label: Platforms
                  kind: DcimPlatform
                  icon: "mdi:chip"
                  description: "Operating system and firmware platforms"

                - namespace: Dcim
                  name: SoftwareImage
                  label: Software Images
                  kind: DcimSoftwareImage
                  icon: "mdi:package-variant"
                  description: "Versioned OS and firmware images"

                - namespace: Dcim
                  name: GroupPolicyProfile
                  label: Group Policy Profiles
                  kind: DcimGroupPolicyProfile
                  icon: "mdi:shield-half-full"
                  description: "Reference fabric profile per platform: device types, release, memory, group-tag pool"
