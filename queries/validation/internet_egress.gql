query internet_egress {
  SecurityPolicyRule {
    edges {
      node {
        id
        name {
          value
        }
        disabled {
          value
        }
        policy {
          node {
            id
            name {
              value
            }
            enabled {
              value
            }
          }
        }
        source_segment {
          node {
            id
            name {
              value
            }
            ip_version {
              value
            }
          }
        }
        destination_zone {
          node {
            id
            name {
              value
            }
          }
        }
      }
    }
  }
  TopologyCustomerDC {
    edges {
      node {
        id
        name {
          value
        }
        environment {
          value
        }
        parent {
          node {
            id
            name {
              value
            }
          }
        }
        network_segments {
          edges {
            node {
              id
              name {
                value
              }
            }
          }
        }
        serving_firewall_contexts {
          edges {
            node {
              ...InternetEgressContext
            }
          }
        }
      }
    }
  }
  TopologyCustomerColocation {
    edges {
      node {
        id
        name {
          value
        }
        environment {
          value
        }
        parent {
          node {
            id
            name {
              value
            }
          }
        }
        network_segments {
          edges {
            node {
              id
              name {
                value
              }
            }
          }
        }
        serving_firewall_contexts {
          edges {
            node {
              ...InternetEgressContext
            }
          }
        }
      }
    }
  }
  TopologyRoutedExchange {
    edges {
      node {
        id
        name {
          value
        }
        gateway {
          node {
            id
            name {
              value
            }
          }
        }
        vrf_a {
          node {
            ...RoutingVrfFields
          }
        }
        vrf_z {
          node {
            ...RoutingVrfFields
          }
        }
      }
    }
  }
  TopologyColocationZone {
    edges {
      node {
        id
        name {
          value
        }
        parent {
          node {
            id
            name {
              value
            }
          }
        }
        devices(role__value: "internal-firewall") {
          edges {
            node {
              id
              __typename
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  TopologyVirtualColocation {
    edges {
      node {
        id
        name {
          value
        }
        parent {
          node {
            id
            name {
              value
            }
          }
        }
        appliances {
          edges {
            node {
              id
              name {
                value
              }
              capabilities {
                edges {
                  node {
                    id
                    __typename
                    ... on ManagedFirewallHA {
                      name {
                        value
                      }
                      capabilities {
                        edges {
                          node {
                            id
                            __typename
                            name {
                              value
                            }
                            ... on DcimDeviceManaged {
                              role {
                                value
                              }
                              status {
                                value
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
