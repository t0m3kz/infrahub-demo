query segment_placement {
  ManagedVlanSegment {
    edges {
      node {
        id
        name { value }
        # An exchange-zone VLAN segment may sit on a TopologyCustomerDC; a tenant one may not.
        security_zone { node { name { value } } }
        # environment/owner: the segment agrees with the footprint it names (environment ERROR, owner WARNING).
        environment { value }
        owner { node { id org_id { value } } }
        terminate_inline { value }
        inline_service { node { id __typename name { value } } }
        customer_deployment {
          node {
            id
            __typename
            name { value }
            ... on TopologyEnvironmentScoped { environment { value } }
            ... on TopologyCustomer { owner { node { id __typename org_id { value } } } }
          }
        }
      }
    }
  }

  ManagedVxlanSegment {
    edges {
      node {
        id
        name { value }
        security_zone { node { name { value } } }
        environment { value }
        owner { node { id org_id { value } } }
        stretch_scope { value }
        terminate_inline { value }
        inline_service { node { id __typename name { value } } }
        customer_deployments {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyEnvironmentScoped { environment { value } }
              ... on TopologyCustomer { owner { node { id __typename org_id { value } } } }
              ... on TopologyCustomerOffice { owner { node { id __typename org_id { value } } } }
              ... on TopologyCustomerDC {
                parent { node { id __typename name { value } } }
              }
              ... on TopologyCustomerColocation {
                parent { node { id __typename name { value } } }
              }
              ... on TopologyCustomerCloud {
                parent { node { id __typename name { value } } }
              }
            }
          }
        }
        segment_deployments {
          edges {
            node {
              id
              vni { value }
              deployment {
                node {
                  id
                  __typename
                  name { value }
                }
              }
            }
          }
        }
      }
    }
  }

  CloudNetworkSegment {
    edges {
      node {
        id
        name { value }
        customer_deployment {
          node {
            id
            __typename
            name { value }
          }
        }
      }
    }
  }
}
