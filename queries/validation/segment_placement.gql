query segment_placement {
  ManagedVxlanSegment {
    edges {
      node {
        id
        name { value }
        # An exchange-zone segment may sit on a TopologyCustomerDC; a tenant one may not.
        security_zone { node { ...RoutingZoneFields } }
        # environment/owner: the segment agrees with the footprint it names (environment ERROR, owner WARNING).
        environment { value }
        owner { node { id org_id { value } } }
        stretch_scope { value }
        # firewall_gateway: the firewall pair of the one DC footprint owns the gateway (a floating VIP inside the segment
        # prefix); the footprint's serving_firewall_contexts below say which.
        gateway { node { address { value } ip_prefix { node { prefix { value } } } } }
        firewall_gateway { value }
        customer_deployments {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyEnvironmentScoped { environment { value } }
              ... on TopologyCustomer { owner { node { id __typename org_id { value } } } }
              ... on TopologyCustomerOffice { owner { node { id __typename org_id { value } } } }
              ... on TopologyCustomerDC {
                parent { node { id __typename name { value } } }
                serving_firewall_contexts {
                  edges { node { id name { value } shared_devices { edges { node { ... on DcimDeviceManaged { role { value } } } } } } }
                }
              }
              ... on TopologyCustomerColocation {
                parent { node { id __typename name { value } } }
              }
              ... on TopologyCustomerCloud {
                parent { node { id __typename name { value } } }
              }
            }
          }
        }
        segment_deployments {
          edges {
            node {
              id
              vni { value }
              deployment {
                node {
                  id
                  __typename
                  name { value }
                }
              }
            }
          }
        }
      }
    }
  }

  CloudNetworkSegment {
    edges {
      node {
        id
        name { value }
        customer_deployment {
          node {
            id
            __typename
            name { value }
          }
        }
      }
    }
  }
}
