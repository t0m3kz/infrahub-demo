query evpn_fabric {
  TopologyDataCenter {
    edges {
      node {
        id
        name {
          value
        }
        routing_strategy {
          value
        }
        evpn_rt_as {
          node {
            asn {
              value
            }
          }
        }
      }
    }
  }
  TopologyColocationMetro {
    edges {
      node {
        id
        name {
          value
        }
        evpn_rt_as {
          node {
            asn {
              value
            }
          }
        }
      }
    }
  }
  ManagedVxlanSegment {
    edges {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        id
        name {
          value
        }
        stretch_scope {
          value
        }
        gateway {
          node {
            ip_prefix {
              node {
                ip_namespace {
                  node {
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        segment_deployments {
          edges {
            node {
              id
              vni {
                value
              }
              deployment {
                node {
                  id
                  __typename
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  SecurityZone {
    edges {
      node {
        id
        name {
          value
        }
        l3_vni {
          value
        }
      }
    }
  }
  DcimDevice: DcimDeviceManaged {
    edges {
      node {
        id
        name {
          value
        }
        role {
          value
        }
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...EvpnRtAsOnDeploymentFields
            }
          }
        }
        ... on DcimDeviceManaged {
          shared_capabilities {
            edges {
              node {
                __typename
                ... on ManagedVRF {
                  security_zone {
                    node {
                      ...RoutingZoneFields
                    }
                  }
                }
              }
            }
          }
          capabilities {
            edges {
              node {
                __typename
                ... on ManagedBGP {
                  name {
                    value
                  }
                  process_role {
                    value
                  }
                  router_id {
                    node {
                      address {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        ...ServiceBorderPortsFields
        ... on DcimDevice {
          interfaces {
            edges {
              node {
                ...InterfaceRoutingZoneFields
                __typename
                id
                role {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
