# validate_customer_quota (checks/customer_quota.py): what each DC customer
# footprint with a design uses, against the numbers its design carries.
#   - TopologyCustomerDC: the design's quota (max_segments, ports_<speed>g) and
#     the DC the footprint hangs off (a port counts for a footprint only in its DC).
#   - ManagedVxlanSegment: the footprints each names.
#   - DcimPhysicalInterface / DcimLAGInterface with a `segments` edge: the switch ports tagged with a segment (the edge
#     is one-sided, read from the port; the check joins them to the segments by id). A port's speed is its
#     interface_type; a port-channel carries its member ports' speeds. role tells the host-facing ports from the
#     border-leaf firewall/load-balancer ports (where a segment terminated on a firewall context is tagged).
#     The device's deployment (a pod, a colocation zone) is how the port is placed
#     in a DC. security_zone: an exchange-zone segment is a shared service. QuotaPortFields is spread once at node
#     level: a named fragment spread directly inside an inline fragment resolves to nulls on a live Infrahub
#     (queries/fragments/group_policy.gql).
query customer_quota {
  TopologyCustomerDC {
    edges {
      node {
        id
        name { value }
        parent { node { id name { value } } }
        design {
          node {
            id
            name { value }
            max_segments { value }
            ports_25g { value }
            ports_100g { value }
          }
        }
      }
    }
  }

  ManagedVxlanSegment {
    edges {
      node {
        id
        name { value }
        security_zone { node { name { value } } }
        customer_deployments { edges { node { id name { value } } } }
      }
    }
  }

  DcimPhysicalInterface(segments__isnull: false) {
    edges {
      node {
        id
        __typename
        ...QuotaPortFields
        interface_type { value }
        segments { edges { node { id } } }
      }
    }
  }

  DcimLAGInterface(segments__isnull: false) {
    edges {
      node {
        id
        __typename
        ...QuotaPortFields
        member_interfaces { edges { node { id interface_type { value } } } }
        segments { edges { node { id } } }
      }
    }
  }
}

fragment QuotaPortFields on DcimInterface {
  role { value }
  device {
    node {
      ... on DcimPhysicalDevice {
        deployment {
          node {
            id
            __typename
            ... on TopologyPod { parent { node { id name { value } } } }
            ... on TopologyColocationZone { parent { node { id name { value } } } }
          }
        }
      }
    }
  }
}
