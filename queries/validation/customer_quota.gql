# validate_customer_quota (checks/customer_quota.py): what each customer
# footprint uses, against the numbers its design carries.
#   - TopologyCustomerDC: the design's quota (max_segments, ports_<speed>g) and
#     the DC the footprint hangs off (a port counts for a footprint only in its DC).
#   - TopologyCustomerColocation: the design's max_segments.
#   - TopologyCustomerCloud: the design's max_segments and max_virtual_networks, the footprint's cloud segments
#     (network_segments) and its account and region (the virtual networks it counts are the account's in that region).
#   - CloudVirtualNetwork: the account and region of each network.
#   - TopologyCustomerTemplateDC / ...Colocation: the max_segments, the IPv4 and IPv6 address blocks and the segment
#     sizes of each tier (each block must hold the tier's segments).
#   - CloudNetworkSegment: the host_count, cidr_block and ip_version of each cloud segment (IPv4 only).
#   - ManagedVxlanSegment: the footprints each names, with their kind, its ip_version and host_count, and the family of
#     its gateway's prefix (it must match the ip_version).
#   - DcimPhysicalInterface / DcimLAGInterface with capabilities: the switch ports tagged with a segment (a VLAN row,
#     ManagedSegmentVlan, of it among the port's `capabilities`, read from the port, the segment through the row's
#     deployment; the check joins them to the segments by id). A port's speed is its
#     interface_type; a port-channel carries its member ports' speeds. role tells the host-facing ports from the
#     border-leaf firewall/load-balancer ports (where a segment terminated on a firewall context is tagged).
#     The device's deployment (a pod, a colocation zone) is how the port is placed
#     in a DC. security_zone: an exchange-zone segment is a shared service. QuotaPortFields is spread once at node
#     level: a named fragment spread directly inside an inline fragment resolves to nulls on a live Infrahub
#     (queries/fragments/group_policy.gql).
query customer_quota {
  TopologyCustomerDC {
    edges {
      node {
        id
        name { value }
        parent { node { id name { value } } }
        design {
          node {
            id
            name { value }
            max_segments { value }
            ports_25g { value }
            ports_100g { value }
          }
        }
      }
    }
  }

  TopologyCustomerColocation {
    edges {
      node {
        id
        name { value }
        design { node { id name { value } max_segments { value } } }
      }
    }
  }

  TopologyCustomerCloud {
    edges {
      node {
        id
        name { value }
        parent { node { id name { value } } }
        account { node { id } }
        design { node { id name { value } max_segments { value } max_virtual_networks { value } } }
        network_segments { edges { node { id } } }
      }
    }
  }

  CloudVirtualNetwork {
    edges {
      node {
        id
        account { node { id } }
        region { node { id } }
      }
    }
  }

  TopologyCustomerTemplateDC {
    edges {
      node {
        id
        name { value }
        max_segments { value }
        address_prefix_length { value }
        segment_prefix_length { value }
        ipv6_prefix_length { value }
        ipv6_segment_prefix_length { value }
      }
    }
  }

  TopologyCustomerTemplateColo {
    edges {
      node {
        id
        name { value }
        max_segments { value }
        address_prefix_length { value }
        segment_prefix_length { value }
        ipv6_prefix_length { value }
        ipv6_segment_prefix_length { value }
      }
    }
  }

  CloudNetworkSegment {
    edges { node { id name { value } host_count { value } cidr_block { value } ip_version { value } } }
  }

  ManagedVxlanSegment {
    edges {
      node {
        id
        name { value }
        ip_version { value }
        host_count { value }
        gateway { node { id ip_prefix { node { id prefix { value } } } } }
        security_zone { node { ...RoutingZoneFields } }
        customer_deployments { edges { node { id __typename name { value } } } }
      }
    }
  }

  DcimPhysicalInterface(capabilities__isnull: false) {
    edges {
      node {
        id
        __typename
        ...QuotaPortFields
        interface_type { value }
        capabilities { edges { node { __typename ... on ManagedSegmentVlan { segment_deployment { node { segment { node { id } } } } } } } }
      }
    }
  }

  DcimLAGInterface(capabilities__isnull: false) {
    edges {
      node {
        id
        __typename
        ...QuotaPortFields
        member_interfaces { edges { node { id interface_type { value } } } }
        capabilities { edges { node { __typename ... on ManagedSegmentVlan { segment_deployment { node { segment { node { id } } } } } } } }
      }
    }
  }
}

fragment QuotaPortFields on DcimInterface {
  role { value }
  device {
    node {
      ... on DcimPhysicalDevice {
        deployment {
          node {
            id
            __typename
            ... on TopologyPod { parent { node { id name { value } } } }
            ... on TopologyColocationZone { parent { node { id name { value } } } }
          }
        }
      }
    }
  }
}
