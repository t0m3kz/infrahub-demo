query pbr_firewall_reachability {
  ManagedFirewallContext {
    edges {
      node {
        id
        name {
          value
        }
        tenant {
          node {
            id
            display_label
          }
        }
        served_deployments {
          edges {
            node {
              id
              display_label
            }
          }
        }
        capabilities {
          edges {
            node {
              device {
                node {
                  ... on DcimDeviceManaged {
                    role {
                      value
                    }
                  }
                }
              }
              ...InterfaceRoutingZoneFields
              ... on DcimVirtualInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  FirewallPhysicalPorts: DcimPhysicalInterface(role__value: "firewall") {
    edges {
      node {
        id
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedFirewallContext {
                id
              }
            }
          }
        }
      }
    }
  }
  FirewallVirtualPorts: DcimVirtualInterface(role__value: "firewall") {
    edges {
      node {
        id
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedFirewallContext {
                id
              }
            }
          }
        }
      }
    }
  }
}
