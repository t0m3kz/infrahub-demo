# The firewall contexts that serve a footprint, the firewalls that hold their legs and the border or edge devices that
# carry them (the contexts behind their service ports): all derived from the devices, nothing is stored on an interface
# (utils/service_contexts.py).
query pbr_firewall_reachability {
  ManagedFirewallContext {
    edges {
      node {
        id
        name {
          value
        }
        tenant {
          node {
            id
            display_label
          }
        }
        served_deployments {
          edges {
            node {
              id
              display_label
            }
          }
        }
      }
    }
  }
  FirewallMembers: DcimDeviceManaged(role__value: "internal-firewall") {
    edges {
      node {
        ...ServiceMemberFields
      }
    }
  }
  CarrierDevices: DcimDeviceManaged(role__values: ["border-leaf", "border-spine", "edge"]) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        ...ServiceBorderPortsFields
      }
    }
  }
}
