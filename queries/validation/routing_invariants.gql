# What the routing invariants read, across topologies: namespaces and their
# type, interfaces/segments living in the INTERNET namespace, and the cloud
# Transit Gateway attachments, route tables and provider connections (with
# the namespace they terminate in), plus the cloud VPC aggregates
# (cidr_blocks) with the namespace each is registered in, the cloud subnets
# that must lie inside them, and the office footprints' LAN prefixes with their
# namespace and environment, and the owner of each registrant (an account or
# an office) with the segments an office hosts: only customer-owned prefixes
# cross the colocation edge. Rule 8 groups the registrations by attachment
# point (an office's sdwan_gateway; a provider connection with what it registers,
# the same selection as queries/config/edge.gql) and reads each segment's owner. The *Interface queries read every interface of the
# fleet (a relationship cannot be filtered by a nested namespace type); the
# check keeps the ones in the INTERNET namespace. A tunnel's registered_prefixes
# (PROD, owned by the tunnel's derived owner: the owner of the TopologyCustomerOffice among
# its locations) are the other registration behind an SD-WAN gateway: the device of each
# end port tells which gateway.
query routing_invariants {
  IpamNamespace {
    edges {
      node {
        id name { value } l3_vni { value } namespace_type { value }
      }
    }
  }

  # Host-facing check: every interface holding an address in an INTERNET
  # namespace (ip_address is declared per concrete interface kind).
  InternetPhysicalInterfaces: DcimPhysicalInterface {
    edges {
      node {
        __typename
        id name { value } role { value } device { node { id name { value } role { value } } }
        ip_address { node { address { value } ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } } } }
      }
    }
  }

  InternetVirtualInterfaces: DcimVirtualInterface {
    edges {
      node {
        __typename
        id name { value } role { value } device { node { id name { value } role { value } } }
        ip_address { node { address { value } ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } } } }
      }
    }
  }

  InternetLagInterfaces: DcimLAGInterface {
    edges {
      node {
        __typename
        id name { value } role { value } device { node { id name { value } role { value } } }
        ip_address { node { address { value } ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } } } }
      }
    }
  }

  ManagedNetworkSegment {
    edges {
      node {
        __typename
        id
        name { value }
        owner { node { __typename org_id { value } display_label } }
        gateway { node { ip_prefix { node { id prefix { value } member_type { value } ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } } } } } }
      }
    }
  }

  # VPC aggregates: each block is an IpamPrefix registered in the namespace of
  # the account's environment; the subnets (Text cidr_block) must sit inside.
  CloudVirtualNetwork {
    edges {
      node {
        id
        name { value }
        account { node { id name { value } environment { value } owner { node { __typename org_id { value } display_label } } } }
        cidr_blocks {
          edges {
            node {
              id
              prefix { value }
              ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } }
            }
          }
        }
      }
    }
  }

  # Office LANs: held to the VPC aggregate rules (the PROD namespace, an office
  # has no environment; no overlap inside one namespace).
  TopologyCustomerOffice {
    edges {
      node {
        id
        name { value }
        owner { node { __typename org_id { value } display_label } }
        sdwan_gateway { node { name { value } } }
        network_segments { edges { node { id } } }
        segment_deployments {
          edges {
            node {
              segment {
                node {
                  owner { node { __typename org_id { value } display_label } }
                  gateway { node { ip_prefix { node { prefix { value } ip_namespace { node { name { value } } } } } } }
                }
              }
            }
          }
        }
        lan_prefixes {
          edges {
            node {
              id
              prefix { value }
              ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } }
            }
          }
        }
      }
    }
  }

  TopologySessionCircuit(circuit_type__value: "tunnel") {
    edges {
      node {
        id
        name { value }
        locations { edges { node { ... on TopologyCustomerOffice { owner { node { __typename org_id { value } display_label } } } } } }
        capabilities { edges { node { device { node { name { value } } } } } }
        registered_prefixes {
          edges {
            node {
              id
              prefix { value }
              ip_namespace { node { id name { value } l3_vni { value } namespace_type { value } } }
            }
          }
        }
      }
    }
  }

  CloudNetworkSegment {
    edges {
      node {
        id
        name { value }
        cidr_block { value }
        virtual_network { node { id name { value } } }
      }
    }
  }

  CloudTransitGatewayAttachment {
    edges {
      node {
        id
        name { value }
        attachment_type { value }
        owner_account { node { id name { value } environment { value } } }
        virtual_network { node { id name { value } account { node { id name { value } environment { value } } } } }
        hybrid_endpoint { node { id } }
        associated_route_table { node { id name { value } } }
        propagates_to_route_tables { edges { node { id name { value } } } }
      }
    }
  }

  # One provider connection per attachment point of rule 8: what it registers (connection_registered) and the
  # namespace its sessions terminate in. session_circuits: a connection with none has no session.
  TopologyProviderConnection {
    edges {
      node {
        id
        name { value }
        service { value }
        ip_namespace { node { name { value } namespace_type { value } } }
        owner { node { __typename org_id { value } display_label } }
        account { node { id name { value } environment { value } owner { node { __typename org_id { value } display_label } } } }
        session_circuits { edges { node { name { value } } } }
        registered_prefixes {
          edges { node { prefix { value } ip_namespace { node { name { value } namespace_type { value } } } } }
        }
        attached_network {
          node {
            id name { value }
            account { node { id name { value } environment { value } owner { node { __typename org_id { value } display_label } } } }
            cidr_blocks { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
          }
        }
        transit_attachment { node { associated_route_table { node { id } } } }
        attached_gateway {
          node {
            attachments {
              edges {
                node {
                  attachment_type { value }
                  propagates_to_route_tables { edges { node { id } } }
                  virtual_network {
                    node {
                      cidr_blocks { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
                      account { node { owner { node { __typename org_id { value } display_label } } } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
