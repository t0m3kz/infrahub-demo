# validate_hypervisor_environment: every VM with the physical host it runs on
# and the environment of the customer footprint it is deployed for. A VM whose
# deployment is not a customer footprint (no environment) has no class and is
# skipped by the check.
query hypervisor_environment {
  DcimVirtualDevice {
    edges {
      node {
        id
        name { value }
        hosting_device { node { id name { value } } }
        deployment {
          node {
            id
            __typename
            name { value }
            ... on TopologyCustomer { environment { value } }
            ... on TopologyCustomerOffice { environment { value } }
          }
        }
      }
    }
  }
}
