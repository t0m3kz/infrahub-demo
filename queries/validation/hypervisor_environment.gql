# validate_hypervisor_environment: every VM with the physical host it runs on,
# the host's deployment (a pod or colocation zone; its parent is the DC or
# metro) and the customer footprint the VM is deployed for.
#   - environment: only a DC or Colocation footprint states one
#     (TopologyEnvironmentScoped); an office is always PROD, a footprint with
#     neither is skipped by the check.
#   - parent: the footprint's DC or metro, which must be where the host is.
query hypervisor_environment {
  DcimVirtualDevice {
    edges {
      node {
        id
        name { value }
        hosting_device {
          node {
            id
            name { value }
            deployment {
              node {
                id
                __typename
                name { value }
                ... on TopologyPod { parent { node { id name { value } } } }
                ... on TopologyColocationZone { parent { node { id name { value } } } }
              }
            }
          }
        }
        deployment {
          node {
            id
            __typename
            name { value }
            ... on TopologyEnvironmentScoped { environment { value } }
            ... on TopologyCustomerDC { parent { node { id name { value } } } }
            ... on TopologyCustomerColocation { parent { node { id name { value } } } }
          }
        }
      }
    }
  }
}
