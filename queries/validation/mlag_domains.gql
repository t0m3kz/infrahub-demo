# validate_mlag_domains (checks/mlag_domains.py): every MLAG domain with its member
# devices (the `capabilities` edge) and its `peer_devices` mirror, to check that a device
# is in at most one domain, that a domain has exactly two distinct members and that
# `peer_devices` names them. The rows (ManagedVlanDomainSegment, one per device and segment
# deployment) and the port-channels (DcimLAGInterface) with an `mlag_domain` are read to check
# that the two members of a domain hold equal VLAN ids and mirrored MLAG-attached LAGs.
query mlag_domains {
  ManagedMLAG {
    edges {
      node {
        id
        name { value }
        peer_devices { value }
        capabilities {
          edges {
            node {
              id
              name { value }
            }
          }
        }
      }
    }
  }

  ManagedVlanDomainSegment {
    edges {
      node {
        id
        vlan_id { value }
        segment_deployment {
          node {
            id
            segment { node { name { value } } }
          }
        }
        device { node { id name { value } } }
      }
    }
  }

  DcimLAGInterface {
    edges {
      node {
        id
        name { value }
        lag_id { value }
        lacp_mode { value }
        minimum_links { value }
        role { value }
        device { node { id name { value } } }
        mlag_domain { node { id } }
      }
    }
  }
}
