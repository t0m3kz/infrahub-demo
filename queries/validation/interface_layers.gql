query interface_layers {
  DcimPhysicalInterface {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        id
        name {
          value
        }
        device {
          node {
            name {
              value
            }
          }
        }
        lag {
          node {
            id
          }
        }
        ip_address {
          node {
            id
          }
        }
        segments {
          count
        }
        sub_interfaces {
          count
        }
        capabilities {
          edges {
            node {
              __typename
            }
          }
        }
      }
    }
  }
  DcimLAGInterface {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        id
        name {
          value
        }
        device {
          node {
            name {
              value
            }
          }
        }
        ip_address {
          node {
            id
          }
        }
        segments {
          count
        }
        sub_interfaces {
          count
        }
        capabilities {
          edges {
            node {
              __typename
            }
          }
        }
      }
    }
  }
}
