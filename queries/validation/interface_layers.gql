query interface_layers {
  DcimPhysicalInterface {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        id
        name {
          value
        }
        device {
          node {
            name {
              value
            }
            # R4: the port's deployments sit in the hosting deployment of its device (utils/segment_addressing.py).
            ... on DcimPhysicalDevice {
              deployment {
                node {
                  ...ServiceHostingFields
                }
              }
            }
          }
        }
        lag {
          node {
            id
          }
        }
        ip_address {
          node {
            id
          }
        }
        sub_interfaces {
          count
        }
        capabilities {
          edges {
            node {
              __typename
              # A segment deployment is the port's switchport membership (utils/segment_vlan.py port_deployments).
              ... on ManagedSegmentDeployment {
                id
                deployment {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
                segment {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  DcimLAGInterface {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        id
        name {
          value
        }
        device {
          node {
            name {
              value
            }
            # R4: the port's deployments sit in the hosting deployment of its device (utils/segment_addressing.py).
            ... on DcimPhysicalDevice {
              deployment {
                node {
                  ...ServiceHostingFields
                }
              }
            }
          }
        }
        ip_address {
          node {
            id
          }
        }
        sub_interfaces {
          count
        }
        capabilities {
          edges {
            node {
              __typename
              # A segment deployment is the port's switchport membership (utils/segment_vlan.py port_deployments).
              ... on ManagedSegmentDeployment {
                id
                deployment {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
                segment {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  # R3: the interfaces of every segment deployment, any kind (only a physical port or a LAG may carry a segment).
  ManagedSegmentDeployment {
    edges {
      node {
        id
        segment {
          node {
            name {
              value
            }
          }
        }
        deployment {
          node {
            name {
              value
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              id
              name {
                value
              }
              device {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
