# validate_interface_layers: the layer of a port is its content. Per switch port (physical, LAG): its LAG, the VLAN
# segments it is a member of (`segments`), its address, its sub-interfaces and the kind of each capability on it (a
# firewall / load-balancer context is an L2 tag, a routing session or circuit session an L3 signal). Small on
# purpose: it covers every switch port. The inline termination on a virtual interface is interface_parents.gql.
query interface_layers {
  DcimPhysicalInterface {
    edges {
      node {
        id
        name { value }
        device { node { name { value } } }
        lag { node { id } }
        ip_address { node { id } }
        segments { count }
        sub_interfaces { count }
        capabilities { edges { node { __typename } } }
      }
    }
  }
  DcimLAGInterface {
    edges {
      node {
        id
        name { value }
        device { node { name { value } } }
        ip_address { node { id } }
        segments { count }
        sub_interfaces { count }
        capabilities { edges { node { __typename } } }
      }
    }
  }
}
