# Every segment with what decides whether its routed SVI is protected: the
# namespace (VRF) of its gateway, its zone, its security policy (rules and
# default action) and the customer deployments it serves,
# plus the firewall contexts those deployments are redirected to (PBR).
query tenant_svi_protection {
  ManagedNetworkSegment {
    edges {
      node {
        __typename
        id
        name { value }
        security_zone { node { ...RoutingZoneFields } }
        gateway { node { ip_prefix { node {
 prefix { value } ip_namespace { node { name { value }  } } } } } }
        security_policy {
          node {
            id
            enabled { value }
            default_action { value }
            rules { count }
          }
        }
        # terminated_on: a segment a firewall context terminates has no SVI to protect.
        ... on ManagedVxlanSegment { customer_deployments { edges { node { id } } } terminated_on { node { id } } }
      }
    }
  }

  ManagedFirewallContext {
    edges {
      node {
        id
        tenant { node { id } }
        served_deployments { edges { node { id } } }
      }
    }
  }
}
