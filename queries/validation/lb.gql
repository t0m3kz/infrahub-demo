# One load balancer, physical or virtual: readiness (platform, status, uplink, HA) and its
# cluster's contexts with their legs, VIP range and VIPs (fragments/loadbalancer.gql).
query loadbalancer_validation($device: String!) {
  DcimPhysicalDevice(name__value: $device) {
    edges {
      node {
        status { value }
        ...LoadbalancerDeviceFields
      }
    }
  }
  DcimVirtualDevice(name__value: $device) {
    edges {
      node {
        status { value }
        ...LoadbalancerDeviceFields
      }
    }
  }
}
