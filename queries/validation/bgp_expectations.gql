query bgp_expectations {
  ManagedBGPPeering {
    edges {
      node {
        id
        name {
          value
        }
        peering_role {
          value
        }
        session_type {
          value
        }
        ttl {
          value
        }
        route_reflector_client {
          value
        }
        address_families {
          edges {
            node {
              afi {
                value
              }
              safi {
                value
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              name {
                value
              }
              ...InterfaceRoutingZoneFields
              ... on DcimPhysicalInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              device {
                node {
                  __typename
                  name {
                    value
                  }
                  ... on DcimDeviceManaged {
                    role {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        bgp_processes {
          edges {
            node {
              process_role {
                value
              }
              local_as {
                node {
                  asn {
                    value
                  }
                }
              }
              capabilities {
                edges {
                  node {
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  DcimDevice: DcimDeviceManaged {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        platform {
          node {
            name {
              value
            }
          }
        }
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...EvpnRtAsOnDeploymentFields
            }
          }
        }
        ... on DcimDeviceManaged {
          shared_capabilities {
            edges {
              node {
                __typename
                ... on ManagedVRF {
                  security_zone {
                    node {
                      ...RoutingZoneFields
                    }
                  }
                }
              }
            }
          }
        }
        ... on DcimDevice {
          interfaces {
            edges {
              node {
                name {
                  value
                }
                role {
                  value
                }
                ...InterfaceRoutingZoneFields
                ... on DcimPhysicalInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimVirtualInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  DcimVirtualInterface(role__value: "multisite-vip") {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        ip_address {
          node {
            address {
              value
            }
          }
        }
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
            interfaces(role__values: ["loopback", "loopback-vtep"]) {
              edges {
                node {
                  role {
                    value
                  }
                  ...InterfaceRoutingZoneFields
                  ... on DcimVirtualInterface {
                    vrf {
                      node {
                        ...RoutingVrfFields
                      }
                    }
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                  ... on DcimPhysicalInterface {
                    vrf {
                      node {
                        ...RoutingVrfFields
                      }
                    }
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  environment_zones: SecurityZone {
    edges {
      node {
        ...EnvironmentRoutingZoneFields
      }
    }
  }
  ManagedVRF {
    edges {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              name {
                value
              }
              ... on DcimDeviceManaged {
                role {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  ManagedVxlanSegment {
    edges {
      node {
        id
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        gateway {
          node {
            ip_prefix {
              node {
                prefix {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
