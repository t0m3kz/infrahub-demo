query vrf_instances($device_ids: [ID], $with_instances: Boolean = true) {
  SecurityZone {
    edges {
      node {
        id
        name {
          value
        }
        l3_vni {
          value
        }
        vrf_type {
          value
        }
      }
    }
  }
  ManagedVRF @include(if: $with_instances) {
    edges {
      node {
        id
        name {
          value
        }
        deployment {
          node {
            id
          }
        }
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              id
            }
          }
        }
      }
    }
  }
  DcimDevice: DcimDeviceManaged(ids: $device_ids) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        status {
          value
        }
        member_of_groups {
          edges {
            node {
              name {
                value
              }
            }
          }
        }
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...ServiceHostingFields
            }
          }
        }
        # The device's VLAN rows: its individual capabilities of kind ManagedSegmentVlan.
        capabilities {
          edges {
            node {
              __typename
              ...ServiceRowFields
            }
          }
        }
        ... on CloudNetworkAppliance {
          deployment {
            node {
              ...ServiceHostingFields
            }
          }
        }
        ... on DcimDeviceManaged {
          shared_capabilities {
            edges {
              node {
                __typename
                ...VrfDemandInstanceFields
              }
            }
          }
          # The individual capabilities: a ManagedPBR says the device steers (utils/vrf_demand.py pbr_ids).
          capabilities {
            edges {
              node {
                __typename
                id
              }
            }
          }
        }
        ...ServiceBorderPortsFields
        ... on DcimDevice {
          interfaces {
            edges {
              node {
                __typename
                id
                name {
                  value
                }
                role {
                  value
                }
                ...InterfaceRoutingZoneFields
                ... on DcimPhysicalInterface {
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimLAGInterface {
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimVirtualInterface {
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                  segment_vlan {
                    node {
                      id
                    }
                  }
                }
                capabilities {
                  edges {
                    node {
                      __typename
                      id
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
