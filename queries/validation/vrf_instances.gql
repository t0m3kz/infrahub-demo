query vrf_instances($device_ids: [ID], $with_instances: Boolean = true) {
  SecurityZone {
    edges {
      node {
        id
        name {
          value
        }
        l3_vni {
          value
        }
        vrf_type {
          value
        }
      }
    }
  }
  ManagedVRF @include(if: $with_instances) {
    edges {
      node {
        id
        name {
          value
        }
        deployment {
          node {
            id
          }
        }
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              id
            }
          }
        }
      }
    }
  }
  DcimDevice: DcimDeviceManaged(ids: $device_ids) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        status {
          value
        }
        member_of_groups {
          edges {
            node {
              name {
                value
              }
            }
          }
        }
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...VrfDemandHostingFields
            }
          }
          vlans {
            edges {
              node {
                ...VrfDemandRowFields
              }
            }
          }
        }
        ... on CloudNetworkAppliance {
          deployment {
            node {
              ...VrfDemandHostingFields
            }
          }
        }
        ... on DcimCapabilities {
          shared_capabilities {
            edges {
              node {
                __typename
                ...VrfDemandInstanceFields
              }
            }
          }
        }
        ... on DcimDevice {
          interfaces {
            edges {
              node {
                __typename
                id
                name {
                  value
                }
                role {
                  value
                }
                ...InterfaceRoutingZoneFields
                ... on DcimPhysicalInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimLAGInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimVirtualInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                  vrf {
                    node {
                      id
                      deployment {
                        node {
                          id
                        }
                      }
                      security_zone {
                        node {
                          ...RoutingZoneFields
                        }
                      }
                    }
                  }
                  segment_vlan {
                    node {
                      id
                    }
                  }
                }
                capabilities {
                  edges {
                    node {
                      __typename
                      id
                      ... on RoutingPolicy {
                        kind {
                          value
                        }
                        origin {
                          value
                        }
                        customer_deployment {
                          node {
                            id
                          }
                        }
                      }
                      ... on ManagedFirewallContext {
                        vlan_id {
                          value
                        }
                        tenant {
                          node {
                            id
                          }
                        }
                        served_deployments {
                          edges {
                            node {
                              id
                            }
                          }
                        }
                        capabilities {
                          edges {
                            node {
                              ...VrfDemandLegFields
                            }
                          }
                        }
                      }
                      ... on ManagedLoadbalancerContext {
                        vlan_id {
                          value
                        }
                        capabilities {
                          edges {
                            node {
                              ...VrfDemandLegFields
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
