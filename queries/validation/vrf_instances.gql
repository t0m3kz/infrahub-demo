query vrf_instances($device_ids: [ID], $with_instances: Boolean = true) {
  SecurityZone {
    edges {
      node {
        id
        name {
          value
        }
        l3_vni {
          value
        }
        vrf_type {
          value
        }
      }
    }
  }
  ManagedVRF @include(if: $with_instances) {
    edges {
      node {
        id
        name {
          value
        }
        deployment {
          node {
            id
          }
        }
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              id
            }
          }
        }
      }
    }
  }
  DcimDevice: DcimDeviceManaged(ids: $device_ids) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        status {
          value
        }
        member_of_groups {
          edges {
            node {
              name {
                value
              }
            }
          }
        }
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...VrfDemandHostingFields
            }
          }
          vlans {
            edges {
              node {
                ...VrfDemandRowFields
              }
            }
          }
        }
        ... on CloudNetworkAppliance {
          deployment {
            node {
              ...VrfDemandHostingFields
            }
          }
        }
        ... on DcimCapabilities {
          shared_capabilities {
            edges {
              node {
                __typename
                ...VrfDemandInstanceFields
              }
            }
          }
        }
        ... on DcimDevice {
          interfaces {
            edges {
              node {
                __typename
                id
                name {
                  value
                }
                role {
                  value
                }
                ...InterfaceRoutingZoneFields
                ... on DcimPhysicalInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimLAGInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
                ... on DcimVirtualInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                      ip_namespace {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                  vrf {
                    node {
                      id
                      deployment {
                        node {
                          id
                        }
                      }
                      security_zone {
                        node {
                          ...RoutingZoneFields
                        }
                      }
                    }
                  }
                  segment_vlan {
                    node {
                      id
                    }
                  }
                }
                capabilities {
                  edges {
                    node {
                      __typename
                      id
                      ... on RoutingPolicy {
                        kind {
                          value
                        }
                        origin {
                          value
                        }
                        customer_deployment {
                          node {
                            id
                          }
                        }
                      }
                      ... on ManagedFirewallContext {
                        vlan_id {
                          value
                        }
                        tenant {
                          node {
                            id
                          }
                        }
                        served_deployments {
                          edges {
                            node {
                              id
                            }
                          }
                        }
                        capabilities {
                          edges {
                            node {
                              ...VrfDemandLegFields
                            }
                          }
                        }
                      }
                      ... on ManagedLoadbalancerContext {
                        vlan_id {
                          value
                        }
                        capabilities {
                          edges {
                            node {
                              ...VrfDemandLegFields
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment VrfDemandInstanceFields on ManagedVRF {
  id
  name {
    value
  }
  deployment {
    node {
      id
    }
  }
  security_zone {
    node {
      ...RoutingZoneFields
    }
  }
}

fragment VrfDemandHostingFields on TopologyDeployment {
  __typename
  id
  name {
    value
  }
  ... on TopologyPod {
    parent {
      node {
        __typename
        id
        name {
          value
        }
      }
    }
  }
  ... on TopologyColocationZone {
    parent {
      node {
        __typename
        id
        name {
          value
        }
      }
    }
  }
  ... on TopologyVirtualColocation {
    parent {
      node {
        __typename
        id
        name {
          value
        }
      }
    }
  }
}

fragment VrfDemandRowFields on ManagedSegmentVlan {
  id
  vlan_id {
    value
  }
  segment_deployment {
    node {
      segment {
        node {
          security_zone {
            node {
              ...RoutingZoneFields
            }
          }
          __typename
          id
          ... on ManagedVxlanSegment {
            name {
              value
            }
            terminated_on {
              node {
                id
              }
            }
            customer_deployments {
              edges {
                node {
                  id
                  name {
                    value
                  }
                  parent {
                    node {
                      __typename
                      id
                    }
                  }
                  ... on TopologyCustomerDC {
                    serving_firewall_context {
                      node {
                        id
                      }
                    }
                  }
                  ... on TopologyCustomerColocation {
                    serving_firewall_contexts {
                      edges {
                        node {
                          id
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          gateway {
            node {
              address {
                value
              }
              ip_prefix {
                node {
                  ip_namespace {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment VrfDemandLegFields on DcimInterface {
  device {
    node {
      ... on DcimDeviceManaged {
        role {
          value
        }
      }
    }
  }
  ...InterfaceRoutingZoneFields
  ... on DcimVirtualInterface {
    vrf {
      node {
        ...RoutingVrfFields
      }
    }
    ip_address {
      node {
        address {
          value
        }
        ip_namespace {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
}
