# validate_vlan_domain_membership: every infrastructure VLAN with its VLAN domain and the ports carrying it.
# The domain is a ManagedMLAG or a device without MLAG; a port's device names its own MLAG through its capabilities,
# which is how the domain of a device is resolved (transforms/common.py _resolve_own_vlan_domain_id).
query vlan_domain_membership {
  ManagedVlan {
    edges {
      node {
        id
        name { value }
        vlan_id { value }
        vlan_domain { node { id __typename name { value } } }
        capabilities {
          edges {
            node {
              id
              name { value }
              device {
                node {
                  id
                  name { value }
                  ... on DcimPhysicalDevice { capabilities { edges { node { id __typename } } } }
                }
              }
            }
          }
        }
      }
    }
  }
}
