# validate_virtual_nic_pinning: every virtual device with its hosting device and the base NICs it rides on.
# A NIC is a DcimVirtualInterface of the device; its host_interface (a DcimPhysicalInterface) is the port of the hosting
# device it is pinned to, with the cable of that port. An unset host_interface arrives as a null node.
query virtual_nic_pinning {
  DcimVirtualDevice {
    edges {
      node {
        id
        name { value }
        hosting_device {
          node {
            id
            name { value }
          }
        }
        interfaces {
          edges {
            node {
              id
              __typename
              name { value }
              role { value }
              ... on DcimVirtualInterface {
                host_interface {
                  node {
                    id
                    name { value }
                    device {
                      node {
                        id
                        name { value }
                      }
                    }
                    cable { node { id } }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
