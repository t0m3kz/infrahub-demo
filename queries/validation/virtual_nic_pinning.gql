# validate_virtual_nic_pinning: every virtual device with its hosting device and the base NICs it rides on.
# A NIC is a DcimVirtualInterface of the device; its parent_interface (a DcimInterface generic peer) is the port of the
# hosting device it is pinned to, with the cable of that port when it is a physical one. An unset parent arrives as a
# null node.
query virtual_nic_pinning {
  DcimVirtualDevice {
    edges {
      node {
        id
        name { value }
        hosting_device {
          node {
            id
            name { value }
          }
        }
        interfaces {
          edges {
            node {
              id
              __typename
              name { value }
              role { value }
              ... on DcimVirtualInterface {
                parent_interface {
                  node {
                    id
                    name { value }
                    device {
                      node {
                        id
                        name { value }
                      }
                    }
                    ... on DcimPhysicalInterface {
                      cable { node { id } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
