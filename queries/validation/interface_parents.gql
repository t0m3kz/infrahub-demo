# validate_interface_parents: every interface that rides on another one (DcimSubInterface: a virtual interface or a cloud
# peering) with the interface it rides on (parent_interface) and the device of both.
# A VM NIC's parent is a port of its hosting device (with the cable of that port); a sub-interface's parent is a NIC, a port or a
# LAG of its own device; a peering's parent is a port or LAG of its transport. An unset parent_interface arrives as a null node.
# Small on purpose: it covers every interface that rides on another. The marker holds only parent_interface, so the rest is read
# through a spread per kind (the same shape on both: the field is one response key of two exclusive types).
query interface_parents {
  DcimSubInterface {
    edges {
      node {
        id
        __typename
        ... on DcimVirtualInterface {
          name { value }
          role { value }
          device {
            node {
              id
              __typename
              name { value }
              ... on DcimVirtualDevice { hosting_device { node { id name { value } } } }
            }
          }
        }
        ... on CloudPeeringInterface {
          name { value }
          device { node { id __typename name { value } } }
        }
        parent_interface {
          node {
            id
            __typename
            name { value }
            device { node { id name { value } } }
            ... on DcimPhysicalInterface { cable { node { id } } }
          }
        }
      }
    }
  }
}
