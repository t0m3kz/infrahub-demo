query interface_parents {
  DcimSubInterface {
    edges {
      node {
        __typename
        ... on DcimInterface {
          id
          name {
            value
          }
          role {
            value
          }
          device {
            node {
              id
              __typename
              name {
                value
              }
              ... on DcimVirtualDevice {
                hosting_device {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        parent {
          node {
            id
            __typename
            name {
              value
            }
            device {
              node {
                id
                __typename
                name {
                  value
                }
              }
            }
            ... on DcimPhysicalInterface {
              cable {
                node {
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}
