# The reference fabric profile rows, every data center with its devices (its
# own and its pods': a pod's devices belong to the pod's data center; the
# check keeps the VTEPs, utils/group_policy.site_vteps), every segment with
# its group tag and the sites it is active in (SegmentGroupPolicyFields), and
# every component group tag with the segment of the component it groups
# (which segments need component group policy).
query reference_fabric {
  DcimGroupPolicyProfile {
    edges {
      node {
        ...GroupPolicyProfileFields
      }
    }
  }

  TopologyDataCenter {
    edges {
      node {
        id
        name { value }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  TopologyPod {
    edges {
      node {
        parent { node { id __typename } }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  # Every segment: a routed tenant segment on a reference fabric must carry
  # its group tag, and the sites a tagged one is active in.
  ManagedNetworkSegment {
    edges {
      node {
        ...SegmentGroupPolicyFields
      }
    }
  }

  SecurityTag {
    edges {
      node {
        id
        components { edges { node { id network_segment { node { id } } } } }
      }
    }
  }
}
