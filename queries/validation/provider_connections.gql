# The rows of checks/provider_connections.py (rules PC1 to PC13) and the cloud consistency rules, one global query:
#
# - TopologyProviderConnection: path_type, vlan_id, the near and far facility (a SaaS region carries its
#   SaaS cloud's provider, whose connection_profile picks the flavour when there is no account; the full chain is
#   utils/provider_services.py connection_provider), the account (its
#   provider's connection_profile, its environment and owner), the connection's own owner, provider_as, the prefixes
#   it registers and the link ranges it is handed, the near_port, the carriers it lists (the generator's output: status,
#   locations, end ports with their device and deployment).
# - TopologySessionCircuit (every circuit_type: a dci or a tunnel on a connection is a finding): status, the
#   connection, ip_namespace, link_prefix, locations and both end ports. Each port carries the carrier circuits on it
#   and on its parent interface (the derived underlay) and its device with its deployment and BGP processes.
# - TopologyCarrierCircuit: locations, the connections it belongs to (PC2), its redundancy_group and end ports (PC13).
# - CloudNetworkSegment and CloudTransitGatewayAttachment: owner and account consistency.
query provider_connections {
  TopologyProviderConnection {
    edges {
      node {
        id
        name { value }
        status { value }
        path_type { value }
        vlan_id { value }
        near_port { node { id name { value } } }
        near { node { id __typename name { value } } }
        far {
          node {
            id
            __typename
            name { value }
            ... on TopologyExternalProviders {
              provider { node { ...ConnectionProvider } }
            }
            ... on TopologySaasRegion {
              parent { node { ... on TopologySaas { provider { node { ...ConnectionProvider } } } } }
            }
            ... on TopologyBilledAccount {
              account { node { provider { node { ...ConnectionProvider } } } }
            }
            # an external provider or a colocation zone hosts devices; a region hosts appliances only
            ... on TopologyDeviceHosting {
              devices { edges { node { ...ConnectionKitOwner } } }
            }
            ... on TopologyApplianceHosting {
              appliances { edges { node { ...ConnectionKitOwner } } }
            }
          }
        }
        ip_namespace { node { id name { value } namespace_type { value } } }
        owner { node { id __typename org_id { value } display_label } }
        account {
          node {
            id
            name { value }
            environment { value }
            provider { node { ...ConnectionProvider } }
            owner { node { id __typename org_id { value } display_label } }
          }
        }
        provider_as { node { id asn { value } } }
        attached_network { node { id } }
        attached_gateway { node { id } }
        registered_prefixes {
          edges { node { id prefix { value } ip_namespace { node { id name { value } } } } }
        }
        link_prefixes {
          edges { node { id prefix { value } ip_namespace { node { id name { value } } } } }
        }
        carrier_circuits {
          edges {
            node {
              id
              name { value }
              status { value }
              circuit_type { value }
              locations { edges { node { id } } }
              capabilities { edges { node { ...ConnectionKitEnd } } }
            }
          }
        }
      }
    }
  }

  TopologySessionCircuit {
    edges {
      node {
        id
        name { value }
        status { value }
        circuit_type { value }
        connection { node { id name { value } } }
        ip_namespace { node { id name { value } } }
        link_prefix { node { id prefix { value } } }
        locations { edges { node { id __typename name { value } } } }
        capabilities { edges { node { ...SessionPort } } }
      }
    }
  }

  TopologyCarrierCircuit {
    edges {
      node {
        id
        name { value }
        status { value }
        redundancy_group { value }
        locations { edges { node { id __typename name { value } } } }
        provider_connections { edges { node { id } } }
        capabilities { edges { node { ...ConnectionKitEnd } } }
      }
    }
  }

  CloudNetworkSegment {
    edges {
      node {
        id
        name { value }
        owner { node { id org_id { value } } }
        customer_deployment {
          node {
            id
            name { value }
            owner { node { id org_id { value } } }
          }
        }
      }
    }
  }

  CloudTransitGatewayAttachment {
    edges {
      node {
        id
        name { value }
        attachment_type { value }
        owner_account { node { id name { value } } }
        virtual_network { node { id name { value } account { node { id name { value } } } } }
      }
    }
  }
}

fragment SessionPort on DcimInterface {
  id
  name { value }
  capabilities {
    edges {
      node {
        __typename
        ... on TopologyCarrierCircuit {
          id
          name { value }
          status { value }
        }
      }
    }
  }
  ... on DcimVirtualInterface {
    parent_interface {
      node {
        capabilities {
          edges {
            node {
              __typename
              ... on TopologyCarrierCircuit {
          id
          name { value }
          status { value }
        }
            }
          }
        }
      }
    }
  }
  device {
    node {
      id
      name { value }
      ... on DcimPhysicalDevice {
        deployment { node { id __typename name { value } } }
      }
      ... on DcimVirtualDevice {
        deployment { node { id __typename name { value } } }
      }
      ... on CloudNetworkAppliance {
        deployment { node { id __typename name { value } } }
      }
      ... on DcimCapabilities {
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedBGP { local_as { node { asn { value } } } }
            }
          }
        }
      }
    }
  }
}

# The provider of a connection (utils/provider_services.py connection_provider): the account's, the far facility's
# (external provider, SaaS region's parent, billed account), else the owner of the far kit (a carrier end deployed in
# the far facility, or a device the far facility hosts).
fragment ConnectionProvider on OrganizationProvider {
  id
  name { value }
  connection_profile { value }
}

fragment ConnectionKitOwner on DcimDevice {
  id
  owner { node { id __typename ... on OrganizationProvider { name { value } connection_profile { value } } } }
}

fragment ConnectionKitEnd on DcimInterface {
  id
  device {
    node {
      id
      name { value }
      owner { node { id __typename ... on OrganizationProvider { name { value } connection_profile { value } } } }
      ... on DcimPhysicalDevice {
        deployment { node { id } }
      }
      ... on DcimVirtualDevice {
        deployment { node { id } }
      }
      ... on CloudNetworkAppliance {
        deployment { node { id } }
      }
    }
  }
}
