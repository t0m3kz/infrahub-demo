# The LISP rows (checks/lisp_fabric.py): every office with its fabric opt-in (fabric_templates), buildings, site
# key, devices (with their capability kinds, for the SD-WAN edge's BGP process) and active segments with their VRF
# namespace and L3 VNI (an office is a LISP site by role, it has no overlay flag).
query lisp_fabric {
  TopologyCustomerOffice {
    edges {
      node {
        id
        name { value }
        fabric_templates { edges { node { id } } }
        locations { edges { node { id name { value } } } }
        lisp_site_key { node { id } }
        # capabilities: the SD-WAN edge's BGP process is the WAN exit's (add_office_fabric).
        devices {
          edges {
            node {
              name { value }
              role { value }
              platform { node { name { value } } }
              ... on DcimCapabilities {
                capabilities { edges { node { __typename } } }
              }
            }
          }
        }
        segment_deployments(status__values: ["active", "provisioning"]) {
          edges {
            node {
              vni { value }
              segment {
                node {
                  name { value }
                  gateway {
                    node {
                      id
                      ip_prefix {
                        node {
                          ip_namespace { node { name { value } l3_vni { value } } }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
