# The rows of checks/customer_cloud_account.py (rules CA1, CA2 and CA3), one global query:
#
# - TopologyCustomerCloud: its owner, its environment and its account (one footprint per account) with the account's
#   owner and environment.
# - CloudNetworkSegment: its customer footprint and the account of the virtual network it uses.
query customer_cloud_account {
  TopologyCustomerCloud {
    edges {
      node {
        id
        name { value }
        environment { value }
        owner { node { id org_id { value } } }
        account {
          node {
            id
            name { value }
            environment { value }
            owner { node { id org_id { value } } }
          }
        }
      }
    }
  }

  CloudNetworkSegment {
    edges {
      node {
        id
        name { value }
        customer_deployment { node { id name { value } } }
        virtual_network {
          node {
            id
            name { value }
            account { node { id name { value } } }
          }
        }
      }
    }
  }
}
