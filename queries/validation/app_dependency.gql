# validate_app_dependency: every dependency names exactly one source and one
# target, and opens ports that parse and that its target actually listens on;
# an approved dependency between two owners' components lists its ports and
# its decision_reason (each side's owner is its application's); a
# load_balanced component lists ports, no port range (one VIP per port) and
# has instances (its pool members).
query app_dependency_validation {
  AppComponent {
    edges {
      node {
        fqdn { value }
        ports { value }
        load_balanced { value }
        instances { count }
      }
    }
  }
  AppDependency {
    edges {
      node {
        name { value }
        ports { value }
        target_fqdn { value }
        access_status { value }
        decision_reason { value }
        source_profile {
          node {
            id
          }
        }
        source {
          node {
            id
            ... on AppComponent {
              fqdn { value }
              parent {
                node {
                  __typename
                  ... on AppApplication {
                    owner {
                      node {
                        name { value }
                        org_id { value }
                        egress_service {
                          node {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        target {
          node {
            id
            ... on AppComponent {
              fqdn { value }
              ports { value }
              parent {
                node {
                  __typename
                  ... on AppApplication {
                    owner { node { name { value } org_id { value } } }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
