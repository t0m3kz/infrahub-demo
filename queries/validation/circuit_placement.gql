# The rows of checks/circuit_placement.py, one root per circuit kind (the role of a session circuit is its
# `circuit_type`: dci, handoff or tunnel):
#
# - TopologyCarrierCircuit: the places it terminates on (locations), the owner (with an office location's owner:
#   an office's access circuit is owned by it) and the device each end port sits on with where that device is
#   deployed.
# - TopologySessionCircuit: circuit_type, status (a decommissioned dci or handoff is exempt: nothing is built for it),
#   owner and locations (an office location carries its owner), end ports; each port's device carries its BGP
#   processes (a dci needs exactly one overlay process on it). What only one type may carry is selected for all:
#   ip_namespace (with its namespace_type) and the cloud-side endpoint (a VIF states its VLAN, which mirrors the
#   sub-interface name) for a handoff, password, maximum_routes and registered_prefixes (their ids only).
#   A handoff's locations are exactly where its two end devices are deployed, so every end port's device carries
#   its deployment.
#
# A session circuit's end port (VirtualPort) carries the carrier circuits terminating on it (its own
# `capabilities`, which also hold peerings and contexts: only TopologyCarrierCircuit is selected) and, for a
# sub-interface, the same on its parent interface: a handoff VLAN rides the circuit that terminates on the parent.
# A hop inside one facility is a DcimCable, not a circuit, so the port (a physical interface has the relationship)
# and its parent carry their `cable` too: a handoff is carried by a cable (the dci and tunnel rules read
# circuits only). The check derives the carrier per port from utils/circuit_underlay.py (a decommissioned circuit is
# no carrier; a cable has no status).
# Every circuit_type shares the one port fragment, so a type that does not read a path of it (a tunnel and the
# BGP processes) still selects it. One global query.
#
# Concrete inline fragments only for the deployment of a physical end, so the query is valid whether the deployment
# peer is a generic or a concrete kind. Both kinds' `locations` peer TopologyFacility (an office is one, which is
# why only the office carries an owner here).
query circuit_placement {
  TopologyCarrierCircuit {
    edges {
      node {
        id
        name { value }
        owner { node { id org_id { value } } }
        locations {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyCustomerOffice { owner { node { id org_id { value } } } }
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              name { value }
              device {
                node {
                  id
                  name { value }
                  ... on DcimPhysicalDevice {
                    deployment { node { id __typename name { value } } }
                  }
                  ... on DcimVirtualDevice {
                    deployment { node { id __typename name { value } } }
                  }
                  ... on CloudNetworkAppliance {
                    deployment { node { id __typename name { value } } }
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  TopologySessionCircuit {
    edges {
      node {
        id
        name { value }
        status { value }
        circuit_type { value }
        owner { node { id org_id { value } } }
        locations {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyCustomerOffice { owner { node { id org_id { value } } } }
            }
          }
        }
        ip_namespace { node { name { value } namespace_type { value } } }
        password { node { id } }
        maximum_routes { value }
        registered_prefixes { edges { node { id } } }
        cloud_endpoint {
          node {
            id
            ... on CloudVirtualInterface {
              name { value }
              vlan_id { value }
            }
          }
        }
        capabilities { edges { node { ...VirtualPort } } }
      }
    }
  }
}

fragment VirtualPort on DcimInterface {
  id
  name { value }
  capabilities {
    edges {
      node {
        __typename
        ... on TopologyCarrierCircuit { ...Carrier }
      }
    }
  }
  ... on DcimPhysicalInterface {
    cable { node { id } }
  }
  ... on DcimVirtualInterface {
    parent_interface {
      node {
        ... on DcimPhysicalInterface {
          cable { node { id } }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on TopologyCarrierCircuit { ...Carrier }
            }
          }
        }
      }
    }
  }
  device {
    node {
      id
      __typename
      name { value }
      ... on DcimPhysicalDevice {
        deployment { node { id __typename name { value } } }
      }
      ... on DcimVirtualDevice {
        deployment { node { id __typename name { value } } }
      }
      ... on CloudNetworkAppliance {
        deployment { node { id __typename name { value } } }
      }
      ... on DcimCapabilities {
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedBGP { process_role { value } }
            }
          }
        }
      }
    }
  }
}

# A carrier circuit found on a port: its status (a decommissioned one is no carrier), where it terminates and
# the ports it terminates on (a carrier of exactly the circuit's two ports is pure fibre).
fragment Carrier on TopologyCarrierCircuit {
  id
  name { value }
  status { value }
  locations { edges { node { id __typename name { value } } } }
  capabilities { edges { node { id name { value } device { node { name { value } } } } } }
}
