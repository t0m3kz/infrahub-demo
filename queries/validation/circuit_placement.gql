# The rows of checks/circuit_placement.py: every circuit with the places it terminates on (locations), the device
# each end port sits on and where that device is deployed (capabilities), the circuit's owner (with an office
# location's owner: an office's access circuit is owned by it; a virtual circuit's DC and colocation footprints also
# state their environment, which the environment rule compares per shared device), and for a virtual circuit the
# physical circuits found in the capabilities of its own ports (its derived underlay), each with its status (a
# decommissioned one is no underlay) and locations, and its link_type (a tunnel must be physical- or internet-backed).
# One global query.
#
# Concrete inline fragments only, so the query is valid whether physical `locations` peers TopologyConnectableLocation
# or TopologyFacility: TopologyColocationZone and TopologyVirtualColocation implement both, the customer
# footprints only the first (they are selected on virtual circuits alone). A zone or virtual colocation carries
# its metro (parent): the edges deploy to the zone, so a physical end must be exactly the zone the edge sits in (a
# sibling zone is refused, as add_circuit refuses it), and a colocation footprint (parented by the metro) is reached
# through any zone of it.
query circuit_placement {
  TopologyPhysicalCircuit {
    edges {
      node {
        id
        name { value }
        owner { node { id org_id { value } } }
        locations {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
              ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
              ... on TopologyCustomerOffice { owner { node { id org_id { value } } } }
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              name { value }
              device {
                node {
                  id
                  name { value }
                  ... on DcimPhysicalDevice {
                    deployment {
                      node {
                        id
                        __typename
                        name { value }
                        ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                        ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                      }
                    }
                  }
                  ... on DcimVirtualDevice {
                    deployment {
                      node {
                        id
                        __typename
                        name { value }
                        ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                        ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                      }
                    }
                  }
                  ... on CloudNetworkAppliance {
                    deployment {
                      node {
                        id
                        __typename
                        name { value }
                        ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                        ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  TopologyVirtualCircuit {
    edges {
      node {
        id
        name { value }
        link_type { value }
        transport_mode { value }
        owner { node { id org_id { value } } }
        locations {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
              ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
              ... on TopologyCustomer {
                owner { node { id org_id { value } } }
              }
              ... on TopologyCustomerOffice {
                owner { node { id org_id { value } } }
              }
              ... on TopologyCustomerDC {
                environment { value }
                parent { node { id __typename name { value } } }
              }
              ... on TopologyCustomerColocation {
                environment { value }
                parent { node { id __typename name { value } } }
              }
              ... on TopologyCustomerCloud { parent { node { id __typename name { value } } } }
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              name { value }
              capabilities {
                edges {
                  node {
                    __typename
                    ... on TopologyPhysicalCircuit {
                      id
                      name { value }
                      status { value }
                      locations {
                        edges {
                          node {
                            id
                            __typename
                            name { value }
                            ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                            ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                          }
                        }
                      }
                    }
                  }
                }
              }
              device {
                node {
                  id
                  name { value }
                  ... on DcimPhysicalDevice {
                    deployment {
                      node {
                        id
                        __typename
                        name { value }
                        ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                        ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                      }
                    }
                  }
                  ... on DcimVirtualDevice {
                    deployment {
                      node {
                        id
                        __typename
                        name { value }
                        ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                        ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                      }
                    }
                  }
                  ... on CloudNetworkAppliance {
                    deployment {
                      node {
                        id
                        __typename
                        name { value }
                        ... on TopologyColocationZone { parent { node { id __typename name { value } } } }
                        ... on TopologyVirtualColocation { parent { node { id __typename name { value } } } }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
