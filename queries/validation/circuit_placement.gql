# The rows of checks/circuit_placement.py, one root per circuit kind (the role of a virtual circuit IS its kind):
#
# - TopologyPhysicalCircuit: the places it terminates on (locations), the owner (with an office location's owner:
#   an office's access circuit is owned by it) and the device each end port sits on with where that device is
#   deployed.
# - TopologyTunnelCircuit: owner and locations (an office location carries its owner), and its end ports.
# - TopologyInterconnectCircuit: locations and end ports; each port's device carries its BGP processes (the
#   Interconnect needs exactly one overlay process on it).
# - TopologyHandoffCircuit: locations and end ports; the environment namespace; the cloud-side endpoint (a VIF
#   states its VLAN, which mirrors the sub-interface name).
#
# A virtual circuit's end port (VirtualPort) carries the physical circuits terminating on it (its own
# `capabilities`, which also hold segments and peerings: only TopologyPhysicalCircuit is selected) and, for a
# sub-interface, the same on its parent interface: a handoff VLAN rides the circuit that terminates on the parent.
# A hop inside one facility is a DcimCable, not a circuit, so the port (a physical interface has the relationship)
# and its parent carry their `cable` too: a Handoff is carried by a cable (the Interconnect and Tunnel rules read
# circuits only). The check derives the carrier per port from utils/circuit_underlay.py (a decommissioned circuit is
# no carrier; a cable has no status).
# Every virtual kind shares the one port fragment, so a kind that does not read a path of it (a Tunnel and the
# BGP processes) still selects it. One global query.
#
# Concrete inline fragments only for the deployment of a physical end, so the query is valid whether the deployment
# peer is a generic or a concrete kind. The physical `locations` peer TopologyFacility; a tunnel's peers
# TopologyConnectableLocation (an office is one), which is why only the office carries an owner here.
query circuit_placement {
  TopologyPhysicalCircuit {
    edges {
      node {
        id
        name { value }
        owner { node { id org_id { value } } }
        locations {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyCustomerOffice { owner { node { id org_id { value } } } }
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              name { value }
              device {
                node {
                  id
                  name { value }
                  ... on DcimPhysicalDevice {
                    deployment { node { id __typename name { value } } }
                  }
                  ... on DcimVirtualDevice {
                    deployment { node { id __typename name { value } } }
                  }
                  ... on CloudNetworkAppliance {
                    deployment { node { id __typename name { value } } }
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  TopologyTunnelCircuit {
    edges {
      node {
        id
        name { value }
        owner { node { id org_id { value } } }
        locations {
          edges {
            node {
              id
              __typename
              name { value }
              ... on TopologyCustomerOffice { owner { node { id org_id { value } } } }
            }
          }
        }
        capabilities { edges { node { ...VirtualPort } } }
      }
    }
  }

  TopologyInterconnectCircuit {
    edges {
      node {
        id
        name { value }
        owner { node { id org_id { value } } }
        locations { edges { node { id __typename name { value } } } }
        capabilities { edges { node { ...VirtualPort } } }
      }
    }
  }

  TopologyHandoffCircuit {
    edges {
      node {
        id
        name { value }
        locations { edges { node { id __typename name { value } } } }
        ip_namespace { node { name { value } namespace_type { value } } }
        cloud_endpoint {
          node {
            ... on CloudVirtualInterface {
              name { value }
              vlan_id { value }
            }
          }
        }
        capabilities { edges { node { ...VirtualPort } } }
      }
    }
  }
}

fragment VirtualPort on DcimInterface {
  id
  name { value }
  capabilities {
    edges {
      node {
        __typename
        ... on TopologyPhysicalCircuit { ...Carrier }
      }
    }
  }
  ... on DcimPhysicalInterface {
    cable { node { id } }
  }
  ... on DcimVirtualInterface {
    parent_interface {
      node {
        cable { node { id } }
        capabilities {
          edges {
            node {
              __typename
              ... on TopologyPhysicalCircuit { ...Carrier }
            }
          }
        }
      }
    }
  }
  device {
    node {
      id
      __typename
      name { value }
      ... on DcimCapabilities {
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedBGP { process_role { value } }
            }
          }
        }
      }
    }
  }
}

# A physical circuit found on a port: its status (a decommissioned one is no carrier), where it terminates and
# the ports it terminates on (a carrier of exactly the circuit's two ports is pure fibre).
fragment Carrier on TopologyPhysicalCircuit {
  id
  name { value }
  status { value }
  locations { edges { node { id __typename name { value } } } }
  capabilities { edges { node { id name { value } device { node { name { value } } } } } }
}
