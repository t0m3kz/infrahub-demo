query circuit_placement {
  TopologyInternet {
    edges {
      node {
        id
        name {
          value
        }
        interfaces {
          edges {
            node {
              id
              __typename
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  TopologyCarrierCircuit {
    edges {
      node {
        id
        name {
          value
        }
        status {
          value
        }
        circuit_type {
          value
        }
        locations {
          edges {
            node {
              id
              __typename
              name {
                value
              }
              ... on TopologyCustomerOffice {
                owner {
                  node {
                    id
                    org_id {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              id
              __typename
              name {
                value
              }
              device {
                node {
                  id
                  __typename
                  name {
                    value
                  }
                  ... on DcimPhysicalDevice {
                    deployment {
                      node {
                        id
                        __typename
                        name {
                          value
                        }
                      }
                    }
                  }
                  ... on DcimVirtualDevice {
                    deployment {
                      node {
                        id
                        __typename
                        name {
                          value
                        }
                      }
                    }
                  }
                  ... on CloudNetworkAppliance {
                    deployment {
                      node {
                        id
                        __typename
                        ... on TopologyDeployment {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                  ... on CloudTransport {
                    region {
                      node {
                        id
                        __typename
                        name {
                          value
                        }
                      }
                    }
                    saas_region {
                      node {
                        id
                        __typename
                        name {
                          value
                        }
                      }
                    }
                  }
                  ... on TopologyProviderConnect {
                    location {
                      node {
                        id
                        __typename
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  TopologySessionCircuit {
    edges {
      node {
        id
        name {
          value
        }
        status {
          value
        }
        circuit_type {
          value
        }
        locations {
          edges {
            node {
              id
              __typename
              name {
                value
              }
              ... on TopologyCustomerOffice {
                owner {
                  node {
                    id
                    org_id {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        password {
          node {
            id
          }
        }
        registered_prefixes {
          edges {
            node {
              id
            }
          }
        }
        capabilities {
          edges {
            node {
              ...VirtualPort
            }
          }
        }
      }
    }
  }
}

fragment VirtualPort on DcimInterface {
  id
  __typename
  name {
    value
  }
  capabilities {
    edges {
      node {
        __typename
        ... on TopologyCarrierCircuit {
          ...Carrier
        }
      }
    }
  }
  ... on DcimPhysicalInterface {
    cable {
      node {
        id
      }
    }
    ip_address {
      node {
        id
      }
    }
  }
  ... on CloudPeeringInterface {
    vlan_id {
      value
    }
  }
  ... on DcimVirtualInterface {
    vlan_id {
      value
    }
    parent_interface {
      node {
        ... on DcimPhysicalInterface {
          cable {
            node {
              id
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on TopologyCarrierCircuit {
                ...Carrier
              }
            }
          }
        }
      }
    }
  }
  device {
    node {
      id
      __typename
      name {
        value
      }
      ... on DcimPhysicalDevice {
        deployment {
          node {
            id
            __typename
            name {
              value
            }
          }
        }
      }
      ... on DcimVirtualDevice {
        deployment {
          node {
            id
            __typename
            name {
              value
            }
          }
        }
      }
      ... on CloudNetworkAppliance {
        deployment {
          node {
            id
            __typename
            ... on TopologyDeployment {
              name {
                value
              }
            }
          }
        }
      }
      ... on CloudTransport {
        region {
          node {
            id
            __typename
            name {
              value
            }
          }
        }
        saas_region {
          node {
            id
            __typename
            name {
              value
            }
          }
        }
      }
      ... on DcimDeviceManaged {
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedBGP {
                process_role {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment Carrier on TopologyCarrierCircuit {
  id
  name {
    value
  }
  status {
    value
  }
  locations {
    edges {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  capabilities {
    edges {
      node {
        id
        name {
          value
        }
        device {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
}
