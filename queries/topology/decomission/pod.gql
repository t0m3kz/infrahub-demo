fragment DecommissionDeviceFields on DcimDevice {
  id
  name {
    value
  }
  ... on DcimDeviceManaged {
    role {
      value
    }
    status {
      value
    }
    primary_address {
      node {
        id
      }
    }
  }
  interfaces {
    edges {
      node {
        __typename
        id
        description {
          value
        }
        status {
          value
        }
        ...InterfaceRoutingZoneFields
        ... on DcimPhysicalInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          ip_address {
            node {
              id
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
              ip_prefix {
                node {
                  id
                  prefix {
                    value
                  }
                }
              }
            }
          }
          cable {
            node {
              id
              endpoints {
                edges {
                  node {
                    id
                    ...InterfaceRoutingZoneFields
                    ... on DcimPhysicalInterface {
                      vrf {
                        node {
                          ...RoutingVrfFields
                        }
                      }
                      name {
                        value
                      }
                      status {
                        value
                      }
                      ip_address {
                        node {
                          id
                          ip_prefix {
                            node {
                              id
                            }
                          }
                        }
                      }
                      device {
                        node {
                          ... on DcimDeviceManaged {
                            role {
                              value
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        ... on DcimVirtualInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          role {
            value
          }
          ip_address {
            node {
              id
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
              ip_prefix {
                node {
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}

query pod_decommission($name: String!) {
  TopologyPod(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        index {
          value
        }
        loopback_pool {
          node {
            id
            resources {
              edges {
                node {
                  id
                }
              }
            }
          }
        }
        prefix_pool {
          node {
            id
            resources {
              edges {
                node {
                  id
                }
              }
            }
          }
        }
        fabric_templates {
          edges {
            node {
              role {
                value
              }
              quantity {
                value
              }
            }
          }
        }
        parent {
          node {
            ... on TopologyDataCenter {
              id
              name {
                value
              }
              index {
                value
              }
              naming_convention {
                value
              }
              border_spines: devices(role__value: "border-spine") {
                edges {
                  node {
                    ...DecommissionDeviceFields
                  }
                }
              }
            }
          }
        }
        devices {
          edges {
            node {
              ...DecommissionDeviceFields
            }
          }
        }
      }
    }
  }
}
