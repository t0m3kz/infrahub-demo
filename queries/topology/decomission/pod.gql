query pod_decommission($name: String!) {
  TopologyPod(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        index {
          value
        }
        loopback_pool {
          node {
            id
            resources {
              edges {
                node {
                  id
                }
              }
            }
          }
        }
        prefix_pool {
          node {
            id
            resources {
              edges {
                node {
                  id
                }
              }
            }
          }
        }
        fabric_templates {
          edges {
            node {
              role {
                value
              }
              quantity {
                value
              }
            }
          }
        }
        parent {
          node {
            ... on TopologyDataCenter {
              id
              name {
                value
              }
              index {
                value
              }
              naming_convention {
                value
              }
              border_spines: devices(role__value: "border-spine") {
                edges {
                  node {
                    ...DecommissionDeviceFields
                  }
                }
              }
            }
          }
        }
        devices {
          edges {
            node {
              ...DecommissionDeviceFields
            }
          }
        }
      }
    }
  }
}
