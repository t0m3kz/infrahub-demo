# add_circuit (generators/topology/circuit.py). Filters on name, the
# generator's registered parameter (.infrahub.yml `name: name__value`).
#
# A circuit's endpoints are one list, interface_capabilities: exactly two
# interfaces by schema (min_count = max_count = 2), one per end. Each endpoint
# carries what a DCI session needs: its address, its device's deployment (a
# TopologyDataCenter end names the fabric key and the address family) and the
# device's BGP processes.
query circuit_data($name: String!) {
  TopologyPhysicalCircuit(name__value: $name) {
    edges {
      node {
        id
        name { value }
        circuit_id { value }
        circuit_type { value }
        status { value }
        peering_role { value }
        interface_capabilities {
          edges {
            node {
              ...CircuitEndpoint
            }
          }
        }
      }
    }
  }
}

fragment CircuitEndpoint on DcimInterface {
  id
  __typename
  name { value }
  ... on DcimPhysicalInterface {
    ip_address { node { id address { value } } }
  }
  ... on DcimVirtualInterface {
    ip_address { node { id address { value } } }
  }
  device {
    node {
      id
      name { value }
      ... on DcimPhysicalDevice {
        deployment { node { ...CircuitDeployment } }
      }
      ... on DcimVirtualDevice {
        deployment { node { ...CircuitDeployment } }
      }
      ... on DcimCapabilities {
        capabilities {
          edges {
            node {
              id
              __typename
              ... on ManagedBGP {
                name { value }
                process_role { value }
              }
            }
          }
        }
      }
    }
  }
}

fragment CircuitDeployment on TopologyDeployment {
  id
  __typename
  ... on TopologyDataCenter {
    name { value }
    underlay_protocol { value }
  }
}
