query vxlan_segment_data($name: String!) {
  ManagedVxlanSegment(name__value: $name) {
    edges {
      node {
        id
        __typename
        name { value }
        environment { value }
        # The sizing of its prefix (utils/segment_addressing.py) and the customer whose pool it is drawn from
        host_count { value }
        ip_version { value }
        owner { node { id org_id { value } } }
        security_zone { node { ...RoutingZoneFields } }
        # Whether it is a routed tenant segment, and its group tag: present
        # means nothing is written (generators/helpers/security_tag.py).
        # terminated_on: a segment a firewall context terminates has no SVI, so no group or routing tag.
        terminated_on { node { id } }
        # Its policy, if it has one (generators/segment_firewall.py ensure_segment_policy keeps a hand-written one).
        security_policy { node { id } }
        security_tag { node { id } }
        # Its routing tag, likewise (generators/helpers/routing_tag.py).
        routing_tag { value }
        stretch_scope { value }
        vlan_scope { value }
        arp_suppression { value }
        customer_deployments {
          edges {
            node {
              id
              __typename
              name { value }
              # The design of the footprint that addresses the segment (utils/segment_addressing.py
              # addressing_footprint): the block its customer pool is carved in.
              ... on TopologyCustomerDC {
                design {
                  node {
                    id
                    name { value }
                    address_prefix_length { value }
                    segment_prefix_length { value }
                    ipv6_prefix_length { value }
                    ipv6_segment_prefix_length { value }
                  }
                }
                parent {
                  node {
                    id
                    name { value }
                    ... on TopologySegmentHosting {
                      vni_pool { node { id name { value } } }
                    }
                    # Leafs/ToRs belong to the DC's pods, not the DC itself;
                    # other children (customer footprints) come back empty
                    ... on TopologyDataCenter {
                      children { edges { node { ... on TopologyPod { id } } } }
                    }
                  }
                }
              }
              ... on TopologyCustomerColocation {
                design {
                  node {
                    id
                    name { value }
                    address_prefix_length { value }
                    segment_prefix_length { value }
                    ipv6_prefix_length { value }
                    ipv6_segment_prefix_length { value }
                  }
                }
                parent {
                  node {
                    id
                    name { value }
                    ... on TopologySegmentHosting {
                      vni_pool { node { id name { value } } }
                    }
                  }
                }
              }
              # An office hosts its own segments (it is TopologySegmentHosting), so
              # the pool is on the footprint itself — its parent, the "Campus and
              # Office" label, hosts nothing. The key's presence is how
              # generators/topology/segment.py tells the two shapes apart.
              ... on TopologyCustomerOffice {
                vni_pool { node { id name { value } } }
              }
            }
          }
        }
        gateway {
          node {
            id
            address { value }
            ip_prefix { node { id prefix { value } ip_namespace { node { id name { value } } } } }
          }
        }
      }
    }
  }
}
