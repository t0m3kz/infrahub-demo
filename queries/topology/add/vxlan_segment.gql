query vxlan_segment_data($name: String!) {
  ManagedVxlanSegment(name__value: $name) {
    edges {
      node {
        id
        __typename
        name { value }
        environment { value }
        security_zone { node { name { value } } }
        # Whether it is a routed tenant segment, and its group tag: present
        # means nothing is written (generators/helpers/security_tag.py).
        gateway { node { ip_prefix { node { ip_namespace { node { name { value } namespace_type { value } } } } } } }
        security_tag { node { id } }
        stretch_scope { value }
        arp_suppression { value }
        terminate_inline { value }
        # terminate_inline: the HA pair members' ports cabled to border-leaf
        # service ports are where the segment terminates (generators/topology/segment.py).
        inline_service {
          node {
            id
            name { value }
            ... on ManagedGenericDevice {
              capabilities {
                edges {
                  node {
                    id
                    __typename
                    name { value }
                  }
                }
              }
            }
          }
        }
        customer_deployments {
          edges {
            node {
              id
              name { value }
              ... on TopologyCustomerDC {
                parent {
                  node {
                    id
                    name { value }
                    ... on TopologySegmentHosting {
                      vni_pool { node { id name { value } } }
                    }
                    # Leafs/ToRs belong to the DC's pods, not the DC itself;
                    # other children (customer footprints) come back empty
                    ... on TopologyDataCenter {
                      children { edges { node { ... on TopologyPod { id } } } }
                    }
                  }
                }
              }
              ... on TopologyCustomerColocation {
                parent {
                  node {
                    id
                    name { value }
                    ... on TopologySegmentHosting {
                      vni_pool { node { id name { value } } }
                    }
                  }
                }
              }
              # An office hosts its own segments (it is TopologySegmentHosting), so
              # the pool is on the footprint itself — its parent, the OfficeCustomer
              # grouping node, hosts nothing. The key's presence is how
              # generators/topology/segment.py tells the two shapes apart.
              ... on TopologyCustomerOffice {
                vni_pool { node { id name { value } } }
              }
            }
          }
        }
        gateway {
          node {
            id
            address { value }
            ip_prefix { node { id prefix { value } ip_namespace { node { id } } } }
          }
        }
      }
    }
  }
}
