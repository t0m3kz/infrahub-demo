fragment PhysicalInterfaceFields on DcimPhysicalInterface {
  ...PhysicalInterfaceCableIdFields
  interface_type { value }
  role { value }
  status { value }
}

fragment RackDeviceFields on DcimPhysicalDevice {
  ...PhysicalDeviceIdentityRoleFields
  rack {
    node {
      id
      row_index { value }
    }
  }
  interfaces {
    edges {
      node {
        ...PhysicalInterfaceFields
      }
    }
  }
}

fragment PodDesignFields on TopologyPodDesign {
  id
  rows { value }
  compute_racks_per_row { value }
  network_racks_per_row { value }
  max_tors_per_compute_rack { value }
}

fragment PodFields on TopologyPod {
  id
  name { value }
  design { node { ...PodDesignFields } }
  index { value }
  parent {
    node {
      id
      name { value }
    }
  }
}

fragment RackFields on LocationRack {
  id
  name { value }
  index { value }
  row_index { value }
  rack_type { value }
  pod {
    node {
      ...PodFields
    }
  }
  devices(role__values: ["leaf", "tor"]) {
    edges {
      node {
        ...RackDeviceFields
      }
    }
  }
}

query GetEndpointForConnectivity($device_name: String!) {
  DcimDevice(name__value: $device_name) {
    edges {
      node {
        ...DeviceIdentityRoleFields
        ... on DcimPhysicalDevice {
          rack {
            node {
              ...RackFields
            }
          }
        }
        interfaces {
          edges {
            node {
              ...PhysicalInterfaceFields
            }
          }
        }
      }
    }
  }
}
