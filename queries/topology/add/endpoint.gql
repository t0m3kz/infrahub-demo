fragment PhysicalInterfaceFields on DcimPhysicalInterface {
  id
  name { value }
  interface_type { value }
  role { value }
  status { value }
  cable {
    node {
      id
    }
  }
}

# A server's own bond (role=lag). Members are the role=lag physical NICs it bundles. The lag_id
# attribute marks the dict as a bond, since the physical-interface fragment above leaves it empty.
fragment BondFields on DcimLAGInterface {
  id
  name { value }
  role { value }
  lag_id { value }
  member_interfaces {
    edges {
      node {
        id
      }
    }
  }
}

fragment PodFields on TopologyPod {
  id
  name { value }
  design {
    node {
      max_leafs_per_network_rack { value }
      max_tors_per_compute_rack { value }
    }
  }
  index { value }
  parent {
    node {
      id
      name { value }
    }
  }
  # Every rack of the pod: the generator filters its row in Python instead of reading it
  # (racks are data, never saved by this generator).
  racks {
    edges {
      node {
        id
        name { value }
        index { value }
        row_index { value }
        rack_type { value }
      }
    }
  }
}

fragment RackFields on LocationRack {
  id
  name { value }
  index { value }
  row_index { value }
  rack_type { value }
  pod {
    node {
      ...PodFields
    }
  }
}

query GetEndpointForConnectivity($device_name: String!) {
  DcimDevice(name__value: $device_name) {
    edges {
      node {
        id
        name { value }
        role { value }
        ... on DcimPhysicalDevice {
          deployment {
            node {
              id
            }
          }
          rack {
            node {
              ...RackFields
            }
          }
        }
        interfaces {
          edges {
            node {
              ...PhysicalInterfaceFields
              ...BondFields
            }
          }
        }
      }
    }
  }
}
