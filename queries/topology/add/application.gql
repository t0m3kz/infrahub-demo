fragment SegmentSecurityFields on ManagedNetworkSegment {
  __typename
  name {
    value
  }
  environment {
    value
  }
  isolation_mode {
    value
  }
  security_zone {
    node {
      name {
        value
      }
      trust_level {
        value
      }
      id
      l3_vni {
        value
      }
      vrf_type {
        value
      }
    }
  }
  gateway {
    node {
      ip_prefix {
        node {
          id
          prefix {
            value
          }
          ip_namespace {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  security_tag {
    node {
      id
    }
  }
  routing_tag {
    value
  }
  security_policy {
    node {
      id
      name {
        value
      }
    }
  }
  ... on ManagedVxlanSegment {
    customer_deployments {
      edges {
        node {
          id
          __typename
          ... on TopologyCustomerDC {
            parent {
              node {
                id
                __typename
              }
            }
            serving_loadbalancer_context {
              node {
                id
                name {
                  value
                }
                vip_prefix {
                  node {
                    id
                    ip_namespace {
                      node {
                        id
                      }
                    }
                  }
                }
                capabilities {
                  edges {
                    node {
                      __typename
                      ...InterfaceRoutingZoneFields
                      ... on DcimVirtualInterface {
                        vrf {
                          node {
                            ...RoutingVrfFields
                          }
                        }
                        ip_address {
                          node {
                            ip_prefix {
                              node {
                                id
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
    terminated_on {
      node {
        id
      }
    }
  }
}

fragment AppInstanceFields on AppInstance {
  id
  name {
    value
  }
  __typename
  ... on DcimPhysicalDevice {
    role {
      value
    }
    primary_address {
      node {
        id
        address {
          value
        }
      }
    }
    deployment {
      node {
        id
        __typename
        ... on TopologyPod {
          parent {
            node {
              id
              __typename
            }
          }
        }
      }
    }
  }
  ... on DcimVirtualDevice {
    role {
      value
    }
    primary_address {
      node {
        id
        address {
          value
        }
      }
    }
    hosting_device {
      node {
        id
        name {
          value
        }
      }
    }
    deployment {
      node {
        id
        __typename
        ... on TopologyCustomerDC {
          parent {
            node {
              id
              __typename
            }
          }
        }
      }
    }
  }
  ... on CloudInstance {
    private_ip {
      value
    }
    network_segment {
      node {
        id
        name {
          value
        }
        virtual_network {
          node {
            id
            name {
              value
            }
            cidr_blocks {
              edges {
                node {
                  prefix {
                    value
                  }
                  ip_namespace {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment AppComponentSecurityFields on AppComponent {
  id
  name {
    value
  }
  fqdn {
    value
  }
  ports {
    value
  }
  load_balanced {
    value
  }
  lb_layer {
    value
  }
  lb_certificate {
    value
  }
  component_type {
    value
  }
  security_tag {
    node {
      id
    }
  }
  instances {
    edges {
      node {
        ...AppInstanceFields
      }
    }
  }
  dependents {
    edges {
      node {
        id
        name {
          value
        }
        ports {
          value
        }
        access_status {
          value
        }
        source {
          node {
            id
            ... on AppComponent {
              parent {
                node {
                  id
                  __typename
                }
              }
            }
          }
        }
        source_profile {
          node {
            id
            name {
              value
            }
          }
        }
      }
    }
  }
  depends_on {
    edges {
      node {
        id
        name {
          value
        }
        ports {
          value
        }
        target_fqdn {
          value
        }
        description {
          value
        }
        access_status {
          value
        }
        decision_reason {
          value
        }
        access_expires_at {
          value
        }
        target {
          node {
            id
            ... on AppComponent {
              name {
                value
              }
              fqdn {
                value
              }
              ports {
                value
              }
              component_type {
                value
              }
              security_tag {
                node {
                  id
                }
              }
              load_balanced {
                value
              }
              instances {
                edges {
                  node {
                    ...AppInstanceFields
                  }
                }
              }
              network_segment {
                node {
                  id
                  name {
                    value
                  }
                  ...SegmentSecurityFields
                  ... on CloudNetworkSegment {
                    cidr_block {
                      value
                    }
                    virtual_network {
                      node {
                        id
                        name {
                          value
                        }
                        account {
                          node {
                            id
                            name {
                              value
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              parent {
                node {
                  ... on AppApplication {
                    id
                    name {
                      value
                    }
                    environment {
                      value
                    }
                    owner {
                      node {
                        id
                        org_id {
                          value
                        }
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  parent {
    node {
      id
      ... on AppApplication {
        name {
          value
        }
        environment {
          value
        }
        owner {
          node {
            id
            org_id {
              value
            }
            name {
              value
            }
            egress_service {
              node {
                id
                name {
                  value
                }
              }
            }
            private_access_service {
              node {
                id
                name {
                  value
                }
              }
            }
            proxy_policies {
              edges {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  network_segment {
    node {
      id
      __typename
      ...SegmentSecurityFields
      ... on CloudNetworkSegment {
        name {
          value
        }
        cidr_block {
          value
        }
        virtual_network {
          node {
            id
            name {
              value
            }
            account {
              node {
                id
                name {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  health_checks {
    edges {
      node {
        id
      }
    }
  }
}

fragment AppApplicationSecurityFields on AppApplication {
  id
  name {
    value
  }
  environment {
    value
  }
  criticality {
    value
  }
  security_profile {
    value
  }
  children {
    edges {
      node {
        ...AppComponentSecurityFields
      }
    }
  }
}

query application($name: String!) {
  AppApplication(name__value: $name) {
    edges {
      node {
        ...AppApplicationSecurityFields
      }
    }
  }
}
