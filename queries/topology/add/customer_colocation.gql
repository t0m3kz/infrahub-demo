query customer_colocation($name: String!) {
  TopologyCustomerColocation(name__value: $name) {
    edges {
      node {
        id
        name { value }
        environment { value }
        owner {
          node {
            id
            org_id { value }
            ... on OrganizationCustomer {
              name { value }
            }
            ... on OrganizationProvider {
              name { value }
            }
          }
        }
        # The design's block lengths: the customer's pools are created from them when the footprint is boarded
        # (generators/topology/segment_addressing.py ensure_customer_pools).
        design { node { name { value } address_prefix_length { value } ipv6_prefix_length { value } } }
        # The contexts the footprint is already linked to (one per serving zone, and an Internet edge one):
        # generators/firewall_context.py's link_serving_context writes nothing, and reads
        # nothing, when they are the ones serving it; unlink_stale_serving_contexts drops the others.
        # The members' role tells an internal context from an Internet edge one: the run converges only the internal ones.
        serving_firewall_contexts { edges { node { id shared_devices { edges { node { role { value } } } } } } }
        # The footprint's parent is its metro, which owns no devices: the zones below it do. The
        # generator (generators/topology/customer_colocation.py) builds one FirewallContext on
        # every zone that has firewalls, so each zone is read with its firewall devices. The
        # metro's other child kind, TopologyVirtualColocation (provider-hosted appliances, no
        # contexts of ours), is not selected and arrives empty. No LoadbalancerContext on a
        # colocation footprint, so no load-balancer devices are read.
        parent {
          node {
            id
            name { value }
            ... on TopologyColocationMetro {
              children {
                edges {
                  node {
                    ... on TopologyColocationZone {
                      id
                      name { value }
                      firewall_devices: devices(role__value: "internal-firewall") {
                        edges {
                          node {
                            id
                            kind: __typename
                            name { value }
                            ... on DcimPhysicalDevice {
                              platform { node { name { value } } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
