query customer_colocation($name: String!) {
  TopologyCustomerColocation(name__value: $name) {
    edges {
      node {
        id
        name { value }
        environment { value }
        owner {
          node {
            id
            org_id { value }
            ... on OrganizationCustomer {
              name { value }
            }
            ... on OrganizationProvider {
              name { value }
            }
          }
        }
        parent {
          node {
            id
            name { value }
            # The metro's own firewall/load-balancer pair, which every cage in
            # it shares — a FirewallContext for this deployment lives on that
            # pair (generators/topology/customer_colocation.py).
            ... on TopologyColocationMetro {
              firewall_devices: devices(role__value: "firewall") {
                edges {
                  node {
                    id
                    name { value }
                    ... on DcimPhysicalDevice {
                      platform { node { name { value } } }
                    }
                  }
                }
              }
              loadbalancer_devices: devices(role__value: "load-balancer") {
                edges {
                  node {
                    id
                    name { value }
                    ... on DcimPhysicalDevice {
                      platform { node { name { value } } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
