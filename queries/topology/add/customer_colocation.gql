query customer_colocation($name: String!) {
  TopologyCustomerColocation(name__value: $name) {
    edges {
      node {
        id
        name { value }
        environment { value }
        owner {
          node {
            id
            org_id { value }
            ... on OrganizationCustomer {
              name { value }
            }
            ... on OrganizationProvider {
              name { value }
            }
          }
        }
        parent {
          node {
            id
            name { value }
            # The metro's own firewall pair, which every cage in it shares — a
            # FirewallContext for this deployment lives on that pair
            # (generators/topology/customer_colocation.py; no LoadbalancerContext
            # on a metro, so no load-balancer devices are read).
            ... on TopologyColocationMetro {
              firewall_devices: devices(role__value: "firewall") {
                edges {
                  node {
                    id
                    kind: __typename
                    name { value }
                    ... on DcimPhysicalDevice {
                      platform { node { name { value } } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
