fragment TemplateDeviceFields on TemplateDcimPhysicalDevice {
  platform {
    node {
      id
      name {
        value
      }
    }
  }
  device_type {
    node {
      id
    }
  }
  interfaces(role__values: ["uplink", "mlag-peer"]) {
    edges {
      node {
        name {
          value
        }
        role {
          value
        }
      }
    }
  }
}

fragment FabricTemplateFields on TopologyElement {
  role {
    value
  }
  quantity {
    value
  }
  template {
    node {
      id
      ...TemplateDeviceFields
    }
  }
}

fragment PodFields on TopologyPod {
  id
  name {
    value
  }
  index {
    value
  }
  design {
    node {
      name { value }
      max_rows { value }
      max_compute_racks_per_row { value }
      max_network_racks_per_row { value }
      max_leafs_per_network_rack { value }
      max_tors_per_compute_rack { value }
      max_border_leafs_per_pod { value }
    }
  }
  parent {
    node {
      ... on TopologyDataCenter {
        id
        name {
          value
        }
        index {
          value
        }
        naming_convention {
          value
        }
        fabric_interface_sorting_method {
          value
        }
        connectivity_mode {
          value
        }
        routing_strategy {
          value
        }
        underlay_protocol {
          value
        }
        management_pool {
          node {
            id
            name { value }
          }
        }
        fabric_asn_pool {
          node {
            id
            name { value }
          }
        }
        fabric_controllers: controllers(controller_type__values: ["aci_apic", "dcnm", "nsx_manager", "ucs_manager"]) {
          edges {
            node {
              id
              controller_type { value }
            }
          }
        }
        security_manager_controllers: controllers(controller_type__value: "security_manager") {
          edges {
            node {
              id
              controller_type { value }
              ... on DcimDevice {
                platform {
                  node {
                    id
                  }
                }
              }
            }
          }
        }
        lb_manager_controllers: controllers(controller_type__value: "lb_manager") {
          edges {
            node {
              id
              controller_type { value }
              ... on DcimDevice {
                platform {
                  node {
                    id
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  fabric_templates {
    edges {
      node {
        role { value }
        quantity { value }
        template {
          node {
            id
            ... on TemplateDcimPhysicalDevice {
              interfaces(role__value: "downlink") {
                edges {
                  node {
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  leaf_interface_sorting_method {
    value
  }
  spine_interface_sorting_method {
    value
  }
  mlag_create {
    value
  }
  loopback_pool {
    node {
      id
    }
  }
  prefix_pool {
    node {
      id
    }
  }
  # Every rack of the pod: the generator filters its row in Python instead of reading it
  # (racks are data, never saved by this generator).
  racks {
    edges {
      node {
        id
        name { value }
        index { value }
        row_index { value }
        rack_type { value }
      }
    }
  }
}

query RackGenerator($name: String) {
  LocationRack(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        index {
          value
        }
        rack_type {
          value
        }
        row_index {
          value
        }
        parent {
          node {
            ... on LocationSuite {
              index {
                value
              }
            }
          }
        }
        leafs: fabric_templates(role__value: "leaf") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        tors: fabric_templates(role__value: "tor") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        l2_leafs: fabric_templates(role__value: "l2-leaf") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        access_leafs: fabric_templates(role__value: "access-leaf") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        deployment {
          node {
            ...PodFields
          }
        }
      }
    }
  }
}
