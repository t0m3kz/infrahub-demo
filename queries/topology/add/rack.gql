fragment TemplateDeviceFields on TemplateDcimPhysicalDevice {
  platform {
    node {
      id
      name {
        value
      }
    }
  }
  device_type {
    node {
      id
    }
  }
  interfaces(role__values: ["uplink", "mlag-peer"]) {
    edges {
      node {
        name {
          value
        }
        role {
          value
        }
      }
    }
  }
}

fragment FabricTemplateFields on TopologyElement {
  role {
    value
  }
  quantity {
    value
  }
  template {
    node {
      id
      ...TemplateDeviceFields
    }
  }
}

fragment SpineInterfaceFields on DcimPhysicalInterface {
  id
  name { value }
  cable {
    node {
      id
      name { value }
    }
  }
}

fragment SpineDeviceFields on DcimPhysicalDevice {
  id
  name { value }
  role { value }
  interfaces(role__value: "downlink") {
    edges {
      node {
        ...SpineInterfaceFields
      }
    }
  }
}

fragment PodFields on TopologyPod {
  id
  name {
    value
  }
  index {
    value
  }
  deployment_type { value }
  layout { value }
  parent {
    node {
      ... on TopologyDataCenter {
        id
        name {
          value
        }
        index {
          value
        }
        naming_convention {
          value
        }
        fabric_interface_sorting_method {
          value
        }
        connectivity_mode {
          value
        }
        management_mode {
          value
        }
        routing_strategy {
          value
        }
        underlay_protocol {
          value
        }
        management_pool {
          node {
            id
            name { value }
          }
        }
        size { value }
      }
    }
  }
  fabric_templates {
    edges {
      node {
        role { value }
        quantity { value }
        device_type { node { id } }
      }
    }
  }
  leaf_interface_sorting_method {
    value
  }
  spine_interface_sorting_method {
    value
  }
  mlag_create {
    value
  }
  loopback_pool {
    node {
      id
    }
  }
  prefix_pool {
    node {
      id
    }
  }
  asn_pool {
    node {
      id
      name { value }
    }
  }
  # Spine (or border-spine, in micro-fabric mode — the two fill the same
  # pod slot, see PodModel.spine_slot_templates) devices with cable info —
  # used by rack generator to detect already-cabled spine ports and avoid
  # duplicate relationship upserts
  devices(role__values: ["spine", "border-spine"]) {
    edges {
      node {
        ...SpineDeviceFields
      }
    }
  }
}

query RackGenerator($name: String) {
  LocationRack(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        index {
          value
        }
        rack_type {
          value
        }
        row_index {
          value
        }
        parent {
          node {
            ... on LocationSuite {
              index {
                value
              }
            }
          }
        }
        leafs: fabric_templates(role__value: "leaf") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        tors: fabric_templates(role__value: "tor") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        l2_leafs: fabric_templates(role__value: "l2-leaf") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        access_leafs: fabric_templates(role__value: "access-leaf") {
          edges {
            node {
              ...FabricTemplateFields
            }
          }
        }
        pod {
          node {
            ...PodFields
          }
        }
      }
    }
  }
}
