# add_app_dependency: a dependency created or changed after its application
# re-runs that application's rule reconciliation. Only the application has to
# be found here; the rules are built from the application query
# (application.gql), which reads every dependency through depends_on.
#   - a component source reconciles the source component's application
#   - an access-profile source reconciles the target endpoint's application
query app_dependency($name: String!) {
  AppDependency(name__value: $name) {
    edges {
      node {
        id
        name { value }
        source {
          node {
            id
            ... on AppComponent {
              name { value }
              parent {
                node {
                  ... on AppApplication {
                    name { value }
                  }
                }
              }
            }
          }
        }
        source_profile {
          node {
            id
            name { value }
          }
        }
        target {
          node {
            id
            ... on AppEndpoint {
              name { value }
              parent {
                node {
                  ... on AppComponent {
                    parent {
                      node {
                        ... on AppApplication {
                          name { value }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
