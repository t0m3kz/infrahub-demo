# The node's groups are NOT read here: the server makes every node of a generator query's result a member of
# its query group, and a group that joins it is reported as a new member of that group, which starts the
# group's generators for the query group (data/events/99_group_triggers.yml). The generator reads them itself.
query customer_deployment_orchestrator_routing($name: String!) {
  TopologyCustomerDC(name__value: $name) {
    edges {
      node {
        id
        __typename
        name { value }
        infrastructure_orchestrator { value }
      }
    }
  }

  TopologyCustomerColocation(name__value: $name) {
    edges {
      node {
        id
        __typename
        name { value }
        infrastructure_orchestrator { value }
      }
    }
  }

  TopologyCustomerOffice(name__value: $name) {
    edges {
      node {
        id
        __typename
        name { value }
        infrastructure_orchestrator { value }
      }
    }
  }

  TopologyCustomerCloud(name__value: $name) {
    edges {
      node {
        id
        __typename
        name { value }
        infrastructure_orchestrator { value }
      }
    }
  }
}
