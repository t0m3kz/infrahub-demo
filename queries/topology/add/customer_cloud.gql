# add_customer_deployment_cloud: the footprint's customer, its routed range design (the customer's cloud pool is carved
# from it) and its account and region (the virtual networks whose attachments get a /29 slice of that pool)
# (generators/topology/customer_cloud.py, cloud_range.py). A cloud design has no IPv6 or segment-size numbers.
query customer_cloud($name: String!) {
  TopologyCustomerCloud(name__value: $name) {
    edges {
      node {
        id
        name { value }
        environment { value }
        owner { node { id org_id { value } } }
        parent { node { id name { value } } }
        account { node { id name { value } } }
        design { node { name { value } address_prefix_length { value } } }
      }
    }
  }
}
