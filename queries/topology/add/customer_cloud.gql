query customer_cloud($name: String!) {
  TopologyCustomerCloud(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        environment {
          value
        }
        connection {
          value
        }
        owner {
          node {
            id
            org_id {
              value
            }
          }
        }
        parent {
          node {
            id
            name {
              value
            }
          }
        }
        account {
          node {
            id
            name {
              value
            }
          }
        }
        design {
          node {
            name {
              value
            }
            address_prefix_length {
              value
            }
          }
        }
      }
    }
  }
  CloudGateway(gateway_type__value: "hub") {
    edges {
      node {
        id
        name {
          value
        }
        gateway_type {
          value
        }
        region {
          node {
            id
          }
        }
        account {
          node {
            id
            environment {
              value
            }
          }
        }
        attachments {
          edges {
            node {
              id
              name {
                value
              }
              peer_gateway {
                node {
                  id
                }
              }
              associated_route_table {
                node {
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}
