query topology_dc($name: String!) {
  TopologyDeployment(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        ... on TopologyDataCenter {
          index {
            value
          }
          naming_convention { value }
          connectivity_mode { value }
          routing_strategy { value }
          underlay_protocol { value }
          size { value }
          loopback_pool {
            node {
              id
              name { value }
            }
          }
          technical_pool {
            node {
              id
              name { value }
            }
          }
          management_pool {
            node {
              id
              name { value }
            }
          }
          fabric_asn_pool {
            node {
              id
              name { value }
            }
          }
          children {
            edges {
              node {
                id
              }
            }
          }
          fabric_controllers: controllers(controller_type__values: ["aci_apic", "dcnm", "nsx_manager", "ucs_manager"]) {
            edges {
              node {
                id
                controller_type { value }
              }
            }
          }
          security_manager_controllers: controllers(controller_type__value: "security_manager") {
            edges {
              node {
                id
                controller_type { value }
                ... on DcimDevice {
                  platform {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
          lb_manager_controllers: controllers(controller_type__value: "lb_manager") {
            edges {
              node {
                id
                controller_type { value }
                ... on DcimDevice {
                  platform {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
          fabric_templates {
            edges {
              node {
                role { value }
                quantity { value }
                template {
                  node {
                    id
                    ... on TemplateDcimPhysicalDevice {
                      template_name { value }
                      platform {
                        node {
                          id
                          name { value }
                        }
                      }
                      device_type {
                        node {
                          id
                        }
                      }
                      interfaces {
                        edges {
                          node {
                            name { value }
                            role { value }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
