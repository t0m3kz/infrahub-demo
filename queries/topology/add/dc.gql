query topology_dc($name: String!) {
  TopologyDeployment(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        ... on TopologyDataCenter {
          index {
            value
          }
          naming_convention { value }
          connectivity_mode { value }
          management_mode { value }
          design {
            node {
              id
              routing_strategy { value }
              underlay_protocol { value }
              max_pods { value }
              max_super_spines_per_fabric { value }
              max_spines_per_pod { value }
              max_border_leafs_per_fabric { value }
              loopback_prefix_length { value }
              technical_prefix_length { value }
              management_prefix_length { value }
            }
          }
          loopback_pool {
            node {
              id
              name { value }
            }
          }
          technical_pool {
            node {
              id
              name { value }
            }
          }
          management_pool {
            node {
              id
              name { value }
            }
          }
          fabric_asn_pool {
            node {
              id
              name { value }
            }
          }
          children {
            edges {
              node {
                id
              }
            }
          }
          fabric_templates {
            edges {
              node {
                role { value }
                quantity { value }
                template {
                  node {
                    id
                    ... on TemplateDcimPhysicalDevice {
                      template_name { value }
                      platform {
                        node {
                          id
                        }
                      }
                      device_type {
                        node {
                          id
                        }
                      }
                      interfaces {
                        edges {
                          node {
                            name { value }
                            role { value }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
