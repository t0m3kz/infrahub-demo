query topology_dc($name: String!) {
  TopologyDeployment(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        ... on TopologyDataCenter {
          index {
            value
          }
          naming_convention { value }
          connectivity_mode { value }
          management_mode { value }
          routing_strategy { value }
          underlay_protocol { value }
          size { value }
          loopback_pool {
            node {
              id
              name { value }
            }
          }
          technical_pool {
            node {
              id
              name { value }
            }
          }
          management_pool {
            node {
              id
              name { value }
            }
          }
          fabric_asn_pool {
            node {
              id
              name { value }
            }
          }
          children {
            edges {
              node {
                id
              }
            }
          }
          fabric_templates {
            edges {
              node {
                role { value }
                quantity { value }
                device_type {
                  node {
                    id
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
