query topology_dc($name: String!) {
  TopologyDeployment(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        ... on TopologyDataCenter {
          index {
            value
          }
          naming_convention { value }
          connectivity_mode { value }
          routing_strategy { value }
          underlay_protocol { value }
          # The DC's fabric envelope and that of every pod design it may host:
          # the DC pools are sized for the widest of them (generators/fabric_sizing.py).
          design {
            node {
              name { value }
              max_pods { value }
              max_super_spines_per_fabric { value }
              max_hyper_spines_per_fabric { value }
              max_border_leafs_per_fabric { value }
              pod_templates {
                edges {
                  node {
                    id
                    name { value }
                    max_rows { value }
                    max_compute_racks_per_row { value }
                    max_network_racks_per_row { value }
                    max_leafs_per_network_rack { value }
                    max_tors_per_compute_rack { value }
                    max_spines_per_pod { value }
                    max_border_leafs_per_pod { value }
                  }
                }
              }
            }
          }
          loopback_pool {
            node {
              id
              name { value }
            }
          }
          technical_pool {
            node {
              id
              name { value }
            }
          }
          management_pool {
            node {
              id
              name { value }
            }
          }
          fabric_asn_pool {
            node {
              id
              name { value }
            }
          }
          # Read so a re-run whose pool and fabric AS references are all in place writes nothing
          # (PoolMixin.attach_refs ``current``).
          vni_pool {
            node {
              id
              name { value }
            }
          }
          evpn_rt_as {
            node {
              id
              asn { value }
            }
          }
          # The DC's pods (the only children it has): read, never saved. Their design is matched to the DC
          # design's pod_templates to size the border-leaf placement, and the cascade fans out to them.
          children {
            edges {
              node {
                id
                ... on TopologyPod {
                  name { value }
                  index { value }
                  design {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
          fabric_controllers: controllers(controller_type__values: ["aci_apic", "dcnm", "nsx_manager", "ucs_manager"]) {
            edges {
              node {
                id
                controller_type { value }
              }
            }
          }
          security_manager_controllers: controllers(controller_type__value: "security_manager") {
            edges {
              node {
                id
                controller_type { value }
                ... on DcimDevice {
                  platform {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
          lb_manager_controllers: controllers(controller_type__value: "lb_manager") {
            edges {
              node {
                id
                controller_type { value }
                ... on DcimDevice {
                  platform {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
          fabric_templates {
            edges {
              node {
                role { value }
                quantity { value }
                template {
                  node {
                    id
                    ... on TemplateDcimPhysicalDevice {
                      platform {
                        node {
                          id
                          name { value }
                        }
                      }
                      device_type {
                        node {
                          id
                        }
                      }
                      interfaces {
                        edges {
                          node {
                            name { value }
                            role { value }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
