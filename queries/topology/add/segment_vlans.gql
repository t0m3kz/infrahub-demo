# Per-segment desired state for ManagedSegmentVlan reconciliation
# (generators/segment_vlan.py, SegmentPortTagMixin.reconcile_vxlan_segment),
# shared by add_vxlan_segment and add_app_component_segment. Read by id from
# Python, not a generator definition's own query.
#   - ManagedSegmentDeployment: the segment's realization in each DC or metro
#     (deployment = the hosting parent, an office included) and, under it, the
#     rows that exist today. A row is a child of the deployment its switch
#     sits in, so a device is mapped to a deployment through its own
#     `deployment` (the hosting parent or one of its children, see
#     _device_deployment_ids).
#   - DcimPhysicalInterface / DcimLAGInterface (segments__ids): the switch ports carrying the segment, read from the
#     port (the edge is one-sided); their devices need a row. `properties { source { id } }` is who wrote the
#     port's edge to this segment (none: a person did): the reconcile removes only its own. The reader takes the
#     ports from the raw response, because clean_data drops `properties`.
#   - each row's device (the devices whose VRF instances and SVIs follow the rows).
#   - stretch_scope + customer_deployments' hosting parents: a stretched
#     segment's border gateways need it too (same shape as vxlan_segment.gql)
#   - terminated_on: the firewall context terminating the segment and its members' uplinks with their cables: the
#     border service ports (role firewall) those are cabled to face its HA pair (utils/service_contexts.py
#     member_border_ports: a context has no interface edge) and carry the segment as a VLAN like a customer port does
#     (SegmentPortTagMixin).
query segment_vlans($segment_id: ID!) {
  ManagedVxlanSegment(ids: [$segment_id]) {
    edges {
      node {
        id
        stretch_scope { value }
        vlan_scope { value }
        terminated_on {
          node {
            id
            shared_devices {
              edges {
                node {
                  __typename
                  id
                  name { value }
                  role { value }
                  ... on DcimDevice {
                    interfaces(role__values: ["uplink"]) {
                      edges {
                        node {
                          __typename
                          id
                          name { value }
                          role { value }
                          ...ServiceMemberCableFields
                          ... on DcimVirtualInterface {
                            parent_interface { node { id ...ServiceMemberCableFields } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        customer_deployments {
          edges {
            node {
              id
              ... on TopologyCustomerDC {
                parent {
                  node {
                    id
                    ... on TopologyDataCenter {
                      children { edges { node { ... on TopologyPod { id } } } }
                    }
                  }
                }
              }
              ... on TopologyCustomerColocation {
                # id alone fails server-side ("Unable to identify the type of
                # the instance"); select a field, as vxlan_segment.gql does.
                # The edges are deployed into the metro's zones and virtual
                # colocations, not the metro (generators/segment_vlan.py's
                # _device_deployment_ids).
                parent {
                  node {
                    id
                    name { value }
                    ... on TopologyColocationMetro {
                      children {
                        edges {
                          node {
                            ... on TopologyColocationZone { id }
                            ... on TopologyVirtualColocation { id }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  ManagedSegmentDeployment(segment__ids: [$segment_id]) {
    edges {
      node {
        id
        vni { value }
        deployment { node { id } }
        vlans {
          edges {
            node {
              id
              vlan_id { value }
              device { node { id } }
            }
          }
        }
      }
    }
  }
  DcimPhysicalInterface(segments__ids: [$segment_id]) {
    edges {
      node {
        id
        device { node { id } }
        segments(ids: [$segment_id]) {
          edges {
            properties { source { id } }
            node { id }
          }
        }
      }
    }
  }
  DcimLAGInterface(segments__ids: [$segment_id]) {
    edges {
      node {
        id
        device { node { id } }
        segments(ids: [$segment_id]) {
          edges {
            properties { source { id } }
            node { id }
          }
        }
      }
    }
  }
}
