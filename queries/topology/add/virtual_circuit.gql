query virtual_circuit_data($name: String!) {
  TopologySessionCircuit(name__value: $name) {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        status {
          value
        }
        circuit_type {
          value
        }
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        password {
          node {
            id
          }
        }
        capabilities {
          edges {
            node {
              id
              __typename
              name {
                value
              }
              ... on DcimPhysicalInterface {
                cable {
                  node {
                    id
                  }
                }
              }
              ... on DcimVirtualInterface {
                parent_interface {
                  node {
                    ... on DcimPhysicalInterface {
                      cable {
                        node {
                          id
                        }
                      }
                    }
                    capabilities {
                      edges {
                        node {
                          ...VirtualCircuitCarrier
                        }
                      }
                    }
                  }
                }
              }
              capabilities {
                edges {
                  node {
                    ...VirtualCircuitCarrier
                  }
                }
              }
              device {
                node {
                  id
                  __typename
                  name {
                    value
                  }
                  ... on DcimPhysicalDevice {
                    deployment {
                      node {
                        ...VirtualCircuitDeployment
                      }
                    }
                  }
                  ... on DcimVirtualDevice {
                    deployment {
                      node {
                        ...VirtualCircuitDeployment
                      }
                    }
                  }
                  ... on CloudNetworkAppliance {
                    deployment {
                      node {
                        ...VirtualCircuitDeployment
                      }
                    }
                  }
                  ... on DcimCapabilities {
                    capabilities {
                      edges {
                        node {
                          id
                          __typename
                          ... on ManagedBGP {
                            name {
                              value
                            }
                            process_role {
                              value
                            }
                          }
                        }
                      }
                    }
                  }
                  interfaces(role__values: ["loopback", "loopback-vtep"]) {
                    edges {
                      node {
                        id
                        __typename
                        name {
                          value
                        }
                        role {
                          value
                        }
                        ... on DcimVirtualInterface {
                          ip_address {
                            node {
                              address {
                                value
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment VirtualCircuitCarrier on ManagedGenericInterfaces {
  __typename
  ... on TopologyCarrierCircuit {
    id
    name {
      value
    }
    circuit_id {
      value
    }
    status {
      value
    }
  }
}

fragment VirtualCircuitDeployment on TopologyDeployment {
  __typename
  ... on TopologyDataCenter {
    name {
      value
    }
    underlay_protocol {
      value
    }
  }
}
