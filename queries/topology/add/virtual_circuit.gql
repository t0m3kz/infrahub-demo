# add_virtual_circuit (generators/topology/circuit.py). An overlay session runs
# between the two endpoint interfaces (capabilities) over their
# existing addresses, on each device's BGP process. The underlay is derived from
# the ports' own capabilities: the TopologyPhysicalCircuit peers found on each
# endpoint interface, whose add_circuit runs it waits for; an empty underlay builds
# no session yet.
query virtual_circuit_data($name: String!) {
  TopologyVirtualCircuit(name__value: $name) {
    edges {
      node {
        id
        name { value }
        status { value }
        link_type { value }
        peering_role { value }
        vni { value }
        tunnel_id { value }
        capabilities {
          edges {
            node {
              id
              name { value }
              __typename
              ... on DcimPhysicalInterface {
                ip_address { node { id address { value } } }
              }
              ... on DcimVirtualInterface {
                ip_address { node { id address { value } } }
              }
              capabilities {
                edges {
                  node {
                    __typename
                    ... on TopologyPhysicalCircuit {
                      id
                      name { value }
                      circuit_id { value }
                      status { value }
                    }
                  }
                }
              }
              device {
                node {
                  id
                  name { value }
                  ... on DcimPhysicalDevice {
                    deployment { node { ...VirtualCircuitDeployment } }
                  }
                  ... on DcimVirtualDevice {
                    deployment { node { ...VirtualCircuitDeployment } }
                  }
                  ... on CloudNetworkAppliance {
                    deployment { node { ...VirtualCircuitDeployment } }
                  }
                  ... on DcimCapabilities {
                    capabilities {
                      edges {
                        node {
                          id
                          __typename
                          ... on ManagedBGP {
                            name { value }
                            process_role { value }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment VirtualCircuitDeployment on TopologyDeployment {
  id
  __typename
  ... on TopologyDataCenter {
    name { value }
    underlay_protocol { value }
  }
}
