# add_app_component_segment: a component's instances or network_segment
# changed. Resolves each instance to the physical device it is actually
# cabled through (itself if physical, hosting_device if virtual) so
# AppInstanceSegmentGenerator can tag the exact switch interface it lands
# on — see generators/topology/app_instance_segment.py. The segment's
# __typename picks the reconcile: a VXLAN segment's tags and VLAN domain
# activations, nothing for a cloud segment.
query app_component_segment($fqdn: String!) {
  AppComponent(fqdn__value: $fqdn) {
    edges {
      node {
        id
        fqdn { value }
        network_segment {
          node {
            id
            __typename
            name { value }
            environment { value }
            # What ensure_segment_addressing reads (generators/topology/segment_addressing.py): the sizing, the
            # customer whose pool addresses the segment and the design of each footprint (vxlan_segment.gql selects
            # the same). The prefix of the gateway is how a changed host_count is detected.
            host_count { value }
            ip_version { value }
            owner { node { id org_id { value } } }
            security_zone { node { ...RoutingZoneFields } }
            gateway { node { id address { value } ip_prefix { node { id prefix { value } } } } }
            ... on ManagedVxlanSegment {
              customer_deployments {
                edges {
                  node {
                    id
                    __typename
                    name { value }
                    ... on TopologyCustomerDC {
                      design {
                        node {
                          id
                          name { value }
                          address_prefix_length { value }
                          segment_prefix_length { value }
                          ipv6_prefix_length { value }
                          ipv6_segment_prefix_length { value }
                        }
                      }
                    }
                    ... on TopologyCustomerColocation {
                      design {
                        node {
                          id
                          name { value }
                          address_prefix_length { value }
                          segment_prefix_length { value }
                          ipv6_prefix_length { value }
                          ipv6_segment_prefix_length { value }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        instances {
          edges {
            node {
              id
              __typename
              ... on DcimVirtualDevice {
                hosting_device {
                  node {
                    id
                  }
                }
              }
              ... on ManagedControllerVirtual {
                hosting_device {
                  node {
                    id
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
