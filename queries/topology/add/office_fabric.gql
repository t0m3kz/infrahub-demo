query topology_office_fabric($name: String!) {
  TopologyCustomerOffice(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        naming_convention {
          value
        }
        owner {
          node {
            id
            ... on OrganizationCustomer {
              name {
                value
              }
            }
          }
        }
        lan_prefixes {
          edges {
            node {
              id
            }
          }
        }
        sdwan_gateways {
          edges {
            node {
              id
              name {
                value
              }
              owner {
                node {
                  id
                  __typename
                }
              }
              ... on DcimPhysicalDevice {
                deployment {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
              }
              ... on DcimDevice {
                interfaces {
                  edges {
                    node {
                      __typename
                      id
                      name {
                        value
                      }
                      role {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        fabric_templates {
          edges {
            node {
              role {
                value
              }
              quantity {
                value
              }
              template {
                node {
                  id
                  template_name {
                    value
                  }
                  template_kind: __typename
                  ... on TemplateDcimPhysicalDevice {
                    platform {
                      node {
                        id
                        name {
                          value
                        }
                        os_capabilities {
                          node {
                            config_dialect {
                              value
                            }
                          }
                        }
                      }
                    }
                    device_type {
                      node {
                        id
                      }
                    }
                    interfaces {
                      edges {
                        node {
                          name {
                            value
                          }
                          role {
                            value
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
