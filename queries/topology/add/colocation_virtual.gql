# The kit a virtual colocation (provider-hosted presence) declares (fabric_templates), turned into devices by
# generators/topology/colocation_fabric.py. The pools it attaches are written, not
# read, so they are not selected. The parent metro supplies the naming convention
# and the ASN pool of its one EVPN site AS. Its own design (the envelope: most
# edges, firewalls and load balancers) and the metro's size the pools
# (generators/fabric_sizing.py); both are optional. template_kind is aliased deliberately:
# clean_data() strips "__" out of any key it finds, so a bare __typename would
# arrive as "typename". The generator reads template_kind to tell a physical
# template from a virtual one and to refuse the kind this node cannot host.
# Virtual templates only (a physical one is skipped by the generator, so it is not selected beyond its kind).
# A provider-hosted device is never cabled, so its template's interfaces are not read.
query topology_virtual_colocation($name: String!) {
  TopologyVirtualColocation(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        design {
          node {
            id
            name {
              value
            }
            max_edges {
              value
            }
            max_firewalls {
              value
            }
            max_load_balancers {
              value
            }
          }
        }
        parent {
          node {
            id
            name {
              value
            }
            ... on TopologyColocationMetro {
              naming_convention {
                value
              }
              fabric_asn_pool {
                node {
                  id
                  name {
                    value
                  }
                }
              }
              design {
                node {
                  id
                  name {
                    value
                  }
                  max_zones {
                    value
                  }
                  zone_templates {
                    edges {
                      node {
                        id
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        fabric_templates {
          edges {
            node {
              role {
                value
              }
              quantity {
                value
              }
              template {
                node {
                  id
                  template_kind: __typename
                  ... on TemplateDcimVirtualDevice {
                    template_name {
                      value
                    }
                    platform {
                      node {
                        id
                        name {
                          value
                        }
                      }
                    }
                    device_type {
                      node {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
