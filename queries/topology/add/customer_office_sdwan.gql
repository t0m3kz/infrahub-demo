query customer_office_sdwan($name: String!) {
  TopologyCustomerOffice(name__value: $name) {
    edges {
      node {
        id
        name { value }
        branch_to_branch { value }
        owner {
          node {
            id
            ... on OrganizationCustomer {
              name { value }
            }
          }
        }
        sdwan_gateway {
          node {
            id
            name { value }
            ... on DcimPhysicalDevice {
              deployment {
                node {
                  id
                  name { value }
                }
              }
            }
            interfaces {
              edges {
                node {
                  __typename
                  id
                  name { value }
                  role { value }
                }
              }
            }
          }
        }
      }
    }
  }
}
