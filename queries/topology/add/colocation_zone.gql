# The kit a colocation zone (cage) declares on its physical racks (fabric_templates or pre-created devices),
# turned into devices by generators/colocation/colocation_fabric.py.
query topology_colocation_zone($name: String!) {
  TopologyColocationZone(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        design {
          node {
            id
            name {
              value
            }
            max_edges {
              value
            }
            max_firewalls {
              value
            }
            max_load_balancers {
              value
            }
          }
        }
        parent {
          node {
            id
            name {
              value
            }
            ... on TopologyColocationMetro {
              naming_convention {
                value
              }
              fabric_asn_pool {
                node {
                  id
                  name {
                    value
                  }
                }
              }
              evpn_rt_as {
                node {
                  id
                }
              }
              design {
                node {
                  id
                  name {
                    value
                  }
                  max_zones {
                    value
                  }
                  zone_templates {
                    edges {
                      node {
                        id
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        racks {
          edges {
            node {
              id
              name {
                value
              }
              index {
                value
              }
              rack_type {
                value
              }
              fabric_templates {
                edges {
                  node {
                    role {
                      value
                    }
                    quantity {
                      value
                    }
                    template {
                      node {
                        id
                        template_kind: __typename
                        ... on TemplateDcimPhysicalDevice {
                          platform {
                            node {
                              id
                              name {
                                value
                              }
                            }
                          }
                          device_type {
                            node {
                              id
                            }
                          }
                          interfaces {
                            edges {
                              node {
                                name {
                                  value
                                }
                                role {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              devices {
                edges {
                  node {
                    id
                    name {
                      value
                    }
                    role {
                      value
                    }
                    ... on DcimPhysicalDevice {
                      object_template {
                        node {
                          ... on TemplateDcimPhysicalDevice {
                            interfaces {
                              edges {
                                node {
                                  name { value }
                                  role { value }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                    ... on DcimPhysicalDevice {
                      interfaces {
                        edges {
                          node {
                            name {
                              value
                            }
                            role {
                              value
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        devices {
          edges {
            node {
              id
              name {
                value
              }
              role {
                value
              }
              ... on DcimPhysicalDevice {
                object_template {
                        node {
                          ... on TemplateDcimPhysicalDevice {
                            interfaces {
                              edges {
                                node {
                                  name { value }
                                  role { value }
                                }
                              }
                            }
                          }
                        }
                      }
              }
              ... on DcimPhysicalDevice {
                interfaces {
                  edges {
                    node {
                      name {
                        value
                      }
                      role {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
