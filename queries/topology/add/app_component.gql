query app_component_data($name: String!) {
  AppComponent(slug__value: $name) {
    edges {
      node {
        id
        name { value }
        slug { value }
        component_type { value }
        network_segment {
          node {
            id
            name { value }
            __typename
          }
        }
        vip_service {
          node {
            id
            hostname { value }
            protocol { value }
            port { value }
            load_balancer {
              node {
                id
                name { value }
              }
            }
          }
        }
        instances {
          edges {
            node {
              id
              name { value }
              __typename
              ... on DcimPhysicalDevice {
                role { value }
              }
              ... on DcimVirtualDevice {
                role { value }
                hosting_device {
                  node {
                    id
                    name { value }
                  }
                }
              }
            }
          }
        }
        service_ports {
          edges {
            node {
              id
              name { value }
              port { value }
              port_end { value }
              protocol { value }
            }
          }
        }
      }
    }
  }
}
