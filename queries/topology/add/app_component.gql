# add_app_component: a component moved to another segment or changed its
# ports. It triggers add_app_application for its own application and for the
# other applications whose components call this one (their rules name its
# segment and ports too), and writes nothing itself; this payload only has to
# find those applications' ids.
query app_component($fqdn: String!) {
  AppComponent(fqdn__value: $fqdn) {
    edges {
      node {
        id
        fqdn { value }
        parent {
          node {
            id
            ... on AppApplication {
              name { value }
            }
          }
        }
        dependents {
          edges {
            node {
              id
              source {
                node {
                  id
                  ... on AppComponent {
                    parent {
                      node {
                        id
                        ... on AppApplication {
                          name { value }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
