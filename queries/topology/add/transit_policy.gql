query transit_policy($name: String!) {
  ManagedBGPPeering(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
      }
    }
  }
  public_origins: TopologySessionCircuit {
    edges {
      node {
        name {
          value
        }
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        originated_prefixes {
          edges {
            node {
              prefix {
                value
              }
            }
          }
        }
      }
    }
  }
}
