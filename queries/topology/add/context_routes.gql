# add_context_routes (generators/topology/context_routes.py): one service context, its legs and the border ports tagged with
# it. A virtual interface is a leg (its address gives the leg's /29, its namespace the VRF); a physical port or a LAG is a
# border service port, whose device holds the routes. Targeted by the context's name (unique across both kinds).
fragment FirewallContextRoutesFields on ManagedFirewallContext {
  id
  name { value }
  capabilities {
    edges {
      node {
        __typename
        id
        device { node { id name { value } } }
        ... on DcimVirtualInterface {
          ip_address {
            node {
              address { value }
              ip_namespace { node { id name { value } namespace_type { value } l3_vni { value } } }
            }
          }
        }
      }
    }
  }
}

fragment LoadbalancerContextRoutesFields on ManagedLoadbalancerContext {
  id
  name { value }
  capabilities {
    edges {
      node {
        __typename
        id
        device { node { id name { value } } }
        ... on DcimVirtualInterface {
          ip_address {
            node {
              address { value }
              ip_namespace { node { id name { value } namespace_type { value } l3_vni { value } } }
            }
          }
        }
      }
    }
  }
}

query context_routes($name: String!) {
  ManagedFirewallContext(name__value: $name) {
    edges {
      node {
        ...FirewallContextRoutesFields
        tenant { node { id } }
        snat_address { node { address { value } } }
      }
    }
  }
  ManagedLoadbalancerContext(name__value: $name) {
    edges {
      node {
        ...LoadbalancerContextRoutesFields
        vip_prefix { node { prefix { value } } }
      }
    }
  }
}
