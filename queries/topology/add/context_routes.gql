fragment FirewallContextRoutesFields on ManagedFirewallContext {
  id
  name {
    value
  }
  capabilities {
    edges {
      node {
        __typename
        id
        device {
          node {
            id
            name {
              value
            }
          }
        }
        ...InterfaceRoutingZoneFields
        ... on DcimVirtualInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          ip_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment LoadbalancerContextRoutesFields on ManagedLoadbalancerContext {
  id
  name {
    value
  }
  capabilities {
    edges {
      node {
        __typename
        id
        device {
          node {
            id
            name {
              value
            }
          }
        }
        ...InterfaceRoutingZoneFields
        ... on DcimVirtualInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          ip_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

query context_routes($name: String!) {
  ManagedFirewallContext(name__value: $name) {
    edges {
      node {
        ...FirewallContextRoutesFields
        tenant {
          node {
            id
          }
        }
        snat_address {
          node {
            address {
              value
            }
          }
        }
      }
    }
  }
  ManagedLoadbalancerContext(name__value: $name) {
    edges {
      node {
        ...LoadbalancerContextRoutesFields
        vip_prefix {
          node {
            prefix {
              value
            }
          }
        }
      }
    }
  }
}
