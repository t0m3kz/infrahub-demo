# Per-segment desired state for ManagedVlanDomainSegment reconciliation
# (generators/vlan_domain.py, SegmentPortTagMixin.reconcile_vxlan_segment),
# shared by add_vxlan_segment and add_app_component_segment. Read by id from
# Python, not a generator definition's own query.
#   - ManagedSegmentDeployment: the segment's realization in each DC or metro
#     (deployment = the hosting parent, an office included) and, under it, the
#     rows that exist today. A row is a child of the deployment its switch
#     sits in, so a device is mapped to a deployment through its own
#     `deployment` (the hosting parent or one of its children, see
#     _device_deployment_ids).
#   - switched_interfaces: the switch ports carrying the segment; their
#     devices need a row. The edge's peer is DcimSwitchedInterface
#     (a physical port or a LAG), so an inline DcimVirtualInterface
#     sub-interface on a firewall/LB HA pair (it takes the facing border
#     leaf's VLAN, it has no row) is never in it. role tells the
#     customer-facing ports from the border-leaf service ports.
#   - each row's device (the devices whose VRF instances and SVIs follow the rows).
#   - stretch_scope + customer_deployments' hosting parents: a stretched
#     segment's border gateways need it too (same shape as vxlan_segment.gql)
query segment_vlan_domains($segment_id: ID!) {
  ManagedVxlanSegment(ids: [$segment_id]) {
    edges {
      node {
        id
        stretch_scope { value }
        customer_deployments {
          edges {
            node {
              id
              ... on TopologyCustomerDC {
                parent {
                  node {
                    id
                    ... on TopologyDataCenter {
                      children { edges { node { ... on TopologyPod { id } } } }
                    }
                  }
                }
              }
              ... on TopologyCustomerColocation {
                # id alone fails server-side ("Unable to identify the type of
                # the instance"); select a field, as vxlan_segment.gql does.
                # The edges are deployed into the metro's zones and virtual
                # colocations, not the metro (generators/vlan_domain.py's
                # _device_deployment_ids).
                parent {
                  node {
                    id
                    name { value }
                    ... on TopologyColocationMetro {
                      children {
                        edges {
                          node {
                            ... on TopologyColocationZone { id }
                            ... on TopologyVirtualColocation { id }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        switched_interfaces {
          edges {
            node {
              id
              ... on DcimInterface {
                role { value }
                device { node { id } }
              }
            }
          }
        }
      }
    }
  }
  ManagedSegmentDeployment(segment__ids: [$segment_id]) {
    edges {
      node {
        id
        deployment { node { id } }
        vlan_domain_segments {
          edges {
            node {
              id
              vlan_id { value }
              device { node { id } }
            }
          }
        }
      }
    }
  }
}
