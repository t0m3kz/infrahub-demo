query lb_serving_contexts($ids: [ID!]!) {
  TopologyCustomerDC(ids: $ids) {
    edges {
      node {
        id
        serving_loadbalancer_context {
          node {
            id
            name {
              value
            }
            vip_prefix {
              node {
                id
                ip_namespace {
                  node {
                    id
                  }
                }
              }
            }
            capabilities {
              edges {
                node {
                  __typename
                  ...InterfaceRoutingZoneFields
                  ... on DcimVirtualInterface {
                    vrf {
                      node {
                        ...RoutingVrfFields
                      }
                    }
                    ip_address {
                      node {
                        ip_prefix {
                          node {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
