# One data center's segmentation matrix (transforms/topology/segmentation_matrix.py).
# Group IDs and contracts are fabric-wide, so most of it is the fleet: the
# reference fabric profile rows, every data center's devices (its own and
# its pods'; the transform keeps the VTEPs, utils/group_policy.site_vteps)
# for the policy-aware verdict of every site, every segment with its own
# rules and group tag (the contracts' source: every rule lives in its source
# segment's policy), and every component group tag with its component's
# segment. ``target`` is the data center the artifact is for.
query segmentation_matrix($id: ID) {
  target: TopologyDataCenter(ids: [$id]) {
    edges {
      node {
        id
        name { value }
      }
    }
  }

  DcimGroupPolicyProfile {
    edges {
      node {
        ...GroupPolicyProfileFields
      }
    }
  }

  TopologyDataCenter {
    edges {
      node {
        id
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  TopologyPod {
    edges {
      node {
        parent { node { id __typename } }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  ManagedNetworkSegment {
    edges {
      node {
        ...SegmentGroupPolicyFields
      }
    }
  }

  SecurityTag {
    edges {
      node {
        id
        name { value }
        group_id { value }
        components {
          edges {
            node {
              fqdn { value }
              network_segment { node { id } }
            }
          }
        }
      }
    }
  }
}
