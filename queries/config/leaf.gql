query leaf_config(
  $device: String!
) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name { value }
        role { value }
        platform {
          node {
            name { value }
            netmiko_device_type { value }
          }
        }
        primary_address {
          node {
            address { value }
            ip_namespace { node { name { value } } }
          }
        }
        tags {
          edges {
            node { name { value } }
          }
        }

        # Device Services (BGP, OSPF) with nested peerings
        ...DeviceCapabilitiesOnDeviceFields

        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...FirewallContextsOnDeploymentFields
              ...LoadbalancerVipsOnDeploymentFields
              ...EvpnRtAsOnDeploymentFields
            }
          }
        }

        # Interface Information
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ... on DcimPhysicalInterface {
                interface_type { value }
                mtu { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ... on DcimPhysicalInterface {
                            name { value }
                            ip_address {
                              node {
                                address { value }
                              }
                            }
                            device {
                              node {
                                name { value }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
              }

              ... on DcimLAGInterface {
                lag_id { value }
                lacp_mode { value }
                mtu { value }
                minimum_links { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                mlag_domain {
                  node {
                    id
                    name { value }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name { value }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
            }
          }
        }
      }
    }
  }

  # The fleet roots of queries/topology/segmentation_matrix.gql, minus its
  # target: the group contracts of the device's data center and the reference
  # fabric verdict of every site, for the NX-OS GPO block
  # (transforms/helpers/group_policy.vxlan_gpo_device_view). The device root
  # above must stay first (transforms/common.py _device_and_platform).
  DcimGroupPolicyProfile {
    edges {
      node {
        ...GroupPolicyProfileFields
      }
    }
  }

  TopologyDataCenter {
    edges {
      node {
        id
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  TopologyPod {
    edges {
      node {
        parent { node { id __typename } }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  ManagedNetworkSegment {
    edges {
      node {
        ...SegmentGroupPolicyFields
      }
    }
  }

  SecurityTag {
    edges {
      node {
        ...SecurityTagGroupPolicyFields
        ...SecurityTagPlacementFields
      }
    }
  }
}
