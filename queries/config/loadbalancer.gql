# A load balancer is a physical member of a shared ManagedLoadbalancerHA
# cluster or a dedicated virtual instance: the transform renders the first
# non-empty root (transforms/config/loadbalancer.py).
query loadbalancer_config($device: String!) {
  DcimPhysicalDevice(name__value: $device) {
    edges {
      node {
        ...LoadbalancerDeviceFields
      }
    }
  }
  DcimVirtualDevice(name__value: $device) {
    edges {
      node {
        ...LoadbalancerDeviceFields
      }
    }
  }
}
