query firewall_config(
  $device: String!
  $segment_status_values: [String!] = ["active", "provisioning"]
) {
  DcimPhysicalDevice(name__value: $device) {
    edges {
      node {
        name { value }
        platform {
          node {
            name { value }
            netmiko_device_type { value }
            napalm_driver { value }
            ansible_network_os { value }
          }
        }
        ... on DcimCapabilities {
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedGeneric {
                name { value }
                status { value }
              }
              ... on ManagedFirewallHA {
                group_id { value }
                mode { value }
                priority { value }
                preempt { value }
                ha_protocol { value }
                ha_timer { value }
                capabilities { edges { node { name { value } } } }
              }
            }
          }
        }
        }
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ... on DcimPhysicalInterface {
                ip_address { node { address { value } ip_namespace { node { name { value } } } } }
              }
              ... on DcimVirtualInterface {
                ip_address { node { address { value } ip_namespace { node { name { value } } } } }
                parent_interface { node { name { value } } }
              }
              ... on DcimLAGInterface {
                ip_address { node { address { value } ip_namespace { node { name { value } } } } }
              }
              interface_capabilities {
                edges {
                  node {
                    __typename
                    ...FirewallSegmentFields
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  SecurityZone {
    edges {
      node {
        name { value }
        trust_level { value }
        zone_type { value }
        description { value }
        network_segments {
          edges {
            node {
              id
              ... on ManagedVlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
              ... on ManagedVxlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
            }
          }
        }
      }
    }
  }

  SecurityPolicy {
    edges {
      node {
        id
        name { value }
        enabled { value }
        default_action { value }
        rules {
          edges {
            node {
              index { value }
              name { value }
              action { value }
              protocol { value }
              port_start { value }
              port_end { value }
              log { value }
              disabled { value }
              apply_on_switch { value }
              description { value }
              source_zone { node { name { value } } }
              destination_zone { node { name { value } } }
              source_segment {
                node {
                  id
                  security_zone { node { name { value } } }
                  security_tag { node { id name { value } } }
                  ... on ManagedVlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
                  ... on ManagedVxlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
                }
              }
              destination_segment {
                node {
                  id
                  security_zone { node { name { value } } }
                  security_tag { node { id name { value } } }
                  ... on ManagedVlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
                  ... on ManagedVxlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
                }
              }
              source_ip_addresses { edges { node { id address { value } } } }
              destination_ip_addresses { edges { node { id address { value } } } }
              source_prefixes { edges { node { id prefix { value } } } }
              destination_prefixes { edges { node { id prefix { value } } } }
              security_profile { node { name { value } } }
            }
          }
        }
      }
    }
  }

  SecurityTagRule {
    edges {
      node {
        source_tag { node { id name { value } } }
        destination_tag { node { id name { value } } }
        action { value }
      }
    }
  }
}

fragment FirewallSegmentFields on ManagedNetworkSegment {
  ... on ManagedVlanSegment {
    ...SegmentStatusFields
    ...SegmentDeploymentsActiveFields
    ...SegmentGatewayWithNamespaceFields
    ...SegmentSecurityZoneFields
  }
  ... on ManagedVxlanSegment {
    ...SegmentStatusFields
    arp_suppression { value }
    ...SegmentDeploymentsActiveFields
    ...SegmentGatewayWithNamespaceFields
    ...SegmentSecurityZoneFields
  }
}
