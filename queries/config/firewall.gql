query firewall_config(
  $device: String!
) {
  DcimPhysicalDevice(name__value: $device) {
    edges {
      node {
        name { value }
        platform {
          node {
            name { value }
            netmiko_device_type { value }
            napalm_driver { value }
            ansible_network_os { value }
          }
        }
        ... on DcimCapabilities {
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedGeneric {
                name { value }
                status { value }
              }
              ... on ManagedFirewallHA {
                group_id { value }
                mode { value }
                priority { value }
                preempt { value }
                ha_protocol { value }
                ha_timer { value }
                capabilities { edges { node { name { value } } } }
              }
            }
          }
        }
        }
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ... on DcimPhysicalInterface {
                ip_address { node { address { value } ip_namespace { node { name { value } namespace_type { value } } } } }
              }
              ... on DcimVirtualInterface {
                ip_address { node { address { value } ip_namespace { node { name { value } namespace_type { value } } } } }
                parent_interface { node { name { value } } }
              }
              ... on DcimLAGInterface {
                ip_address { node { address { value } ip_namespace { node { name { value } namespace_type { value } } } } }
              }
              interface_capabilities {
                edges {
                  node {
                    __typename
                    ...NetworkSegmentFields
                    # The segment's other interfaces: on an HA pair terminating
                    # it inline, the secondary member's own address is the
                    # ASA `standby` address (transforms/helpers/ha.py).
                    ... on ManagedVxlanSegment { ...InlineSegmentMemberFields }
                    ... on ManagedVlanSegment { ...InlineSegmentMemberFields }
                    # A context-less firewall also enforces the rules of
                    # every segment in a zone bound on one of its interfaces:
                    # it routes that zone's CIDRs through the leg
                    # (transforms/helpers/firewall.py place_policies_in_contexts).
                    ... on ManagedNetworkSegment {
                      security_zone {
                        node {
                          network_segments { edges { node { id ...SegmentRulesFields } } }
                        }
                      }
                    }
                    ... on TopologyRoutedExchange { ...ExchangeGatewayInterfaceCapabilityFields }
                    ... on ManagedFirewallContext {
                      id
                      name { value }
                      context_id { value }
                      vlan_id { value }
                      tenant {
                        node {
                          id
                          ... on TopologyCustomerDC { name { value } }
                          ... on TopologyCustomerColocation { name { value } }
                        }
                      }
                      # The segments terminating on this context: every
                      # segment of a deployment it serves. Its rule table is
                      # their rules and the rules into them.
                      served_deployments {
                        edges {
                          node {
                            id
                            ... on TopologyCustomer {
                              network_segments {
                                edges {
                                  node {
                                    id
                                    ...SegmentRulesFields
                                    # Own gateway prefix and zone: the context's
                                    # routes (apply_context_routes) read these,
                                    # not the SecurityZone root.
                                    ... on ManagedNetworkSegment {
                                      gateway { node { ip_prefix { node { prefix { value } } } } }
                                      security_zone { node { name { value } } }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  # Every zone with its member CIDRs: the address objects and the static
  # routes behind each zone leg (get_firewall_zones / get_firewall_static_routes).
  SecurityZone {
    edges {
      node {
        name { value }
        trust_level { value }
        description { value }
        network_segments {
          edges {
            node {
              id
              ... on ManagedVlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
              ... on ManagedVxlanSegment { name { value } gateway { node { ip_prefix { node { prefix { value } } } } } }
            }
          }
        }
      }
    }
  }
}
