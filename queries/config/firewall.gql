query firewall_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        id
        name {
          value
        }
        ... on DcimDeviceManaged {
          role {
            value
          }
          platform {
            node {
              name {
                value
              }
            }
          }
        }
        ...DeviceSharedCapabilitiesOnDeviceFields
        ... on DcimDeviceManaged {
          capabilities {
            edges {
              node {
                __typename
                ... on ManagedFirewallHA {
                  name {
                    value
                  }
                  status {
                    value
                  }
                  group_id {
                    value
                  }
                  mode {
                    value
                  }
                  priority {
                    value
                  }
                  preempt {
                    value
                  }
                  ha_protocol {
                    value
                  }
                  ha_timer {
                    value
                  }
                  capabilities {
                    edges {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              name {
                value
              }
              description {
                value
              }
              status {
                value
              }
              role {
                value
              }
              ...FirewallFacingCableFields
              ...InterfaceRoutingZoneFields
              ... on DcimPhysicalInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                parent_interface {
                  node {
                    name {
                      value
                    }
                    ...FirewallFacingCableFields
                  }
                }
              }
              ... on DcimLAGInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
              ...FirewallInterfaceZoneFields
            }
          }
        }
      }
    }
  }
  SecurityZone(name__value: "MANAGEMENT") {
    edges {
      node {
        ...FirewallZoneFields
      }
    }
  }
}
