query super_spine_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        id
        name {
          value
        }
        ... on DcimDeviceManaged {
          role {
            value
          }
          platform {
            node {
              name {
                value
              }
            }
          }
          primary_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
          tags {
            edges {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        ...DeviceCapabilitiesOnDeviceFields
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...EvpnRtAsOnDeploymentFields
            }
          }
        }
        interfaces {
          edges {
            node {
              id
              name {
                value
              }
              description {
                value
              }
              status {
                value
              }
              role {
                value
              }
              ...InterfaceRoutingZoneFields
              ...InterfaceEncapsulationFields
              ... on DcimPhysicalInterface {
                interface_type {
                  value
                }
                mtu {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ...InterfaceRoutingZoneFields
                          ... on DcimPhysicalInterface {
                            name {
                              value
                            }
                            ip_address {
                              node {
                                address {
                                  value
                                }
                              }
                            }
                            device {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimLAGInterface {
                lag_id {
                  value
                }
                lacp_mode {
                  value
                }
                mtu {
                  value
                }
                minimum_links {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesOnInterfaceFields
            }
          }
        }
      }
    }
  }
  DcimVirtualInterface(role__value: "multisite-vip") {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        ip_address {
          node {
            address {
              value
            }
          }
        }
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
            interfaces(role__values: ["loopback", "loopback-vtep"]) {
              edges {
                node {
                  role {
                    value
                  }
                  ...InterfaceRoutingZoneFields
                  ... on DcimVirtualInterface {
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                  ... on DcimPhysicalInterface {
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  environment_segments: ManagedNetworkSegment {
    edges {
      node {
        ...SegmentRoutingPrefixFields
      }
    }
  }
  environment_zones: SecurityZone {
    edges {
      node {
        ...EnvironmentRoutingZoneFields
      }
    }
  }
  ManagedVRF {
    edges {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              name {
                value
              }
              ... on DcimDeviceManaged {
                role {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  ManagedVxlanSegment {
    edges {
      node {
        id
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        gateway {
          node {
            ip_prefix {
              node {
                prefix {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
