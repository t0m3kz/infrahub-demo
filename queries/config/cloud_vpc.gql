query cloud_vpc_config($account: String!) {
  CloudVirtualNetwork(account__name__value: $account) {
    edges {
      node {
        id
        name {
          value
        }
        dns_support {
          value
        }
        dns_hostnames {
          value
        }
        account {
          node {
            name {
              value
            }
            account_id {
              value
            }
            environment {
              value
            }
            provider {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        region {
          node {
            name {
              value
            }
          }
        }
        cidr_blocks {
          edges {
            node {
              prefix {
                value
              }
            }
          }
        }
        network_segments {
          edges {
            node {
              id
              name {
                value
              }
              auto_assign_public_ip {
                value
              }
              cidr_block {
                value
              }
              # The segment's policy rules (own egress + inbound), rendered as
              # its security group. Top-level spread only: a named spread
              # inside an inline fragment would not resolve.
              ...SegmentRulesFields
              availability_zone {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  CloudInstance(account__name__value: $account) {
    edges {
      node {
        id
        name {
          value
        }
        instance_type {
          value
        }
        image {
          value
        }
        os_type {
          value
        }
        private_ip {
          value
        }
        public_ip {
          value
        }
        network_segment {
          node {
            name {
              value
            }
            virtual_network {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        availability_zone {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
  CloudTransitGateway(account__name__value: $account) {
    edges {
      node {
        id
        name {
          value
        }
        default_route_table {
          value
        }
        dns_support {
          value
        }
        vpn_ecmp_support {
          value
        }
        region {
          node {
            name {
              value
            }
          }
        }
        attached_virtual_networks {
          edges {
            node {
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  CloudDirectConnect(account__name__value: $account) {
    edges {
      node {
        id
        name {
          value
        }
        bandwidth {
          value
        }
        connection_type {
          value
        }
        vlan_id {
          value
        }
        region {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
  CloudVirtualInterface {
    edges {
      node {
        id
        name {
          value
        }
        vlan_id {
          value
        }
        direct_connect {
          node {
            name {
              value
            }
          }
        }
        virtual_network {
          node {
            name {
              value
            }
          }
        }
        transit_gateway {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
}
