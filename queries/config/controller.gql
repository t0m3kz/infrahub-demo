query controller_payload($controller: String!) {
  ManagedController(name__value: $controller) {
    edges {
      node {
        __typename
        id
        name { value }
        controller_type { value }
        ... on DcimDevice {
          platform {
            node {
              id
              name { value }
            }
          }
        }
        managed_devices {
          edges {
            node {
              __typename
              id
              name { value }
              role { value }
              status { value }
              primary_address {
                node {
                  address { value }
                }
              }
              # VRF handoffs (eBGP whose local address sits in a tenant
              # namespace) — the Orchestrator configures the SD-WAN gateway
              # side, so the VCO payload carries them.
              ... on DcimCapabilities {
                capabilities {
                  edges {
                    node {
                      __typename
                      ... on ManagedGeneric {
                        name { value }
                        status { value }
                      }
                      ...ManagedBGPServiceFields
                    }
                  }
                }
              }
              ... on DcimPhysicalDevice {
                deployment {
                  node {
                    ... on TopologyCustomerOffice {
                      branch_to_branch { value }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
