query loadbalancer_cloud($instance: String!) {
  CloudLoadBalancer(name__value: $instance) {
    edges {
      node {
        id
        name { value }
        lb_type { value }
        scheme { value }
        dns_names { value }
        virtual_network {
          node {
            id
            name { value }
            account {
              node {
                name { value }
                provider {
                  node { name { value } }
                }
              }
            }
          }
        }
        network_segments {
          edges {
            node {
              id
              name { value }
              availability_zone {
                node { name { value } }
              }
            }
          }
        }
      }
    }
  }

  LoadbalancerVIP(load_balancer__name__value: $instance) {
    edges {
      node {
        id
        hostname { value }
        protocol { value }
        port { value }
        ssl_certificate { value }
        load_balancing_algorithm { value }
        session_persistence { value }
        # The targets of a cloud listener are cloud instances (a physical or virtual device belongs to an on-prem VIP).
        pool_members {
          edges {
            node {
              __typename
              ... on CloudInstance {
                name { value }
                cloud_id { value }
                private_ip { value }
              }
            }
          }
        }
        health_checks {
          edges {
            node {
              check { value }
              rise { value }
              fall { value }
              timeout { value }
            }
          }
        }
      }
    }
  }
}
