query distribution_switch_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        ... on DcimDeviceManaged {
          role {
            value
          }
          platform {
            node {
              name {
                value
              }
            }
          }
          primary_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
          tags {
            edges {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        ...DeviceCapabilitiesOnDeviceFields
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...SwitchDeploymentFields
              ...LispSiteOnOfficeFields
              ...SegmentDeploymentsOnDeploymentFields
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              name {
                value
              }
              description {
                value
              }
              status {
                value
              }
              role {
                value
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
              ...InterfaceRoutingZoneFields
              ... on DcimPhysicalInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                interface_type {
                  value
                }
                mtu {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ...InterfaceRoutingZoneFields
                          ... on DcimPhysicalInterface {
                            vrf {
                              node {
                                ...RoutingVrfFields
                              }
                            }
                            name {
                              value
                            }
                            ip_address {
                              node {
                                address {
                                  value
                                }
                              }
                            }
                            device {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vlan_id {
                  value
                }
                device {
                  node {
                    id
                  }
                }
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                parent_interface {
                  node {
                    name {
                      value
                    }
                    device {
                      node {
                        id
                      }
                    }
                  }
                }
              }
              ... on DcimLAGInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                lag_id {
                  value
                }
                lacp_mode {
                  value
                }
                mtu {
                  value
                }
                minimum_links {
                  value
                }
                mlag_domain {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  DeviceServices: DcimDeviceManaged(name__value: $device) {
    edges {
      node {
        ...DeviceServicesFields
      }
    }
  }
}
