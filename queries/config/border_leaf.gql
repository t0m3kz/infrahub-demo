query border_leaf_config(
  $device: String!
) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name { value }
        role { value }
        platform {
          node {
            name { value }
          }
        }
        primary_address {
          node {
            address { value }
            ip_namespace { node { name { value } } }
          }
        }
        tags {
          edges {
            node { name { value } }
          }
        }

        # Device Services (BGP, OSPF) with nested peerings
        ...DeviceCapabilitiesOnDeviceFields

        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...EvpnRtAsOnDeploymentFields
              ...FirewallContextsOnDeploymentFields
              ...SegmentDeploymentsOnDeploymentFields
            }
          }
        }

        # Interface Information
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
              ... on DcimPhysicalInterface {
                interface_type { value }
                mtu { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ... on DcimPhysicalInterface {
                            name { value }
                            ip_address {
                              node {
                                address { value }
                              }
                            }
                            device {
                              node {
                                name { value }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                parent_interface { node { name { value } } }
              }

              ... on DcimLAGInterface {
                lag_id { value }
                lacp_mode { value }
                mtu { value }
                minimum_links { value }
                mlag_domain { node { id name { value } } }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name { value }
                    }
                  }
                }
              }

            }
          }
        }
      }
    }
  }

  # The fleet roots (the same in leaf.gql, border_leaf.gql and border_spine.gql):
  # the group contracts of the device's data center and the reference
  # fabric verdict of every site, for the NX-OS GPO block
  # (transforms/helpers/group_policy.group_policy_device_view). The device root
  # above must stay first (transforms/common.py _device_and_platform).
  DcimGroupPolicyProfile {
    edges {
      node {
        ...GroupPolicyProfileFields
      }
    }
  }

  TopologyDataCenter {
    edges {
      node {
        id
        name { value }
        group_policy_enforce { value }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  TopologyPod {
    edges {
      node {
        parent { node { id __typename } }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }

  ManagedNetworkSegment {
    edges {
      node {
        ...SegmentGroupPolicyFields
      }
    }
  }

  SecurityTag {
    edges {
      node {
        ...SecurityTagGroupPolicyFields
        ...SecurityTagPlacementFields
      }
    }
  }

  # The EVPN Multi-Site VIPs of the model and the loopbacks of the border gateways that carry them: the far end
  # of a fabric or DCI session and the VIPs every underlay session may carry
  # (transforms/helpers/bgp_facts.py). A handful of interfaces, however large the fleet.
  DcimVirtualInterface(role__value: "multisite-vip") {
    edges {
      node {
        ip_address { node { address { value } } }
        device {
          node {
            name { value }
            role { value }
            interfaces(role__values: ["loopback", "loopback-vtep"]) {
              edges {
                node {
                  role { value }
                  ... on DcimVirtualInterface { ip_address { node { address { value } } } }
                  ... on DcimPhysicalInterface { ip_address { node { address { value } } } }
                }
              }
            }
          }
        }
      }
    }
  }
}
