query border_leaf_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        ... on DcimDeviceManaged {
          role {
            value
          }
          platform {
            node {
              name {
                value
              }
            }
          }
          primary_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
          tags {
            edges {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        ...DeviceCapabilitiesOnDeviceFields
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...SwitchDeploymentFields
              ...SegmentDeploymentsOnDeploymentFields
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              name {
                value
              }
              description {
                value
              }
              status {
                value
              }
              role {
                value
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
              ...InterfaceRoutingZoneFields
              ... on DcimPhysicalInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                interface_type {
                  value
                }
                mtu {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ...InterfaceRoutingZoneFields
                          ... on DcimPhysicalInterface {
                            vrf {
                              node {
                                ...RoutingVrfFields
                              }
                            }
                            name {
                              value
                            }
                            ip_address {
                              node {
                                address {
                                  value
                                }
                              }
                            }
                            device {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vlan_id {
                  value
                }
                device {
                  node {
                    id
                  }
                }
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                parent_interface {
                  node {
                    name {
                      value
                    }
                    device {
                      node {
                        id
                      }
                    }
                  }
                }
              }
              ... on DcimLAGInterface {
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                lag_id {
                  value
                }
                lacp_mode {
                  value
                }
                mtu {
                  value
                }
                minimum_links {
                  value
                }
                mlag_domain {
                  node {
                    id
                    name {
                      value
                    }
                  }
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  DcimGroupPolicyProfile {
    edges {
      node {
        ...GroupPolicyProfileFields
      }
    }
  }
  TopologyDataCenter {
    edges {
      node {
        id
        name {
          value
        }
        group_policy_enforce {
          value
        }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }
  TopologyPod {
    edges {
      node {
        parent {
          node {
            id
            __typename
          }
        }
        devices {
          edges {
            node {
              ...DeviceGroupPolicyFields
            }
          }
        }
      }
    }
  }
  ManagedNetworkSegment {
    edges {
      node {
        ...SegmentGroupPolicyFields
      }
    }
  }
  SecurityTag {
    edges {
      node {
        ...SecurityTagGroupPolicyFields
        ...SecurityTagPlacementFields
      }
    }
  }
  DcimVirtualInterface(role__value: "multisite-vip") {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        ip_address {
          node {
            address {
              value
            }
          }
        }
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
            interfaces(role__values: ["loopback", "loopback-vtep"]) {
              edges {
                node {
                  role {
                    value
                  }
                  ...InterfaceRoutingZoneFields
                  ... on DcimVirtualInterface {
                    vrf {
                      node {
                        ...RoutingVrfFields
                      }
                    }
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                  ... on DcimPhysicalInterface {
                    vrf {
                      node {
                        ...RoutingVrfFields
                      }
                    }
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  environment_segments: ManagedNetworkSegment {
    edges {
      node {
        ...SegmentRoutingPrefixFields
      }
    }
  }
  environment_zones: SecurityZone {
    edges {
      node {
        ...EnvironmentRoutingZoneFields
      }
    }
  }
  ManagedVRF {
    edges {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              name {
                value
              }
              ... on DcimDeviceManaged {
                role {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  ManagedVxlanSegment {
    edges {
      node {
        id
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        gateway {
          node {
            ip_prefix {
              node {
                prefix {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  DeviceServices: DcimDeviceManaged(name__value: $device) {
    edges {
      node {
        ...DeviceServicesFields
      }
    }
  }
}
