query edge_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name { value }
        role { value }
        device_type {
          node {
            name { value }
            manufacturer { node { name { value } } }
          }
        }
        platform {
          node {
            name { value }
            netmiko_device_type { value }
          }
        }
        primary_address {
          node {
            address { value }
            ip_namespace { node { name { value } } }
          }
        }
        tags {
          edges {
            node { name { value } }
          }
        }

        # Device Services (BGP, OSPF) with nested peerings
        ...DeviceCapabilitiesOnDeviceFields

        # EVPN Multi-Site: the colocation edge is its metro's border gateway, so it
        # needs the metro's stretched segments and fabric RT ASN (site-id).
        ... on DcimPhysicalDevice {
          deployment {
            node {
              # The edge is deployed to its zone; the metro above it is the site. The metro's stretched
              # segments are selected BEFORE EvpnRtAsOnDeploymentFields adds its own zone -> metro hop: on that
              # hop Infrahub may return null for a SegmentHosting-typed fragment that comes second (see the
              # ORDER MATTERS note in fragments/evpn_fabric.gql), and a lost evpn_rt_as only falls back to the
              # edge's own AS, which IS the site AS, while lost segment_deployments would silently drop every
              # stretched VNI. Verify both on a settled stack (AGENTS.md: run a changed query on real data).
              ... on TopologyColocationZone {
                parent { node { ...SegmentDeploymentsOnDeploymentFields } }
              }
              ...EvpnRtAsOnDeploymentFields
            }
          }
        }

        # Interface Information
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ... on DcimPhysicalInterface {
                interface_type { value }
                mtu { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ... on DcimPhysicalInterface {
                            name { value }
                            ip_address {
                              node {
                                address { value }
                              }
                            }
                            device {
                              node {
                                name { value }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
              }

              ... on DcimLAGInterface {
                lag_id { value }
                lacp_mode { value }
                mtu { value }
                minimum_links { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name { value }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
            }
          }
        }
      }
    }
  }

  # Public space of the INTERNET namespace: what the upstream transit session
  # may be announced (aggregate + RM-TRANSIT-OUT). namespace_type is filtered
  # in transforms/helpers/bgp.py (get_internet_prefixes).
  IpamPrefix(role__value: "public") {
    edges {
      node {
        prefix { value }
        ip_namespace { node { namespace_type { value } } }
      }
    }
  }

  # On-prem routed space per tenant VRF: what an external tenant-VRF peer (a
  # cloud VIF, the SD-WAN gateway) may be announced. Grouped by namespace in
  # transforms/helpers/bgp.py (get_onprem_prefixes).
  ManagedNetworkSegment {
    edges {
      node {
        gateway {
          node {
            ip_prefix {
              node {
                prefix { value }
                member_type { value }
                ip_namespace { node { name { value } namespace_type { value } } }
              }
            }
          }
        }
      }
    }
  }

  # Cloud virtual interfaces and the VPC aggregates each can reach: what the
  # session on the edge's <port>.<vlan_id> sub-interface may accept. Matched to
  # this device through the Direct Connect's physical_devices in
  # transforms/helpers/bgp.py (get_external_peer_prefixes).
  CloudVirtualInterface {
    edges {
      node {
        name { value }
        vlan_id { value }
        direct_connect { node { physical_devices { edges { node { name { value } } } } } }
        virtual_network {
          node {
            cidr_blocks { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
          }
        }
        transit_gateway_attachment {
          node {
            associated_route_table { node { id } }
            transit_gateway {
              node {
                attachments {
                  edges {
                    node {
                      attachment_type { value }
                      propagates_to_route_tables { edges { node { id } } }
                      virtual_network {
                        node {
                          cidr_blocks { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  # Office footprints and the SD-WAN gateway each sits behind: what the session
  # facing that gateway may accept (the union of its offices' lan_prefixes and
  # the prefixes of the segments they host themselves).
  # Matched to the handoff through the BGP peering's far-end device in
  # transforms/helpers/bgp.py (get_external_peer_prefixes).
  TopologyCustomerOffice {
    edges {
      node {
        sdwan_gateway { node { name { value } } }
        lan_prefixes { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
        segment_deployments(status__values: ["active", "provisioning"]) {
          edges {
            node {
              segment {
                node {
                  gateway { node { ip_prefix { node { prefix { value } ip_namespace { node { name { value } } } } } } }
                }
              }
            }
          }
        }
      }
    }
  }
}
