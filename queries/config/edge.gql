query edge_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name { value }
        role { value }
        device_type {
          node {
            name { value }
            manufacturer { node { name { value } } }
          }
        }
        platform {
          node {
            name { value }
            netmiko_device_type { value }
          }
        }
        primary_address {
          node {
            address { value }
            ip_namespace { node { name { value } } }
          }
        }
        tags {
          edges {
            node { name { value } }
          }
        }

        # Device Services (BGP, OSPF) with nested peerings
        ...DeviceCapabilitiesOnDeviceFields

        # EVPN Multi-Site: the colocation edge is its metro's border gateway, so it
        # needs the metro's stretched segments and fabric RT ASN (site-id).
        ... on DcimPhysicalDevice {
          deployment {
            node {
              # An office edge is deployed to the SegmentHosting itself (direct spreads). A colocation edge
              # is deployed to its zone or virtual colocation and the metro above it is the site, so both
              # SegmentHosting fragments are selected in ONE `parent { node { ... } }` block per kind: a
              # second `parent` selection (as EvpnRtAsOnDeploymentFields adds) returns null for whichever
              # SegmentHosting fragment comes second (see the ORDER MATTERS note in fragments/evpn_fabric.gql).
              # Checked on the 30_all stack: eg-fr201 gets evpn_rt_as and segment_deployments from the metro.
              ...SegmentDeploymentsOnDeploymentFields
              ...EvpnRtAsOnSegmentHostingFields
              ... on TopologyColocationZone {
                parent { node { ...SegmentDeploymentsOnDeploymentFields ...EvpnRtAsOnSegmentHostingFields } }
              }
              ... on TopologyVirtualColocation {
                parent { node { ...SegmentDeploymentsOnDeploymentFields ...EvpnRtAsOnSegmentHostingFields } }
              }
            }
          }
        }

        # Interface Information
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ... on DcimPhysicalInterface {
                interface_type { value }
                mtu { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ... on DcimPhysicalInterface {
                            name { value }
                            ip_address {
                              node {
                                address { value }
                              }
                            }
                            device {
                              node {
                                name { value }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
              }

              ... on DcimLAGInterface {
                lag_id { value }
                lacp_mode { value }
                mtu { value }
                minimum_links { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name { value }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
            }
          }
        }
      }
    }
  }

  # Public space of the INTERNET namespace: what the upstream transit session
  # may be announced (aggregate + RM-TRANSIT-OUT). namespace_type is filtered
  # in transforms/helpers/bgp_external.py (get_internet_prefixes).
  IpamPrefix(role__value: "public") {
    edges {
      node {
        prefix { value }
        ip_namespace { node { namespace_type { value } } }
      }
    }
  }

  # On-prem routed space per tenant VRF: what an external tenant-VRF peer (a
  # cloud VIF, the SD-WAN gateway) may be announced. Grouped by namespace in
  # transforms/helpers/bgp_external.py (get_onprem_prefixes).
  # owner: who owns the announced prefix (only an OrganizationCustomer owner counts, so a
  # session is announced only the prefixes of its own owner). status: the transform drops
  # `retired` segments in Python (deliberately no server-side filter here, so the smoke
  # fixtures exercise that branch).
  ManagedNetworkSegment {
    edges {
      node {
        status { value }
        owner { node { __typename org_id { value } display_label } }
        gateway {
          node {
            ip_prefix {
              node {
                prefix { value }
                member_type { value }
                ip_namespace { node { name { value } namespace_type { value } } }
              }
            }
          }
        }
      }
    }
  }

  # Cloud virtual interfaces and the VPC aggregates each can reach: what the
  # session on the edge's <port>.<vlan_id> sub-interface may accept. Matched to
  # this device through the Direct Connect's physical_devices in
  # transforms/helpers/bgp_external.py (get_external_peer_prefixes).
  # virtual_network.account.owner: the owner of the registered VPC aggregate (only an
  # OrganizationCustomer owner counts), so the session accepts only its own owner's VPCs.
  CloudVirtualInterface {
    edges {
      node {
        name { value }
        vlan_id { value }
        direct_connect { node { physical_devices { edges { node { name { value } } } } } }
        virtual_network {
          node {
            cidr_blocks { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
            account { node { owner { node { __typename org_id { value } display_label } } } }
          }
        }
        transit_gateway_attachment {
          node {
            associated_route_table { node { id } }
            transit_gateway {
              node {
                attachments {
                  edges {
                    node {
                      attachment_type { value }
                      propagates_to_route_tables { edges { node { id } } }
                      virtual_network {
                        node {
                          cidr_blocks { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
                          account { node { owner { node { __typename org_id { value } display_label } } } }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  # Office footprints and the SD-WAN gateway each sits behind: what the session
  # facing that gateway may accept (the union of its offices' lan_prefixes and
  # the prefixes of the segments they host themselves).
  # Matched to the handoff through the BGP peering's far-end device in
  # transforms/helpers/bgp_external.py (get_external_peer_prefixes).
  # owner: who owns the office's lan_prefixes (only an OrganizationCustomer owner counts).
  # segment.owner: who owns a hosted segment's prefix; segment.status: a `retired` segment
  # is dropped in Python.
  TopologyCustomerOffice {
    edges {
      node {
        owner { node { __typename org_id { value } display_label } }
        sdwan_gateway { node { name { value } } }
        lan_prefixes { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
        segment_deployments(status__values: ["active", "provisioning"]) {
          edges {
            node {
              segment {
                node {
                  status { value }
                  owner { node { __typename org_id { value } display_label } }
                  gateway { node { ip_prefix { node { prefix { value } ip_namespace { node { name { value } } } } } } }
                }
              }
            }
          }
        }
      }
    }
  }

  # Prefixes registered on a tunnel: reachable behind the SD-WAN gateway at one of its ends, accepted by the
  # session facing that gateway like an office's lan_prefixes (registered_by_gateway in
  # transforms/helpers/bgp_external.py). owner: who owns them (only an OrganizationCustomer counts).
  # capabilities: the tunnel's end ports; the device name of each is matched to a gateway.
  TopologyTunnelCircuit {
    edges {
      node {
        owner { node { __typename org_id { value } display_label } }
        registered_prefixes { edges { node { prefix { value } ip_namespace { node { name { value } } } } } }
        capabilities { edges { node { device { node { name { value } } } } } }
      }
    }
  }
}
