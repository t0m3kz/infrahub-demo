query edge_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        ... on DcimDeviceManaged {
          role {
            value
          }
          device_type {
            node {
              name {
                value
              }
            }
          }
          platform {
            node {
              name {
                value
              }
            }
          }
          primary_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
          tags {
            edges {
              node {
                name {
                  value
                }
              }
            }
          }
        }
        ...DeviceCapabilitiesOnDeviceFields
        ...DeviceSegmentRowsFields
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...SegmentDeploymentsOnDeploymentFields
              ...EvpnRtAsOnSegmentHostingFields
              ... on TopologyColocationZone {
                parent {
                  node {
                    ...SegmentDeploymentsOnDeploymentFields
                    ...EvpnRtAsOnSegmentHostingFields
                  }
                }
              }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              name {
                value
              }
              description {
                value
              }
              status {
                value
              }
              role {
                value
              }
              ...InterfaceRoutingZoneFields
              ... on DcimPhysicalInterface {
                interface_type {
                  value
                }
                mtu {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ...InterfaceRoutingZoneFields
                          ... on DcimPhysicalInterface {
                            name {
                              value
                            }
                            ip_address {
                              node {
                                address {
                                  value
                                }
                              }
                            }
                            device {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vlan_id {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimLAGInterface {
                lag_id {
                  value
                }
                lacp_mode {
                  value
                }
                mtu {
                  value
                }
                minimum_links {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesWithSegmentOnInterfaceFields
            }
          }
        }
      }
    }
  }
  public_origins: TopologySessionCircuit {
    edges {
      node {
        name {
          value
        }
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        originated_prefixes {
          edges {
            node {
              prefix {
                value
              }
            }
          }
        }
      }
    }
  }
  ManagedNetworkSegment {
    edges {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        routing_tag {
          value
        }
        owner {
          node {
            __typename
            org_id {
              value
            }
            display_label
          }
        }
        gateway {
          node {
            ip_prefix {
              node {
                prefix {
                  value
                }
                member_type {
                  value
                }
                ip_namespace {
                  node {
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  TopologyCustomerOffice {
    edges {
      node {
        sdwan_gateway {
          node {
            name {
              value
            }
            ... on DcimDevice {
              interfaces {
                edges {
                  node {
                    ...InterfaceRoutingZoneFields
                    capabilities {
                      edges {
                        node {
                          __typename
                          ... on TopologySessionCircuit {
                            circuit_type {
                              value
                            }
                            vrf {
                              node {
                                ...RoutingVrfFields
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        vrfs {
          edges {
            node {
              ...RoutingVrfFields
            }
          }
        }
        owner {
          node {
            __typename
            org_id {
              value
            }
            display_label
          }
        }
        sdwan_gateway {
          node {
            name {
              value
            }
          }
        }
        lan_prefixes {
          edges {
            node {
              prefix {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        segment_deployments {
          edges {
            node {
              segment {
                node {
                  security_zone {
                    node {
                      ...RoutingZoneFields
                    }
                  }
                  owner {
                    node {
                      __typename
                      org_id {
                        value
                      }
                      display_label
                    }
                  }
                  gateway {
                    node {
                      ip_prefix {
                        node {
                          prefix {
                            value
                          }
                          ip_namespace {
                            node {
                              name {
                                value
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  TopologySessionCircuit(circuit_type__value: "tunnel") {
    edges {
      node {
        vrf {
          node {
            ...RoutingVrfFields
          }
        }
        locations {
          edges {
            node {
              ... on TopologyCustomerOffice {
                owner {
                  node {
                    __typename
                    org_id {
                      value
                    }
                    display_label
                  }
                }
              }
            }
          }
        }
        registered_prefixes {
          edges {
            node {
              prefix {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              device {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  CloudPeeringInterface {
    edges {
      node {
        name {
          value
        }
        scope {
          value
        }
        routing {
          value
        }
        peer_ip {
          node {
            address {
              value
            }
          }
        }
        peer_asn {
          node {
            asn {
              value
            }
          }
        }
        auth {
          node {
            password {
              value
            }
          }
        }
        gateway {
          node {
            id
            name {
              value
            }
          }
        }
        advertised_prefixes {
          edges {
            node {
              prefix {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        device {
          node {
            __typename
            name {
              value
            }
            ... on CloudTransport {
              account {
                node {
                  owner {
                    node {
                      __typename
                      org_id {
                        value
                      }
                      display_label
                    }
                  }
                }
              }
              owner {
                node {
                  __typename
                  org_id {
                    value
                  }
                  display_label
                }
              }
            }
            ... on CloudVPNConnection {
              gateway {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on TopologySessionCircuit {
                name {
                  value
                }
                circuit_type {
                  value
                }
                vrf {
                  node {
                    ...RoutingVrfFields
                  }
                }
                capabilities {
                  edges {
                    node {
                      ...InterfaceRoutingZoneFields
                      name {
                        value
                      }
                      device {
                        node {
                          name {
                            value
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  CloudGatewayAttachment {
    edges {
      node {
        name {
          value
        }
        gateway {
          node {
            id
            name {
              value
            }
          }
        }
        peer_gateway {
          node {
            id
            name {
              value
            }
          }
        }
        virtual_network {
          node {
            id
            name {
              value
            }
            cidr_blocks {
              edges {
                node {
                  prefix {
                    value
                  }
                  ip_namespace {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        allowed_prefixes {
          edges {
            node {
              prefix {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        associated_route_table {
          node {
            id
            name {
              value
            }
          }
        }
        propagates_to_route_tables {
          edges {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  OrganizationCustomer {
    edges {
      node {
        org_id {
          value
        }
        display_label
        routing_tag {
          value
        }
      }
    }
  }
  DcimVirtualInterface(role__value: "multisite-vip") {
    edges {
      node {
        ...InterfaceRoutingZoneFields
        ip_address {
          node {
            address {
              value
            }
          }
        }
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
            interfaces(role__values: ["loopback", "loopback-vtep"]) {
              edges {
                node {
                  role {
                    value
                  }
                  ...InterfaceRoutingZoneFields
                  ... on DcimVirtualInterface {
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                  ... on DcimPhysicalInterface {
                    ip_address {
                      node {
                        address {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  environment_segments: ManagedNetworkSegment {
    edges {
      node {
        ...SegmentRoutingPrefixFields
      }
    }
  }
  environment_zones: SecurityZone {
    edges {
      node {
        ...EnvironmentRoutingZoneFields
      }
    }
  }
  ManagedVRF {
    edges {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        shared_devices {
          edges {
            node {
              name {
                value
              }
              ... on DcimDeviceManaged {
                role {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  ManagedVxlanSegment {
    edges {
      node {
        id
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
        gateway {
          node {
            ip_prefix {
              node {
                prefix {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
  DeviceServices: DcimDeviceManaged(name__value: $device) {
    edges {
      node {
        ...DeviceServicesFields
      }
    }
  }
}
