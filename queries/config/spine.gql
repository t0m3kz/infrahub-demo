query spine_config($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        __typename
        id
        name { value }
        role { value }
        platform {
          node {
            id
            name { value }
          }
        }
        primary_address {
          node {
            address { value }
            ip_namespace { node { name { value } } }
          }
        }
        tags {
          edges {
            node { name { value } }
          }
        }

        # Device Services (BGP, OSPF) with nested peerings
        ...DeviceCapabilitiesOnDeviceFields

        # The hosting deployment: the loopback supernet and the staging switch of the BGP route protection.
        ... on DcimPhysicalDevice {
          deployment {
            node {
              ...EvpnRtAsOnDeploymentFields
            }
          }
        }

        # Interface Information
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              status { value }
              role { value }
              ... on DcimPhysicalInterface {
                interface_type { value }
                mtu { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                cable {
                  node {
                    id
                    endpoints {
                      edges {
                        node {
                          __typename
                          ... on DcimPhysicalInterface {
                            name { value }
                            ip_address {
                              node {
                                address { value }
                              }
                            }
                            device {
                              node {
                                name { value }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

              ... on DcimVirtualInterface {
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
              }

              ... on DcimLAGInterface {
                lag_id { value }
                lacp_mode { value }
                mtu { value }
                minimum_links { value }
                ip_address {
                  node {
                    address { value }
                    ip_namespace { node { name { value } } }
                  }
                }
                member_interfaces {
                  edges {
                    node {
                      name { value }
                    }
                  }
                }
              }
              ...InterfaceCapabilitiesOnInterfaceFields
            }
          }
        }
      }
    }
  }

  # The EVPN Multi-Site VIPs of the model and the loopbacks of the border gateways that carry them: the far end
  # of a fabric or DCI session and the VIPs every underlay session may carry
  # (transforms/helpers/bgp_facts.py). A handful of interfaces, however large the fleet.
  DcimVirtualInterface(role__value: "multisite-vip") {
    edges {
      node {
        ip_address { node { address { value } } }
        device {
          node {
            name { value }
            role { value }
            interfaces(role__values: ["loopback", "loopback-vtep"]) {
              edges {
                node {
                  role { value }
                  ... on DcimVirtualInterface { ip_address { node { address { value } } } }
                  ... on DcimPhysicalInterface { ip_address { node { address { value } } } }
                }
              }
            }
          }
        }
      }
    }
  }

  # Route protection (utils/bgp_expectation.py, transforms/helpers/bgp_facts.py): the EVPN type-5 routes of a VRF are
  # prefixes of its namespace, so a device's EVPN filter is the prefixes of the namespaces it is a member of (a
  # spine: all of them), the default route only from a default exit, and the L2 VNIs bound the route count.
  # One aliased root per environment namespace type (the namespaces are data/bootstrap/22_namespaces.yml).
  environment_prefixes_prod: IpamPrefix(ip_namespace__namespace_type__value: "prod") {
    edges { node { prefix { value } ip_namespace { node { name { value } namespace_type { value } } } } }
  }
  environment_prefixes_non_prod: IpamPrefix(ip_namespace__namespace_type__value: "non_prod") {
    edges { node { prefix { value } ip_namespace { node { name { value } namespace_type { value } } } } }
  }
  environment_prefixes_internet: IpamPrefix(ip_namespace__namespace_type__value: "internet") {
    edges { node { prefix { value } ip_namespace { node { name { value } namespace_type { value } } } } }
  }
  environment_prefixes_management: IpamPrefix(ip_namespace__namespace_type__value: "management") {
    edges { node { prefix { value } ip_namespace { node { name { value } namespace_type { value } } } } }
  }
  # The devices in each namespace's VRF instance: a border gateway in an internet one is the default exit.
  ManagedVRF {
    edges {
      node {
        namespace { node { name { value } namespace_type { value } } }
        shared_devices { edges { node { name { value } } } }
      }
    }
  }
  ManagedVxlanSegment {
    edges { node { id } }
  }
}
