# What the routes of a service context derive from (generators/topology/context_routes.py): its member devices. A
# context has no interface edge: its legs are the sub-interfaces of a member's first uplink tagged with the transit VLAN
# of the context (with their address and VRF), its border devices those whose service port the member's uplink (or the
# host port a hosted member's NIC is pinned to) is cabled to (utils/service_contexts.py).

# The far end of a member's uplink cable: the border service port, with its device (also read by segment_vlans.gql).
fragment ServiceMemberCableFields on DcimPhysicalInterface {
  cable {
    node {
      id
      endpoints {
        edges {
          node {
            __typename
            ... on DcimPhysicalInterface {
              id
              role {
                value
              }
              device {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ContextRoutesMemberFields on DcimDeviceManaged {
  __typename
  id
  name {
    value
  }
  role {
    value
  }
  shared_capabilities {
    edges {
      node {
        __typename
        id
        ... on ManagedSecurityContext {
          vlan_id {
            value
          }
        }
      }
    }
  }
  ... on DcimDevice {
    interfaces {
      edges {
        node {
          __typename
          id
          name {
            value
          }
          role {
            value
          }
          ...InterfaceRoutingZoneFields
          ...InterfaceEncapsulationCableFields
          ...ServiceMemberCableFields
          ... on DcimVirtualInterface {
            ip_address {
              node {
                address {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ContextRoutesFields on ManagedGenericSharedDevice {
  id
  ... on ManagedGeneric {
    name {
      value
    }
  }
  shared_devices {
    edges {
      node {
        ...ContextRoutesMemberFields
      }
    }
  }
}
