fragment SegmentBaseFields on ManagedNetworkSegment {
  name { value }
  description { value }
  status { value }
}

fragment SegmentStatusFields on ManagedNetworkSegment {
  name { value }
  status { value }
}

fragment SegmentDeploymentsFields on ManagedNetworkSegment {
  ... on ManagedVlanSegment {
    vlan_id { value }
  }
  ... on ManagedVxlanSegment {
    segment_deployments {
      edges {
        node {
          vlan_id { value }
          vni { value }
        }
      }
    }
  }
}

fragment SegmentDeploymentsActiveFields on ManagedNetworkSegment {
  ... on ManagedVlanSegment {
    status { value }
    vlan_id { value }
  }
  ... on ManagedVxlanSegment {
    segment_deployments(status__values: $segment_status_values) {
      edges {
        node {
          vlan_id { value }
          vni { value }
        }
      }
    }
  }
}

fragment SegmentGatewayWithNamespaceFields on ManagedNetworkSegment {
  gateway {
    node {
      address { value }
      ip_prefix {
        node {
          prefix { value }
          ip_namespace {
            node {
              name { value }
              l3_vni { value }
            }
          }
        }
      }
    }
  }
}

fragment SegmentSecurityZoneFields on ManagedNetworkSegment {
  security_zone {
    node {
      name { value }
      trust_level { value }
      zone_type { value }
    }
  }
}

fragment SegmentSecurityPolicyFields on ManagedNetworkSegment {
  ... on ManagedVxlanSegment {
    inline_service {
      node { id name { value } }
    }
    customer_deployments {
      edges {
        node { id }
      }
    }
  }
  ... on ManagedVlanSegment {
    customer_deployment {
      node { id }
    }
  }
  isolation_mode { value }
  owner {
    node {
      id
      org_id { value }
    }
  }
  security_tag {
    node {
      name { value }
      group_id { value }
      rules_as_source {
        edges {
          node {
            action { value }
            log { value }
            destination_tag {
              node {
                name { value }
                group_id { value }
              }
            }
          }
        }
      }
    }
  }
  security_policies {
    edges {
      node {
        id
        name { value }
        enabled { value }
        default_action { value }
        rules {
          edges {
            node {
              index { value }
              name { value }
              action { value }
              protocol { value }
              port_start { value }
              port_end { value }
              log { value }
              disabled { value }
              source_zone { node { name { value } } }
              destination_zone { node { name { value } } }
              source_segment {
                node {
                  id
                  ... on ManagedVlanSegment {
                    name { value }
                    customer_name { value }
                    environment { value }
                    gateway { node { ip_prefix { node { prefix { value } } } } }
                  }
                  ... on ManagedVxlanSegment {
                    name { value }
                    customer_name { value }
                    environment { value }
                    gateway { node { ip_prefix { node { prefix { value } } } } }
                  }
                }
              }
              destination_segment {
                node {
                  id
                  ... on ManagedVlanSegment {
                    name { value }
                    customer_name { value }
                    environment { value }
                    gateway { node { ip_prefix { node { prefix { value } } } } }
                  }
                  ... on ManagedVxlanSegment {
                    name { value }
                    customer_name { value }
                    environment { value }
                    gateway { node { ip_prefix { node { prefix { value } } } } }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment NetworkSegmentFields on ManagedNetworkSegment {
  ... on ManagedVlanSegment {
    id
    name { value }
    description { value }
    status { value }
    vlan_id { value }
    customer_name { value }
    environment { value }
    gateway {
      node {
        address { value }
        ip_prefix {
          node {
            prefix { value }
            ip_namespace {
              node {
                name { value }
                l3_vni { value }
              }
            }
          }
        }
      }
    }
    ...SegmentSecurityZoneFields
    ...SegmentSecurityPolicyFields
  }
  ... on ManagedVxlanSegment {
    id
    name { value }
    description { value }
    status { value }
    customer_name { value }
    environment { value }
    arp_suppression { value }
    segment_deployments(status__values: ["active", "provisioning"]) {
      edges {
        node {
          vlan_id { value }
          vni { value }
        }
      }
    }
    gateway {
      node {
        address { value }
        ip_prefix {
          node {
            prefix { value }
            ip_namespace {
              node {
                name { value }
                l3_vni { value }
              }
            }
          }
        }
      }
    }
    ...SegmentSecurityZoneFields
    ...SegmentSecurityPolicyFields
  }
}
