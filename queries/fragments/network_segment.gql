fragment SegmentSecurityZoneFields on ManagedNetworkSegment {
  security_zone {
    node {
      name { value }
      trust_level { value }
    }
  }
}

fragment SegmentSecurityPolicyFields on ManagedNetworkSegment {
  ... on ManagedVxlanSegment {
    inline_service {
      node { id name { value } }
    }
    customer_deployments {
      edges {
        node { id }
      }
    }
  }
  ... on ManagedVlanSegment {
    inline_service {
      node { id name { value } }
    }
    customer_deployment {
      node { id }
    }
  }
  isolation_mode { value }
  # routing_tag: the segment's and its owner's tag, rendered as the standard communities
  # 64497:<segment tag> and 64496:<customer tag> on the routes the leaf originates
  # (transforms/helpers/routing_identity.py). A tag is visibility only, never a filter.
  routing_tag { value }
  owner {
    node {
      id
      org_id { value }
      routing_tag { value }
    }
  }
  # The segment's own rules (its security_policy) and the rules into it
  # (inbound_rules): a leaf carrying only the destination answers those
  # flows from them (return ACL and PBR bypass, transforms/helpers/acl.py
  # and firewall.py).
  ...SegmentRulesFields
}

fragment NetworkSegmentFields on ManagedNetworkSegment {
  # Named fragments are spread HERE, not inside the `... on` blocks below:
  # Infrahub resolves a named fragment nested in an inline fragment to nulls
  # (security_zone, security_policy, owner, isolation_mode all came back null
  # on a leaf while the same fields read directly were populated).
  ...SegmentSecurityZoneFields
  ...SegmentSecurityPolicyFields
  ... on ManagedVlanSegment {
    id
    name { value }
    description { value }
    vlan_id { value }
    terminate_inline { value }
    customer_name { value }
    environment { value }
    gateway {
      node {
        address { value }
        ip_prefix {
          node {
            prefix { value }
            ip_namespace {
              node {
                name { value }
                l3_vni { value }
                namespace_type { value }
              }
            }
          }
        }
      }
    }
  }
  ... on ManagedVxlanSegment {
    id
    name { value }
    description { value }
    customer_name { value }
    environment { value }
    arp_suppression { value }
    stretch_scope { value }
    terminate_inline { value }
    # deployment.evpn_rt_as: a stretched segment's route-target must be the
    # same at every site it spans, so its admin field is anchored on the
    # lowest evpn_rt_as across all of them (transforms/helpers/vxlan.py).
    segment_deployments {
      edges {
        node {
          vni { value }
          deployment { node { id evpn_rt_as { node { asn { value } } } } }
        }
      }
    }
    # LOCAL VLAN ID is per VLAN domain (MLAG pair or standalone device), not
    # DC-wide — the rendering transform resolves the entry whose vlan_domain
    # matches THIS device's own domain (its MLAG if paired, else itself).
    # See transforms/common.py's _collect_activations_from_interfaces.
    vlan_domain_segments {
      edges {
        node {
          vlan_id { value }
          vlan_domain { node { id } }
        }
      }
    }
    gateway {
      node {
        address { value }
        ip_prefix {
          node {
            prefix { value }
            ip_namespace {
              node {
                name { value }
                l3_vni { value }
              }
            }
          }
        }
      }
    }
  }
  # A cloud segment has no gateway: its address is cidr_block.
  ... on CloudNetworkSegment {
    id
    name { value }
    cidr_block { value }
    customer_deployment { node { id } }
  }
}

# Every segment activation IN A DC, for the DC-level tiers (border-leaf,
# BGW edge) that have no customer-facing capabilities of their own
# the way a leaf does: reached via TopologySegmentHosting.segment_deployments
# (see schemas/extensions/service/segment.yml — TopologyDataCenter inherits
# TopologySegmentHosting directly). vni is the dedup/naming key here (NOT
# vlan_id — local VLAN ID is per VLAN domain, not DC-wide, so the same
# segment can have a different vlan_id on every leaf; VNI is the only value
# that's genuinely DC-wide/fabric-wide unique). gateway.ip_prefix.prefix is
# what a segment is matched on here. The segment's group tag is not read here:
# the NX-OS GPO block reads it from the fleet roots of the device query
# (fragments/group_policy.gql, transforms/helpers/group_policy.group_policy_device_view;
# schemas/extensions/security/security_tags.yml).
fragment SegmentDeploymentsOnDeploymentFields on TopologySegmentHosting {
  segment_deployments {
    edges {
      node {
        vni { value }
        segment {
          node {
            id
            # The routing identity of the routes this segment's SVI originates
            # (transforms/helpers/routing_identity.py); selected on the generic, never inside a `... on` block.
            routing_tag { value }
            owner { node { routing_tag { value } } }
            ... on ManagedVlanSegment {
              customer_name { value }
              environment { value }
              # terminate_inline: routed by its HA pair, so no border-leaf PBR.
              terminate_inline { value }
              gateway { node { ip_prefix { node { prefix { value } } } } }
              customer_deployment { node { id } }
              security_policy {
                node {
                  enabled { value }
                  rules {
                    edges {
                      node {
                        action { value }
                        disabled { value }
                        destination_segment {
                          node {
                            id
                            ... on ManagedVlanSegment {
                              gateway { node { ip_prefix { node { prefix { value } } } } }
                            }
                            ... on ManagedVxlanSegment {
                              gateway { node { ip_prefix { node { prefix { value } } } } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
            ... on ManagedVxlanSegment {
              name { value }
              customer_name { value }
              environment { value }
              arp_suppression { value }
              # terminate_inline: no border-leaf PBR, and a BGW stays pure L2
              # for it (no SVI / VRF; transforms/helpers/segments.py).
              terminate_inline { value }
              # EVPN Multi-Site border gateways carry every stretched segment
              # of their site without a customer-facing port, so they need the
              # local VLAN (own vlan_domain) and the cross-site RT anchor here.
              stretch_scope { value }
              vlan_domain_segments {
                edges {
                  node {
                    vlan_id { value }
                    vlan_domain { node { id } }
                  }
                }
              }
              segment_deployments {
                edges {
                  node {
                    vni { value }
                    deployment { node { id evpn_rt_as { node { asn { value } } } } }
                  }
                }
              }
              # address + ip_namespace: a BGW routes the stretched segment too
              # (anycast SVI in the segment's VRF, transforms/helpers/segments.py).
              gateway {
                node {
                  address { value }
                  ip_prefix {
                    node {
                      prefix { value }
                      ip_namespace { node { name { value } l3_vni { value } } }
                    }
                  }
                }
              }
              customer_deployments { edges { node { id } } }
              security_policy {
                node {
                  enabled { value }
                  rules {
                    edges {
                      node {
                        action { value }
                        disabled { value }
                        destination_segment {
                          node {
                            id
                            ... on ManagedVlanSegment {
                              gateway { node { ip_prefix { node { prefix { value } } } } }
                            }
                            ... on ManagedVxlanSegment {
                              gateway { node { ip_prefix { node { prefix { value } } } } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
