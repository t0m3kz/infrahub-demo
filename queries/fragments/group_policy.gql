# What utils/group_policy.py reads to decide whether a VTEP is in its
# platform's reference profile (fabric_reason / site_reason / site_kind): the
# device's role, platform, device type with its memory, and software image;
# and the DcimGroupPolicyProfile rows it is compared with, with the reserved
# groups the platform views render (transforms/helpers/group_policy.py). Read
# by the reference_fabric check and the VTEP configs (leaf_config,
# border_leaf_config, border_spine_config: the same fleet roots in each,
# transforms/helpers/group_policy.group_policy_device_view).

fragment DeviceGroupPolicyFields on DcimDevice {
  name { value }
  ... on DcimDeviceManaged {
    role { value }
    platform { node { name { value } } }
    device_type { node { name { value } memory_gb { value } } }
  }
  # software_image is DcimSoftwareRunner's edge, not DcimDeviceManaged's
  ... on DcimSoftwareRunner {
    software_image { node { version { value } } }
  }
}

fragment GroupPolicyProfileFields on DcimGroupPolicyProfile {
  name { value }
  group_policy_kind { value }
  min_release { value }
  min_memory_gb { value }
  unclassified_group_id { value }
  unaware_group_id { value }
  platform { node { name { value } } }
  device_types { edges { node { name { value } } } }
}

# One group tag with the segment of each of its components (the component
# groups of a microsegmented segment: transforms/helpers/group_policy.py).
fragment SecurityTagGroupPolicyFields on SecurityTag {
  id
  name { value }
  group_id { value }
}

# Where the instances of each component of a tag sit (transforms/helpers/group_policy.py
# component_coverage: a component group is classified by `match vlan <VLAN> interface
# <port>` on the VTEP port its instances' hosts are cabled to). Spread next to
# SecurityTagGroupPolicyFields by the VTEP configs only, and it holds the tag's ONE `components` selection (the
# server answers only the first selection of a field, so the two fragments cannot each select it).
#
# Per instance: a physical device/controller is its own host; a virtual one walks
# hosting_device (utils/app_instances.physical_host). The host's uplink/lag NICs are
# selected with the far end of each cable: its device, role, tags (the VLAN rows of its switch
# the port is a member of, each with its deployment's segment) and, for a LAG member, its port-channel. That NIC
# selection is HostNicFields, written once and spread in the `node` of each host kind's
# `interfaces(role__values: [...]) { edges { node { ...HostNicFields } } }`: the role
# filter stays per host kind. Rule: a named fragment is spread only under a field
# (`node { ...F }`), NEVER directly inside an inline fragment (`... on X { ...F }`),
# which resolves to nulls on a live Infrahub (commit 7a38de0e).
fragment HostNicFields on DcimInterface {
  id
  name { value }
  ... on DcimPhysicalInterface {
    cable {
      node {
        endpoints {
          edges {
            node {
              id
              ... on DcimPhysicalInterface {
                name { value }
                role { value }
                device { node { name { value } } }
                capabilities { edges { node { __typename ... on ManagedSegmentVlan { segment_deployment { node { segment { node { id } } } } } } } }
                lag {
                  node {
                    name { value }
                    capabilities { edges { node { __typename ... on ManagedSegmentVlan { segment_deployment { node { segment { node { id } } } } } } } }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment SecurityTagPlacementFields on SecurityTag {
  # The one `components` selection of a tag: the policy fields (fqdn, segment) sit here too, because a second
  # `components` selection on the same tag (SecurityTagGroupPolicyFields) is not answered by the server.
  components {
    edges {
      node {
        fqdn { value }
        network_segment { node { id } }
        instances {
          edges {
            node {
              id
              __typename
              name { value }
              ... on DcimDevice {
                interfaces(role__values: ["uplink", "lag"]) {
                  edges { node { ...HostNicFields } }
                }
              }
              ... on DcimVirtualDevice {
                hosting_device {
                  node {
                    id
                    name { value }
                    interfaces(role__values: ["uplink", "lag"]) {
                      edges { node { ...HostNicFields } }
                    }
                  }
                }
              }
              ... on ManagedControllerVirtual {
                hosting_device {
                  node {
                    id
                    name { value }
                    interfaces(role__values: ["uplink", "lag"]) {
                      edges { node { ...HostNicFields } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

# One rule as the group contract builder reads it: its entry, its two segments
# and the component tags it narrows them to.
fragment GroupPolicyRuleFields on SecurityPolicyRule {
  id
  index { value }
  name { value }
  action { value }
  protocol { value }
  port_start { value }
  port_end { value }
  disabled { value }
  apply_on_switch { value }
  source_segment { node { id } }
  destination_segment { node { id } }
  source_security_tag { node { id } }
  destination_security_tag { node { id } }
}

# One segment as the group contract builder reads it
# (transforms/helpers/group_policy.py): whether it is a routed tenant segment
# (kind, gateway namespace type, zone) and its group tag, its owner (the
# customer label), where it is active (utils/group_policy.segment_sites: the
# VXLAN deployments), its classification
# (VLAN ID, prefix) and its own rules with the component tags they carry
# (every rule lives in its source segment's policy). The rules into it
# (inbound_rules) carry their policy's segment: a rule of a segment-less policy
# (a load-balancer context's lb-<context>: its leg -> this segment) is in no
# segment's own policy, so it is read only here. The inline fragments below
# select plain fields: a named fragment spread directly inside an inline fragment
# (`... on X { ...F }`) resolves to nulls (commit 7a38de0e).
fragment SegmentGroupPolicyFields on ManagedNetworkSegment {
  id
  __typename
  name { value }
  isolation_mode { value }
  # owner and gateway are the first selection of these fields in queries/validation/segment_security.gql: they carry
  # what that query reads too (the server answers only the first selection of a field).
  owner { node { __typename display_label org_id { value } } }
  security_zone { node { ...RoutingZoneFields } }
  security_tag { node { id name { value } group_id { value } } }
  gateway {
    node {
      ip_prefix {
        node {
          id
          prefix { value }
          ip_namespace { node { name { value }  } }
        }
      }
    }
  }
  security_policy {
    node {
      name { value }
      enabled { value }
      default_action { value }
      rules { edges { node { ...GroupPolicyRuleFields } } }
    }
  }
  inbound_rules {
    edges {
      node {
        ...GroupPolicyRuleFields
        policy { node { enabled { value } segment { node { id } } } }
      }
    }
  }
  ... on ManagedVxlanSegment {
    stretch_scope { value }
    # A terminated segment has no SVI: it is no routed tenant segment (utils/exchange_transit.is_routed_tenant_segment).
    terminated_on { node { id } }
    segment_deployments {
      edges {
        node {
          vni { value }
          deployment { node { id name { value } } }
        }
      }
    }
  }
}
