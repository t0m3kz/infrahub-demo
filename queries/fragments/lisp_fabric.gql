fragment LispSiteOnOfficeFields on TopologyCustomerOffice {
  name {
    value
  }
  lisp_site_key {
    node {
      password {
        value
      }
    }
  }
  lisp_map_servers: devices(role__value: "distribution-switch") {
    edges {
      node {
        name {
          value
        }
        ... on DcimDevice {
          interfaces(role__value: "loopback") {
            edges {
              node {
                ...InterfaceRoutingZoneFields
                ... on DcimVirtualInterface {
                  vrf {
                    node {
                      ...RoutingVrfFields
                    }
                  }
                  ip_address {
                    node {
                      address {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  lisp_wan_edges: devices(role__value: "edge") {
    edges {
      node {
        name {
          value
        }
      }
    }
  }
}
