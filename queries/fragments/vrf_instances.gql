fragment VrfDemandInstanceFields on ManagedVRF {
  id
  name {
    value
  }
  deployment {
    node {
      id
    }
  }
  security_zone {
    node {
      ...RoutingZoneFields
    }
  }
}

fragment VrfDemandHostingFields on TopologyDeployment {
  __typename
  id
  name {
    value
  }
  ... on TopologyPod {
    parent {
      node {
        __typename
        id
        name {
          value
        }
      }
    }
  }
  ... on TopologyColocationZone {
    parent {
      node {
        __typename
        id
        name {
          value
        }
      }
    }
  }
  ... on TopologyVirtualColocation {
    parent {
      node {
        __typename
        id
        name {
          value
        }
      }
    }
  }
}

fragment VrfDemandRowFields on ManagedSegmentVlan {
  id
  vlan_id {
    value
  }
  segment_deployment {
    node {
      segment {
        node {
          security_zone {
            node {
              ...RoutingZoneFields
            }
          }
          __typename
          id
          ... on ManagedVxlanSegment {
            name {
              value
            }
            terminated_on {
              node {
                id
              }
            }
            customer_deployments {
              edges {
                node {
                  id
                  name {
                    value
                  }
                  parent {
                    node {
                      __typename
                      id
                    }
                  }
                  ... on TopologyCustomerDC {
                    serving_firewall_context {
                      node {
                        id
                      }
                    }
                  }
                  ... on TopologyCustomerColocation {
                    serving_firewall_contexts {
                      edges {
                        node {
                          id
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          gateway {
            node {
              address {
                value
              }
              ip_prefix {
                node {
                  ip_namespace {
                    node {
                      name {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment VrfDemandLegFields on DcimInterface {
  device {
    node {
      ... on DcimDeviceManaged {
        role {
          value
        }
      }
    }
  }
  ...InterfaceRoutingZoneFields
  ... on DcimVirtualInterface {
    vrf {
      node {
        ...RoutingVrfFields
      }
    }
    ip_address {
      node {
        address {
          value
        }
        ip_namespace {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
}
