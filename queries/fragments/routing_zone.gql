fragment RoutingZoneFields on SecurityZone {
  id
  name { value }
  vrf_type { value }
  l3_vni { value }
}

fragment RoutingVrfFields on ManagedVRF {
  id
  deployment { node { id name { value } } }
  security_zone { node { ...RoutingZoneFields } }
}

fragment SegmentRoutingPrefixFields on ManagedNetworkSegment {
  security_zone { node { ...RoutingZoneFields } }
  gateway { node { ip_prefix { node { id prefix { value } } } } }
}

# The circuits are selected under the alias `zone_capabilities`: a query that also selects the interface's own
# `capabilities` would otherwise select that field twice on one object, and the server answers only the first
# selection of a field (the later one's sub-fields come back null). utils/routing_domain.py reads both keys.
fragment InterfaceRoutingZoneFields on DcimInterface {
  vrf { node { ...RoutingVrfFields } }
  zone_capabilities: capabilities {
    edges {
      node {
        __typename
        ... on TopologySessionCircuit {
          circuit_type { value }
          vrf { node { ...RoutingVrfFields } }
        }
      }
    }
  }
}

fragment EnvironmentRoutingZoneFields on SecurityZone {
  ...RoutingZoneFields
  network_segments { edges { node { ...SegmentRoutingPrefixFields } } }
  vrfs {
    edges {
      node {
        ...RoutingVrfFields
        session_circuits {
          edges {
            node {
              name { value }
              vrf { node { ...RoutingVrfFields } }
              link_prefix { node { id prefix { value } } }
              registered_prefixes { edges { node { id prefix { value } } } }
              originated_prefixes { edges { node { id prefix { value } } } }
            }
          }
        }
        interfaces {
          edges {
            node {
              ...InterfaceRoutingZoneFields
              ... on DcimHasIPAddress {
                ip_address { node { ip_prefix { node { id prefix { value } } } } }
              }
              ... on CloudPeeringInterface {
                advertised_prefixes { edges { node { id prefix { value } } } }
              }
            }
          }
        }
      }
    }
  }
}
