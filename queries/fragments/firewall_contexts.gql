fragment FirewallContextLegFields on ManagedFirewallContext {
  id
  # Name and VLAN derive the context's transit VLAN; the namespace l3_vni is
  # the VRF's L3 VNI. A leaf renders the transit leg locally from these
  # (get_leaf_firewall_transits), border leaves/edges from their own ports.
  name { value }
  vlan_id { value }
  tenant { node { id } }
  # Deployments whose segments terminate here: a leaf sends a flow through
  # the firewall only when both its segments are served by one context.
  served_deployments { edges { node { id } } }
  capabilities {
    edges {
      node {
        name { value }
        device { node { role { value } } }
        ... on DcimVirtualInterface {
          ip_address {
            node {
              address { value }
              ip_namespace { node { name { value } namespace_type { value } l3_vni { value } } }
            }
          }
        }
      }
    }
  }
}

fragment FirewallContextsOnDeviceHostingFields on TopologyDeviceHosting {
  devices(role__value: "firewall") {
    edges {
      node {
        ... on DcimPhysicalDevice {
          capabilities {
            edges {
              node {
                __typename
                ... on ManagedFirewallHA {
                  contexts {
                    edges {
                      node {
                        ...FirewallContextLegFields
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

# A device's own `deployment` is the DC directly for DC-level tiers
# (border-leaf, firewall, spine, super-spine) but the POD for pod-level
# tiers (leaf, tor, access-leaf) — see generators/topology/rack.py's
# deployment_id=self.data["pod"]["id"] vs generators/topology/dc.py's
# deployment_id=dc_id. One extra `parent` hop covers the pod case; DC-level
# devices' deployment has no `parent` fragment match, so only the direct
# TopologyDeviceHosting fragment applies for them. A colocation firewall's
# deployment is its zone, which is a TopologyDeviceHosting itself and holds the
# firewall pair, so it takes the direct shape and needs no hop (the metro owns no
# devices). A virtual colocation's firewalls are CloudNetworkAppliances, hosted
# provider-side with no context of ours, so nothing here selects them.
fragment FirewallContextsOnDeploymentFields on TopologyDeployment {
  ...FirewallContextsOnDeviceHostingFields
  ... on TopologyPod {
    parent {
      node {
        ...FirewallContextsOnDeviceHostingFields
      }
    }
  }
}

fragment FirewallContextConfigFields on ManagedFirewallContext {
  id
  name { value }
  context_id { value }
  vlan_id { value }
  snat_address { node { address { value } } }
  tenant {
    node {
      id
      ... on TopologyCustomerDC { name { value } }
      ... on TopologyCustomerColocation { name { value } }
    }
  }
  # The segments terminating on this context: every
  # segment of a deployment it serves. Its rule table is
  # their rules and the rules into them.
  served_deployments {
    edges {
      node {
        id
        # network_segments is declared per footprint kind (schemas/extensions/service/segment.yml), not on the
        # TopologyCustomer generic: a context serves a DC or a colocation footprint, both with VXLAN segments, so
        # the two spreads select the same field of the same peer type.
        ... on TopologyCustomerDC { network_segments { edges { node { id ...ContextServedSegmentFields } } } }
        ... on TopologyCustomerColocation { network_segments { edges { node { id ...ContextServedSegmentFields } } } }
      }
    }
  }
}

# A segment a context serves: its rules, and its own gateway prefix and zone (the context's routes,
# apply_context_routes, read these, not the SecurityZone root).
fragment ContextServedSegmentFields on ManagedNetworkSegment {
  ...SegmentRulesFields
  gateway { node { ip_prefix { node { prefix { value } } } } }
  security_zone { node { name { value } } }
}
