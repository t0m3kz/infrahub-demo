# The firewalls of a hosting deployment and what their contexts' legs derive from: the contexts they are a member of and
# their interfaces (utils/service_contexts.py contexts_with_legs).
fragment FirewallContextsOnDeviceHostingFields on TopologyDeviceHosting {
  # Both firewall roles: a footprint with no internal context is steered to its Internet edge one
  # (transforms/helpers/firewall_contexts.py _steering_only).
  devices(role__values: ["internal-firewall", "external-firewall"]) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        # The physical firewalls only, as this selection always was: a dedicated context hosted on virtual firewalls
        # is not one a leaf redirects to (a virtual member answers with no role, so it holds no context here).
        ... on DcimPhysicalDevice {
          role {
            value
          }
          shared_capabilities {
            edges {
              node {
                __typename
                ...ServiceContextFields
                ...FirewallServedFields
                ...LoadbalancerServedFields
              }
            }
          }
          interfaces {
            edges {
              node {
                ...ServiceMemberInterfaceFields
              }
            }
          }
        }
      }
    }
  }
}

# The deployment of a fabric switch: its EVPN facts and the firewall contexts of its hosting facility, both read on the
# deployment and, for a pod, on its DC. ONE `parent` hop per kind: a second `... on TopologyPod { parent }` selection
# of the same field (two fragments each with their own) would be answered only for the first, the server drops the rest.
fragment SwitchDeploymentFields on TopologyDeployment {
  ...EvpnRtAsOnSegmentHostingFields
  ...FirewallContextsOnDeviceHostingFields
  ... on TopologyPod {
    parent {
      node {
        ...EvpnRtAsOnSegmentHostingFields
        ...FirewallContextsOnDeviceHostingFields
      }
    }
  }
  ... on TopologyColocationZone {
    parent {
      node {
        ...EvpnRtAsOnSegmentHostingFields
      }
    }
  }
  ... on TopologyVirtualColocation {
    parent {
      node {
        ...EvpnRtAsOnSegmentHostingFields
      }
    }
  }
}

fragment FirewallContextConfigFields on ManagedFirewallContext {
  id
  name {
    value
  }
  context_id {
    value
  }
  # The devices that enforce the context: checks/common.py validate_context_members holds them to one HA pair. Their
  # role is the context's (an Internet edge context stands on an external-firewall pair).
  shared_devices {
    edges {
      node {
        name {
          value
        }
        role {
          value
        }
      }
    }
  }
  vlan_id {
    value
  }
  snat_address {
    node {
      address {
        value
      }
    }
  }
  tenant {
    node {
      id
      ... on TopologyCustomerDC {
        name {
          value
        }
      }
      ... on TopologyCustomerColocation {
        name {
          value
        }
      }
    }
  }
  terminated_segments {
    edges {
      node {
        id
        name {
          value
        }
        security_zone {
          node {
            name {
              value
            }
            trust_level {
              value
            }
            description {
              value
            }
            id
            l3_vni {
              value
            }
            vrf_type {
              value
            }
          }
        }
        gateway {
          node {
            address {
              value
            }
          }
        }
        segment_deployments {
          edges {
            node {
              vlans {
                edges {
                  node {
                    vlan_id {
                      value
                    }
                    device {
                      node {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  served_deployments {
    edges {
      node {
        id
        ... on TopologyCustomerDC {
          name {
            value
          }
          network_segments {
            edges {
              node {
                id
                ...ContextServedSegmentFields
              }
            }
          }
          # Every context the footprint lists, with its members' role: the share of the footprint's rules each one
          # holds follows from the list (utils/firewall_split.py), and an Internet edge translates a footprint with a
          # dedicated internal context to that context's public address.
          serving_firewall_contexts {
            edges {
              node {
                id
                tenant {
                  node {
                    id
                  }
                }
                snat_address {
                  node {
                    address {
                      value
                    }
                  }
                }
                shared_devices {
                  edges {
                    node {
                      role {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        ... on TopologyCustomerColocation {
          name {
            value
          }
          network_segments {
            edges {
              node {
                id
                ...ContextServedSegmentFields
              }
            }
          }
          # Every context the footprint lists, with its members' role: the share of the footprint's rules each one
          # holds follows from the list (utils/firewall_split.py), and an Internet edge translates a footprint with a
          # dedicated internal context to that context's public address.
          serving_firewall_contexts {
            edges {
              node {
                id
                tenant {
                  node {
                    id
                  }
                }
                snat_address {
                  node {
                    address {
                      value
                    }
                  }
                }
                shared_devices {
                  edges {
                    node {
                      role {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ContextServedSegmentFields on ManagedNetworkSegment {
  ...SegmentRulesFields
  gateway {
    node {
      ip_prefix {
        node {
          prefix {
            value
          }
        }
      }
    }
  }
  security_zone {
    node {
      name {
        value
      }
      trust_level {
        value
      }
      description {
        value
      }
      id
      l3_vni {
        value
      }
      vrf_type {
        value
      }
    }
  }
}

fragment FirewallZoneFields on SecurityZone {
  name {
    value
  }
  trust_level {
    value
  }
  description {
    value
  }
  network_segments {
    edges {
      node {
        id
        ... on ManagedVxlanSegment {
          security_zone {
            node {
              ...RoutingZoneFields
            }
          }
          name {
            value
          }
          gateway {
            node {
              ip_prefix {
                node {
                  prefix {
                    value
                  }
                }
              }
            }
          }
        }
        ...SegmentRulesFields
      }
    }
  }
}
