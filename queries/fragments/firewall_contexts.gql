fragment FirewallContextLegFields on ManagedFirewallContext {
  id
  tenant { node { id } }
  # Deployments whose segments terminate here: a leaf sends a flow through
  # the firewall only when both its segments are served by one context.
  served_deployments { edges { node { id } } }
  interface_capabilities {
    edges {
      node {
        name { value }
        device { node { role { value } } }
        ... on DcimVirtualInterface {
          ip_address {
            node {
              address { value }
              ip_namespace { node { name { value } namespace_type { value } } }
            }
          }
        }
      }
    }
  }
}

fragment FirewallContextsOnDeviceHostingFields on TopologyDeviceHosting {
  devices(role__value: "firewall") {
    edges {
      node {
        ... on DcimPhysicalDevice {
          capabilities {
            edges {
              node {
                __typename
                ... on ManagedFirewallHA {
                  contexts {
                    edges {
                      node {
                        ...FirewallContextLegFields
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

# A device's own `deployment` is the DC directly for DC-level tiers
# (border-leaf, firewall, spine, super-spine) but the POD for pod-level
# tiers (leaf, tor, access-leaf) — see generators/topology/rack.py's
# deployment_id=self.data["pod"]["id"] vs generators/topology/dc.py's
# deployment_id=dc_id. One extra `parent` hop covers the pod case; DC-level
# devices' deployment has no `parent` fragment match, so only the direct
# TopologyDeviceHosting fragment applies for them.
fragment FirewallContextsOnDeploymentFields on TopologyDeployment {
  ...FirewallContextsOnDeviceHostingFields
  ... on TopologyPod {
    parent {
      node {
        ...FirewallContextsOnDeviceHostingFields
      }
    }
  }
}

fragment FirewallContextConfigFields on ManagedFirewallContext {
  id
  name { value }
  context_id { value }
  vlan_id { value }
  tenant {
    node {
      id
      ... on TopologyCustomerDC { name { value } }
      ... on TopologyCustomerColocation { name { value } }
    }
  }
  # The segments terminating on this context: every
  # segment of a deployment it serves. Its rule table is
  # their rules and the rules into them.
  served_deployments {
    edges {
      node {
        id
        ... on TopologyCustomer {
          network_segments {
            edges {
              node {
                id
                ...SegmentRulesFields
                # Own gateway prefix and zone: the context's
                # routes (apply_context_routes) read these,
                # not the SecurityZone root.
                ... on ManagedNetworkSegment {
                  gateway { node { ip_prefix { node { prefix { value } } } } }
                  security_zone { node { name { value } } }
                }
              }
            }
          }
        }
      }
    }
  }
}
