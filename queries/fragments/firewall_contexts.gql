fragment FirewallContextLegFields on ManagedFirewallContext {
  id
  name {
    value
  }
  vlan_id {
    value
  }
  tenant {
    node {
      id
    }
  }
  served_deployments {
    edges {
      node {
        id
      }
    }
  }
  capabilities {
    edges {
      node {
        name {
          value
        }
        device {
          node {
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
          }
        }
        ...InterfaceRoutingZoneFields
        ... on DcimVirtualInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          ip_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment FirewallContextsOnDeviceHostingFields on TopologyDeviceHosting {
  devices(role__value: "internal-firewall") {
    edges {
      node {
        ... on DcimPhysicalDevice {
          capabilities {
            edges {
              node {
                __typename
                ... on ManagedFirewallHA {
                  contexts {
                    edges {
                      node {
                        ...FirewallContextLegFields
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment FirewallContextsOnDeploymentFields on TopologyDeployment {
  ...FirewallContextsOnDeviceHostingFields
  ... on TopologyPod {
    parent {
      node {
        ...FirewallContextsOnDeviceHostingFields
      }
    }
  }
}

fragment FirewallContextConfigFields on ManagedFirewallContext {
  id
  name {
    value
  }
  context_id {
    value
  }
  vlan_id {
    value
  }
  snat_address {
    node {
      address {
        value
      }
    }
  }
  tenant {
    node {
      id
      ... on TopologyCustomerDC {
        name {
          value
        }
      }
      ... on TopologyCustomerColocation {
        name {
          value
        }
      }
    }
  }
  terminated_segments {
    edges {
      node {
        id
        name {
          value
        }
        security_zone {
          node {
            name {
              value
            }
            trust_level {
              value
            }
            description {
              value
            }
            id
            l3_vni {
              value
            }
            vrf_type {
              value
            }
          }
        }
        gateway {
          node {
            address {
              value
            }
          }
        }
        segment_deployments {
          edges {
            node {
              vlans {
                edges {
                  node {
                    vlan_id {
                      value
                    }
                    device {
                      node {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  served_deployments {
    edges {
      node {
        id
        ... on TopologyCustomerDC {
          parent {
            node {
              id
              ... on TopologySegmentHosting {
                internet_edge_contexts {
                  edges {
                    node {
                      id
                    }
                  }
                }
              }
            }
          }
          network_segments {
            edges {
              node {
                id
                ...ContextServedSegmentFields
              }
            }
          }
        }
        ... on TopologyCustomerColocation {
          network_segments {
            edges {
              node {
                id
                ...ContextServedSegmentFields
              }
            }
          }
        }
      }
    }
  }
  internet_edge_hostings {
    edges {
      node {
        id
        ... on TopologyDataCenter {
          children {
            edges {
              node {
                id
                ... on TopologyCustomerDC {
                  name {
                    value
                  }
                  environment {
                    value
                  }
                  network_segments {
                    edges {
                      node {
                        id
                        ...ContextServedSegmentFields
                      }
                    }
                  }
                  serving_firewall_context {
                    node {
                      id
                      tenant {
                        node {
                          id
                        }
                      }
                      snat_address {
                        node {
                          address {
                            value
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ContextServedSegmentFields on ManagedNetworkSegment {
  ...SegmentRulesFields
  gateway {
    node {
      ip_prefix {
        node {
          prefix {
            value
          }
        }
      }
    }
  }
  security_zone {
    node {
      name {
        value
      }
      trust_level {
        value
      }
      description {
        value
      }
      id
      l3_vni {
        value
      }
      vrf_type {
        value
      }
    }
  }
}

fragment FirewallZoneFields on SecurityZone {
  name {
    value
  }
  trust_level {
    value
  }
  description {
    value
  }
  network_segments {
    edges {
      node {
        id
        ... on ManagedVxlanSegment {
          security_zone {
            node {
              ...RoutingZoneFields
            }
          }
          name {
            value
          }
          gateway {
            node {
              ip_prefix {
                node {
                  prefix {
                    value
                  }
                }
              }
            }
          }
        }
        ...SegmentRulesFields
      }
    }
  }
}

fragment FirewallInterfaceZoneFields on DcimInterface {
  ... on DcimSwitchedInterface {
    segments {
      edges {
        node {
          security_zone {
            node {
              ...RoutingZoneFields
            }
          }
        }
      }
    }
  }
}
