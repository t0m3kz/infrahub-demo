# A segment's security rules, as every consumer reads them: the leaf ACL
# and PBR bypass (transforms/helpers/acl.py, firewall.py,
# policy.py) and the firewall rule tables (transforms/helpers/firewall.py
# place_policies_in_contexts / get_zone_policies). Every rule lives in its
# source segment's one policy, so a segment's own rules are its
# security_policy's, and the rules into it are its inbound_rules (from
# whichever segment's policy holds them, so they carry that policy).

# One end of a rule: what it matches on (gateway prefix), its zone and the
# customer deployments a firewall context / PBR resolves it by.
fragment PolicyRuleSegmentFields on ManagedNetworkSegment {
  id
  name { value }
  customer_name { value }
  environment { value }
  security_zone { node { name { value } } }
  gateway { node { ip_prefix { node { prefix { value } } } } }
  ... on ManagedVxlanSegment { customer_deployments { edges { node { id } } } }
  # A cloud segment has no gateway: its address is cidr_block.
  ... on CloudNetworkSegment {
    cidr_block { value }
    customer_deployment { node { id } }
  }
}

fragment SecurityPolicyFields on SecurityPolicy {
  id
  name { value }
  enabled { value }
  default_action { value }
  # The segment the policy governs — what its default action applies to.
  segment { node { ...PolicyRuleSegmentFields } }
}

fragment SecurityPolicyRuleFields on SecurityPolicyRule {
  id
  index { value }
  name { value }
  action { value }
  protocol { value }
  port_start { value }
  port_end { value }
  log { value }
  disabled { value }
  description { value }
  apply_on_switch { value }
  security_profile { node { name { value } } }
  source_segment { node { ...PolicyRuleSegmentFields } }
  destination_segment { node { ...PolicyRuleSegmentFields } }
  # The internet: a rule to it names the zone (INTERNET-ZONE), not a segment.
  destination_zone { node { name { value } } }
  source_prefixes { edges { node { id prefix { value } ip_namespace { node { name { value } } } } } }
  destination_prefixes { edges { node { id prefix { value } ip_namespace { node { name { value } } } } } }
  source_ip_addresses { edges { node { id address { value } ip_namespace { node { name { value } } } } } }
  destination_ip_addresses { edges { node { id address { value } ip_namespace { node { name { value } } } } } }
}

fragment SegmentRulesFields on ManagedNetworkSegment {
  security_policy {
    node {
      ...SecurityPolicyFields
      rules { edges { node { ...SecurityPolicyRuleFields } } }
    }
  }
  inbound_rules {
    edges {
      node {
        ...SecurityPolicyRuleFields
        policy { node { ...SecurityPolicyFields } }
      }
    }
  }
}
