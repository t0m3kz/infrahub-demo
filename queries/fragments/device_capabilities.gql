fragment ManagedBGPServiceFields on ManagedBGP {
  multipath {
    value
  }
  graceful_restart {
    value
  }
  confederation_identifier {
    value
  }
  process_role {
    value
  }
  local_as {
    node {
      asn {
        value
      }
    }
  }
  router_id {
    node {
      address {
        value
      }
    }
  }
  peerings {
    edges {
      node {
        id
        name {
          value
        }
        peering_role {
          value
        }
        session_type {
          value
        }
        bfd_enabled {
          value
        }
        send_community {
          value
        }
        send_extended_community {
          value
        }
        local_pref {
          value
        }
        med {
          value
        }
        remove_private_as {
          value
        }
        password {
          node {
            password {
              value
            }
          }
        }
        ttl {
          value
        }
        route_reflector_client {
          value
        }
        import_policies {
          edges {
            node {
              ...RoutingPolicyFields
            }
          }
        }
        export_policies {
          edges {
            node {
              ...RoutingPolicyFields
            }
          }
        }
        address_families {
          edges {
            node {
              afi {
                value
              }
              safi {
                value
              }
            }
          }
        }
        capabilities {
          edges {
            node {
              name {
                value
              }
              ...InterfaceRoutingZoneFields
              ... on DcimPhysicalInterface {
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on DcimVirtualInterface {
                vlan_id {
                  value
                }
                ip_address {
                  node {
                    address {
                      value
                    }
                    ip_namespace {
                      node {
                        name {
                          value
                        }
                      }
                    }
                  }
                }
              }
              device {
                node {
                  __typename
                  name {
                    value
                  }
                  ... on DcimDeviceManaged {
                    role {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        bgp_processes {
          edges {
            node {
              process_role {
                value
              }
              router_id {
                node {
                  address {
                    value
                  }
                }
              }
              local_as {
                node {
                  asn {
                    value
                  }
                }
              }
              capabilities {
                edges {
                  node {
                    name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment DeviceCapabilitiesFields on DcimDeviceManaged {
  capabilities {
    edges {
      node {
        __typename
        ... on ManagedGeneric {
          name {
            value
          }
          status {
            value
          }
        }
        ...ManagedBGPServiceFields
        ... on ManagedOSPF {
          process_id {
            value
          }
          version {
            value
          }
          router_type {
            value
          }
          reference_bandwidth {
            value
          }
          router_id {
            node {
              address {
                value
              }
            }
          }
        }
        ... on ManagedStaticRoute {
          prefix {
            value
          }
          next_hop {
            value
          }
          distance {
            value
          }
          exported {
            value
          }
          vrf {
            node {
              security_zone {
                node {
                  ...RoutingZoneFields
                }
              }
            }
          }
        }
        ... on ManagedMLAG {
          id
          domain_id {
            value
          }
          reload_delay {
            value
          }
          reload_delay_non_mlag {
            value
          }
          capabilities {
            edges {
              node {
                name {
                  value
                }
                ... on DcimDevice {
                  ... on DcimDeviceManaged { role { value } primary_address { node { address { value } } } }
                }
              }
            }
          }
          # The domain's own interfaces (ManagedMLAG.interfaces): each member's peer-link and control SVI, read by
          # transforms/helpers/mlag.py get_mlag. Each field once per object, the kind-specific ones in their own
          # inline fragment.
          interfaces {
            edges {
              node {
                __typename
                name { value }
                role { value }
                device { node { name { value } } }
                ...InterfaceRoutingZoneFields
                ... on DcimLAGInterface {
                  lag_id { value }
                  lacp_mode { value }
                  member_interfaces { edges { node { name { value } } } }
                }
                ... on DcimVirtualInterface {
                  ip_address { node { address { value } } }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment DeviceSharedCapabilitiesOnDeviceFields on DcimDevice {
  ... on DcimDeviceManaged {
    shared_capabilities {
      edges {
        node {
          __typename
          ...FirewallContextConfigFields
          ... on ManagedVRF {
            security_zone {
              node {
                ...RoutingZoneFields
              }
            }
          }
        }
      }
    }
  }
}

fragment DeviceCapabilitiesOnDeviceFields on DcimDevice {
  ...DeviceSharedCapabilitiesOnDeviceFields
  ... on DcimDeviceManaged {
    ...DeviceCapabilitiesFields
  }
}
