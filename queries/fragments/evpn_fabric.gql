fragment EvpnRtAsOnSegmentHostingFields on TopologySegmentHosting {
  evpn_rt_as {
    node {
      asn { value }
    }
  }
  evpn_anycast_gateway_mac { value }
  # The BGP route protection (utils/bgp_expectation.py, transforms/helpers/bgp_facts.py): the staging switch and the
  # supernet the fabric's loopbacks are sliced from. The DC and the metro name their pool on different relationships
  # (identifiers dc__loopback_pool / colocation_metro__loopback_pool), so one inline fragment each.
  routing_filter_enforce { value }
  ... on TopologyDataCenter {
    loopback_pool { node { resources { edges { node { prefix { value } } } } } }
  }
  ... on TopologyColocationMetro {
    loopback_pool { node { resources { edges { node { prefix { value } } } } } }
  }
}

# ORDER MATTERS: spread EvpnRtAsOnDeploymentFields FIRST in the device's deployment selection. On the
# pod/zone -> parent hop Infrahub returns null for the TopologySegmentHosting fields of a spread that comes
# after a TopologyDeviceHosting one (FirewallContexts) and for a second
# SegmentHosting-typed fragment, so every field read from the DC lives in this one fragment. With the
# spread after that one, a pod-tier VTEP got evpn_rt_as = null and derived its route-targets from its
# own ASN (checked on the 30_all stack: every leaf/access-leaf of DC10-12 had it null).
#
# Fabric-wide EVPN constants, reached from a device's own `deployment`: the
# route-target admin ASN and the anycast-gateway MAC. Both must be identical on
# every VTEP in the fabric, which is why they live on TopologySegmentHosting and
# are read here rather than per-device.
#
# Only TopologyDataCenter, TopologyColocationMetro and TopologyCustomerOffice
# inherit TopologySegmentHosting (schemas/extensions/topology/topology.yml) —
# TopologyPod, TopologyColocationZone and TopologyVirtualColocation do not. So DC-level
# tiers (border-leaf, border-spine) and an office's switches (access-switch,
# distribution-switch) match the generic directly, while pod-level tiers (leaf, tor,
# access-leaf) whose deployment IS the pod, and a colocation edge whose deployment IS its
# zone or virtual colocation, need one `parent` hop to reach the DC or the metro (the
# metro is the Multi-Site site, so it keeps evpn_rt_as). Same two-shape traversal as
# FirewallContextsOnDeploymentFields in queries/fragments/firewall_contexts.gql.
fragment EvpnRtAsOnDeploymentFields on TopologyDeployment {
  ...EvpnRtAsOnSegmentHostingFields
  ... on TopologyPod {
    parent {
      node {
        ...EvpnRtAsOnSegmentHostingFields
      }
    }
  }
  ... on TopologyColocationZone {
    parent {
      node {
        ...EvpnRtAsOnSegmentHostingFields
      }
    }
  }
  ... on TopologyVirtualColocation {
    parent {
      node {
        ...EvpnRtAsOnSegmentHostingFields
      }
    }
  }
}
