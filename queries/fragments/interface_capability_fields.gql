fragment OspfInterfaceCapabilityFields on RoutingOSPFInterface {
  name {
    value
  }
  mode {
    value
  }
  metric {
    value
  }
  authentication_mode {
    value
  }
  password {
    node {
      password {
        value
      }
    }
  }
  peering {
    node {
      ospf_process {
        edges {
          node {
            process_id {
              value
            }
            router_id {
              node {
                address {
                  value
                }
              }
            }
            capabilities {
              edges {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
      ospf_area {
        node {
          area {
            value
          }
          area_type {
            value
          }
        }
      }
      network_type {
        value
      }
      cost {
        value
      }
    }
  }
}

fragment InterfaceCapabilitiesFields on DcimInterface {
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
      }
    }
  }
}

# The interface's own `capabilities`, the ONE plain selection of the field on an interface object: OSPF and the VLAN
# rows a switch port is a member of, its switch's ManagedSegmentVlan per segment
# (transforms/helpers/segments.py interface_segments reads the segment of each row's deployment).
fragment InterfaceCapabilitiesWithSegmentFields on DcimInterface {
  ...InterfaceRoutingZoneFields
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
        ... on ManagedSegmentVlan {
          id
          vlan_id {
            value
          }
          device {
            node {
              id
            }
          }
          segment_deployment {
            node {
              id
              vni {
                value
              }
              segment {
                node {
                  __typename
                  ...NetworkSegmentFields
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment InterfaceCapabilitiesOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesFields
}

fragment InterfaceCapabilitiesWithSegmentOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesWithSegmentFields
}
