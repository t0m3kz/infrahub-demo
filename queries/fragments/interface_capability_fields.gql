fragment OspfInterfaceCapabilityFields on RoutingOSPFInterface {
  name { value }
  mode { value }
  metric { value }
  authentication_mode { value }
  password { node { password { value } } }
  peering {
    node {
      ospf_process {
        edges {
          node {
            process_id { value }
            router_id { node { address { value } } }
            capabilities { edges { node { name { value } } } }
          }
        }
      }
      ospf_area { node { area { value } area_type { value } } }
      network_type { value }
      cost { value }
      capabilities {
        edges {
          node {
            name { value }
            device { node { name { value } } }
          }
        }
      }
    }
  }
}

fragment ExchangeGatewayInterfaceCapabilityFields on TopologyExchangeGateway {
  ... on TopologyRoutedExchange {
    id
    name { value }
    description { value }
    status { value }
    # The firewall context the two VRFs are exchanged through. Its legs are
    # NOT listed here (that grows O(exchanges x interfaces)): a consumer
    # groups the legs of the context by the exchange id carried on each leg.
    gateway { node { id tenant { node { id } } } }
  }
}

fragment InterfaceCapabilitiesFields on DcimInterface {
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
      }
    }
  }
}

fragment FirewallContextInterfaceCapabilityFields on ManagedFirewallContext {
  id
  name { value }
  vlan_id { value }
  tenant { node { id } }
  served_deployments { edges { node { id } } }
  snat_address { node { address { value } } }
  # The context's legs: each member's VLAN sub-interface, in the leg's VRF
  # namespace, tagged with the context and with the exchange(s) of that leg.
  capabilities {
    edges {
      node {
        name { value }
        device { node { name { value } role { value } } }
        ... on DcimVirtualInterface {
          ip_address {
            node {
              address { value }
              ip_namespace { node { name { value } l3_vni { value } namespace_type { value } } }
            }
          }
          capabilities {
            edges {
              node {
                ... on TopologyRoutedExchange {
                  id
                  gateway { node { id tenant { node { id } } } }
                }
              }
            }
          }
        }
      }
    }
  }
}

# A load-balancer context on the border's load-balancer port: one leg in the
# tenant VRF (the transit VLAN/VNI/anycast .1 come from vlan_id and the leg /29,
# utils.exchange_transit), and the routed VIP range the border leaf statics to
# the leg's floating .4 (transforms/helpers/firewall.py get_exchange_routes).
fragment LoadbalancerContextInterfaceCapabilityFields on ManagedLoadbalancerContext {
  id
  name { value }
  vlan_id { value }
  vip_prefix { node { prefix { value } } }
  # The leg: each member's VLAN sub-interface, addressed in the tenant VRF.
  capabilities {
    edges {
      node {
        name { value }
        device { node { name { value } role { value } } }
        ... on DcimVirtualInterface {
          ip_address {
            node {
              address { value }
              ip_namespace { node { name { value } l3_vni { value } namespace_type { value } } }
            }
          }
        }
      }
    }
  }
}

# An infrastructure VLAN (ManagedVlan) carried by the port: a fixed ID, L2 only. `role` is left out on purpose:
# a Dropdown here would conflict with a sibling capability's field of the same name.
fragment InfraVlanInterfaceCapabilityFields on ManagedVlan {
  id
  name { value }
  description { value }
  vlan_id { value }
  vlan_domain { node { id } }
}

fragment InterfaceCapabilitiesWithSegmentFields on DcimInterface {
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
        ...NetworkSegmentFields
        ...InfraVlanInterfaceCapabilityFields
        ...ExchangeGatewayInterfaceCapabilityFields
        ...FirewallContextInterfaceCapabilityFields
        ...LoadbalancerContextInterfaceCapabilityFields
      }
    }
  }
}

fragment InterfaceCapabilitiesOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesFields
}

fragment InterfaceCapabilitiesWithSegmentOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesWithSegmentFields
}
