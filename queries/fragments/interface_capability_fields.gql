fragment OspfInterfaceCapabilityFields on RoutingOSPFInterface {
  name {
    value
  }
  mode {
    value
  }
  metric {
    value
  }
  authentication_mode {
    value
  }
  password {
    node {
      password {
        value
      }
    }
  }
  peering {
    node {
      ospf_process {
        edges {
          node {
            process_id {
              value
            }
            router_id {
              node {
                address {
                  value
                }
              }
            }
            capabilities {
              edges {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
      ospf_area {
        node {
          area {
            value
          }
          area_type {
            value
          }
        }
      }
      network_type {
        value
      }
      cost {
        value
      }
      capabilities {
        edges {
          node {
            name {
              value
            }
            device {
              node {
                name {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ExchangeGatewayInterfaceCapabilityFields on TopologyExchangeGateway {
  vrf_a {
    node {
      ...RoutingVrfFields
    }
  }
  vrf_z {
    node {
      ...RoutingVrfFields
    }
  }
  ... on TopologyRoutedExchange {
    id
    name {
      value
    }
    description {
      value
    }
    status {
      value
    }
    gateway {
      node {
        id
        tenant {
          node {
            id
          }
        }
      }
    }
  }
}

fragment PbrPolicyInterfaceCapabilityFields on RoutingPolicy {
  kind {
    value
  }
  origin {
    value
  }
  customer_deployment {
    node {
      id
    }
  }
}

fragment InterfaceCapabilitiesFields on DcimInterface {
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
        ...PbrPolicyInterfaceCapabilityFields
      }
    }
  }
}

fragment FirewallContextInterfaceCapabilityFields on ManagedFirewallContext {
  id
  name {
    value
  }
  vlan_id {
    value
  }
  tenant {
    node {
      id
    }
  }
  served_deployments {
    edges {
      node {
        id
      }
    }
  }
  snat_address {
    node {
      address {
        value
      }
    }
  }
  capabilities {
    edges {
      node {
        name {
          value
        }
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
          }
        }
        ...InterfaceRoutingZoneFields
        ... on DcimVirtualInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          ip_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
          capabilities {
            edges {
              node {
                ... on TopologyRoutedExchange {
                  id
                  gateway {
                    node {
                      id
                      tenant {
                        node {
                          id
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment LoadbalancerContextInterfaceCapabilityFields on ManagedLoadbalancerContext {
  id
  name {
    value
  }
  vlan_id {
    value
  }
  vip_prefix {
    node {
      prefix {
        value
      }
    }
  }
  capabilities {
    edges {
      node {
        name {
          value
        }
        device {
          node {
            name {
              value
            }
            ... on DcimDeviceManaged {
              role {
                value
              }
            }
          }
        }
        ...InterfaceRoutingZoneFields
        ... on DcimVirtualInterface {
          vrf {
            node {
              ...RoutingVrfFields
            }
          }
          ip_address {
            node {
              address {
                value
              }
              ip_namespace {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment InterfaceSegmentsFields on DcimInterface {
  ... on DcimSwitchedInterface {
    segments {
      edges {
        node {
          __typename
          ...NetworkSegmentFields
        }
      }
    }
  }
}

fragment InterfaceCapabilitiesWithSegmentFields on DcimInterface {
  ...InterfaceSegmentsFields
  ... on DcimVirtualInterface {
    vrf {
      node {
        security_zone {
          node {
            ...RoutingZoneFields
          }
        }
      }
    }
  }
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
        ...ExchangeGatewayInterfaceCapabilityFields
        ...FirewallContextInterfaceCapabilityFields
        ...LoadbalancerContextInterfaceCapabilityFields
        ...PbrPolicyInterfaceCapabilityFields
      }
    }
  }
}

fragment InterfaceCapabilitiesOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesFields
}

fragment InterfaceCapabilitiesWithSegmentOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesWithSegmentFields
}
