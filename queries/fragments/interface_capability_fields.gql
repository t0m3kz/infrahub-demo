fragment OspfInterfaceCapabilityFields on RoutingOSPFInterface {
  name {
    value
  }
  mode {
    value
  }
  metric {
    value
  }
  authentication_mode {
    value
  }
  password {
    node {
      password {
        value
      }
    }
  }
  peering {
    node {
      ospf_process {
        edges {
          node {
            process_id {
              value
            }
            router_id {
              node {
                address {
                  value
                }
              }
            }
            capabilities {
              edges {
                node {
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
      ospf_area {
        node {
          area {
            value
          }
          area_type {
            value
          }
        }
      }
      network_type {
        value
      }
      cost {
        value
      }
      capabilities {
        edges {
          node {
            name {
              value
            }
            device {
              node {
                name {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ExchangeGatewayInterfaceCapabilityFields on TopologyExchangeGateway {
  vrf_a {
    node {
      ...RoutingVrfFields
    }
  }
  vrf_z {
    node {
      ...RoutingVrfFields
    }
  }
  ... on TopologyRoutedExchange {
    id
    name {
      value
    }
    description {
      value
    }
    status {
      value
    }
    gateway {
      node {
        id
        tenant {
          node {
            id
          }
        }
      }
    }
  }
}

fragment InterfaceCapabilitiesFields on DcimInterface {
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
      }
    }
  }
}

# The interface's own `capabilities`, the ONE plain selection of the field on an interface object: OSPF, the routed
# exchange and the segment deployments a switch port is a member of (transforms/helpers/segments.py
# interface_segments reads the segment of each).
fragment InterfaceCapabilitiesWithSegmentFields on DcimInterface {
  ...InterfaceRoutingZoneFields
  capabilities {
    edges {
      node {
        __typename
        ...OspfInterfaceCapabilityFields
        ...ExchangeGatewayInterfaceCapabilityFields
        ... on ManagedSegmentDeployment {
          id
          segment {
            node {
              __typename
              ...NetworkSegmentFields
            }
          }
        }
      }
    }
  }
}

fragment InterfaceCapabilitiesOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesFields
}

fragment InterfaceCapabilitiesWithSegmentOnInterfaceFields on DcimInterface {
  ...InterfaceCapabilitiesWithSegmentFields
}
