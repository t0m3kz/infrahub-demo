# What the plans of a change request say about the devices of its artifact diff (add_change_request), in one round
# trip: role, site, owner, MLAG or HA peer, BGP sessions, PROD VRF or footprint. A device's configuration is in the
# artifact diff, its place and role are not (the data diff names a device only when it changed). The generator asks
# only when the diff has an artifact target (an empty `ids` filter is no filter).
query change_request_facts($device_ids: [ID]) {
  DcimDeviceManaged(ids: $device_ids) {
    edges {
      node {
        id
        __typename
        name { value }
        role { value }
        owner { node { __typename ... on OrganizationCustomer { id name { value } } } }
        ... on DcimPhysicalDevice { site: deployment { node { name { value } } } }
        ... on DcimVirtualDevice {
          deployment {
            node {
              __typename
              name { value }
              ... on TopologyEnvironmentScoped { environment { value } }
              ... on TopologyCustomer { owner { node { __typename ... on OrganizationCustomer { id name { value } } } } }
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedMLAG { members: capabilities { edges { node { id name { value } } } } }
              ... on ManagedFirewallHA { members: capabilities { edges { node { id name { value } } } } }
              ... on ManagedLoadbalancerHA { members: capabilities { edges { node { id name { value } } } } }
              ... on ManagedBGP { peerings { count } }
            }
          }
        }
        # The shared edge is DcimDeviceManaged's: spelled under its own condition, the form every query of it uses.
        ... on DcimDeviceManaged {
          shared_capabilities {
            edges {
              node {
                __typename
                ... on ManagedVRF { security_zone { node { name { value } } } }
              }
            }
          }
        }
      }
    }
  }
}
