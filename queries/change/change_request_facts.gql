# What the plans of a change request say about its devices and customers (add_change_request), in one round trip:
# the devices of the artifact diff (role, owner, MLAG or HA peer, BGP sessions, PROD VRF or footprint) and the owners
# of the changed segments, footprints, offices and applications of the data diff. A root is skipped when its ids are
# empty (an empty `ids` filter is no filter).
query change_request_facts(
  $device_ids: [ID]
  $object_ids: [ID]
  $with_devices: Boolean = true
  $with_objects: Boolean = true
) {
  DcimDeviceManaged(ids: $device_ids) @include(if: $with_devices) {
    edges {
      node {
        id
        __typename
        name { value }
        role { value }
        owner { node { __typename ... on OrganizationCustomer { id name { value } } } }
        ... on DcimVirtualDevice {
          deployment {
            node {
              __typename
              ... on TopologyEnvironmentScoped { environment { value } }
              ... on TopologyCustomer { owner { node { __typename ... on OrganizationCustomer { id name { value } } } } }
            }
          }
        }
        capabilities {
          edges {
            node {
              __typename
              ... on ManagedMLAG { members: capabilities { edges { node { id name { value } } } } }
              ... on ManagedFirewallHA { members: capabilities { edges { node { id name { value } } } } }
              ... on ManagedLoadbalancerHA { members: capabilities { edges { node { id name { value } } } } }
              ... on ManagedBGP { peerings { count } }
            }
          }
        }
        # The shared edge is DcimDeviceManaged's: spelled under its own condition, the form every query of it uses.
        ... on DcimDeviceManaged {
          shared_capabilities {
            edges {
              node {
                __typename
                ... on ManagedVRF { security_zone { node { name { value } } } }
              }
            }
          }
        }
      }
    }
  }
  ManagedNetworkSegment(ids: $object_ids) @include(if: $with_objects) {
    edges { node { id owner { node { id name { value } } } } }
  }
  TopologyCustomer(ids: $object_ids) @include(if: $with_objects) {
    edges {
      node {
        id
        owner { node { __typename ... on OrganizationCustomer { id name { value } } } }
        ... on TopologyEnvironmentScoped { environment { value } }
      }
    }
  }
  TopologyCustomerOffice(ids: $object_ids) @include(if: $with_objects) {
    edges { node { id owner { node { __typename ... on OrganizationCustomer { id name { value } } } } } }
  }
  AppApplication(ids: $object_ids) @include(if: $with_objects) {
    edges { node { id owner { node { id name { value } } } } }
  }
}
