# The artifact validator open_change_request runs for, its proposed change and that PC's other validators.
query open_change_request($validator_id: ID!) {
  CoreArtifactValidator(ids: [$validator_id]) {
    edges {
      node {
        id
        state { value }
        proposed_change {
          node {
            id
            name { value }
            state { value }
            source_branch { value }
            validations {
              edges {
                node {
                  __typename
                  state { value }
                }
              }
            }
          }
        }
      }
    }
  }
}
