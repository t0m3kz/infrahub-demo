query change_request_peers {
  CoreProposedChange(state__value: "open") {
    edges {
      node {
        id
        name {
          value
        }
        source_branch {
          value
        }
      }
    }
  }
  ChangeRequest {
    edges {
      node {
        id
        name {
          value
        }
        proposed_change {
          node {
            id
          }
        }
        affected_devices {
          edges {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }
}
