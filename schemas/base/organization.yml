---
version: "1.0"

generics:
  - name: Entity
    namespace: Organization
    description: An organization with a unique identifier (customer or provider).
    include_in_menu: false
    attributes:
      - name: org_id
        kind: Text
        unique: true
        optional: true
        description: "Unique organization identifier (e.g. C001, P001)"
        order_weight: 900
      - name: notification_emails
        kind: List
        label: "Notification E-mails"
        description: "Addresses a provider notifies about what this organization owns (the provider order of a virtual colocation uses them)"  # yamllint disable-line rule:line-length
        optional: true
        order_weight: 950

  - name: Generic
    namespace: Organization
    label: Organization
    description: An organization represent a legal entity, a company.
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{name__value}}"
    icon: mdi:domain
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 800
      - name: description
        kind: Text
        optional: true
        order_weight: 850
    relationships:
      - name: tags
        peer: BuiltinTag
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 3000

nodes:
  - name: Manufacturer
    namespace: Organization
    description: Device Manufacturer
    icon: mdi:domain
    include_in_menu: true
    menu_placement: OrganizationGeneric
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{name__value}}"
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1200
    relationships:
      - name: device_type
        peer: DcimDeviceType
        cardinality: many
        optional: true
      - name: platform
        peer: DcimPlatform
        cardinality: many
        optional: true

  - name: Provider
    namespace: Organization
    description: Circuit or Location Provider
    icon: mdi:domain
    inherit_from:
      - OrganizationGeneric
      - OrganizationEntity
    include_in_menu: true
    menu_placement: OrganizationGeneric
    human_friendly_id:
      - org_id__value
    display_label: "{{name__value}} ({{org_id__value}})"
    attributes:
      # The provider knows its own addressing and session model, so the profile is here: one connection model
      # serves every provider.
      - name: connection_profile
        kind: Dropdown
        label: Connection Profile
        optional: true
        order_weight: 1000
        description: "The addressing and session model of the provider's connections (what a connection to it looks like)"  # yamllint disable-line rule:line-length
        choices:
          - name: aws
            label: AWS
            description: "Direct Connect and Site-to-Site VPN: the customer specifies the peer addresses (Direct Connect), the provider hands a /30 link range (VPN)"  # yamllint disable-line rule:line-length
            color: "#FF9900"
          - name: azure
            label: Azure
            description: "ExpressRoute (provider /30 pair, two sessions) and VPN Gateway"
            color: "#0078D4"
          - name: gcp
            label: Google Cloud
            description: "Cloud Interconnect (VLAN attachment, link-local /29) and Cloud VPN"
            color: "#4285F4"
          - name: oci
            label: Oracle Cloud
            description: "FastConnect virtual circuit and Site-to-Site VPN"
            color: "#C74634"
          - name: equinix
            label: Equinix
            description: "Equinix Fabric connection: a layer 2 service, the BGP session is ours or the far party's"
            color: "#ED1C24"
          - name: megaport
            label: Megaport
            description: "Megaport VXC: a layer 2 service, the BGP session is ours or the far party's"
            color: "#00C2A8"
          - name: zscaler
            label: Zscaler
            description: "GRE or IPsec tunnels to the nearest Zscaler node over the internet"
            color: "#0066CC"
          - name: ibm
            label: IBM Cloud
            description: "Direct Link (Connect/Dedicated) and VPN for VPC"
            color: "#0F62FE"
          - name: alibaba
            label: Alibaba Cloud
            description: "Express Connect (virtual border router) and VPN Gateway"
            color: "#FF6A00"
          - name: generic
            label: Generic
            description: "Any other provider: addresses from our own pool"
            color: "#95A5A6"

  - name: Customer
    namespace: Organization
    description: Customer with dedicated network namespace
    icon: mdi:account-group
    inherit_from:
      - OrganizationGeneric
      - OrganizationEntity
    include_in_menu: true
    menu_placement: OrganizationGeneric
    human_friendly_id:
      - org_id__value
    display_label: "{{name__value}} ({{org_id__value}})"
    attributes:
      # Not `unique: true`: an optional attribute collides on the second unset value (a customer
      # created by data has none until add_customer_routing_tag draws it). The pool hands out
      # distinct numbers and checks/routing_tags.py reports a duplicate.
      - name: routing_tag
        kind: Number
        label: Routing Tag
        optional: true
        order_weight: 1050
        description: "Tag of the customer community 64496:<tag> on its routes (drawn from a pool, never typed)."
        parameters:
          min_value: 1
          max_value: 65534
