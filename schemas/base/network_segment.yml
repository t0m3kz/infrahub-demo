---
version: "1.0"
generics:
  - name: NetworkSegment
    namespace: Managed
    description: "Base generic for all network segments (on-prem VXLAN and cloud VPC subnets)"  # yamllint disable-line rule:line-length
    label: Network Segment
    icon: "carbon:network-3"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        description: "Network segment identifier"
        # {org_id}-{customer_name}-{environment}, lowercased.
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{owner__org_id__value|lower}}-{{customer_name__value|lower|replace(' ', '-')}}-{{environment__value}}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: false
      - name: description
        kind: Text
        optional: true
        order_weight: 110
        description: "Description of the network segment purpose"
      - name: customer_name
        kind: Text
        label: Customer Segment Name
        optional: false
        order_weight: 150
        description: "Customer-facing name for the segment"
      - name: environment
        kind: Dropdown
        description: "Customer Environment"
        optional: false
        order_weight: 160
        choices:
          - name: p
            label: Production
            description: "Production environment"
            color: "#A9CCE3"
          - name: n
            label: Non-Production
            description: "Non-Production environment"
            color: "#A9DFBF"
          - name: s
            label: Staging
            description: "Staging environment"
            color: "#FFA500"
          - name: d
            label: Development
            description: "Development environment"
            color: "#7f7fff"
          - name: t
            label: Testing
            description: "Testing environment"
            color: "#D2B4DE"
      - name: segment_type
        kind: Dropdown
        optional: true
        order_weight: 250
        description: "Segmentation technology (VXLAN on-prem, subnet in the cloud)"
        choices:
          - name: vxlan
            label: VXLAN
            description: "VXLAN overlay segment"
            color: "#3498DB"
          - name: cloud_subnet
            label: Cloud Subnet
            description: "Subnet of a cloud virtual network (the provider is the network's account provider)"
            color: "#FF9900"
      # The size of the segment's IPv4 prefix is derived from it (utils/segment_addressing.py segment_prefix_length):
      # the hosts plus the network, broadcast and gateway addresses, rounded up to a power of two. Unset: the
      # segment_prefix_length of the footprint's design.
      - name: host_count
        kind: Number
        label: Host Count
        optional: true
        order_weight: 260
        description: "Hosts the segment must hold; sizes its IPv4 prefix (unset: its design's segment_prefix_length). Not used by IPv6."  # yamllint disable-line rule:line-length
        parameters:
          min_value: 1
          max_value: 1021
      # One address family per segment, no dual stack. IPv6 is addressed (a /64 from the customer's IPv6 pool) but
      # no device renders it yet: a transform refuses a device that carries one (utils/segment_addressing.py
      # require_ipv4_segments). A cloud segment is IPv4 (checks/customer_quota.py).
      - name: ip_version
        kind: Dropdown
        label: IP Version
        optional: false
        default_value: ipv4
        order_weight: 265
        description: "Address family of the segment's prefix and gateway; IPv6 segments are addressed but not rendered yet"  # yamllint disable-line rule:line-length
        choices:
          - name: ipv4
            label: IPv4
            description: "IPv4 prefix, sized from host_count or the design's segment_prefix_length"
            color: "#3498DB"
          - name: ipv6
            label: IPv6
            description: "IPv6 prefix, the design's ipv6_segment_prefix_length, from the customer's IPv6 pool"
            color: "#9B59B6"
      - name: isolation_mode
        kind: Dropdown
        label: Isolation Mode
        description: "Intra-segment traffic policy"
        optional: true
        order_weight: 850
        default_value: normal
        choices:
          - name: normal
            label: Normal
            description: "Hosts within the segment can talk freely"
            color: "#2ECC71"
          - name: isolated
            label: Isolated
            description: "Hosts within the segment cannot talk to each other (port-isolation / PVLAN)"
            color: "#F39C12"
          - name: microsegmented
            label: Microsegmented
            description: "Routed traffic always meets the leaf SVI ACL (even with a firewall); traffic inside the segment only through component group policy"  # yamllint disable-line rule:line-length
            color: "#9B59B6"
      # Not `unique: true`: an optional attribute collides on the second unset value (a segment
      # created by data has none until its generator draws it). The pool hands out distinct numbers
      # and checks/routing_tags.py reports a duplicate.
      - name: routing_tag
        kind: Number
        label: Routing Tag
        optional: true
        order_weight: 900
        description: "Tag of the segment community 64497:<tag> on its routes (drawn from a pool, never typed)."
        parameters:
          min_value: 1
          max_value: 65534
      - name: status
        kind: Dropdown
        optional: true
        order_weight: 120
        default_value: active
        choices:
          - name: active
            label: Active
            description: Segment is active and operational
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: Segment is being provisioned
            color: "#7f7fff"
    relationships:
      - name: owner
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        order_weight: 105
        optional: false
        on_delete: no-action
        description: "Customer that owns the network segment"
        identifier: network_segment__owner
      - name: gateway
        peer: IpamIPAddress
        label: Anycast Gateway
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 3200
        identifier: network_segment__gateway
        description: >-
          Anycast gateway (v4 or v6) for this SVI; gateway.ip_prefix gives
          the subnet, security_zone gives its routing domain.
