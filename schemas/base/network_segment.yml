---
version: "1.0"
generics:
  - name: NetworkSegment
    namespace: Managed
    description: "Base generic for all network segments (on-prem VLAN/VXLAN and cloud VPC subnets)"  # yamllint disable-line rule:line-length
    label: Network Segment
    icon: "carbon:network-3"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        description: "Network segment identifier"
        # {org_id}-{customer_name}-{environment}, except a segment named after
        # its owner (org_id == customer_name, the Internet pseudo-customer's
        # ManagedExternalSegment): just that token, e.g. "internet". No real
        # customer's org_id (C005, P012, INFRA, ...) is one of its segment names.
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{% if owner__org_id__value|lower == customer_name__value|lower|replace(' ', '-') %}{{owner__org_id__value|lower}}{% else %}{{owner__org_id__value|lower}}-{{customer_name__value|lower|replace(' ', '-')}}-{{environment__value}}{% endif %}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: false
      - name: description
        kind: Text
        optional: true
        order_weight: 200
        description: "Description of the network segment purpose"
      - name: customer_name
        kind: Text
        label: Customer Segment Name
        optional: false
        order_weight: 150
        description: "Customer-facing name for the segment"
      - name: environment
        kind: Dropdown
        description: "Customer Environment"
        optional: false
        order_weight: 160
        choices:
          - name: p
            label: Production
            description: "Production environment"
            color: "#A9CCE3"
          - name: n
            label: Non-Production
            description: "Non-Production environment"
            color: "#A9DFBF"
          - name: s
            label: Staging
            description: "Staging environment"
            color: "#FFA500"
          - name: d
            label: Development
            description: "Development environment"
            color: "#7f7fff"
          - name: t
            label: Testing
            description: "Testing environment"
            color: "#D2B4DE"
      - name: segment_type
        kind: Dropdown
        optional: true
        order_weight: 250
        description: "Segmentation technology (cloud provider or on-prem)"
        choices:
          - name: vlan
            label: VLAN
            description: "IEEE 802.1Q VLAN"
            color: "#7FBF7F"
          - name: vxlan
            label: VXLAN
            description: "VXLAN overlay segment"
            color: "#3498DB"
          - name: aws_vpc_subnet
            label: AWS VPC Subnet
            description: "AWS VPC subnet"
            color: "#FF9900"
          - name: gcp_vpc_subnet
            label: GCP VPC Subnet
            description: "Google Cloud VPC subnet"
            color: "#4285F4"
          - name: azure_vnet_subnet
            label: Azure VNet Subnet
            description: "Azure Virtual Network subnet"
            color: "#0078D4"
      - name: isolation_mode
        kind: Dropdown
        label: Isolation Mode
        description: "Intra-segment traffic policy"
        optional: true
        order_weight: 850
        default_value: normal
        choices:
          - name: normal
            label: Normal
            description: "Hosts within the segment can talk freely"
            color: "#2ECC71"
          - name: isolated
            label: Isolated
            description: "Hosts within the segment cannot talk to each other (port-isolation / PVLAN)"
            color: "#F39C12"
          - name: microsegmented
            label: Microsegmented
            description: "Routed traffic always meets the leaf SVI ACL (even with a firewall); traffic inside the segment only through component group policy"  # yamllint disable-line rule:line-length
            color: "#9B59B6"
      # Not `unique: true`: an optional attribute collides on the second unset value (a segment
      # created by data has none until its generator draws it). The pool hands out distinct numbers
      # and checks/routing_tags.py reports a duplicate.
      - name: routing_tag
        kind: Number
        label: Routing Tag
        optional: true
        order_weight: 900
        description: "Tag of the segment community 64497:<tag> on its routes (drawn from a pool, never typed)."
        parameters:
          min_value: 1
          max_value: 65534
      - name: status
        kind: Dropdown
        optional: true
        order_weight: 300
        default_value: active
        choices:
          - name: active
            label: Active
            description: Segment is active and operational
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: Segment is being provisioned
            color: "#7f7fff"
    relationships:
      - name: owner
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        order_weight: 100
        optional: false
        on_delete: no-action
        description: "Customer that owns the network segment"
        identifier: network_segment__owner
      - name: gateway
        peer: IpamIPAddress
        label: Anycast Gateway
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 3200
        identifier: network_segment__gateway
        description: >-
          Anycast gateway (v4 or v6) for this SVI; also the only path to
          subnet/VRF (gateway.ip_prefix). Absent if L2-only/inline-routed.
