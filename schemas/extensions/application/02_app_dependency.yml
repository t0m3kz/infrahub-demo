---
version: "1.0"

# ============================================================================
# AppDependency — directional edge into an AppEndpoint
#
# The only place an application's ports live. Each dependency has exactly one
# source:
#   - source:         an AppComponent calling the endpoint (firewall, cloud
#                     security group or egress proxy rule, by endpoint_type)
#   - source_profile: a SecurityAccessProfile whose users reach a
#                     private_access endpoint through the ZTNA broker
#
# Security-rule generation expects explicit protocol/port information on each
# dependency edge. Dependencies without protocol and port_start are skipped.
# ============================================================================

nodes:
  - name: Dependency
    namespace: App
    description: "Directional dependency from component to endpoint"
    label: "App Dependency"
    icon: "mdi:arrow-right-bold-circle-outline"
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 100
        description: "Short human-picked identifier (e.g. 'checkout-to-payment-gateway')"
      - name: access_status
        kind: Dropdown
        optional: true
        order_weight: 200
        default_value: auto
        description: "Access decision state for cross-owner dependencies"
        choices:
          - name: auto
            label: "Auto"
            color: "#95A5A6"
          - name: pending
            label: "Pending Approval"
            color: "#F39C12"
          - name: approved
            label: "Approved"
            color: "#2ECC71"
          - name: denied
            label: "Denied"
            color: "#E74C3C"
      - name: protocol
        kind: Dropdown
        optional: true
        order_weight: 300
        description: "IP protocol for this dependency edge"
        choices:
          - name: tcp
            label: "TCP"
            color: "#3498DB"
          - name: udp
            label: "UDP"
            color: "#E67E22"
          - name: icmp
            label: "ICMP"
            color: "#95A5A6"
          - name: any
            label: "Any"
            color: "#BDC3C7"
      - name: port_start
        kind: Number
        optional: true
        order_weight: 400
        description: "Destination port (or start of port range)"
      - name: port_end
        kind: Number
        optional: true
        order_weight: 500
        description: "End of destination port range (omit for single port)"
      - name: description
        kind: Text
        optional: true
        order_weight: 600
      - name: decision_reason
        kind: Text
        optional: true
        order_weight: 650
        description: "Reason for approval/denial decision"
      - name: decision_at
        kind: DateTime
        optional: true
        order_weight: 700
        description: "Timestamp when decision was taken"
      - name: access_expires_at
        kind: DateTime
        optional: true
        order_weight: 710
        description: "Approval expiry time; when omitted, generated rules default to 6 months validity"
    relationships:
      - name: source
        peer: AppComponent
        label: "Source Component"
        description: "Component that initiates the connection; leave empty when source_profile is set"
        cardinality: one
        kind: Attribute
        optional: true
        direction: outbound
        identifier: "app_dependency__source"
        order_weight: 200
      - name: source_profile
        peer: SecurityAccessProfile
        label: "Source Access Profile"
        description: "Users admitted by this profile reach a private_access target; leave empty when source is set"
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: no-action
        direction: outbound
        identifier: "app_dependency__source_profile"
        order_weight: 205
      - name: target
        peer: AppEndpoint
        label: "Target Endpoint"
        description: "Endpoint that receives the connection"
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "app_dependency__target"
        order_weight: 210

extensions:
  nodes:
    - kind: AppComponent
      relationships:
        - name: depends_on
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_dependency__source"
          order_weight: 900
          label: "Depends On"
          description: "Outbound dependency edges originating from this component"
          direction: inbound
    - kind: AppEndpoint
      relationships:
        - name: dependents
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_dependency__target"
          order_weight: 1000
          label: "Dependents"
          description: "Dependencies reaching this endpoint, with their ports"
    - kind: SecurityAccessProfile
      relationships:
        - name: dependencies
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_dependency__source_profile"
          order_weight: 1100
          label: "Grants"
          description: "Private-access dependencies this profile grants"
          direction: inbound
