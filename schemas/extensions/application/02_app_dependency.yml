---
version: "1.0"

# ============================================================================
# AppDependency — directional edge into an AppComponent or an external FQDN
#
# Exactly one source:
#   - source:         an AppComponent making the call
#   - source_profile: a SecurityAccessProfile whose users reach the target
#                     through the owner's ZTNA broker (private access)
# Exactly one target:
#   - target:         an AppComponent (firewall or cloud security group rule)
#   - target_fqdn:    an external service, reached through the owner's
#                     egress proxy
#
# ports narrows the target component's ports; when empty, every port of the
# target is allowed. An external target has no ports of its own, so a
# target_fqdn dependency must list them. checks/app_dependency.py enforces
# these rules, since the schema cannot express "exactly one of".
# ============================================================================

nodes:
  - name: Dependency
    namespace: App
    description: "Directional dependency from a component or access profile to a component or external FQDN"
    label: "App Dependency"
    icon: "mdi:arrow-right-bold-circle-outline"
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 100
        description: "Short human-picked identifier (e.g. 'checkout-to-payment-gateway')"
      - name: access_status
        kind: Dropdown
        optional: true
        order_weight: 200
        default_value: auto
        description: "Access decision state for cross-owner dependencies"
        choices:
          - name: auto
            label: "Auto"
            color: "#95A5A6"
          - name: pending
            label: "Pending Approval"
            color: "#F39C12"
          - name: approved
            label: "Approved"
            color: "#2ECC71"
          - name: denied
            label: "Denied"
            color: "#E74C3C"
      - name: ports
        kind: List
        optional: true
        order_weight: 300
        description: "Subset of the target's ports (tcp/443, udp/30000-30010); empty means all of them. Required with target_fqdn"  # yamllint disable-line rule:line-length
      - name: target_fqdn
        kind: Text
        optional: true
        order_weight: 400
        description: "External service reached through the egress proxy; leave empty when target is set"
      - name: description
        kind: Text
        optional: true
        order_weight: 600
      - name: decision_reason
        kind: Text
        optional: true
        order_weight: 650
        description: "Reason for approval/denial decision"
      - name: decision_at
        kind: DateTime
        optional: true
        order_weight: 700
        description: "Timestamp when decision was taken"
      - name: access_expires_at
        kind: DateTime
        optional: true
        order_weight: 710
        description: "Approval expiry time; when omitted, generated rules default to 6 months validity"
    relationships:
      - name: source
        peer: AppComponent
        label: "Source Component"
        description: "Component that initiates the connection; leave empty when source_profile is set"
        cardinality: one
        kind: Attribute
        optional: true
        direction: outbound
        identifier: "app_dependency__source"
        order_weight: 200
      - name: source_profile
        peer: SecurityAccessProfile
        label: "Source Access Profile"
        description: "Users admitted by this profile reach the target via private access; empty when source is set"
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: no-action
        direction: outbound
        identifier: "app_dependency__source_profile"
        order_weight: 205
      - name: target
        peer: AppComponent
        label: "Target Component"
        description: "Component that receives the connection; leave empty when target_fqdn is set"
        cardinality: one
        kind: Attribute
        optional: true
        direction: outbound
        identifier: "app_dependency__target"
        order_weight: 210

extensions:
  nodes:
    - kind: AppComponent
      relationships:
        - name: depends_on
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_dependency__source"
          order_weight: 900
          label: "Depends On"
          description: "Outbound dependency edges originating from this component"
          direction: inbound
        - name: dependents
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_dependency__target"
          order_weight: 1000
          label: "Dependents"
          description: "Inbound dependency edges reaching this component"
          direction: inbound
    - kind: SecurityAccessProfile
      relationships:
        - name: dependencies
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_dependency__source_profile"
          order_weight: 1100
          label: "Grants"
          description: "Private-access dependencies this profile grants"
          direction: inbound
