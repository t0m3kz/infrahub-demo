---
version: "1.0"

# ============================================================================
# AppDependency — directional edge between two AppComponents
#
# Replaces the bare depends_on relationship (AppComponent → AppComponent) with
# a proper intermediary node so that port, port range, and protocol can be
# stored on the edge itself.
#
# Security-rule generation expects explicit protocol/port information on each
# dependency edge. Dependencies without protocol and port_start are skipped.
# ============================================================================

nodes:
  - name: Dependency
    namespace: App
    description: "Directional dependency edge between two application components"
    label: "App Dependency"
    icon: "mdi:arrow-right-bold-circle-outline"
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value"]
      - [source, target, protocol__value, port_start__value, port_end__value]
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 100
        description: "Unique name for this dependency edge (auto-set by loader)"
      - name: access_status
        kind: Dropdown
        optional: true
        order_weight: 200
        default_value: auto
        description: "Access decision state for cross-owner dependencies"
        choices:
          - name: auto
            label: "Auto"
            color: "#95A5A6"
          - name: pending
            label: "Pending Approval"
            color: "#F39C12"
          - name: approved
            label: "Approved"
            color: "#2ECC71"
          - name: denied
            label: "Denied"
            color: "#E74C3C"
      - name: protocol
        kind: Dropdown
        optional: true
        order_weight: 300
        description: "IP protocol for this dependency edge"
        choices:
          - name: tcp
            label: "TCP"
            color: "#3498DB"
          - name: udp
            label: "UDP"
            color: "#E67E22"
          - name: icmp
            label: "ICMP"
            color: "#95A5A6"
          - name: any
            label: "Any"
            color: "#BDC3C7"
      - name: port_start
        kind: Number
        optional: true
        order_weight: 400
        description: "Destination port (or start of port range)"
      - name: port_end
        kind: Number
        optional: true
        order_weight: 500
        description: "End of destination port range (omit for single port)"
      - name: description
        kind: Text
        optional: true
        order_weight: 600
      - name: decision_reason
        kind: Text
        optional: true
        order_weight: 650
        description: "Reason for approval/denial decision"
      - name: decision_at
        kind: DateTime
        optional: true
        order_weight: 700
        description: "Timestamp when decision was taken"
      - name: access_expires_at
        kind: DateTime
        optional: true
        order_weight: 710
        description: "Approval expiry time; when omitted, generated rules default to 6 months validity"
    relationships:
      - name: source
        peer: AppComponent
        label: "Source Component"
        description: "Component that initiates the connection"
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "app_dependency__source"
        order_weight: 200
      - name: target
        peer: AppComponent
        label: "Target Component"
        description: "Component that receives the connection"
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "app_dependency__target"
        order_weight: 210

extensions:
  nodes:
    - kind: AppComponent
      relationships:
        - name: depends_on
          peer: AppDependency
          cardinality: many
          kind: Attribute
          optional: true
          identifier: "app_component__depends_on"
          order_weight: 900
          label: "Depends On"
          description: "Outbound dependency edges originating from this component"
          direction: outbound
