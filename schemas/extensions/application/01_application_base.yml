---
version: "1.0"

generics:
  - name: Generic
    namespace: App
    description: "Base for application hierarchy nodes"
    include_in_menu: false
    hierarchical: true
    attributes:
      - name: description
        kind: Text
        optional: true
        order_weight: 200

nodes:
  # ── Application ───────────────────────────────────────────────────────────
  # A single deployable application within a portfolio.
  - name: Application
    namespace: App
    description: "Business application or service within a portfolio"
    label: "Application"
    icon: "mdi:application"
    include_in_menu: false
    inherit_from:
      - CoreArtifactTarget
      - AppGeneric
    parent: ""
    children: AppComponent
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [owner, label__value, environment__value]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|lower }}-{{ label__value|lower|replace(' ', '-') }}-{{ environment__value }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: true
      - name: label
        kind: Text
        order_weight: 110
        description: "Short application identifier (e.g. ecommerce, auth-platform)"  # yamllint disable-line rule:line-length
        optional: false
      - name: environment
        kind: Dropdown
        optional: true
        order_weight: 500
        default_value: p
        choices:
          - name: p
            label: "Production"
            color: "#7FBF7F"
          - name: s
            label: "Staging"
            color: "#FFA500"
          - name: d
            label: "Development"
            color: "#7f7fff"
          - name: t
            label: "Testing"
            color: "#D2B4DE"
          - name: n
            label: "Non-Production"
            color: "#A9DFBF"
      - name: criticality
        kind: Dropdown
        optional: true
        order_weight: 600
        default_value: medium
        choices:
          - name: low
            label: "Low"
            color: "#90EE90"
          - name: medium
            label: "Medium"
            color: "#FFD700"
          - name: high
            label: "High"
            color: "#FF8C00"
          - name: critical
            label: "Critical"
            color: "#FF0000"
      - name: security_profile
        kind: Dropdown
        optional: false
        order_weight: 650
        default_value: internal_standard
        description: "Global security posture used by rule generation"
        choices:
          - name: fintech_strict
            label: "Fintech Strict"
            color: "#C62828"
          - name: internal_standard
            label: "Internal Standard"
            color: "#2E7D32"
          - name: internet_exposed
            label: "Internet Exposed"
            color: "#EF6C00"
      - name: cost_center
        kind: Text
        optional: true
        order_weight: 700
      - name: fqdn
        kind: Text
        optional: false
        order_weight: 725
        description: "Canonical FQDN for application access/identification"
      - name: ingress_mode
        kind: Dropdown
        optional: true
        order_weight: 750
        default_value: frontend
        description: "How this application is exposed at ingress"
        choices:
          - name: frontend
            label: "Frontend"
            color: "#61DAFB"
            description: "Application is exposed by a frontend/VIP path"
          - name: dns
            label: "DNS"
            color: "#4CAF50"
            description: "Application exposure is DNS-driven (without frontend VIP mapping)"
      - name: application_orchestrator
        kind: Dropdown
        optional: false
        order_weight: 775
        default_value: manual
        description: "Primary automation system used to deploy this application workload"
        choices:
          - name: github_actions
            label: "GitHub Actions"
            color: "#24292F"
          - name: ansible_automation_platform
            label: "Ansible Automation Platform"
            color: "#EE0000"
          - name: argocd
            label: "Argo CD"
            color: "#EF7B4D"
          - name: manual
            label: "Manual"
            color: "#808080"
    relationships:
      - name: owner
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 1000
        identifier: "customer_applications"


  # ── Component ─────────────────────────────────────────────────────────────
  # Logical service tier within an application (frontend, backend, db, etc.)
  - name: Component
    namespace: App
    description: "Logical component of an application"
    label: "Application Component"
    icon: "mdi:cube-outline"
    include_in_menu: false
    inherit_from:
      - AppGeneric
    parent: AppApplication
    children: ""
    human_friendly_id:
      - slug__value
    order_by:
      - slug__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [parent, name__value]
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 100
      - name: slug
        kind: Text
        unique: true
        optional: true
        order_weight: 150
        description: "Globally unique slug — {portfolio}-{app}-{env}-{component}"  # yamllint disable-line rule:line-length
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ parent__name__value }}-{{ name__value|lower|replace(' ', '-') }}"  # yamllint disable-line rule:line-length
        read_only: true
      - name: component_type
        kind: Dropdown
        optional: false
        order_weight: 400
        choices:
          - name: frontend
            label: "Frontend"
            color: "#61DAFB"
          - name: backend
            label: "Backend"
            color: "#68A063"
          - name: database
            label: "Database"
            color: "#336791"
          - name: cache
            label: "Cache"
            color: "#DC382D"
          - name: message_queue
            label: "Message Queue"
            color: "#FF6600"
          - name: worker
            label: "Worker"
            color: "#777777"
          - name: external_service
            label: "External Service"
            color: "#9E9E9E"
            description: "Third-party/shared destination outside this application, reached via egress proxy (no network_segment/instances)"  # yamllint disable-line rule:line-length
      - name: fqdn
        kind: Text
        optional: true
        order_weight: 450
        description: "FQDN: egress destination (external_service) or ZTNA published address (private_access_service)"  # yamllint disable-line rule:line-length
      - name: published_via_ztna
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 452
        label: "Published via ZTNA"
        description: "Explicit intent to publish this component for remote access; gates private_access_service auto-resolution"  # yamllint disable-line rule:line-length
    relationships:
      - name: network_segment
        peer: ManagedNetworkSegment
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 750
        identifier: app_component__network_segment
        label: "Network Segment"
        description: "VXLAN security zone this component lives in"
      - name: instances
        peer: AppInstance
        label: "Instances"
        cardinality: many
        kind: Component
        optional: true
        order_weight: 760
        identifier: "app_component__instances"
        description: "Compute instances (physical, virtual, or cloud) running this component"
      - name: load_balancer
        peer: ManagedLoadbalancerHA
        cardinality: one
        kind: Generic
        optional: true
        on_delete: no-action
        identifier: "app_component__load_balancer"
        order_weight: 845
        label: "Load Balancer HA"
        description: "Assigned LB HA domain used for automatic VIP creation from service ports"
      - name: health_checks
        peer: LoadbalancerHealthCheck
        cardinality: many
        kind: Attribute
        optional: true
        on_delete: no-action
        identifier: "app_component__health_checks"
        order_weight: 846
        label: "Health Checks"
        description: "Health checks associated with this application component"
      - name: proxy_service
        peer: ManagedProxyService
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: no-action
        direction: outbound
        identifier: "app_component__proxy_service"
        order_weight: 850
        label: "Egress Proxy"
        description: "Egress proxy — on-prem (ManagedProxyHA) or cloud SASE (ManagedCloudProxy)"
      - name: proxy_policies
        peer: ProxyPolicy
        cardinality: many
        kind: Attribute
        optional: true
        on_delete: no-action
        identifier: "app_component__proxy_policies"
        order_weight: 855
        label: "Egress Proxy Policies"
        description: "Component-scoped policies layered on top of shared/customer proxy policies; auto-managed from external_service dependencies"  # yamllint disable-line rule:line-length
      - name: private_access_service
        peer: ManagedCloudProxy
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: no-action
        direction: outbound
        identifier: "app_component__private_access_service"
        order_weight: 860
        label: "Private Access (ZTNA) Broker"
        description: "ZTNA broker this component is published through for remote access; opposite of proxy_service (egress)"  # yamllint disable-line rule:line-length
      - name: ztna_allowed_groups
        peer: SecurityIdentityGroup
        cardinality: many
        kind: Attribute
        optional: true
        on_delete: no-action
        identifier: "app_component__ztna_allowed_groups"
        order_weight: 865
        label: "ZTNA Allowed Groups"
        description: "Identity groups permitted to reach this component via private_access_service"

extensions:
  nodes:
    - kind: LoadbalancerVIP
      relationships:
        - name: app_components
          peer: AppComponent
          cardinality: many
          kind: Attribute
          optional: true
          order_weight: 2200
          identifier: "vip_service__app_components"
          description: "Application components exposed by this VIP"

    - kind: ManagedProxyHA
      relationships:
        - name: components
          peer: AppComponent
          cardinality: many
          kind: Attribute
          optional: true
          direction: inbound
          order_weight: 2300
          identifier: "app_component__proxy_service"
          description: "Application components whose egress is assigned to this proxy"

    - kind: ManagedCloudProxy
      relationships:
        - name: components
          peer: AppComponent
          cardinality: many
          kind: Attribute
          optional: true
          direction: inbound
          order_weight: 2300
          identifier: "app_component__proxy_service"
          description: "Application components whose egress is assigned to this proxy"
        - name: published_components
          peer: AppComponent
          cardinality: many
          kind: Attribute
          optional: true
          direction: inbound
          order_weight: 2310
          identifier: "app_component__private_access_service"
          description: "Application components published for remote access through this ZTNA broker (service_type=private_access)"  # yamllint disable-line rule:line-length

    - kind: OrganizationCustomer
      relationships:
        - name: applications
          label: "Applications"
          description: "Applications owned by this customer"
          peer: AppApplication
          cardinality: many
          kind: Generic
          optional: true
          order_weight: 2000
          identifier: "customer_applications"
