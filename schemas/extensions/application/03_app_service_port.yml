---
version: "1.0"

# ============================================================================
# AppServicePort — a globally unique protocol/port (or port range) that
# AppComponent nodes reference via a many-to-many service_ports relationship.
#
# Global design rationale:
#   - Multiple components can expose the same port (e.g. 443/tcp shared across
#     web-frontend nodes in different environments or network segments).
#   - The name template does NOT cross relationship boundaries, avoiding
#     "Relationship has not been initialized yet" errors during Upsert mutations.
#   - port_end covers port-range rules derived from AppDependency.port_end.
#
# Uniqueness: port + port_end + protocol (range-aware).
# HFID:       name__value  (e.g. "443/tcp", "9200/tcp", "8080-8090/tcp")
# ============================================================================

nodes:
  - name: ServicePort
    namespace: App
    description: "A globally unique port/protocol combination exposed by one or more AppComponents"
    label: "Service Port"
    icon: "mdi:ethernet-cable"
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [port__value, port_end__value, protocol__value]
    attributes:
      - name: name
        kind: Text
        optional: true
        read_only: true
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ port__value }}{% if port_end__value %}-{{ port_end__value }}{% endif %}/{{ protocol__value }}"  # yamllint disable-line rule:line-length
      - name: port
        kind: Number
        optional: false
        order_weight: 200
        description: "Port number (or start of range)"
      - name: port_end
        kind: Number
        optional: true
        order_weight: 210
        description: "End of port range (omit for single-port)"
      - name: protocol
        kind: Dropdown
        optional: false
        order_weight: 300
        description: "Transport protocol"
        choices:
          - name: tcp
            label: "TCP"
            color: "#3498DB"
          - name: udp
            label: "UDP"
            color: "#E67E22"
          - name: tcp_udp
            label: "TCP+UDP"
            color: "#9B59B6"
      - name: description
        kind: Text
        optional: true
        order_weight: 400

extensions:
  nodes:
    - kind: AppComponent
      relationships:
        - name: service_ports
          peer: AppServicePort
          label: "Service Ports"
          cardinality: many
          kind: Attribute
          optional: true
          order_weight: 840
          description: "Ports and protocols this component exposes"
