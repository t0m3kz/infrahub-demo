---
version: "1.0"

# Reusable access profiles for private-access publishing. Who reaches a
# component, and on which ports, is an AppDependency (02_app_dependency.yml).
# Proxy selections are resolved from the owning customer rather than authored
# on every AppComponent.
nodes:
  - name: AccessProfile
    namespace: Security
    description: "Reusable identity-based access requirements for published application components"
    label: Access Profile
    icon: "mdi:shield-account-outline"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        optional: false
        unique: true
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 200
      - name: mfa_required
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 300
      - name: device_posture_required
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 400
      - name: session_timeout_minutes
        kind: Number
        optional: true
        order_weight: 500
    relationships:
      - name: allowed_groups
        peer: SecurityIdentityGroup
        cardinality: many
        kind: Attribute
        optional: true
        on_delete: no-action
        identifier: "security_access_profile__allowed_groups"
        order_weight: 1000

extensions:
  nodes:
    - kind: OrganizationCustomer
      relationships:
        - name: egress_service
          peer: ManagedProxyService
          cardinality: one
          kind: Attribute
          optional: true
          on_delete: no-action
          direction: outbound
          identifier: "customer__egress_service"
          order_weight: 2100
          label: "Egress Service"
        - name: private_access_service
          peer: ManagedCloudProxy
          cardinality: one
          kind: Attribute
          optional: true
          on_delete: no-action
          direction: outbound
          identifier: "customer__private_access_service"
          order_weight: 2110
          label: "Private Access Service"

    - kind: ManagedProxyHA
      relationships:
        - name: customers
          peer: OrganizationCustomer
          cardinality: many
          kind: Attribute
          optional: true
          direction: inbound
          identifier: "customer__egress_service"
          order_weight: 2310

    - kind: ManagedCloudProxy
      relationships:
        - name: egress_customers
          peer: OrganizationCustomer
          cardinality: many
          kind: Attribute
          optional: true
          direction: inbound
          identifier: "customer__egress_service"
          order_weight: 2320
        - name: private_access_customers
          peer: OrganizationCustomer
          cardinality: many
          kind: Attribute
          optional: true
          direction: inbound
          identifier: "customer__private_access_service"
          order_weight: 2330
