---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

# ============================================================================
# Routing — VRF instance schema
# A ManagedVRF is one global SecurityZone routing domain realized in one topology: the
# hosting deployment (a DC, a colocation metro or an office, TopologySegmentHosting) its member devices sit in, the
# same level as a segment's realization (ManagedSegmentDeployment) and the scope of the route-target
# (`{evpn_rt_as}:{l3_vni}`). One per (deployment, security_zone), named `{deployment lower}-vrf-{zone name lower}`
# (dc10-vrf-prod, dc10-vrf-nonprod). Its members are the devices that route in the zone, demand-driven
# (utils/vrf_demand.py, the one derivation), written edge by edge by generators/helpers/vrf.py and checked by
# checks/vrf_instances.py. Nothing else is stored: the RD, the RT, the L3 VNI SVI VLAN and whether a member realizes
# it as EVPN or VRF-lite are derived (transforms/helpers/overlay.py); the L3 VNI stays on SecurityZone.
# A firewall or a load balancer is never a member: its VRF is the context.
# ============================================================================

nodes:
  - name: VRF
    namespace: Managed
    description: "One security-zone routing domain realized in a topology (DC, metro, office); its members route in it"
    label: VRF Instance
    icon: "mdi:routes"
    include_in_menu: false
    # The shared device edge, not ManagedGenericDevice: that one (DcimDeviceManaged.capabilities) cascades, and deleting
    # one member would delete the topology's VRF. Membership is `shared_devices` (reverse
    # `DcimDeviceManaged.shared_capabilities`), with no cascade.
    inherit_from:
      - ManagedGeneric
      - ManagedGenericSharedDevice
    human_friendly_id:
      - "deployment__name__value"
      - "security_zone__name__value"
    uniqueness_constraints:
      - ["deployment", "security_zone"]
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    relationships:
      - name: deployment
        peer: TopologySegmentHosting
        label: Deployment
        description: "The DC, colocation metro or office this VRF is realized in (its members' hosting deployment)"
        cardinality: one
        optional: false
        kind: Parent
        identifier: vrf__deployment
        order_weight: 1000
      - name: security_zone
        peer: SecurityZone
        label: Security Zone
        description: "Global routing domain this instance realizes; the zone's name is the CLI VRF name"
        cardinality: one
        optional: false
        kind: Attribute
        on_delete: no-action
        identifier: vrf__security_zone
        order_weight: 1050
      - name: interfaces
        peer: DcimInterface
        cardinality: many
        optional: true
        kind: Generic
        on_delete: no-action
        identifier: vrf__interfaces
        order_weight: 1100
      - name: session_circuits
        peer: TopologySessionCircuit
        cardinality: many
        optional: true
        kind: Generic
        on_delete: no-action
        identifier: session_circuit__vrf
        order_weight: 1150
      - name: exchanges_a
        peer: TopologyExchangeGateway
        cardinality: many
        optional: true
        kind: Generic
        on_delete: no-action
        identifier: exchange_gateway__vrf_a
        order_weight: 1200
      - name: exchanges_z
        peer: TopologyExchangeGateway
        cardinality: many
        optional: true
        kind: Generic
        on_delete: no-action
        identifier: exchange_gateway__vrf_z
        order_weight: 1250

extensions:
  nodes:
    # Deleting a DC, metro or office deletes its VRF instances.
    - kind: TopologySegmentHosting
      relationships:
        - name: vrfs
          label: VRF Instances
          peer: ManagedVRF
          cardinality: many
          optional: true
          kind: Component
          on_delete: cascade
          identifier: vrf__deployment
          order_weight: 7900
          description: "The security-zone routing domains realized in this topology"
    - kind: DcimInterface
      relationships:
        - name: vrf
          peer: ManagedVRF
          label: "VRF Instance"
          description: "Local routing instance of this interface, including SVIs and standalone service legs"
          cardinality: one
          optional: true
          kind: Attribute
          on_delete: no-action
          identifier: vrf__interfaces
          order_weight: 1440
