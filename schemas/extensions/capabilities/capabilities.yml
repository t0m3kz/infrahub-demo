---
version: "1.0"

generics:
  - name: Generic
    namespace: Managed
    description: "Base for on-premises infrastructure services and resources"
    label: "On-Premises Resource"
    icon: "mdi:server-network"
    include_in_menu: false
    order_by:
      - name__value
    human_friendly_id:
      - "name__value"
    display_label: "{{name__value}}"
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        order_weight: 1
        description: "Resource name"
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 2
        description: "Resource description"
      - name: status
        order_weight: 3
        optional: true
        kind: Dropdown
        choices:
          - name: provisioning
            label: Provisioning
            description: "In the process of being set up and configured."
            color: "#ffff7f"
          - name: active
            label: Active
            description: "Fully operational and currently in service."
            color: "#7fbf7f"
          - name: decommissioned
            label: Decommissioned
            description: "Taken out of service."
            color: "#bfbfbf"
        default_value: provisioning

  - name: GenericDevice
    namespace: Managed
    description: "Capabilities attached to compute"
    label: "Compute-based Resource"
    include_in_menu: false
    relationships:
      - name: capabilities
        peer: DcimCapabilities
        label: Assigned Compute
        cardinality: many
        kind: Generic
        optional: true
        direction: inbound
        identifier: capabilities
        order_weight: 9500

  # The shared branch of the device edge: objects several devices are members of (a VRF of a topology; later an SNMP
  # profile, NTP, syslog, AAA). Its edge never cascades: deleting a member never deletes the object and deleting the
  # object leaves its devices. Anything that must die with its device stays on GenericDevice. A kind inherits exactly
  # one of the two device-edge generics (tests/unit/test_capability_edge_names.py). Members are written from this side,
  # edge by edge (RelationshipAdd / RelationshipRemove), never as a saved list; the object's lifecycle owner is a
  # Parent (ManagedVRF.deployment) or a data file.
  - name: GenericSharedDevice
    namespace: Managed
    description: "Objects shared by several devices: devices are members, deleting a device never deletes the object"
    label: "Shared Resource"
    include_in_menu: false
    relationships:
      - name: shared_devices
        peer: DcimCapabilities
        label: Members
        cardinality: many
        kind: Generic
        optional: true
        identifier: shared_capabilities
        order_weight: 9500

  # Capabilities attached to device interfaces (segments, circuits, peerings, firewall-context legs, VIPs)
  - name: GenericInterfaces
    namespace: Managed
    description: "Capabilities attached to multiple device interfaces"
    label: "Segment Resource (Many Interfaces)"
    include_in_menu: false
    relationships:
      - name: capabilities
        peer: DcimInterface
        label: Assigned Interfaces
        cardinality: many
        kind: Generic
        optional: true
        identifier: interface_capabilities
        order_weight: 9500

extensions:
  nodes:
    - kind: DcimCapabilities
      relationships:
        - name: capabilities
          peer: ManagedGenericDevice
          label: Capabilities
          optional: true
          cardinality: many
          direction: outbound
          kind: Generic
          on_delete: cascade
          identifier: capabilities
        # The shared edge: never cascades (explicit), see GenericSharedDevice.
        - name: shared_capabilities
          peer: ManagedGenericSharedDevice
          label: Shared capabilities
          optional: true
          cardinality: many
          kind: Generic
          on_delete: no-action
          identifier: shared_capabilities
          order_weight: 1950
    - kind: DcimInterface
      relationships:
        - name: capabilities
          peer: ManagedGenericInterfaces
          label: Interface capabilities
          identifier: interface_capabilities
          optional: true
          cardinality: many
          kind: Generic
          on_delete: no-action
