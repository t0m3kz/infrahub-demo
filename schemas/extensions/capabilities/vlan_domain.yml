---
version: "1.0"

# ============================================================================
# VLAN Domain — anchor for the local VLAN ID of a segment.
#
# IEEE 802.1Q VLAN ID has only LOCAL significance: within one L2 broadcast
# domain. An MLAG pair is one shared L2 domain (both peers must use the same
# VLAN ID for a given segment), while a standalone (non-MLAG) leaf/tor device
# is its own independent domain. The real DC-wide/fabric-wide segment
# identifier is the L2 VNI (ManagedSegmentDeployment.vni), not the VLAN ID.
# A VLAN ID is never shared by two segments on the same domain
# (ManagedVlanDomainSegment uniqueness); the generator keeps one segment's
# VLAN ID the same across the domains it lands on where it can
# (generators/vlan_domain.py), so a hypervisor port group has one id.
#
# ManagedGenericVlanDomain is the marker the activation's vlan_domain
# relationship points at, so generator/transform code can resolve
# "MLAG-or-standalone" uniformly. ManagedStandaloneVlanDomain attaches to a
# single non-MLAG device the same way ManagedMLAG attaches to a pair — through
# the device's existing `capabilities` relationship — so both cases are
# modeled as a service the device links to, not a new field on
# DcimPhysicalDevice itself (device schema untouched).
# ============================================================================

generics:
  - name: GenericVlanDomain
    namespace: Managed
    description: "Marker for node kinds that anchor a local VLAN ID allocation domain (MLAG pair or standalone device)"  # yamllint disable-line rule:line-length
    label: "VLAN Domain"
    include_in_menu: false
    attributes:
      # Both inheritors have a name (ManagedGeneric); declared here so a relationship to this generic can show it
      # (the display_label of ManagedVlanDomainSegment).
      - name: name
        kind: Text
        order_weight: 100

nodes:
  - name: StandaloneVlanDomain
    namespace: Managed
    description: "VLAN domain anchored on a single standalone (non-MLAG) device"
    label: "Standalone VLAN Domain"
    icon: "mdi:link-variant-off"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedGenericDevice
      - ManagedGenericVlanDomain
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
