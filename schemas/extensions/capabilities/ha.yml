---
version: "1.0"

# ============================================================================
# HA — High Availability schema
#
# ManagedHA is an abstract generic holding shared HA attributes.
# Concrete HA domains inherit from ManagedHA + ManagedGeneric, plus
# ManagedGenericDevice for on-prem devices.
# ============================================================================

generics:
  - name: TenantScoped
    namespace: Managed
    description: "Marker for deployment kinds that can be a dedicated FirewallContext/LoadbalancerHA tenant."
    label: Tenant-Scoped Deployment
    include_in_menu: false

  - name: ProxyService
    namespace: Managed
    description: "Abstract type anchor for proxy services (cloud/SASE)"
    label: Proxy Service
    icon: "mdi:swap-horizontal-bold"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        order_weight: 1

  - name: HA
    namespace: Managed
    description: "Base for all HA domain types"
    label: HA Domain
    icon: "mdi:shield-half-full"
    include_in_menu: false
    attributes:
      - name: group_id
        kind: Number
        label: "HA Group ID"
        description: "HA group / cluster ID (must match on both peers); not applicable for cloud-native services"
        optional: true
        order_weight: 1000
      - name: mode
        kind: Dropdown
        label: "HA Mode"
        description: "HA operating mode"
        optional: true
        default_value: active-passive
        choices:
          - name: active-passive
            label: "Active-Passive"
            color: "#2ECC71"
          - name: active-active
            label: "Active-Active"
            color: "#3498DB"
          - name: cloud_managed
            label: "Cloud Managed"
            color: "#7FA7FF"
        order_weight: 1100
      - name: priority
        kind: Number
        label: "Election Priority"
        description: "Election priority — higher value wins active role"
        optional: true
        default_value: 100
        order_weight: 1200
      - name: preempt
        kind: Boolean
        label: "Preempt"
        description: "Reclaim active role when priority is higher than peer"
        optional: true
        default_value: false
        order_weight: 1300

nodes:
  # ── Firewall HA domain ────────────────────────────────────────────────────
  - name: FirewallHA
    namespace: Managed
    description: "HA domain shared between two peer firewall devices"
    label: Firewall HA Domain
    icon: "mdi:shield-half-full"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedHA
      - ManagedGeneric
      - ManagedGenericDevice
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    relationships:
      # Re-declares ManagedGenericDevice.capabilities (same peer, kind, direction and identifier) to cap the domain at
      # exactly two devices, as ManagedMLAG does; domain_pairing creates the domain with both members in one save.
      # The cap holds when the domain is written; a write from the device side skips it.
      - name: capabilities
        peer: DcimCapabilities
        label: "Peer Devices"
        description: "The two peer devices of this HA domain"
        cardinality: many
        kind: Generic
        optional: false
        min_count: 2
        max_count: 2
        direction: inbound
        identifier: capabilities
        order_weight: 500

    attributes:
      - name: ha_protocol
        kind: Dropdown
        label: "HA Protocol"
        description: "Redundancy protocol used for this firewall HA domain"
        optional: true
        default_value: vrrp
        choices:
          - name: vrrp
            label: "VRRP"
            color: "#3498DB"
          - name: clusterxl
            label: "ClusterXL"
            color: "#2ECC71"
          - name: keepalived
            label: "Keepalived"
            color: "#1ABC9C"
        order_weight: 1400
      - name: ha_timer
        kind: Dropdown
        label: "HA Timer Profile"
        description: "HA hello/dead timer profile"
        optional: true
        default_value: standard
        choices:
          - name: aggressive
            label: "Aggressive"
            color: "#E74C3C"
          - name: standard
            label: "Standard"
            color: "#2ECC71"
        order_weight: 1500

  # ── Firewall Context (VDOM/vsys) — tenant-scoped slice of a shared cluster ─
  # One ManagedFirewallHA cluster hosts many contexts: one dedicated context
  # per customer whose design sets dedicated_firewall, plus a
  # shared context (tenant unset) for everyone else — see
  # docs/firewall_service_insertion.md's namespace-per-zone pattern, now with
  # an explicit node instead of an implicit VDOM name.
  - name: FirewallContext
    namespace: Managed
    description: "Tenant-scoped firewall context (VDOM/vsys) on a shared FirewallHA cluster"
    label: Firewall Context
    icon: "mdi:shield-account"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedGenericInterfaces
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: context_id
        kind: Text
        label: "Context ID"
        description: "Vendor-side VDOM/vsys/context identifier"
        optional: true
        order_weight: 1400
      - name: vlan_id
        kind: Number
        label: "Sub-interface VLAN ID"
        description: "802.1Q tag for this context's sub-interface on the cluster's trunk uplink — allocated from FW-CONTEXT-VLAN-POOL"  # yamllint disable-line rule:line-length
        optional: true
        order_weight: 1450
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: cluster
        peer: ManagedFirewallHA
        label: "Firewall Cluster"
        description: "Physical HA pair hosting this context"
        cardinality: one
        kind: Attribute
        optional: false
        identifier: firewall_context__cluster
        order_weight: 900
      - name: tenant
        peer: ManagedTenantScoped
        label: "Dedicated Tenant"
        description: "Customer this context is dedicated to; unset means a shared low-risk context"
        cardinality: one
        kind: Attribute
        optional: true
        identifier: firewall_context__tenant
        order_weight: 950
      # Every deployment this context filters for, dedicated (the tenant) and
      # shared alike. Written only from the deployment side (its own
      # serving_firewall_context(s), set by customer_dc.py/customer_colocation.py),
      # so concurrent boardings onto one shared context never race on a list.
      - name: served_deployments
        peer: ManagedTenantScoped
        label: "Served Deployments"
        description: "Deployments whose segments terminate on this context"
        cardinality: many
        kind: Generic
        optional: true
        identifier: firewall_context__served_deployments
        order_weight: 1000
      # Reverse of ManagedVxlanSegment.terminated_on (extensions below): the segments whose gateway this context's
      # pair owns as a floating VIP. Written only from the segment side.
      - name: terminated_segments
        peer: ManagedVxlanSegment
        label: "Terminated Segments"
        description: "Segments this context terminates: their gateway is the pair's floating VIP and the fabric only bridges them"  # yamllint disable-line rule:line-length
        cardinality: many
        kind: Generic
        optional: true
        identifier: firewall_context__terminated_segments
        order_weight: 1050
      - name: snat_address
        peer: IpamIPAddress
        label: "SNAT Address"
        description: "Public /32 (INTERNET namespace) tenant traffic is source-translated to on the INTERNET leg"  # yamllint disable-line rule:line-length
        cardinality: one
        kind: Attribute
        optional: true
        identifier: firewall_context__snat_address
        order_weight: 1100

  # ── Load Balancer HA domain (on-prem, physical devices) ───────────────────
  - name: LoadbalancerHA
    namespace: Managed
    description: "HA domain shared between two peer load balancer devices"
    label: Load Balancer HA Domain
    icon: "mdi:shield-half-full"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedHA
      - ManagedGeneric
      - ManagedGenericDevice
      - ManagedLoadBalancer
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    relationships:
      # Re-declares ManagedGenericDevice.capabilities (same peer, kind, direction and identifier) to cap the domain at
      # exactly two devices, as ManagedMLAG does; domain_pairing creates the domain with both members in one save.
      # The cap holds when the domain is written; a write from the device side skips it.
      - name: capabilities
        peer: DcimCapabilities
        label: "Peer Devices"
        description: "The two peer devices of this HA domain"
        cardinality: many
        kind: Generic
        optional: false
        min_count: 2
        max_count: 2
        direction: inbound
        identifier: capabilities
        order_weight: 500

      - name: contexts
        label: "Load Balancer Contexts"
        peer: ManagedLoadbalancerContext
        kind: Generic
        cardinality: many
        optional: true
        identifier: loadbalancer_context__cluster
        order_weight: 1700
        description: "LoadbalancerContexts hosted on this HA cluster"

  # ── Load Balancer Context — tenant-scoped slice of a shared LB cluster ────
  # One ManagedLoadbalancerHA cluster hosts one context per tenant namespace
  # (PROD, NON-PROD: the LB never joins them, so each gets its own routing
  # table on the box) plus one dedicated context per customer whose design
  # sets dedicated_loadbalancer. The LB is one-arm: one /29 leg per context in
  # the tenant VRF facing the border leaf, SNAT automap on the floating .4, so
  # replies return to the LB with no PBR. VIPs are a routed /26 behind .4.
  # The context is the load_balancer of its LoadbalancerVIP nodes.
  - name: LoadbalancerContext
    namespace: Managed
    description: "Tenant-scoped load balancer context (partition/route domain) on a LoadbalancerHA cluster"
    label: Load Balancer Context
    icon: "mdi:scale-balance"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedGenericInterfaces
      - ManagedLoadBalancer
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: vlan_id
        kind: Number
        label: "Leg VLAN ID"
        description: "Base 802.1Q tag of the leg on the cluster's uplink (+200 in NON-PROD), allocated from the DC's lb-context-vlan-pool"  # yamllint disable-line rule:line-length
        optional: true
        order_weight: 1450
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: cluster
        peer: ManagedLoadbalancerHA
        label: "Load Balancer Cluster"
        description: "HA pair hosting this context"
        cardinality: one
        kind: Attribute
        optional: false
        identifier: loadbalancer_context__cluster
        order_weight: 900
      - name: tenant
        peer: ManagedTenantScoped
        label: "Dedicated Tenant"
        description: "Customer this context is dedicated to; unset means a shared context"
        cardinality: one
        kind: Attribute
        optional: true
        identifier: loadbalancer_context__tenant
        order_weight: 950
      # Written only from the deployment side (serving_loadbalancer_context),
      # so concurrent boardings onto one shared context never race on a list.
      - name: served_deployments
        peer: TopologyCustomerDC
        label: "Served Deployments"
        description: "Deployments whose applications are load balanced by this context"
        cardinality: many
        kind: Generic
        optional: true
        identifier: loadbalancer_context__served_deployments
        order_weight: 1000
      - name: vip_prefix
        peer: IpamPrefix
        label: "VIP Prefix"
        description: "Routed /26 the context's VIPs are allocated from; reached through the leg's floating .4"
        cardinality: one
        kind: Attribute
        optional: true
        identifier: loadbalancer_context__vip_prefix
        order_weight: 1100

  # ── Cloud Proxy / SASE ────────────────────────────────────────────────────
  - name: CloudProxy
    namespace: Managed
    description: "Cloud proxy service — vendor SASE (Zscaler, Netskope) or self-managed on cloud VM"
    label: Cloud Proxy
    icon: "mdi:cloud-sync"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedProxyService
      - CoreArtifactTarget
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: deployment_model
        kind: Dropdown
        label: "Deployment Model"
        optional: false
        default_value: vendor_sase
        order_weight: 1400
        choices:
          - name: vendor_sase
            label: "Vendor SASE"
            description: "Fully managed by vendor (Zscaler, Netskope, Cloudflare)"
            color: "#00A3E0"
          - name: self_managed
            label: "Self-Managed"
            description: "Self-operated proxy on cloud VM (Squid, HAProxy, Nginx)"
            color: "#F39C12"
      - name: provider
        kind: Dropdown
        label: "Provider / Product"
        optional: false
        order_weight: 1450
        choices:
          - name: zscaler_zia
            label: "Zscaler ZIA"
            description: "Web gateway product — set service_type=web_gateway"
            color: "#00A3E0"
          - name: zscaler_zpa
            label: "Zscaler ZPA"
            description: "Private access (ZTNA) product — set service_type=private_access"
            color: "#00A3E0"
          - name: netskope
            label: "Netskope"
            description: "Sells both NG-SWG (web gateway) and NPA (private access) — service_type disambiguates which one this instance is"  # yamllint disable-line rule:line-length
            color: "#007DC5"
          - name: cloudflare_gateway
            label: "Cloudflare Gateway"
            color: "#F38020"
          - name: palo_prisma
            label: "Palo Alto Prisma Access"
            description: "Sells both SWG and ZTNA under one product — service_type disambiguates which one this instance is"  # yamllint disable-line rule:line-length
            color: "#FA582D"
          - name: squid
            label: "Squid"
            color: "#9B59B6"
          - name: haproxy
            label: "HAProxy"
            color: "#1ABC9C"
          - name: nginx
            label: "Nginx"
            color: "#2ECC71"
          - name: other
            label: "Other"
            color: "#95A5A6"
      - name: service_type
        kind: Dropdown
        label: "Service Type"
        description: "Vendor alone can't disambiguate (e.g. Zscaler ZIA vs ZPA) — see AGENTS.md notes for rationale"  # yamllint disable-line rule:line-length
        optional: false
        default_value: web_gateway
        order_weight: 1460
        choices:
          - name: web_gateway
            label: "Web Gateway (SWG)"
            description: "Egress URL/web filtering — modeled by ProxyPolicy/ProxyPolicyRule"
            color: "#2ECC71"
          - name: private_access
            label: "Private Access (ZTNA)"
            description: "Inbound app publishing for AppComponents granted to an access profile"
            color: "#E74C3C"
      - name: region
        kind: Text
        label: "Cloud Region"
        description: "Cloud region or availability zone (e.g. eu-west-1, westeurope)"
        optional: true
        order_weight: 1500

extensions:
  nodes:
    # A segment the firewall pair terminates: its `gateway` is the pair's floating VIP (no per-member address) and the
    # fabric only bridges it (VLAN row and L2 VNI, no SVI, VRF or ACL). The firewall transform derives the
    # `<uplink trunk>.<vlan>` sub-interface from the facing border leaf's VLAN row; the segment reconcile tags the
    # context's border service ports with the segment (generators/topology/segment_ports.py).
    - kind: ManagedVxlanSegment
      relationships:
        - name: terminated_on
          peer: ManagedFirewallContext
          label: Terminated On
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 3100
          identifier: firewall_context__terminated_segments
          description: "Firewall context whose pair owns this segment's gateway as a floating VIP (the fabric only bridges it)."  # yamllint disable-line rule:line-length

    # Reverse lookup for FirewallContext.cluster (above) — lets a device
    # query find every context (shared + dedicated) on its own cluster in
    # one hop, without a name-based lookup.
    - kind: ManagedFirewallHA
      relationships:
        - name: contexts
          label: "Firewall Contexts"
          peer: ManagedFirewallContext
          kind: Generic
          cardinality: many
          optional: true
          identifier: firewall_context__cluster
          order_weight: 1700
          description: "FirewallContexts (VDOMs/vsys) hosted on this HA cluster"

    # Deployment side of FirewallContext.served_deployments (above), declared per kind because the cardinality
    # differs (the identifier is shared): a DC footprint has ONE serving context (its dedicated one, else the shared
    # one), a colocation footprint one per zone of its metro that has a firewall pair. Lets a footprint query find
    # the FirewallContexts its segments terminate on in one hop.
    - kind: TopologyCustomerColocation
      relationships:
        - name: serving_firewall_contexts
          label: "Serving Firewall Contexts"
          peer: ManagedFirewallContext
          kind: Generic
          cardinality: many
          optional: true
          identifier: firewall_context__served_deployments
          order_weight: 925
          description: "FirewallContexts its segments terminate on: the shared one of each zone with a firewall pair."

    # Deployment side of LoadbalancerContext.served_deployments. Only a DC footprint is load balanced:
    # a colocation metro has no LB uplinks (generators/topology/customer_colocation.py).
    - kind: TopologyCustomerDC
      relationships:
        - name: serving_firewall_context
          label: "Serving Firewall Context"
          peer: ManagedFirewallContext
          kind: Attribute
          cardinality: one
          optional: true
          identifier: firewall_context__served_deployments
          order_weight: 925
          description: "FirewallContext its segments terminate on: its dedicated one, else the shared one."
        - name: serving_loadbalancer_context
          label: "Serving Load Balancer Context"
          peer: ManagedLoadbalancerContext
          kind: Attribute
          cardinality: one
          optional: true
          identifier: loadbalancer_context__served_deployments
          order_weight: 926
          description: "LoadbalancerContext load balancing its applications: its dedicated one, else the shared one of its namespace."  # yamllint disable-line rule:line-length
