---
version: "1.0"

# ============================================================================
# HA — High Availability schema
#
# ManagedHA is an abstract generic holding shared HA attributes.
# Concrete HA domains inherit from ManagedHA + ManagedGeneric, plus
# ManagedGenericDevice for on-prem devices.
# ============================================================================

generics:
  - name: TenantScoped
    namespace: Managed
    description: "Marker for deployment kinds that can be a dedicated FirewallContext/LoadbalancerHA tenant."
    label: Tenant-Scoped Deployment
    include_in_menu: false

  # The base of the service contexts (firewall, load balancer): one slice of the devices that enforce it, with its own
  # VLAN on the uplink trunk and, when dedicated, its tenant. It carries only what every context shares. The members
  # are the devices (`shared_devices`, the shared device edge: nothing cascades, so swapping one firewall of a pair
  # keeps the context); they are written edge by edge. The lifecycle owner is the hosting deployment, so a
  # decommissioned DC or metro takes its contexts with it. The HA pair is NOT a field of the context: a firewall
  # finds its HA through its own capabilities, and a check holds that the members of a context are one pair.
  - name: SecurityContext
    namespace: Managed
    description: "Base of the service contexts (firewall, load balancer) of the devices that enforce them"
    label: Security Context
    include_in_menu: false
    attributes:
      - name: vlan_id
        kind: Number
        label: "Uplink VLAN ID"
        description: "802.1Q tag of the context's leg on the uplink trunk; allocated from the topology's context pool"
        optional: true
        order_weight: 1450
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: deployment
        peer: TopologySegmentHosting
        label: "Hosting Deployment"
        description: "The DC, colocation metro or office whose devices enforce this context; it owns the lifecycle"
        cardinality: one
        kind: Parent
        optional: false
        identifier: security_context__deployment
        order_weight: 900
      - name: tenant
        peer: ManagedTenantScoped
        label: "Dedicated Tenant"
        description: "Customer this context is dedicated to; unset means a shared context"
        cardinality: one
        kind: Attribute
        optional: true
        identifier: security_context__tenant
        order_weight: 950

  - name: ProxyService
    namespace: Managed
    description: "Abstract type anchor for proxy services (cloud/SASE)"
    label: Proxy Service
    icon: "mdi:swap-horizontal-bold"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        order_weight: 1

  - name: HA
    namespace: Managed
    description: "Base for all HA domain types"
    label: HA Domain
    icon: "mdi:shield-half-full"
    include_in_menu: false
    attributes:
      - name: group_id
        kind: Number
        label: "HA Group ID"
        description: "HA group / cluster ID (must match on both peers); not applicable for cloud-native services"
        optional: true
        order_weight: 1000
      - name: mode
        kind: Dropdown
        label: "HA Mode"
        description: "HA operating mode"
        optional: true
        default_value: active-passive
        choices:
          - name: active-passive
            label: "Active-Passive"
            color: "#2ECC71"
          - name: active-active
            label: "Active-Active"
            color: "#3498DB"
          - name: cloud_managed
            label: "Cloud Managed"
            color: "#7FA7FF"
        order_weight: 1100
      - name: priority
        kind: Number
        label: "Election Priority"
        description: "Election priority — higher value wins active role"
        optional: true
        default_value: 100
        order_weight: 1200
      - name: preempt
        kind: Boolean
        label: "Preempt"
        description: "Reclaim active role when priority is higher than peer"
        optional: true
        default_value: false
        order_weight: 1300

nodes:
  # ── Firewall HA domain ────────────────────────────────────────────────────
  - name: FirewallHA
    namespace: Managed
    description: "HA domain shared between two peer firewall devices"
    label: Firewall HA Domain
    icon: "mdi:shield-half-full"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedHA
      - ManagedGeneric
      - ManagedGenericDevice
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    relationships:
      # Re-declares ManagedGenericDevice.capabilities (same peer, kind, direction and identifier) to cap the domain at
      # exactly two devices, as ManagedMLAG does; domain_pairing creates the domain with both members in one save.
      # The cap holds when the domain is written; a write from the device side skips it.
      - name: capabilities
        peer: DcimCapabilities
        label: "Peer Devices"
        description: "The two peer devices of this HA domain"
        cardinality: many
        kind: Generic
        optional: false
        min_count: 2
        max_count: 2
        direction: inbound
        identifier: capabilities
        order_weight: 500

    attributes:
      - name: ha_protocol
        kind: Dropdown
        label: "HA Protocol"
        description: "Redundancy protocol used for this firewall HA domain"
        optional: true
        default_value: vrrp
        choices:
          - name: vrrp
            label: "VRRP"
            color: "#3498DB"
          - name: clusterxl
            label: "ClusterXL"
            color: "#2ECC71"
          - name: keepalived
            label: "Keepalived"
            color: "#1ABC9C"
        order_weight: 1400
      - name: ha_timer
        kind: Dropdown
        label: "HA Timer Profile"
        description: "HA hello/dead timer profile"
        optional: true
        default_value: standard
        choices:
          - name: aggressive
            label: "Aggressive"
            color: "#E74C3C"
          - name: standard
            label: "Standard"
            color: "#2ECC71"
        order_weight: 1500

  # ── Firewall Context (VDOM/vsys) — tenant-scoped slice of the firewalls that enforce it ─
  # One dedicated context per customer whose design sets dedicated_firewall, plus a shared context (tenant unset)
  # for everyone else. Its members are the firewalls of one HA pair (or one standalone firewall); the legs are the
  # sub-interfaces of its VLAN on their uplink trunk. The VLAN is allocated from FW-CONTEXT-VLAN-POOL.
  - name: FirewallContext
    namespace: Managed
    description: "Tenant-scoped firewall context (VDOM/vsys) enforced by the firewalls that are its members"
    label: Firewall Context
    icon: "mdi:shield-account"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedSecurityContext
      - ManagedGenericSharedDevice
      - ManagedGenericInterfaces
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: context_id
        kind: Text
        label: "Context ID"
        description: "Vendor-side VDOM/vsys/context identifier"
        optional: true
        order_weight: 1400
    relationships:
      # Every deployment this context filters for, dedicated (the tenant) and
      # shared alike. Written only from the deployment side (its own
      # serving_firewall_context(s), set by customer_dc.py/customer_colocation.py),
      # so concurrent boardings onto one shared context never race on a list.
      - name: served_deployments
        peer: ManagedTenantScoped
        label: "Served Deployments"
        description: "Deployments whose segments terminate on this context"
        cardinality: many
        kind: Generic
        optional: true
        identifier: firewall_context__served_deployments
        order_weight: 1000
      # Reverse of ManagedVxlanSegment.terminated_on (extensions below): the segments whose gateway this context's
      # pair owns as a floating VIP. Written only from the segment side.
      - name: terminated_segments
        peer: ManagedVxlanSegment
        label: "Terminated Segments"
        description: "Segments this context terminates: their gateway is the pair's floating VIP and the fabric only bridges them"  # yamllint disable-line rule:line-length
        cardinality: many
        kind: Generic
        optional: true
        identifier: firewall_context__terminated_segments
        order_weight: 1050
      - name: snat_address
        peer: IpamIPAddress
        label: "SNAT Address"
        description: "Public /32 (INTERNET namespace) tenant traffic is source-translated to on the INTERNET leg"  # yamllint disable-line rule:line-length
        cardinality: one
        kind: Attribute
        optional: true
        identifier: firewall_context__snat_address
        order_weight: 1100
      # Reverse of TopologySegmentHosting.internet_edge_contexts (extensions below): the DCs and colocation metros
      # whose Internet traffic this context enforces and translates. Written only from the hosting side.
      - name: internet_edge_hostings
        peer: TopologySegmentHosting
        label: "Internet Edge For"
        description: "Topologies whose Internet traffic this context enforces and translates (it may stand elsewhere)"
        cardinality: many
        kind: Generic
        optional: true
        identifier: topology_hosting__internet_edge_contexts
        order_weight: 1150

  # ── Load Balancer HA domain (on-prem, physical devices) ───────────────────
  - name: LoadbalancerHA
    namespace: Managed
    description: "HA domain shared between two peer load balancer devices"
    label: Load Balancer HA Domain
    icon: "mdi:shield-half-full"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedHA
      - ManagedGeneric
      - ManagedGenericDevice
      - ManagedLoadBalancer
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    relationships:
      # Re-declares ManagedGenericDevice.capabilities (same peer, kind, direction and identifier) to cap the domain at
      # exactly two devices, as ManagedMLAG does; domain_pairing creates the domain with both members in one save.
      # The cap holds when the domain is written; a write from the device side skips it.
      - name: capabilities
        peer: DcimCapabilities
        label: "Peer Devices"
        description: "The two peer devices of this HA domain"
        cardinality: many
        kind: Generic
        optional: false
        min_count: 2
        max_count: 2
        direction: inbound
        identifier: capabilities
        order_weight: 500

  # ── Load Balancer Context — tenant-scoped slice of the load balancers that serve it ────
  # One context per tenant namespace (PROD, NON-PROD: the LB never joins them, so each gets its own routing
  # table on the box) plus one dedicated context per customer whose design sets dedicated_loadbalancer. Its
  # members are the load balancers of one HA pair. The VLAN is the base tag of the leg on the uplink (+200 in
  # NON-PROD), allocated from the DC's lb-context-vlan-pool. The LB is one-arm: one /29 leg per context in
  # the tenant VRF facing the border leaf, SNAT automap on the floating .4, so
  # replies return to the LB with no PBR. VIPs are a routed /26 behind .4.
  # The context is the load_balancer of its LoadbalancerVIP nodes.
  - name: LoadbalancerContext
    namespace: Managed
    description: "Tenant-scoped load balancer context (partition/route domain) served by its member load balancers"
    label: Load Balancer Context
    icon: "mdi:scale-balance"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedSecurityContext
      - ManagedGenericSharedDevice
      - ManagedGenericInterfaces
      - ManagedLoadBalancer
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    relationships:
      # Written only from the deployment side (serving_loadbalancer_context),
      # so concurrent boardings onto one shared context never race on a list.
      - name: served_deployments
        peer: TopologyCustomerDC
        label: "Served Deployments"
        description: "Deployments whose applications are load balanced by this context"
        cardinality: many
        kind: Generic
        optional: true
        identifier: loadbalancer_context__served_deployments
        order_weight: 1000
      - name: vip_prefix
        peer: IpamPrefix
        label: "VIP Prefix"
        description: "Routed /26 the context's VIPs are allocated from; reached through the leg's floating .4"
        cardinality: one
        kind: Attribute
        optional: true
        identifier: loadbalancer_context__vip_prefix
        order_weight: 1100

  # ── Cloud Proxy / SASE ────────────────────────────────────────────────────
  - name: CloudProxy
    namespace: Managed
    description: "Cloud proxy service — vendor SASE (Zscaler, Netskope) or self-managed on cloud VM"
    label: Cloud Proxy
    icon: "mdi:cloud-sync"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedProxyService
      - CoreArtifactTarget
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: deployment_model
        kind: Dropdown
        label: "Deployment Model"
        optional: false
        default_value: vendor_sase
        order_weight: 1400
        choices:
          - name: vendor_sase
            label: "Vendor SASE"
            description: "Fully managed by vendor (Zscaler, Netskope, Cloudflare)"
            color: "#00A3E0"
          - name: self_managed
            label: "Self-Managed"
            description: "Self-operated proxy on cloud VM (Squid, HAProxy, Nginx)"
            color: "#F39C12"
      - name: provider
        kind: Dropdown
        label: "Provider / Product"
        optional: false
        order_weight: 1450
        choices:
          - name: zscaler_zia
            label: "Zscaler ZIA"
            description: "Web gateway product — set service_type=web_gateway"
            color: "#00A3E0"
          - name: zscaler_zpa
            label: "Zscaler ZPA"
            description: "Private access (ZTNA) product — set service_type=private_access"
            color: "#00A3E0"
          - name: netskope
            label: "Netskope"
            description: "Sells both NG-SWG (web gateway) and NPA (private access) — service_type disambiguates which one this instance is"  # yamllint disable-line rule:line-length
            color: "#007DC5"
          - name: cloudflare_gateway
            label: "Cloudflare Gateway"
            color: "#F38020"
          - name: palo_prisma
            label: "Palo Alto Prisma Access"
            description: "Sells both SWG and ZTNA under one product — service_type disambiguates which one this instance is"  # yamllint disable-line rule:line-length
            color: "#FA582D"
          - name: squid
            label: "Squid"
            color: "#9B59B6"
          - name: haproxy
            label: "HAProxy"
            color: "#1ABC9C"
          - name: nginx
            label: "Nginx"
            color: "#2ECC71"
          - name: other
            label: "Other"
            color: "#95A5A6"
      - name: service_type
        kind: Dropdown
        label: "Service Type"
        description: "Vendor alone can't disambiguate (e.g. Zscaler ZIA vs ZPA) — see AGENTS.md notes for rationale"  # yamllint disable-line rule:line-length
        optional: false
        default_value: web_gateway
        order_weight: 1460
        choices:
          - name: web_gateway
            label: "Web Gateway (SWG)"
            description: "Egress URL/web filtering — modeled by ProxyPolicy/ProxyPolicyRule"
            color: "#2ECC71"
          - name: private_access
            label: "Private Access (ZTNA)"
            description: "Inbound app publishing for AppComponents granted to an access profile"
            color: "#E74C3C"
      - name: region
        kind: Text
        label: "Cloud Region"
        description: "Cloud region or availability zone (e.g. eu-west-1, westeurope)"
        optional: true
        order_weight: 1500

extensions:
  nodes:
    # The firewall context at the Internet edge of a DC, colocation metro or office, one per environment (PROD,
    # NON-PROD: checks/internet_egress.py): it enforces the Internet policy and performs the final SNAT. It stands on
    # an external-firewall pair that may be in another topology (a colocation shared by several DCs) and is meant for
    # both directions; only the outbound one is built. A hosting with none keeps the Internet leg and SNAT of each
    # serving context. Chosen in the data; nothing picks one by discovery order.
    - kind: TopologySegmentHosting
      relationships:
        - name: internet_edge_contexts
          label: Internet Edge Contexts
          peer: ManagedFirewallContext
          cardinality: many
          kind: Generic
          optional: true
          identifier: topology_hosting__internet_edge_contexts
          order_weight: 7960
          description: "Firewall contexts at the Internet edge of this topology (policy and final SNAT), one per environment"  # yamllint disable-line rule:line-length
        # The contexts this topology owns (SecurityContext.deployment, a Parent): a decommissioned DC, colocation
        # metro or office takes its contexts with it. The members are the devices; they never cascade.
        - name: security_contexts
          peer: ManagedSecurityContext
          label: "Security Contexts"
          description: "The firewall and load balancer contexts enforced by this topology's devices"
          cardinality: many
          kind: Component
          optional: true
          on_delete: cascade
          identifier: security_context__deployment
          order_weight: 7950

    # A segment the firewall pair terminates: its `gateway` is the pair's floating VIP (no per-member address) and the
    # fabric only bridges it (VLAN row and L2 VNI, no SVI, VRF or ACL). The firewall transform derives the
    # `<uplink trunk>.<vlan>` sub-interface from the facing border leaf's VLAN row; the segment reconcile tags the
    # context's border service ports with the segment (generators/topology/segment_ports.py).
    - kind: ManagedVxlanSegment
      relationships:
        - name: terminated_on
          peer: ManagedFirewallContext
          label: Terminated On
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 3100
          identifier: firewall_context__terminated_segments
          description: "Firewall context whose pair owns this segment's gateway as a floating VIP (the fabric only bridges it)."  # yamllint disable-line rule:line-length

    # Deployment side of FirewallContext.served_deployments (above), declared per kind because the cardinality
    # differs (the identifier is shared): a DC footprint has ONE serving context (its dedicated one, else the shared
    # one), a colocation footprint one per zone of its metro that has a firewall pair. Lets a footprint query find
    # the FirewallContexts its segments terminate on in one hop.
    - kind: TopologyCustomerColocation
      relationships:
        - name: serving_firewall_contexts
          label: "Serving Firewall Contexts"
          peer: ManagedFirewallContext
          kind: Generic
          cardinality: many
          optional: true
          identifier: firewall_context__served_deployments
          order_weight: 925
          description: "FirewallContexts its segments terminate on: the shared one of each zone with a firewall pair."

    # Deployment side of LoadbalancerContext.served_deployments. Only a DC footprint is load balanced:
    # a colocation metro has no LB uplinks (generators/topology/customer_colocation.py).
    - kind: TopologyCustomerDC
      relationships:
        - name: serving_firewall_context
          label: "Serving Firewall Context"
          peer: ManagedFirewallContext
          kind: Attribute
          cardinality: one
          optional: true
          identifier: firewall_context__served_deployments
          order_weight: 925
          description: "FirewallContext its segments terminate on: its dedicated one, else the shared one."
        - name: serving_loadbalancer_context
          label: "Serving Load Balancer Context"
          peer: ManagedLoadbalancerContext
          kind: Attribute
          cardinality: one
          optional: true
          identifier: loadbalancer_context__served_deployments
          order_weight: 926
          description: "LoadbalancerContext load balancing its applications: its dedicated one, else the shared one of its namespace."  # yamllint disable-line rule:line-length
