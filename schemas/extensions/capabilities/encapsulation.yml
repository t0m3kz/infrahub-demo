---
version: "1.0"

# Interface encapsulation: what an interface "rides on", with which tag. The one capability kind for every case: a
# dot1q sub-interface and a firewall context leg on a trunk, the NIC of a virtual machine pinned to a host port, a
# cloud peering interface on a port or LAG of the provider connect, the end of a provider connection on a provider
# port. No interface kind declares a parent or a tag of its own and there is no marker generic: the interface that rides
# on another one has this object among its `capabilities` (the standard interface edge, no re-declaration) and it points
# at the port with `parent`. An interface WITHOUT a parent (an SVI, a loopback, a tunnel) needs none and has none.
# The name <device>:<interface> is deterministic, so a data file or a generator upserts the object; the interface name
# <parent>.<vlan> is only a convention, nothing parses it. At most one per interface, and a parent that is not the
# interface itself: checks/interface_encapsulation.py. The same-device rule (a VM NIC rides on a port of its hosting
# device) is checks/interface_parents.py; no common_parent anywhere (a NIC's parent is on another device).
nodes:
  - name: InterfaceEncapsulation
    namespace: Managed
    label: Interface Encapsulation
    icon: mdi:ethernet-cable
    description: "An interface riding on another one (sub-interface, VM NIC, cloud peering), with its VLAN tag"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedGenericInterfaces
    order_by:
      - name__value
    display_label: "{{name__value}}"
    uniqueness_constraints:
      - ["name__value"]
    human_friendly_id:
      - "name__value"
    attributes:
      - name: vlan_id
        kind: Number
        label: "VLAN ID"
        optional: true
        order_weight: 1410
        description: "VLAN tag on the parent, unset is untagged (a VM NIC, a LAG peering)"
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: parent
        label: Parent
        peer: DcimInterface
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "interface_encapsulation__parent"
        order_weight: 1400
        description: "The interface it rides on: the host port for a VM NIC, else a port, LAG or NIC of the same device (checks/interface_parents.py)"  # yamllint disable-line rule:line-length

extensions:
  nodes:
    - kind: DcimInterface
      relationships:
        - name: encapsulations
          label: Sub-Interfaces
          peer: ManagedInterfaceEncapsulation
          optional: true
          cardinality: many
          kind: Generic
          identifier: "interface_encapsulation__parent"
          direction: inbound
          on_delete: no-action
          order_weight: 1475
          description: "The encapsulations that ride on this interface: its sub-interfaces, the NICs of its VMs, the peerings of a transport"  # yamllint disable-line rule:line-length
