---
version: "1.0"

# ============================================================================
# Routing — MLAG schema
# An MLAG domain is a shared construct between exactly two peer devices.
# Both devices include the same ManagedMLAG node in their device_capabilities,
# so the relationship is inbound here (device_capabilities is the owner side).
# The pair is written from the MLAG side (generators/devices.py MLAG upsert), and
# the min/max count of 2 holds only on that side: a write from the device side
# (DcimCapabilities.capabilities, peer = generic ManagedGenericDevice) resolves the
# generic's uncapped declaration and is not capped. Runtime guards in the
# generators therefore remain.
# ============================================================================

nodes:
  - name: MLAG
    namespace: Managed
    description: "MLAG domain shared between two peer devices"
    label: MLAG Domain
    icon: "mdi:link-variant"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    inherit_from:
      - ManagedGeneric
      - ManagedGenericDevice
      - ManagedGenericVlanDomain
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{name__value}}"
    order_by:
      - name__value
    relationships:
      # Re-declares the generic's `capabilities` (same name, peer, kind, direction and
      # identifier) to cap it at exactly two peer devices.
      - name: capabilities
        peer: DcimCapabilities
        label: "Peer Devices"
        description: "The two peer devices of this MLAG domain"
        cardinality: many
        kind: Generic
        optional: false
        min_count: 2
        max_count: 2
        direction: inbound
        identifier: capabilities
        order_weight: 1000
    attributes:
      - name: domain_id
        kind: Number
        label: "Domain ID"
        description: "MLAG domain identifier (must be the same on both peers)"
        optional: false
        order_weight: 1100
      - name: reload_delay
        kind: Number
        label: "Reload Delay (s)"
        description: "Seconds to delay bringing up MLAG ports after reload"
        optional: true
        default_value: 300
        order_weight: 1200
      - name: reload_delay_non_mlag
        kind: Number
        label: "Reload Delay Non-MLAG (s)"
        description: "Seconds to delay non-MLAG ports after reload"
        optional: true
        default_value: 330
        order_weight: 1250
      - name: virtual_peer_link
        kind: Boolean
        label: "Virtual Peer-Link"
        description: "When true, generator creates a virtual peer-link interface instead of a physical LAG"
        optional: true
        default_value: false
        order_weight: 1300

extensions:
  nodes:
    - kind: DcimLAGInterface
      relationships:
        - name: mlag_domain
          peer: ManagedMLAG
          label: "MLAG Domain"
          description: "MLAG domain this LAG belongs to (null for single-chassis LAG)"
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "lag__mlag_domain"
          order_weight: 1800
