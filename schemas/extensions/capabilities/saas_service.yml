---
# SaaS Service capabilities
#
# ManagedSaasService — shared generic base for all cloud SaaS service capabilities.
# Generics cannot inherit from other generics in Infrahub, so name/status/description
# are defined directly here rather than pulled from ManagedGeneric.
#
# Concrete nodes:
#   ManagedCloudProxy           — cloud proxy: vendor SASE or self-managed on cloud VM — defined in ha.yml
version: "1.0"

generics:
  - name: SaasService
    namespace: Managed
    description: "Shared base for all cloud SaaS service capability nodes"
    label: SaaS Service
    icon: "mdi:cloud-outline"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        order_weight: 1
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 2
      - name: status
        kind: Dropdown
        optional: true
        order_weight: 30
        default_value: provisioning
        choices:
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: decommissioning
            label: Decommissioning
            color: "#fbfbfb"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
      - name: tenant_id
        kind: Text
        label: "Tenant / Org ID"
        description: "Cloud tenant or organization account identifier"
        optional: true
        order_weight: 1100
      - name: contract_end_date
        kind: Text
        label: "Contract End Date"
        description: "ISO 8601 contract expiry date (YYYY-MM-DD)"
        optional: true
        order_weight: 1400
