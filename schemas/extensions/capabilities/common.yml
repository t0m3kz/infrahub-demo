---
version: "1.0"

# ============================================================================
# Routing — Common schema
# Shared base generic used by routing protocol implementations (BGP, OSPF).
# ============================================================================

generics:
  - name: Peering
    namespace: Managed
    description: "Base generic for all peering sessions (BGP, OSPF)."
    label: Network Peering
    icon: "carbon:network-2"
    include_in_menu: false

nodes:
  - name: Password
    namespace: Routing
    description: "Shared routing-protocol authentication secret, reusable across peerings/interfaces."
    label: "Routing Password"
    icon: "mdi:key-variant"
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    uniqueness_constraints:
      - ["name__value"]
    display_label: "{{ name__value }}"
    attributes:
      - name: name
        kind: Text
        description: "Unique identifier for this shared secret (e.g. 'DC1-UNDERLAY-KEY')"
      - name: password
        kind: Password
        description: "Authentication secret"
      - name: description
        kind: Text
        optional: true
