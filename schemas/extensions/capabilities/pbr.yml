---
version: "1.0"
# The steering of a segment to its firewall context: the policy-based routing of a leaf, one object for the segment in a
# DC. A SHARED capability like ManagedVRF: the object is the segment's contract in that DC (its context and the next
# hop), the leaves that carry the segment are its `shared_devices`, and each leaf applies it on the SVI of the segment.
# What follows from the policies and the prefixes of the VRF is not stored but derived when a leaf is rendered: the
# bypass of the flows the context cannot see both ways, and the modeled prefixes of a DC with an Internet edge
# (transforms/helpers/firewall_pbr.py). docs/routing_capabilities_plan.md holds the model.

nodes:
  - name: Pbr
    namespace: Managed
    description: "A segment's steering to its firewall context in one DC, applied by the leaves that carry the segment."
    label: Policy-Based Routing
    icon: mdi:routes
    menu_placement: ManagedGeneric
    include_in_menu: false
    human_friendly_id:
      - name__value
    inherit_from:
      - ManagedGeneric
      - ManagedGenericSharedDevice
    uniqueness_constraints:
      - ["name__value"]
      - ["segment_deployment"]
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    attributes:
      - name: next_hop
        kind: Text
        label: Next Hop
        optional: false
        order_weight: 1450
        description: "The context's virtual IP in the segment's VRF, taken once from its leg; the leaves redirect to it"
      - name: origin
        kind: Dropdown
        optional: false
        default_value: generated
        order_weight: 1500
        description: "Who owns the object: a generator writes and removes its own, a person's is never touched"
        choices:
          - name: generated
            label: Generated
            color: "#3498DB"
          - name: manual
            label: Manual
            color: "#7FBF7F"
    relationships:
      - name: segment_deployment
        peer: ManagedSegmentDeployment
        label: Segment Deployment
        description: "The segment in this DC; the object goes with it"
        kind: Parent
        cardinality: one
        optional: false
        identifier: pbr__segment_deployment
        order_weight: 900
      - name: firewall_context
        peer: ManagedFirewallContext
        label: Firewall Context
        description: "The context that serves the segment in this DC, the target of the redirect"
        kind: Attribute
        cardinality: one
        optional: false
        identifier: pbr__firewall_context
        order_weight: 950

extensions:
  nodes:
    # Deleting the segment in a DC deletes its steering.
    - kind: ManagedSegmentDeployment
      relationships:
        - name: pbrs
          label: PBR
          peer: ManagedPbr
          kind: Component
          cardinality: many
          optional: true
          on_delete: cascade
          identifier: pbr__segment_deployment
          order_weight: 2300
          description: "The steering of the segment to its firewall context in this DC (at most one)"
