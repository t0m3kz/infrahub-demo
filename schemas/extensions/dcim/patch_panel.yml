---
version: "1.0"

# ============================================================================
# A passive patch panel: ports and nothing else.
#
# DcimPatchPanel is NOT a DcimDevice. It inherits no generic at all, so it has no role, platform, address, interface
# list, artifact (CoreArtifactTarget) and none of the capability edges (DcimCapabilities: `capabilities` and
# `shared_capabilities`), no VRF demand and no VLAN row. Its two port kinds inherit DcimEndpoint only: the `cable` edge
# is all it takes for a DcimCable to join a panel port to an interface (DcimCable.endpoints peers DcimEndpoint).
# tests/unit/test_patch_panel_schema.py guards both.
#
# A jack has two faces and a DcimEndpoint carries one cable, so a jack is two port nodes: a rear port
# (DcimRearPatchPanelPort) and a front port (DcimFrontPatchPanelPort), both components of the panel, so the panel lists
# both. The front port names its rear port (`rear_port`, an attribute relationship with `common_parent: panel`: the
# server refuses a rear port of another panel). A jack is one front port on one rear port, a cassette several front
# ports on one rear port (MPO-12). A cable that lands on one port continues on the cable of the port it is paired with.
#
# A panel names its `panel_type` and nothing else about its ports: add_patch_panel builds the rear and front ports the
# type holds, each front port on its rear port (jack or cassette, generators/helpers/patch_panel.py PANEL_TYPES), and
# checks/patch_panel_pairing.py guards the result. There is no object template: a template copies an attribute
# relationship as it is and cannot point a front port at its sibling (measured on 1.11.9), so it could not pair them.
#
# A panel is unique by its rack and its name (`PP-01` may exist in every rack), so the rack is mandatory: the server
# refuses a uniqueness constraint on an optional relationship. The panel's HFID is [rack shortname, name]. The HFID
# of a port cannot go through two relationships (the server: "panel is not a valid attribute of ..."), so each kind
# carries a computed id that is its HFID: the panel's `panel_id` is `<rack>:<name>`, a rear port's `port_id` is
# `<panel_id>:<rear>` and a front port's `<panel_id>:F<front>`.
#
# A panel always sits between two devices: a circuit end stays an interface (the `capabilities` peers are untouched).
# Its location is its mandatory `rack` (LocationRack.deployment gives the facility) and its place in it is `position`
# (the lowest unit) and `rack_face`, the two attributes of a DcimPhysicalDevice with the same meaning (the panel
# inherits no generic, so they are declared here); it has no `deployment` and no device type.
# ============================================================================

nodes:
  - name: PatchPanel
    namespace: Dcim
    description: "Passive patch panel: ports and nothing else (no config, no artifact, no capabilities)."
    label: Patch Panel
    icon: mdi:ethernet
    include_in_menu: false
    human_friendly_id:
      - rack__shortname__value
      - name__value
    display_label: "{{ name__value }} ({{ rack__shortname__value }})"
    order_by:
      - rack__shortname__value
      - name__value
    uniqueness_constraints:
      - ["rack", "name__value"]
    attributes:
      - name: name
        kind: Text
        optional: false
        description: "The panel name, unique within its rack"
        order_weight: 900
      - name: panel_id
        kind: Text
        read_only: true
        optional: false
        unique: true
        description: "<rack>:<name>: the id the port ids are built from (an HFID cannot go through two relationships)"
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ rack__shortname__value }}:{{ name__value }}"
        order_weight: 925
      - name: description
        kind: Text
        optional: true
        order_weight: 950
      - name: panel_type
        label: Panel Type
        description: "The ports of the panel: add_patch_panel builds them and pairs each front port with its rear port"
        kind: Dropdown
        optional: false
        order_weight: 1000
        choices:
          - name: lc-24
            label: "24 x LC"
            description: "24 LC/UPC jacks: front N on rear N."
          - name: lc-48
            label: "48 x LC"
            description: "48 LC/UPC jacks."
          - name: lc-96
            label: "96 x LC"
            description: "96 LC/UPC jacks (2U)."
          - name: sc-12
            label: "12 x SC"
            description: "12 SC/UPC jacks."
          - name: rj45-24
            label: "24 x RJ45"
            description: "24 RJ45 jacks."
          - name: rj45-48
            label: "48 x RJ45"
            description: "48 RJ45 jacks."
          - name: mpo12-cassette-24
            label: "MPO-12 cassette, 24 x LC"
            description: "2 MPO-12 rear ports, 12 LC/UPC front ports each."
          - name: mpo12-cassette-48
            label: "MPO-12 cassette, 48 x LC"
            description: "4 MPO-12 rear ports, 12 LC/UPC front ports each."
          - name: mpo12-cassette-96
            label: "MPO-12 cassette, 96 x LC"
            description: "8 MPO-12 rear ports, 12 LC/UPC front ports each (2U)."
      - name: position
        label: Position (U)
        description: Lowest unit.
        kind: Number
        optional: true
        order_weight: 1710
      - name: rack_face
        label: Rack Face
        description: On which face of the rack the panel is mounted.
        kind: Dropdown
        optional: true
        default_value: front
        order_weight: 1720
        choices:
          - name: front
            label: Front
            description: Panel mounted on the front face of the rack.
          - name: rear
            label: Rear
            description: Panel mounted on the rear face of the rack.
    relationships:
      - name: rack
        peer: LocationRack
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "rack__patch_panels"
        order_weight: 1700
      - name: rear_ports
        peer: DcimRearPatchPanelPort
        optional: true
        cardinality: many
        kind: Component
        identifier: "panel__rear_ports"
        order_weight: 2500
      - name: front_ports
        peer: DcimFrontPatchPanelPort
        optional: true
        cardinality: many
        kind: Component
        identifier: "panel__front_ports"
        order_weight: 2600

  - name: RearPatchPanelPort
    namespace: Dcim
    description: "Rear port of a panel: the permanent side of a jack, paired with the front port(s) that name it."
    label: Patch Panel Rear Port
    icon: mdi:ethernet
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
    human_friendly_id:
      - port_id__value
    display_label: "{{ port_id__value }}"
    order_by:
      - port_id__value
    uniqueness_constraints:
      - ["panel", "name__value"]
    attributes:
      - name: name
        kind: Text
        optional: false
        description: "The rear port number within the panel"
        order_weight: 900
      - name: port_id
        kind: Text
        read_only: true
        optional: false
        unique: true
        description: "<panel_id>:<rear>: the human friendly id (it cannot go through the panel relationship twice)"
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ panel__panel_id__value }}:{{ name__value }}"
        order_weight: 950
      - name: connector
        kind: Dropdown
        optional: false
        order_weight: 1000
        choices:
          - name: lc-upc
            label: LC/UPC
          - name: lc-apc
            label: LC/APC
          - name: sc-upc
            label: SC/UPC
          - name: sc-apc
            label: SC/APC
          - name: mpo-12
            label: MPO-12
          - name: rj45
            label: RJ45
      - name: label
        kind: Text
        optional: true
        order_weight: 1100
      - name: description
        kind: Text
        optional: true
        order_weight: 1150
    relationships:
      - name: panel
        peer: DcimPatchPanel
        optional: false
        cardinality: one
        kind: Parent
        identifier: "panel__rear_ports"
        order_weight: 800
      - name: front_ports
        label: Front Ports
        peer: DcimFrontPatchPanelPort
        optional: true
        cardinality: many
        kind: Generic
        identifier: "rear__front_ports"
        order_weight: 2500

  - name: FrontPatchPanelPort
    namespace: Dcim
    description: "Front port of a panel: where equipment is patched in; it names the rear port it is paired with."
    label: Patch Panel Front Port
    icon: mdi:ethernet
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
    human_friendly_id:
      - port_id__value
    display_label: "{{ port_id__value }}"
    order_by:
      - port_id__value
    uniqueness_constraints:
      - ["panel", "name__value"]
    attributes:
      - name: name
        kind: Text
        optional: false
        description: "The front port number within the panel"
        order_weight: 900
      - name: port_id
        kind: Text
        read_only: true
        optional: false
        unique: true
        description: "<panel_id>:F<front>: the human friendly id"
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ panel__panel_id__value }}:F{{ name__value }}"
        order_weight: 950
      - name: connector
        kind: Dropdown
        optional: false
        order_weight: 1000
        choices:
          - name: lc-upc
            label: LC/UPC
          - name: lc-apc
            label: LC/APC
          - name: sc-upc
            label: SC/UPC
          - name: sc-apc
            label: SC/APC
          - name: mpo-12
            label: MPO-12
          - name: rj45
            label: RJ45
      - name: label
        kind: Text
        optional: true
        order_weight: 1100
      - name: description
        kind: Text
        optional: true
        order_weight: 1150
    relationships:
      - name: panel
        peer: DcimPatchPanel
        optional: false
        cardinality: one
        kind: Parent
        identifier: "panel__front_ports"
        order_weight: 800
      # Optional: a hand-made front port may still be unpaired (the check reports it); add_patch_panel creates every
      # front port with it. common_parent: the rear port must be a component of the same panel.
      - name: rear_port
        label: Rear Port
        peer: DcimRearPatchPanelPort
        optional: true
        cardinality: one
        kind: Attribute
        common_parent: panel
        identifier: "rear__front_ports"
        order_weight: 810

extensions:
  nodes:
    - kind: LocationRack
      relationships:
        - name: patch_panels
          peer: DcimPatchPanel
          label: Patch Panels in Rack
          optional: true
          cardinality: many
          kind: Generic
          identifier: "rack__patch_panels"
          order_weight: 2100
