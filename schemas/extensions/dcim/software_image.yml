---
version: "1.0"

# ============================================================================
# DcimSoftwareImage — a versioned OS/firmware release for a DcimPlatform.
#
# Replaces the free-text os_version field on DcimDevice with a structured
# relationship so that:
#   - All devices, clusters and cloud instances on the same release share one node (queryable)
#   - The platform is implicit from the image (no mismatch possible)
#
# HFID:    name__value  (e.g. "arista_eos-4.28.3M", "linux-22.04.3")
# Naming convention: {platform_name}-{version}
# ============================================================================

nodes:
  - name: SoftwareImage
    namespace: Dcim
    description: "A versioned OS or firmware image for a DcimPlatform"
    label: "Software Image"
    icon: "mdi:package-variant"
    human_friendly_id:
      - name__value
    order_by:
      - platform__name__value
      - version__value
    # yamllint disable-line rule:line-length
    display_label: "{{ name__value }}{{ ' (' ~ lifecycle__value | replace('_', ' ') ~ ')' if lifecycle__value != 'approved' else '' }}{{ ' (vulnerable)' if vulnerable__value else '' }}"
    uniqueness_constraints:
      - [platform, version__value]
    attributes:
      - name: name
        kind: Text
        optional: false
        unique: true
        order_weight: 100
        description: "Unique image identifier — {platform}-{version}"

      - name: version
        kind: Text
        optional: false
        order_weight: 200
        description: "Release version string (e.g. 4.28.3M, 22.04.3, R81.20)"

      - name: lifecycle
        kind: Dropdown
        label: "Lifecycle"
        optional: false
        default_value: approved
        order_weight: 210
        description: "The vendor's support status; checks/software_lifecycle.py reports what runs a bad one"
        choices:
          - name: approved
            label: Approved
            description: "Supported and safe to deploy."
            color: "#7fbf7f"
          - name: deprecated
            label: Deprecated
            description: "Still supported, to be replaced at the next window."
            color: "#ffd966"
          - name: end_of_life
            label: End of Life
            description: "No longer supported by the vendor."
            color: "#999999"

      - name: vulnerable
        kind: Boolean
        label: "Vulnerable"
        optional: false
        default_value: false
        order_weight: 215
        description: "A known vulnerability affects this release (independent of its support status): upgrade"

      - name: vulnerability_reason
        kind: Text
        label: "Vulnerability Reason"
        optional: true
        order_weight: 216
        description: "Why it is flagged: the CVE ids or the advisory, and the release that fixes it (a pointer, nothing is stored)"  # yamllint disable-line rule:line-length

      - name: package
        kind: Text
        label: "Package"
        optional: true
        description: "The provider's licence package of this image (Equinix Network Edge package_code, e.g. network-essentials, VM100, CloudEOS)"  # yamllint disable-line rule:line-length
        order_weight: 230

      - name: containerlab_image
        kind: Text
        label: "Containerlab Image"
        optional: true
        description: "Exact container image reference used by Containerlab for this software release"
        order_weight: 250

      - name: description
        kind: Text
        optional: true
        order_weight: 120

    relationships:
      - name: platform
        peer: DcimPlatform
        label: "Platform"
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 150
        identifier: "software_image__platform"
        description: "OS platform this image belongs to"

      - name: runners
        peer: DcimSoftwareRunner
        label: "Running On"
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 800
        identifier: "software_image__runner"
        description: "Everything currently running this image: devices, clusters, cloud instances"

extensions:
  nodes:
    # The edge of DcimSoftwareRunner (the generic is in schemas/base/dcim.yml, which cannot name this kind; an
    # extension of a generic is listed under `nodes`): a device, a cluster, a cloud instance run ONE image, and the
    # image lists them in `runners`.
    - kind: DcimSoftwareRunner
      relationships:
        - name: software_image
          peer: DcimSoftwareImage
          label: "Software Image"
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 1260
          identifier: "software_image__runner"
          description: "Versioned OS, firmware or hypervisor release this runs; its platform is the image's"
