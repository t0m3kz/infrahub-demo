---
version: "1.0"

nodes:
  - name: Cable
    namespace: Dcim
    description: A cable connecting two endpoints.
    label: Cable
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - TopologyInterconnection
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    order_by:
      - name__value
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: type
        kind: Dropdown
        optional: false
        order_weight: 1100
        choices:
          - name: mmf
            label: Multi-Mode Fibre
          - name: smf
            label: Single-Mode Fibre
          - name: copper
            label: Copper
          - name: dac
            label: Direct Attach Copper (DAC)
      - name: cable_id
        label: "Cable ID"
        description: >-
          Short label printed on the physical cable, derived from its endpoints; unset on hand-declared cables
        kind: Text
        optional: true
        order_weight: 1050
      - name: color
        label: "Color"
        description: "Jacket colour, derived from the cable type (TIA-598 convention); unset when unknown"
        kind: Dropdown
        optional: true
        order_weight: 1150
        choices:
          - name: blue
            label: Blue
            color: "#3b82f6"
          - name: yellow
            label: Yellow
            color: "#eab308"
          - name: aqua
            label: Aqua
            color: "#06b6d4"
          - name: black
            label: Black
            color: "#111827"
      - name: length_cm
        label: "Length (cm)"
        description: "Centimetres, derived from the rack positions when both ends sit in racks of one suite; else unset"
        kind: Number
        optional: true
        order_weight: 1200
        parameters:
          min_value: 0
    relationships:
      - name: endpoints
        peer: DcimEndpoint
        cardinality: many
        optional: true
        min_count: 2
        max_count: 2
        kind: Attribute
        on_delete: no-action
        order_weight: 1300
