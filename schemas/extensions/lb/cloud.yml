---
version: "1.0"

nodes:
  - name: LoadBalancer
    namespace: Cloud
    label: Load Balancer
    description: >
      Cloud load balancer (ALB/NLB/ELB/Azure LB/GCP LB)
      hosting multiple listeners.
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [virtual_network, name__value]
    inherit_from:
      - ManagedLoadBalancer
      - CloudResource
      - CoreArtifactTarget
    attributes:
      - name: dns_names
        label: DNS Names
        kind: List
        optional: true
        order_weight: 2100
        description: "Endpoints the provider assigned: the load balancer's, and one per zone or frontend (a result of provisioning)"  # yamllint disable-line rule:line-length
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        optional: false
        order_weight: 600
      - name: network_segments
        peer: CloudNetworkSegment
        cardinality: many
        optional: false
        order_weight: 700
        description: "Subnets where load balancer is deployed"
