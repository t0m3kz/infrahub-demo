---
version: "1.0"
# Clusters: a group of hosts that run workloads. One Managed generic for the concept, one implementation per
# technology (as ManagedNetworkSegment, ManagedVxlanSegment and CloudNetworkSegment). The names say what the cluster is,
# not whose software runs it: the `software_image` does, a release of a platform (vSphere, Proxmox, KVM, RKE2, EKS ...),
# as on a device, so one model serves them all.
#   ManagedHypervisorCluster   an on-prem hypervisor cluster: its hosts are our servers (DcimPhysicalDevice)
#   CloudHypervisorCluster     a hypervisor cluster run by a provider (Equinix Managed Private Cloud is vSphere): the
#                              hosts are the provider's
# CloudKubernetesCluster     managed Kubernetes (EKS, AKS, GKE): in a cloud account, on a virtual network, with node
# subnets
# A VM is always hosted on one of the physical nodes (DcimVirtualDevice.hosting_device), and a node is in a cluster
# only by
# the cluster's `hosts`, so the cluster of a VM is its host's and is never stated twice. checks/cluster.py holds what
# the
# schema cannot (a server is in one cluster, the hosts stand in the cluster's deployment, the node subnets of a
# Kubernetes
# cluster belong to its network and its pod and service ranges overlap nothing, a component's instances do not all stand
# on one host).
generics:
  - name: Cluster
    namespace: Managed
    description: "A group of hosts that run workloads: a hypervisor or a Kubernetes cluster"
    label: Cluster
    icon: mdi:server-network
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        order_weight: 1
        description: "Cluster name"
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 2
        description: "Cluster description"
      - name: status
        order_weight: 3
        optional: true
        kind: Dropdown
        default_value: provisioning
        choices:
          - name: provisioning
            label: Provisioning
            description: "In the process of being set up and configured."
            color: "#ffff7f"
          - name: active
            label: Active
            description: "Fully operational and currently in service."
            color: "#7fbf7f"
          - name: decommissioned
            label: Decommissioned
            description: "Taken out of service."
            color: "#bfbfbf"
    relationships:
      - name: sdn
        label: SDN
        peer: ManagedClusterSdn
        optional: true
        cardinality: one
        kind: Attribute
        identifier: "cluster__sdn"
        description: "The software network layer of the cluster (NSX, a CNI): its ranges and the VMs that carry it"
        order_weight: 1700

nodes:
  - name: HypervisorCluster
    namespace: Managed
    label: Hypervisor Cluster
    icon: mdi:server-network
    description: "On-prem hypervisor cluster (vSphere, Proxmox, KVM, Hyper-V); the hosts are our servers"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedCluster
      - DcimSoftwareRunner
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: manager
        label: Manager
        kind: Text
        optional: true
        description: "What manages the cluster: the vCenter FQDN, the Proxmox API URL, the oVirt engine"
        order_weight: 1200
      - name: inventory_path
        label: Inventory Path
        kind: Text
        optional: true
        # yamllint disable-line rule:line-length
        description: "Where the cluster sits in the manager's inventory (the vCenter datacenter, the Proxmox datacenter)"
        order_weight: 1250
      - name: ha_enabled
        label: High Availability
        kind: Boolean
        default_value: true
        description: "A failed host restarts its VMs on the others (vSphere HA, Proxmox HA)"
        order_weight: 1300
      - name: load_balancing
        label: Load Balancing
        kind: Boolean
        default_value: true
        description: "VMs are placed and balanced across the hosts (vSphere DRS, Proxmox CRS)"
        order_weight: 1350
    relationships:
      - name: deployment
        label: Deployment
        peer: TopologyDeviceHosting
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "hypervisor_cluster__deployment"
        description: "The pod, DC or zone the hosts stand in"
        order_weight: 1500
      - name: hosts
        label: Hosts
        peer: DcimPhysicalDevice
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "hypervisor_cluster__hosts"
        description: "The hypervisor hosts: physical servers of ours"
        order_weight: 1600

  - name: HypervisorCluster
    namespace: Cloud
    label: Provider Hypervisor Cluster
    icon: mdi:cloud-outline
    # yamllint disable-line rule:line-length
    description: "Hypervisor cluster run by a provider (Equinix Managed Private Cloud is vSphere): the hosts are the provider's, not ours"
    include_in_menu: false
    inherit_from:
      - CloudResource
      - ManagedCluster
      - DcimSoftwareRunner
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["account", "name__value"]
    attributes:
      - name: host_count
        label: Hosts
        kind: Number
        optional: true
        description: "How many hosts the provider runs for the cluster"
        order_weight: 1200
      - name: host_profile
        label: Host Profile
        kind: Text
        optional: true
        description: "The provider's host type (CPU, memory, storage)"
        order_weight: 1250
    relationships:
      - name: account
        label: Account
        peer: CloudAccount
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "cloud_hypervisor_cluster__account"
        order_weight: 600
      - name: location
        label: Metro
        peer: LocationMetro
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "cloud_hypervisor_cluster__metro"
        description: "The metro of the provider's facility that runs the cluster"
        order_weight: 650

  - name: ClusterSdn
    namespace: Managed
    label: Cluster SDN
    icon: mdi:lan-connect
    description: "The software network layer of a cluster: NSX of a hypervisor cluster, the CNI of a Kubernetes cluster"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: provider
        label: Provider
        kind: Dropdown
        optional: false
        description: "The SDN or CNI implementation"
        order_weight: 1200
        choices:
          - name: nsx
            label: VMware NSX
            description: "NSX overlay with Tier-0 and Tier-1 gateways on Edge nodes"
          - name: cilium
            label: Cilium
            description: "Cilium CNI"
          - name: calico
            label: Calico
            description: "Calico CNI"
          - name: flannel
            label: Flannel
            description: "Flannel CNI"
          - name: antrea
            label: Antrea
            description: "Antrea CNI (also the CNI of Tanzu)"
          - name: ovn-kubernetes
            label: OVN-Kubernetes
            description: "OVN-Kubernetes CNI (OpenShift)"
          - name: aws-vpc-cni
            label: AWS VPC CNI
            description: "Pods get addresses of the VPC (EKS)"
          - name: azure-cni
            label: Azure CNI
            description: "Azure CNI, node subnet or overlay (AKS)"
          - name: other
            label: Other
            description: "Another SDN or CNI"
      - name: encapsulation
        label: Encapsulation
        kind: Dropdown
        optional: false
        default_value: none
        description: "How the overlay is carried between the nodes"
        order_weight: 1250
        choices:
          - name: geneve
            label: Geneve
            description: "NSX, OVN-Kubernetes"
          - name: vxlan
            label: VXLAN
            description: "Flannel, Cilium, Azure CNI overlay"
          - name: ipip
            label: IP-in-IP
            description: "Calico"
          - name: wireguard
            label: WireGuard
            description: "Cilium or Calico encrypted tunnels"
          - name: none
            label: None
            description: "No overlay: the pods are routed (BGP) or take the addresses of the network itself"
      - name: overlay_cidr
        label: Overlay Range
        kind: Text
        optional: true
        description: "The range the overlay addresses from: the pod range of a CNI, the transport (TEP) pool of NSX"
        order_weight: 1300
      - name: service_cidr
        label: Service Range
        kind: Text
        optional: true
        description: "The range of cluster services (Kubernetes)"
        order_weight: 1350
    relationships:
      - name: gateway_nodes
        label: Gateway Nodes
        peer: DcimVirtualDevice
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "cluster_sdn__gateway_nodes"
        description: "The VMs that carry the SDN's gateways: the NSX Edge nodes, a CNI's egress or gateway nodes"
        order_weight: 1500

  - name: KubernetesCluster
    namespace: Managed
    label: Kubernetes Cluster
    icon: mdi:kubernetes
    description: "On-prem Kubernetes: the nodes are VMs or servers of ours, in tenant segments"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedCluster
      - DcimSoftwareRunner
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value"]
    relationships:
      - name: control_plane_nodes
        label: Control Plane Nodes
        peer: DcimDevice
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "kubernetes_cluster__control_plane"
        description: "The control plane nodes: VMs (their hosting_device is a hypervisor host) or servers of ours"
        order_weight: 1500
      - name: worker_nodes
        label: Worker Nodes
        peer: DcimDevice
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "kubernetes_cluster__workers"
        order_weight: 1550
      - name: node_segments
        label: Node Segments
        peer: ManagedVxlanSegment
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "kubernetes_cluster__node_segments"
        description: "The tenant segments the nodes sit in"
        order_weight: 1600

  - name: KubernetesCluster
    namespace: Cloud
    label: Kubernetes Cluster
    icon: mdi:kubernetes
    description: "Managed Kubernetes (EKS, AKS, GKE) in a cloud account, on a virtual network"
    include_in_menu: false
    inherit_from:
      - CloudResource
      - ManagedCluster
      - DcimSoftwareRunner
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["account", "name__value"]
    attributes:
      - name: api_access
        label: API Endpoint
        kind: Dropdown
        optional: false
        default_value: private
        description: "Whether the control plane endpoint is reachable from the internet"
        order_weight: 1250
        choices:
          - name: public
            label: Public
            description: "The endpoint has a public address"
          - name: private
            label: Private
            description: "The endpoint is reachable only from the virtual network and what peers with it"
      - name: node_count
        label: Nodes
        kind: Number
        optional: true
        description: "Worker nodes over all node pools"
        order_weight: 1300
    relationships:
      - name: account
        label: Account
        peer: CloudAccount
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "cloud_kubernetes_cluster__account"
        order_weight: 600
      - name: region
        label: Region
        peer: TopologyCloudRegion
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "cloud_kubernetes_cluster__region"
        order_weight: 650
      - name: virtual_network
        label: Virtual Network
        peer: CloudVirtualNetwork
        optional: false
        cardinality: one
        kind: Attribute
        identifier: "cloud_kubernetes_cluster__virtual_network"
        order_weight: 700
      - name: node_segments
        label: Node Subnets
        peer: CloudNetworkSegment
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "cloud_kubernetes_cluster__node_segments"
        description: "The subnets the worker nodes sit in"
        order_weight: 1500
