---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

# Inter-zone (inter-VRF) traffic exchange. Full design writeup,
# data-flow diagram, and demo walkthrough: docs/exchange_gateway.md.
#
# Inter-VRF traffic is exchanged by an inspected hop through a firewall
# context, modeled as a concrete realization of one generic:
#
#   TopologyRoutedExchange   — the hop through ONE firewall CONTEXT
#                              (`gateway`, a ManagedFirewallContext) between
#                              two VRFs. No leak: each VRF keeps its own routing
#                              table and statics point at the context's leg VIP
#                              in that VRF. Created per context by the customer
#                              boarding generators, named `{context}-{A}-{Z}`;
#                              there are no bootstrap exchanges.
#
# It has no setting of its own and is NOT on the interface edge: its legs are
# DERIVED, the context's legs (utils/service_contexts.py context_legs) on each
# member in the exchange's vrf_a and vrf_z (the leg interface's ManagedVRF
# capability), utils/service_contexts.py exchange_legs. The "one leg per VRF on
# each member" invariant is enforced by validate_exchange_gateways() in
# checks/common.py. A context lists its exchanges (`exchanges`, the reverse of
# `gateway`).

generics:
  - name: ExchangeGateway
    namespace: Topology
    description: "How traffic is exchanged between two security-zone routing domains (VRFs)"
    label: "Exchange Gateway"
    icon: "mdi:swap-horizontal"
    include_in_menu: false
    relationships:
      - name: vrf_a
        label: "VRF A"
        peer: ManagedVRF
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: no-action
        identifier: "exchange_gateway__vrf_a"
        order_weight: 1000
        description: "First deployment-scoped routing instance participating in the exchange"
      - name: vrf_z
        label: "VRF Z"
        peer: ManagedVRF
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: no-action
        identifier: "exchange_gateway__vrf_z"
        order_weight: 1100
        description: "Second deployment-scoped routing instance participating in the exchange"

nodes:
  - name: RoutedExchange
    namespace: Topology
    description: "Inter-VRF routed hop through one device — no fabric-wide route leak"
    label: "Routed Exchange (VRF Default)"
    icon: "mdi:router-network"
    include_in_menu: false
    inherit_from:
      - TopologyExchangeGateway
      - ManagedGeneric
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [vrf_a, vrf_z, gateway]
    relationships:
      - name: gateway
        label: "Gateway context"
        peer: ManagedFirewallContext
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: no-action
        identifier: "routed_exchange__gateway"
        order_weight: 1300
        description: "Firewall context whose legs in the two VRFs (one VLAN sub-interface per VRF and member) form this exchange"  # yamllint disable-line rule:line-length

extensions:
  nodes:
    - kind: ManagedFirewallContext
      relationships:
        - name: exchanges
          label: "Routed Exchanges"
          peer: TopologyRoutedExchange
          cardinality: many
          kind: Generic
          optional: true
          identifier: "routed_exchange__gateway"
          order_weight: 1150
          description: "The exchanges this context is the gateway of (written from the exchange side)"
