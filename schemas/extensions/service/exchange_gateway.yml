---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

# Inter-zone (inter-VRF) traffic exchange. Full design writeup,
# data-flow diagram, and demo walkthrough: docs/exchange_gateway.md.
#
# Inter-VRF traffic is exchanged by an inspected hop through a firewall
# context, modeled as a concrete realization of one generic:
#
#   TopologyRoutedExchange   — the hop through ONE firewall CONTEXT
#                              (`gateway`, a ManagedFirewallContext) between
#                              two VRFs. Its legs are the context's firewall
#                              VLAN sub-interfaces, one per VRF, each with an
#                              address in the default IPAM namespace (carried in
#                              capabilities). No leak: each VRF keeps
#                              its own routing table and statics point at the
#                              context's leg VIP in that VRF. Created per
#                              context by the customer boarding generators,
#                              named `{context}-{A}-{Z}`; there are no
#                              bootstrap exchanges.
#
# It inherits ManagedGenericInterfaces so it surfaces in
# interface.capabilities — the same capability list already used
# by RoutingOSPFInterface and ManagedVxlanSegment (see
# queries/fragments/interface_capability_fields.gql). This is what lets a
# device config query (e.g. border_leaf_config) discover "what is this
# port doing" without a second, zone-rooted query.
#
# Which side of the exchange an interface belongs to is read off
# interface.security_zone at render time — not duplicated here
# as separate interface_a/interface_z fields, so the two can't disagree.
#
# TopologyRoutedExchange's interfaces (the legs) are unconstrained at the schema level
# (no min_count/max_count). A node may re-declare an inherited relationship to add a
# count, but only under the SAME name and the same peer (the node declaration then
# replaces the generic's wholesale); a DIFFERENTLY named relationship carrying the
# same identifier collides. The "one leg per zone on the gateway context's
# devices" invariant is enforced by validate_exchange_gateways() in
# checks/common.py, not by the schema.

generics:
  - name: ExchangeGateway
    namespace: Topology
    description: "How traffic is exchanged between two security-zone routing domains (VRFs)"
    label: "Exchange Gateway"
    icon: "mdi:swap-horizontal"
    include_in_menu: false
    relationships:
      - name: vrf_a
        label: "VRF A"
        peer: ManagedVRF
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: no-action
        identifier: "exchange_gateway__vrf_a"
        order_weight: 1000
        description: "First deployment-scoped routing instance participating in the exchange"
      - name: vrf_z
        label: "VRF Z"
        peer: ManagedVRF
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: no-action
        identifier: "exchange_gateway__vrf_z"
        order_weight: 1100
        description: "Second deployment-scoped routing instance participating in the exchange"

nodes:
  - name: RoutedExchange
    namespace: Topology
    description: "Inter-VRF routed hop through one device — no fabric-wide route leak"
    label: "Routed Exchange (VRF Default)"
    icon: "mdi:router-network"
    include_in_menu: false
    inherit_from:
      - TopologyExchangeGateway
      - ManagedGeneric
      - ManagedGenericInterfaces
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [vrf_a, vrf_z, gateway]
    relationships:
      - name: gateway
        label: "Gateway context"
        peer: ManagedFirewallContext
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: no-action
        identifier: "routed_exchange__gateway"
        order_weight: 1300
        description: "Firewall context whose legs (one VLAN sub-interface per zone) form this exchange"
      # interfaces (many, via ManagedGenericInterfaces) — the context's leg
      # sub-interfaces, one per zone per member. Enforced by
      # validate_exchange_gateways() in checks/common.py.
