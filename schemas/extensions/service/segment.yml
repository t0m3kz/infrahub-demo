---
version: "1.0"

nodes:
  # VXLAN overlay segment with EVPN multi-tenancy.
  # Zero trust: prefix → ip_namespace (VRF+l3_vni+owner) → tenant isolation.
  # For stretched segments, generator behavior is local-pool-first: first
  # SegmentDeployment allocates VNI from deployment vni_pool, then reuses the
  # same value in other deployments.
  - name: VxlanSegment
    namespace: Managed
    description: "VXLAN overlay segment with EVPN multi-tenancy"
    label: VXLAN Segment
    icon: "carbon:network-overlay"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedNetworkSegment
    uniqueness_constraints:
      - [owner, environment__value, customer_name__value]
    attributes:
      - name: segment_type
        kind: Dropdown
        default_value: vxlan
        read_only: true
        choices:
          - name: vxlan
            label: VXLAN
            description: "VXLAN overlay segment"
            color: "#3498DB"
      - name: arp_suppression
        kind: Boolean
        label: ARP Suppression
        optional: true
        default_value: true
        order_weight: 10
        description: "EVPN ARP suppression for this VXLAN segment."
      - name: terminate_inline
        kind: Boolean
        label: Terminate Inline
        optional: true
        default_value: false
        order_weight: 11
        description: "When true, the inline_service HA pair is the segment's gateway. Leaf is pure L2."
      - name: stretch_scope
        kind: Dropdown
        label: Stretch Scope
        optional: true
        default_value: local
        order_weight: 12
        description: "Intended L2 stretch scope for this segment."
        choices:
          - name: local
            label: Local
            description: "Single deployment only"
            color: "#7FBF7F"
          - name: metro
            label: Metro
            description: "Stretched between deployments in one metro"
            color: "#3498DB"
          - name: dc_pair
            label: DC Pair
            description: "Stretched between two data center deployments"
            color: "#9B59B6"
          - name: global
            label: Global
            description: "Stretched across multiple metros/regions"
            color: "#E67E22"
    relationships:
      # TopologyDeployment, not TopologyCustomer: a TopologyCustomerOffice hosts
      # its own segments (it is TopologySegmentHosting) but is not a
      # TopologyCustomer (it carries its own owner, and no environment), so the
      # narrower generic could not name it. checks/segment_placement.py is what limits the kinds.
      - name: customer_deployments
        peer: TopologyDeployment
        cardinality: many
        kind: Attribute
        order_weight: 110
        optional: false
        identifier: "segment__customer_deployments"
        description: "Customer deployment footprints this VXLAN segment is activated in (stretch across DCs or single-site)."  # yamllint disable-line rule:line-length
        min_count: 1

  # SegmentDeployment: per-DC realization of a VXLAN segment.
  #
  # Stores the locally-allocated VNI for a segment in a specific data
  # center, from the DC's vni_pool via idempotent allocation. The segment's
  # LOCAL VLAN ID is NOT stored here — VLAN ID has only local (per-switch or
  # per-MLAG-pair) significance, so it lives on ManagedVlanDomainSegment
  # instead, one row per (segment, VLAN domain) rather than per (segment, DC).
  # VNI remains the correct DC-wide/fabric-wide segment identifier.
  #
  # Gateway IP is derived from segment.gateway (not stored here).
  # ARP suppression is read from segment.arp_suppression.
  # Target DCs are derived from segment.customer_deployments.
  #
  # Created by: add_vxlan_segment generator
  # Read by:    transforms — query deployment.segment_deployments

  - name: SegmentDeployment
    namespace: Managed
    description: "Per-DC realization of a network segment with a locally-allocated VNI."  # yamllint disable-line rule:line-length
    label: Segment Deployment
    icon: "carbon:network-overlay"
    include_in_menu: false
    display_label: "{{ segment__customer_name__value }} @ {{ deployment__name__value }}"  # yamllint disable-line rule:line-length
    uniqueness_constraints:
      - [segment, deployment]
    attributes:
      - name: vni
        kind: Number
        label: L2 VNI
        optional: true
        order_weight: 1050
        description: "L2 VNI for this deployment; stretched segments share one value across deployments."
        parameters:
          min_value: 1
          max_value: 16777215

      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 1100
        choices:
          - name: active
            label: Active
            description: "Segment is fully provisioned and carrying traffic"
            color: "#2ECC71"
          - name: provisioning
            label: Provisioning
            description: "Generator is pushing config to switches"
            color: "#F39C12"

    relationships:
      - name: segment
        peer: ManagedNetworkSegment
        label: Network Segment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2000
        identifier: "segmentdeployment__segment"
        description: "The network segment being activated"

      - name: deployment
        peer: TopologySegmentHosting
        label: Deployment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2100
        identifier: "segmentdeployment__deployment"
        description: "The DC or colocation metro where this segment is locally realized"

      - name: vlan_domain_segments
        peer: ManagedVlanDomainSegment
        label: VLAN Domain Segments
        cardinality: many
        kind: Component
        optional: true
        order_weight: 2200
        identifier: "vlandomainsegment__segment_deployment"
        on_delete: cascade
        description: "The switches of this DC that carry the segment, each with its local VLAN ID"

  # VlanDomainSegment: the realization of a VXLAN segment's LOCAL VLAN ID on ONE switch, a child of the segment's
  # realization in the DC it sits in (SegmentDeployment): segment -> realization in the DC (VNI) -> realization on the
  # switch (VLAN ID). The row points straight at its device: there is no domain object. IEEE 802.1Q VLAN ID has only
  # local significance and is unique on a device (the [device, vlan_id__value] constraint): two segments never share
  # it on one switch. The two peers of an MLAG pair MUST carry the same vlan_id for a segment (one L2 broadcast
  # domain for a dual-homed port-channel): the allocator gives them one id and checks/mlag_domains.py reports a pair
  # whose rows differ. The generator reuses a segment's vlan_id across the switches it lands on. The segment's
  # DC-wide identity remains SegmentDeployment.vni (L2 VNI).
  #
  # Created by: the segment reconcile (generators/vlan_domain.py), once per (segment deployment, device) pair and for
  # the MLAG peers of every device that has a port of the segment, untracked. It is an output: a port is given a
  # SEGMENT, never a VLAN; the VLAN of a port is found by port -> device -> row of the segment. A row of a device
  # that no longer needs the segment (or is gone) is deleted by the next reconcile, not by a cascade from the device.
  # Read by: leaf-side transforms, keyed by the rendering device.
  - name: VlanDomainSegment
    namespace: Managed
    description: "A segment's local VLAN ID on one switch, under its deployment."
    label: VLAN Domain Segment
    icon: "carbon:network-overlay"
    include_in_menu: false
    display_label: "vlan {{ vlan_id__value }} @ {{ device__name__value }} (VNI {{ segment_deployment__vni__value }})"  # yamllint disable-line rule:line-length
    uniqueness_constraints:
      - [segment_deployment, device]
      - [device, vlan_id__value]
    attributes:
      - name: vlan_id
        kind: Number
        label: Local VLAN ID
        optional: false
        order_weight: 1000
        description: "VLAN ID of this segment on this switch: unique there, equal on the two peers of an MLAG pair."
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: segment_deployment
        peer: ManagedSegmentDeployment
        label: Segment Deployment
        cardinality: one
        kind: Parent
        optional: false
        order_weight: 2000
        identifier: "vlandomainsegment__segment_deployment"
        description: "The segment's realization in the DC or metro this switch belongs to"
      # An Attribute, not a second Parent: the row goes with its deployment (cascade), and the reconcile deletes the
      # rows of a device that no longer needs the segment or is gone.
      - name: device
        peer: DcimPhysicalDevice
        label: Device
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2100
        identifier: "vlandomainsegment__device"
        description: "The switch this VLAN ID realization is on"
      # A routed row is realized on its switch as ONE SVI (DcimVirtualInterface role svi, no address: the anycast
      # gateway is the segment's), written by generators/helpers/svi.py and deleted with the row.
      - name: svi
        peer: DcimVirtualInterface
        label: SVI
        cardinality: one
        kind: Component
        optional: true
        on_delete: cascade
        order_weight: 2200
        identifier: "vlandomainsegment__svi"
        description: "The routed SVI of this segment on the row's switch (role svi); deleted with the row"

extensions:
  nodes:
    - kind: DcimVirtualInterface
      relationships:
        - name: vlan_domain_segment
          peer: ManagedVlanDomainSegment
          label: VLAN Domain Segment
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 1460
          identifier: "vlandomainsegment__svi"
          description: "The VLAN-domain row this SVI realizes (role svi only)"
        # The inline L3 termination of a segment (terminate_inline) on an HA member's `<port>.<vlan>` sub-interface.
        # One-sided, like `vrf`: nobody assigns a virtual interface to a segment, only the segment generator writes
        # it (generators/topology/segment.py), so there is no reverse field and the segment page has ONE interface
        # list, `switched_interfaces`. The segment is no longer on the interface edge (ManagedGenericInterfaces).
        - name: inline_segment
          peer: ManagedVxlanSegment
          label: Inline Segment
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 1480
          identifier: "inline_segment__sub_interface"
          description: "Segment this HA member sub-interface terminates inline (written by the generator)"

    - kind: ManagedVxlanSegment
      relationships:
        - name: segment_deployments
          peer: ManagedSegmentDeployment
          kind: Generic
          cardinality: many
          identifier: "segmentdeployment__segment"
          order_weight: 9000
          description: "Per-deployment VNI allocations for this segment"
        # The typed L2 membership: the switch ports (physical or LAG) the segment is a VLAN on, written by the
        # segment reconcile (generators/topology/segment_ports.py) and by its inline termination's border service ports
        # (generators/topology/segment.py). A change of it re-runs add_vxlan_segment (data/events/99_actions.yml).
        # The inline L3 termination on an HA member's sub-interface is `DcimVirtualInterface.inline_segment`.
        - name: switched_interfaces
          label: Switched Interfaces
          peer: DcimSwitchedInterface
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__switched_interfaces"
          order_weight: 9100
          description: "Switch ports (physical or LAG) carrying this segment as a VLAN"

    - kind: DcimSwitchedInterface
      relationships:
        - name: segments
          label: Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__switched_interfaces"
          order_weight: 1850
          description: "VXLAN segments this port carries as VLANs (its switchport membership)"

    - kind: TopologySegmentHosting
      relationships:
        - name: segment_deployments
          label: Segment Deployments
          peer: ManagedSegmentDeployment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segmentdeployment__deployment"
          order_weight: 7950
          description: "Per-DC/Metro VNI activations realized on this deployment"

    - kind: DcimPhysicalDevice
      relationships:
        - name: vlan_domain_segments
          label: VLAN Domain Segments
          peer: ManagedVlanDomainSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "vlandomainsegment__device"
          order_weight: 7950
          description: "Segments locally realized on this switch, each with its VLAN ID"

    - kind: OrganizationCustomer
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedNetworkSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "network_segment__owner"
          order_weight: 2200
          description: "VXLAN/cloud network segments owned by this customer"

    # Reverse lookup for VxlanSegment.customer_deployments / CloudNetworkSegment.customer_deployment (both share this
    # identifier) — lets a footprint find its own activated segments in one hop. Declared per kind, not on the
    # TopologyCustomer generic: the segments of a data center, a colocation and an office are VXLAN only and a cloud
    # footprint's are CloudNetworkSegment, so each peer is the concrete kind.
    - kind: TopologyCustomerDC
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VXLAN segments activated in this data center footprint"

    - kind: TopologyCustomerColocation
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VXLAN segments activated in this colocation footprint"

    - kind: TopologyCustomerCloud
      relationships:
        - name: network_segments
          label: Network Segments
          peer: CloudNetworkSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "Cloud network segments (subnets) of this cloud footprint"

    - kind: TopologyCustomerOffice
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VXLAN segments activated in this office footprint"
