---
version: "1.0"

nodes:
  # Traditional 802.1Q VLAN segment.
  # Single-site by design (customer_deployment is cardinality:one), so the
  # VLAN ID is a direct attribute — no separate SegmentDeployment realization
  # record is needed (unlike VxlanSegment, which can stretch across sites).
  - name: VlanSegment
    namespace: Managed
    description: "Traditional 802.1Q VLAN segment"
    label: VLAN Segment
    icon: "carbon:network-3"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedNetworkSegment
      - ManagedGenericInterfaces
    uniqueness_constraints:
      - [owner, environment__value, customer_name__value]
    attributes:
      - name: segment_type
        kind: Dropdown
        default_value: vlan
        read_only: true
        choices:
          - name: vlan
            label: VLAN
            description: "IEEE 802.1Q VLAN"
            color: "#7FBF7F"
      - name: vlan_id
        kind: Number
        label: VLAN ID
        optional: true
        order_weight: 15
        description: "Local VLAN ID, set manually (single-site, no pool allocation)."
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: customer_deployment
        peer: TopologyCustomer
        cardinality: one
        kind: Attribute
        order_weight: 110
        optional: true
        identifier: "segment__customer_deployments"
        description: "Customer deployment footprint this VLAN segment is activated in."

  # VXLAN overlay segment with EVPN multi-tenancy.
  # Zero trust: prefix → ip_namespace (VRF+l3_vni+owner) → tenant isolation.
  # L2 VNI allocated per-deployment via SegmentDeployment.
  - name: VxlanSegment
    namespace: Managed
    description: "VXLAN overlay segment with EVPN multi-tenancy"
    label: VXLAN Segment
    icon: "carbon:network-overlay"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedNetworkSegment
      - ManagedGenericInterfaces
    uniqueness_constraints:
      - [owner, environment__value, customer_name__value]
    attributes:
      - name: segment_type
        kind: Dropdown
        default_value: vxlan
        read_only: true
        choices:
          - name: vxlan
            label: VXLAN
            description: "VXLAN overlay segment"
            color: "#3498DB"
      - name: arp_suppression
        kind: Boolean
        label: ARP Suppression
        optional: true
        default_value: true
        order_weight: 3
        description: "EVPN ARP suppression for this VXLAN segment."
      - name: terminate_inline
        kind: Boolean
        label: Terminate Inline
        optional: true
        default_value: false
        order_weight: 4
        description: "When true, FW/LB terminates traffic inline. Leaf is pure L2."
    relationships:
      - name: customer_deployments
        peer: TopologyCustomer
        cardinality: many
        kind: Attribute
        order_weight: 110
        optional: true
        identifier: "segment__customer_deployments"
        description: "Customer deployment footprints this VXLAN segment is activated in (stretch across DCs or single-site)."  # yamllint disable-line rule:line-length

  # SegmentDeployment: per-DC realization of a VXLAN segment (VlanSegment has
  # no realization record — its vlan_id is a plain manual attribute).
  #
  # Stores the locally-allocated VLAN ID and VNI for a segment in a
  # specific data center. Values come from the DC's pool (vlan_pool,
  # vni_pool) via idempotent allocation.
  #
  # Gateway IP is derived from segment.gateway (not stored here).
  # ARP suppression is read from segment.arp_suppression.
  # Target DCs are derived from segment.customer_deployments.
  #
  # Created by: add_vxlan_segment generator
  # Read by:    transforms — query deployment.segment_deployments

  - name: SegmentDeployment
    namespace: Managed
    description: "Per-DC realization of a network segment with locally-allocated VLAN ID and VNI."  # yamllint disable-line rule:line-length
    label: Segment Deployment
    icon: "carbon:network-overlay"
    include_in_menu: false
    display_label: "{{ segment__customer_name__value }} @ {{ deployment__name__value }}"  # yamllint disable-line rule:line-length
    uniqueness_constraints:
      - [segment, deployment]
    attributes:
      - name: vlan_id
        kind: Number
        label: Local VLAN ID
        optional: false
        order_weight: 1000
        description: "VLAN ID for this segment in this deployment. Allocated from DC vlan_pool."  # yamllint disable-line rule:line-length
        parameters:
          min_value: 1
          max_value: 4094

      - name: vni
        kind: Number
        label: L2 VNI
        optional: true
        order_weight: 1050
        description: >-
          L2 VNI for this segment in this deployment. Null means no VXLAN
          overlay (traditional VLAN). Allocated from DC vni_pool.
        parameters:
          min_value: 1
          max_value: 16777215

      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 1100
        choices:
          - name: active
            label: Active
            description: "Segment is fully provisioned and carrying traffic"
            color: "#2ECC71"
          - name: provisioning
            label: Provisioning
            description: "Generator is pushing config to switches"
            color: "#F39C12"
          - name: decommissioning
            label: Decommissioning
            description: "Being removed from service"
            color: "#E67E22"
          - name: decommissioned
            label: Decommissioned
            description: "Config removed from all switches"
            color: "#95A5A6"

    relationships:
      - name: segment
        peer: ManagedNetworkSegment
        label: Network Segment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2000
        identifier: "segmentdeployment__segment"
        description: "The network segment being activated"

      - name: deployment
        peer: TopologySegmentHosting
        label: Deployment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2100
        identifier: "segmentdeployment__deployment"
        description: "The DC or colocation metro where this segment is locally realized"

extensions:
  nodes:
    - kind: ManagedVxlanSegment
      relationships:
        - name: segment_deployments
          peer: ManagedSegmentDeployment
          kind: Generic
          cardinality: many
          identifier: "segmentdeployment__segment"
          order_weight: 9000
          description: "Per-deployment VLAN/VNI allocations for this segment"

    - kind: TopologyCustomer
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedNetworkSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VLAN/VXLAN segments activated in this customer deployment footprint"

    - kind: TopologySegmentHosting
      relationships:
        - name: segment_deployments
          label: Segment Deployments
          peer: ManagedSegmentDeployment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segmentdeployment__deployment"
          order_weight: 7950
          description: "Per-DC/Metro VLAN/VNI activations realized on this deployment"
