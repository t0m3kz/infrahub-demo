---
version: "1.0"

nodes:
  # VXLAN overlay segment with EVPN multi-tenancy.
  # Routing authority: segment.security_zone (VRF name/type/L3 VNI); IPAM identity stays in default.
  # For stretched segments, generator behavior is local-pool-first: first
  # SegmentDeployment allocates VNI from deployment vni_pool, then reuses the
  # same value in other deployments.
  - name: VxlanSegment
    namespace: Managed
    description: "VXLAN overlay segment with EVPN multi-tenancy"
    label: VXLAN Segment
    icon: "carbon:network-overlay"
    include_in_menu: false
    inherit_from:
      - ManagedGeneric
      - ManagedNetworkSegment
    uniqueness_constraints:
      - [owner, environment__value, customer_name__value]
    attributes:
      - name: segment_type
        kind: Dropdown
        default_value: vxlan
        read_only: true
        choices:
          - name: vxlan
            label: VXLAN
            description: "VXLAN overlay segment"
            color: "#3498DB"
      - name: arp_suppression
        kind: Boolean
        label: ARP Suppression
        optional: true
        default_value: true
        order_weight: 10
        description: "EVPN ARP suppression for this VXLAN segment."
      - name: stretch_scope
        kind: Dropdown
        label: Stretch Scope
        optional: true
        default_value: local
        order_weight: 12
        description: "Intended L2 stretch scope for this segment."
        choices:
          - name: local
            label: Local
            description: "Single deployment only"
            color: "#7FBF7F"
          - name: metro
            label: Metro
            description: "Stretched between deployments in one metro"
            color: "#3498DB"
          - name: dc_pair
            label: DC Pair
            description: "Stretched between two data center deployments"
            color: "#9B59B6"
          - name: global
            label: Global
            description: "Stretched across multiple metros/regions"
            color: "#E67E22"
      - name: vlan_scope
        kind: Dropdown
        label: VLAN Scope
        optional: false
        default_value: local
        order_weight: 13
        description: "Whether the VLAN id is local to each switch or the same on all of them"
        choices:
          - name: local
            label: Local
            description: "Each switch has its own VLAN id for the segment (VXLAN fabric: the VNI is the identity)"
            color: "#7FBF7F"
          - name: shared
            label: Shared
            description: "One VLAN id on every switch, derived from the segment's one VNI of the global pool (VNI 40000-40499 gives VLAN 2500-2999): for L2 trunked between switches that cannot do VXLAN"  # yamllint disable-line rule:line-length
            color: "#E67E22"
    relationships:
      # TopologyDeployment, not TopologyCustomer: a TopologyCustomerOffice hosts
      # its own segments (it is TopologySegmentHosting) but is not a
      # TopologyCustomer (it carries its own owner, and no environment), so the
      # narrower generic could not name it. checks/segment_placement.py is what limits the kinds.
      - name: customer_deployments
        peer: TopologyDeployment
        cardinality: many
        kind: Attribute
        order_weight: 110
        optional: false
        identifier: "segment__customer_deployments"
        description: "Customer deployment footprints this VXLAN segment is activated in (stretch across DCs or single-site)."  # yamllint disable-line rule:line-length
        min_count: 1

  # SegmentDeployment: per-DC realization of a VXLAN segment.
  #
  # Stores the locally-allocated VNI for a segment in a specific data
  # center, from the DC's vni_pool via idempotent allocation. The segment's
  # LOCAL VLAN ID is NOT stored here — VLAN ID has only local (per-switch or
  # per-MLAG-pair) significance, so it lives on ManagedSegmentVlan
  # instead, one row per (segment, VLAN domain) rather than per (segment, DC).
  # VNI remains the correct DC-wide/fabric-wide segment identifier.
  #
  # Gateway IP is derived from segment.gateway (not stored here).
  # ARP suppression is read from segment.arp_suppression.
  # Target DCs are derived from segment.customer_deployments.
  #
  # Created by: add_vxlan_segment generator
  # Read by:    transforms — query deployment.segment_deployments

  - name: SegmentDeployment
    namespace: Managed
    description: "Per-DC realization of a network segment with a locally-allocated VNI."  # yamllint disable-line rule:line-length
    label: Segment Deployment
    icon: "carbon:network-overlay"
    include_in_menu: false
    # The switch ports (physical, LAG) a person asks to carry the segment in this deployment are its interface
    # `capabilities` (ManagedGenericInterfaces, the interface edge): the INTENT, "this port carries this segment in this
    # DC", written by a person (or the 00_full data). The segment reconcile (generators/topology/segment_ports.py)
    # realizes it, with the ports its components derive: the row of each port's switch, then the port -> row edge (the
    # row's `capabilities`). It never writes or removes this list. checks/interface_layers.py holds what the schema
    # cannot (a physical port or a LAG only).
    inherit_from:
      - ManagedGenericInterfaces
    display_label: "{{ segment__customer_name__value }} in {{ deployment__name__value }}"  # yamllint disable-line rule:line-length
    # Named by its two parents, so an object file can upsert it (and hang a VLAN row under it) without nesting it under
    # the segment, where a second load could only create it again and break the uniqueness below.
    human_friendly_id:
      - segment__name__value
      - deployment__name__value
    uniqueness_constraints:
      - [segment, deployment]
    attributes:
      - name: vni
        kind: Number
        label: L2 VNI
        optional: true
        order_weight: 1050
        description: "L2 VNI for this deployment; stretched segments share one value across deployments."
        parameters:
          min_value: 1
          max_value: 16777215

      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 1100
        choices:
          - name: active
            label: Active
            description: "Segment is fully provisioned and carrying traffic"
            color: "#2ECC71"
          - name: provisioning
            label: Provisioning
            description: "Generator is pushing config to switches"
            color: "#F39C12"

    relationships:
      - name: segment
        peer: ManagedNetworkSegment
        label: Network Segment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2000
        identifier: "segmentdeployment__segment"
        description: "The network segment being activated"

      - name: deployment
        peer: TopologySegmentHosting
        label: Deployment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2100
        identifier: "segmentdeployment__deployment"
        description: "The DC or colocation metro where this segment is locally realized"

      - name: vlans
        peer: ManagedSegmentVlan
        label: Segment VLANs
        cardinality: many
        kind: Component
        optional: true
        order_weight: 2200
        identifier: "segmentvlan__segment_deployment"
        on_delete: cascade
        description: "The switches of this DC that carry the segment, each with its local VLAN ID"

  # SegmentVlan: the realization of a VXLAN segment's LOCAL VLAN ID on ONE switch, a child of that switch, under the
  # segment's realization in the DC it sits in (SegmentDeployment): segment -> realization in the DC (VNI) ->
  # realization on the switch (VLAN ID). The row points straight at its device: there is no domain object. IEEE
  # 802.1Q VLAN ID has only local significance and is unique on a device (the [device, vlan_id__value] constraint):
  # two segments never share it on one switch. The two peers of an MLAG pair MUST carry the same vlan_id for a
  # segment (one L2 broadcast domain for a dual-homed port-channel): the allocator gives them one id and
  # checks/mlag_domains.py reports a pair whose rows differ. The generator reuses a segment's vlan_id across the
  # switches it lands on. The segment's DC-wide identity remains SegmentDeployment.vni (L2 VNI).
  #
  # Created by: the segment reconcile (generators/segment_vlan.py), once per (segment deployment, device) pair and for
  # the MLAG peers of every device that has a port of the segment (derived or assigned to a deployment), untracked.
  # Only the reconcile creates a row. The row is a child of its switch (Parent `device`, deleted with it) and goes
  # with its deployment too (the deployment's cascading `vlans`); a row of a device that no longer needs the segment
  # is deleted by the next reconcile.
  #
  # The switch ports (physical, LAG) of the row's device that carry the segment are its interface `capabilities`
  # (ManagedGenericInterfaces, the interface edge): a port is a member of its switch's row, so the VLAN of a port is
  # its row's vlan_id and the VNI and segment come through `segment_deployment`: the REALIZATION. Only the reconcile
  # (generators/topology/segment_ports.py) writes these edges, AFTER the rows: for the ports its components derive and
  # the ports assigned to the deployment (a person's intent lives there, never on this edge). A port then shows both in
  # its `capabilities`, its deployment (asked) and its row (realized); a reader of a port's segment reads the row. The
  # server holds that a port is of the row's own switch (`common_parent: device` on the edge);
  # checks/interface_layers.py holds a physical port or LAG only, one row of a segment per port, and reports a
  # membership nobody asked for.
  # Read by: the switch transforms, from the device's `vlans` and the port's capabilities.
  - name: SegmentVlan
    namespace: Managed
    description: "A segment's local VLAN ID on one switch, under its deployment."
    label: Segment VLAN
    icon: "carbon:network-overlay"
    include_in_menu: false
    inherit_from:
      - ManagedGenericInterfaces
    display_label: "vlan {{ vlan_id__value }} on {{ device__name__value }} (VNI {{ segment_deployment__vni__value }})"  # yamllint disable-line rule:line-length
    # A VLAN id is unique on a switch, so the pair names the row: an object file upserts it (a second load updates it).
    human_friendly_id:
      - device__name__value
      - vlan_id__value
    uniqueness_constraints:
      - [segment_deployment, device]
      - [device, vlan_id__value]
    attributes:
      - name: vlan_id
        kind: Number
        label: Local VLAN ID
        optional: false
        order_weight: 1000
        description: "VLAN ID of this segment on this switch: unique there, equal on the two peers of an MLAG pair."
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      # A plain mandatory edge, not the Parent: the deployment's `vlans` is a Component with on_delete cascade, so the
      # row still goes with its deployment (measured on 1.11.9: a cascading Component side deletes a non-Parent peer).
      - name: segment_deployment
        peer: ManagedSegmentDeployment
        label: Segment Deployment
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2000
        identifier: "segmentvlan__segment_deployment"
        description: "The segment's realization in the DC or metro this switch belongs to"
      # The Parent: the row is a child of its switch (DcimPhysicalDevice.vlans, Component, cascade: a row dies with its
      # switch), which lets `capabilities` below hold `common_parent: device`. The reconcile also deletes the rows of
      # a device that no longer needs the segment.
      - name: device
        peer: DcimPhysicalDevice
        label: Device
        cardinality: one
        kind: Parent
        optional: false
        order_weight: 2100
        identifier: "segmentvlan__device"
        description: "The switch this VLAN ID realization is on"
      # The interface edge of ManagedGenericInterfaces, re-declared to add `common_parent: device`: the server refuses
      # a port of another switch on create and on update (measured on 1.11.9). Physical ports and LAGs only, one row of
      # a segment per port: checks/interface_layers.py.
      - name: capabilities
        peer: DcimInterface
        label: Ports
        cardinality: many
        kind: Generic
        optional: true
        identifier: interface_capabilities
        common_parent: device
        order_weight: 2300
        description: "The switch ports (physical, LAG) of the row's switch that carry the segment with this VLAN ID"

extensions:
  nodes:
    - kind: ManagedVxlanSegment
      relationships:
        - name: segment_deployments
          peer: ManagedSegmentDeployment
          kind: Generic
          cardinality: many
          identifier: "segmentdeployment__segment"
          order_weight: 9000
          description: "Per-deployment VNI allocations for this segment"

    - kind: TopologySegmentHosting
      relationships:
        - name: segment_deployments
          label: Segment Deployments
          peer: ManagedSegmentDeployment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segmentdeployment__deployment"
          order_weight: 7950
          description: "Per-DC/Metro VNI activations realized on this deployment"

    - kind: DcimPhysicalDevice
      relationships:
        - name: vlans
          label: Segment VLANs
          peer: ManagedSegmentVlan
          kind: Component
          cardinality: many
          optional: true
          on_delete: cascade
          identifier: "segmentvlan__device"
          order_weight: 7950
          description: "Segments locally realized on this switch, each with its VLAN ID (deleted with the switch)"

    - kind: OrganizationCustomer
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedNetworkSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "network_segment__owner"
          order_weight: 2200
          description: "VXLAN/cloud network segments owned by this customer"

    # Reverse lookup for VxlanSegment.customer_deployments / CloudNetworkSegment.customer_deployment (both share this
    # identifier) — lets a footprint find its own activated segments in one hop. Declared per kind, not on the
    # TopologyCustomer generic: the segments of a data center, a colocation and an office are VXLAN only and a cloud
    # footprint's are CloudNetworkSegment, so each peer is the concrete kind.
    - kind: TopologyCustomerDC
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VXLAN segments activated in this data center footprint"

    - kind: TopologyCustomerColocation
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VXLAN segments activated in this colocation footprint"

    - kind: TopologyCustomerCloud
      relationships:
        - name: network_segments
          label: Network Segments
          peer: CloudNetworkSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "Cloud network segments (subnets) of this cloud footprint"

    - kind: TopologyCustomerOffice
      relationships:
        - name: network_segments
          label: Network Segments
          peer: ManagedVxlanSegment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "segment__customer_deployments"
          order_weight: 2100
          description: "VXLAN segments activated in this office footprint"
