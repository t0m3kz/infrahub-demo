---
# Security Tags — one group tag per AppComponent of a microsegmented segment
#
# SecurityTag: the component's group (name = the component's fqdn) and its
#              fabric-wide group_id, drawn from the tag pool of the
#              DcimGroupPolicyProfile rows (SGT-POOL, 16-4095) by
#              AppApplicationGenerator (generators/helpers/security_tag.py).
#              Nothing assigns a tag by hand and no segment carries one.
#
# Contracts between the tags of one segment are derived from that segment's
# own SecurityPolicyRules (source_security_tag / destination_security_tag, in
# security.yml) by transforms/helpers/group_policy.py. They only matter for
# intra-segment (bridged) traffic: everything routed leaves through the
# segment's SVI and meets its ACL (isolation_mode: microsegmented).
version: "1.0"

nodes:
  - name: Tag
    namespace: Security
    description: "Group tag of one application component in a microsegmented segment (VXLAN group policy ID)"
    label: Security Tag
    icon: "mdi:tag-outline"
    include_in_menu: false
    menu_placement: SecurityZone
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        unique: true
        order_weight: 100
        description: "The fqdn of the component the tag was created for; a frozen label, never renamed"
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 200
      - name: group_id
        kind: Number
        label: Group ID
        optional: false
        unique: true
        order_weight: 300
        description: "Fabric-wide group policy ID, allocated from the group-policy profile's tag pool"
        parameters:
          min_value: 2
          max_value: 65535
      - name: color
        kind: Text
        label: Color
        optional: true
        order_weight: 400
        description: "Display color for UI (hex, e.g. #3498DB)"
    relationships:
      # Reverse side of AppComponent.security_tag (same identifier). Many, so
      # a tag shared by two components or left without one is visible to
      # checks/segment_security.py instead of being hidden by cardinality.
      - name: components
        peer: AppComponent
        label: Components
        cardinality: many
        kind: Generic
        optional: true
        order_weight: 1000
        identifier: app_component__security_tag
        description: "The component this tag groups (exactly one)"

extensions:
  nodes:
    - kind: AppComponent
      relationships:
        - name: security_tag
          peer: SecurityTag
          label: Security Tag
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 770
          identifier: app_component__security_tag
          description: "Group tag, set by the application generator while the component's segment is microsegmented"
