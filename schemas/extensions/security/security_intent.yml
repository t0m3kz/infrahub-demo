---
version: "1.0"

# SecurityIntentRule is an IP-first policy intent object.
# It can model classic IP rules, segment rules, label rules, or hybrid combinations.

nodes:
  - name: IntentRule
    namespace: Security
    description: "Unified security intent rule for IP, segment, label, or hybrid matching"
    label: Security Intent Rule
    icon: "mdi:shield-sync"
    include_in_menu: false
    menu_placement: SecurityZone
    order_by:
      - priority__value
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [policy, name__value]
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        unique: true
        order_weight: 100
      - name: match_mode
        kind: Dropdown
        label: Match Mode
        description: "Selector strategy: IP exact, IP prefix, segment, label, or hybrid"
        optional: false
        default_value: ip_exact
        order_weight: 200
        choices:
          - name: ip_exact
            label: IP Exact
          - name: ip_prefix
            label: IP Prefix
          - name: segment
            label: Segment
          - name: label
            label: Label
          - name: hybrid
            label: Hybrid
      - name: priority
        kind: Number
        label: Priority
        description: "Rule priority (lower number = higher priority)"
        optional: false
        default_value: 100
        order_weight: 300
      - name: action
        kind: Dropdown
        label: Action
        optional: false
        default_value: permit
        order_weight: 400
        choices:
          - name: permit
            label: Permit
          - name: deny
            label: Deny
          - name: drop
            label: Drop
          - name: reject
            label: Reject
      - name: protocol
        kind: Dropdown
        label: Protocol
        optional: false
        default_value: any
        order_weight: 500
        choices:
          - name: tcp
            label: TCP
          - name: udp
            label: UDP
          - name: icmp
            label: ICMP
          - name: any
            label: Any
      - name: port_start
        kind: Number
        label: Port Start
        optional: true
        order_weight: 600
        parameters:
          min_value: 1
          max_value: 65535
      - name: port_end
        kind: Number
        label: Port End
        optional: true
        order_weight: 700
        parameters:
          min_value: 1
          max_value: 65535
      - name: log
        kind: Boolean
        label: Log
        optional: true
        default_value: false
        order_weight: 800
      - name: enabled
        kind: Boolean
        label: Enabled
        optional: true
        default_value: true
        order_weight: 900
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 1000
    relationships:
      - name: policy
        peer: SecurityPolicy
        label: Policy
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 1100
        identifier: security_intent_rule__policy
      - name: security_profile
        peer: SecuritySecurityProfile
        label: Security Profile
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1200
      - name: source_zone
        peer: SecurityZone
        label: Source Zone
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1300
        identifier: security_intent_rule__source_zone
      - name: destination_zone
        peer: SecurityZone
        label: Destination Zone
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1400
        identifier: security_intent_rule__destination_zone
      - name: source_tag
        peer: SecurityTag
        label: Source Tag
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1500
        identifier: security_intent_rule__source_tag
      - name: destination_tag
        peer: SecurityTag
        label: Destination Tag
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1600
        identifier: security_intent_rule__destination_tag
      - name: source_segments
        peer: ManagedNetworkSegment
        label: Source Segments
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 1700
        identifier: security_intent_rule__source_segments
      - name: destination_segments
        peer: ManagedNetworkSegment
        label: Destination Segments
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 1800
        identifier: security_intent_rule__destination_segments
      - name: source_ip_addresses
        peer: IpamIPAddress
        label: Source IP Addresses
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 1900
        identifier: security_intent_rule__source_ips
      - name: destination_ip_addresses
        peer: IpamIPAddress
        label: Destination IP Addresses
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 2000
        identifier: security_intent_rule__destination_ips
      - name: source_prefixes
        peer: IpamPrefix
        label: Source Prefixes
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 2100
        identifier: security_intent_rule__source_prefixes
      - name: destination_prefixes
        peer: IpamPrefix
        label: Destination Prefixes
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 2200
        identifier: security_intent_rule__destination_prefixes
      - name: rendered_rules
        peer: SecurityPolicyRule
        label: Rendered Rules
        cardinality: many
        kind: Generic
        optional: true
        order_weight: 2300
        identifier: security_intent_rule__rendered_rules
        description: "Materialized policy rules generated from this intent"

extensions:
  nodes:
    - kind: SecurityPolicy
      relationships:
        - name: intent_rules
          peer: SecurityIntentRule
          label: Intent Rules
          cardinality: many
          kind: Generic
          optional: true
          order_weight: 2060
          identifier: security_intent_rule__policy
          description: "Intent-layer rules associated with this policy"

    - kind: ManagedNetworkSegment
      relationships:
        - name: intent_rules_as_source
          peer: SecurityIntentRule
          label: Intent Rules as Source
          cardinality: many
          kind: Generic
          optional: true
          order_weight: 930
          identifier: security_intent_rule__source_segments
          description: "Intent rules where this segment appears on the source side"
        - name: intent_rules_as_destination
          peer: SecurityIntentRule
          label: Intent Rules as Destination
          cardinality: many
          kind: Generic
          optional: true
          order_weight: 940
          identifier: security_intent_rule__destination_segments
          description: "Intent rules where this segment appears on the destination side"

    - kind: SecurityPolicyRule
      relationships:
        - name: rendered_from_intent
          peer: SecurityIntentRule
          label: Rendered From Intent
          cardinality: one
          kind: Attribute
          optional: true
          order_weight: 2550
          identifier: security_intent_rule__rendered_rules
          description: "Source intent rule that rendered this policy rule"
