---
# Reusable identity/access group referenced by ZTNA (private-access) publishing policies —
# same "shared named entity referenced by many" pattern as ProxyURLCategory. Deliberately
# NOT a real SAML/SCIM integration: external_id/source are just enough to track where the
# group name came from, not to federate identity.
version: "1.0"

nodes:
  - name: IdentityGroup
    namespace: Security
    description: "Reusable identity/access group (SAML/SCIM/local) referenced by ZTNA publishing policies"  # yamllint disable-line rule:line-length
    label: Identity Group
    icon: "mdi:account-group-outline"
    include_in_menu: false
    menu_placement: SecurityZone
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        unique: true
        order_weight: 100
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 200
      - name: source
        kind: Dropdown
        label: Source
        description: "Where this group name comes from — not a real identity federation, just provenance"  # yamllint disable-line rule:line-length
        optional: true
        default_value: manual
        order_weight: 300
        choices:
          - name: saml
            label: "SAML"
            color: "#3498DB"
          - name: scim
            label: "SCIM"
            color: "#2ECC71"
          - name: local
            label: "Local"
            color: "#95A5A6"
          - name: manual
            label: "Manual"
            color: "#F39C12"
      - name: external_id
        kind: Text
        label: "External Group ID"
        description: "IdP-side group object ID, if known"
        optional: true
        order_weight: 400
