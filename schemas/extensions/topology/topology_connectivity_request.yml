---
version: "1.0"

nodes:
  - name: ConnectivityRequest
    namespace: Topology
    description: >-
      Client request for inter-topology connectivity between two connectable locations
      (DC, Colo, Cloud, SaaS, Office)
    label: "Connectivity Request"
    icon: "mdi:connection"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 150
      - name: connectivity_type
        kind: Dropdown
        label: "Connectivity Type"
        order_weight: 200
        default_value: dci
        choices:
          - name: dci
            label: "DCI (DC / Colocation)"
            color: "#2980B9"
          - name: cloud_onramp
            label: "Cloud On-Ramp"
            color: "#27AE60"
          - name: saas_peering
            label: "SaaS Peering"
            color: "#16A085"
          - name: wan_access
            label: "WAN / Office Access"
            color: "#8E44AD"
      - name: bandwidth_mbps
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: true
        order_weight: 250
      - name: redundancy
        kind: Dropdown
        label: "Redundancy"
        default_value: dual
        optional: true
        order_weight: 300
        choices:
          - name: single
            label: "Single"
            color: "#F39C12"
          - name: dual
            label: "Dual (Primary / Secondary)"
            color: "#2ECC71"
      - name: status
        kind: Dropdown
        label: "Status"
        default_value: requested
        order_weight: 350
        choices:
          - name: requested
            label: "Requested"
            color: "#FFFF7F"
          - name: provisioning
            label: "Provisioning"
            color: "#74B9FF"
          - name: active
            label: "Active"
            color: "#7FBF7F"
          - name: failed
            label: "Failed"
            color: "#FF7F7F"
    relationships:
      - name: source
        label: "Source Location"
        peer: TopologyConnectableLocation
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "connectivity_request__source"
        order_weight: 1000
      - name: destination
        label: "Destination Location"
        peer: TopologyConnectableLocation
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "connectivity_request__destination"
        order_weight: 1100
      - name: owner
        label: "Customer / Owner"
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "connectivity_request__owner"
        order_weight: 1200
      - name: provider
        label: "Service Provider"
        peer: OrganizationProvider
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "connectivity_request__provider"
        order_weight: 1300
      - name: vrf
        label: "Routing VRF"
        peer: ManagedVRF
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: no-action
        identifier: "connectivity_request__vrf"
        order_weight: 1400
      - name: realized_circuits
        label: "Realized Circuits"
        peer: TopologyCircuit
        cardinality: many
        kind: Generic
        optional: true
        identifier: "connectivity_request__circuits"
        order_weight: 2000
