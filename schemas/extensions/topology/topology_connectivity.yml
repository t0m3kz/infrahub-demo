---
version: "1.0"

generics:
  - name: ConnectableLocation
    namespace: Topology
    description: "Topology location that can participate in circuit connectivity (physical or virtual)"
    label: "Connectable Location"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: circuits
        label: "Circuits"
        peer: TopologyCircuit
        cardinality: many
        kind: Generic
        optional: true
        identifier: "circuit__location"
        order_weight: 3000
        description: "Physical and virtual circuits terminating here"

  # A place a PHYSICAL circuit can terminate on: the facility itself, never a
  # pod, rack, metro, cloud zone or tenant footprint. Inherited alongside
  # TopologyConnectableLocation by DataCenter, ColocationZone, CloudRegion,
  # ExternalProviders, SaasRegion and CustomerOffice.
  - name: Facility
    namespace: Topology
    description: "A facility a physical circuit can terminate on"
    label: "Facility"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100

  - name: Circuit
    namespace: Topology
    description: "Point-to-point connectivity between two topology locations"
    label: "Circuit"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 200
      - name: status
        kind: Dropdown
        order_weight: 500
        default_value: provisioning
        choices:
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: maintenance
            label: Maintenance
            color: "#ffd27f"
          - name: down
            label: Down
            color: "#ff7f7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
    relationships:
      - name: provider
        peer: OrganizationProvider
        cardinality: one
        optional: false
        identifier: "circuit__provider"
        order_weight: 1000
        description: "Service provider for this connectivity"

      # `locations` is declared on each node, not here: an inherited
      # relationship's peer cannot be narrowed, and a physical circuit ends
      # on a TopologyFacility while a virtual one may end on a footprint.
      - name: owner
        label: "Customer"
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "circuit__owner"
        order_weight: 3100
        description: "Customer this circuit belongs to; unset for shared/backbone circuits"

  # The connection between topologies on which ROUTING is generated or recorded. A physical circuit is
  # only the carrier (fibre, cross-connect, internet); the role of a virtual circuit is its KIND:
  #   TunnelCircuit       office edge <-> SD-WAN gateway; inventory record, the orchestrator owns the routing
  #   InterconnectCircuit DCI between two EVPN Multi-Site border gateways; an eBGP underlay + EVPN session
  #   HandoffCircuit      our edge <-> a party-owned device inside one environment namespace; an eBGP session
  # The session generator reads Interconnect and Handoff circuits; it builds the ManagedBGPPeerings.
  # Carries nothing of its own: name, description, status, provider and the optional owner come from the
  # generics below. `locations` is declared on each node (an inherited peer cannot be narrowed).
  #
  # ManagedGenericInterfaces puts a circuit into a terminating interface's `capabilities` list, alongside
  # RoutingOSPFInterface, ManagedVxlanSegment and TopologyExchangeGateway: the one uniform way in this
  # schema to ask "what is this port doing", and the edge a walk outward from a changed interface follows.
  # The physical circuit uses the same edge with exactly two ends; a virtual circuit leaves it uncapped
  # because a tunnel port carries several circuits. The underlay is the physical circuits on these ports
  # (each port's own `capabilities`); there is no separate overlay-to-underlay mapping to keep in step.
  - name: VirtualCircuit
    namespace: Topology
    description: "Connection between topologies on which routing is generated (SD-WAN, cloud services, DCI)"
    label: "Virtual Circuit"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    attributes:
      - name: name
        kind: Text
        order_weight: 100

nodes:
  - name: PhysicalCircuit
    namespace: Topology
    description: "Physical connectivity circuit (dark fiber, cross connect, metro ethernet, etc.)"
    label: "Physical Circuit"
    icon: "mdi:transit-connection-variant"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - ManagedGenericInterfaces
    human_friendly_id:
      - circuit_id__value
    display_label: "{{ circuit_id__value }} - {{ provider__name__value }}"
    uniqueness_constraints:
      - [circuit_id__value]
    attributes:
      - name: circuit_id
        kind: Text
        label: "Circuit ID"
        description: "Provider circuit identifier"
        order_weight: 50

      - name: bandwidth
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: true
        order_weight: 400
        description: "Link bandwidth in megabits per second"

      - name: circuit_type
        kind: Dropdown
        label: "Circuit Type"
        order_weight: 300
        choices:
          - name: internet
            label: "Internet Underlay"
            description: "Logical physical-underlay for public internet delivery"
            color: "#f39c12"
          - name: dark_fiber
            label: "Dark Fiber"
            description: "Unlit fiber optic circuit"
            color: "#2c3e50"
          - name: cross_connect
            label: "Cross Connect"
            description: "Physical cross-connect within facility"
            color: "#3498db"
          - name: metro_ethernet
            label: "Metro Ethernet"
            description: "Layer 2 metro Ethernet service"
            color: "#9b59b6"
          - name: mpls
            label: "MPLS"
            description: "MPLS VPN circuit"
            color: "#e74c3c"
          - name: dia
            label: "DIA"
            description: "Dedicated Internet Access"
            color: "#f39c12"
          - name: wavelength
            label: "Wavelength"
            description: "DWDM wavelength service"
            color: "#1abc9c"

    relationships:
      # Data authors only the end that cannot be derived (the colocation cage);
      # add_circuit adds each endpoint device's deployment that is a facility
      # (DC, ISP, cloud region). So one location is valid on load: no min_count.
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyFacility
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Facilities where this circuit terminates"

      # Re-declares ManagedGenericInterfaces.capabilities with a count. The cap holds when the
      # circuit side is written; checks/physical_circuit_ports.py holds it for interface-side writes.
      - name: capabilities
        peer: DcimInterface
        label: "Ends"
        kind: Generic
        cardinality: many
        optional: false
        min_count: 2
        max_count: 2
        identifier: interface_capabilities
        order_weight: 1100
        description: "The two ports this circuit terminates on, one at each end"

  # Ends on the gateway's public port (eth1) and the edge uplink. No session is generated: the VeloCloud
  # orchestrator owns the overlay routing, so this is an inventory record. Owner = the office's owner.
  - name: TunnelCircuit
    namespace: Topology
    description: "Office edge to SD-WAN gateway tunnel, owned by the office; inventory only, no session generated"
    label: "Tunnel Circuit"
    icon: "mdi:shield-link-variant"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - TopologyVirtualCircuit
      - ManagedGenericInterfaces
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    relationships:
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyConnectableLocation
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Footprints where this tunnel terminates (the office and the gateway's facility)"

  # DCI between two EVPN Multi-Site border gateways (DC border leafs and colocation edges). The session
  # generator builds an underlay eBGP session on a /31 (peering_role dci-underlay) and a loopback-to-loopback
  # EVPN session (peering_role dci) over it.
  - name: InterconnectCircuit
    namespace: Topology
    description: "DCI between two EVPN Multi-Site border gateways, unowned; underlay and EVPN sessions generated"
    label: "Interconnect Circuit"
    icon: "mdi:swap-horizontal-bold"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - TopologyVirtualCircuit
      - ManagedGenericInterfaces
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    relationships:
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyFacility
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Facilities where this interconnect terminates"

  # Our edge sub-interface <-> a party-owned device sub-interface (cloud on-ramp, SD-WAN gateway LAN handoff,
  # Equinix or Megaport provider) inside ONE environment namespace; an eBGP session is generated. An Equinix
  # Fabric or Megaport service is just a handoff whose provider is Equinix or Megaport, not a separate kind.
  #
  # Addressing: cloud and provider side addresses come from OUR per-environment /31 pool only. For AWS Direct
  # Connect the customer specifies the peer IPs and the provider assigns none; there is no provider-assigned
  # (169.254) mode and no authored-address mode.
  # The remote ASN lives in the party device's ManagedBGP.local_as; the VLAN lives in the sub-interface name.
  - name: HandoffCircuit
    namespace: Topology
    description: "Edge to party-owned handoff in one namespace; peer IPs from our /31 pool only; routing generated"
    label: "Handoff Circuit"
    icon: "mdi:cloud-sync"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - TopologyVirtualCircuit
      - ManagedGenericInterfaces
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: maximum_routes
        kind: Number
        label: "Maximum Routes"
        optional: true
        order_weight: 600
        description: "Accepted-prefix limit of the session"
    relationships:
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyFacility
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Facilities where this handoff terminates (both ends may sit in one facility, e.g. the cage)"

      - name: ip_namespace
        label: "IP Namespace"
        peer: IpamNamespace
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "handoff_circuit__ip_namespace"
        order_weight: 1200
        description: "Environment namespace in which the /31 is allocated and the session runs"

      - name: password
        label: "Password"
        peer: RoutingPassword
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "handoff_circuit__password"
        order_weight: 1300
        description: "Shared authentication key of the session (optional)"

      # The reverse side, CloudHybridAttachment.virtual_circuit, is declared in topology_cloud_network.yml.
      - name: cloud_endpoint
        label: "Cloud Endpoint"
        peer: CloudHybridAttachment
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "handoff_circuit__cloud_endpoint"
        order_weight: 1400
        description: "Cloud-side termination of this handoff (a VIF or VPN gateway); one endpoint has one handoff"
