---
version: "1.0"

generics:
  - name: ConnectableLocation
    namespace: Topology
    description: "Topology location that can participate in circuit connectivity (physical or virtual)"
    label: "Connectable Location"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: circuits
        label: "Circuits"
        peer: TopologyCircuit
        cardinality: many
        kind: Generic
        optional: true
        identifier: "circuit__location"
        order_weight: 3000
        description: "Physical and virtual circuits terminating here"

  # A place a PHYSICAL circuit can terminate on: the facility itself, never a
  # pod, rack, metro, cloud zone or tenant footprint. Inherited alongside
  # TopologyConnectableLocation by DataCenter, ColocationZone, CloudRegion,
  # ExternalProviders, SaasRegion and CustomerOffice.
  - name: Facility
    namespace: Topology
    description: "A facility a physical circuit can terminate on"
    label: "Facility"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100

  - name: Circuit
    namespace: Topology
    description: "Point-to-point connectivity between two topology locations"
    label: "Circuit"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 200
      - name: bandwidth
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: true
        order_weight: 400
        description: "Link bandwidth in megabits per second"
      - name: status
        kind: Dropdown
        order_weight: 500
        default_value: provisioning
        choices:
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: maintenance
            label: Maintenance
            color: "#ffd27f"
          - name: down
            label: Down
            color: "#ff7f7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
    relationships:
      - name: provider
        peer: OrganizationProvider
        cardinality: one
        optional: false
        identifier: "circuit__provider"
        order_weight: 1000
        description: "Service provider for this connectivity"

      # `locations` is declared on each node, not here: an inherited
      # relationship's peer cannot be narrowed, and a physical circuit ends
      # on a TopologyFacility while a virtual one may end on a footprint.
      - name: owner
        label: "Customer"
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "circuit__owner"
        order_weight: 3100
        description: "Customer this circuit belongs to; unset for shared/backbone circuits"

nodes:
  - name: PhysicalCircuit
    namespace: Topology
    description: "Physical connectivity circuit (dark fiber, cross connect, metro ethernet, etc.)"
    label: "Physical Circuit"
    icon: "mdi:transit-connection-variant"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - ManagedGenericInterfaces
    human_friendly_id:
      - circuit_id__value
    display_label: "{{ circuit_id__value }} - {{ provider__name__value }}"
    uniqueness_constraints:
      - [circuit_id__value]
    attributes:
      - name: circuit_id
        kind: Text
        label: "Circuit ID"
        description: "Provider circuit identifier"
        order_weight: 50

      - name: circuit_type
        kind: Dropdown
        label: "Circuit Type"
        order_weight: 300
        choices:
          - name: internet
            label: "Internet Underlay"
            description: "Logical physical-underlay for public internet delivery"
            color: "#f39c12"
          - name: dark_fiber
            label: "Dark Fiber"
            description: "Unlit fiber optic circuit"
            color: "#2c3e50"
          - name: cross_connect
            label: "Cross Connect"
            description: "Physical cross-connect within facility"
            color: "#3498db"
          - name: metro_ethernet
            label: "Metro Ethernet"
            description: "Layer 2 metro Ethernet service"
            color: "#9b59b6"
          - name: mpls
            label: "MPLS"
            description: "MPLS VPN circuit"
            color: "#e74c3c"
          - name: dia
            label: "DIA"
            description: "Dedicated Internet Access"
            color: "#f39c12"
          - name: wavelength
            label: "Wavelength"
            description: "DWDM wavelength service"
            color: "#1abc9c"

      # Set explicitly, never derived from circuit_type: the same dark fibre
      # can be a DCI or a plain underlay hop. add_circuit (generators/topology/
      # circuit.py) builds the BGP session for `dci`; `underlay` and `transit`
      # are accepted but not generated yet.
      - name: peering_role
        kind: Dropdown
        label: "Peering Role"
        description: "BGP session add_circuit builds over this circuit's two endpoints (none = no session)"
        optional: true
        default_value: none
        order_weight: 350
        choices:
          - name: none
            label: "None"
            description: "No generated BGP session"
            color: "#bfbfbf"
          - name: underlay
            label: "Underlay"
            description: "Directly connected underlay session (not generated yet)"
            color: "#74b9ff"
          - name: dci
            label: "DCI"
            description: "EVPN Multi-Site DCI session between the border gateways at each end, on a P2P from the DCI pool"  # yamllint disable-line rule:line-length
            color: "#a29bfe"
          - name: transit
            label: "Transit"
            description: "IP transit session to the provider (not generated yet)"
            color: "#fdcb6e"

    relationships:
      # Data authors only the end that cannot be derived (the colocation cage);
      # add_circuit adds each endpoint device's deployment that is a facility
      # (DC, ISP, cloud region). So one location is valid on load: no min_count.
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyFacility
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Facilities where this circuit terminates"

      # Re-declares ManagedGenericInterfaces.capabilities with a count. The cap holds when the
      # circuit side is written; checks/physical_circuit_ports.py holds it for interface-side writes.
      - name: capabilities
        peer: DcimInterface
        label: "Ends"
        kind: Generic
        cardinality: many
        optional: false
        min_count: 2
        max_count: 2
        identifier: interface_capabilities
        order_weight: 1100
        description: "The two ports this circuit terminates on, one at each end"

  - name: VirtualCircuit
    namespace: Topology
    description: "Virtual/overlay connectivity (VPN, cloud interconnect, SD-WAN, etc.)"
    label: "Virtual Circuit"
    icon: "mdi:cloud-sync"
    include_in_menu: false
    # ManagedGenericInterfaces puts this circuit into a terminating interface's `capabilities` list,
    # alongside RoutingOSPFInterface, ManagedVxlanSegment and TopologyExchangeGateway: the one uniform way in this
    # schema to ask "what is this port doing", and the edge a walk outward from a changed interface follows. The
    # physical circuit uses the same edge with exactly two ends; a virtual circuit leaves it uncapped because a
    # tunnel port carries several circuits.
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - ManagedGenericInterfaces
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }} ({{ link_type__value|upper }})"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: link_type
        kind: Dropdown
        label: "Link Type"
        order_weight: 300
        choices:
          - name: vpn_ipsec
            label: "IPsec VPN"
            description: "IPsec encrypted VPN tunnel"
            color: "#e74c3c"
          - name: vpn_ssl
            label: "SSL VPN"
            description: "SSL/TLS VPN connection"
            color: "#c0392b"
          - name: gre
            label: "GRE Tunnel"
            description: "Generic Routing Encapsulation"
            color: "#95a5a6"
          - name: vxlan
            label: "VXLAN"
            description: "Virtual Extensible LAN"
            color: "#3498db"
          - name: geneve
            label: "GENEVE"
            description: "Generic Network Virtualization Encapsulation"
            color: "#2980b9"
          - name: mpls_l3vpn
            label: "MPLS L3VPN"
            description: "MPLS Layer 3 VPN"
            color: "#e67e22"
          - name: direct_connect_aws
            label: "AWS Direct Connect"
            description: "AWS Direct Connect"
            color: "#ff9900"
          - name: express_route_azure
            label: "Azure ExpressRoute"
            description: "Azure ExpressRoute"
            color: "#0078d4"
          - name: interconnect_gcp
            label: "GCP Cloud Interconnect"
            description: "Google Cloud Interconnect"
            color: "#4285f4"
          - name: fast_connect_oracle
            label: "Oracle FastConnect"
            description: "Oracle Cloud FastConnect"
            color: "#f80000"
          - name: sd_wan
            label: "SD-WAN"
            description: "Software-Defined WAN"
            color: "#9b59b6"
          - name: equinix_fabric
            label: "Equinix Fabric"
            description: "Equinix Fabric Virtual Connection"
            color: "#e30613"
          - name: megaport
            label: "Megaport"
            description: "Megaport Virtual Cross Connect"
            color: "#0066cc"
          - name: packetfabric
            label: "PacketFabric"
            description: "PacketFabric Virtual Circuit"
            color: "#00a0df"
          - name: console_connect
            label: "Console Connect"
            description: "PCCW Console Connect"
            color: "#ff6600"

      # Set explicitly, never derived from link_type. add_virtual_circuit
      # (generators/topology/circuit.py) builds the eBGP session for `overlay`
      # on a tunnel link type, over the endpoints' existing addresses.
      - name: peering_role
        kind: Dropdown
        label: "Peering Role"
        description: "BGP session add_virtual_circuit builds over this circuit's two endpoints (none = no session)"
        optional: true
        default_value: none
        order_weight: 350
        choices:
          - name: none
            label: "None"
            description: "No generated BGP session"
            color: "#bfbfbf"
          - name: overlay
            label: "Overlay"
            description: "eBGP session across the tunnel, between the two endpoint devices"
            color: "#fd79a8"

      - name: encryption
        kind: Boolean
        label: "Encrypted"
        optional: true
        default_value: false
        order_weight: 410

      - name: vni
        kind: Number
        optional: true
        order_weight: 420
        description: "VXLAN Network Identifier (if applicable)"

      - name: tunnel_id
        kind: Number
        optional: true
        order_weight: 430
        description: "Tunnel ID (for GRE/IPSec, if applicable)"

      - name: transport_mode
        kind: Dropdown
        label: "Transport Mode"
        optional: true
        order_weight: 650
        description: "How this virtual circuit is carried: internet-only, physical-underlay-backed, or provider-managed"
        choices:
          - name: internet_backed
            label: "Internet-backed"
            description: "Overlay over public internet; no dedicated physical circuit required"
            color: "#f39c12"
          - name: physical_backed
            label: "Physical-underlay-backed"
            description: "Overlay bound to one or more physical circuits"
            color: "#3498db"
          - name: provider_virtual_only
            label: "Provider virtual-only"
            description: "Provider-managed virtual service without customer-visible local physical endpoint"
            color: "#9b59b6"

    relationships:
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyConnectableLocation
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Footprints or facilities where this circuit terminates"

      # capabilities (many DcimInterface, via ManagedGenericInterfaces)
      # — the A/Z (or more) technical interfaces this circuit terminates on. The underlay is the
      # physical circuits on these ports (each port's own `capabilities`); there is no separate
      # overlay-to-underlay mapping to keep in step.
