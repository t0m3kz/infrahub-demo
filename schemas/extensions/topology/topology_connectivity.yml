---
version: "1.0"

generics:
  - name: ConnectableLocation
    namespace: Topology
    description: "Topology location that can participate in circuit connectivity (carrier or session)"
    label: "Connectable Location"
    include_in_menu: false
    relationships:
      - name: circuits
        label: "Circuits"
        peer: TopologyCircuit
        cardinality: many
        kind: Generic
        optional: true
        identifier: "circuit__location"
        order_weight: 3000
        description: "Carrier and session circuits terminating here"

  # A place a CARRIER circuit can terminate on: the facility itself, never a
  # pod, rack, metro, cloud zone or tenant footprint. Inherited alongside
  # TopologyConnectableLocation by DataCenter, ColocationZone, CloudRegion,
  # SaasRegion and CustomerOffice.
  - name: Facility
    namespace: Topology
    description: "A facility a carrier circuit can terminate on"
    label: "Facility"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100

  # The provider side of a routed leg, on the connector. OUR side is not here: our address is the sub-interface of the
  # session circuit (allocated from Handoff-<ip_namespace>-IPv4) and our AS is the local_as of our ManagedBGP (a private
  # AS from PRIVATE-ASN32 when the provider needs one).
  - name: ConnectorRouting
    namespace: Topology
    description: "Provider-side address and AS of a routed leg"
    label: "Connector Routing"
    include_in_menu: false
    relationships:
      - name: peer_ip
        label: "Provider Address"
        peer: IpamIPAddress
        cardinality: one
        kind: Attribute
        optional: true
        identifier: connector_routing__peer_ip
        order_weight: 2100
        description: "The provider's address on the link range of the leg (the other end of our sub-interface)"
      - name: peer_asn
        label: "Provider AS"
        peer: RoutingAutonomousSystem
        cardinality: one
        kind: Attribute
        optional: true
        identifier: connector_routing__peer_asn
        order_weight: 2150
        description: "The AS the provider speaks with on this leg"

  - name: Circuit
    namespace: Topology
    description: "Point-to-point connectivity between two topology locations"
    label: "Circuit"
    include_in_menu: false
    attributes:
      - name: description
        kind: Text
        optional: true
        order_weight: 200
      - name: status
        kind: Dropdown
        order_weight: 250
        default_value: provisioning
        choices:
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: maintenance
            label: Maintenance
            color: "#ffd27f"
          - name: down
            label: Down
            color: "#ff7f7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
    relationships:
      - name: provider
        peer: OrganizationProvider
        cardinality: one
        optional: false
        identifier: "circuit__provider"
        order_weight: 1000
        description: "Service provider for this connectivity"

      # Data authors only the end that cannot be derived (the colocation cage); add_circuit adds each
      # endpoint device's deployment that is a facility (DC, or the region of an appliance end; a provider's own
      # router has none). So one location is valid on load: no min_count (it is enforced on update only; the checks
      # hold the count).
      - name: locations
        label: "Endpoint Locations"
        peer: TopologyFacility
        cardinality: many
        max_count: 2
        optional: false
        identifier: "circuit__location"
        order_weight: 3000
        description: "Facilities where this circuit terminates (both ends may sit in one facility, e.g. the cage)"

nodes:
  # The carrier: fibre, cross-connect, internet access, or a provider-delivered virtual connection. It
  # is the underlay a session circuit rides on, never a routing role. Carries no session and no routing.
  - name: CarrierCircuit
    namespace: Topology
    description: "Carrier circuit (dark fiber, cross connect, internet access, virtual connection, metro ethernet)"
    label: "Carrier Circuit"
    icon: "mdi:transit-connection-variant"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - ManagedGenericInterfaces
    human_friendly_id:
      - circuit_id__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [circuit_id__value]
    attributes:
      - name: circuit_id
        kind: Text
        label: "Circuit ID"
        description: >-
          Provider circuit ID; for a virtual_connection the Fabric connection uuid or the Megaport VXC
          product_uid
        order_weight: 110

      - name: circuit_type
        kind: Dropdown
        label: "Circuit Type"
        order_weight: 300
        choices:
          - name: internet
            label: "Internet Underlay"
            description: "Logical physical-underlay for public internet delivery"
            color: "#f39c12"
          - name: dark_fiber
            label: "Dark Fiber"
            description: "Unlit fiber optic circuit"
            color: "#2c3e50"
          - name: cross_connect
            label: "Cross Connect"
            description: "Physical cross-connect within facility"
            color: "#3498db"
          - name: virtual_connection
            label: "Virtual Connection"
            description: >-
              Provider-delivered layer 2 service riding provider ports (mirrors an Equinix Fabric connection or a
              Megaport VXC); a provider port hosts one per VLAN tag, which lives per end, not on the circuit
            color: "#9b59b6"
          - name: metro_ethernet
            label: "Metro Ethernet"
            description: "Carrier E-Line service (mirrors an MEF EPL or EVPL)"
            color: "#16a085"

      - name: bandwidth
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: true
        order_weight: 400
        description: >-
          Link or connection bandwidth in megabits per second (mirrors the Fabric bandwidth and the Megaport
          rate_limit)

      - name: term_length
        kind: Number
        label: "Term Length (months)"
        optional: true
        order_weight: 450
        description: >-
          Term in months, as CloudNetworkAppliance.term_length (mirrors Megaport contract_term_months, an ISP
          term)

      - name: commit_rate
        kind: Number
        label: "Committed Rate (Mbps)"
        optional: true
        order_weight: 500
        description: >-
          Committed information rate in megabits per second (an ISP or MEF CIR; Equinix Fabric and Megaport
          have none)

      - name: redundancy_group
        kind: Text
        label: "Redundancy Group"
        optional: true
        order_weight: 550
        description: >-
          Connections sharing a value are a primary/secondary pair (mirrors Fabric redundancy.group); the name
          tells which
    relationships:
      # The two ends. ManagedGenericInterfaces carries the interface-side edge (a circuit in a port's `capabilities`);
      # this re-declares the circuit side with a count. It cannot be hoisted onto TopologyCircuit: a node that
      # inherits two generics declaring `capabilities` with a different min_count is refused (measured on 1.11.9).
      # The cap holds when the circuit side is written; checks/carrier_circuit_ports.py and
      # checks/circuit_placement.py hold the rest. A cloud transport is a device of its own (CloudDirectConnect,
      # CloudVPNConnection) whose ports, LAGs and virtual interfaces are DcimInterface, so the far end of a cloud
      # circuit is an interface on this same edge.
      - name: capabilities
        peer: DcimInterface
        label: "Interface Ends"
        kind: Generic
        cardinality: many
        optional: false
        min_count: 1
        max_count: 2
        identifier: interface_capabilities
        order_weight: 1100
        description: "The interface ends of this circuit: two ports (ours and the far device's, a cloud transport's included)"  # yamllint disable-line rule:line-length

  # One kind for every circuit that rides a carrier, told apart by `circuit_type` (the role is an attribute,
  # not a kind). The session generator builds the ManagedBGPPeerings of dci and handoff; a tunnel is an
  # inventory record. What each type may carry is held by checks/circuit_placement.py, not by the schema:
  #   dci      DCI between two EVPN Multi-Site border gateways (DC border leafs and colocation edges); the
  #            generator builds an underlay eBGP session on a /31 or /127 (peering_role dci-underlay) and a
  #            loopback-to-loopback EVPN session (peering_role dci) over it. Unowned.
  #   handoff  Our edge sub-interface <-> a party-owned device sub-interface (cloud on-ramp, SD-WAN gateway
  #            LAN handoff, Equinix or Megaport provider) inside ONE security zone; an eBGP session is
  #            generated. Unowned. An Equinix Fabric or Megaport service is a handoff whose provider is Equinix
  #            or Megaport. Cloud and provider side addresses come from OUR per-environment /31 pool only; for
  #            AWS Direct Connect the customer specifies the peer IPs and the provider assigns none. The
  #            remote ASN lives in the party device's ManagedBGP.local_as; the VLAN in the sub-interface name.
  #   tunnel   Office edge <-> SD-WAN gateway (eth1), and the partner tunnel. No session is generated (the
  #            VeloCloud orchestrator owns the overlay routing). Owner = the office's owner.
  - name: SessionCircuit
    namespace: Topology
    description: "Circuit that rides carriers: a DCI, a handoff or a vpn with generated routing, or a tunnel kept as inventory"  # yamllint disable-line rule:line-length
    label: "Session Circuit"
    icon: "mdi:swap-horizontal-bold"
    include_in_menu: false
    inherit_from:
      - TopologyCircuit
      - ManagedGeneric
      - ManagedGenericInterfaces
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: circuit_type
        kind: Dropdown
        label: "Circuit Type"
        order_weight: 300
        description: "The role of the circuit: dci, handoff, tunnel or vpn"
        choices:
          - name: dci
            label: "DCI"
            description: >-
              Interconnect between two EVPN Multi-Site border gateways, unowned; underlay and EVPN sessions
              generated
            color: "#2980b9"
          - name: handoff
            label: "Handoff"
            description: >-
              Edge to party-owned handoff in one security zone, unowned; peer IPs from our /31 pool only; routing
              generated
            color: "#27ae60"
          - name: tunnel
            label: "Tunnel"
            description: >-
              Office edge to SD-WAN gateway tunnel, owned by the office; inventory only, no session generated
            color: "#8e44ad"
          - name: vpn
            label: "VPN"
            description: >-
              Routing session over a tunnel interface pair to a provider VPN gateway, riding an internet carrier
            color: "#d35400"

    relationships:
      # The two ends. ManagedGenericInterfaces carries the interface-side edge (a circuit in a port's `capabilities`);
      # this re-declares the circuit side with a count. It cannot be hoisted onto TopologyCircuit: a node that
      # inherits two generics declaring `capabilities` with a different min_count is refused (measured on 1.11.9).
      # The cap holds when the circuit side is written; checks/carrier_circuit_ports.py and
      # checks/circuit_placement.py hold the rest. A cloud transport is a device of its own (CloudDirectConnect,
      # CloudVPNConnection) whose ports, LAGs and virtual interfaces are DcimInterface, so the far end of a cloud
      # circuit is an interface on this same edge.
      - name: capabilities
        peer: DcimInterface
        label: "Interface Ends"
        kind: Generic
        cardinality: many
        optional: false
        min_count: 1
        max_count: 2
        identifier: interface_capabilities
        order_weight: 1100
        description: "The interface ends of this circuit: two ports (ours and the far device's, a cloud transport's included)"  # yamllint disable-line rule:line-length

      # The same concept as TopologyCustomerOffice.lan_prefixes (a PROD prefix a customer registers behind the
      # SD-WAN gateway, so the gateway's border session accepts it), for space the tunnel reaches that no office
      # of ours hosts: a B2B partner's extranet range.
      - name: registered_prefixes
        label: "Registered Prefixes"
        peer: IpamPrefix
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "tunnel_circuit__registered_prefixes"
        order_weight: 1150
        description: "PROD prefixes reachable behind the tunnel's far end, owned by the tunnel's owner (tunnel only)"

      - name: vrf
        label: "Routing VRF"
        peer: ManagedVRF
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: no-action
        identifier: "session_circuit__vrf"
        order_weight: 1200
        description: "Our-side routing/export instance; provider endpoints retain their native routing context"

      - name: originated_prefixes
        label: "Originated Prefixes"
        peer: IpamPrefix
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "session_circuit__originated_prefixes"
        order_weight: 1250
        description: "Explicit locally originated public space for upstream export; not public-service reachability"

      - name: password
        label: "Password"
        peer: RoutingPassword
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "handoff_circuit__password"
        order_weight: 1300
        description: "Shared authentication key of the session (handoff only, optional)"

      # The provider-handed link range (a /30 the provider assigns, never allocated from our pools) the session
      # runs on. Schema stage: the generator that writes it and the check that reads it follow.
      - name: link_prefix
        label: "Link Prefix"
        peer: IpamPrefix
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "session_circuit__link_prefix"
        order_weight: 1450
        description: "The link range the provider handed this session (vpn, or a provider-assigned handoff)"
