---
version: "1.0"
generics:
  - name: Deployment
    namespace: Topology
    include_in_menu: false
    hierarchical: true
    label: Topology Deployment
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    order_by: [name__value]
    attributes:
      - name: name
        kind: Text
        order_weight: 100


  - name: PhysicalDeployment
    namespace: Topology
    description: "Physical infrastructure deployments with cabling"
    include_in_menu: false
    label: Physical Deployment
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: cables
        peer: DcimCable
        kind: Generic
        cardinality: many
        identifier: "physical_deployment__cables"
        order_weight: 2000
        on_delete: cascade

  - name: RackHosting
    namespace: Topology
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: racks
        peer: LocationRack
        kind: Generic
        cardinality: many
        identifier: "rack__pod"
        order_weight: 1200
        on_delete: cascade

  - name: DeviceHosting
    namespace: Topology
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: naming_convention
        label: "Naming Convention"
        description: "Device naming convention for devices created under this deployment"
        kind: Dropdown
        optional: true
        default_value: standard
        order_weight: 1050
        choices:
          - name: standard
            label: "Standard"
            description: "role-dcNN..N, role code first, then dc + concatenated location indexes (e.g. lf-dc11312401)"
            color: "#7FBF7F"
          - name: hierarchical
            label: "Hierarchical"
            description: "dc.N.roleNN, dot-separated numeric path (e.g. dc1.2.lf01)"
            color: "#7F7FBF"
          - name: flat
            label: "Flat"
            description: "dcNroleNN, no separators (e.g. dc12lf01)"
            color: "#BF7FBF"
          - name: computed
            label: "Computed"
            description: "dc-roleNNNN, fixed-width digit run instead of a labeled path (e.g. dc1-lf0201)"
            color: "#BFBF7F"
    relationships:
      - name: devices
        peer: DcimDevice
        kind: Generic
        cardinality: many
        identifier: "topology__devices"
        order_weight: 1200
        on_delete: cascade

  - name: ClusterHosting
    namespace: Topology
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: clusters
        peer: VirtCluster
        label: "Virtualisation Clusters"
        description: "Clusters hosted in this deployment."
        kind: Generic
        cardinality: many
        identifier: "virt_cluster__deployment"
        order_weight: 1300

  - name: SegmentHosting
    namespace: Topology
    description: "VLAN/VNI pools for network segments activated in this deployment"
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: vlan_pool
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "segment_hosting__vlan_pool"
        order_weight: 7300
        on_delete: cascade
        description: "VLAN ID pool for this deployment. Allocated per-segment by add_segment generator."  # yamllint disable-line rule:line-length

      - name: vni_pool
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "segment_hosting__vni_pool"
        order_weight: 7400
        on_delete: cascade
        description: "L2 VNI pool for this deployment. Used when segment.vni is null and overlay is VXLAN-EVPN."  # yamllint disable-line rule:line-length

      - name: l3_vni_pool
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "segment_hosting__l3_vni_pool"
        order_weight: 7500
        on_delete: cascade
        description: "L3 VNI pool for VRF allocation. Used when namespace.l3_vni is null."

nodes:
  - name: Label
    namespace: Topology
    description: "A deployment footprint for a customer or internal use."
    label: "Topology Deployment"
    icon: "carbon:network-3-reference"
    menu_placement: TopologyGeneric
    include_in_menu: false
    generate_template: false
    children: ""
    inherit_from:
      - TopologyDeployment

extensions:
  nodes:
    - kind: DcimPhysicalDevice
      relationships:
        - name: deployment
          peer: TopologyDeployment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: DcimVirtualDevice
      relationships:
        - name: deployment
          peer: TopologyDeployment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: ManagedControllerPhysical
      relationships:
        - name: deployment
          peer: TopologyDeployment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: ManagedControllerVirtual
      relationships:
        - name: deployment
          peer: TopologyDeployment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: DcimCable
      relationships:
        - name: deployment
          peer: TopologyPhysicalDeployment
          cardinality: one
          optional: true
          kind: Attribute
          order_weight: 2000
          identifier: "physical_deployment__cables"
