---
version: "1.0"
generics:
  - name: Deployment
    namespace: Topology
    include_in_menu: false
    hierarchical: true
    label: Topology Deployment
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    order_by: [name__value]
    attributes:
      - name: name
        kind: Text
        order_weight: 100


  - name: PhysicalDeployment
    namespace: Topology
    description: "Physical infrastructure deployments with cabling"
    include_in_menu: false
    label: Physical Deployment
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: cables
        peer: DcimCable
        kind: Generic
        cardinality: many
        identifier: "physical_deployment__cables"
        order_weight: 2000
        on_delete: cascade

  - name: RackHosting
    namespace: Topology
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: racks
        peer: LocationRack
        kind: Generic
        cardinality: many
        identifier: "rack__deployment"
        order_weight: 1150
        on_delete: cascade

  - name: DeviceHosting
    namespace: Topology
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: devices
        peer: DcimDevice
        kind: Generic
        cardinality: many
        identifier: "topology__devices"
        order_weight: 1200
        on_delete: cascade

  # Where a provider-hosted network function (a CloudNetworkAppliance) can be deployed: the virtual colocation it is
  # rented in, or the cloud footprint of a customer. A relationship peer, so it carries a name and an hfid as
  # DeviceHosting does. Not DeviceHosting: a deployment of this kind has no physical or virtual device of ours, only
  # what the provider hosts for us, so its link is typed to the appliance and not to any DcimDevice.
  - name: ProviderHosting
    namespace: Topology
    description: "Deployment in which a provider-hosted network function is rented"
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: appliances
        peer: CloudNetworkAppliance
        kind: Generic
        cardinality: many
        identifier: "topology__appliances"
        order_weight: 1200
        on_delete: cascade

  # The provider account a provider-hosted presence's appliances are ordered under: its account_id is the billing
  # account number, its provider the operator, and its owner's notification_emails receive the provider's order
  # notices. One declaration for every provider-hosted presence (a virtual colocation, a SaaS region). Not on
  # ProviderHosting: a customer cloud is hosted too, but its accounts are the CloudAccounts it is built from.
  # Optional because only a presence routed to terraform needs it (checks/colocation_placement.py).
  - name: ProviderAccount
    namespace: Topology
    description: "Deployment whose provider-hosted appliances are ordered under one provider account"
    include_in_menu: false
    relationships:
      - name: account
        peer: CloudAccount
        label: "Provider Account"
        description: "The account of the provider the presence's appliances are ordered under"
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1050
        identifier: "topology__provider_account"

  # Where a customer's cloud compute runs: the cloud footprint (TopologyCustomerCloud). The instances (EC2, GCE, ...)
  # belong to a CloudAccount and a zone; this is the footprint they serve, so a deployment reads its instances
  # directly. Not DeviceHosting: a cloud instance is a CloudResource, not a DcimDevice.
  - name: CloudHosting
    namespace: Topology
    description: "Deployment in which a customer's cloud instances run"
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
    relationships:
      - name: instances
        peer: CloudInstance
        kind: Generic
        cardinality: many
        identifier: "topology__cloud_instances"
        order_weight: 1200

  - name: DeviceNaming
    namespace: Topology
    description: "Device naming convention for devices this deployment creates"
    include_in_menu: false
    attributes:
      - name: naming_convention
        label: "Naming Convention"
        description: "Device naming convention for devices created under this deployment"
        kind: Dropdown
        optional: true
        default_value: standard
        order_weight: 1050
        choices:
          - name: standard
            label: "Standard"
            description: "role-dcNN..N, role code first, then dc + concatenated location indexes (e.g. lf-dc11312401)"
            color: "#7FBF7F"
          - name: hierarchical
            label: "Hierarchical"
            description: "dc.N.roleNN, dot-separated numeric path (e.g. dc1.2.lf01)"
            color: "#7F7FBF"
          - name: flat
            label: "Flat"
            description: "dcNroleNN, no separators (e.g. dc12lf01)"
            color: "#BF7FBF"
          - name: computed
            label: "Computed"
            description: "dc-roleNNNN, fixed-width digit run instead of a labeled path (e.g. dc1-lf0201)"
            color: "#BFBF7F"

  - name: SegmentHosting
    namespace: Topology
    description: "VNI pools for network segments activated in this deployment"
    human_friendly_id:
      - name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100

      # Symmetric IRB needs the SAME gateway MAC on every VTEP: a host ARPs for
      # its gateway once and keeps that MAC as it moves or as its flows land on
      # a different leaf. If two leaves answer with different MACs, traffic
      # blackholes on the leaf that did not answer. So this is a fabric-wide
      # constant, exactly like evpn_rt_as below, and belongs in the same place.
      # Optional: unset means transforms/helpers/vxlan.py's documented default.
      - name: evpn_anycast_gateway_mac
        label: EVPN Anycast Gateway MAC
        kind: Text
        optional: true
        order_weight: 7650
        regex: "^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$"
        description: "Shared anycast-gateway MAC for every VTEP in this fabric (colon-separated). Must be identical fabric-wide."  # yamllint disable-line rule:line-length

      # Staged rollout of the BGP route protection (utils/bgp_expectation.py). A wrong filter takes a working fabric
      # down, so what is not lab-verified is rendered only when this is true; false renders the policy objects and
      # leaves the neighbours unattached, with the maximum-prefix as warning-only. The precedent is
      # TopologyDataCenter.group_policy_enforce. Read by the device transforms (transforms/helpers/bgp_facts.py)
      # from the device's own hosting deployment.
      - name: routing_filter_enforce
        label: "Enforce Routing Filters"
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 7660
        description: >-
          True attaches the derived BGP filters and enforces the maximum-prefix; false renders them unattached.
    relationships:
      - name: vni_pool
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "segment_hosting__vni_pool"
        order_weight: 7400
        on_delete: cascade
        description: "L2 VNI pool for this deployment. Used when segment.vni is null and overlay is VXLAN-EVPN."  # yamllint disable-line rule:line-length

      # EVPN route-targets must be identical on every VTEP in the fabric or the
      # VTEPs never import each other's routes. Under ebgp-ibgp/ospf-ibgp the
      # shared overlay ASN already provides that constant, but under ebgp-ebgp
      # every VTEP runs its own ASN, so deriving the RT from a device's local
      # ASN silently breaks forwarding. This holds the ONE administrative ASN
      # the whole fabric stamps into the RT admin field, independent of routing
      # strategy. Lives beside the VNI pools because it is part of the same
      # fabric-wide EVPN numbering decision.
      - name: evpn_rt_as
        label: EVPN Route-Target ASN
        peer: RoutingAutonomousSystem
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "segment_hosting__evpn_rt_as"
        order_weight: 7600
        description: "Fabric-wide administrative ASN stamped into EVPN route-targets. Must be identical for every VTEP in the fabric."  # yamllint disable-line rule:line-length

nodes:
  - name: Label
    namespace: Topology
    description: "A deployment footprint for a customer or internal use."
    label: "Topology Deployment"
    icon: "carbon:network-3-reference"
    menu_placement: TopologyGeneric
    include_in_menu: false
    generate_template: false
    children: ""
    inherit_from:
      - TopologyDeployment

extensions:
  nodes:
    - kind: DcimPhysicalDevice
      relationships:
        - name: deployment
          peer: TopologyDeviceHosting
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: DcimVirtualDevice
      relationships:
        - name: deployment
          peer: TopologyDeployment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: CloudNetworkAppliance
      relationships:
        - name: deployment
          peer: TopologyProviderHosting
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__appliances"
          order_weight: 1600

    - kind: CloudInstance
      relationships:
        - name: deployment
          peer: TopologyCloudHosting
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__cloud_instances"
          order_weight: 1600

    - kind: ManagedControllerPhysical
      relationships:
        - name: deployment
          peer: TopologyDeviceHosting
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: ManagedControllerVirtual
      relationships:
        - name: deployment
          peer: TopologyDeployment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "topology__devices"
          order_weight: 1600

    - kind: DcimCable
      relationships:
        - name: deployment
          peer: TopologyPhysicalDeployment
          cardinality: one
          optional: true
          kind: Attribute
          order_weight: 2000
          identifier: "physical_deployment__cables"
