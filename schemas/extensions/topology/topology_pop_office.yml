---
version: "1.0"

# TopologyOffice is a pure grouping container — a shared SITE name/label
# under which one or more TopologyCustomerOffice footprints live (topology_
# customer.yml, parent: TopologyOffice). It carries no locations/cables/
# devices (those belong to whichever customer occupies the building) and no
# TopologyConnectableLocation either — circuits always terminate on a
# specific customer footprint (TopologyCustomer inherits
# TopologyConnectableLocation directly), never on the shared site container,
# since connecting two different customer deployments always requires an
# explicit virtual/physical link between their own footprints.

nodes:
  - name: Office
    namespace: Topology
    inherit_from:
      - CoreArtifactTarget
      - TopologyDeployment
    uniqueness_constraints:
      - ["name__value"]
    human_friendly_id:
      - name__value
    include_in_menu: false
    display_label: "{{ name__value }}"
    label: Office Topology
    children: ""
    attributes:
      - name: site_type
        kind: Dropdown
        optional: true
        default_value: branch
        order_weight: 650
        choices:
          - name: hq
            label: Headquarters
            color: "#2ECC71"
          - name: regional
            label: Regional Office
            color: "#3498DB"
          - name: branch
            label: Branch Office
            color: "#7F7FBF"
          - name: campus
            label: Campus
            color: "#F39C12"
