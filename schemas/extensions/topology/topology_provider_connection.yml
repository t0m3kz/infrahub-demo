---
version: "1.0"

# A SERVICE REQUEST: "connect these facilities, for this owner". It is the one object that ties everything for one
# leg of a connection from our topology to a cloud or a SaaS: the request (intent) and, one-sided, everything that
# realizes it. Nothing points back at the connection: no facility, circuit or cloud object lists connections.
#
# Intent (authored): connection_type, locations (the two facilities, max 2: ours and the provider's), the optional
# near_port, ip_namespace, bandwidth, owner, account, redundancy, and the two POOLS the addresses and AS numbers are
# taken from: ip_pool (a CoreIPPrefixPool, the repo's Handoff-<namespace>-IPv4 pools) and asn_pool (a
# CoreNumberPool, PRIVATE-ASN32).
#
# Realization (one-sided links to what exists for this leg): carrier_circuits (physical), session_circuits (virtual),
# cloud_direct_connect, cloud_virtual_interfaces, cloud_vpn_connection, saas_connection. Today they are authored; a
# generator will create them from the request and link them. The allocated values sit on the realized objects: our
# address is the sub-interface of the session circuit, our AS the local_as of our BGP process, the provider's address
# and AS (peer_ip, peer_asn) are on the connector. VLAN, prefixes, password and gateway live there too.
#
# The provider-hosted end is derived from the kind of the facility in `locations` (a TopologyCloudRegion, a
# TopologySaasRegion, a TopologyExternalProviders); the provider from `account.provider` or that facility. The vendor
# flavour is `OrganizationProvider.connection_profile`.
#
nodes:
  - name: ProviderConnection
    namespace: Topology
    label: Provider Connection
    description: "Service request: connect our facility to a cloud or SaaS, with everything that realizes it"
    icon: "mdi:transit-connection-variant"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }} ({{ connection_type__value }})"
    order_by:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        label: Name
        optional: false
        order_weight: 100
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 150
      - name: connection_type
        kind: Dropdown
        label: Connection Type
        optional: false
        order_weight: 200
        description: "What is connected and how: tells which realization objects the leg has"
        choices:
          - name: direct_connect
            label: Direct Connect
            description: "Dedicated port to a cloud: carrier, handoff session, Direct Connect, virtual interface"
            color: "#2980b9"
          - name: hosted
            label: Hosted Connection
            description: "Connection through a partner's port (ExpressRoute, hosted Direct Connect, Equinix, Megaport)"
            color: "#16a085"
          - name: vpn
            label: Site-to-Site VPN
            description: "Tunnels over an internet carrier circuit to a cloud gateway"
            color: "#8e44ad"
          - name: saas_private
            label: SaaS Private Peering
            description: "Dedicated carrier and BGP session to a SaaS provider (Webex, Microsoft 365)"
            color: "#d35400"
          - name: saas_internet
            label: SaaS over Internet
            description: "Tunnel over the internet to a SaaS provider (Zscaler), no BGP"
            color: "#c0392b"
      - name: redundancy
        kind: Dropdown
        label: Redundancy
        optional: true
        order_weight: 250
        description: "Which leg of a pair this is; the two legs are two connections"
        choices:
          - name: single
            label: Single
            color: "#95a5a6"
          - name: primary
            label: Primary
            color: "#27ae60"
          - name: secondary
            label: Secondary
            color: "#e67e22"
      - name: status
        kind: Dropdown
        label: Status
        order_weight: 400
        default_value: provisioning
        choices:
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: maintenance
            label: Maintenance
            color: "#ffd27f"
          - name: down
            label: Down
            color: "#ff7f7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
      - name: bandwidth
        kind: Number
        label: Bandwidth
        optional: true
        order_weight: 500
        description: "Committed bandwidth in Mbps (inventory)"
    relationships:
      # Both are facilities, never a pod, rack or tenant footprint, as a carrier circuit's locations are. One edge, no
      # reverse list on the facility: the provider-hosted end is the facility whose kind says so.
      - name: locations
        label: Locations
        peer: TopologyFacility
        cardinality: many
        max_count: 2
        kind: Attribute
        optional: false
        identifier: provider_connection__locations
        order_weight: 1000
        description: "Intent: the two facilities connected: ours (a data center, a colocation zone) and the provider's (a cloud region, a SaaS region)"  # yamllint disable-line rule:line-length
      - name: near_port
        label: Near Port
        peer: DcimInterface
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__near_port
        order_weight: 1050
        description: "Intent, optional: our port to use; left empty, the generator picks a free one"
      - name: ip_namespace
        label: IP Namespace
        peer: IpamNamespace
        cardinality: one
        kind: Attribute
        optional: false
        identifier: provider_connection__ip_namespace
        order_weight: 1100
        description: "Environment namespace of its sessions; our link addresses come from Handoff-<namespace>-IPv4"
      - name: owner
        label: Owner
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__owner
        order_weight: 1150
        description: "The customer the connection is for; empty for shared underlay"
      - name: account
        label: Cloud Account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__account
        order_weight: 1200
        description: "The cloud account it lands in; its provider is the connection's provider"
      # Pools: where a generator takes the values from. IPs and AS numbers are never typed for a leg that our pools
      # serve; the allocated values land on the connector (local_ip, peer_ip, local_asn, peer_asn).
      - name: ip_pool
        label: IP Pool
        peer: CoreIPPrefixPool
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__ip_pool
        order_weight: 1470
        description: "Pool our side of the leg is addressed from (Handoff-<namespace>-IPv4, a /31 per leg)"
      - name: asn_pool
        label: ASN Pool
        peer: CoreNumberPool
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__asn_pool
        order_weight: 1480
        description: "Pool our private AS is taken from when the provider needs one (PRIVATE-ASN32)"
      # Realization, one-sided. Shared underlay: deleting the connection leaves the carriers.
      - name: carrier_circuits
        label: Carrier Circuits
        peer: TopologyCarrierCircuit
        cardinality: many
        kind: Attribute
        optional: true
        identifier: provider_connection__carriers
        order_weight: 1500
        description: "Realization (physical): the carriers it rides"
      - name: session_circuits
        label: Session Circuits
        peer: TopologySessionCircuit
        cardinality: many
        kind: Attribute
        optional: true
        identifier: provider_connection__sessions
        order_weight: 1550
        description: "Realization (virtual): the handoff or vpn circuits routed on this connection"
      - name: cloud_direct_connect
        label: Direct Connect
        peer: CloudDirectConnect
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__direct_connect
        order_weight: 1600
        description: "Realization (cloud): the port or hosted connection on the cloud side"
      - name: cloud_virtual_interfaces
        label: Virtual Interfaces
        peer: CloudVirtualInterface
        cardinality: many
        kind: Attribute
        optional: true
        identifier: provider_connection__virtual_interfaces
        order_weight: 1650
        description: "Realization (cloud): the VLANs on it (private, public, transit)"
      - name: cloud_vpn_connection
        label: VPN Connection
        peer: CloudVPNConnection
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__vpn_connection
        order_weight: 1700
        description: "Realization (cloud): the site-to-site VPN"
      - name: saas_connection
        label: SaaS Connection
        peer: TopologySaasConnection
        cardinality: one
        kind: Attribute
        optional: true
        identifier: provider_connection__saas_connection
        order_weight: 1750
        description: "Realization (SaaS): the provider-side endpoint of the leg"
