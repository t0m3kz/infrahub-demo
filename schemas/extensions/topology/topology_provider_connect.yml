---
version: "1.0"
# The provider's side at a location, in one kind for a colocation, a cloud and a SaaS:
#   TopologyProviderConnect    a slim device that holds the ports of a provider at ONE place: the Equinix Fabric
#                              port of a colocation zone (the cage), the internet-facing (public) ports of a cloud
#                              region, the public port of a SaaS region. Never in a `deployment`; its place is its
#                              `location`, one facility.
#   TopologyProviderInterface  the end of ONE provider connection on a port of it (an Equinix Fabric connection, an
#                              Internet Access service): the S-tag, the C-tag and the bandwidth of that connection. The
#                              circuit of the connection ends on it, so a port is not shared between connections.
# It has no account and no owner: it is one per place, not per customer. The private connections of a cloud (Direct
# Connect, ExpressRoute, Interconnect, a VPN) stay in their own kinds (CloudDirectConnect, CloudVPNConnection): they
# are per connection or per tunnel, with an account. It shares the provider and the speed with them through
# DcimProviderPort; the provider's own identifier of the port is its `external_id`.
nodes:
  - name: ProviderConnect
    namespace: Topology
    label: Provider Connect
    description: "The provider's ports at one place: a colocation zone, a cloud region or a SaaS region"
    icon: mdi:ethernet
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    inherit_from:
      - DcimDevice
      - DcimProviderPort
    attributes:
      - name: description
        kind: Text
        optional: true
        order_weight: 110
      - name: status
        kind: Dropdown
        optional: true
        order_weight: 120
        choices:
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
      - name: external_id
        kind: Text
        label: External ID
        optional: true
        order_weight: 300
        description: The identifier the provider gives the port.
    relationships:
      - name: location
        label: Location
        peer: TopologyFacility
        optional: false
        cardinality: one
        kind: Attribute
        identifier: topology_provider_connect__location
        description: "Where the ports are: a colocation zone, a cloud region or a SaaS region (a facility)"
        order_weight: 750

  # The end of ONE provider connection on a port of a provider connect, the counterpart of CloudPeeringInterface: it
  # rides on a port of the same device (`parent_interface`), carries the S-tag, the C-tag and the connection's
  # bandwidth, and the virtual_connection or internet carrier circuit ends on it. L2 only: no address, no routing (the
  # cloud peering holds those).
  - name: ProviderInterface
    namespace: Topology
    label: Provider Interface
    icon: mdi:ethernet
    description: "The end of one provider connection on a provider port: S-tag, C-tag and bandwidth"
    include_in_menu: false
    inherit_from:
      - DcimInterface
      - DcimSubInterface
    attributes:
      - name: bandwidth
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: true
        order_weight: 2000
        description: "The bandwidth of the connection that ends here, in megabits per second"
