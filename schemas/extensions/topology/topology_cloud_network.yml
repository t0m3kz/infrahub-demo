---
version: "1.0"

# Gateways, routing, hybrid connectivity, appliances.
# The generics and the account/network/compute core: topology_cloud.yml.
generics:
  # Marker for the transport a cloud peering rides on: a Direct Connect / circuit / Interconnect or a VPN connection.
  # Both inherit CloudResource too; the name is declared here so a peering can name its transport by HFID.
  - name: Transport
    namespace: Cloud
    label: Cloud Transport
    description: "The physical or virtual way to the cloud edge that peerings ride on"
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100

nodes:
  - name: TransitGateway
    namespace: Cloud
    label: Transit Gateway
    icon: mdi:transit-connection-horizontal
    description: Multi-region virtual network transit hub for routing.
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    attributes:
      - name: default_route_table
        kind: Boolean
        label: "Default Route Table Association"
        optional: true
        default_value: true
        order_weight: 360
      - name: dns_support
        kind: Boolean
        label: "DNS Support"
        optional: true
        default_value: true
        order_weight: 400
      - name: vpn_ecmp_support
        kind: Boolean
        label: "VPN ECMP Support"
        optional: true
        default_value: false
        order_weight: 450
    relationships:
      - name: asn
        peer: RoutingAutonomousSystem
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 350
      - name: account
        peer: CloudAccount
        cardinality: one
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        optional: false
        order_weight: 650
      - name: attached_virtual_networks
        peer: CloudVirtualNetwork
        cardinality: many
        optional: true
        order_weight: 700
        description: "Virtual networks attached to this transit gateway"
    uniqueness_constraints:
      - [account, name__value]

  # ── Transit Gateway routing domains and attachments ───────────────────────
  # `attached_virtual_networks` above is a flat list: it says a VPC hangs off
  # this hub and nothing else. That is enough to draw a picture and not enough
  # to reason about a change, because it cannot express the two facts that
  # decide blast radius in a hub-and-spoke cloud:
  #
  #   1. WHICH ACCOUNT owns the attachment. The attachment resource lives in
  #      the spoke account while the Transit Gateway lives in the network
  #      account; a change in one is not a change in the other.
  #   2. WHICH ROUTING DOMAIN it joins. Two spokes on separate route tables
  #      cannot reach each other at all.
  #
  # Without (2) every spoke looks like it reaches every other spoke, so a
  # blast-radius answer computed off the flat list is "everything" — which is
  # the same as no answer.

  - name: TransitGatewayRouteTable
    namespace: Cloud
    label: Transit Gateway Route Table
    icon: mdi:routes
    description: "Routing domain inside a Transit Gateway — the unit of spoke-to-spoke isolation"
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [transit_gateway, name__value]
    attributes:
      - name: is_default
        kind: Boolean
        label: "Default Route Table"
        optional: true
        default_value: false
        order_weight: 350
        description: "Route table new attachments join when not told otherwise"
    relationships:
      - name: transit_gateway
        label: "Transit Gateway"
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway__route_tables"
        order_weight: 600
        description: "Transit Gateway this route table belongs to"

  - name: TransitGatewayAttachment
    namespace: Cloud
    label: Transit Gateway Attachment
    icon: mdi:transit-connection-variant
    description: "One spoke's connection into a Transit Gateway"
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }} ({{ attachment_type__value }})"
    uniqueness_constraints:
      - [transit_gateway, name__value]
    attributes:
      - name: attachment_type
        kind: Dropdown
        label: "Attachment Type"
        order_weight: 280
        optional: false
        choices:
          - name: vpc
            label: "VPC"
            description: Spoke virtual network attached via ENIs, one subnet per zone
            color: "#3498DB"
          - name: hybrid
            label: "Hybrid (DX / VPN)"
            description: On-premises attachment via a transit VIF
            color: "#F39C12"
          - name: connect
            label: "Connect (GRE)"
            description: GRE/BGP attachment, typically an SD-WAN appliance
            color: "#2ECC71"
    relationships:
      - name: transit_gateway
        label: "Transit Gateway"
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway__attachments"
        order_weight: 600
        description: "Transit Gateway this attachment lands on"
      # For a cross-account attachment this is the SPOKE account, not the
      # Transit Gateway's account. That asymmetry is why the attachment is a
      # node: it is the only place a per-spoke fact can be recorded.
      - name: owner_account
        label: "Owner Account"
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway_attachment__owner_account"
        order_weight: 650
        description: "Account the attachment itself lives in (the spoke, when cross-account)"
      - name: virtual_network
        label: "Virtual Network"
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "transit_gateway_attachment__virtual_network"
        order_weight: 700
        description: "Spoke virtual network — set when attachment_type is vpc"
      - name: associated_route_table
        label: "Associated Route Table"
        peer: CloudTransitGatewayRouteTable
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "transit_gateway_attachment__associated_route_table"
        order_weight: 850
        description: "Route table resolving traffic leaving this spoke"
      # Association and propagation are separate on purpose: a spoke that
      # associates to a shared table but propagates nowhere can reach its peers
      # and cannot be reached by them. Collapsing them hides exactly that case.
      - name: propagates_to_route_tables
        label: "Propagates Into"
        peer: CloudTransitGatewayRouteTable
        cardinality: many
        optional: true
        identifier: "transit_gateway_attachment__propagated_route_tables"
        order_weight: 900
        description: "Route tables this spoke's prefixes are advertised into — who can reach it"

  # ── Hybrid connectivity: the cloud side of a circuit, in the words every cloud shares ──────────
  # The operators differ in vocabulary, not in structure. Five common elements describe AWS, Azure, GCP, a VPN and a
  # SaaS; the operator's own word is in the names, the descriptions and the blueprint of the sample README, and the
  # flavour per operator is OrganizationProvider.connection_profile (aws, azure, gcp, oci, equinix, megaport, ...).
  #   transport           the physical or virtual way to the cloud edge: CloudDirectConnect (a port or hosted
  #                       connection, with a service key where the operator has one) or CloudVPNConnection (the
  #                       encrypted way, which holds the tunnels)
  #   peering             CloudPeeringInterface: the L3/BGP termination on the cloud side, the "interface of the
  #                       cloud". A circuit's session ends on it (circuit `endpoints`), our side is a sub-interface
  #   cloud edge gateway  CloudGateway: what a peering lands on inside the provider, before the network
  #   transit/hub gateway CloudTransitGateway (routing hub, unchanged)
  #   virtual network     CloudVirtualNetwork
  # Names are global (dx-c900-fra-1). The circuits point at them (`endpoints`); nothing points back.
  # Addressing is a convention, not a field: our link /31 (a /30 tunnel pair) comes from the pool
  # Handoff-<namespace>-IPv4, our private AS from PRIVATE-ASN32; the provider's address and AS are the peering's peer_ip
  # and peer_asn. The operator flavour is OrganizationProvider.connection_profile.
  - name: DirectConnect
    namespace: Cloud
    label: Cloud Transport (port or circuit)
    icon: mdi:lan-connect
    description: "Transport: a physical port or bundle, or a logical connection (Direct Connect, ExpressRoute, Interconnect); peerings ride on it"  # yamllint disable-line rule:line-length
    include_in_menu: false
    inherit_from:
      - CloudResource
      - CloudTransport
      - TopologyCircuitEnd
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [account, name__value]
    attributes:
      - name: connection_type
        kind: Dropdown
        label: "Connection Type"
        optional: false
        order_weight: 250
        choices:
          - name: physical
            label: Physical
            description: "A port of our own, or a bundle of ports, at the provider's location (dedicated connection, LAG, Direct port)"  # yamllint disable-line rule:line-length
            color: "#3498DB"
          - name: logical
            label: Logical
            description: "A circuit on a partner's port or on our own physical port (hosted connection, ExpressRoute circuit, VLAN attachment)"  # yamllint disable-line rule:line-length
            color: "#2ECC71"
      - name: bandwidth
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: false
        order_weight: 300
        description: "Port or connection speed in megabits per second"
      - name: vlan_id
        kind: Number
        label: "VLAN ID"
        optional: true
        order_weight: 350
        description: "The outer VLAN of a hosted connection"
        parameters:
          min_value: 1
          max_value: 4094
      - name: service_key
        kind: Text
        label: "Service Key"
        optional: true
        order_weight: 360
        description: "The operator's key or identifier of the connection (service key, pairing key, connection id)"
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloud_direct_connect__region"
        order_weight: 650
      - name: partner_account
        label: Partner Account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_direct_connect__partner_account"
        order_weight: 700
        description: "A logical connection lives in the partner's account while its peerings are in `account`"
      # A member port rides on its bundle; a logical circuit on its own port or bundle. Same identifier on both sides.
      - name: rides_on
        label: Rides On
        peer: CloudDirectConnect
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_direct_connect__rides_on"
        direction: outbound
        order_weight: 750
        description: "The bundle a member port belongs to, or the port or bundle a logical circuit rides on"
      - name: riders
        label: Riders
        peer: CloudDirectConnect
        cardinality: many
        kind: Generic
        optional: true
        identifier: "cloud_direct_connect__rides_on"
        direction: inbound
        order_weight: 760
        description: "The member ports and logical circuits that ride on this one"

  # The interface of the cloud: the L3 termination of one session, the same for every operator. The provider side
  # address and AS are the TopologyConnectorRouting edges (peer_ip, peer_asn); OUR side is a sub-interface of ours
  # and our BGP process. What it rides on is the transport; where it lands is the cloud edge gateway, the transit
  # gateway or the virtual network.
  - name: PeeringInterface
    namespace: Cloud
    label: Cloud Peering Interface
    icon: mdi:ethernet
    description: "The interface of the cloud: where a session ends (virtual interface, peering, VLAN attachment, VPN tunnel, SaaS peering)"  # yamllint disable-line rule:line-length
    include_in_menu: false
    inherit_from:
      - CloudResource
      - TopologyCircuitEnd
      - TopologyConnectorRouting
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }} {{ scope__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: scope
        kind: Dropdown
        label: "Scope"
        optional: false
        order_weight: 250
        description: "What it reaches (private, public, saas); the operator word is in the name and the blueprint"  # yamllint disable-line rule:line-length
        choices:
          - name: private
            label: Private
            description: "A virtual network or a transit hub, directly or through a cloud edge gateway"
            color: "#3498DB"
          - name: public
            label: Public
            description: "The provider's public endpoints"
            color: "#2ECC71"
          - name: saas
            label: SaaS
            description: "A SaaS service (Webex, Zscaler, Microsoft 365)"
            color: "#D35400"
      - name: routing
        kind: Dropdown
        label: "Routing"
        optional: false
        default_value: bgp
        order_weight: 300
        choices:
          - name: bgp
            label: BGP
            color: "#3498DB"
          - name: static
            label: Static
            color: "#95A5A6"
      - name: vlan_id
        kind: Number
        label: "VLAN ID"
        optional: true
        order_weight: 350
        description: "The VLAN of the peering on its transport (a VLAN-based peering)"
        parameters:
          min_value: 1
          max_value: 4094
      - name: tunnel_index
        kind: Number
        label: "Tunnel"
        optional: true
        order_weight: 360
        description: "Which tunnel of the VPN connection (a tunnel-based peering)"
        parameters:
          min_value: 1
          max_value: 4
      - name: mtu
        kind: Number
        label: "MTU"
        optional: true
        order_weight: 400
        parameters:
          min_value: 576
          max_value: 9216
      - name: bfd
        kind: Boolean
        label: "BFD"
        optional: true
        default_value: false
        order_weight: 450
      - name: service_id
        kind: Text
        label: "Service / Tenant ID"
        optional: true
        order_weight: 500
        description: "The provider's identifier of the tenant or service where there is no account (Webex org, Zscaler org)"  # yamllint disable-line rule:line-length
      - name: endpoint_ip
        kind: IPHost
        label: "Endpoint IP"
        optional: true
        order_weight: 370
        description: "A tunnel: the provider's public address this tunnel terminates on"
      - name: tunnel_mode
        kind: Dropdown
        label: "Tunnel Mode"
        optional: true
        order_weight: 380
        description: "A tunnel: how it is encapsulated"
        choices:
          - name: ipsec
            label: IPsec
            description: "IPsec tunnel (needs a crypto profile and a tunnel key)"
            color: "#3498DB"
          - name: gre
            label: GRE
            description: "GRE tunnel, no encryption"
            color: "#95A5A6"
    relationships:
      - name: transport
        peer: CloudTransport
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__transport"
        order_weight: 600
        description: "What it rides on: a Direct Connect / circuit / Interconnect or the VPN connection; empty for a SaaS peering"  # yamllint disable-line rule:line-length
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__account"
        order_weight: 650
        description: "The account it belongs to; empty for a SaaS (see owner)"
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__region"
        order_weight: 700
      - name: saas_region
        label: SaaS Region
        peer: TopologySaasRegion
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__saas_region"
        order_weight: 750
      - name: owner
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__owner"
        order_weight: 800
        description: "The customer, only for a SaaS where there is no account"
      - name: gateway
        label: Cloud Edge Gateway
        peer: CloudGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__gateway"
        order_weight: 850
        description: "What it lands on inside the provider (Direct Connect Gateway, virtual private gateway, ExpressRoute gateway, Cloud Router)"  # yamllint disable-line rule:line-length
      - name: transit_gateway
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__transit_gateway"
        order_weight: 900
        description: "Directly on a transit/hub gateway (a gateway-less landing)"
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__virtual_network"
        order_weight: 950
        description: "Directly on one virtual network (a gateway-less landing)"
      - name: auth
        label: BGP Key
        peer: RoutingPassword
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__auth"
        order_weight: 1000
      - name: tunnel_key
        label: Tunnel Key
        peer: RoutingPassword
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__tunnel_key"
        order_weight: 1010
        description: "A tunnel: the pre-shared key of the IPsec tunnel (the BGP key is `auth`)"
      - name: crypto_profile
        label: Crypto Profile
        peer: SecurityIPsecProfile
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_peering__crypto_profile"
        order_weight: 1020
        description: "A tunnel: the IKE and ESP parameters of an IPsec tunnel"
      - name: advertised_prefixes
        label: Advertised Prefixes
        peer: IpamPrefix
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "cloud_peering__advertised_prefixes"
        order_weight: 1050
        description: "The prefixes WE announce to the cloud; only public (provider-verified) and static; empty for private"  # yamllint disable-line rule:line-length

  # What a peering lands on inside the provider, between the peering and the network, and our side of a VPN.
  # Neutral roles; the operator word is in the name (see the blueprint in the sample README).
  - name: Gateway
    namespace: Cloud
    label: Cloud Gateway
    icon: mdi:router-network
    description: "A gateway between a peering and the network (cloud edge, VPN) or our side of a VPN (customer gateway)"  # yamllint disable-line rule:line-length
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [account, name__value]
    attributes:
      - name: gateway_type
        kind: Dropdown
        label: "Gateway Type"
        optional: false
        order_weight: 250
        choices:
          - name: cloud_edge_gateway
            label: Cloud Edge Gateway
            description: "Where a peering lands in the provider: Direct Connect Gateway (AWS), ExpressRoute Gateway (Azure), Cloud Router (GCP). Associates with a transit gateway or a virtual network"  # yamllint disable-line rule:line-length
            color: "#3498DB"
          - name: vpn_gateway
            label: VPN Gateway
            description: "The provider's VPN/private endpoint of one network: virtual private gateway (AWS), VPN gateway (Azure)"  # yamllint disable-line rule:line-length
            color: "#8E44AD"
          - name: customer_gateway
            label: Customer Gateway
            description: "OUR side of a VPN as the provider knows it: public address and AS (AWS customer gateway, Azure local network gateway)"  # yamllint disable-line rule:line-length
            color: "#D35400"
      - name: ip_address
        kind: IPHost
        label: "Public Address"
        optional: true
        order_weight: 300
        description: "A customer gateway: our public address"
      - name: asn
        kind: Number
        label: "AS Number"
        optional: true
        order_weight: 350
        description: "A customer gateway: the AS we speak with"
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloud_gateway__region"
        order_weight: 650
      - name: transit_gateway
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_gateway__transit_gateway"
        order_weight: 700
        description: "Associated with this transit gateway (Direct Connect Gateway -> TGW); set this or virtual_network"
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_gateway__virtual_network"
        order_weight: 750
        description: "Attached to this virtual network (virtual private gateway, ExpressRoute gateway, Cloud Router); set this or transit_gateway"  # yamllint disable-line rule:line-length

  - name: VPNConnection
    namespace: Cloud
    label: Cloud VPN Connection
    icon: mdi:vpn
    description: "Transport with no physical object: a site-to-site VPN; its tunnels are its peerings; not a circuit end"  # yamllint disable-line rule:line-length
    include_in_menu: false
    inherit_from:
      - CloudResource
      - CloudTransport
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [account, name__value]
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloud_vpn__region"
        order_weight: 650
      - name: customer_gateway
        peer: CloudGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloud_vpn__customer_gateway"
        order_weight: 700
        description: "Our side (a gateway of type customer_gateway)"
      - name: gateway
        label: VPN Gateway
        peer: CloudGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vpn__gateway"
        order_weight: 710
        description: "The provider side: a gateway of type vpn_gateway (set this, transit_gateway or virtual_network)"
      - name: transit_gateway
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vpn__transit_gateway"
        order_weight: 720
        description: "The provider side: a transit gateway"
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vpn__virtual_network"
        order_weight: 730
        description: "The provider side: one virtual network"

  # --------------------  Network Appliance  --------------------
  # A network function a provider hosts for us (Equinix Network Edge, Megaport MVE;
  # later a cloud marketplace NVA): an instance with interfaces, BGP and a config,
  # but no rack, no chassis and no hypervisor of ours. Its ports are virtual NICs
  # (DcimVirtualInterface, no cable, no host): the template declares no physical
  # interface. What the provider's catalogue calls the offer is structured data,
  # not attributes here: type_code is the Device Type name, package_code and
  # version are the Software Image's `package` and `version`. Every provider models it the
  # same way: an instance whose routing is a resource of the provider's service.
  # The function stays a device (DcimDevice: interfaces, capabilities such as
  # ManagedBGP, owner, platform), only its consumption is cloud-like, so it
  # inherits the device generics and not CloudResource (both carry name,
  # description and status, and there is no allow_override). The cloud_id below
  # is CloudResource's, declared again for that reason. Redundancy is not a
  # field here: two appliances that form a cluster are the members
  # (`capabilities`) of one HA domain, like every other HA pair (ha.yml). A
  # router has no redundancy representation: it is an independent appliance.
  - name: NetworkAppliance
    namespace: Cloud
    description: "Network function hosted by a provider (Equinix Network Edge, Megaport MVE), a device with a cloud-like lifecycle."  # yamllint disable-line rule:line-length
    label: Network Appliance
    icon: "mdi:router-network"
    include_in_menu: false
    generate_template: true
    inherit_from:
      - CoreArtifactTarget
      - DcimDevice
      - DcimCapabilities
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: cloud_id
        label: Cloud ID
        kind: Text
        optional: true
        description: "The provider's identifier of the instance"
        order_weight: 2300
      - name: term_length
        label: Term (months)
        kind: Number
        optional: true
        description: "Contract term in months (Equinix Network Edge term_length: 1, 12, 24, 36)"
        order_weight: 2350
    relationships:
      - name: account
        peer: CloudAccount
        label: Account
        description: "The provider account the instance is ordered under"
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 2400

# ==============================================================================
# Extensions - Cloud resource graph edges
# ==============================================================================
extensions:
  nodes:
    # Reverse lookup of the hub attachment, so the graph can be walked from the
    # Transit Gateway to its attachments; a relationship declared on only one
    # side is a direction GraphQL cannot express.
    - kind: CloudTransitGateway
      relationships:
        - name: attachments
          label: "Attachments"
          peer: CloudTransitGatewayAttachment
          cardinality: many
          optional: true
          identifier: "transit_gateway__attachments"
          order_weight: 2000
          description: "All attachments landing on this Transit Gateway, across accounts"
