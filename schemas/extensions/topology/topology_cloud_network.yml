---
version: "1.0"

# Gateways, routing, hybrid connectivity, appliances.
# The generics and the account/network/compute core: topology_cloud.yml.
nodes:
  - name: TransitGateway
    namespace: Cloud
    label: Transit Gateway
    icon: mdi:transit-connection-horizontal
    description: Multi-region virtual network transit hub for routing.
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    attributes:
      - name: default_route_table
        kind: Boolean
        label: "Default Route Table Association"
        optional: true
        default_value: true
        order_weight: 360
      - name: dns_support
        kind: Boolean
        label: "DNS Support"
        optional: true
        default_value: true
        order_weight: 400
      - name: vpn_ecmp_support
        kind: Boolean
        label: "VPN ECMP Support"
        optional: true
        default_value: false
        order_weight: 450
    relationships:
      - name: asn
        peer: RoutingAutonomousSystem
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 350
      - name: account
        peer: CloudAccount
        cardinality: one
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        optional: false
        order_weight: 650
      - name: attached_virtual_networks
        peer: CloudVirtualNetwork
        cardinality: many
        optional: true
        order_weight: 700
        description: "Virtual networks attached to this transit gateway"
    uniqueness_constraints:
      - [account, name__value]

  # ── Transit Gateway routing domains and attachments ───────────────────────
  # `attached_virtual_networks` above is a flat list: it says a VPC hangs off
  # this hub and nothing else. That is enough to draw a picture and not enough
  # to reason about a change, because it cannot express the two facts that
  # decide blast radius in a hub-and-spoke cloud:
  #
  #   1. WHICH ACCOUNT owns the attachment. The attachment resource lives in
  #      the spoke account while the Transit Gateway lives in the network
  #      account; a change in one is not a change in the other.
  #   2. WHICH ROUTING DOMAIN it joins. Two spokes on separate route tables
  #      cannot reach each other at all.
  #
  # Without (2) every spoke looks like it reaches every other spoke, so a
  # blast-radius answer computed off the flat list is "everything" — which is
  # the same as no answer.

  - name: TransitGatewayRouteTable
    namespace: Cloud
    label: Transit Gateway Route Table
    icon: mdi:routes
    description: "Routing domain inside a Transit Gateway — the unit of spoke-to-spoke isolation"
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [transit_gateway, name__value]
    attributes:
      - name: is_default
        kind: Boolean
        label: "Default Route Table"
        optional: true
        default_value: false
        order_weight: 350
        description: "Route table new attachments join when not told otherwise"
    relationships:
      - name: transit_gateway
        label: "Transit Gateway"
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway__route_tables"
        order_weight: 600
        description: "Transit Gateway this route table belongs to"

  - name: TransitGatewayAttachment
    namespace: Cloud
    label: Transit Gateway Attachment
    icon: mdi:transit-connection-variant
    description: "One spoke's connection into a Transit Gateway"
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }} ({{ attachment_type__value }})"
    uniqueness_constraints:
      - [transit_gateway, name__value]
    attributes:
      - name: attachment_type
        kind: Dropdown
        label: "Attachment Type"
        order_weight: 280
        optional: false
        choices:
          - name: vpc
            label: "VPC"
            description: Spoke virtual network attached via ENIs, one subnet per zone
            color: "#3498DB"
          - name: hybrid
            label: "Hybrid (DX / VPN)"
            description: On-premises attachment via a transit VIF
            color: "#F39C12"
          - name: connect
            label: "Connect (GRE)"
            description: GRE/BGP attachment, typically an SD-WAN appliance
            color: "#2ECC71"
    relationships:
      - name: transit_gateway
        label: "Transit Gateway"
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway__attachments"
        order_weight: 600
        description: "Transit Gateway this attachment lands on"
      # For a cross-account attachment this is the SPOKE account, not the
      # Transit Gateway's account. That asymmetry is why the attachment is a
      # node: it is the only place a per-spoke fact can be recorded.
      - name: owner_account
        label: "Owner Account"
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway_attachment__owner_account"
        order_weight: 650
        description: "Account the attachment itself lives in (the spoke, when cross-account)"
      - name: virtual_network
        label: "Virtual Network"
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "transit_gateway_attachment__virtual_network"
        order_weight: 700
        description: "Spoke virtual network — set when attachment_type is vpc"
      - name: associated_route_table
        label: "Associated Route Table"
        peer: CloudTransitGatewayRouteTable
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "transit_gateway_attachment__associated_route_table"
        order_weight: 850
        description: "Route table resolving traffic leaving this spoke"
      # Association and propagation are separate on purpose: a spoke that
      # associates to a shared table but propagates nowhere can reach its peers
      # and cannot be reached by them. Collapsing them hides exactly that case.
      - name: propagates_to_route_tables
        label: "Propagates Into"
        peer: CloudTransitGatewayRouteTable
        cardinality: many
        optional: true
        identifier: "transit_gateway_attachment__propagated_route_tables"
        order_weight: 900
        description: "Route tables this spoke's prefixes are advertised into — who can reach it"

  # ── Hybrid connectivity: the cloud side of a provider connection (names are global: dx-c900-fra-1) ──────────
  # Three objects realize a Topology.ProviderConnection on the cloud side. All three are CloudResources (account,
  # region) and are linked FROM the connection (one-sided); the VIF and the VPN connection are also circuit ends.
  #   CloudDirectConnect     the port or hosted connection (AWS Direct Connect, Azure ExpressRoute circuit)
  #   CloudVirtualInterface  one VLAN on it, private / public / transit (AWS VIF, ExpressRoute peering)
  #   CloudVPNConnection     a site-to-site VPN to a gateway or a virtual network
  - name: DirectConnect
    namespace: Cloud
    label: Direct Connect
    icon: mdi:lan-connect
    description: "The cloud side of a dedicated or hosted port: AWS Direct Connect, Azure ExpressRoute circuit"
    include_in_menu: false
    inherit_from:
      - CloudResource
      - TopologyCircuitEnd
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [account, name__value]
    attributes:
      - name: connection_type
        kind: Dropdown
        label: "Connection Type"
        optional: false
        order_weight: 250
        choices:
          - name: dedicated
            label: Dedicated
            description: "A port of our own at the provider's location"
            color: "#3498DB"
          - name: hosted
            label: Hosted
            description: "A slice of a partner's port (Equinix, Megaport)"
            color: "#2ECC71"
      - name: bandwidth
        kind: Number
        label: "Bandwidth (Mbps)"
        optional: false
        order_weight: 300
        description: "Port or connection speed in megabits per second"
      - name: vlan_id
        kind: Number
        label: "VLAN ID"
        optional: true
        order_weight: 350
        description: "The outer VLAN of a hosted connection"
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloud_direct_connect__region"
        order_weight: 650

  - name: VirtualInterface
    namespace: Cloud
    label: Virtual Interface
    icon: mdi:ethernet
    description: "One VLAN on a Direct Connect or ExpressRoute: private, public or transit; a circuit can end on it"
    include_in_menu: false
    inherit_from:
      - CloudResource
      - TopologyCircuitEnd
      - TopologyConnectorRouting
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }} {{ vif_type__value }} vlan {{ vlan_id__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [direct_connect, vlan_id__value]
    attributes:
      - name: vif_type
        kind: Dropdown
        label: "VIF Type"
        optional: false
        order_weight: 250
        choices:
          - name: private
            label: Private
            description: "Access to one virtual network"
            color: "#3498DB"
          - name: public
            label: Public
            description: "Access to the provider's public endpoints"
            color: "#2ECC71"
          - name: transit
            label: Transit
            description: "Access to a transit gateway"
            color: "#9B59B6"
      - name: vlan_id
        kind: Number
        label: "VLAN ID"
        optional: false
        order_weight: 350
        parameters:
          min_value: 1
          max_value: 4094
    relationships:
      - name: direct_connect
        label: "Direct Connect"
        peer: CloudDirectConnect
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 600
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vif__virtual_network"
        order_weight: 650
        description: "Set on a private VIF"
      - name: transit_gateway
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vif__transit_gateway"
        order_weight: 700
        description: "Set on a transit VIF"

  - name: VPNConnection
    namespace: Cloud
    label: VPN Connection
    icon: mdi:vpn
    description: "Site-to-site VPN from our edge to a transit gateway or a virtual network; a circuit can end on it"
    include_in_menu: false
    inherit_from:
      - CloudResource
      - TopologyCircuitEnd
      - TopologyConnectorRouting
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    order_by:
      - name__value
    uniqueness_constraints:
      - [account, name__value]
    attributes:
      - name: routing
        kind: Dropdown
        label: "Routing"
        optional: false
        order_weight: 250
        choices:
          - name: static
            label: Static
            color: "#95A5A6"
          - name: bgp
            label: BGP
            color: "#3498DB"
      - name: tunnel_count
        kind: Number
        label: "Tunnels"
        optional: false
        default_value: 2
        order_weight: 300
        parameters:
          min_value: 1
          max_value: 4
      - name: customer_gateway_ip
        kind: IPHost
        label: "Customer Gateway IP"
        optional: false
        order_weight: 350
        description: "The public address of our edge the tunnels come from"
      - name: provider_endpoint_ip
        kind: IPHost
        label: "Provider Endpoint IP"
        optional: true
        order_weight: 400
        description: "The public address of the provider's VPN endpoint"
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloud_vpn__region"
        order_weight: 650
      - name: transit_gateway
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vpn__transit_gateway"
        order_weight: 700
        description: "Gateway the tunnels end on; set this or virtual_network"
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "cloud_vpn__virtual_network"
        order_weight: 750
        description: "Virtual network the tunnels end on; set this or transit_gateway"

  # --------------------  Network Appliance  --------------------
  # A network function a provider hosts for us (Equinix Network Edge, Megaport MVE;
  # later a cloud marketplace NVA): an instance with interfaces, BGP and a config,
  # but no rack, no chassis and no hypervisor of ours. Its ports are virtual NICs
  # (DcimVirtualInterface, no cable, no host): the template declares no physical
  # interface. What the provider's catalogue calls the offer is structured data,
  # not attributes here: type_code is the Device Type name, package_code and
  # version are the Software Image's `package` and `version`. Every provider models it the
  # same way: an instance whose routing is a resource of the provider's service.
  # The function stays a device (DcimDevice: interfaces, capabilities such as
  # ManagedBGP, owner, platform), only its consumption is cloud-like, so it
  # inherits the device generics and not CloudResource (both carry name,
  # description and status, and there is no allow_override). The cloud_id below
  # is CloudResource's, declared again for that reason. Redundancy is not a
  # field here: two appliances that form a cluster are the members
  # (`capabilities`) of one HA domain, like every other HA pair (ha.yml). A
  # router has no redundancy representation: it is an independent appliance.
  - name: NetworkAppliance
    namespace: Cloud
    description: "Network function hosted by a provider (Equinix Network Edge, Megaport MVE), a device with a cloud-like lifecycle."  # yamllint disable-line rule:line-length
    label: Network Appliance
    icon: "mdi:router-network"
    include_in_menu: false
    generate_template: true
    inherit_from:
      - CoreArtifactTarget
      - DcimDevice
      - DcimCapabilities
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: cloud_id
        label: Cloud ID
        kind: Text
        optional: true
        description: "The provider's identifier of the instance"
        order_weight: 2300
      - name: term_length
        label: Term (months)
        kind: Number
        optional: true
        description: "Contract term in months (Equinix Network Edge term_length: 1, 12, 24, 36)"
        order_weight: 2350
    relationships:
      - name: account
        peer: CloudAccount
        label: Account
        description: "The provider account the instance is ordered under"
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 2400

# ==============================================================================
# Extensions - Cloud resource graph edges
# ==============================================================================
extensions:
  nodes:
    # Reverse lookup of the hub attachment, so the graph can be walked from the
    # Transit Gateway to its attachments; a relationship declared on only one
    # side is a direction GraphQL cannot express.
    - kind: CloudTransitGateway
      relationships:
        - name: attachments
          label: "Attachments"
          peer: CloudTransitGatewayAttachment
          cardinality: many
          optional: true
          identifier: "transit_gateway__attachments"
          order_weight: 2000
          description: "All attachments landing on this Transit Gateway, across accounts"
