# ==============================================================================
# Extensions - Cloud resources support for load balancer backend pools
# ==============================================================================
extensions:
  nodes:
    - kind: CloudInstance
      relationships:
        - name: node_pool
          peer: VirtNodePool
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "virt_pool__instances"
          description: "Node pool / ASG that manages this instance."
          order_weight: 2600

    # Reverse lookups for the hub attachment/route-table pair above. Every one
    # of these is a direction the change-risk traversal walks; a relationship
    # declared on only one side is a direction GraphQL cannot express.
    - kind: CloudTransitGateway
      relationships:
        - name: attachments
          label: "Attachments"
          peer: CloudTransitGatewayAttachment
          cardinality: many
          optional: true
          identifier: "transit_gateway__attachments"
          order_weight: 2000
          description: "All attachments landing on this Transit Gateway, across accounts"
        - name: route_tables
          label: "Route Tables"
          peer: CloudTransitGatewayRouteTable
          cardinality: many
          optional: true
          identifier: "transit_gateway__route_tables"
          order_weight: 2100
          description: "Routing domains configured on this Transit Gateway"

    - kind: CloudAccount
      relationships:
        - name: transit_gateway_attachments
          label: "Transit Gateway Attachments"
          peer: CloudTransitGatewayAttachment
          cardinality: many
          optional: true
          identifier: "transit_gateway_attachment__owner_account"
          order_weight: 2000
          description: "Transit Gateway attachments owned by this account"

    - kind: CloudVirtualNetwork
      relationships:
        - name: transit_gateway_attachments
          label: "Transit Gateway Attachments"
          peer: CloudTransitGatewayAttachment
          cardinality: many
          optional: true
          identifier: "transit_gateway_attachment__virtual_network"
          order_weight: 2500
          description: "Transit Gateway attachment(s) for this virtual network"

    - kind: CloudNetworkSegment
      relationships:
        - name: transit_gateway_attachments
          label: "Transit Gateway Attachments"
          peer: CloudTransitGatewayAttachment
          cardinality: many
          optional: true
          identifier: "transit_gateway_attachment__network_segments"
          order_weight: 2500
          description: "Attachment(s) with interfaces in this subnet"

    # On the generic, so both CloudVirtualInterface (transit VIF) and
    # CloudVPNGateway pick it up from one declaration.
    - kind: CloudHybridAttachment
      relationships:
        - name: transit_gateway_attachment
          label: "Transit Gateway Attachment"
          peer: CloudTransitGatewayAttachment
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "transit_gateway_attachment__hybrid_endpoint"
          order_weight: 2000
          description: "Transit Gateway attachment this hybrid endpoint feeds"
        # The edge that closes the colo leg. A virtual circuit's customer end is
        # a DcimInterface, but its cloud end is a CloudVirtualInterface, not a
        # device port. Without this the traversal walks from a DC border leaf
        # out to the colo cage and then stops at an island boundary.
        - name: virtual_circuits
          label: "Virtual Circuits"
          peer: TopologyVirtualCircuit
          cardinality: many
          optional: true
          identifier: "virtual_circuit__cloud_endpoints"
          order_weight: 2100
          description: "Circuit(s) terminating on this cloud attachment"

    - kind: TopologyVirtualCircuit
      relationships:
        - name: cloud_endpoints
          label: "Cloud Endpoints"
          peer: CloudHybridAttachment
          kind: Generic
          cardinality: many
          optional: true
          identifier: "virtual_circuit__cloud_endpoints"
          order_weight: 1080
          description: "Cloud-side terminations of this circuit (transit VIF or VPN gateway)"
