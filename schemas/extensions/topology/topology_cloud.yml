---
version: "1.0"
generics:
  - name: Resource
    namespace: Cloud
    description: Base for cloud resources with common metadata.
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 110
      - name: cloud_id
        kind: Text
        optional: true
        order_weight: 300
      - name: status
        kind: Dropdown
        optional: true
        order_weight: 120
        choices:
          - name: active
            label: Active
            description: Resource is active and operational.
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: Resource is being provisioned.
            color: "#7f7fff"

  - name: HybridAttachment
    namespace: Cloud
    description: "Cloud-side endpoint of a hybrid (on-prem/VRF) routing attachment — DX private VIF."
    include_in_menu: false

nodes:

  - name: Cloud
    namespace: Topology
    icon: mdi:cloud-outline
    inherit_from:
      - TopologyDeployment
    parent: TopologyLabel
    children: TopologyCloudRegion
    include_in_menu: false
    uniqueness_constraints:
      - ["name__value", "parent"]
    human_friendly_id:
      - name__value
    display_label: "{{ name__value|upper }}"

  # A Direct Connect or an ExpressRoute lands in a region, so the region is the
  # cloud-side endpoint of a shared circuit. Not the zone (an AZ is finer than
  # any provider commits to) and not TopologyCloud (which groups the provider's
  # regions and identifies no location at all).
  - name: CloudRegion
    namespace: Topology
    icon: mdi:earth
    inherit_from:
      - TopologyDeployment
      - TopologyDeviceHosting
      - TopologyConnectableLocation
      - TopologyFacility
    parent: TopologyCloud
    children: TopologyCloudZone
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value|upper }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    include_in_menu: false
    attributes:
      - name: status
        kind: Dropdown
        label: "Region Status"
        optional: true
        default_value: active
        order_weight: 300
        choices:
          - name: active
            label: Active
            description: "Region is active and operational"
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Region is being provisioned"
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Region is under maintenance"
            color: "#FFD27F"
    relationships:
      - name: location
        peer: LocationMetro
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1000
        identifier: "cloud__region__location"
        description: >
          Geographic location mapping for this region

  - name: CloudZone
    namespace: Topology
    icon: mdi:map-marker-outline
    inherit_from:
      - TopologyDeployment
    parent: TopologyCloudRegion
    label: Availability Zone
    children: ""
    human_friendly_id:
      - parent__name__value
      - name__value
    display_label: "{{ name__value|upper }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    include_in_menu: false

  - name: Account
    namespace: Cloud
    label: Cloud Account
    icon: mdi:account-key-outline
    description: Cloud account/subscription/project scoped to a provider.
    include_in_menu: false
    inherit_from:
      - CloudResource
      - CoreArtifactTarget
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [provider, account_id__value]
    attributes:
      - name: account_id
        kind: Text
        order_weight: 250
        optional: true
      - name: environment
        kind: Dropdown
        optional: true
        description: Environment classification of this account
        choices:
          - name: p
            label: Production
            description: Production workloads
            color: "#ff7f7f"
          - name: s
            label: Staging
            description: Pre-production staging environment
            color: "#ffd27f"
          - name: d
            label: Development
            description: Development and testing
            color: "#7fbf7f"
          - name: t
            label: Testing
            description: Testing environment
            color: "#D2B4DE"
          - name: n
            label: Non-Production
            description: Non-production environment
            color: "#A9DFBF"
        order_weight: 1400
    relationships:
      - name: provider
        peer: OrganizationProvider
        cardinality: one
        optional: false
        order_weight: 600
      - name: owner
        peer: OrganizationEntity
        cardinality: one
        optional: true
        order_weight: 700

  - name: VirtualNetwork
    namespace: Cloud
    label: Virtual Network
    icon: mdi:cloud-braces
    description: Provider-agnostic virtual network container
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    attributes:
      - name: is_default
        label: Default VPC
        kind: Boolean
        default_value: false
        description: Whether this is the default VPC for the account/region
        order_weight: 1500
      - name: dns_support
        label: DNS Support
        kind: Boolean
        default_value: true
        description: Whether DNS resolution is enabled
        order_weight: 1600
      - name: dns_hostnames
        label: DNS Hostnames
        kind: Boolean
        default_value: false
        description: Whether DNS hostnames are enabled for instances
        order_weight: 1700
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        order_weight: 650
        identifier: "cloudregion__virtual_networks"
      - name: cidr_blocks
        label: CIDR Blocks
        peer: IpamPrefix
        cardinality: many
        kind: Attribute
        optional: true
        description: IP address ranges (CIDR blocks) for this virtual network
        order_weight: 1800
      - name: network_segments
        peer: CloudNetworkSegment
        cardinality: many
        kind: Component
        optional: true
        description: Subnets within this virtual network
        order_weight: 2000
    uniqueness_constraints:
      - [account, name__value]

  - name: NetworkSegment
    namespace: Cloud
    label: Network Segment
    icon: mdi:vector-square
    description: Network segment (subnet) within a virtual network.
    include_in_menu: false
    inherit_from:
      - CloudResource
      - ManagedNetworkSegment
    display_label: "{{name__value}}"
    attributes:
      - name: is_public
        kind: Boolean
        optional: true
        order_weight: 350
      - name: auto_assign_public_ip
        label: Auto-assign Public IP
        kind: Boolean
        default_value: false
        description: Automatically assign public IPs to instances in this subnet
        order_weight: 1500
      - name: segment_type
        kind: Dropdown
        optional: false
        order_weight: 250
        description: "Segmentation technology (cloud provider or on-prem)"
        choices:
          - name: aws_vpc_subnet
            label: AWS VPC Subnet
            description: "AWS VPC subnet"
            color: "#FF9900"
          - name: gcp_vpc_subnet
            label: GCP VPC Subnet
            description: "Google Cloud VPC subnet"
            color: "#4285F4"
          - name: azure_vnet_subnet
            label: Azure VNet Subnet
            description: "Azure Virtual Network subnet"
            color: "#0078D4"
      - name: cidr_block
        label: CIDR Block
        kind: Text
        optional: true
        description: "Provider-assigned subnet CIDR — not tracked in IPAM (VPC-internal, commonly overlaps across accounts)"  # yamllint disable-line rule:line-length
        order_weight: 1600
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Parent
        optional: false
        description: Virtual network containing this subnet
        order_weight: 1050
      - name: availability_zone
        peer: TopologyCloudZone
        cardinality: one
        optional: false
        order_weight: 1100
        identifier: "cloudnetworksegment__availability_zone"
      - name: tags
        peer: BuiltinTag
        optional: true
        cardinality: many
        kind: Attribute
        order_weight: 3000
      - name: customer_deployment
        peer: TopologyCustomer
        cardinality: one
        kind: Attribute
        order_weight: 1900
        optional: false
        identifier: "segment__customer_deployments"
        description: "Customer deployment footprint this cloud subnet belongs to."
    uniqueness_constraints:
      - [virtual_network, customer_name__value]

  # --------------------  Compute Instance  --------------------
  - name: Instance
    namespace: Cloud
    description: Virtual machine or compute instance.
    label: Compute Instance
    icon: mdi:server
    menu_placement: CloudResource
    include_in_menu: false
    inherit_from:
      - CloudResource
      - DcimCapabilities
      - AppInstance
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [account, cloud_id__value]
    attributes:
      - name: instance_type
        label: Instance Type
        kind: Text
        optional: true
        description: Instance size/type (e.g., t3.micro, n1-standard-1)
        order_weight: 1500
      - name: image
        label: Image
        kind: Text
        optional: true
        description: Machine image or AMI used for this instance
        order_weight: 1550
      - name: cpu_count
        label: vCPU Count
        kind: Number
        optional: true
        description: Number of virtual CPUs
        order_weight: 1600
      - name: memory_gb
        label: Memory (GB)
        kind: Number
        optional: true
        description: Memory size in gigabytes
        order_weight: 1700
      - name: os_type
        label: Operating System
        kind: Dropdown
        optional: true
        description: Operating system type
        choices:
          - name: linux
            label: Linux
            description: Linux-based operating system
            color: "#ffc61a"
          - name: windows
            label: Windows
            description: Windows operating system
            color: "#0078D4"
          - name: other
            label: Other
            description: Other operating system
            color: "#808080"
        order_weight: 1900
      - name: private_ip
        label: Private IP Address
        kind: IPHost
        optional: true
        description: Primary private IP address
        order_weight: 2000
      - name: public_ip
        label: Public IP Address
        kind: IPHost
        optional: true
        description: Public IP address (if assigned)
        order_weight: 2100
    relationships:
      - name: availability_zone
        peer: TopologyCloudZone
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloudzone__instances"
        description: Availability zone where this instance runs
        order_weight: 1040
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud account owning this instance
        order_weight: 1050
      - name: network_segment
        peer: CloudNetworkSegment
        cardinality: one
        kind: Attribute
        optional: true
        description: Network segment where this instance is deployed
        order_weight: 1100
