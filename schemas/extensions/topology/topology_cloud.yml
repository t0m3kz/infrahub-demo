        cardinality: one
        optional: false
        order_weight: 700
      - name: physical_device
        peer: DcimDevice
        cardinality: one
        optional: true
        order_weight: 800
        description: "Physical device representing this customer gateway"
    uniqueness_constraints:
      - [account, name__value]

  - name: DirectConnect
    namespace: Cloud
