---
version: "1.0"
generics:
  - name: Resource
    namespace: Cloud
    description: Base for cloud resources with common metadata.
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 200
      - name: cloud_id
        kind: Text
        optional: true
        order_weight: 300
      - name: status
        kind: Dropdown
        optional: true
        order_weight: 400
        choices:
          - name: active
            label: Active
            description: Resource is active and operational.
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: Resource is being provisioned.
            color: "#7f7fff"
          - name: error
            label: Error
            description: Resource is in an error state.
            color: "#ff7f7f"
          - name: retired
            label: Retired
            description: Resource is retired and inactive.
            color: "#BFBFBF"

  - name: HybridAttachment
    namespace: Cloud
    description: "Cloud-side endpoint of a hybrid (on-prem/VRF) routing attachment — DX private VIF or VPN Gateway."
    include_in_menu: false

nodes:

  - name: Cloud
    namespace: Topology
    icon: mdi:cloud-outline
    inherit_from:
      - TopologyDeployment
    parent: TopologyLabel
    children: TopologyCloudRegion
    include_in_menu: false
    uniqueness_constraints:
      - ["name__value", "parent"]
    human_friendly_id:
      - name__value
    display_label: "{{ name__value|upper}} CLOUD"

  - name: CloudRegion
    namespace: Topology
    icon: mdi:earth
    inherit_from:
      - TopologyDeployment
    parent: TopologyCloud
    children: TopologyCloudZone
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value|upper }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    include_in_menu: false
    attributes:
      - name: status
        kind: Dropdown
        label: "Region Status"
        optional: true
        default_value: active
        order_weight: 300
        choices:
          - name: active
            label: Active
            description: "Region is active and operational"
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Region is being provisioned"
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Region is under maintenance"
            color: "#FFD27F"
          - name: constrained
            label: Constrained
            description: "Region has capacity constraints"
            color: "#F4CCCC"
          - name: deprecated
            label: Deprecated
            description: "Region is deprecated"
            color: "#BFBFBF"
    relationships:
      - name: location
        peer: LocationMetro
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1000
        identifier: "cloud__region__location"
        description: >
          Geographic location mapping for this region
      - name: direct_connects
        peer: CloudDirectConnect
        cardinality: many
        optional: true
        order_weight: 2000
        description: >
          Direct Connect / Dedicated Interconnect gateway for this region
      - name: vpn_gateways
        peer: CloudVPNGateway
        cardinality: many
        optional: true
        order_weight: 2050
        description: >
          VPN gateways attached to this region
      - name: virtual_networks
        peer: CloudVirtualNetwork
        cardinality: many
        kind: Generic
        optional: true
        identifier: "cloudregion__virtual_networks"
        order_weight: 2100
        description: "Virtual networks (VPC/VNet) deployed in this region"

  - name: CloudZone
    namespace: Topology
    icon: mdi:map-marker-outline
    inherit_from:
      - TopologyDeployment
    parent: TopologyCloudRegion
    label: Availability Zone
    children: ""
    human_friendly_id:
      - parent__name__value
      - name__value
    display_label: "{{ name__value|upper }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    include_in_menu: false
    relationships:
      - name: network_segments
        peer: CloudNetworkSegment
        cardinality: many
        kind: Generic
        optional: true
        identifier: "cloudnetworksegment__availability_zone"
        order_weight: 2000
        description: "Subnets deployed in this availability zone"
      - name: instances
        peer: CloudInstance
        cardinality: many
        kind: Generic
        optional: true
        identifier: "cloudzone__instances"
        order_weight: 2100
        description: "Instances running in this availability zone"

  - name: Account
    namespace: Cloud
    label: Cloud Account
    icon: mdi:account-key-outline
    description: Cloud account/subscription/project scoped to a provider.
    include_in_menu: false
    inherit_from:
      - CloudResource
      - CoreArtifactTarget
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [provider, account_id__value]
    attributes:
      - name: account_id
        kind: Text
        order_weight: 250
        optional: true
      - name: environment
        kind: Dropdown
        optional: true
        description: Environment classification of this account
        choices:
          - name: p
            label: Production
            description: Production workloads
            color: "#ff7f7f"
          - name: s
            label: Staging
            description: Pre-production staging environment
            color: "#ffd27f"
          - name: d
            label: Development
            description: Development and testing
            color: "#7fbf7f"
          - name: t
            label: Testing
            description: Testing environment
            color: "#D2B4DE"
          - name: n
            label: Non-Production
            description: Non-production environment
            color: "#A9DFBF"
        order_weight: 1400
      # What the account is FOR, in a hub-and-spoke landing zone. This is not
      # cosmetic: the change-risk check (docs/change_risk.md) treats any change
      # inside a `network` account as shared-fate by construction — that
      # account owns the Transit Gateway every other account transits — and
      # escalates it even when the local blast radius looks small. Without the
      # role there is no way to tell a hub account from a workload account
      # except by noticing it happens to own a TGW.
      - name: account_role
        kind: Dropdown
        label: "Account Role"
        optional: true
        order_weight: 1450
        description: "Function of this account within the landing zone"
        choices:
          - name: network
            label: Network
            description: Owns shared connectivity — transit gateways, DX, inspection
            color: "#9B59B6"
          - name: workload
            label: Workload
            description: Runs application workloads; a spoke of the network account
            color: "#3498DB"
          - name: security
            label: Security
            description: Logging, audit, and guardrail tooling
            color: "#E74C3C"
          - name: shared_services
            label: Shared Services
            description: DNS, directory, CI, artifact registries used by many spokes
            color: "#F39C12"
          - name: sandbox
            label: Sandbox
            description: Experimentation account, not expected to carry production traffic
            color: "#BFBFBF"
    relationships:
      - name: provider
        peer: OrganizationProvider
        cardinality: one
        optional: false
        order_weight: 600
      - name: owner
        peer: OrganizationEntity
        cardinality: one
        optional: true
        order_weight: 700

  - name: VirtualNetwork
    namespace: Cloud
    label: Virtual Network
    icon: mdi:cloud-braces
    description: Provider-agnostic virtual network container
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    display_label: "{{name__value}}"
    attributes:
      - name: is_shared
        kind: Boolean
        order_weight: 350
        optional: true
      - name: is_default
        label: Default VPC
        kind: Boolean
        default_value: false
        description: Whether this is the default VPC for the account/region
        order_weight: 1500
      - name: dns_support
        label: DNS Support
        kind: Boolean
        default_value: true
        description: Whether DNS resolution is enabled
        order_weight: 1600
      - name: dns_hostnames
        label: DNS Hostnames
        kind: Boolean
        default_value: false
        description: Whether DNS hostnames are enabled for instances
        order_weight: 1700
    relationships:
      - name: account
        peer: CloudAccount
        cardinality: one
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        order_weight: 650
        identifier: "cloudregion__virtual_networks"
      - name: cidr_blocks
        label: CIDR Blocks
        peer: IpamPrefix
        cardinality: many
        kind: Attribute
        optional: true
        description: IP address ranges (CIDR blocks) for this virtual network
        order_weight: 1800
      - name: network_segments
        peer: CloudNetworkSegment
        cardinality: many
        kind: Component
        optional: true
        description: Subnets within this virtual network
        order_weight: 2000
      - name: customer_deployment
        peer: TopologyCustomer
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "virtual_network__customer_deployments"
        description: "Customer deployment footprint this VPC belongs to."
        order_weight: 2100
      - name: instances
        peer: CloudInstance
        cardinality: many
        kind: Generic
        optional: true
        identifier: "virtual_network__instances"
        description: "Instances placed directly in this VPC (no subnet-level segment)."
        order_weight: 2200
    uniqueness_constraints:
      - [account, name__value]

  - name: NetworkSegment
    namespace: Cloud
    label: Network Segment
    icon: mdi:vector-square
    description: Network segment (subnet) within a virtual network.
    include_in_menu: false
    inherit_from:
      - CloudResource
      - ManagedNetworkSegment
    display_label: "{{name__value}}"
    attributes:
      - name: is_public
        kind: Boolean
        optional: true
        order_weight: 350
      - name: auto_assign_public_ip
        label: Auto-assign Public IP
        kind: Boolean
        default_value: false
        description: Automatically assign public IPs to instances in this subnet
        order_weight: 1500
      - name: segment_type
        kind: Dropdown
        optional: false
        order_weight: 250
        description: "Segmentation technology (cloud provider or on-prem)"
        choices:
          - name: aws_vpc_subnet
            label: AWS VPC Subnet
            description: "AWS VPC subnet"
            color: "#FF9900"
          - name: gcp_vpc_subnet
            label: GCP VPC Subnet
            description: "Google Cloud VPC subnet"
            color: "#4285F4"
          - name: azure_vnet_subnet
            label: Azure VNet Subnet
            description: "Azure Virtual Network subnet"
            color: "#0078D4"
      - name: cidr_block
        label: CIDR Block
        kind: Text
        optional: true
        description: "Provider-assigned subnet CIDR — not tracked in IPAM (VPC-internal, commonly overlaps across accounts)"  # yamllint disable-line rule:line-length
        order_weight: 1600
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Parent
        optional: false
        description: Virtual network containing this subnet
        order_weight: 1050
      - name: availability_zone
        peer: TopologyCloudZone
        cardinality: one
        optional: false
        order_weight: 1100
        identifier: "cloudnetworksegment__availability_zone"
      - name: tags
        peer: BuiltinTag
        optional: true
        cardinality: many
        kind: Attribute
        order_weight: 3000
      - name: customer_deployment
        peer: TopologyCustomer
        cardinality: one
        kind: Attribute
        order_weight: 1900
        optional: true
        identifier: "segment__customer_deployments"
        description: "Customer deployment footprint this cloud subnet belongs to."
    uniqueness_constraints:
      - [virtual_network, customer_name__value]

  - name: SecurityGroupRule
    namespace: Cloud
    description: "Security group rule — ingress or egress firewall rule within a cloud security group"
    label: Security Group Rule
    icon: mdi:file-document-edit-outline
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [security_group, name__value]
    attributes:
      - name: direction
        kind: Dropdown
        optional: true
        default_value: ingress
        order_weight: 1100
        choices:
          - name: ingress
            label: Ingress
            color: "#2ECC71"
          - name: egress
            label: Egress
            color: "#3498DB"
      - name: priority
        kind: Number
        optional: true
        order_weight: 1200
        description: "Rule priority — lower = higher priority (provider-specific semantics)"
      - name: protocol
        kind: Dropdown
        optional: true
        default_value: tcp
        order_weight: 1300
        choices:
          - name: tcp
            label: TCP
            color: "#3498DB"
          - name: udp
            label: UDP
            color: "#2ECC71"
          - name: icmp
            label: ICMP
            color: "#F39C12"
          - name: any
            label: Any
            color: "#9B59B6"
      - name: port_start
        kind: Number
        optional: true
        order_weight: 1400
        parameters:
          min_value: 1
          max_value: 65535
      - name: port_end
        kind: Number
        optional: true
        order_weight: 1500
        parameters:
          min_value: 1
          max_value: 65535
      - name: action
        kind: Dropdown
        optional: true
        default_value: allow
        order_weight: 1600
        choices:
          - name: allow
            label: Allow
            color: "#2ECC71"
          - name: deny
            label: Deny
            color: "#E74C3C"
      - name: log
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 1700
      - name: description
        kind: Text
        optional: true
        order_weight: 1800
      - name: disabled
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 1900
      - name: source_cidr
        kind: Text
        optional: true
        order_weight: 2000
        description: "Source CIDR for ingress rules (e.g. 10.0.0.0/8)"
      - name: dest_cidr
        kind: Text
        optional: true
        order_weight: 2100
        description: "Destination CIDR for egress rules"
    relationships:
      - name: security_group
        peer: CloudSecurityGroup
        cardinality: one
        kind: Parent
        optional: false
        order_weight: 1050
        identifier: "cloudsecuritygroup__rules"
        description: "Security group owning this rule"

  - name: SecurityGroup
    namespace: Cloud
    description: >-
      Security group defining network access rules.
      Maps to: AWS Security Group, GCP Firewall Rules, Azure NSG.
    label: Security Group
    icon: mdi:shield-lock
    menu_placement: CloudResource
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [virtual_network, name__value]
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: false
        description: Virtual network this security group belongs to
        order_weight: 1050
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud account owning this security group
        order_weight: 1100
      - name: rules
        peer: CloudSecurityGroupRule
        label: Rules
        cardinality: many
        kind: Component
        optional: true
        order_weight: 1200
        identifier: "cloudsecuritygroup__rules"
        description: "Ingress/egress rules for this security group"

  # --------------------  Compute Instance  --------------------
  - name: Instance
    namespace: Cloud
    description: Virtual machine or compute instance.
    label: Compute Instance
    icon: mdi:server
    menu_placement: CloudResource
    include_in_menu: false
    inherit_from:
      - CloudResource
      - DcimCapabilities
      - AppInstance
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [account, cloud_id__value]
    attributes:
      - name: instance_type
        label: Instance Type
        kind: Text
        optional: true
        description: Instance size/type (e.g., t3.micro, n1-standard-1)
        order_weight: 1500
      - name: image
        label: Image
        kind: Text
        optional: true
        description: Machine image or AMI used for this instance
        order_weight: 1550
      - name: cpu_count
        label: vCPU Count
        kind: Number
        optional: true
        description: Number of virtual CPUs
        order_weight: 1600
      - name: memory_gb
        label: Memory (GB)
        kind: Number
        optional: true
        description: Memory size in gigabytes
        order_weight: 1700
      - name: root_volume_size_gb
        label: Root Volume Size (GB)
        kind: Number
        optional: true
        description: Size of the root/boot volume in gigabytes
        order_weight: 1800
      - name: os_type
        label: Operating System
        kind: Dropdown
        optional: true
        description: Operating system type
        choices:
          - name: linux
            label: Linux
            description: Linux-based operating system
            color: "#ffc61a"
          - name: windows
            label: Windows
            description: Windows operating system
            color: "#0078D4"
          - name: other
            label: Other
            description: Other operating system
            color: "#808080"
        order_weight: 1900
      - name: private_ip
        label: Private IP Address
        kind: IPHost
        optional: true
        description: Primary private IP address
        order_weight: 2000
      - name: public_ip
        label: Public IP Address
        kind: IPHost
        optional: true
        description: Public IP address (if assigned)
        order_weight: 2100
    relationships:
      - name: availability_zone
        peer: TopologyCloudZone
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "cloudzone__instances"
        description: Availability zone where this instance runs
        order_weight: 1040
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud account owning this instance
        order_weight: 1050
      - name: network_segment
        peer: CloudNetworkSegment
        cardinality: one
        kind: Attribute
        optional: true
        description: Network segment where this instance is deployed
        order_weight: 1100
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "virtual_network__instances"
        description: "VPC this instance runs in — set directly when the instance has no subnet-level network_segment."  # yamllint disable-line rule:line-length
        order_weight: 1120
      - name: security_groups
        peer: CloudSecurityGroup
        cardinality: many
        kind: Attribute
        optional: true
        description: Security groups attached to this instance
        order_weight: 2200

  # --------------------  Internet Gateway  --------------------
  - name: InternetGateway
    namespace: Cloud
    description: Internet gateway for public internet connectivity.
    label: Internet Gateway
    icon: mdi:web
    menu_placement: CloudResource
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [virtual_network, name__value]
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: false
        description: Virtual network this gateway is attached to
        order_weight: 1050
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud account owning this gateway
        order_weight: 1100

  # --------------------  NAT Gateway  --------------------
  - name: NATGateway
    namespace: Cloud
    description: >
      NAT gateway for outbound internet from private subnets.
      Maps to AWS, Azure, GCP Cloud NAT.
    label: NAT Gateway
    icon: mdi:router-network
    menu_placement: CloudResource
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [virtual_network, name__value]
    attributes:
      - name: public_ip
        label: Public IP Address
        kind: IPHost
        optional: true
        description: Public IP address of the NAT gateway
        order_weight: 1400
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: false
        description: Virtual network this NAT gateway belongs to
        order_weight: 1050
      - name: network_segments
        peer: CloudNetworkSegment
        cardinality: many
        kind: Attribute
        optional: false
        description: Subnets served by this NAT gateway
        order_weight: 1100
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud account owning this NAT gateway
        order_weight: 1150

  # --------------------  Route Table  --------------------
  - name: RouteTable
    namespace: Cloud
    description: >-
      Route table defining network routing rules.
      Maps to: AWS Route Table, GCP Routes, Azure Route Table.
    label: Route Table
    icon: mdi:routes
    include_in_menu: false
    menu_placement: CloudResource
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [virtual_network, name__value]
    attributes:
      - name: is_main
        label: Main Route Table
        kind: Boolean
        default_value: false
        description: Whether this is the main/default route table for the VPC
        order_weight: 1400
    relationships:
      - name: virtual_network
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: false
        description: Virtual network this route table belongs to
        order_weight: 1050
      - name: network_segments
        peer: CloudNetworkSegment
        cardinality: many
        kind: Attribute
        optional: true
        description: Network segments associated with this route table
        order_weight: 2000

  # --------------------  Public/Static IP  --------------------
  - name: PublicIP
    namespace: Cloud
    description: Static/elastic public IP address.
    label: Public IP
    icon: mdi:ip-network-outline
    menu_placement: CloudResource
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [account, public_ip__value]
    attributes:
      - name: public_ip
        label: Public IP Address
        kind: IPHost
        description: The static public IP address
        order_weight: 1500
    relationships:
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud region where this elastic IP resides
        order_weight: 1040
      - name: account
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        description: Cloud account owning this Public IP
        order_weight: 1050
      - name: instance
        peer: CloudInstance
        cardinality: one
        kind: Attribute
        optional: true
        description: Instance this IP is associated with
        order_weight: 1700

  - name: Route
    namespace: Cloud
    label: Route
    icon: mdi:transit-connection-horizontal
    description: Route entry within a route table.
    include_in_menu: false
    inherit_from:
      - CloudResource
    relationships:
      - name: route_table
        peer: CloudRouteTable
        cardinality: one
        optional: false
        order_weight: 600
      - name: destination
        peer: IpamPrefix
        cardinality: one
        optional: false
        order_weight: 650
      - name: internet_gateway
        peer: CloudInternetGateway
        cardinality: one
        optional: true
        order_weight: 700
      - name: nat_gateway
        peer: CloudNATGateway
        cardinality: one
        optional: true
        order_weight: 750
      - name: instance
        peer: CloudInstance
        cardinality: one
        optional: true
        order_weight: 800
    uniqueness_constraints:
      - [route_table, destination]


  - name: TransitGateway
    namespace: Cloud
    label: Transit Gateway
    icon: mdi:transit-connection-horizontal
    description: Multi-region virtual network transit hub for routing.
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    attributes:
      - name: default_route_table
        kind: Boolean
        label: "Default Route Table Association"
        optional: true
        default_value: true
        order_weight: 350
      - name: dns_support
        kind: Boolean
        label: "DNS Support"
        optional: true
        default_value: true
        order_weight: 400
      - name: vpn_ecmp_support
        kind: Boolean
        label: "VPN ECMP Support"
        optional: true
        default_value: false
        order_weight: 450
    relationships:
      - name: asn
        peer: RoutingAutonomousSystem
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 350
      - name: account
        peer: CloudAccount
        cardinality: one
        optional: false
        order_weight: 600
      - name: region
        peer: TopologyCloudRegion
        cardinality: one
        optional: false
        order_weight: 650
      - name: attached_virtual_networks
        peer: CloudVirtualNetwork
        cardinality: many
        optional: true
        order_weight: 700
        description: "Virtual networks attached to this transit gateway"
    uniqueness_constraints:
      - [account, name__value]

  # ── Transit Gateway routing domains and attachments ───────────────────────
  # `attached_virtual_networks` above is a flat list: it says a VPC hangs off
  # this hub and nothing else. That is enough to draw a picture and not enough
  # to reason about a change, because it cannot express the two facts that
  # decide blast radius in a hub-and-spoke cloud:
  #
  #   1. WHICH ACCOUNT owns the attachment. The attachment resource lives in
  #      the spoke account while the Transit Gateway lives in the network
  #      account; a change in one is not a change in the other.
  #   2. WHICH ROUTING DOMAIN it joins. Two spokes on separate route tables
  #      cannot reach each other at all.
  #
  # Without (2) every spoke looks like it reaches every other spoke, so a
  # blast-radius answer computed off the flat list is "everything" — which is
  # the same as no answer. See docs/change_risk.md.

  - name: TransitGatewayRouteTable
    namespace: Cloud
    label: Transit Gateway Route Table
    icon: mdi:routes
    description: "Routing domain inside a Transit Gateway — the unit of spoke-to-spoke isolation"
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [transit_gateway, name__value]
    attributes:
      - name: is_default
        kind: Boolean
        label: "Default Route Table"
        optional: true
        default_value: false
        order_weight: 350
        description: "Route table new attachments join when not told otherwise"
    relationships:
      - name: transit_gateway
        label: "Transit Gateway"
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway__route_tables"
        order_weight: 600
        description: "Transit Gateway this route table belongs to"
      # "Who else is in this routing domain" is the blast-radius question for a
      # cloud change, and it is answered by the PROPAGATION set, not the
      # association set: association says where a spoke's own lookups happen,
      # propagation says whose lookups can see the spoke.
      - name: associated_attachments
        label: "Associated Attachments"
        peer: CloudTransitGatewayAttachment
        cardinality: many
        optional: true
        identifier: "transit_gateway_attachment__associated_route_table"
        order_weight: 700
        description: "Attachments whose outbound lookups resolve in this route table"
      - name: propagated_attachments
        label: "Propagated Attachments"
        peer: CloudTransitGatewayAttachment
        cardinality: many
        optional: true
        identifier: "transit_gateway_attachment__propagated_route_tables"
        order_weight: 800
        description: "Attachments advertising their prefixes into this route table"

  - name: TransitGatewayAttachment
    namespace: Cloud
    label: Transit Gateway Attachment
    icon: mdi:transit-connection-variant
    description: "One spoke's connection into a Transit Gateway"
    include_in_menu: false
    inherit_from:
      - CloudResource
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }} ({{ attachment_type__value }})"
    uniqueness_constraints:
      - [transit_gateway, name__value]
    attributes:
      - name: attachment_type
        kind: Dropdown
        label: "Attachment Type"
        order_weight: 300
        optional: false
        choices:
          - name: vpc
            label: "VPC"
            description: Spoke virtual network attached via ENIs, one subnet per zone
            color: "#3498DB"
          - name: hybrid
            label: "Hybrid (DX / VPN)"
            description: On-premises attachment via a transit VIF or VPN gateway
            color: "#F39C12"
          - name: connect
            label: "Connect (GRE)"
            description: GRE/BGP attachment, typically an SD-WAN appliance
            color: "#2ECC71"
    relationships:
      - name: transit_gateway
        label: "Transit Gateway"
        peer: CloudTransitGateway
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway__attachments"
        order_weight: 600
        description: "Transit Gateway this attachment lands on"
      # For a cross-account attachment this is the SPOKE account, not the
      # Transit Gateway's account. That asymmetry is why the attachment is a
      # node: it is the only place a per-spoke fact can be recorded.
      - name: owner_account
        label: "Owner Account"
        peer: CloudAccount
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "transit_gateway_attachment__owner_account"
        order_weight: 650
        description: "Account the attachment itself lives in (the spoke, when cross-account)"
      - name: virtual_network
        label: "Virtual Network"
        peer: CloudVirtualNetwork
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "transit_gateway_attachment__virtual_network"
        order_weight: 700
        description: "Spoke virtual network — set when attachment_type is vpc"
      # Fewer entries than the virtual network has zones means the attachment
      # is single-zone, which the risk check reports as its own finding.
      - name: network_segments
        label: "Attachment Subnets"
        peer: CloudNetworkSegment
        cardinality: many
        optional: true
        identifier: "transit_gateway_attachment__network_segments"
        order_weight: 750
        description: "Subnets hosting the attachment interfaces, one per zone"
      # One relationship for both hybrid endpoint kinds rather than a separate
      # direct_connect/vpn pair — CloudHybridAttachment is the generic that
      # CloudVirtualInterface and CloudVPNGateway already share.
      - name: hybrid_endpoint
        label: "Hybrid Endpoint"
        peer: CloudHybridAttachment
        kind: Generic
        cardinality: one
        optional: true
        identifier: "transit_gateway_attachment__hybrid_endpoint"
        order_weight: 800
        description: "Transit VIF or VPN gateway — set when attachment_type is hybrid"
      - name: associated_route_table
        label: "Associated Route Table"
        peer: CloudTransitGatewayRouteTable
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "transit_gateway_attachment__associated_route_table"
        order_weight: 850
        description: "Route table resolving traffic leaving this spoke"
      # Association and propagation are separate on purpose: a spoke that
      # associates to a shared table but propagates nowhere can reach its peers
      # and cannot be reached by them. Collapsing them hides exactly that case.
      - name: propagates_to_route_tables
        label: "Propagates Into"
        peer: CloudTransitGatewayRouteTable
        cardinality: many
        optional: true
        identifier: "transit_gateway_attachment__propagated_route_tables"
        order_weight: 900
        description: "Route tables this spoke's prefixes are advertised into — who can reach it"

  - name: VPNGateway
    namespace: Cloud
    label: VPN Gateway
    icon: mdi:shield-link-variant
    description: VPN gateway for site-to-site and client VPN connections.
    include_in_menu: false
    human_friendly_id:
      - name__value
    inherit_from:
      - CloudResource
      - CloudHybridAttachment
    attributes:
      - name: vpn_type
        kind: Dropdown
        order_weight: 300
        optional: false
        choices:
          - name: site_to_site
            label: Site-to-Site
            description: IPsec VPN between sites
            color: "#3498DB"
          - name: client_vpn
            label: Client VPN
            description: Remote access VPN for clients
            color: "#2ECC71"
    relationships:
      - name: asn
