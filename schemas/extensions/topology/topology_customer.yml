---
version: "1.0"

# ============================================================================
# TopologyCustomer — a customer's deployment footprint inside an existing
# topology deployment (DC, Colocation, or Cloud).
#
# One shared generic (TopologyCustomer) carries the common field (owner), and
# one concrete node per parent deployment type (CustomerDC, CustomerColocation,
# CustomerCloud) sets parent: to that specific deployment kind, so the
# hierarchy is explicit in the schema rather than relying on the bare-generic
# TopologyDeployment parent trick (confirmed valid via `infrahubctl schema
# check`, but less self-documenting than naming the concrete parent per node).
#
# `environment` is deliberately NOT on TopologyCustomer: only the footprints
# that pick a shared namespace/zone by environment carry it (CustomerDC and
# CustomerColocation, through TopologyEnvironmentScoped). A cloud footprint
# reads the environment of its CloudAccount, and an office is always PROD.
#
# TopologyCustomerTemplate is a second, unrelated generic: a reusable
# service-tier blueprint, not part of the topology hierarchy (no parent/
# children). A CustomerDC references one as its `design`.
# ============================================================================

generics:
  - name: Customer
    namespace: Topology
    description: "A customer's deployment footprint within a parent topology deployment (DC, Colocation, or Cloud)"  # yamllint disable-line rule:line-length
    label: "Customer Deployment"
    icon: "mdi:account-network-outline"
    include_in_menu: false
    hierarchical: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    # No [owner, environment] constraint here: Infrahub enforces a generic's
    # constraint across every implementing kind, which would allow a customer
    # only one footprint per environment in total (e.g. block C005-P-FR next to
    # C005-P-DC10). Each concrete node is unique on [name, parent, ...] instead
    # (DC/Colocation add environment): one footprint per facility and
    # environment. The generic's own name template is a placeholder; every
    # concrete node overrides `name` with its own.
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}"
        read_only: true
        optional: false

      - name: infrastructure_orchestrator
        kind: Dropdown
        label: "Infrastructure Orchestrator"
        description: "Primary automation system used to provision infrastructure for this deployment"
        optional: false
        default_value: manual
        order_weight: 350
        choices:
          - name: ansible_automation_platform
            label: "Ansible Automation Platform"
            color: "#EE0000"
          - name: github_actions
            label: "GitHub Actions"
            color: "#24292F"
          - name: terraform
            label: "Terraform / OpenTofu"
            color: "#7B42BC"
          - name: argocd
            label: "Argo CD"
            color: "#EF7B4D"
          - name: manual
            label: "Manual"
            color: "#808080"

    relationships:
      - name: owner
        peer: OrganizationEntity
        label: "Owner"
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 150
        identifier: "topology_customer__owner"
        description: "Customer or provider this footprint belongs to (e.g.
          an operator's own hub PoP has a Provider owner)."

  # Carried by the footprints whose environment decides where they live: the
  # shared namespace, PROD-ZONE and the PROD firewall leg (CustomerDC,
  # CustomerColocation). CustomerCloud (environment comes from its
  # CloudAccount) and CustomerOffice (always PROD) must not have it. Readers
  # reach it with `... on TopologyEnvironmentScoped { environment { value } }`.
  # No hfid or uniqueness here: it carries one attribute and is never a
  # relationship peer; each concrete node constrains [name, parent, environment].
  - name: EnvironmentScoped
    namespace: Topology
    description: "Marker for customer footprints that state the environment they represent (DC, Colocation)"  # yamllint disable-line rule:line-length
    label: "Environment-Scoped Footprint"
    include_in_menu: false
    attributes:
      # Required with no default: `p` silently means the PROD namespace,
      # PROD-ZONE and the PROD firewall leg, so every footprint states it.
      - name: environment
        kind: Dropdown
        description: "Environment this customer deployment footprint represents"
        optional: false
        order_weight: 200
        choices:
          - name: p
            label: Production
            color: "#A9CCE3"
          - name: n
            label: Non-Production
            color: "#A9DFBF"
          - name: s
            label: Staging
            color: "#FFA500"
          - name: d
            label: Development
            color: "#7f7fff"
          - name: t
            label: Testing
            color: "#D2B4DE"

  # Naming convention for template rows: {SIZE}_{TYPE} (S_DC, M_DC, L_DC,
  # XL_DC) — S and M use the shared firewall/load balancer capacity, L and XL
  # are dedicated. The name is a label only; the generators and checks read the
  # flags and numbers the template carries.
  - name: CustomerTemplate
    namespace: Topology
    description: "Reusable service-tier blueprint for a customer deployment: dedicated devices and entitlements"
    label: "Customer Deployment Template"
    icon: "mdi:account-network"
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 100

      - name: description
        kind: Text
        optional: true
        order_weight: 150

      - name: dedicated_firewall
        kind: Boolean
        label: "Dedicated Firewall"
        description: "Per-customer dedicated firewall instead of shared multi-tenant firewall capacity"
        optional: true
        default_value: false
        order_weight: 300

      - name: dedicated_loadbalancer
        kind: Boolean
        label: "Dedicated Load Balancer"
        description: "Per-customer dedicated load balancer instead of shared LB service"
        optional: true
        default_value: false
        order_weight: 310

nodes:
  - name: CustomerDC
    namespace: Topology
    description: "Customer deployment footprint inside a data center"
    label: "Customer (Data Center)"
    icon: "mdi:account-server-outline"
    inherit_from:
      - CoreArtifactTarget
      - TopologyCustomer
      - TopologyEnvironmentScoped
      - TopologyDeployment
      - TopologyConnectableLocation
      - ManagedTenantScoped
    parent: TopologyDataCenter
    children: ""
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent", "environment__value"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ environment__value|upper }}-{{ parent__name__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: false
    relationships:
      - name: design
        peer: TopologyCustomerTemplateDC
        label: "DC Design"
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 200

  - name: CustomerColocation
    namespace: Topology
    description: "Customer deployment footprint inside a colocation metro"
    label: "Customer (Colocation)"
    icon: "mdi:account-building-outline"
    inherit_from:
      - CoreArtifactTarget
      - TopologyCustomer
      - TopologyEnvironmentScoped
      - TopologyDeployment
      - TopologyConnectableLocation
      - ManagedTenantScoped
    parent: TopologyColocationMetro
    children: ""
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent", "environment__value"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ environment__value|upper }}-{{ parent__name__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: false

  # A customer's office: exactly one per customer, directly under TopologyLabel
  # ("Campus and Office") with no grouping node in between. Not a
  # TopologyCustomer: an office is always PROD (its prefixes live in the PROD
  # namespace), so it has no environment, and it carries its own `owner`.
  # Circuits terminate on this footprint (TopologyConnectableLocation), never
  # on a shared grouping node. `locations` is the building(s) it occupies; the
  # devices and cables belong to the footprint.
  - name: CustomerOffice
    namespace: Topology
    description: "A customer's office footprint (always production)"
    label: "Customer (Office)"
    icon: "mdi:office-building-outline"
    inherit_from:
      - CoreArtifactTarget
      - TopologyDeployment
      - TopologyPhysicalDeployment
      - TopologyDeviceHosting
      - TopologyDeviceNaming
      - TopologySegmentHosting
      - TopologyConnectableLocation
    parent: TopologyLabel
    children: ""
    include_in_menu: false
    # name__value, like CustomerDC's and CustomerColocation's: a relationship
    # whose peer is the TopologyDeployment generic resolves references against
    # the *generic's* hfid — a single name__value — so a device can say
    # `deployment: "C001-OFFICE"`.
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    # One office per customer. The name embeds the owner's org_id, so the
    # constraint holds without naming the (mandatory but relationship) owner.
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-OFFICE"
        read_only: true
        optional: false
      - name: infrastructure_orchestrator
        kind: Dropdown
        label: "Infrastructure Orchestrator"
        description: "Primary automation system used to provision infrastructure for this deployment"
        optional: false
        default_value: manual
        order_weight: 350
        choices:
          - name: ansible_automation_platform
            label: "Ansible Automation Platform"
            color: "#EE0000"
          - name: github_actions
            label: "GitHub Actions"
            color: "#24292F"
          - name: terraform
            label: "Terraform / OpenTofu"
            color: "#7B42BC"
          - name: argocd
            label: "Argo CD"
            color: "#EF7B4D"
          - name: manual
            label: "Manual"
            color: "#808080"
      - name: site_type
        kind: Dropdown
        optional: true
        default_value: branch
        order_weight: 400
        choices:
          - name: hq
            label: Headquarters
            color: "#2ECC71"
          - name: regional
            label: Regional Office
            color: "#3498DB"
          - name: branch
            label: Branch Office
            color: "#7F7FBF"
          - name: campus
            label: Campus
            color: "#F39C12"
      # SD-WAN branch-to-branch mesh capability. Deliberately NOT a per-tunnel
      # object — dynamic mesh tunnels are negotiated on demand by the data
      # plane once enabled; modeling one object per potential edge pair would
      # be an O(N^2) blow-up for something that isn't a design decision at
      # all, the same reason SecurityTagRule expresses intent as tier-to-tier
      # rules rather than per-host-pair firewall rules (see
      # schemas/extensions/security/security_tags.yml). One Dropdown per
      # office is the whole knob — only meaningful once sdwan_gateway below
      # is also set.
      - name: branch_to_branch
        kind: Dropdown
        label: "Branch-to-Branch"
        description: "Dynamic mesh tunnel capability for this office's SD-WAN edge"
        optional: true
        default_value: hub_only
        order_weight: 450
        choices:
          - name: full_mesh
            label: "Full Mesh"
            description: "May build a dynamic tunnel directly to any other edge"
            color: "#2ECC71"
          - name: hub_only
            label: "Hub Only"
            description: "All traffic transits the gateway — no direct edge-to-edge tunnels"
            color: "#95A5A6"
          - name: on_demand
            label: "On Demand"
            description: "Direct edge-to-edge tunnels build dynamically once demand crosses a threshold"  # yamllint disable-line rule:line-length
            color: "#3498DB"
    relationships:
      - name: owner
        peer: OrganizationEntity
        label: "Owner"
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 150
        identifier: "customer_office__owner"
        description: "Customer or provider this office belongs to"
      - name: locations
        peer: LocationFacility
        cardinality: many
        kind: Attribute
        optional: false
        identifier: "office__locations"
        order_weight: 1000
        description: "Building locations backing this customer's office footprint
          (single for branch/regional, multiple for HQ/campus)"
      # On the per-tenant footprint, not on the office location: one building
      # can host several tenants. The SD-WAN VRF handoff's inbound
      # prefix-list is built from these.
      - name: lan_prefixes
        peer: IpamPrefix
        label: "LAN Prefixes"
        description: "Office LAN prefixes this footprint owns, registered in the PROD namespace"
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "customer_office__lan_prefixes"
        order_weight: 1150
      - name: sdwan_gateway
        peer: DcimDevice
        label: "SD-WAN Gateway"
        description: "Gateway device to attach to — presence opts this office into automated SD-WAN edge provisioning"  # yamllint disable-line rule:line-length
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "customer_office__sdwan_gateway"
        order_weight: 1200
      # The office's own switching fabric, the opt-in of add_office_fabric
      # (generators/topology/office_fabric.py): the same intent surface as a
      # colocation metro's fabric_templates ("2 x distribution-switch on template
      # X"), validated against the campus roles only. Absent means the office has
      # no fabric and the generator no-ops, as add_sdwan_edge does without a
      # gateway.
      - name: fabric_templates
        peer: TopologyElement
        label: "Office Fabric Elements"
        description: "Access-switch and distribution-switch templates for this office's own LISP fabric (opts the office into add_office_fabric)"  # yamllint disable-line rule:line-length
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "customer_office__fabric_templates"
        order_weight: 1250
      # LISP map-servers authenticate registrations from the edge ETRs with one
      # shared site key, so it is identical across the office fabric. The
      # office-fabric generator creates it and attaches it here; the config
      # transforms and the lisp_fabric check read it.
      - name: lisp_site_key
        label: LISP Site Key
        peer: RoutingPassword
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "customer_office__lisp_site_key"
        order_weight: 1300
        description: "Authentication key shared by this office fabric's LISP map-servers and edge ETRs; set by the office-fabric generator"  # yamllint disable-line rule:line-length


  - name: CustomerCloud
    namespace: Topology
    description: "Customer deployment footprint inside a cloud region"
    label: "Customer (Cloud)"
    icon: "mdi:account-cloud-outline"
    inherit_from:
      - CoreArtifactTarget
      - TopologyCustomer
      - TopologyDeployment
      - TopologyConnectableLocation
    parent: TopologyCloudRegion
    children: ""
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    # No environment: a cloud footprint's environment is its CloudAccount's
    # (CloudAccount.environment), which its segments and resources reference.
    uniqueness_constraints:
      - ["name__value", "parent"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ customer_name__value|upper }}-{{ parent__name__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: false
      - name: customer_name
        kind: Text
        optional: false
        order_weight: 100

  # The DC customer's service tier, referenced by a CustomerDC's `design`.
  # Naming convention {SIZE}_DC: S and M share the firewall/load balancer
  # capacity, L and XL are dedicated. The numbers below live once, in the
  # template rows (data/bootstrap/21_customer_templates.yml), and are
  # enforced by checks/customer_quota.py; the dedicated flags are read by
  # generators/firewall_context.py.
  - name: CustomerTemplateDC
    namespace: Topology
    description: "Data center customer service tier: dedicated devices, segment quota, port entitlement (S/M shared, L/XL dedicated)"  # yamllint disable-line rule:line-length
    label: "Customer Template (Data Center)"
    icon: "mdi:file-document-edit-outline"
    inherit_from:
      - TopologyCustomerTemplate
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      # Network-segment quota of the footprint, enforced by
      # checks/customer_quota.py (an ERROR above the limit; not used for
      # sizing). A footprint without `design` is not metered.
      - name: max_segments
        kind: Number
        label: "Max Segments"
        description: "Network-segment quota of the footprint, enforced by checks/customer_quota.py; no `design` means not metered"  # yamllint disable-line rule:line-length
        optional: false
        min_value: 1
        order_weight: 320
      # ports_<speed>g: number of host-facing leaf/access ports of that speed
      # the customer may have tagged with its segments; 0 = none of this speed
      # allowed. Enforced by checks/customer_quota.py; a footprint without
      # `design` is not metered. One attribute per server-NIC speed in the
      # model: the server device types carry 25G and 100G NICs only
      # (utils/interface_speed.py derives the speed from interface_type).
      - name: ports_25g
        kind: Number
        label: "25G Ports"
        description: "Host-facing leaf/access ports of this speed the customer may tag with its segments; 0 = none allowed"  # yamllint disable-line rule:line-length
        optional: false
        min_value: 0
        order_weight: 330
      - name: ports_100g
        kind: Number
        label: "100G Ports"
        description: "Host-facing leaf/access ports of this speed the customer may tag with its segments; 0 = none allowed"  # yamllint disable-line rule:line-length
        optional: false
        min_value: 0
        order_weight: 340

extensions:
  nodes:
    - kind: CloudInstance
      relationships:
        - name: node_pool
          peer: VirtNodePool
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "virt_pool__instances"
          description: "Node pool / ASG that manages this instance."
          order_weight: 2600

    - kind: OrganizationCustomer
      relationships:
        - name: deployments
          label: Topology Deployments
          kind: Generic
          cardinality: many
          optional: true
          peer: TopologyCustomer
          identifier: "topology_customer__owner"
          description: "All topology deployments owned by this customer"
          order_weight: 2000
