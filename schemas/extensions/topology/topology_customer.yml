---
version: "1.0"

# ============================================================================
# TopologyCustomer — a customer's deployment footprint inside an existing
# topology deployment (DC, Colocation, or Cloud).
#
# One shared generic (TopologyCustomer) carries the common fields (owner,
# environment, status, namespace), and one concrete node per parent
# deployment type (CustomerDC, CustomerColocation, CustomerCloud) sets
# parent: to that specific deployment kind, so the hierarchy is explicit
# in the schema rather than relying on the bare-generic TopologyDeployment
# parent trick (confirmed valid via `infrahubctl schema check`, but less
# self-documenting than naming the concrete parent per node).
#
# TopologyCustomerTemplate is a second, unrelated generic: a reusable
# boarding blueprint, not part of the topology hierarchy (no parent/
# children) — it carries the defaults a boarding generator applies when
# instantiating a CustomerDC/CustomerColocation/CustomerCloud.
# ============================================================================

generics:
  - name: Customer
    namespace: Topology
    description: "A customer's deployment footprint within a parent topology deployment (DC, Colocation, or Cloud)"  # yamllint disable-line rule:line-length
    label: "Customer Deployment"
    icon: "mdi:account-network-outline"
    include_in_menu: false
    hierarchical: false
    human_friendly_id:
      - owner__org_id__value
      - environment__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["owner", "environment__value"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ environment__label|upper }}"
        read_only: true
        optional: false

      - name: environment
        kind: Dropdown
        description: "Environment this customer deployment footprint represents"
        optional: true
        default_value: p
        order_weight: 200
        choices:
          - name: p
            label: Production
            color: "#A9CCE3"
          - name: n
            label: Non-Production
            color: "#A9DFBF"
          - name: s
            label: Staging
            color: "#FFA500"
          - name: d
            label: Development
            color: "#7f7fff"
          - name: t
            label: Testing
            color: "#D2B4DE"

      - name: status
        kind: Dropdown
        optional: true
        default_value: active
        order_weight: 300
        choices:
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"

    relationships:
      - name: owner
        peer: OrganizationEntity
        label: "Owner"
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 150
        identifier: "topology_customer__owner"
        description: "Customer or provider this footprint belongs to (e.g.
          an operator's own hub PoP has a Provider owner)."
      - name: namespace
        peer: BuiltinIPNamespace
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "topology_customer__namespace"
        order_weight: 160
        description: "IPAM namespace (= VRF). Set on hub footprints (e.g.
          the operator's own SD-WAN PoP) to make them an ExchangeGateway
          side."

  - name: CustomerTemplate
    namespace: Topology
    description: "Reusable boarding blueprint for a customer deployment"
    label: "Customer Deployment Template"
    icon: "mdi:account-network"
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 100

      - name: description
        kind: Text
        optional: true
        order_weight: 150

      - name: default_environment
        kind: Dropdown
        description: "Environment applied to deployments created from this template"
        optional: true
        default_value: p
        order_weight: 200
        choices:
          - name: p
            label: Production
            color: "#A9CCE3"
          - name: n
            label: Non-Production
            color: "#A9DFBF"
          - name: s
            label: Staging
            color: "#FFA500"
          - name: d
            label: Development
            color: "#7f7fff"
          - name: t
            label: Testing
            color: "#D2B4DE"

      - name: size
        kind: Dropdown
        label: "Size"
        description: "T-shirt size label for this template's capacity tier (naming convention only — does not drive defaults)"  # yamllint disable-line rule:line-length
        optional: true
        default_value: s
        order_weight: 250
        choices:
          - name: s
            label: Small
            description: "Shared firewall/LB/proxy, single network segment"
            color: "#A9DFBF"
          - name: m
            label: Medium
            description: "Shared firewall/LB/proxy, a few network segments"
            color: "#A9CCE3"
          - name: l
            label: Large
            description: "Dedicated firewall and/or LB, several network segments"
            color: "#FFA500"
          - name: xl
            label: Extra Large
            description: "Dedicated firewall, LB, and proxy; many network segments"
            color: "#BF7F7F"

      - name: dedicated_firewall
        kind: Boolean
        label: "Dedicated Firewall"
        description: "Per-customer dedicated firewall instead of shared multi-tenant firewall capacity"
        optional: true
        default_value: false
        order_weight: 300

      - name: dedicated_loadbalancer
        kind: Boolean
        label: "Dedicated Load Balancer"
        description: "Per-customer dedicated load balancer instead of shared LB service"
        optional: true
        default_value: false
        order_weight: 310

      - name: dedicated_proxy
        kind: Boolean
        label: "Dedicated Proxy"
        description: "Per-customer dedicated proxy instead of shared proxy capacity"
        optional: true
        default_value: false
        order_weight: 320

      - name: network_segment_count
        kind: Number
        label: "Network Segments"
        description: "Number of network segments to provision for this customer deployment"
        optional: true
        default_value: 1
        order_weight: 330
        parameters:
          min_value: 1

nodes:
  - name: CustomerDC
    namespace: Topology
    description: "Customer deployment footprint inside a data center"
    label: "Customer (Data Center)"
    icon: "mdi:account-server-outline"
    inherit_from:
      - TopologyCustomer
      - TopologyDeployment
      - TopologyClusterHosting
      - TopologyConnectableLocation
    parent: TopologyDataCenter
    children: ""
    include_in_menu: false
    human_friendly_id:
      - owner__org_id__value
      - environment__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ environment__value|upper }}-{{ parent__name__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: true
    relationships:
      - name: design
        peer: TopologyCustomerTemplateDC
        label: "DC Design"
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 200

  - name: CustomerColocation
    namespace: Topology
    description: "Customer deployment footprint inside a colocation metro"
    label: "Customer (Colocation)"
    icon: "mdi:account-building-outline"
    inherit_from:
      - TopologyCustomer
      - TopologyDeployment
      - TopologyClusterHosting
      - TopologyConnectableLocation
    parent: TopologyColocationMetro
    children: ""
    include_in_menu: false
    human_friendly_id:
      - owner__org_id__value
      - environment__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ environment__value|upper }}-{{ parent__name__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: true

  - name: CustomerOffice
    namespace: Topology
    description: "Customer deployment footprint inside an office building"
    label: "Customer (Office)"
    icon: "mdi:office-building-outline"
    inherit_from:
      - TopologyDeployment
      - TopologyClusterHosting
      - TopologyPhysicalDeployment
      - TopologyDeviceHosting
      - TopologyConnectableLocation
    parent: TopologyOfficeCustomer
    children: ""
    include_in_menu: false
    human_friendly_id:
      - parent__name__value
      - environment__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ parent__name__value|upper }}-{{ environment__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: true
      - name: environment
        kind: Dropdown
        description: "Environment this customer deployment footprint represents"
        optional: true
        default_value: p
        order_weight: 200
        choices:
          - name: p
            label: Production
            color: "#A9CCE3"
          - name: n
            label: Non-Production
            color: "#A9DFBF"
          - name: s
            label: Staging
            color: "#FFA500"
          - name: d
            label: Development
            color: "#7f7fff"
          - name: t
            label: Testing
            color: "#D2B4DE"
      - name: status
        kind: Dropdown
        optional: true
        default_value: active
        order_weight: 300
        choices:
          - name: active
            label: Active
            color: "#7fbf7f"
          - name: provisioning
            label: Provisioning
            color: "#ffff7f"
          - name: decommissioned
            label: Decommissioned
            color: "#bfbfbf"
      - name: site_type
        kind: Dropdown
        optional: true
        default_value: branch
        order_weight: 400
        choices:
          - name: hq
            label: Headquarters
            color: "#2ECC71"
          - name: regional
            label: Regional Office
            color: "#3498DB"
          - name: branch
            label: Branch Office
            color: "#7F7FBF"
          - name: campus
            label: Campus
            color: "#F39C12"
    relationships:
      - name: locations
        peer: LocationFacility
        cardinality: many
        kind: Attribute
        optional: false
        identifier: "office__locations"
        order_weight: 1000
        description: "Building locations backing this customer's office footprint
          (single for branch/regional, multiple for HQ/campus)"
      - name: namespace
        peer: BuiltinIPNamespace
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "topology_customer_office__namespace"
        order_weight: 1100
        description: "IPAM namespace (= VRF) for this environment's footprint"


  - name: CustomerCloud
    namespace: Topology
    description: "Customer deployment footprint inside a cloud region"
    label: "Customer (Cloud)"
    icon: "mdi:account-cloud-outline"
    inherit_from:
      - TopologyCustomer
      - TopologyDeployment
      - TopologyClusterHosting
      - TopologyConnectableLocation
    parent: TopologyCloudRegion
    children: ""
    include_in_menu: false
    human_friendly_id:
      - owner__org_id__value
      - environment__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ owner__org_id__value|upper }}-{{ customer_name__value|upper }}-{{ environment__value|upper }}-{{ parent__name__value|upper }}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: true
      - name: customer_name
        kind: Text
        optional: false
        order_weight: 100
    relationships:
      - name: cloud_account
        peer: CloudAccount
        label: "Cloud Account"
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 200

  - name: CustomerTemplateDC
    namespace: Topology
    description: "Boarding blueprint for a data center customer deployment"
    label: "Customer Template (Data Center)"
    icon: "mdi:file-document-edit-outline"
    inherit_from:
      - TopologyCustomerTemplate
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: uplink_10g_count
        kind: Number
        label: "10G Uplinks"
        description: "Number of 10 Gbps uplink ports to provision"
        optional: true
        default_value: 0
        order_weight: 400
        parameters:
          min_value: 0
      - name: uplink_40g_count
        kind: Number
        label: "40G Uplinks"
        description: "Number of 40 Gbps uplink ports to provision"
        optional: true
        default_value: 0
        order_weight: 410
        parameters:
          min_value: 0
      - name: uplink_100g_count
        kind: Number
        label: "100G Uplinks"
        description: "Number of 100 Gbps uplink ports to provision"
        optional: true
        default_value: 0
        order_weight: 420
        parameters:
          min_value: 0
      - name: uplink_400g_count
        kind: Number
        label: "400G Uplinks"
        description: "Number of 400 Gbps uplink ports to provision"
        optional: true
        default_value: 0
        order_weight: 430
        parameters:
          min_value: 0

  - name: CustomerTemplateColo
    namespace: Topology
    description: "Boarding blueprint for a colocation customer deployment"
    label: "Customer Template (Colocation)"
    icon: "mdi:file-document-plus-outline"
    inherit_from:
      - TopologyCustomerTemplate
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: uplink_10g_count
        kind: Number
        label: "10G Uplinks"
        description: "Number of 10 Gbps cross-connect ports to provision"
        optional: true
        default_value: 0
        order_weight: 400
        parameters:
          min_value: 0
      - name: uplink_40g_count
        kind: Number
        label: "40G Uplinks"
        description: "Number of 40 Gbps cross-connect ports to provision"
        optional: true
        default_value: 0
        order_weight: 410
        parameters:
          min_value: 0
      - name: uplink_100g_count
        kind: Number
        label: "100G Uplinks"
        description: "Number of 100 Gbps cross-connect ports to provision"
        optional: true
        default_value: 0
        order_weight: 420
        parameters:
          min_value: 0
      - name: uplink_400g_count
        kind: Number
        label: "400G Uplinks"
        description: "Number of 400 Gbps cross-connect ports to provision"
        optional: true
        default_value: 0
        order_weight: 430
        parameters:
          min_value: 0

  - name: CustomerTemplateCloud
    namespace: Topology
    description: "Boarding blueprint for a cloud customer deployment"
    label: "Customer Template (Cloud)"
    icon: "mdi:file-cloud-outline"
    inherit_from:
      - TopologyCustomerTemplate
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]

extensions:
  nodes:
    - kind: CloudInstance
      relationships:
        - name: node_pool
          peer: VirtNodePool
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "virt_pool__instances"
          description: "Node pool / ASG that manages this instance."
          order_weight: 2600

    - kind: OrganizationCustomer
      relationships:
        - name: deployments
          label: Topology Deployments
          kind: Generic
          cardinality: many
          optional: true
          peer: TopologyCustomer
          identifier: "topology_customer__owner"
          description: "All topology deployments owned by this customer"
          order_weight: 2000
