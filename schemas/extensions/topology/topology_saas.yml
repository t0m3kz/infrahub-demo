---
version: "1.0"

nodes:
  - name: Saas
    namespace: Topology
    inherit_from:
      - TopologyDeployment
      - CoreArtifactTarget
    label: SaaS Cloud
    icon: "mdi:cloud-outline"
    include_in_menu: false
    parent: TopologyLabel
    children: TopologySaasRegion
    uniqueness_constraints:
      - ["name__value", "parent"]
    human_friendly_id:
      - name__value
    display_label: "{{ name__value|upper }}"
    attributes:
      - name: provider
        kind: Dropdown
        label: Provider
        optional: true
        default_value: other
        order_weight: 200
        choices:
          - name: cisco
            label: Cisco
            description: Cisco SaaS (Webex, Umbrella)
            color: "#1BA0D7"
          - name: zscaler
            label: Zscaler
            description: Zscaler cloud security
            color: "#0066CC"
          - name: other
            label: Other
            description: Other provider
            color: "#95A5A6"
      - name: service_type
        kind: Dropdown
        label: Service Type
        optional: true
        default_value: other
        order_weight: 300
        choices:
          - name: sase
            label: SASE / SWG
            color: "#3498DB"
          - name: storage
            label: Storage
            color: "#F39C12"
          - name: api
            label: API Integration
            color: "#16A085"
          - name: other
            label: Other
            color: "#95A5A6"
      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: active
        order_weight: 400
        choices:
          - name: active
            label: Active
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            color: "#FFD27F"
          - name: decommissioned
            label: Decommissioned
            color: "#BFBFBF"
      - name: description
        kind: Text
        label: Description
        optional: true
        order_weight: 150
  - name: SaasRegion
    namespace: Topology
    inherit_from:
      - TopologyDeployment
      - TopologyConnectableLocation
      - TopologyFacility
    parent: TopologySaas
    children: ""
    icon: "mdi:map-marker"
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value, parent]
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        computed_attribute:
          kind: Jinja2
          jinja2_template: >
            {{parent__name__value|upper}}-{{region_name__value|upper}}
        read_only: true
        optional: false
        order_weight: 100
      - name: region_name
        kind: Text
        label: "Region Name"
        description: Provider region identifier
        optional: false
        order_weight: 200
      - name: status
        kind: Dropdown
        label: "Region Status"
        optional: true
        default_value: active
        order_weight: 300
        choices:
          - name: active
            label: Active
            description: "Region is active and operational"
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Region is being provisioned"
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Region is under maintenance"
            color: "#FFD27F"
    relationships:
      - name: location
        peer: LocationMetro
        cardinality: one
        kind: Attribute
        optional: true
        order_weight: 1000
        identifier: "saas__region__location"
        description: "Geographic mapping for provider region"
