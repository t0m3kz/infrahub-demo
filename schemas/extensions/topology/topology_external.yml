---
version: "1.0"

nodes:
  - name: ExternalProviders
    namespace: Topology
    inherit_from:
      - TopologyDeployment
      - TopologyConnectableLocation
      - TopologyFacility
      - TopologyDeviceHosting
    parent: TopologyLabel
    label: External Provider Endpoint
    icon: "mdi:lan-connect"
    include_in_menu: false
    children: ""
    uniqueness_constraints:
      - ["name__value", "parent"]
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    attributes:
      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: active
        order_weight: 300
        choices:
          - name: active
            label: Active
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            color: "#FFFF7F"
          - name: decommissioned
            label: Decommissioned
            color: "#BFBFBF"
    relationships:
      - name: provider
        peer: OrganizationProvider
        cardinality: one
        optional: true
        order_weight: 1000
