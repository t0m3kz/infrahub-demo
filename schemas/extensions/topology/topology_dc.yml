---
version: "1.0"

nodes:
  - name: DataCenterDesign
    namespace: Topology
    description: "Design intent for data center fabric architecture"
    label: Fabric Design
    icon: "mdi:lan"
    inherit_from:
      - TopologyDesign
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    order_by: [name__value]
    attributes:
      - name: description
        kind: Text
        optional: true
        order_weight: 150
        description: "Description of this data center design"

      # CAPACITY PLANNING
      - name: max_pods
        label: "Maximum Pods"
        description: "Maximum number of pods this design can support"
        kind: Number
        optional: true
        default_value: 2
        order_weight: 1600
        parameters:
          min_value: 1
          max_value: 16

      - name: max_super_spines_per_fabric
        label: "Maximum Super-Spines"
        description: "Max super-spine switches per fabric. 0 = back-to-back (pods mesh spines directly)."
        kind: Number
        optional: true
        default_value: 2
        order_weight: 1700
        parameters:
          min_value: 0
          max_value: 4

      - name: max_hyper_spines_per_fabric
        label: "Maximum Hyper-Spines"
        description: "Max hyper-spine switches per fabric. 0 = no hyper-spine tier (super-spines mesh directly)."
        kind: Number
        optional: true
        default_value: 0
        order_weight: 1710
        parameters:
          min_value: 0
          max_value: 4

      - name: max_spines_per_pod
        label: "Maximum Spines per Pod"
        description: "Maximum spine switches per pod in this fabric"
        kind: Number
        optional: true
        default_value: 4
        order_weight: 1750
        parameters:
          min_value: 1
          max_value: 8

      - name: max_border_leafs_per_fabric
        label: "Maximum Border-Leafs per Fabric"
        description: "Maximum total border-leaf switches for this DC's fabric."
        kind: Number
        optional: true
        default_value: 4
        order_weight: 1760
        parameters:
          min_value: 0
          max_value: 8

      # ADDRESS SPACE SIZING
      # Used as defaults when a DC instance has no pools set.
      # The DC instance may override by pre-attaching pools directly.
      - name: loopback_prefix_length
        label: "Loopback Pool Prefix Length"
        description: "Loopback pool prefix — match underlay_protocol (/24 IPv4, /120 IPv6)."
        kind: Number
        optional: true
        default_value: 23
        order_weight: 1800
        parameters:
          min_value: 8
          max_value: 128

      - name: technical_prefix_length
        label: "Technical Pool Prefix Length"
        description: "P2P link pool prefix — match underlay_protocol (/19 IPv4, /115 IPv6)."
        kind: Number
        optional: true
        default_value: 19
        order_weight: 1810
        parameters:
          min_value: 8
          max_value: 128

      - name: management_prefix_length
        label: "Management Pool Prefix Length"
        description: "Prefix length for management pool — always IPv4 regardless of underlay_protocol."
        kind: Number
        optional: true
        default_value: 25
        order_weight: 1820
        parameters:
          min_value: 16
          max_value: 30


  - name: PodDesign
    namespace: Topology
    description: "Pod layout and capacity plan"
    label: Pod Layout Design
    icon: "mdi:floor-plan"
    inherit_from:
      - TopologyDesign
    include_in_menu: false
    menu_placement: "TopologyDataCenter"
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    order_by: [name__value]
    attributes:
      - name: description
        kind: Text
        optional: true
        order_weight: 150
        description: "Description of this pod layout"

      # PHYSICAL LAYOUT
      - name: rows
        label: "Number of Rows"
        description: "Total number of rack rows in this layout"
        kind: Number
        optional: false
        order_weight: 1000
        parameters:
          min_value: 1
          max_value: 50

      - name: compute_racks_per_row
        label: "Compute Racks per Row"
        description: "Number of compute/server racks per row"
        kind: Number
        optional: false
        order_weight: 1100
        parameters:
          min_value: 0
          max_value: 100

      - name: network_racks_per_row
        label: "Network Racks per Row"
        description: "Number of network equipment racks per row"
        kind: Number
        optional: false
        order_weight: 1200
        parameters:
          min_value: 0
          max_value: 50

      # DEVICE DENSITY (moved from Pod Design)
      - name: max_leafs_per_network_rack
        label: "Max Leafs per Network Rack"
        description: "Maximum leaf switches per network rack"
        kind: Number
        optional: true
        default_value: 4
        order_weight: 1300
        parameters:
          min_value: 0
          max_value: 8

      - name: max_tors_per_network_rack
        label: "Max ToRs per Network Rack"
        description: "Maximum ToR switches per network rack"
        kind: Number
        optional: true
        default_value: 2
        order_weight: 1300
        parameters:
          min_value: 0
          max_value: 8

      - name: max_tors_per_compute_rack
        label: "Max ToRs per Compute Rack"
        description: "Maximum ToR switches per compute rack"
        kind: Number
        optional: true
        default_value: 1
        order_weight: 1400
        parameters:
          min_value: 0
          max_value: 2

      - name: max_spines_per_pod
        label: "Max Spines per Pod"
        description: "Maximum spine switches per pod in this layout"
        kind: Number
        optional: true
        default_value: 2
        order_weight: 1500
        parameters:
          min_value: 2
          max_value: 8

      - name: max_border_leafs_per_pod
        label: "Max Border-Leafs per Pod"
        description: "Maximum border-leaf switches this pod can receive from its DC's fabric_templates quantity."
        kind: Number
        optional: true
        default_value: 1
        order_weight: 1550
        parameters:
          min_value: 0
          max_value: 4

  - name: Element
    namespace: Topology
    description: "Physical aspect of topology elements."
    label: "Network Elements"
    icon: "carbon:network-3-reference"
    include_in_menu: false
    menu_placement: "DesignTopology"
    human_friendly_id:
      - quantity__value
      - role__value
      - template__template_name__value
    order_by: [role__value, quantity__value]
    # yamllint disable rule:line-length
    display_label: >
      {{quantity__value}} x {{role__value|upper}} - {{template__template_name__value}}
    # yamllint enable rule:line-length
    uniqueness_constraints:
      - ["quantity__value", "role__value", "template"]
    attributes:
      - name: quantity
        kind: Number
        order_weight: 1200
      - name: role
        kind: Dropdown
        optional: true
        order_weight: 1000
        choices:
          - name: core
            label: Core Router
            description: Central part of the network.
            color: "#7f7fff"
          - name: edge
            label: Edge Router
            description: Network boundary with external networks.
            color: "#bf7fbf"
          - name: cpe
            label: Customer Premise Equipment
            description: >
              Devices located at the customer's premises.
            color: "#bf7f7f"
          - name: leaf
            label: Leaf Switch
            description: Leaf Switch part of a Pod.
            color: "#e6e6fa"
          - name: tor
            label: ToR Switch
            description: Top of Rack switch acting as VTEP in tor-deployment (connects directly to spines).
            color: "#e6e6fa"
          - name: l2-leaf
            label: L2 Leaf Switch
            description: L2-only aggregation switch (connects to leafs, not spines; no VXLAN/overlay BGP).
            color: "#d0e8fd"
          - name: access-leaf
            label: Access Leaf Switch
            description: Routed VTEP aggregation switch (connects to leafs, not spines; full VXLAN/overlay BGP).
            color: "#a8d8b8"
          - name: border-leaf
            label: Border Leaf Switch
            description: Border Leaf providing external connectivity in a Pod.
            color: "#dda0dd"
          - name: firewall
            label: Firewall
            description: "Security boundary with external network"
            color: "#6e5abd"
          - name: load-balancer
            label: Load Balancer
            description: Load Balancer part of a Fabric.
            color: "#38e7fb"
          - name: oob
            label: OOB Switch
            description: Out of Band Switch part of a Fabric.
            color: "#e3e7fd"
          - name: console
            label: Console Server
            description: Console Server part of a Fabric.
            color: "#e9ebfd"
          - name: spine
            label: Spine Switch
            description: Spine switch part of a Pod fabric.
            color: "#7fbfbf"
          - name: super-spine
            label: Super Spine Switch
            description: Super spine aggregating multiple pods.
            color: "#5fa8a8"
          - name: hyper-spine
            label: Hyper Spine Switch
            description: >
              Aggregates multiple super-spine groups; sits above super-spine
              in very large (XL) fabrics.
            color: "#3f8f8f"
          - name: border-spine
            label: Border Spine Switch
            description: >
              Collapsed spine + border-leaf for micro-fabrics — connects
              directly to this pod's leafs (spine role) and to this pod's
              own firewall/load-balancer plus sibling pods (border-leaf
              role) on one device. Sits in a pod's spine slot instead of
              "spine"; the two never coexist in the same pod.
            color: "#c58fdd"
          - name: proxy
            label: Proxy
            description: "Forward, transparent, or reverse proxy appliance."
            color: "#5ba85b"
    relationships:
      - name: template
        label: Device Template
        peer: CoreObjectTemplate
        optional: false
        cardinality: one
        kind: Attribute
        order_weight: 1500

  - name: DataCenter
    namespace: Topology
    inherit_from:
      - CoreArtifactTarget
      - TopologyDeployment
      - TopologyPhysicalDeployment
      - TopologyConnectableLocation
      - TopologyDeviceHosting
      - TopologySegmentHosting
    label: Data Center
    include_in_menu: false
    children: ""
    uniqueness_constraints:
      - ["name__value", "index__value"]
    human_friendly_id:
      - name__value
    display_label: "{{ name__value}} - Fabric {{index__value}}"
    attributes:
      - name: index
        kind: Number
        order_weight: 110
      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 550
        choices:
          - name: active
            label: Active
            description: "Operational and in service."
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Being built or staged."
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Temporarily under maintenance."
            color: "#FFD27F"
          - name: decommissioned
            label: Decommissioned
            description: "Removed from active service."
            color: "#BFBFBF"
      - name: management_mode
        label: Management Mode
        kind: Dropdown
        optional: true
        default_value: fully_managed
        description: "Whether Infrahub generators own the topology build-out, or an external controller does."
        order_weight: 600
        choices:
          - name: fully_managed
            label: "Fully Managed"
            description: "Infrahub generators own the full topology build-out."
            color: "#7FBF7F"
          - name: managed_by_controller
            label: "Managed by Controller"
            description: "An external controller (e.g. ACI APIC) owns the topology; generators do not run."
            color: "#7FBFFF"

      - name: routing_strategy
        kind: Dropdown
        label: "Routing Strategy"
        description: "Fabric routing protocol strategy"
        optional: true
        default_value: ebgp-ebgp
        order_weight: 1060
        choices:
          - name: ebgp-ebgp
            label: "eBGP-eBGP"
            description: "Pure eBGP routing (RFC 7938)"
            color: "#6666ff"
          - name: ebgp-ibgp
            label: "eBGP-iBGP"
            description: "eBGP underlay with iBGP overlay"
            color: "#7f7fff"
          - name: ospf-ibgp
            label: "OSPF-iBGP"
            description: "OSPF underlay with iBGP overlay"
            color: "#aedcee"

      - name: underlay_protocol
        label: "Underlay Protocol"
        description: "IPv6 by default (RFC 6164 /127 P2P); use IPv4 only when IPv6 is unsupported"
        kind: Dropdown
        optional: true
        default_value: ipv6
        order_weight: 1070
        choices:
          - name: ipv4
            label: "IPv4"
            description: "IPv4 underlay routing"
            color: "#7FBF7F"
          - name: ipv6
            label: "IPv6"
            description: "IPv6 underlay routing"
            color: "#7F7FBF"
          - name: dual_stack
            label: "Dual-Stack"
            description: "IPv6 for P2P fabric links, IPv4 for loopbacks and management"
            color: "#8E44AD"

      - name: fabric_interface_sorting_method
        kind: Dropdown
        label: Fabric interface assignment
        choices:
          - name: bottom_up
            label: Bottom Up
            description: Assign interfaces bottom-up.
            color: "#869FB3"
          - name: top_down
            label: Top Down
            description: Assign interfaces top-down.
            color: "#004E64"
        default_value: bottom_up
        order_weight: 1200
      - name: spine_interface_sorting_method
        kind: Dropdown
        label: Spine interface assignment
        choices:
          - name: bottom_up
            label: Bottom Up
            description: Assign interfaces bottom-up.
            color: "#869FB3"
          - name: top_down
            label: Top Down
            description: Assign interfaces top-down.
            color: "#004E64"
        default_value: bottom_up
        order_weight: 1300
      - name: connectivity_mode
        label: "Firewall/LB Connectivity"
        description: "How border-leaf-attached firewalls/load-balancers are cabled"
        kind: Dropdown
        optional: true
        default_value: pbr
        order_weight: 1400
        choices:
          - name: pbr
            label: "Policy-Based Routing"
            description: "BL<->FW and BL<->LB cabled independently"
            color: "#7FBF7F"
          - name: inline
            label: "Inline Service Chain"
            description: "BL->FW->LB->BL physical chain; FW and LB sit directly in the forwarding path"
            color: "#BF7F7F"
    relationships:
      - name: design
        label: "Data Center Design"
        description: "Logical network topology design for this data center"
        peer: TopologyDataCenterDesign
        kind: Attribute
        cardinality: one
        optional: false
        identifier: "dc__design"
        order_weight: 950
        on_delete: no-action
      - name: fabric_templates
        peer: TopologyElement
        label: "Fabric Elements"
        description: "Super-spine, border-leaf, firewall, and load-balancer templates for this DC's fabric"
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "dc__fabric_templates"
        order_weight: 1100
      - name: loopback_pool
        peer: CoreIPPrefixPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__loopback_pool"
        order_weight: 6000
        on_delete: cascade
      - name: technical_pool
        peer: CoreIPPrefixPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__technical_pool"
        order_weight: 7000
        on_delete: cascade
      - name: management_pool
        peer: CoreIPAddressPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__management_pool"
        order_weight: 7000
        on_delete: cascade
      - name: fabric_asn_pool
        label: "Fabric ASN Pool"
        description: "Shared ASN pool for super-spine and border-leaf underlay/overlay BGP"
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__fabric_asn_pool"
        order_weight: 7200
        on_delete: cascade

  - name: Pod
    namespace: Topology
    inherit_from:
      - TopologyDeployment
      - TopologyRackHosting
      - TopologyDeviceHosting
    parent: TopologyDataCenter
    children: ""
    label: Pod
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "index__value"]
    include_in_menu: false
    attributes:
      - name: index
        kind: Number
        order_weight: 110
      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 140
        choices:
          - name: active
            label: Active
            description: "Operational and in service."
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Being built or staged."
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Temporarily under maintenance."
            color: "#FFD27F"
          - name: decommissioned
            label: Decommissioned
            description: "Removed from active service."
            color: "#BFBFBF"
      - name: name
        kind: Text
        computed_attribute:
          kind: Jinja2
          jinja2_template: >
            {{parent__name__value|upper}}-{{parent__index__value}}-POD-{{
            index__value }}
        read_only: true
        optional: false
      - name: leaf_interface_sorting_method
        kind: Dropdown
        choices:
          - name: bottom_up
            color: "#869FB3"
            description: Assign interfaces bottom-up.
          - name: top_down
            color: "#004E64"
            description: Assign interfaces top-down.
        default_value: bottom_up
        order_weight: 3000
      - name: spine_interface_sorting_method
        kind: Dropdown
        choices:
          - name: bottom_up
            color: "#869FB3"
            description: Assign interfaces bottom-up.
          - name: top_down
            color: "#004E64"
            description: Assign interfaces top-down.
        default_value: bottom_up
        order_weight: 4000
      - name: mlag_create
        label: "MLAG Creation"
        kind: Dropdown
        description: "Whether add_rack automatically pairs same-role ToR/leaf devices into an MLAG domain"
        choices:
          - name: "no"
            label: "Don't create MLAGs"
            color: "#BFBFBF"
            description: "Devices are not automatically paired into MLAG domains."
          - name: "back-to-back"
            label: "Create back-to-back MLAG"
            color: "#7FBF7F"
            description: "Pair devices with a physical peer-link (DcimLAGInterface over mlag-peer physical interfaces)."
          - name: virtual
            label: "Create virtual MLAG"
            color: "#869FB3"
            description: "Pair devices with a virtual (loopback) peer-link instead of a physical LAG."
        default_value: "no"
        optional: true
        order_weight: 4500
    relationships:
      - name: design
        label: "Pod Design"
        description: "Physical layout and operational parameters for this pod"
        peer: TopologyPodDesign
        kind: Attribute
        cardinality: one
        optional: false
        identifier: "pod__design"
        order_weight: 900
        on_delete: no-action
      - name: fabric_templates
        peer: TopologyElement
        label: "Fabric Elements"
        description: "Spine templates for this pod's fabric"
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "pod__fabric_templates"
        order_weight: 1100
      - name: loopback_pool
        peer: CoreIPAddressPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "pod__loopback_pool"
        order_weight: 6000
        on_delete: cascade
      - name: prefix_pool
        peer: CoreIPPrefixPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "pod__prefix_pool"
        order_weight: 7000
        on_delete: cascade
      - name: asn_pool
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "pod__asn_pool"
        order_weight: 7100
        on_delete: cascade
