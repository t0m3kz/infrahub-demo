---
version: "1.0"

nodes:
  - name: Element
    namespace: Topology
    description: "Physical aspect of topology elements."
    label: "Network Elements"
    icon: "carbon:network-3-reference"
    include_in_menu: false
    menu_placement: "DesignTopology"
    human_friendly_id:
      - quantity__value
      - role__value
      - template__template_name__value
    order_by: [role__value, quantity__value]
    # yamllint disable rule:line-length
    display_label: >
      {{quantity__value}} x {{role__value|upper}} - {{template__template_name__value}}
    # yamllint enable rule:line-length
    uniqueness_constraints:
      - ["quantity__value", "role__value", "template"]
    attributes:
      - name: quantity
        kind: Number
        order_weight: 1200
      - name: role
        kind: Dropdown
        optional: true
        order_weight: 1000
        choices:
          - name: edge
            label: Edge Router
            description: Network boundary with external networks.
            color: "#bf7fbf"
          - name: leaf
            label: Leaf Switch
            description: Leaf Switch part of a Pod.
            color: "#e6e6fa"
          - name: tor
            label: ToR Switch
            description: Top of Rack switch acting as VTEP in tor-deployment (connects directly to spines).
            color: "#e6e6fa"
          - name: l2-leaf
            label: L2 Leaf Switch
            description: L2-only aggregation switch (connects to leafs, not spines; no VXLAN/overlay BGP).
            color: "#d0e8fd"
          - name: access-leaf
            label: Access Leaf Switch
            description: Routed VTEP aggregation switch (connects to leafs, not spines; full VXLAN/overlay BGP).
            color: "#a8d8b8"
          - name: border-leaf
            label: Border Leaf Switch
            description: Border Leaf providing external connectivity in a Pod.
            color: "#dda0dd"
          - name: firewall
            label: Firewall
            description: "Security boundary with external network"
            color: "#6e5abd"
          - name: load-balancer
            label: Load Balancer
            description: Load Balancer part of a Fabric.
            color: "#38e7fb"
          - name: spine
            label: Spine Switch
            description: Spine switch part of a Pod fabric.
            color: "#7fbfbf"
          - name: super-spine
            label: Super Spine Switch
            description: Super spine aggregating multiple pods.
            color: "#5fa8a8"
          - name: hyper-spine
            label: Hyper Spine Switch
            description: >
              Aggregates multiple super-spine groups; sits above super-spine
              in very large (XL) fabrics.
            color: "#3f8f8f"
          - name: border-spine
            label: Border Spine Switch
            description: >
              Collapsed spine + border-leaf for micro-fabrics — connects
              directly to this pod's leafs (spine role) and to this pod's
              own firewall/load-balancer plus sibling pods (border-leaf
              role) on one device. Sits in a pod's spine slot instead of
              "spine"; the two never coexist in the same pod.
            color: "#c58fdd"
          - name: access-switch
            label: Access Switch
            description: "Campus wiring-closet switch — a LISP fabric edge node in an office fabric."
            color: "#b4d6ff"
          - name: distribution-switch
            label: Distribution Switch
            description: "Campus aggregation switch — a LISP border and control-plane node in an office fabric."
            color: "#87b8e8"
    relationships:
      - name: template
        label: Device Template
        peer: CoreObjectTemplate
        optional: false
        cardinality: one
        kind: Attribute
        order_weight: 1500

  - name: DataCenter
    namespace: Topology
    generate_template: true
    inherit_from:
      - CoreArtifactTarget
      - TopologyDeployment
      - TopologyPhysicalDeployment
      - TopologyConnectableLocation
      - TopologyDeviceHosting
      - TopologyDeviceNaming
      - TopologySegmentHosting
      - ManagedControllerAssignment
    label: Data Center
    icon: "mdi:server-network"
    include_in_menu: false
    parent: TopologyLabel
    children: ""
    uniqueness_constraints:
      - ["name__value", "parent"]
    human_friendly_id:
      - name__value
    display_label: "{{ name__value}} - Fabric {{index__value}}"
    attributes:
      - name: index
        kind: Number
        order_weight: 110
      - name: size
        label: "Size"
        description: "T-shirt size template — max pods/super-spines/border-leafs (see DC_SIZE_LAYOUTS)"
        kind: Dropdown
        optional: false
        order_weight: 120
        choices:
          - name: "S"
            label: "S"
            description: "Micro-fabric, back-to-back (no super-spine tier), no DC-level border-leaf tier."
            color: "#7FBF7F"
          - name: "M"
            label: "M"
            description: "Back-to-back (no super-spine tier), with a dedicated DC-level border-leaf tier."
            color: "#FFD27F"
          - name: "L"
            label: "L"
            description: "Classic 3-tier Clos: leaf -> spine -> super-spine."
            color: "#869FB3"
          - name: "XL"
            label: "XL"
            description: "Classic 3-tier Clos plus a 4th hyper-spine tier above super-spine."
            color: "#BF7F7F"
      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 550
        choices:
          - name: active
            label: Active
            description: "Operational and in service."
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Being built or staged."
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Temporarily under maintenance."
            color: "#FFD27F"
          - name: decommissioned
            label: Decommissioned
            description: "Removed from active service."
            color: "#BFBFBF"
      - name: routing_strategy
        kind: Dropdown
        label: "Routing Strategy"
        description: "Fabric routing protocol strategy"
        optional: true
        default_value: ebgp-ebgp
        order_weight: 1060
        choices:
          - name: ebgp-ebgp
            label: "eBGP-eBGP"
            description: "Pure eBGP routing (RFC 7938)"
            color: "#6666ff"
          - name: ebgp-ibgp
            label: "eBGP-iBGP"
            description: "eBGP underlay with iBGP overlay"
            color: "#7f7fff"
          - name: ospf-ibgp
            label: "OSPF-iBGP"
            description: "OSPF underlay with iBGP overlay"
            color: "#aedcee"

      - name: underlay_protocol
        label: "Underlay Protocol"
        description: "IPv6 by default (RFC 6164 /127 P2P); use IPv4 only when IPv6 is unsupported"
        kind: Dropdown
        optional: true
        default_value: ipv6
        order_weight: 1070
        choices:
          - name: ipv4
            label: "IPv4"
            description: "IPv4 underlay routing"
            color: "#7FBF7F"
          - name: ipv6
            label: "IPv6"
            description: "IPv6 underlay routing"
            color: "#7F7FBF"
          - name: dual_stack
            label: "Dual-Stack"
            description: "IPv6 for P2P fabric links, IPv4 for loopbacks and management"
            color: "#8E44AD"

      - name: fabric_interface_sorting_method
        kind: Dropdown
        label: Fabric interface assignment
        choices:
          - name: bottom_up
            label: Bottom Up
            description: Assign interfaces bottom-up.
            color: "#869FB3"
          - name: top_down
            label: Top Down
            description: Assign interfaces top-down.
            color: "#004E64"
        default_value: bottom_up
        order_weight: 1200
      - name: connectivity_mode
        label: "Firewall/LB Connectivity"
        description: "How border-leaf-attached firewalls/load-balancers are cabled"
        kind: Dropdown
        optional: true
        default_value: pbr
        order_weight: 1400
        choices:
          - name: pbr
            label: "Policy-Based Routing"
            description: "BL<->FW and BL<->LB cabled independently"
            color: "#7FBF7F"
          - name: inline
            label: "Inline Service Chain"
            description: "BL->FW->LB->BL physical chain; FW and LB sit directly in the forwarding path"
            color: "#BF7F7F"
      - name: group_policy_enforce
        kind: Boolean
        label: "Enforce Group Policy"
        optional: true
        default_value: false
        order_weight: 1500
        description: >-
          Render group-policy enforcement (NX-OS security enforce, EOS no shutdown);
          contracts always render.
    relationships:
      - name: fabric_templates
        peer: TopologyElement
        label: "Fabric Elements"
        description: "Super-spine, border-leaf, firewall, and load-balancer templates for this DC's fabric"
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "dc__fabric_templates"
        order_weight: 1100
      - name: loopback_pool
        peer: CoreIPPrefixPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__loopback_pool"
        order_weight: 6000
        on_delete: cascade
      - name: technical_pool
        peer: CoreIPPrefixPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__technical_pool"
        order_weight: 7000
        on_delete: cascade
      - name: management_pool
        peer: CoreIPAddressPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__management_pool"
        order_weight: 7000
        on_delete: cascade
      - name: fabric_asn_pool
        label: "Fabric ASN Pool"
        description: "Shared ASN pool for super-spine and border-leaf underlay/overlay BGP"
        peer: CoreNumberPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "dc__fabric_asn_pool"
        order_weight: 7200
        on_delete: cascade

  - name: Pod
    namespace: Topology
    generate_template: true
    inherit_from:
      - TopologyDeployment
      - TopologyRackHosting
      - TopologyDeviceHosting
    parent: TopologyDataCenter
    children: ""
    label: Pod
    icon: "mdi:view-grid-outline"
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - ["name__value", "parent"]
    include_in_menu: false
    attributes:
      - name: index
        kind: Number
        order_weight: 110
      - name: status
        kind: Dropdown
        label: Status
        optional: true
        default_value: provisioning
        order_weight: 140
        choices:
          - name: active
            label: Active
            description: "Operational and in service."
            color: "#7FBF7F"
          - name: provisioning
            label: Provisioning
            description: "Being built or staged."
            color: "#FFFF7F"
          - name: maintenance
            label: Maintenance
            description: "Temporarily under maintenance."
            color: "#FFD27F"
          - name: decommissioned
            label: Decommissioned
            description: "Removed from active service."
            color: "#BFBFBF"
      - name: name
        kind: Text
        computed_attribute:
          kind: Jinja2
          jinja2_template: >
            {{parent__name__value|upper}}-{{parent__index__value}}-POD-{{
            index__value }}
        read_only: true
        optional: false
      - name: layout
        label: "Layout"
        description: "Physical row/rack-count and device-density template for this pod (see POD_LAYOUTS)"
        kind: Dropdown
        optional: false
        order_weight: 135
        choices:
          - name: S_MIDDLE
            label: "S Middle"
            color: "#7FBF7F"
          - name: S_TOR
            label: "S ToR"
            color: "#FFD27F"
          - name: S_MIXED
            label: "S Mixed"
            color: "#869FB3"
          - name: S_BORDER_SPINE_POD
            label: "S Border-Spine"
            color: "#BF7F7F"
          - name: M_MIXED
            label: "M Mixed"
            color: "#A9CCE3"
          - name: M_MIDDLE
            label: "M Middle"
            color: "#A9DFBF"
      - name: leaf_interface_sorting_method
        kind: Dropdown
        choices:
          - name: bottom_up
            color: "#869FB3"
            description: Assign interfaces bottom-up.
          - name: top_down
            color: "#004E64"
            description: Assign interfaces top-down.
        default_value: bottom_up
        order_weight: 3000
      - name: spine_interface_sorting_method
        kind: Dropdown
        choices:
          - name: bottom_up
            color: "#869FB3"
            description: Assign interfaces bottom-up.
          - name: top_down
            color: "#004E64"
            description: Assign interfaces top-down.
        default_value: bottom_up
        order_weight: 4000
      - name: mlag_create
        label: "MLAG Creation"
        kind: Dropdown
        description: "Whether add_rack automatically pairs same-role ToR/leaf devices into an MLAG domain"
        choices:
          - name: "no"
            label: "Don't create MLAGs"
            color: "#BFBFBF"
            description: "Devices are not automatically paired into MLAG domains."
          - name: "back-to-back"
            label: "Create back-to-back MLAG"
            color: "#7FBF7F"
            description: "Pair devices with a physical peer-link (DcimLAGInterface over mlag-peer physical interfaces)."
          - name: virtual
            label: "Create virtual MLAG"
            color: "#869FB3"
            description: "Pair devices with a virtual (loopback) peer-link instead of a physical LAG."
        default_value: "no"
        optional: true
        order_weight: 4500
    relationships:
      - name: fabric_templates
        peer: TopologyElement
        label: "Fabric Elements"
        description: "Spine templates for this pod's fabric"
        optional: true
        cardinality: many
        kind: Attribute
        identifier: "pod__fabric_templates"
        order_weight: 1100
      - name: loopback_pool
        peer: CoreIPAddressPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "pod__loopback_pool"
        order_weight: 6000
        on_delete: cascade
      - name: prefix_pool
        peer: CoreIPPrefixPool
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "pod__prefix_pool"
        order_weight: 7000
        on_delete: cascade
