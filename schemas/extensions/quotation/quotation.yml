            color: "#6e5abd"
          - name: load-balancer
            label: Load Balancer
            color: "#38e7fb"
          - name: access-point
            label: Access Point
            color: "#c6e2ff"
          - name: access-switch
            label: Access Switch
            color: "#b4d6ff"
          - name: distribution-switch
