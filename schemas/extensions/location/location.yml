---
version: "1.0"

nodes:
  - name: Region
    namespace: Location
    label: Region
    inherit_from:
      - LocationGeneric
    uniqueness_constraints:
      - ["name__value"]
    menu_placement: LocationGeneric
    include_in_menu: false
    display_label: "{{name__value}}"
    children: LocationCountry
    icon: "carbon:cics-region-target"
  - name: Country
    namespace: Location
    label: Country
    inherit_from:
      - LocationGeneric
    menu_placement: LocationGeneric
    uniqueness_constraints:
      - ["name__value"]
    include_in_menu: false
    display_label: "{{name__value}}"
    parent: "LocationRegion"
    children: LocationMetro
    icon: gis:search-country
    attributes:
      - name: timezone
        kind: Text
        optional: true
        order_weight: 1300
  - name: Metro
    namespace: Location
    label: Metro
    inherit_from:
      - LocationGeneric
    menu_placement: LocationGeneric
    include_in_menu: false
    display_label: "{{name__value}}"
    parent: LocationCountry
    children: ""
    icon: healthicons:city
  - name: Facility
    namespace: Location
    inherit_from:
      - LocationGeneric
    menu_placement: "LocationGeneric"
    include_in_menu: false
    label: Facility
    display_label: "{{name__value}}"
    parent: "LocationMetro"
    children: "LocationSuite"
    icon: "ri:building-line"
    attributes:
      - name: facility_id
        kind: Text
        unique: false
        optional: true
        order_weight: 1100
      - name: physical_address
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
      - name: is_cloud
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 1600
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
  - name: Office
    namespace: Location
    inherit_from:
      - LocationGeneric
    menu_placement: "LocationGeneric"
    include_in_menu: false
    label: Office
    display_label: "{{name__value}}"
    parent: "LocationMetro"
    children: "LocationOfficeFloor"
    icon: "mdi:office-building"
    attributes:
      - name: physical_address
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
  - name: OfficeFloor
    namespace: Location
    inherit_from:
      - LocationGeneric
    menu_placement: "LocationGeneric"
    include_in_menu: false
    label: Office Floor
    display_label: "{{name__value}}"
    parent: "LocationOffice"
    children: ""
    icon: "mdi:floor-plan"
    attributes:
      - name: index
        kind: Number
        optional: false
        order_weight: 120
      - name: conference_rooms
        label: "Number of Conference Rooms"
        kind: Number
        optional: false
        order_weight: 130
        parameters:
          min_value: 0
      - name: employee_count
        label: "Number of Employees"
        kind: Number
        optional: false
        order_weight: 140
        parameters:
          min_value: 0
      - name: area_sqm
        label: "Area (m²)"
        kind: Number
        optional: false
        order_weight: 150
        parameters:
          min_value: 0
  - name: Campus
    namespace: Location
    inherit_from:
      - LocationGeneric
    menu_placement: "LocationGeneric"
    include_in_menu: false
    label: Campus
    display_label: "{{name__value}}"
    parent: "LocationMetro"
    children: "LocationCampusBuilding"
    icon: "mdi:office-building-marker"
    attributes:
      - name: physical_address
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
  - name: CampusBuilding
    namespace: Location
    inherit_from:
      - LocationGeneric
    menu_placement: "LocationGeneric"
    include_in_menu: false
    label: Campus Building
    display_label: "{{name__value}}"
    parent: "LocationCampus"
    children: "LocationCampusFloor"
    icon: "ri:building-line"
  - name: CampusFloor
    namespace: Location
    inherit_from:
      - LocationGeneric
    menu_placement: "LocationGeneric"
    include_in_menu: false
    label: Campus Floor
    display_label: "{{name__value}}"
    parent: "LocationCampusBuilding"
    children: ""
    icon: "mdi:floor-plan"
    attributes:
      - name: index
        kind: Number
        optional: false
        order_weight: 120
      - name: conference_rooms
        label: "Number of Conference Rooms"
        kind: Number
        optional: false
        order_weight: 130
        parameters:
          min_value: 0
      - name: employee_count
        label: "Number of Employees"
        kind: Number
        optional: false
        order_weight: 140
        parameters:
          min_value: 0
      - name: area_sqm
        label: "Area (m²)"
        kind: Number
        optional: false
        order_weight: 150
        parameters:
          min_value: 0
  - name: Suite
    namespace: Location
    inherit_from:
      - "LocationGeneric"
    include_in_menu: false
    menu_placement: "LocationGeneric"
    label: Suite
    parent: LocationFacility
    children: "LocationRack"
    icon: "game-icons:cage"
    attributes:
      - name: name
        kind: Text
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{parent__name__value}}-{{suite_name__value}}"
        read_only: true
        optional: false
      - name: suite_name
        kind: Text
        optional: false
      - name: index
        kind: Number
        optional: false
        order_weight: 120
      - name: rows
        label: "Number of Rows"
        description: "Total number of rack rows in this suite"
        kind: Number
        optional: false
        order_weight: 130
        parameters:
          min_value: 1
      - name: racks_per_row
        label: "Racks per Row"
        description: "Number of racks per row in this suite"
        kind: Number
        optional: false
        order_weight: 140
        parameters:
          min_value: 1
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
  - name: Rack
    namespace: Location
    generate_template: true
    inherit_from:
      - LocationGeneric
      - CoreArtifactTarget
    include_in_menu: false
    menu_placement: "LocationGeneric"
    parent: "LocationSuite"
    children: ""
    uniqueness_constraints:
      - ["name__value"]
    label: Rack
    icon: "clarity:rack-server-line"
    display_label: "{{ name__value }}"
    attributes:
      - name: name
        kind: Text
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{parent__name__value|upper}}-R{{row_index__value}}-{{index__value}}"  # yamllint disable-line rule:line-length
        read_only: true
        optional: false
      - name: index
        kind: Number
        order_weight: 120
      - name: row_index
        kind: Number
        order_weight: 121
      - name: rack_type
        kind: Dropdown
        choices:
          - name: compute
            label: Compute
          - name: storage
            label: Storage
          - name: tor
            label: Top-of-Rack
          - name: network
            label: Network
        default_value: compute
      - name: facility_id
        kind: Text
        unique: false
        optional: true
        order_weight: 1100
      - name: height
        label: Height (U)
        optional: true
        default_value: 42
        kind: Number
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
      - name: fabric_templates
        peer: TopologyElement
        label: Network Elements
        optional: true
        cardinality: many
        kind: Attribute
      - name: pod
        peer: TopologyRackHosting
        kind: Attribute
        cardinality: one
        identifier: "rack__pod"
        optional: true
      - name: devices
        peer: DcimPhysicalDevice
        label: Devices in Rack
        optional: true
        cardinality: many
        kind: Generic
        identifier: "device_rack"
extensions:
  nodes:
    - kind: OrganizationProvider
      relationships:
        - name: location
          peer: LocationFacility
          cardinality: many
          optional: true

    - kind: DcimPhysicalDevice
      relationships:
        - name: rack
          peer: LocationRack
          cardinality: one
          kind: Attribute
          optional: true
          identifier: "device_rack"
