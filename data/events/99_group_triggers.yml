---
# The generators start on a group trigger: when an object joins the target group of a generator definition
# (`targets` in .infrahub.yml), the server runs the generator for that member alone (CoreGroupTriggerRule,
# member_update added). An object created with `member_of_groups` inline joins the group in its create, and an
# existing object added later joins it then; measured on 1.11, each is one infrahub.group.member_added, and a re-save
# or an upsert of a member emits none, so a generator that re-saves its own objects never fires itself again. An
# object outside the group starts nothing. (A node trigger on `created` fired for every object of its kind, and the
# run then failed for a non-member: "Target ... is not part of the group".)
#
# The `updated` rules (99_actions.yml) stay node triggers, a group trigger has no field match: an edit of a non-member
# still dispatches and fails there. trigger-endpoint-generator-on-created stays a node trigger too (it matches the
# device role). The names are new (CoreTriggerRule names are unique across both kinds): an instance loaded with the
# old node rules keeps them until they are deleted.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreGroupTriggerRule
  data:
    - name: trigger-dc-generator-on-added
      branch_scope: "other_branches"
      member_update: added
      group: topologies_dc
      action: run-dc-generator

    - name: trigger-pod-generator-on-added
      branch_scope: "other_branches"
      member_update: added
      group: topologies_pod
      action: run-pod-generator

