---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNodeTriggerRule
  data:

    # dc_pod_cascade subclasses DCTopologyGenerator (add_dc) and runs its entire
    # bootstrap via super().generate() before fanning out — a strict superset of
    # add_dc's own work (see generators/topology/dc_pod_cascade.py's docstring).
    # Structural DC-level changes (updated triggers below) need the fan-out: an
    # existing pod isn't touched by the DC-level change, so its own created/
    # updated triggers won't fire it. A freshly created DC does NOT need it —
    # every pod nested under it in the same bulk load gets its own
    # trigger-pod-generator-on-created, so fanning out here as well double-runs
    # every pod (and, one level down, every rack). Plain add_dc keeps ordering
    # correct on its own: pod.py already waits for an in-flight add_dc/
    # dc_pod_cascade on its parent DC before reading DC-level data.

    - name: trigger-dc-generator-on-created
      branch_scope: "other_branches"
      node_kind: TopologyDataCenter
      mutation_action: "created"
      action: run-dc-generator

    - name: trigger-dc-update-fabric-templates
      branch_scope: "other_branches"
      node_kind: TopologyDataCenter
      mutation_action: "updated"
      action: run-dc-pod-cascade
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: fabric_templates
            modification_type: updated

    # Re-cables every rack's firewall/load-balancer links to match the new
    # mode — pbr and inline target different ports/far-ends on the same
    # firewall/load-balancer uplink interfaces, so an existing rack must be
    # re-run, not just newly-provisioned ones.
    - name: trigger-dc-update-connectivity-mode
      branch_scope: "other_branches"
      node_kind: TopologyDataCenter
      mutation_action: "updated"
      action: run-dc-pod-cascade
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: connectivity_mode
            value_match: any

    - name: trigger-dc-status
      branch_scope: "other_branches"
      node_kind: TopologyDataCenter
      mutation_action: updated
      action: run-dc-pod-cascade
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: status
            value_match: value_full
            value: active
            value_previous: provisioning

    # pod_rack_cascade runs POD bootstrap before fanning out to the POD's racks.
    # Structural updates (below) need the fan-out for the same reason as the DC
    # triggers above: an existing rack isn't touched by a pod-level change, so
    # its own trigger won't fire it. A freshly created pod does NOT need it —
    # every rack nested under it in the same bulk load gets its own
    # trigger-rack-generator-on-created, so fanning out here too double-runs
    # every rack. Plain add_pod keeps ordering correct on its own: rack.py
    # already waits for an in-flight add_pod/pod_rack_cascade on its parent pod
    # before reading pod-level data.

    - name: trigger-pod-generator-on-created
      branch_scope: "other_branches"
      node_kind: TopologyPod
      mutation_action: "created"
      action: run-pod-generator

    - name: trigger-pod-update-index
      branch_scope: "other_branches"
      node_kind: TopologyPod
      mutation_action: "updated"
      action: run-pod-rack-cascade
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: index
            value_match: any

    - name: trigger-pod-update-fabric-templates
      branch_scope: "other_branches"
      node_kind: TopologyPod
      mutation_action: "updated"
      action: run-pod-rack-cascade
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: fabric_templates
            modification_type: updated

    - name: trigger-pod-update-mlag-create
      branch_scope: "other_branches"
      node_kind: TopologyPod
      mutation_action: "updated"
      action: run-pod-rack-cascade
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: mlag_create
            value_match: any

    # A rack created standalone under an already-existing, unchanged pod (e.g. a
    # standalone switch add) needs its own created-trigger to bootstrap — a bulk
    # pod+rack load is also covered by this, since add_rack.generate() waits for
    # an in-flight add_pod/pod_rack_cascade on its parent pod before reading
    # pod-level data (see rack.py's generate()), so this can never race the
    # cascade fan-out from trigger-pod-update-* above. A network rack's own
    # tor/compute row-dependents are, in turn, started unconditionally by that
    # network rack's own generate() (RackGenerator._fan_out_to_row_dependent_racks)
    # — this one level is not split into its own cascade generator.

    - name: trigger-rack-generator-on-created
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "created"
      action: run-rack-generator

    - name: trigger-rack-generator-update-index
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: index
            value_match: any

    - name: trigger-rack-generator-update-rack-type
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: rack_type
            value_match: any

    - name: trigger-rack-generator-update-templates
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: fabric_templates
            modification_type: updated

    # # Device decommission: when status set to decommissioned
    # - name: trigger-device-decommission
    #   branch_scope: "other_branches"
    #   node_kind: DcimPhysicalDevice
    #   mutation_action: "updated"
    #   action: run-decommission-device
    #   matches:
    #     kind: CoreNodeTriggerAttributeMatch
    #     data:
    #       - attribute_name: status
    #         value_match: decommissioned

    # Pod decommission: when status set to decommissioned
    - name: trigger-pod-decommission
      branch_scope: "other_branches"
      node_kind: TopologyPod
      mutation_action: "updated"
      action: run-decommission-pod
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: status
            value_match: value_full
            value: decommissioned
            value_previous: active
            # match_type: exact

    # VRF namespace: generator auto-triggers via group membership (execute_in_proposed_change: true)
    # No deployment-based trigger needed — L3 VNI comes from global pool

    # Segment triggers: `created` fires when customer_deployments is set inline
    # during object creation (e.g. nested under OrganizationCustomer.network_
    # segments — see data/demos/30_all/07_applications/*/00_segment*.yml), which
    # is a `created` mutation on the segment itself, not an `updated` relationship
    # mutation. Without this, a segment created with customer_deployments already
    # populated never gets a SegmentDeployment realization until something later
    # updates customer_deployments and happens to trigger the rule below.
    - name: trigger-vxlan-segment-generator-on-created
      branch_scope: "other_branches"
      node_kind: ManagedVxlanSegment
      mutation_action: "created"
      action: run-vxlan-segment-generator

    # Re-run generator when customer deployments are added/updated after creation
    # (e.g. a stretched segment gaining its second DC leg later).
    - name: trigger-vxlan-segment-deployments-updated
      branch_scope: "other_branches"
      node_kind: ManagedVxlanSegment
      mutation_action: "updated"
      action: run-vxlan-segment-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: customer_deployments
            modification_type: updated

    # Re-run generator when stretch_scope changes (e.g. local -> dc_pair) —
    # it picks the VNI identifier strategy (per-deployment vs shared, see
    # generators/topology/segment.py's _activate_segment_in_deployment), so a
    # scope flip needs re-processing even without a customer_deployments change.
    - name: trigger-vxlan-segment-generator-update-stretch-scope
      branch_scope: "other_branches"
      node_kind: ManagedVxlanSegment
      mutation_action: "updated"
      action: run-vxlan-segment-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: stretch_scope
            value_match: any

    # ── Endpoint Connectivity ────────────────────────────────────────────────
    # Endpoint targets (data/bootstrap/00_groups.yml's `endpoints` group) are
    # server devices with role=endpoint. `created` bootstraps a fresh server's
    # uplink cabling immediately. No relationship-based `interfaces added`
    # trigger here: that fires on ANY DcimPhysicalDevice (border-leafs, ToRs,
    # spines all gain interfaces during add_rack), and add_endpoint's target
    # group (`endpoints`) rejects non-member node ids outright — see the
    # ValueError this caused in production before removal.
    - name: trigger-endpoint-generator-on-created
      branch_scope: "other_branches"
      node_kind: DcimPhysicalDevice
      mutation_action: "created"
      action: run-endpoint-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: role
            value_match: value
            value: endpoint

    # ── MLAG Wiring ───────────────────────────────────────────────────────────
    # Peer-link wiring on domain *creation* is no longer a separate
    # trigger-based generator round-trip — DeviceMixin._ensure_mlag_pairs
    # (generators/devices.py) calls ensure_mlag_wiring (also in
    # generators/devices.py) directly, synchronously, right after creating
    # or finding each ManagedMLAG domain, closing the storm where a bulk
    # topology regen's ~14 concurrently-created ManagedMLAG domains each
    # independently fired their own async add_mlag flow run and overloaded
    # the server (HTTP 502 on the generator's own query, NODE_NOT_FOUND
    # elsewhere from index/consistency lag under load). MLAGGenerator/
    # mlag.py still exists (delegates to the same ensure_mlag_wiring) — the
    # two triggers below still need it, since they react to
    # capabilities/virtual_peer_link changes made outside this generator
    # flow (direct API/UI edit, branch merge).
    - name: trigger-mlag-on-update-capabilities
      branch_scope: "other_branches"
      node_kind: ManagedMLAG
      mutation_action: "updated"
      action: mlag-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: capabilities
            modification_type: updated

    - name: trigger-mlag-on-update-virtual-peer-link
      branch_scope: "other_branches"
      node_kind: ManagedMLAG
      mutation_action: "updated"
      action: mlag-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: virtual_peer_link
            value_match: any

    # HA sync interfaces/cables are no longer a separate trigger-based
    # generator — _ensure_ha_pairs (generators/devices.py) calls
    # _ensure_ha_interfaces directly, synchronously, right after creating or
    # finding each ManagedFirewallHA/LoadbalancerHA domain, closing the race
    # where two concurrent boarding customers could each fire the old
    # ha-generator action 2-3x per domain.

    # ── LB Backend No-SNAT Return-Path ────────────────────────────────────────
    - name: trigger-lb-backend-nexthop-on-created
      branch_scope: "other_branches"
      node_kind: LoadbalancerVIP
      mutation_action: "created"
      action: lb-backend-nexthop-generator

    - name: trigger-lb-backend-nexthop-update-snat
      branch_scope: "other_branches"
      node_kind: LoadbalancerVIP
      mutation_action: "updated"
      action: lb-backend-nexthop-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: snat_enabled
            value_match: any

    - name: trigger-lb-backend-nexthop-update-backend-segment
      branch_scope: "other_branches"
      node_kind: LoadbalancerVIP
      mutation_action: "updated"
      action: lb-backend-nexthop-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: backend_segment
            modification_type: updated

    # ── App Security Rules ────────────────────────────────────────────────────
    # Three entry points into the same generator. An application is created
    # before its dependencies (they reference its components), so the
    # application trigger alone sees none of them, and a dependency added or
    # changed later touches no AppApplication. A dependency trigger re-runs its
    # application's full reconciliation; the generator targets the
    # app_dependencies group, so every AppDependency must be a member.
    # A component moved to another segment, or listening on other ports,
    # re-runs its own application and every application calling it, whose
    # rules name that segment and default to those ports; it targets
    # app_components, so every AppComponent must be a member.

    - name: trigger-app-security-rules-on-application-created
      branch_scope: "other_branches"
      node_kind: AppApplication
      mutation_action: "created"
      action: run-app-application-generator

    - name: trigger-app-security-rules-on-dependency-created
      branch_scope: "other_branches"
      node_kind: AppDependency
      mutation_action: "created"
      action: run-app-dependency-generator

    - name: trigger-app-security-rules-on-dependency-updated
      branch_scope: "other_branches"
      node_kind: AppDependency
      mutation_action: "updated"
      action: run-app-dependency-generator

    - name: trigger-app-security-rules-on-component-segment-updated
      branch_scope: "other_branches"
      node_kind: AppComponent
      mutation_action: "updated"
      action: run-app-component-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: network_segment
            modification_type: updated

    - name: trigger-app-security-rules-on-component-ports-updated
      branch_scope: "other_branches"
      node_kind: AppComponent
      mutation_action: "updated"
      action: run-app-component-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: ports
            value_match: any

    # ── App Component Segment Tagging ─────────────────────────────────────────
    # add_app_component_segment tags the switch ports a component's instances
    # are cabled to with its network_segment and reconciles that segment's
    # VLAN domain activations (generators/topology/app_instance_segment.py).
    # It shares app_components with add_app_component but is a second
    # concern, so the network_segment change dispatches both generators.
    # `created` covers a component loaded with instances/network_segment
    # inline (nested under its AppApplication). A component usually exists
    # before its servers are cabled; add_endpoint fans this generator out to
    # the components on an endpoint once it cables it, which closes that gap.
    # The generator writes interface tags and VLAN domain segments, never the
    # component itself, so neither rule can re-fire itself.
    - name: trigger-app-component-segment-on-created
      branch_scope: "other_branches"
      node_kind: AppComponent
      mutation_action: "created"
      action: run-app-component-segment-generator

    - name: trigger-app-component-segment-on-instances-updated
      branch_scope: "other_branches"
      node_kind: AppComponent
      mutation_action: "updated"
      action: run-app-component-segment-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: instances
            modification_type: updated

    - name: trigger-app-component-segment-on-segment-updated
      branch_scope: "other_branches"
      node_kind: AppComponent
      mutation_action: "updated"
      action: run-app-component-segment-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: network_segment
            modification_type: updated

    # ── Orchestrator Routing Groups ───────────────────────────────────────────
    # generators/topology/orchestrator_routing.py moves a node into the
    # routing group (application_*/topology_*) named by its orchestrator
    # dropdown. It writes only member_of_groups, never the dropdown, so the
    # attribute-matched `updated` rules cannot re-fire themselves.
    #
    # Customer deployments: one generator definition per kind, each targeting
    # that kind's CoreGeneratorGroup (customer_deployments_dc/colocation/
    # cloud/office). Every footprint in the demo data already joins its
    # per-kind group (the add_customer_deployment_* and add_sdwan_edge
    # created-triggers require it), whereas the shared customer_deployments
    # group has no members, so a rule dispatching into it would raise for
    # every node (see the endpoint note above).
    # TopologyCustomerSaas carries infrastructure_orchestrator too but has no
    # target group and is not a query root of TopologyOrchestratorRoutingGenerator.
    - name: trigger-application-orchestrator-routing-on-created
      branch_scope: "other_branches"
      node_kind: AppApplication
      mutation_action: "created"
      action: run-application-orchestrator-routing-generator

    - name: trigger-application-orchestrator-routing-on-orchestrator-updated
      branch_scope: "other_branches"
      node_kind: AppApplication
      mutation_action: "updated"
      action: run-application-orchestrator-routing-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: application_orchestrator
            value_match: any

    - name: trigger-customer-dc-orchestrator-routing-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerDC
      mutation_action: "created"
      action: run-customer-dc-orchestrator-routing-generator

    - name: trigger-customer-dc-orchestrator-routing-on-orchestrator-updated
      branch_scope: "other_branches"
      node_kind: TopologyCustomerDC
      mutation_action: "updated"
      action: run-customer-dc-orchestrator-routing-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: infrastructure_orchestrator
            value_match: any

    - name: trigger-customer-colocation-orchestrator-routing-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerColocation
      mutation_action: "created"
      action: run-customer-colocation-orchestrator-routing-generator

    - name: trigger-customer-colocation-orchestrator-routing-on-orchestrator-updated
      branch_scope: "other_branches"
      node_kind: TopologyCustomerColocation
      mutation_action: "updated"
      action: run-customer-colocation-orchestrator-routing-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: infrastructure_orchestrator
            value_match: any

    - name: trigger-customer-cloud-orchestrator-routing-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerCloud
      mutation_action: "created"
      action: run-customer-cloud-orchestrator-routing-generator

    - name: trigger-customer-cloud-orchestrator-routing-on-orchestrator-updated
      branch_scope: "other_branches"
      node_kind: TopologyCustomerCloud
      mutation_action: "updated"
      action: run-customer-cloud-orchestrator-routing-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: infrastructure_orchestrator
            value_match: any

    - name: trigger-customer-office-orchestrator-routing-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerOffice
      mutation_action: "created"
      action: run-customer-office-orchestrator-routing-generator

    - name: trigger-customer-office-orchestrator-routing-on-orchestrator-updated
      branch_scope: "other_branches"
      node_kind: TopologyCustomerOffice
      mutation_action: "updated"
      action: run-customer-office-orchestrator-routing-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: infrastructure_orchestrator
            value_match: any

    # ── Customer Deployment (FirewallContext/dedicated LB) ────────────────────
    # Same generator/query shape for both deployment kinds that still have
    # on-site fabric to provision a FirewallContext on (see
    # generators/topology/customer_dc.py and customer_colocation.py).
    # TopologyCustomerCloud/Office had no fabric of their own — their only job
    # was hub-and-spoke exchange auto-provisioning, now replaced by the 4 fixed
    # bootstrap TopologyRoutedExchange objects (data/bootstrap/23_exchanges.yml,
    # docs/exchange_gateway.md), so those two generators/triggers were removed
    # rather than left as no-ops. Regressed in c1b686e7 (removed
    # trigger-exchange-gateway-on-customer-*-created without a replacement,
    # leaving these generators — targets: customer_deployments, a
    # CoreStandardGroup, never a CoreGeneratorGroup — permanently
    # undispatched): no ManagedFirewallContext/dedicated LoadbalancerHA was
    # ever created for any TopologyCustomerDC/Colocation boarded since.
    - name: trigger-customer-deployment-dc-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerDC
      mutation_action: "created"
      action: run-customer-deployment-dc-generator

    - name: trigger-customer-deployment-colocation-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerColocation
      mutation_action: "created"
      action: run-customer-deployment-colocation-generator

    # ── Colocation Metro Bootstrap ────────────────────────────────────────────
    # `created` covers a metro loaded with fabric_templates already populated
    # inline (the normal bulk-load shape, nested under TopologyColocation),
    # which is a `created` mutation on the metro itself and never an `updated`
    # relationship mutation — the same gap documented on the segment triggers
    # above.
    #
    # This fires for EVERY metro, so every TopologyColocationMetro in data/demos
    # declares `member_of_groups: [colocation_metros]` — including the ones with
    # no fabric_templates, which the generator no-ops on. That is not optional
    # tidiness: a trigger firing for a node outside the generator's target group
    # raises, as the endpoint note above records. Metros we hold no kit in
    # therefore cost one no-op flow each, the same trade add_rack already makes
    # for colocation cage racks.
    - name: trigger-colocation-metro-on-created
      branch_scope: "other_branches"
      node_kind: TopologyColocationMetro
      mutation_action: "created"
      action: run-colocation-metro-generator

    # Only fabric_templates is watched, deliberately. The generator itself
    # writes loopback_pool/management_pool/technical_pool/asn_pool back onto
    # the metro, so a rule matching those relationships — or an unguarded
    # `updated` rule — would re-fire itself on every run. No cascade generator
    # either: the cages nested below a metro declare no kit of their own.
    - name: trigger-colocation-metro-update-fabric-templates
      branch_scope: "other_branches"
      node_kind: TopologyColocationMetro
      mutation_action: "updated"
      action: run-colocation-metro-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: fabric_templates
            modification_type: updated

    # ── SD-WAN Edge Provisioning ────────────────────────────────────────────────
    # `created` covers an office loaded with sdwan_gateway already populated
    # inline (the normal bulk-load shape) — SdwanEdgeGenerator itself no-ops
    # when sdwan_gateway is unset, so this is safe to fire unconditionally for
    # every office, not just ones that opted in. The `updated` rule covers an
    # existing office that opts in later by having sdwan_gateway set on it —
    # the generator never writes back to TopologyCustomerOffice itself, so
    # this can't self-trigger the way colocation metro's fabric_templates can.
    - name: trigger-customer-office-sdwan-on-created
      branch_scope: "other_branches"
      node_kind: TopologyCustomerOffice
      mutation_action: "created"
      action: run-sdwan-edge-generator

    - name: trigger-customer-office-sdwan-update-gateway
      branch_scope: "other_branches"
      node_kind: TopologyCustomerOffice
      mutation_action: "updated"
      action: run-sdwan-edge-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: sdwan_gateway
            modification_type: updated

    # ── Circuits ──────────────────────────────────────────────────────────────
    # add_circuit/add_virtual_circuit target physical_circuits/virtual_circuits,
    # so every circuit — loaded or generator-created (add_sdwan_edge creates
    # both kinds) — must be a member, or its created-trigger raises (see the
    # endpoint note above). The `updated` rules watch only what defines a
    # circuit's ends and role. tunnel_id is deliberately absent: add_sdwan_edge
    # writes it back onto the overlay circuit, so watching it would re-fire.
    - name: trigger-circuit-on-created
      branch_scope: "other_branches"
      node_kind: TopologyPhysicalCircuit
      mutation_action: "created"
      action: run-circuit-generator

    - name: trigger-circuit-on-customer-interfaces-updated
      branch_scope: "other_branches"
      node_kind: TopologyPhysicalCircuit
      mutation_action: "updated"
      action: run-circuit-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: customer_interfaces
            modification_type: updated

    - name: trigger-circuit-on-provider-interfaces-updated
      branch_scope: "other_branches"
      node_kind: TopologyPhysicalCircuit
      mutation_action: "updated"
      action: run-circuit-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: provider_interfaces
            modification_type: updated

    - name: trigger-circuit-on-status-updated
      branch_scope: "other_branches"
      node_kind: TopologyPhysicalCircuit
      mutation_action: "updated"
      action: run-circuit-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: status
            value_match: any

    - name: trigger-circuit-on-circuit-type-updated
      branch_scope: "other_branches"
      node_kind: TopologyPhysicalCircuit
      mutation_action: "updated"
      action: run-circuit-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: circuit_type
            value_match: any

    - name: trigger-circuit-on-peering-role-updated
