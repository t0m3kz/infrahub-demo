---
# Shared SASE egress proxy referenced by AppComponent.proxy_service across
# multiple applications/customers. Defined first (sorts before c001/c002/c003)
# so components in those folders can reference it by HFID.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCloudProxy
  data:
    - name: shared-cloud-proxy
      description: "Shared SASE egress proxy for outbound application dependencies"
      provider: zscaler_zia
      service_type: web_gateway
      member_of_groups:
        - saas_proxies
