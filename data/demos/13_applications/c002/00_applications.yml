---
# C002 (SwiftGo GmbH) — "dispatch-hub" application: portfolio + frontend/
# backend/database components, wired to the segments (data/demos/
# 08_segments/c002/02_segments.yml) and to the shared DC6 servers
# boarded in data/demos/06_servers/ (bonds shared across customers:
# ktw-pod1-server-1/bond1 = web, ktw-pod2-server-1/bond1 = app,
# ktw-pod3-server-4 = db).
#
# Each component is addressed by its fqdn (also its HFID) and lists the ports
# it listens on; the dependencies in 02_dependencies.yml open them.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: dispatch-hub
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: dispatch-hub.c002.demo.local
      ingress_mode: frontend
      owner: C002
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            fqdn: web.dispatch-hub.c002.demo.local
            component_type: frontend
            ports:
              - tcp/443
            network_segment: c002-web-frontend-p
            instances:
              - ktw-pod1-server-1
            member_of_groups:
              - app_components

          - name: app-backend
            fqdn: backend.dispatch-hub.c002.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: c002-app-backend-p
            instances:
              - ktw-pod2-server-1
            member_of_groups:
              - app_components

          - name: order-db
            fqdn: data.dispatch-hub.c002.demo.local
            component_type: database
            ports:
              - tcp/5432
              - tcp/6379
            network_segment: c002-database-p
            instances:
              - ktw-pod3-server-4
            member_of_groups:
              - app_components
