---
# C001 storefront application and its components on the DC6 servers.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: storefront
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: storefront.c001.demo.local
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            fqdn: storefront.c001.demo.local
            component_type: frontend
            ports:
              - tcp/443
            network_segment: c001-web-frontend-p
            instances:
              - ktw-pod1-server-1
            member_of_groups:
              - app_components

          - name: app-backend
            fqdn: backend.storefront.c001.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: c001-app-backend-p
            instances:
              - ktw-pod2-server-1
            member_of_groups:
              - app_components

          - name: order-db
            fqdn: db.storefront.c001.demo.local
            component_type: database
            ports:
              - tcp/5432
            network_segment: c001-database-p
            instances:
              - ktw-pod3-server-3
            member_of_groups:
              - app_components

          - name: session-cache
            fqdn: cache.storefront.c001.demo.local
            component_type: cache
            ports:
              - tcp/6379
              - udp/30000-30010
            network_segment: c001-cache-p
            instances:
              - ktw-pod3-server-1
            member_of_groups:
              - app_components
