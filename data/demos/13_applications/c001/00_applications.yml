---
# C001 (Nordix Ltd.) — "storefront" application: portfolio + frontend/backend
# components, wired to the segments (data/demos/07_customers/c001/
# 01_network_segments.yml) and to the shared DC6 servers boarded in
# data/demos/06_servers/ (bonds shared across customers:
# ktw-pod1-server-1/bond0 = web, ktw-pod2-server-1/bond0 = app,
# ktw-pod3-server-3 = db, ktw-pod3-server-1/bond1 = cache).

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: storefront
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: storefront.c001.demo.local
      ingress_mode: frontend
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            component_type: frontend
            network_segment: c001-web-frontend-p
            instances:
              - ktw-pod1-server-1
            member_of_groups:
              - app_components

          - name: app-backend
            component_type: backend
            network_segment: c001-app-backend-p
            instances:
              - ktw-pod2-server-1
            member_of_groups:
              - app_components

          - name: order-db
            component_type: database
            network_segment: c001-database-p
            instances:
              - ktw-pod3-server-3
            member_of_groups:
              - app_components

          - name: session-cache
            component_type: cache
            network_segment: c001-cache-p
            instances:
              - ktw-pod3-server-1
            member_of_groups:
              - app_components
