---
# C003 (Vaultex Inc.) — "custody-ledger" application: portfolio + frontend/
# backend/database/cache components, wired to the segments (data/demos/
# 07_customers/c003/01_network_segments.yml) and to the shared DC6 servers
# boarded in data/demos/06_servers/ (bonds shared across customers:
# ktw-pod1-server-2/bond0 = web, ktw-pod2-server-2/bond0 = app,
# ktw-pod3-server-5 = db, ktw-pod3-server-6 = cache).

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: custody-ledger
      environment: p
      criticality: critical
      security_profile: fintech_strict
      fqdn: custody-ledger.c003.demo.local
      ingress_mode: frontend
      owner: C003
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            component_type: frontend
            network_segment: c003-web-frontend-p
            instances:
              - ktw-pod1-server-2
            member_of_groups:
              - app_components

          - name: app-backend
            component_type: backend
            network_segment: c003-app-backend-p
            instances:
              - ktw-pod2-server-2
            member_of_groups:
              - app_components

          - name: order-db
            component_type: database
            network_segment: c003-database-p
            instances:
              - ktw-pod3-server-5
            member_of_groups:
              - app_components

          - name: session-cache
            component_type: cache
            network_segment: c003-cache-p
            instances:
              - ktw-pod3-server-6
            member_of_groups:
              - app_components
