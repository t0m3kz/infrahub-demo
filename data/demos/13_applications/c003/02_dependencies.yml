---
# Who calls whom inside custody-ledger. Source and target are component fqdns;
# without ports a dependency opens every port its target component lists in
# 00_applications.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c003-custody-ledger-p-web-frontend-to-app-backend
      source: web.custody-ledger.c003.demo.local
      target: backend.custody-ledger.c003.demo.local
      access_status: auto
      description: "Ledger web calls the backend API"
      member_of_groups:
        - app_dependencies
    - name: c003-custody-ledger-p-app-backend-to-order-db
      source: backend.custody-ledger.c003.demo.local
      target: db.custody-ledger.c003.demo.local
      access_status: auto
      description: "Backend writes ledger entries"
      member_of_groups:
        - app_dependencies
    - name: c003-custody-ledger-p-app-backend-to-session-cache
      source: backend.custody-ledger.c003.demo.local
      target: cache.custody-ledger.c003.demo.local
      access_status: auto
      description: "Backend keeps sessions in the cache"
      member_of_groups:
        - app_dependencies
    - name: c003-custody-ledger-p-app-backend-to-ledger-queue
      source: backend.custody-ledger.c003.demo.local
      target: queue.custody-ledger.c003.demo.local
      access_status: auto
      description: "Backend publishes ledger events on AMQP"
      member_of_groups:
        - app_dependencies
