---
# C003 (Vaultex Inc.) — production VRF namespace, subnets, and VXLAN segments
# activated on DC6.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamNamespace
  data:
    - name: "C003-PROD"
      description: "Vaultex Inc. production VRF"
      l3_vni: 50031
      status: "active"
      owner: "C003"
      member_of_groups:
        - vrf_namespaces

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.3.10.0/24"
      description: "C003 prod web-frontend subnet (DC6)"
      status: active
      role: customer
      ip_namespace: "C003-PROD"

    - prefix: "10.3.20.0/24"
      description: "C003 prod app-backend subnet (DC6)"
      status: active
      role: customer
      ip_namespace: "C003-PROD"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "10.3.10.1/24"
      description: "Anycast GW — C003 prod web-frontend (DC6)"
      ip_namespace: "C003-PROD"

    - address: "10.3.20.1/24"
      description: "Anycast GW — C003 prod app-backend (DC6)"
      ip_namespace: "C003-PROD"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - customer_name: "web-frontend"
      environment: "p"
      owner: "C003"
      arp_suppression: true
      gateway:
        - "10.3.10.1/24"
        - "C003-PROD"
      deployments:
        - DC6
      member_of_groups:
        - vxlan_segments

    - customer_name: "app-backend"
      environment: "p"
      owner: "C003"
      arp_suppression: true
      gateway:
        - "10.3.20.1/24"
        - "C003-PROD"
      deployments:
        - DC6
      member_of_groups:
        - vxlan_segments
