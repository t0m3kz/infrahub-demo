---
# C002 (SwiftGo GmbH) — production VRF namespace, subnets, and VXLAN segments
# activated on DC3.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamNamespace
  data:
    - name: "C002-PROD"
      description: "SwiftGo GmbH production VRF"
      l3_vni: 50021
      status: "active"
      owner: "C002"
      member_of_groups:
        - vrf_namespaces

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.2.10.0/24"
      description: "C002 prod web-frontend subnet (DC3)"
      status: active
      role: customer
      ip_namespace: "C002-PROD"

    - prefix: "10.2.20.0/24"
      description: "C002 prod app-backend subnet (DC3)"
      status: active
      role: customer
      ip_namespace: "C002-PROD"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "10.2.10.1/24"
      description: "Anycast GW — C002 prod web-frontend (DC3)"
      ip_namespace: "C002-PROD"

    - address: "10.2.20.1/24"
      description: "Anycast GW — C002 prod app-backend (DC3)"
      ip_namespace: "C002-PROD"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - customer_name: "web-frontend"
      environment: "p"
      owner: "C002"
      arp_suppression: true
      gateway:
        - "10.2.10.1/24"
        - "C002-PROD"
      deployments:
        - DC3
      member_of_groups:
        - vxlan_segments

    - customer_name: "app-backend"
      environment: "p"
      owner: "C002"
      arp_suppression: true
      gateway:
        - "10.2.20.1/24"
        - "C002-PROD"
      deployments:
        - DC3
      member_of_groups:
        - vxlan_segments
