---
# C002 (SwiftGo GmbH) — endpoint servers hosting the web-frontend/app-backend
# tiers, placed in DC3's compute racks.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: C002-WEB-VM-01
      rack: lon-1-s-1-r-1-2
      role: endpoint
      status: active
      position: 10
      device_type: [DELL-R740XD2]
      platform: linux
      member_of_groups:
        - endpoints
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: eth0
            interface_type: 100gbase-x-qsfp28
            role: lag
        - kind: DcimPhysicalInterface
          data:
            name: eth1
            interface_type: 100gbase-x-qsfp28
            role: lag
        - kind: DcimLAGInterface
          data:
            name: bond0
            status: active
            role: lag
            lag_id: 1
            lacp_mode: active
            mtu: 9000
            minimum_links: 1
            member_interfaces:
              - ["C002-WEB-VM-01", "eth0"]
              - ["C002-WEB-VM-01", "eth1"]

    - name: C002-APP-VM-01
      rack: lon-1-s-1-r-2-2
      role: endpoint
      status: active
      position: 10
      device_type: [DELL-R740XD2]
      platform: linux
      member_of_groups:
        - endpoints
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: eth0
            interface_type: 100gbase-x-qsfp28
            role: lag
        - kind: DcimPhysicalInterface
          data:
            name: eth1
            interface_type: 100gbase-x-qsfp28
            role: lag
        - kind: DcimLAGInterface
          data:
            name: bond0
            status: active
            role: lag
            lag_id: 1
            lacp_mode: active
            mtu: 9000
            minimum_links: 1
            member_interfaces:
              - ["C002-APP-VM-01", "eth0"]
              - ["C002-APP-VM-01", "eth1"]
