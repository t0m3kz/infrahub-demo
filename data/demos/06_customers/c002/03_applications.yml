---
# C002 (SwiftGo GmbH) — "dispatch-hub" application: portfolio + frontend/
# backend/database/cache components, wired to the segments
# (01_network_segments.yml) and servers (02_servers.yml) already boarded
# for this customer.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: dispatch-hub
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: dispatch-hub.c002.demo.local
      ingress_mode: frontend
      owner: C002
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            component_type: frontend
            network_segment: c002-web-frontend-p
            instances:
              - C002-WEB-01
            member_of_groups:
              - app_components

          - name: app-backend
            component_type: backend
            network_segment: c002-app-backend-p
            instances:
              - C002-APP-01
            member_of_groups:
              - app_components

          - name: order-db
            component_type: database
            network_segment: c002-database-p
            instances:
              - C002-DB-01
            member_of_groups:
              - app_components

          - name: session-cache
            component_type: cache
            network_segment: c002-cache-p
            instances:
              - C002-CACHE-01
            member_of_groups:
              - app_components
