---
# C001 (Nordix Ltd.) — "storefront" application: portfolio + frontend/backend
# components, wired to the segments (01_network_segments.yml) and servers
# (02_servers.yml) already boarded for this customer.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: storefront
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: storefront.c001.demo.local
      ingress_mode: frontend
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            component_type: frontend
            network_segment: c001-web-frontend-p
            instances:
              - C001-WEB-01
            member_of_groups:
              - app_components

          - name: app-backend
            component_type: backend
            network_segment: c001-app-backend-p
            instances:
              - C001-APP-01
            member_of_groups:
              - app_components

          - name: order-db
            component_type: database
            network_segment: c001-database-p
            instances:
              - C001-DB-01
            member_of_groups:
              - app_components

          - name: session-cache
            component_type: cache
            network_segment: c001-cache-p
            instances:
              - C001-CACHE-01
            member_of_groups:
              - app_components
