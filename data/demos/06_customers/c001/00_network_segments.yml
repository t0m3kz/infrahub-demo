---
# C001 (Nordix Ltd.) — production VRF namespace, subnets, and VXLAN segments
# activated on DC1.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamNamespace
  data:
    - name: "C001-PROD"
      description: "Nordix Ltd. production VRF"
      status: "active"
      owner: "C001"
      member_of_groups:
        - vrf_namespaces

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.1.10.0/24"
      description: "C001 prod web-frontend subnet (DC1)"
      status: active
      role: customer
      ip_namespace: "C001-PROD"

    - prefix: "10.1.20.0/24"
      description: "C001 prod app-backend subnet (DC1)"
      status: active
      role: customer
      ip_namespace: "C001-PROD"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "10.1.10.1/24"
      description: "Anycast GW — C001 prod web-frontend (DC1)"
      ip_namespace: "C001-PROD"

    - address: "10.1.20.1/24"
      description: "Anycast GW — C001 prod app-backend (DC1)"
      ip_namespace: "C001-PROD"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - customer_name: "web-frontend"
      environment: "p"
      owner: "C001"
      arp_suppression: true
      gateway:
        - "10.1.10.1/24"
        - "C001-PROD"
      deployments:
        - DC1
      member_of_groups:
        - vxlan_segments

    - customer_name: "app-backend"
      environment: "p"
      owner: "C001"
      arp_suppression: true
      gateway:
        - "10.1.20.1/24"
        - "C001-PROD"
      deployments:
        - DC1
      member_of_groups:
        - vxlan_segments
