---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC4
      index: 1
      parent: Data Center
      design: XL
      routing_strategy: ebgp-ebgp
      underlay_protocol: ipv6
      naming_convention: hierarchical
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          - index: 1
            design: S_MIDDLE
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - name: BER-1-S-1-R1-2
                  index: 2
                  shortname: ber-1-s-1-r-1-2
                  rack_type: network
                  parent: ber-1-s-1-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "2"
                      - spine
                      - DCS-7050CX3-32C-R_SPINE
                - name: BER-1-SUITE-1-R1-1
                  index: 1
                  shortname: ber-1-s-1-r-1-1
                  rack_type: network
                  parent: ber-1-s-1-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "2"
                      - leaf
                      - DCS-7050CX3-32C-R_LEAF_MR
                    - - "2"
                      - l2-leaf
                      - DCS-7050CX3-32C-R_TOR
          - index: 2
            design: S_MIXED
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - name: BER-1-S-2-R1-3
                  index: 3
                  shortname: ber-1-s-2-r-1-3
                  rack_type: network
                  parent: ber-1-s-2-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "4"
                      - spine
                      - DCS-7050CX3-32C-R_SPINE
                - name: BER-1-SUITE-2-R1-1
                  index: 1
                  shortname: ber-1-s-2-r-1-1
                  rack_type: network
                  parent: ber-1-s-2-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "2"
                      - leaf
                      - DCS-7050CX3-32C-R_LEAF_MIXED
                - name: BER-1-SUITE-2-R1-2
                  index: 2
                  shortname: ber-1-s-2-r-1-2
                  rack_type: compute
                  parent: ber-1-s-2-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "2"
                      - l2-leaf
                      - DCS-7050CX3-32C-R_TOR
          - index: 3
            design: S_TOR
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - name: BER-1-S-3-R1-9
                  index: 9
                  shortname: ber-1-s-3-r-1-9
                  rack_type: network
                  parent: ber-1-s-3-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "4"
                      - spine
                      - DCS-7050CX3-32C-R_SPINE
                - name: BER-1-SUITE-3-R1-1
                  index: 1
                  shortname: ber-1-s-3-r-1-1
                  rack_type: tor
                  parent: ber-1-s-3-row-1
                  member_of_groups:
                    - topologies_rack
                  fabric_templates:
                    - - "2"
                      - tor
                      - DCS-7050CX3-32C-R_TOR
      racks:
        kind: LocationRack
        data:
          - name: BER-1-S-3-R1-8
            index: 1
            shortname: ber-1-s-3-r-1-8
            rack_type: network
            parent: ber-1-s-3-row-1
            member_of_groups:
              - topologies_rack
            fabric_templates:
              - - "4"
                - super-spine
                - DCS-7050CX3-32C-R_SUPER_SPINE
              - - "2"
                - hyper-spine
                - DCS-7050CX3-32C-R_HYPER_SPINE
              - - "2"
                - border-leaf
                - DCS-7050CX3-32C-R_BORDER_LEAF
              - - "2"
                - internal-firewall
                - CP-26000_FIREWALL
              - - "2"
                - load-balancer
                - NetScaler-MPX-26000-100G_LOAD_BALANCER
