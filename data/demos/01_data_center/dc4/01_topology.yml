---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC4
      index: 1
      size: XL
      routing_strategy: ebgp-ebgp
      underlay_protocol: ipv6
      naming_convention: hierarchical
      fabric_templates:
        - ["4", "super-spine", "DCS-7050CX3-32C-R"]
        - ["2", "hyper-spine", "DCS-7050CX3-32C-R"]
        - ["4", "border-leaf", "DCS-7050CX3-32C-R"]
        - ["2", "firewall", "CP-26000"]
        - ["2", "load-balancer", "NetScaler-MPX-26000-100G"]
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          - index: 1
            layout: S_MIDDLE
            deployment_type: middle_rack
            suites: [ber-1-s-1]
            fabric_templates:
              - ["2", "spine", "DCS-7050CX3-32C-R"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: ber-1-s-1-r-1-1
                  rack_type: network
                  parent: ber-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "DCS-7050CX3-32C-R"]
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
          - index: 2
            layout: S_MIXED
            deployment_type: mixed
            suites: [ber-1-s-2]
            fabric_templates:
              - ["4", "spine", "DCS-7050CX3-32C-R"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: ber-1-s-2-r-1-1
                  rack_type: network
                  parent: ber-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "DCS-7050CX3-32C-R"]
                - index: 2
                  row_index: 1
                  shortname: ber-1-s-2-r-1-2
                  rack_type: compute
                  parent: ber-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
          - index: 3
            layout: S_TOR
            deployment_type: tor
            suites: [ber-1-s-3]
            fabric_templates:
              - ["4", "spine", "DCS-7050CX3-32C-R"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: ber-1-s-3-r-1-1
                  rack_type: tor
                  parent: ber-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "tor", "DCS-7050CX3-32C-R"]
