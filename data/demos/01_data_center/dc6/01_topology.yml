---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC6
      index: 1
      size: L
      routing_strategy: ebgp-ibgp
      underlay_protocol: ipv6
      naming_convention: standard
      fabric_templates:
        - ["2", "super-spine", "N9K-C9336C-FX2"]
        - ["2", "border-leaf", "PowerSwitch S5232F-ON"]
        - ["2", "firewall", "CP-26000"]
        - ["2", "load-balancer", "NetScaler-MPX-26000-100G"]
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          - index: 1
            layout: M_MIDDLE
            deployment_type: middle_rack
            suites: [ktw-1-s-1]
            fabric_templates:
              - ["2", "spine", "N9K-C9336C-FX2"]
            mlag_create: virtual
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 5
                  row_index: 1
                  shortname: ktw-1-s-1-r-1-5
                  rack_type: network
                  parent: ktw-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "PowerSwitch S5232F-ON"]
                    - ["2", "l2-leaf", "PowerSwitch-S5224F"]
                - index: 5
                  row_index: 2
                  shortname: ktw-1-s-1-r-2-5
                  rack_type: network
                  parent: ktw-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "PowerSwitch S5232F-ON"]
                    - ["2", "l2-leaf", "PowerSwitch-S5224F"]
          - index: 2
            layout: S_TOR
            deployment_type: tor
            suites: [ktw-1-s-2]
            fabric_templates:
              - ["2", "spine", "N9K-C9336C-FX2"]
            mlag_create: back-to-back
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: ktw-1-s-2-r-1-1
                  rack_type: tor
                  parent: ktw-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "tor", "N9K-C9336C-FX2"]
                - index: 5
                  row_index: 1
                  shortname: ktw-1-s-2-r-1-5
                  rack_type: tor
                  parent: ktw-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "tor", "N9K-C9336C-FX2"]
                - index: 1
                  row_index: 2
                  shortname: ktw-1-s-2-r-2-1
                  rack_type: tor
                  parent: ktw-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "tor", "PowerSwitch-S5224F"]
                - index: 5
                  row_index: 2
                  shortname: ktw-1-s-2-r-2-5
                  rack_type: tor
                  parent: ktw-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "tor", "PowerSwitch-S5224F"]
          - index: 3
            layout: M_MIXED
            deployment_type: mixed
            suites: [ktw-1-s-3]
            fabric_templates:
              - ["2", "spine", "N9K-C9336C-FX2"]
            mlag_create: virtual
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: ktw-1-s-3-r-1-1
                  rack_type: compute
                  parent: ktw-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
                - index: 4
                  row_index: 1
                  shortname: ktw-1-s-3-r-1-4
                  rack_type: network
                  parent: ktw-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "DCS-7050CX3-32C-R"]
                - index: 7
                  row_index: 1
                  shortname: ktw-1-s-3-r-1-7
                  rack_type: compute
                  parent: ktw-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
                - index: 1
                  row_index: 2
                  shortname: ktw-1-s-3-r-2-1
                  rack_type: compute
                  parent: ktw-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
                - index: 4
                  row_index: 2
                  shortname: ktw-1-s-3-r-2-4
                  rack_type: network
                  parent: ktw-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "DCS-7050CX3-32C-R"]
                - index: 7
                  row_index: 2
                  shortname: ktw-1-s-3-r-2-7
                  rack_type: compute
                  parent: ktw-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
