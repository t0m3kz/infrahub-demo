---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC3
      index: 1
      design: S_BORDER_SPINE
      naming_convention: flat
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          - index: 1
            design: S_BORDER_SPINE
            fabric_templates:
              - ["2", "border-spine", "PowerSwitch-S5232F-ON_BORDER_SPINE"]
              - ["2", "firewall", "CP-26000_FIREWALL"]
              - ["2", "load-balancer", "BIG-IP-i5800_LOAD_BALANCER"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: lon-1-s-1-r-1-1
                  rack_type: network
                  parent: lon-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["8", "leaf", "PowerSwitch-S5232F-ON_LEAF_MR"]
