---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC3
      index: 1
      size: L
      routing_strategy: ebgp-ebgp
      underlay_protocol: ipv6
      naming_convention: flat
      fabric_templates:
        - ["4", "super-spine", "PowerSwitch S5232F-ON"]
        - ["2", "border-leaf", "PowerSwitch S5232F-ON"]
        - ["2", "firewall", "CP-26000"]
        - ["2", "load-balancer", "BIG-IP-i5800"]
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          - index: 1
            layout: L_MIDDLE
            deployment_type: middle_rack
            suites: [lon-1-s-1]
            fabric_templates:
              - ["2", "spine", "N9K-C9336C-FX2"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: lon-1-s-1-r-1-1
                  rack_type: network
                  parent: lon-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "N9K-C9336C-FX2"]
                    - ["2", "l2-leaf", "N9K-C9336C-FX2"]
          - index: 2
            layout: L_MIDDLE
            deployment_type: middle_rack
            suites: [lon-1-s-2]
            fabric_templates:
              - ["2", "spine", "DCS-7050CX3-32C-R"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: lon-1-s-2-r-1-1
                  rack_type: network
                  parent: lon-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "DCS-7050CX3-32C-R"]
                    - ["2", "l2-leaf", "DCS-7050CX3-32C-R"]
          - index: 3
            layout: L_MIDDLE
            deployment_type: middle_rack
            suites: [lon-1-s-3]
            fabric_templates:
              - ["2", "spine", "PowerSwitch S5232F-ON"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: lon-1-s-3-r-1-1
                  rack_type: network
                  parent: lon-1-s-3
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "PowerSwitch S5232F-ON"]
                    - ["2", "l2-leaf", "PowerSwitch-S5224F"]
          - index: 4
            layout: L_MIDDLE
            deployment_type: middle_rack
            suites: [lon-1-s-4]
            fabric_templates:
              - ["2", "spine", "7726-32X-O"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: lon-1-s-4-r-1-1
                  rack_type: network
                  parent: lon-1-s-4
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "7726-32X-O"]
                    - ["2", "l2-leaf", "7AS7326-56X-O-48V-F"]
