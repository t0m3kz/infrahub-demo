              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: lon-1-s-2-r-1-1
                  rack_type: network
                  parent: lon-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["8", "leaf", "PowerSwitch-S5232F-ON_LEAF_MR"]
