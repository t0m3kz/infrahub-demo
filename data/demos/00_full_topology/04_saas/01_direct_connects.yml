---
# The Webex cross-connect, placed by a SaaS region and an owner (no account). Its port is the far end of the carrier
# circuit XC-DMC1-WEBEX-1 and its peering (scope saas, a VLAN peering with BGP) ends the session circuit; both are
# nested under the transport, which loads after the SaaS regions (04_saas/00_saas_topology.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudDirectConnect
  data:
    - name: webex-c900-fra-xc
      description: "Webex cross-connect at the Frankfurt peering point, tenant of C900 (SaaS: no account)"
      status: active
      connection_type: physical
      bandwidth: 1000
      saas_region: WEBEX-FRANKFURT
      owner: C900
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: wbx-port-1
            description: Webex peering point port
            status: active
        - kind: CloudPeeringInterface
          data:
            name: webex-c900-fra
            description: "Webex private peering, tenant of C900"
            status: active
            scope: saas
            routing: bgp
            vlan_id: 300
            bfd: false
            service_id: webex-org-c900
            parent_interface: ["webex-c900-fra-xc", "wbx-port-1"]
            auth: c900-webex-bgp-key
            peer_ip:
              data:
                address: "10.255.128.7/31"
                ip_namespace: PROD
                description: Webex side
            peer_asn: AS13445
