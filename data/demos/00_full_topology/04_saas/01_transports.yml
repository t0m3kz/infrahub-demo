---
# The SaaS transports: one device-shaped object per SaaS way to the edge, placed by a SaaS region and an owner (no
# account). Loaded after the SaaS regions (00_saas.yml).
#
#   webex-c900-fra-xc     Webex cross-connect, physical, SaaS: owner C900, no account
#   zscaler-c900-muc      Zscaler tunnel transport (CloudVPNConnection), holds the tunnel
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudDirectConnect
  data:
    - name: "webex-c900-fra-xc"
      description: "Webex cross-connect at the Frankfurt peering point, tenant of C900 (SaaS: no account)"
      status: active
      connection_type: physical
      bandwidth: 1000
      saas_region: "WEBEX-FRANKFURT"
      owner: "C900"
---
# The VPN transports hold the tunnels (03_peerings.yml). AWS: the provider side is the hub, our side the customer
# gateway. Zscaler (SaaS): a SaaS region and an owner, no account and no customer gateway.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVPNConnection
  data:
    - name: "zscaler-c900-muc"
      description: "Zscaler tunnel to the Munich node, tenant of C900 (SaaS: no account, no customer gateway)"
      status: active
      saas_region: "ZSCALER-MUNICH I"
      owner: "C900"
