---
# The circuits of the SaaS legs: the Webex cross-connect (carrier) and its BGP handoff (session). Same rules as
# 03_cloud/05_circuits.yml. The Zscaler tunnel circuit is the office's: 05_office/01_zscaler_tunnel.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: XC-DMC1-WEBEX-1
      circuit_id: XC-DMC1-WEBEX-1
      description: Cross-connect to the Webex peering point
      provider: P901
      circuit_type: cross_connect
      status: active
      bandwidth: 1000
      locations:
        - DMC1
        - WEBEX-FRANKFURT
      capabilities:
        - ["eg-dmc101", "Ethernet1/6"]
        - ["webex-c900-fra-xc", "wbx-port-1"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    - name: SC-C900-WEBEX-PROD
      description: 'Handoff: edge sub-interface to the Webex peering'
      provider: P901
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 10.255.128.6/31
        - PROD
      locations:
        - DMC1
        - WEBEX-FRANKFURT
      capabilities:
        - ["eg-dmc101", "Ethernet1/6.300"]
        - ["webex-c900-fra-xc", "webex-c900-fra"]
