---
# Cloud & SaaS connection model, sample data. Self-contained: loads on top of data/bootstrap only (no generator, no
# 30_all). Folders and files load in name order (one `infrahubctl object load` of the whole directory). See README.md.
#
# One tenant (C900), one provider added for the SaaS case, and the AS numbers the legs speak.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationProvider
  data:
    - name: "Cisco Webex"
      org_id: "P901"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Cloud Demo GmbH"
      org_id: "C900"
      member_of_groups:
        - customers
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 16509
      owner: "P004"
      description: "AWS (Direct Connect, VPN)"
    - asn: 64512
      owner: "P004"
      description: "Amazon side ASN of the transit gateway tgw-c900-euc1 (Direct Connect VIF and VPN)"
    - asn: 12076
      owner: "P005"
      description: "Microsoft (ExpressRoute)"
    - asn: 13445
      owner: "P901"
      description: "Webex (private peering)"
    - asn: 16550
      owner: "P006"
      description: "Google (Partner Interconnect, Cloud Router)"
    # Our side. A pool (PRIVATE-ASN32) hands these out once the generator exists; an object file cannot ask a pool.
    - asn: 4200090001
      owner: "P028"
      description: "dc90-edge-01 (would come from PRIVATE-ASN32)"
    - asn: 4200090002
      owner: "P028"
      description: "dc90-leaf-01 (would come from PRIVATE-ASN32)"
    - asn: 4200091001
      owner: "P028"
      description: "eg-dmc101, the cage edge of the colocation DMC1 (would come from PRIVATE-ASN32)"
