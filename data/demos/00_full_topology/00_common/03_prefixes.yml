---
# Address space of the sample. Link ranges (/31, /30) sit in the Handoff-PROD-IPv4 resource of the bootstrap data
# (10.255.128.0/20): an object file cannot allocate from a pool, so each /31 is typed here at the place the pool would
# hand it out (the first free /31 at the time). The generator will take them with allocate_next_ip_prefix.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - {prefix: "10.200.0.0/16", ip_namespace: "PROD", status: active, description: "AWS VPC block"}
    - {prefix: "10.90.255.0/24", ip_namespace: "PROD", status: active, description: "DC-KTW1 loopbacks"}
    - {prefix: "10.255.128.0/31", ip_namespace: "PROD", status: active, description: "Link: AWS transit VIF"}
    - {prefix: "10.255.128.2/31", ip_namespace: "PROD", status: active, description: "Link: AWS private VIF"}
    - {prefix: "10.255.128.6/31", ip_namespace: "PROD", status: active, description: "Link: Webex private peering"}
    # Azure assigns a /30 per peering (the link range is the circuit's, not the pool's), GCP a /29, AWS VPN a /30.
    # yamllint disable-line rule:line-length
    - {prefix: "10.255.128.8/30", ip_namespace: "PROD", status: active, description: "Link: ExpressRoute primary peering"}  # yamllint disable-line rule:line-length
    # yamllint disable-line rule:line-length
    - {prefix: "10.255.128.12/30", ip_namespace: "PROD", status: active, description: "Link: ExpressRoute secondary peering"}  # yamllint disable-line rule:line-length
    - {prefix: "169.254.20.0/29", ip_namespace: "PROD", status: active, description: "Link: GCP VLAN attachment"}
    - {prefix: "169.254.10.0/30", ip_namespace: "PROD", status: active, description: "Link: AWS VPN tunnel 1 (by AWS)"}
    - {prefix: "169.254.10.4/30", ip_namespace: "PROD", status: active, description: "Link: AWS VPN tunnel 2 (by AWS)"}
    - {prefix: "169.254.30.0/29", ip_namespace: "PROD", status: active, description: "Link: GCP dedicated routed port"}
    # yamllint disable-line rule:line-length
    - {prefix: "169.254.10.8/30", ip_namespace: "PROD", status: active, description: "Link: Zscaler tunnel (office edge)"}  # yamllint disable-line rule:line-length
    # yamllint disable-line rule:line-length
    - {prefix: "169.254.10.12/30", ip_namespace: "PROD", status: active, description: "Link: office tunnel to the DC edge (SD-WAN hub)"}  # yamllint disable-line rule:line-length
    - {prefix: "10.91.255.0/24", ip_namespace: "PROD", status: active, description: "PAR-COLO1 loopbacks"}
