---
# The cross-connect inside the cage, through the patch panel (the layout of 30_all's PP-EQX-FR2-01):
#
#   eg-dmc101 Ethernet1/1 --- front 1 | rear 1 of PP-DMC1-01 --- EXT-EQX-FABRIC-DMC1 et-0/0/0
#
# Cables in data are never generated. A hop inside one facility is a cable, not a carrier circuit (a carrier needs two
# distinct facilities). A panel port end repeats the connector of its template. The Fabric virtual connections that
# start on et-0/0/0 (03_cloud/04_circuits/00_carrier_circuits.yml) are carriers; the sub-interfaces on Ethernet1/1 are
# carried because the
# port is cabled (checks/circuit_placement.py: a cable on the port counts).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-DMC1-EDGE-PP01-F1"
      type: smf
      deployment: "DMC1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "eg-dmc101"
            name: "Ethernet1/1"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["dmc1-s-1-r-1-1", "PP-DMC1-01"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-DMC1-PP01-R1-FABRIC"
      type: smf
      deployment: "DMC1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["dmc1-s-1-r-1-1", "PP-DMC1-01"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "EXT-EQX-FABRIC-DMC1"
            name: "et-0/0/0"
