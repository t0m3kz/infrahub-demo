---
# The DCI that rides each dark fibre (30_all's ICX-DC10-EQXFR2): an Interconnect (`dci`) session circuit whose
# capabilities are exactly the fibre's two ports, so it is pure fibre (checks/circuit_placement.py), unowned, with the
# fibre's two facilities as locations. Each end device has exactly one `overlay` BGP process (dc90-bl-01-bgp,
# dc90-bl-02-bgp, eg-dmc101-bgp). The generator add_virtual_circuit would build the sessions of 02_dci_peerings.yml;
# it does not run here (no `virtual_circuits` membership), so they are authored by hand.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    - name: ICX-DC90-DMC1
      circuit_type: dci
      status: active
      provider: P016
      description: DCI DC90 <-> DMC1 over DF-DC90-DMC1
      locations:
        - DC90
        - DMC1
      capabilities:
        - ["dc90-bl-01", "Ethernet1/35"]
        - ["eg-dmc101", "Ethernet1/10"]
    - name: ICX-DC90-DMC1-B
      circuit_type: dci
      status: active
      provider: P016
      description: DCI DC90 <-> DMC1 over DF-DC90-DMC1-B
      locations:
        - DC90
        - DMC1
      capabilities:
        - ["dc90-bl-02", "Ethernet1/35"]
        - ["eg-dmc101", "Ethernet1/11"]
