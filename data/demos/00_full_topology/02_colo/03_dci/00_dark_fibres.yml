---
# DC <-> cage: two dark fibres, one from each border leaf of DC90 to the cage edge (the pair of fibres of 30_all's
# DF-DC10-EQXFR2 and DF-DC10-EQXFR2-B). A fibre is a pure carrier: no role, no session (the DCI that rides it is
# 01_dci_circuits.yml). Ethernet1/35 is a free uplink of the border leaf template, Ethernet1/10-11 are the `dci`
# ports of the edge template. Unowned shared underlay.
#
# `locations`: the cage and the DC. In 30_all only the cage is listed because add_circuit derives the other end from
# the end device's deployment; no generator runs on this sample's data, and a carrier needs its two locations to be
# valid (checks/circuit_placement.py), so both are authored.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: DF-DC90-DMC1
      circuit_id: DF-DC90-DMC1
      description: DC90 border leaf 1 to the DMC1 cage edge, 100G dark fibre
      provider: P016
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      locations:
        - DC90
        - DMC1
      capabilities:
        - ["dc90-bl-01", "Ethernet1/35"]
        - ["eg-dmc101", "Ethernet1/10"]
    - name: DF-DC90-DMC1-B
      circuit_id: DF-DC90-DMC1-B
      description: DC90 border leaf 2 to the DMC1 cage edge, 100G dark fibre
      provider: P016
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      locations:
        - DC90
        - DMC1
      capabilities:
        - ["dc90-bl-02", "Ethernet1/35"]
        - ["eg-dmc101", "Ethernet1/11"]
