---
# L3 of the cage edge, by hand (no generator): the VRF of the topology (PROD, hosted by the metro) with the edge as
# its member. The sub-interfaces that face the cloud and SaaS legs, and the overlay BGP process, follow.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "par-vrf-prod"
      namespace: "PROD"
      deployment: "PAR"
      shared_devices:
        - "par-colo1-edge-01"
---
# The INTERNET VRF instance of the PAR metro with the cage edge as its member: the cage edge has its own access to the
# second ISP (par1-ispb-77302-isp-b, its eBGP session is 06_internet/03_routing) and, behind the external firewall
# pair of the cage, the return route of the pair's public address (03_firewalls/05_routes.yml, which loads after).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "par-vrf-internet"
      namespace: "INTERNET"
      deployment: "PAR"
      shared_devices:
        - "par-colo1-edge-01"
