---
# The building of the cage in the Demo Metro (01_dc/00_locations.yml): one suite, one rack. The rack holds the patch
# panel of the cage (02_colo/03_patch_panel.yml) and is pinned to the zone. `topologies_rack` membership is what keeps
# the created-rack trigger a no-op for a rack of a colocation zone (a non-member is a failed task, as in 30_all).
apiVersion: infrahub.app/v1
version: "1.0"
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: "DMC1"
      shortname: "dmc1"
      parent: "dmo"
      children:
        kind: LocationSuite
        data:
          - name: DMC1-Suite-1
            index: 1
            shortname: "dmc1-s-1"
            rows: 1
            racks_per_row: 1
            children:
              kind: LocationRack
              data:
                - name: DMC1-S1-R1-1
                  shortname: dmc1-s-1-r-1-1
                  index: 1
                  row_index: 1
                  deployment: DMC1
                  member_of_groups: [topologies_rack]
