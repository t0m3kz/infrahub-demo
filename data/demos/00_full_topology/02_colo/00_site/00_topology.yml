---
# One colocation, one metro, ONE zone (the cage): the place where the cloud and SaaS legs of the sample land, a Direct
# Connect, an ExpressRoute or a Webex cross-connect is delivered to a cage and never to a DC. The zone is the facility
# a circuit end derives from (the DC reaches the cage over dark fibre, 02_colo/03_dci/00_dark_fibres.yml). Nothing is
# generated
# (no `member_of_groups`): the zone declares no `fabric_templates`, its one edge is written by hand
# (02_colo/01_physical/01_devices.yml), like the DC of this sample.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: COLO-DEMO
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: DMC
            location: ["dmo"]
            children:
              kind: TopologyColocationZone
              data:
                - name: DMC1
