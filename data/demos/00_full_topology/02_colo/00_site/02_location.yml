---
# The building of the cage in the Paris metro (02_colo/00_site/00_metro.yml): one suite, one rack. The rack holds the
# patch
# panel of the cage (02_colo/01_physical/00_patch_panels.yml) and is pinned to the zone. `topologies_rack` membership
# is what keeps
# the created-rack trigger a no-op for a rack of a colocation zone (a non-member is a failed task, as in 30_all).
apiVersion: infrahub.app/v1
version: "1.0"
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: "PAR-COLO1"
      shortname: "par-colo1"
      parent: "par"
      children:
        kind: LocationSuite
        data:
          - name: PAR-COLO1-SUITE-1
            index: 1
            shortname: "par-colo1-suite-1"
            rows: 1
            racks_per_row: 1
            children:
              kind: LocationRack
              data:
                - name: PAR-COLO1-RACK-01
                  shortname: par-colo1-rack-01
                  index: 1
                  row_index: 1
                  deployment: PAR-COLO1
                  member_of_groups: [topologies_rack]
