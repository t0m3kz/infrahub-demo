---
# One colocation, one metro, one zone (the cage AMS-COLO1), like PAR-COLO1 but with no cloud or SaaS leg:
# the cage is DCI transit only (its fibres are 02_colo/03_dci). Nothing generated (no fabric_templates).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: COLO-AMS
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: AMS
            location: ["ams"]
            children:
              kind: TopologyColocationZone
              data:
                - name: AMS-COLO1
