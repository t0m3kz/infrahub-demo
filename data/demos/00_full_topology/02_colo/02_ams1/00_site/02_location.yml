---
# The building of the cage in the Amsterdam metro: one suite, one rack, pinned to the zone (the edge stands
# in it). `topologies_rack` keeps the created-rack trigger a no-op for a rack of a colocation zone.
apiVersion: infrahub.app/v1
version: "1.0"
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: "AMS-COLO1"
      shortname: "ams-colo1"
      parent: "ams"
      children:
        kind: LocationSuite
        data:
          - name: AMS-COLO1-SUITE-1
            index: 1
            shortname: "ams-colo1-suite-1"
            rows: 1
            racks_per_row: 1
            children:
              kind: LocationRack
              data:
                - name: AMS-COLO1-RACK-01
                  shortname: ams-colo1-rack-01
                  index: 1
                  row_index: 1
                  deployment: AMS-COLO1
                  member_of_groups: [topologies_rack]
