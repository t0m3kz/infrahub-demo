---
# One authored ManagedMLAG over the two leaves (the vPC domain).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedMLAG
  data:
    - name: "ktw1-mlag-01"
      description: "vPC domain of the leaf pair"
      status: active
      peer_devices: "ktw1-leaf-01,ktw1-leaf-02"
      domain_id: 1
      capabilities:
        - "ktw1-leaf-01"
        - "ktw1-leaf-02"
