---
# The VXLAN segment of C900, realized on the leaf: segment -> deployment (VNI) -> VLAN row of the leaf (VLAN 100, its
# SVI, 01_dc/02_routing/02_virtual_interfaces.yml). The gateway 10.90.1.1/24 and its prefix 10.90.1.0/24 exist only
# for the segment, so they are nested under it. The port Ethernet1/1 of the leaf is a member of the segment
# (01_dc/03_tenant/03_segment_port.yml). The segment is nested under no customer: its owner is the relationship.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - owner: C900
      customer_name: demo-web
      environment: p
      customer_deployments: ["C900-P-DC90"]
      gateway:
        data:
          address: "10.90.1.1/24"
          description: Gateway of c900-demo-web-p
          ip_namespace: PROD
          ip_prefix:
            kind: IpamPrefix
            data:
              prefix: "10.90.1.0/24"
              ip_namespace: PROD
              status: active
              description: DC segment c900-demo-web-p
      segment_deployments:
        data:
          - deployment: DC90
            vni: 10100
            vlan_domain_segments:
              data:
                - device: dc90-leaf-01
                  vlan_id: 100
                  svi: ["dc90-leaf-01", "Vlan100"]
