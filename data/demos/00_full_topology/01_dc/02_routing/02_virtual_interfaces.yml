---
# The SVI of the leaf in the PROD VRF of DC90 (the segment's VLAN row of this leaf is nested under the segment,
# 01_dc/03_tenant/01_segment.yml). The tunnel interfaces of the DC edge are nested under the device
# (01_dc/01_physical/01_devices.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan100
      device: dc90-leaf-01
      role: svi
      status: active
      vrf: ["DC90", "PROD"]
---
# The SVI of the segment on leaf-02 (VLAN 100, in the PROD VRF of DC90). Its VLAN-domain row, with the SAME vlan_id as
# leaf-01's (both peers of an MLAG pair carry a segment under one id), is created by tests/traversal/load_topology.py
# (add_vlan_row): an object file cannot name the segment's deployment the row hangs under (ManagedSegmentDeployment has
# no human friendly id), and nesting it again under the segment violates the deployment's uniqueness.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Vlan100"
      device: "dc90-leaf-02"
      role: svi
      status: active
      vrf: ["DC90", "PROD"]
