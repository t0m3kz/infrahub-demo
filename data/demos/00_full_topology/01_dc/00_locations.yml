---
# One data center with one suite, one rack (the patch panel's), and the topology objects the devices hang on.
apiVersion: infrahub.app/v1
version: "1.0"
kind: Object
spec:
  kind: LocationMetro
  data:
    - name: "Demo Metro"
      shortname: "dmo"
      parent: de
      children:
        kind: LocationFacility
        data:
          - name: "DMO-1"
            shortname: "dmo-1"
            children:
              kind: LocationSuite
              data:
                - name: DMO-1-Suite-1
                  index: 1
                  shortname: "dmo-1-s-1"
                  parent: dmo-1
                  rows: 1
                  racks_per_row: 2
                  children:
                    kind: LocationRack
                    data:
                      - name: DMO-1-S1-R1-1
                        shortname: dmo-1-s-1-r-1-1
                        index: 1
                        row_index: 1
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC90
      parent: "Data Center"
      index: 9
      design: S
---
# The pod of the data center: its name is computed, {DC}-{DC index}-POD-{index} (DC90-9-POD-1). The design is the
# envelope only (S_MIDDLE is one of the pod templates of the DC design S); the spine and the two leaves are deployed
# to it (01_devices.yml, 08_pod_devices.yml), the border leaves and the edge stay at the DC. No racks are linked to
# the pod: the suite of this sample is smaller than the S_MIDDLE envelope, and checks/suite_capacity.py judges only
# racks that name their pod. Nothing is generated (no group membership).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyPod
  data:
    - parent: "DC90"
      index: 1
      design: S_MIDDLE
      status: active
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyExternalProviders
  data:
    - name: ISP-DEMO
      parent: "Internet"
      status: active
      provider: "P014"
