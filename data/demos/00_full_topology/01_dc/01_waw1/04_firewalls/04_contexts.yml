---
# The firewall context of DC-WAW1 for C900 (production): east-west, with a leg in PROD only. It lists its legs and the
# firewall ports of the border leaves that face the pair as its capabilities (the leaves read the legs through those
# ports). Data here; a generator builds the same objects on 30_all.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: shared-waw1-fw-ha-prod
      cluster: waw1-fw-ha
      vlan_id: 3000
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: waw1-fw-01, name: "ethernet1/1.3000"}
        - kind: DcimVirtualInterface
          data: {device: waw1-fw-02, name: "ethernet1/1.3000"}
        - kind: DcimPhysicalInterface
          data: {device: waw1-bl-01, name: "Ethernet1/25"}
        - kind: DcimPhysicalInterface
          data: {device: waw1-bl-02, name: "Ethernet1/25"}
---
# C900's footprint in DC-WAW1 names the context that serves it. The same object as in 03_tenant/00_customer_dc.yml (an
# upsert by its keys) with the one link added: the contexts load after the footprint.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C900"
      environment: "p"
      infrastructure_orchestrator: ansible_automation_platform
      parent: "DC-WAW1"
      serving_firewall_context: shared-waw1-fw-ha-prod
