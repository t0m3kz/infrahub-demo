            name: "Ethernet1/33"
    - name: "CBL-WAW1-BL02-EDGE01"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-bl-02"
            name: "Ethernet1/1"
        - kind: DcimPhysicalInterface
          data:
