          data:
            device: "waw1-leaf-02"
            name: "Ethernet1/31"
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-spine-01"
            name: "Ethernet1/2"
    - name: "CBL-WAW1-SPINE01-BL01"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-spine-01"
            name: "Ethernet1/3"
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-bl-01"
            name: "Ethernet1/33"
    - name: "CBL-WAW1-SPINE01-BL02"
