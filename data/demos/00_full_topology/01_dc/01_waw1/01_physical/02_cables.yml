---
# Cabling of DC-WAW1, as in DC-KTW1 without its old direct leaf - edge link: the server dual-homed through the
# compute rack panel and the leaf rack panels, the vPC peer link, both leaves to the spine, the spine to both border
# leaves, border leaf 1 to the edge through jack 1 of the border rack panel, border leaf 2 on a direct cable. Cables in
# data are never generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-WAW1-SRV01-ENO1-PP02-F1"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-srv-01"
            name: "eno1"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["waw1-rack-02", "PP-WAW1-02"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-WAW1-PP02-R1-PP03-F1"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["waw1-rack-02", "PP-WAW1-02"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["waw1-rack-03", "PP-WAW1-03"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-WAW1-PP03-R1-LEAF01"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["waw1-rack-03", "PP-WAW1-03"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-leaf-01"
            name: "Ethernet1/2"
    - name: "CBL-WAW1-SRV01-ENO2-PP02-F2"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-srv-01"
            name: "eno2"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["waw1-rack-02", "PP-WAW1-02"]
            name: "2"
            connector: "lc-upc"
    - name: "CBL-WAW1-PP02-R2-PP04-F1"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["waw1-rack-02", "PP-WAW1-02"]
            name: "2"
            connector: "lc-upc"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["waw1-rack-04", "PP-WAW1-04"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-WAW1-PP04-R1-LEAF02"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["waw1-rack-04", "PP-WAW1-04"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-leaf-02"
            name: "Ethernet1/2"
    - name: "CBL-WAW1-LEAF01-LEAF02-PEER"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-leaf-01"
            name: "Ethernet1/33"
        - kind: DcimPhysicalInterface
          data:
            device: "waw1-leaf-02"
            name: "Ethernet1/33"
    - name: "CBL-WAW1-LEAF01-SPINE01"
      type: smf
