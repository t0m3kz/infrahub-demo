---
# The VXLAN segment of C900 in DC-WAW1: segment -> deployment (VNI 10200) -> VLAN row of leaf-01 (VLAN
# 200, its SVI in 02_routing/02_virtual_interfaces.yml). The gateway 10.92.1.1/24 and its prefix are nested.
# The vPC port-channels carry it (02_lag_interfaces.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - owner: C900
      customer_name: app
      environment: p
      customer_deployments: ["C900-P-DC-WAW1"]
      gateway:
        data:
          address: "10.92.1.1/24"
          description: Gateway of c900-app-p
          ip_namespace: PROD
          ip_prefix:
            kind: IpamPrefix
            data:
              prefix: "10.92.1.0/24"
              ip_namespace: PROD
              status: active
              description: DC segment c900-app-p
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-app-p
      deployment: DC-WAW1
      vni: 10200
      vlans:
        data:
          - device: waw1-leaf-01
            vlan_id: 200
            svi: ["waw1-leaf-01", "Vlan200"]
          - device: waw1-leaf-02
            vlan_id: 200
            svi: ["waw1-leaf-02", "Vlan200"]
