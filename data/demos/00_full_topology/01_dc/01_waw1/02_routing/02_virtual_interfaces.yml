---
# The SVIs of the segment c900-app-p on both leaves (VLAN 200, in the PROD VRF of DC-WAW1). The rows of both leaves
# are nested under the deployment of the segment (03_tenant/01_segment.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan200
      device: waw1-leaf-01
      role: svi
      status: active
      vrf: ["DC-WAW1", "PROD"]
    - name: Vlan200
      device: waw1-leaf-02
      role: svi
      status: active
      vrf: ["DC-WAW1", "PROD"]
---
# The L3 VNI SVI of the PROD VRF on the two border leaves of DC-WAW1: where the VRF's traffic enters from the
# overlay (no address; the VLAN is the fixed slot of the namespace type, 3900 for PROD). The instance: 01_vrf.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan3900
      device: waw1-bl-01
      role: l3vni
      status: active
      vrf: ["DC-WAW1", "PROD"]
    - name: Vlan3900
      device: waw1-bl-02
      role: l3vni
      status: active
      vrf: ["DC-WAW1", "PROD"]
