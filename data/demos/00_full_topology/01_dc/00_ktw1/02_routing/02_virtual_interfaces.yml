---
# The SVI of the leaf in the PROD VRF of DC-KTW1 (the segment's VLAN row of this leaf is nested under the segment,
# 01_dc/00_ktw1/03_tenant/01_segment.yml). The tunnel interfaces of the DC edge are nested under the device
# (01_dc/00_ktw1/01_physical/01_devices.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan100
      device: ktw1-leaf-01
      role: svi
      status: active
      vrf: ["DC-KTW1", "PROD"]
---
# The SVI of the segment on leaf-02 (VLAN 100, in the PROD VRF of DC-KTW1). Its VLAN-domain row, with the SAME vlan_id
# as leaf-01's (both peers of an MLAG pair carry a segment under one id), is nested with leaf-01's under the deployment
# of the segment (03_tenant/01_segment.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Vlan100"
      device: "ktw1-leaf-02"
      role: svi
      status: active
      vrf: ["DC-KTW1", "PROD"]
