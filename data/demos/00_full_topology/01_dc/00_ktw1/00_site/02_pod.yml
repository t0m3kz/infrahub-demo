---
# The pod of the data center: its name is computed, {DC}-{DC index}-POD-{index} (DC-KTW1-9-POD-1). The design is the
# envelope only (S_MIDDLE is one of the pod templates of the DC design S); the spine, the two leaves and the server are
# deployed to it (01_dc/00_ktw1/01_physical/01_devices.yml), the border leaves and the edge stay at the
# DC. The racks of the pod name it (03_racks.yml), so checks/suite_capacity.py holds the suite to the S_MIDDLE envelope
# (2 rows, 8 + 1 slots per row). Nothing is generated (no group membership).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyPod
  data:
    - parent: "DC-KTW1"
      index: 1
      design: S_MIDDLE
      status: active
