---
# The PBR of C900 in DC-KTW1: the two SVIs of its segment c900-web-p are steered to the firewall that serves the
# footprint (shared-ktw1-fw-ha-prod, 04_contexts.yml). The policy holds no next hop, ACL or bypass: the transform
# derives them from the footprint's context and the segment's policies. The interfaces are its capabilities, like a
# peering's. Authored here, so `origin` is manual; on 30_all the VRF pass of the device writes the same object
# (generators/helpers/pbr_sync.py).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingPolicy
  data:
    - name: pbr-c900-p-dc-ktw1
      description: "C900 in DC-KTW1: segments steered to shared-ktw1-fw-ha-prod"
      kind: pbr
      origin: manual
      customer_deployment: "C900-P-DC-KTW1"
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: ktw1-leaf-01, name: Vlan100}
        - kind: DcimVirtualInterface
          data: {device: ktw1-leaf-02, name: Vlan100}
