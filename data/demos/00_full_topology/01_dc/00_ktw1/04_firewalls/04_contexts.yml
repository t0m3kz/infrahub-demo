---
# The firewall contexts of DC-KTW1, one per environment of C900 (production):
#   shared-ktw1-fw-ha-prod   on the internal pair; C900's east-west context (the footprint names it, below). It has a
#                            leg in PROD only: the DC has an Internet edge, so it keeps no INTERNET leg and no public
#                            address.
#   shared-ktw1-xfw-ha-prod  on the external pair; the Internet edge of the DC (internet_edge_hostings), with a PROD leg
#                            and an INTERNET leg, joined by the routed exchange below, and the public address (SNAT) the
#                            traffic of the shared customers leaves with.
# The transit VLAN of a leg is the context's vlan_id plus the slot of its VRF (utils/exchange_transit.py: PROD 0,
# INTERNET 400). A context lists its legs (03_legs.yml) and the firewall ports of the border leaves that face its pair
# as its capabilities (the leaves read the legs through those ports). Contexts and legs are data here; a generator
# builds the same objects on 30_all.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: shared-ktw1-fw-ha-prod
      cluster: ktw1-fw-ha
      vlan_id: 3000
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: ktw1-fw-01, name: "ethernet1/1.3000"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-fw-02, name: "ethernet1/1.3000"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-bl-01, name: "Ethernet1/25"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-bl-02, name: "Ethernet1/25"}
    - name: shared-ktw1-xfw-ha-prod
      cluster: ktw1-xfw-ha
      vlan_id: 3001
      internet_edge_hostings: ["DC-KTW1"]
      snat_address:
        data:
          address: "192.0.2.20/32"
          description: "SNAT address of shared-ktw1-xfw-ha-prod"
          ip_namespace: INTERNET
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-01, name: "ethernet1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-02, name: "ethernet1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-01, name: "ethernet1/1.3401"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-02, name: "ethernet1/1.3401"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-bl-01, name: "Ethernet1/26"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-bl-02, name: "Ethernet1/26"}
---
# The routed exchange of the edge context between the tenant VRF and INTERNET; the INTERNET and PROD legs of both
# members are linked to it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyRoutedExchange
  data:
    - name: shared-ktw1-xfw-ha-prod-PROD-INTERNET
      gateway: shared-ktw1-xfw-ha-prod
      namespace_a: PROD
      namespace_z: INTERNET
      status: active
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-01, name: "ethernet1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-02, name: "ethernet1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-01, name: "ethernet1/1.3401"}
        - kind: DcimVirtualInterface
          data: {device: ktw1-xfw-02, name: "ethernet1/1.3401"}
---
# C900's footprint names the context that serves it. The same object as in 03_tenant/00_customer_dc.yml (an upsert by
# its keys) with the one link added: the contexts load after the footprint, and a generic peer (served_deployments of
# the context) cannot be named by a string, so the link is written from this side.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C900"
      environment: "p"
      infrastructure_orchestrator: ansible_automation_platform
      parent: "DC-KTW1"
      serving_firewall_context: shared-ktw1-fw-ha-prod
