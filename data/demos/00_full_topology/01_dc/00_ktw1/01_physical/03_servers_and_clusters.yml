---
# The extra servers and the vSphere (vCenter) cluster of the DC-KTW1 data hall. The cluster model is hypervisor-
# neutral (schemas/extensions/service/cluster.yml, `hypervisor`): one kind describes a vCenter, a Proxmox and a
# Nutanix cluster, so the three DCs use three vendors on purpose. A cluster needs more than one host: a VM then
# survives the loss of one box, and checks/cluster.py (rule CL5) asks the instances of a component to stand on
# different hosts. ktw1-srv-02, ktw1-srv-03 have no bond and no tagged port in the data: the two ports go straight to
# the leaf pair (eno1 to leaf 1, eno2 to leaf 2), without the patch panels of ktw1-srv-01, so a server is cabled
# inventory rather than a tenant server.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: ktw1-srv-02
      object_template: PowerEdge-R640_SERVER
      description: "Host 2 of ktw1-vsphere-cl01, eno1 and eno2 straight to the leaf pair"
      deployment: DC-KTW1-9-POD-1
      rack: ktw1-rack-02
      position: 18
      rack_face: front
    - name: ktw1-srv-03
      object_template: PowerEdge-R640_SERVER
      description: "Host 3 of ktw1-vsphere-cl01, eno1 and eno2 straight to the leaf pair"
      deployment: DC-KTW1-9-POD-1
      rack: ktw1-rack-02
      position: 16
      rack_face: front
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-KTW1-SRV02-ENO1-LEAF01"
      type: copper
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-srv-02"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-01"
            name: "Ethernet1/5"
    - name: "CBL-KTW1-SRV02-ENO2-LEAF02"
      type: copper
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-srv-02"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-02"
            name: "Ethernet1/5"
    - name: "CBL-KTW1-SRV03-ENO1-LEAF01"
      type: copper
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-srv-03"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-01"
            name: "Ethernet1/6"
    - name: "CBL-KTW1-SRV03-ENO2-LEAF02"
      type: copper
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-srv-03"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-02"
            name: "Ethernet1/6"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedHypervisorCluster
  data:
    - name: ktw1-vsphere-cl01
      description: "C900 production compute of DC-KTW1: vSphere (vCenter), 3 hosts"
      status: active
      software_image: vsphere-8.0U3
      manager: "vcenter.ktw1.demo.local"
      inventory_path: KTW1
      ha_enabled: true
      load_balancing: true
      deployment: DC-KTW1-9-POD-1
      hosts:
        - ktw1-srv-01
        - ktw1-srv-02
        - ktw1-srv-03
