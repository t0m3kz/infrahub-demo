---
# L1 of the DC segment: leaf Ethernet1/1 (carries the segment) -- front 1 | rear 1 of PP-KTW1-01 -- edge Ethernet1/13.
# Cables in data are never generated. A panel port end repeats the connector of its template.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-KTW1-LEAF01-PP01-F1"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-01"
            name: "Ethernet1/1"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["ktw1-rack-01", "PP-KTW1-01"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-KTW1-PP01-R1-EDGE01"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["ktw1-rack-01", "PP-KTW1-01"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-edge-01"
            name: "Ethernet1/13"
---
# Cabling of the pod. The server is dual-homed (eno1 to leaf-01, eno2 to leaf-02), each link through the panel of the
# compute rack and the panel of the leaf's rack (port - cable - front | rear - cable - front | rear - cable - port),
# the leaves are joined by their mlag-peer ports, both leaves reach the one spine, the spine both border leaves.
# Border leaf 1 reaches the edge through jack 2 of the patch panel in the border rack (front 2 | rear 2), border leaf 2
# on a direct cable. Cables in data are never generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-KTW1-SRV01-ENO1-PP02-F1"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-srv-01"
            name: "eno1"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["ktw1-rack-02", "PP-KTW1-02"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-KTW1-PP02-R1-PP03-F1"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["ktw1-rack-02", "PP-KTW1-02"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["ktw1-rack-03", "PP-KTW1-03"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-KTW1-PP03-R1-LEAF01"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["ktw1-rack-03", "PP-KTW1-03"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-01"
            name: "Ethernet1/2"
    - name: "CBL-KTW1-SRV01-ENO2-PP02-F2"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-srv-01"
            name: "eno2"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["ktw1-rack-02", "PP-KTW1-02"]
            name: "2"
            connector: "lc-upc"
    - name: "CBL-KTW1-PP02-R2-PP04-F1"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["ktw1-rack-02", "PP-KTW1-02"]
            name: "2"
            connector: "lc-upc"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["ktw1-rack-04", "PP-KTW1-04"]
            name: "1"
            connector: "lc-upc"
    - name: "CBL-KTW1-PP04-R1-LEAF02"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["ktw1-rack-04", "PP-KTW1-04"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-02"
            name: "Ethernet1/2"
    - name: "CBL-KTW1-LEAF01-LEAF02-PEER"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-01"
            name: "Ethernet1/33"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-02"
            name: "Ethernet1/33"
    - name: "CBL-KTW1-LEAF01-SPINE01"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-01"
            name: "Ethernet1/31"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-spine-01"
            name: "Ethernet1/1"
    - name: "CBL-KTW1-LEAF02-SPINE01"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-leaf-02"
            name: "Ethernet1/31"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-spine-01"
            name: "Ethernet1/2"
    - name: "CBL-KTW1-SPINE01-BL01"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
