            name: "Ethernet1/4"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-bl-02"
            name: "Ethernet1/33"
    - name: "CBL-KTW1-BL02-EDGE01"
      type: smf
      deployment: "DC-KTW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-bl-02"
            name: "Ethernet1/1"
        - kind: DcimPhysicalInterface
          data:
            device: "ktw1-edge-01"
            name: "Ethernet1/10"
    - name: "CBL-KTW1-BL01-PP01-F2"
      type: smf
