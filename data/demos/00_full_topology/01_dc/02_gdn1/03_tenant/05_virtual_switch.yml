---
# The virtual switch of gdn1-nutanix-cl01: the Open vSwitch br0 of Nutanix AHV, the L2 element between the VM NICs and
# the host ports (schemas/extensions/service/virtual_switch.yml). The cluster is hypervisor-neutral and so is this: a
# distributed switch, a Linux bridge and an Open vSwitch are one kind with a different `switch_type`. Its uplinks are
# the host's bond0 (gdn1-srv-01) and the single port eno1 (gdn1-srv-02); the `segments` of an uplink is its allowed
# VLAN list, so each trunks the segment of the port group (checks/virtual_switch.py, rule VS3). The port group is VLAN
# 300 of the switch and the fabric segment c900-db-p; the VM NIC eth0 is in it. The VLAN of the leaf port is the
# fabric's own (a VLAN is local to a switch), the port group carries the one the host side uses.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimLAGInterface
  data:
    - device: gdn1-srv-01
      name: bond0
      status: active
      lag_id: 1
      lacp_mode: active
      minimum_links: 1
      segments:
        - c900-db-p
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - device: gdn1-srv-02
      name: eno1
      segments:
        - c900-db-p
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVirtualSwitch
  data:
    - name: gdn1-br0
      description: "The Open vSwitch br0 of Nutanix AHV of gdn1-nutanix-cl01"
      status: active
      switch_type: ovs
      mtu: 1500
      cluster: gdn1-nutanix-cl01
      uplinks:
        - kind: DcimLAGInterface
          data:
            device: gdn1-srv-01
            name: bond0
            status: active
            lag_id: 1
            lacp_mode: active
            minimum_links: 1
        - kind: DcimPhysicalInterface
          data:
            device: gdn1-srv-02
            name: eno1
      port_groups:
        kind: ManagedPortGroup
        data:
          - name: c900-db
            description: "C900 c900-db-p on the hosts"
            vlan_id: 300
            segment: c900-db-p
            nics:
              - ["gdn1-vm-01", "eth0"]
