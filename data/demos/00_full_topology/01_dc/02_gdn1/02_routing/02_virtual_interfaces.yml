---
# The SVIs of the segment c900-db-p on both leaves (VLAN 300, in the PROD VRF of DC-GDN1). The row of leaf-01
# is nested under the segment (03_tenant/01_segment.yml), the row of leaf-02 is created by
# tests/traversal/load_topology.py (an object file cannot name the segment's deployment).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan300
      device: gdn1-leaf-01
      role: svi
      status: active
      vrf: ["DC-GDN1", "PROD"]
    - name: Vlan300
      device: gdn1-leaf-02
      role: svi
      status: active
      vrf: ["DC-GDN1", "PROD"]
