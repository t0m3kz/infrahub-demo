---
# The EVPN overlay sessions leaf-01/02 - spine - border leaves - edge (no direct leaf - edge session).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "BGP-GDN1-LEAF01-SPINE01"
      description: "EVPN overlay"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "gdn1-leaf-01-bgp"
        - "gdn1-spine-01-bgp"
    - name: "BGP-GDN1-LEAF02-SPINE01"
      description: "EVPN overlay"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "gdn1-leaf-02-bgp"
        - "gdn1-spine-01-bgp"
    - name: "BGP-GDN1-SPINE01-BL01"
      description: "EVPN overlay"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "gdn1-spine-01-bgp"
        - "gdn1-bl-01-bgp"
    - name: "BGP-GDN1-SPINE01-BL02"
      description: "EVPN overlay"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "gdn1-spine-01-bgp"
        - "gdn1-bl-02-bgp"
    - name: "BGP-GDN1-BL01-EDGE01"
      description: "EVPN overlay"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "gdn1-bl-01-bgp"
        - "gdn1-edge-01-bgp"
    - name: "BGP-GDN1-BL02-EDGE01"
      description: "EVPN overlay"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "gdn1-bl-02-bgp"
        - "gdn1-edge-01-bgp"
