---
# One overlay process per routing device of the pod and the DC; the loopback (router id) is nested.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: gdn1-edge-01-bgp
      status: active
      process_role: overlay
      local_as: AS4200093001
      router_id:
        data:
          address: "10.93.255.1/32"
          ip_namespace: PROD
          description: gdn1-edge-01 loopback
      capabilities: ["gdn1-edge-01"]
    - name: gdn1-leaf-01-bgp
      status: active
      process_role: overlay
      local_as: AS4200093002
      router_id:
        data:
          address: "10.93.255.2/32"
          ip_namespace: PROD
          description: gdn1-leaf-01 loopback
      capabilities: ["gdn1-leaf-01"]
    - name: gdn1-leaf-02-bgp
      status: active
      process_role: overlay
      local_as: AS4200093003
      router_id:
        data:
          address: "10.93.255.3/32"
          ip_namespace: PROD
          description: gdn1-leaf-02 loopback
      capabilities: ["gdn1-leaf-02"]
    - name: gdn1-spine-01-bgp
