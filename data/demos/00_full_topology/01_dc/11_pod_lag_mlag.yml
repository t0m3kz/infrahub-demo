---
# The vPC: one port-channel per leaf (same lag_id), each with its own Ethernet1/2 as the member, the segment on both
# (the typed port-side edge `segments`, so the segment reaches the server through the LAGs), and one authored
# ManagedMLAG over the two leaves. The server's bond0 bundles eno1 and eno2, one to each leaf.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimLAGInterface
  data:
    - device: "dc90-leaf-01"
      name: "Port-Channel10"
      description: "vPC to dc90-srv-01 (bond0)"
      status: active
      lag_id: 10
      lacp_mode: active
      minimum_links: 1
      member_interfaces:
        - ["dc90-leaf-01", "Ethernet1/2"]
      segments:
        - "c900-demo-web-p"
    - device: "dc90-leaf-02"
      name: "Port-Channel10"
      description: "vPC to dc90-srv-01 (bond0)"
      status: active
      lag_id: 10
      lacp_mode: active
      minimum_links: 1
      member_interfaces:
        - ["dc90-leaf-02", "Ethernet1/2"]
      segments:
        - "c900-demo-web-p"
    - device: "dc90-srv-01"
      name: "bond0"
      description: "LACP bond over eno1 and eno2"
      status: active
      lag_id: 1
      lacp_mode: active
      minimum_links: 1
      member_interfaces:
        - ["dc90-srv-01", "eno1"]
        - ["dc90-srv-01", "eno2"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedMLAG
  data:
    - name: "dc90-mlag-01"
      description: "vPC domain of the leaf pair"
      status: active
      peer_devices: "dc90-leaf-01,dc90-leaf-02"
      domain_id: 1
      capabilities:
        - "dc90-leaf-01"
        - "dc90-leaf-02"
