---
# One data center with one suite (2 rows x 9 slots: the S_MIDDLE envelope of the pod) and the topology objects the
# devices hang on. The suite is the data hall; its racks are here (the border and edge rack) and in 03_racks.yml (the
# racks of the pod, which need the pod below).
apiVersion: infrahub.app/v1
version: "1.0"
kind: Object
spec:
  kind: LocationMetro
  data:
    - name: "Demo Metro"
      shortname: "dmo"
      parent: de
      children:
        kind: LocationFacility
        data:
          - name: "DMO-1"
            shortname: "dmo-1"
            children:
              kind: LocationSuite
              data:
                - name: DMO-1-Suite-1
                  index: 1
                  shortname: "dmo-1-s-1"
                  parent: dmo-1
                  rows: 2
                  racks_per_row: 9
                  children:
                    kind: LocationRack
                    data:
                      - name: DMO-1-S1-R1-1
                        shortname: dmo-1-s-1-r-1-1
                        index: 1
                        row_index: 1
                        rack_type: network
