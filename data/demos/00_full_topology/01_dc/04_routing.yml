---
# L3 of the DC side, authored by hand (no generator): the VRF of the topology (PROD), the leaf SVI in it, the BGP
# processes of leaf and edge, the overlay peering between them, and the tunnel interfaces of the DC edge (the AWS VPN
# rides the internet access port Ethernet1/2; the hub end of the office tunnel is 05_office/01_edge.yml). The cloud and
# SaaS legs are NOT here: a Direct Connect, an ExpressRoute or a Webex cross-connect lands in a colocation cage, so
# their sub-interfaces and sessions belong to the cage edge (02_colo/05_routing.yml, 03_cloud/06_bgp_sessions.yml,
# 04_saas/05_bgp_sessions.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "dc90-vrf-prod"
      namespace: "PROD"
      deployment: "DC90"
      shared_devices:
        - "dc90-leaf-01"
        - "dc90-edge-01"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Vlan100"
      device: "dc90-leaf-01"
      role: svi
      status: active
      vrf: ["DC90", "PROD"]
    - name: "Tunnel1"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "AWS site-to-site VPN tunnel 1 (rides on the internet port Ethernet1/2)"
      parent_interface: ["dc90-edge-01", "Ethernet1/2"]
      ip_address: {data: {address: "169.254.10.2/30", ip_namespace: "PROD"}}
    - name: "Tunnel2"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "AWS site-to-site VPN tunnel 2 (rides on the internet port Ethernet1/2)"
      parent_interface: ["dc90-edge-01", "Ethernet1/2"]
      ip_address: {data: {address: "169.254.10.6/30", ip_namespace: "PROD"}}
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "dc90-edge-01-bgp"
      status: active
      process_role: overlay
      local_as: "AS4200090001"
      router_id: ["10.90.255.1/32", "PROD"]
      capabilities: ["dc90-edge-01"]
    - name: "dc90-leaf-01-bgp"
      status: active
      process_role: overlay
      local_as: "AS4200090002"
      router_id: ["10.90.255.2/32", "PROD"]
      capabilities: ["dc90-leaf-01"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "BGP-DC90-LEAF01-EDGE01"
      description: "EVPN overlay between the leaf (owner of the segment SVI) and the edge"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "dc90-leaf-01-bgp"
        - "dc90-edge-01-bgp"
