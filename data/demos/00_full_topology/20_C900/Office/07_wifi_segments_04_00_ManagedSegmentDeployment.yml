# ManagedSegmentDeployment declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-wifi-corp-p
      deployment: C900-OFFICE
      vni: 10110
      vlans:
        data:
          - device: bcn-office-as-01
            vlan_id: 110
          - device: bcn-office-as-02
            vlan_id: 110
    - segment: c900-wifi-guest-p
      deployment: C900-OFFICE
      vni: 10120
      vlans:
        data:
          - device: bcn-office-as-01
            vlan_id: 120
          - device: bcn-office-as-02
            vlan_id: 120
