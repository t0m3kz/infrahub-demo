---
# The PBR of C900 in DC-WAW1: the SVIs of its segment c900-app-p on both leaves are steered to the firewall that serves
# the footprint (now the dedicated internal pair), and the PROD L3 VNI SVI on both border leaves steers what enters
# the VRF from the overlay (the traffic of the other DC) to the same firewall. Authored here, so `origin` is manual; on
# 30_all the VRF pass of the device writes the same object (generators/helpers/pbr_sync.py).
# Its original inventory description is retained; steering derives the footprint's current serving context.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingPolicy
  data:
    - name: pbr-c900-p-dc-waw1
      description: "C900 in DC-WAW1: segments steered to shared-waw1-fw-ha-prod"
      kind: pbr
      origin: manual
      customer_deployment: "C900-P-DC-WAW1"
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: waw1-leaf-01, name: Vlan200}
        - kind: DcimVirtualInterface
          data: {device: waw1-leaf-02, name: Vlan200}
        - kind: DcimVirtualInterface
          data: {device: waw1-bl-01, name: Vlan3900}
        - kind: DcimVirtualInterface
          data: {device: waw1-bl-02, name: Vlan3900}
