# Dedicated internal context and its border service ports; the addressed legs follow in this directory.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: c900-waw1-fw-01-waw1-fw-02-prod
      deployment: DC-WAW1
      shared_devices: [c900-waw1-fw-01-prod, c900-waw1-fw-02-prod]
      tenant:
        kind: TopologyCustomerDC
        data:
          owner: C900
          environment: p
          parent: DC-WAW1
          infrastructure_orchestrator: ansible_automation_platform
      vlan_id: 3001
      snat_address: ["192.0.2.0/32", "default"]
      capabilities:
        - kind: DcimPhysicalInterface
          data: {device: waw1-bl-01, name: "Ethernet1/25"}
        - kind: DcimPhysicalInterface
          data: {device: waw1-bl-02, name: "Ethernet1/25"}
        - kind: DcimVirtualInterface
          data: {device: c900-waw1-fw-01-prod, name: "eth1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: c900-waw1-fw-02-prod, name: "eth1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: c900-waw1-fw-01-prod, name: "eth1/1.3401"}
        - kind: DcimVirtualInterface
          data: {device: c900-waw1-fw-02-prod, name: "eth1/1.3401"}
        - kind: DcimVirtualInterface
          data: {device: c900-waw1-fw-01-prod, name: "eth1/1.3601"}
        - kind: DcimVirtualInterface
          data: {device: c900-waw1-fw-02-prod, name: "eth1/1.3601"}
