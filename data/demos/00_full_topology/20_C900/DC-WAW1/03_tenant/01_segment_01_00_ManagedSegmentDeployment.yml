# ManagedSegmentDeployment declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-app-p
      deployment: DC-WAW1
      vni: 10200
      vlans:
        data:
          - device: waw1-leaf-01
            vlan_id: 200
            svi: ["waw1-leaf-01", "Vlan200"]
          - device: waw1-leaf-02
            vlan_id: 200
            svi: ["waw1-leaf-02", "Vlan200"]
