# Standalone keyed realization for reloads; all four switches bridge VLAN 250/VNI 10250, with no SVI.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-internal-fw-waw1-p
      deployment: DC-WAW1
      vni: 10250
      status: active
      vlans:
        data:
          - {device: waw1-leaf-01, vlan_id: 250}
          - {device: waw1-leaf-02, vlan_id: 250}
          - {device: waw1-bl-01, vlan_id: 250}
          - {device: waw1-bl-02, vlan_id: 250}
