# ManagedVirtualSwitch declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVirtualSwitch
  data:
    - name: ktw1-dvs-01
      description: "A vSphere distributed switch of ktw1-vsphere-cl01"
      status: active
      switch_type: distributed
      mtu: 9000
      cluster: ktw1-vsphere-cl01
      uplinks:
        - kind: DcimLAGInterface
          data:
            device: ktw1-srv-01
            name: bond0
            status: active
            lag_id: 1
            lacp_mode: active
            minimum_links: 1
        - kind: DcimPhysicalInterface
          data:
            device: ktw1-srv-02
            name: eno1
        - kind: DcimPhysicalInterface
          data:
            device: ktw1-srv-03
            name: eno1
      port_groups:
        kind: ManagedPortGroup
        data:
          - name: c900-web
            description: "C900 c900-web-p on the hosts"
            vlan_id: 100
            segment: c900-web-p
            nics:
              - ["ktw1-vm-01", "eth0"]
              - ["ktw1-vm-02", "eth0"]
