# DcimVirtualInterface declarations in recursive dependency order.
# The SVIs of the segment c900-web-p on both leaves (VLAN 100, in the PROD VRF of DC-KTW1). Each carries the segment's
# anycast gateway 10.90.1.1/24 as its address (the address object of 01_segment_00_00, referenced, not a new one), so
# they load after the segment. Each SVI is a member of its leaf's row (the row's `capabilities`, set in
# 90_bindings/96_segment_ports). The rows of both leaves are nested under the deployment of the segment
# (01_segment_01_00).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan100
      device: ktw1-leaf-01
      role: svi
      status: active
      ip_address: ["10.90.1.1/24", "default"]
    - name: Vlan100
      device: ktw1-leaf-02
      role: svi
      status: active
      ip_address: ["10.90.1.1/24", "default"]
