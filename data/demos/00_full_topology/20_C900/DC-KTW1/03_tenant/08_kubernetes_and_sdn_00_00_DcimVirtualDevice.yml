# DcimVirtualDevice declarations in recursive dependency order.
# The on-prem Kubernetes cluster of C900 in KTW1 (RKE2): five VMs on the hosts of ktw1-vsphere-cl01, three control
# plane nodes and two workers. The control plane stands on three different hosts, so losing a host never costs the
# quorum (checks/cluster.py, rule CL6). A node is an ordinary VM (template LINUX-SVC): its cluster is its host's,
# nothing on the VM names the Kubernetes cluster. The nodes are in the segment c900-web-p, through the port group
# c900-web of the distributed switch.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: ktw1-k8s-cp-01
      object_template: LINUX-SVC
      description: "Control plane node of ktw1-rke2-cl01 on ktw1-srv-01"
      hosting_device: ktw1-srv-01
      deployment: C900-P-DC-KTW1
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: eth0
            role: uplink
            status: active
            description: Rides on the host port eno1 of ktw1-srv-01
            capabilities:
              - kind: ManagedInterfaceEncapsulation
                data:
                  name: "ktw1-k8s-cp-01:eth0"
                  parent: ["ktw1-srv-01", "eno1"]
    - name: ktw1-k8s-cp-02
      object_template: LINUX-SVC
      description: "Control plane node of ktw1-rke2-cl01 on ktw1-srv-02"
      hosting_device: ktw1-srv-02
      deployment: C900-P-DC-KTW1
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: eth0
            role: uplink
            status: active
            description: Rides on the host port eno1 of ktw1-srv-02
            capabilities:
              - kind: ManagedInterfaceEncapsulation
                data:
                  name: "ktw1-k8s-cp-02:eth0"
                  parent: ["ktw1-srv-02", "eno1"]
    - name: ktw1-k8s-cp-03
      object_template: LINUX-SVC
      description: "Control plane node of ktw1-rke2-cl01 on ktw1-srv-03"
      hosting_device: ktw1-srv-03
      deployment: C900-P-DC-KTW1
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: eth0
            role: uplink
            status: active
            description: Rides on the host port eno1 of ktw1-srv-03
            capabilities:
              - kind: ManagedInterfaceEncapsulation
                data:
                  name: "ktw1-k8s-cp-03:eth0"
                  parent: ["ktw1-srv-03", "eno1"]
    - name: ktw1-k8s-wk-01
      object_template: LINUX-SVC
      description: "Worker node of ktw1-rke2-cl01 on ktw1-srv-01"
      hosting_device: ktw1-srv-01
      deployment: C900-P-DC-KTW1
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: eth0
            role: uplink
            status: active
            description: Rides on the host port eno1 of ktw1-srv-01
            capabilities:
              - kind: ManagedInterfaceEncapsulation
                data:
                  name: "ktw1-k8s-wk-01:eth0"
                  parent: ["ktw1-srv-01", "eno1"]
    - name: ktw1-k8s-wk-02
      object_template: LINUX-SVC
      description: "Worker node of ktw1-rke2-cl01 on ktw1-srv-02"
      hosting_device: ktw1-srv-02
      deployment: C900-P-DC-KTW1
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: eth0
            role: uplink
            status: active
            description: Rides on the host port eno1 of ktw1-srv-02
            capabilities:
              - kind: ManagedInterfaceEncapsulation
                data:
                  name: "ktw1-k8s-wk-02:eth0"
                  parent: ["ktw1-srv-02", "eno1"]
