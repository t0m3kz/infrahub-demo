# ManagedSegmentDeployment declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-web-p
      deployment: DC-KTW1
      vni: 10100
      vlans:
        data:
          - device_name: ktw1-leaf-01
            capabilities: ["ktw1-leaf-01"]
            vlan_id: 100
            svi: ["ktw1-leaf-01", "Vlan100"]
          - device_name: ktw1-leaf-02
            capabilities: ["ktw1-leaf-02"]
            vlan_id: 100
            svi: ["ktw1-leaf-02", "Vlan100"]
