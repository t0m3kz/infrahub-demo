# Standalone keyed realization for reloads; all four switches bridge VLAN 150/VNI 10150, with no SVI.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-internal-fw-ktw1-p
      deployment: DC-KTW1
      vni: 10150
      status: active
      vlans:
        data:
          - {device: ktw1-leaf-01, vlan_id: 150}
          - {device: ktw1-leaf-02, vlan_id: 150}
          - {device: ktw1-bl-01, vlan_id: 150}
          - {device: ktw1-bl-02, vlan_id: 150}
