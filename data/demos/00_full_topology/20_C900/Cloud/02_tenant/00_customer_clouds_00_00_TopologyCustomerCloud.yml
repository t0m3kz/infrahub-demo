# TopologyCustomerCloud declarations in recursive dependency order.
# The footprint of C900 in the AWS account.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      environment: "p"
      account: "c900-aws-prod"
      customer_name: "demo-aws"
      parent: "eu-central-1"
      design: "M"
      # connection dedicated: its own Direct Connect dx-c900-fra-lag (and the VPN vpn-c900-aws-euc1) in its
      # account; the hub tgw-c900-euc1 is in its account too
      connection: dedicated
