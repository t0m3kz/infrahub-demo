---
# The footprint of C900 in the sandbox subscription: one footprint per account, of the account's owner and environment
# (checks/customers/customer_cloud_account.py CA1 to CA3).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      environment: "p"
      account: "c900-azure-sandbox"
      customer_name: "sandbox-azure"
      parent: "westeurope"
      design: "S"
      # connection transit: the region's hub would be its way to us, but its VNet is attached to nothing (VNet
      # peering to one spoke only): cloud_connection R12 warns that it is not reachable from us
      connection: transit
