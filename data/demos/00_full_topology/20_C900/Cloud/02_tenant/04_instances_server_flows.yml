---
# One instance in each workload segment that had none, as the end of a server-to-server flow (c900-app-euc1-1 in
# 02_instances.yml is the one of c900-subnet-p). Plain inventory: no application and no rule names them. Each
# private_ip is the .11 of its segment's /24. The GCP VPC has no segment, so it has no instance.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudInstance
  data:
    # AWS spoke accounts, behind the transit gateway tgw-c900-euc1.
    - name: "c900-payments-euc1-1"
      cloud_id: "i-0c900pay000001"
      status: active
      instance_type: "m6i.large"
      software_image: linux-22.04.3
      private_ip: "10.205.1.11/24"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      account: "c900-aws-payments"
      network_segment: "c900-payments-aws-p"
    - name: "c900-analytics-euc1-1"
