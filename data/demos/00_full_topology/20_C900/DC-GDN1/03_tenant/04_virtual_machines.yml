---
# The VM of C900 on the server gdn1-srv-01, as in 20_C900/DC-KTW1/03_tenant/05_virtual_machines.yml: template
# LINUX-SVC,
# eth0 rides on the host port eno1 (the first uplink), its address in c900-db-p (10.93.1.0/24). Its component is in
# 90_bindings/40_applications/C900/00_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: gdn1-vm-01
      object_template: LINUX-SVC
      description: "C900 web-shop database on gdn1-srv-01"
      hosting_device: gdn1-srv-01
      deployment: C900-P-DC-GDN1
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: eth0
            role: uplink
            status: active
            description: Rides on the host port eno1 of gdn1-srv-01
            capabilities:
              - kind: ManagedInterfaceEncapsulation
                data:
                  name: "gdn1-vm-01:eth0"
                  parent: ["gdn1-srv-01", "eno1"]
            ip_address:
              data:
                address: "10.93.1.11/24"
                description: gdn1-vm-01 in c900-db-p
                ip_namespace: "default"
