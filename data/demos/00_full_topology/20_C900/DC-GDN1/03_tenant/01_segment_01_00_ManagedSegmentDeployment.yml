# ManagedSegmentDeployment declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-db-p
      deployment: DC-GDN1
      vni: 10300
      vlans:
        data:
          - device_name: gdn1-leaf-01
            capabilities: ["gdn1-leaf-01"]
            vlan_id: 300
            svi: ["gdn1-leaf-01", "Vlan300"]
          - device_name: gdn1-leaf-02
            capabilities: ["gdn1-leaf-02"]
            vlan_id: 300
            svi: ["gdn1-leaf-02", "Vlan300"]
