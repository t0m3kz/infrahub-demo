---
# L1 of the C900 office: the edge to both distribution switches (GE3, GE4), the distribution pair joined by its
# interlink, each distribution switch to both access switches (a full square, so any one box can die), and one cable
# from an access switch to each AP. Cables in data are never generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-BCN-EDGE01-DS01"
      type: copper
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-edge-01"
            name: "GE3"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-01"
            name: "GigabitEthernet1/0/26"
    - name: "CBL-BCN-EDGE01-DS02"
      type: copper
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-edge-01"
            name: "GE4"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-02"
            name: "GigabitEthernet1/0/26"
    - name: "CBL-BCN-DS01-DS02"
      type: dac
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-01"
            name: "HundredGigE1/0/25"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-02"
            name: "HundredGigE1/0/25"
    - name: "CBL-BCN-DS01-AS01"
      type: dac
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-01"
            name: "HundredGigE1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-01"
            name: "HundredGigE1/1/1"
    - name: "CBL-BCN-DS01-AS02"
      type: dac
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-01"
            name: "HundredGigE1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-02"
            name: "HundredGigE1/1/1"
    - name: "CBL-BCN-DS02-AS01"
      type: dac
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-02"
            name: "HundredGigE1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-01"
            name: "HundredGigE1/1/2"
    - name: "CBL-BCN-DS02-AS02"
      type: dac
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ds-02"
            name: "HundredGigE1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-02"
            name: "HundredGigE1/1/2"
    - name: "CBL-BCN-AS01-AP01"
      type: copper
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-01"
            name: "TenGigabitEthernet1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ap-01"
            name: "eth0"
    - name: "CBL-BCN-AS01-AP02"
      type: copper
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-01"
            name: "TenGigabitEthernet1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ap-02"
            name: "eth0"
    - name: "CBL-BCN-AS02-AP03"
      type: copper
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-02"
            name: "TenGigabitEthernet1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ap-03"
            name: "eth0"
    - name: "CBL-BCN-AS02-AP04"
      type: copper
      deployment: "C900-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-as-02"
            name: "TenGigabitEthernet1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "bcn-office-ap-04"
            name: "eth0"
