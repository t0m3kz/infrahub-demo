---
# The office footprint of C900. The office owns its tunnels (05_office/04_tunnels.yml): the circuit-placement rule for
# a tunnel wants an office among its locations, and the tunnel's owner is derived from it. The office name is
# computed: {OWNER}-OFFICE (C900-OFFICE). Its devices are hand-written: the SD-WAN branch edge (05_office/03_edge.yml,
# `bcn-office-edge-01` as add_sdwan_edge would name it) and the campus below it (05_switches_and_aps.yml); nothing is
# generated for it (no `member_of_groups`, no `sdwan_gateway`).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerOffice
  data:
    - owner: "C900"
      parent: "Campus and Office"
      locations: ["bcn-office"]
