---
# L1 of the C901 office: each edge on GE3 to its own distribution switch, then the same square and the same AP cables
# as in
# Barcelona (05_office/06_cabling.yml). Cables in data are never generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-LIS-EDGE01-DS01"
      type: copper
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-edge-01"
            name: "GE3"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-01"
            name: "GigabitEthernet1/0/26"
    - name: "CBL-LIS-EDGE02-DS02"
      type: copper
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-edge-02"
            name: "GE3"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-02"
            name: "GigabitEthernet1/0/26"
    - name: "CBL-LIS-DS01-DS02"
      type: dac
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-01"
            name: "HundredGigE1/0/25"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-02"
            name: "HundredGigE1/0/25"
    - name: "CBL-LIS-DS01-AS01"
      type: dac
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-01"
            name: "HundredGigE1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-01"
            name: "HundredGigE1/1/1"
    - name: "CBL-LIS-DS01-AS02"
      type: dac
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-01"
            name: "HundredGigE1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-02"
            name: "HundredGigE1/1/1"
    - name: "CBL-LIS-DS02-AS01"
      type: dac
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-02"
            name: "HundredGigE1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-01"
            name: "HundredGigE1/1/2"
    - name: "CBL-LIS-DS02-AS02"
      type: dac
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ds-02"
            name: "HundredGigE1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-02"
            name: "HundredGigE1/1/2"
    - name: "CBL-LIS-AS01-AP01"
      type: copper
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-01"
            name: "TenGigabitEthernet1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ap-01"
            name: "eth0"
    - name: "CBL-LIS-AS01-AP02"
      type: copper
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-01"
            name: "TenGigabitEthernet1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ap-02"
            name: "eth0"
    - name: "CBL-LIS-AS02-AP03"
      type: copper
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-02"
            name: "TenGigabitEthernet1/0/1"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ap-03"
            name: "eth0"
    - name: "CBL-LIS-AS02-AP04"
      type: copper
      deployment: "C901-OFFICE"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-as-02"
            name: "TenGigabitEthernet1/0/2"
        - kind: DcimPhysicalInterface
          data:
            device: "lis-office-ap-04"
            name: "eth0"
