---
# The devices of the C901 office. The two SD-WAN edges (VCE-610, the template add_sdwan_edge uses) are a pair: edge 1
# has
# its internet access at the first ISP, edge 2 at the second, so the office survives the loss of a provider or of a box.
# Each edge has one tunnel to the DC edge (the hub end is Tunnel5 and Tunnel6 of ktw1-edge-01). Below them the same
# campus as in
# Barcelona: a distribution pair, an access pair and four access points (05_office/05_switches_and_aps.yml explains
# the kinds).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: lis-office-edge-01
      object_template: VCE-610_EDGE
      owner: C901
      description: "C901 SD-WAN edge 1 of 2: GE1 internet access (lis-office-ispa-48213-isp-a), tunnel to the DC edge"
      deployment: C901-OFFICE
      rack: lis-office-rack-01
      position: 40
      rack_face: front
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: Tunnel1
            role: cloud
            status: active
            description: SD-WAN tunnel to the DC edge (rides on the internet port GE1)
            parent_interface: ["lis-office-edge-01", "GE1"]
            ip_address:
              data:
                address: "169.254.10.17/30"
                ip_namespace: PROD
    - name: lis-office-edge-02
      object_template: VCE-610_EDGE
      owner: C901
      description: "C901 SD-WAN edge 2 of 2: GE1 internet access (lis-office-ispb-77303-isp-b), tunnel to the DC edge"
      deployment: C901-OFFICE
      rack: lis-office-rack-01
      position: 39
      rack_face: front
      interfaces:
        - kind: DcimVirtualInterface
          data:
            name: Tunnel1
            role: cloud
            status: active
            description: SD-WAN tunnel to the DC edge (rides on the internet port GE1)
            parent_interface: ["lis-office-edge-02", "GE1"]
            ip_address:
              data:
                address: "169.254.10.21/30"
                ip_namespace: PROD
    - name: lis-office-ds-01
      object_template: C9500-32C_DISTRIBUTION
      owner: C901
      description: "Distribution switch 1 of the office fabric"
      deployment: C901-OFFICE
      rack: lis-office-rack-01
      position: 38
      rack_face: front
    - name: lis-office-ds-02
      object_template: C9500-32C_DISTRIBUTION
      owner: C901
      description: "Distribution switch 2 of the office fabric"
      deployment: C901-OFFICE
      rack: lis-office-rack-01
      position: 37
      rack_face: front
    - name: lis-office-as-01
      object_template: C9300-48UXM_ACCESS_SWITCH
      owner: C901
      description: "Access switch 1: wired ports and the uplinks of AP 1 and AP 2"
      deployment: C901-OFFICE
      rack: lis-office-rack-01
      position: 36
      rack_face: front
    - name: lis-office-as-02
      object_template: C9300-48UXM_ACCESS_SWITCH
      owner: C901
      description: "Access switch 2: wired ports and the uplinks of AP 3 and AP 4"
      deployment: C901-OFFICE
      rack: lis-office-rack-01
      position: 35
      rack_face: front
    - name: lis-office-ap-01
      object_template: C9130AXI-B_AP
      owner: C901
      description: "Access point, eth0 to as-01 Te1/0/1 (ceiling mount, no rack)"
      deployment: C901-OFFICE
    - name: lis-office-ap-02
      object_template: C9130AXI-B_AP
      owner: C901
      description: "Access point, eth0 to as-01 Te1/0/2 (ceiling mount, no rack)"
      deployment: C901-OFFICE
    - name: lis-office-ap-03
      object_template: C9130AXI-B_AP
      owner: C901
      description: "Access point, eth0 to as-02 Te1/0/1 (ceiling mount, no rack)"
      deployment: C901-OFFICE
    - name: lis-office-ap-04
      object_template: C9130AXI-B_AP
      owner: C901
      description: "Access point, eth0 to as-02 Te1/0/2 (ceiling mount, no rack)"
      deployment: C901-OFFICE
