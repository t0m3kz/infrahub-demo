---
# The office's SD-WAN branch edge (VCE-610, the template add_sdwan_edge uses) with its interfaces from the template:
# GE1 is the uplink (role uplink), the end of the office's internet access INET-C900-OFFICE
# (06_internet/05_site_access.yml).
# The device is owned by the office's tenant, as the generator would write it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "C900-OFFICE-EDGE1"
      object_template: VCE-610_EDGE
      owner: "C900"
      description: "C900 office SD-WAN edge: GE1 internet access, tunnels to the DC edge and to Zscaler"
      deployment: "C900-OFFICE"
---
# The tunnel interfaces ride on the internet port GE1 (parent_interface). The hub end is the DC edge, which has the same
# internet access for the AWS VPN (03_cloud/05_circuits.yml); Tunnel2 is the one to Zscaler.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Tunnel1"
      device: "C900-OFFICE-EDGE1"
      role: cloud
      status: active
      description: "SD-WAN tunnel to the DC edge (rides on the internet port GE1)"
      parent_interface: ["C900-OFFICE-EDGE1", "GE1"]
      ip_address: {data: {address: "169.254.10.13/30", ip_namespace: "PROD"}}
    - name: "Tunnel2"
      device: "C900-OFFICE-EDGE1"
      role: saas
      status: active
      description: "Zscaler tunnel (rides on the internet port GE1)"
      parent_interface: ["C900-OFFICE-EDGE1", "GE1"]
      ip_address: {data: {address: "169.254.10.10/30", ip_namespace: "PROD"}}
    - name: "Tunnel4"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "SD-WAN hub end of the C900 office tunnel (rides on the internet port Ethernet1/2)"
      parent_interface: ["dc90-edge-01", "Ethernet1/2"]
      ip_address: {data: {address: "169.254.10.14/30", ip_namespace: "PROD"}}
