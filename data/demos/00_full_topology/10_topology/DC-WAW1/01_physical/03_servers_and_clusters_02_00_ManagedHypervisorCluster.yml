# ManagedHypervisorCluster declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedHypervisorCluster
  data:
    - name: waw1-proxmox-cl01
      description: "C900 production compute of DC-WAW1: Proxmox VE, 2 hosts"
      status: active
      software_image: proxmox-8.2
      manager: "https://pve.waw1.demo.local:8006"
      inventory_path: WAW1
      ha_enabled: true
      load_balancing: true
      deployment: DC-WAW1-7-POD-1
      hosts:
        - waw1-srv-01
        - waw1-srv-02
