---
# The devices of DC-WAW1, from bootstrap templates (their interfaces come with them), placed like DC-KTW1: the leaves,
# the spine and the server in the pod DC-WAW1-7-POD-1, the border leaves and the edge at the DC. The edge has no
# internet access in this sample. The border leaves nest the two downlink ports they use as DCI to the other DCs (role
# dci, the fibres are 90_bindings/20_dci/00_dc_mesh); their fibres to the cages use the uplinks 1/34-36. The server
# nests its LACP
# bond.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: waw1-leaf-01
      object_template: N9K-C9364C-GX_LEAF_MR
      description: "Leaf, vPC peer of waw1-leaf-02"
      deployment: DC-WAW1-7-POD-1
      rack: waw1-rack-03
      position: 41
      rack_face: front
    - name: waw1-leaf-02
      object_template: N9K-C9364C-GX_LEAF_MR
      description: "Leaf, vPC peer of waw1-leaf-01"
      deployment: DC-WAW1-7-POD-1
      rack: waw1-rack-04
      position: 41
      rack_face: front
    - name: waw1-spine-01
      object_template: N9K-C9336C-FX2_SPINE
      description: "Spine: leaf-01/02 on Ethernet1/1-2, border leaves on Ethernet1/3-4"
      deployment: DC-WAW1-7-POD-1
      rack: waw1-rack-05
      position: 41
      rack_face: front
    - name: waw1-bl-01
      object_template: N9K-C9336C-FX2_BORDER_LEAF
      description: "Border leaf 1: spine on Ethernet1/33, edge through the patch panel (jack 1), DCI fibres"
      deployment: DC-WAW1
      rack: waw1-rack-01
      position: 38
      rack_face: front
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: Ethernet1/2
            role: dci
            description: "DCI: dark fibre to KTW1"
        - kind: DcimPhysicalInterface
          data:
            name: Ethernet1/3
            role: dci
            description: "DCI: dark fibre to GDN1"
    - name: waw1-bl-02
      object_template: N9K-C9336C-FX2_BORDER_LEAF
      description: "Border leaf 2: spine on Ethernet1/33, edge on a direct cable, DCI fibres"
      deployment: DC-WAW1
      rack: waw1-rack-01
      position: 36
      rack_face: front
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: Ethernet1/2
            role: dci
            description: "DCI: dark fibre to KTW1"
        - kind: DcimPhysicalInterface
          data:
            name: Ethernet1/3
            role: dci
            description: "DCI: dark fibre to GDN1"
    - name: waw1-edge-01
      object_template: N9K-C9316D-GX_EDGE
      description: "Edge of DC-WAW1: 1/14 border leaf 1 (panel), 1/10 border leaf 2"
      deployment: DC-WAW1
      rack: waw1-rack-01
      position: 40
      rack_face: front
    - name: waw1-srv-01
      object_template: PowerEdge-R640_SERVER
      description: "Server of the tenant, bond0 over eno1 and eno2, dual-homed to the vPC pair"
      deployment: DC-WAW1-7-POD-1
      rack: waw1-rack-02
      position: 20
      rack_face: front
      interfaces:
        - kind: DcimLAGInterface
          data:
            name: bond0
            description: LACP bond over eno1 and eno2
            status: active
            lag_id: 1
            lacp_mode: active
            minimum_links: 1
            member_interfaces:
              - ["waw1-srv-01", "eno1"]
              - ["waw1-srv-01", "eno2"]
