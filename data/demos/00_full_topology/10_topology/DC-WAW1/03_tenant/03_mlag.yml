---
# One authored ManagedMLAG over the two leaves (the vPC domain).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedMLAG
  data:
    - name: "waw1-mlag-01"
      description: "vPC domain of the leaf pair"
      status: active
      peer_devices: "waw1-leaf-01,waw1-leaf-02"
      domain_id: 1
      capabilities:
        - "waw1-leaf-01"
        - "waw1-leaf-02"
      # The peer-link ports of both leaves (the template's mlag-peer ports, cabled 33 to 33): the domain lists the
      # interfaces it configures.
      interfaces:
        - ["waw1-leaf-01", "Ethernet1/33"]
        - ["waw1-leaf-01", "Ethernet1/34"]
        - ["waw1-leaf-02", "Ethernet1/33"]
        - ["waw1-leaf-02", "Ethernet1/34"]
