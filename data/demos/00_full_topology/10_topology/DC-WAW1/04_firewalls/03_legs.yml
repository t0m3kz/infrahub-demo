# The legs of the context: each member's VLAN sub-interface of its uplink ethernet1/1, addressed from the leg's /29 in
# the PROD VRF (members take .21 and .22, the pair's floating VIP is .20, the border leaves' anycast gateway .17).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "ethernet1/1.3000"
      vlan_id: 3000
      device: waw1-fw-01
      parent_interface: ["waw1-fw-01", "ethernet1/1"]
      role: service
      status: active
      ip_address:
        data:
          address: "100.66.0.21/29"
          ip_namespace: "default"
    - name: "ethernet1/1.3000"
      vlan_id: 3000
      device: waw1-fw-02
      parent_interface: ["waw1-fw-02", "ethernet1/1"]
      role: service
      status: active
      ip_address:
        data:
          address: "100.66.0.22/29"
          ip_namespace: "default"
