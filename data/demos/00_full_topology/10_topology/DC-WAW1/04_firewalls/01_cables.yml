---
# Each firewall's uplink ethernet1/1 to the firewall-role port Ethernet1/25 of a border leaf (the first member to border
# leaf 1, the second to border leaf 2). Cables in data are never generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-WAW1-FW01-BL01"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data: {device: "waw1-fw-01", name: "ethernet1/1"}
        - kind: DcimPhysicalInterface
          data: {device: "waw1-bl-01", name: "Ethernet1/25"}
    - name: "CBL-WAW1-FW02-BL02"
      type: smf
      deployment: "DC-WAW1"
      endpoints:
        - kind: DcimPhysicalInterface
          data: {device: "waw1-fw-02", name: "ethernet1/1"}
        - kind: DcimPhysicalInterface
          data: {device: "waw1-bl-02", name: "Ethernet1/25"}
