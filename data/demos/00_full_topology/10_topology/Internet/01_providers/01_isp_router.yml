# The router of the second ISP, at its own external-provider facility. Its port towards the cage edge carries the
# transit /31 of the access par1-ispb-77302-isp-b and is nested under it (the prefix is in 00_common/04_internet).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: EXT-ISP-B-PE1
      object_template: MX204_ISP_PE
      owner: P023
      description: "Second ISP router: far end of the internet carrier on Ethernet1/1, uplink to INTERNET"
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: et-0/0/1
            status: active
            description: "Transit customer: par-colo1-edge-01"
            ip_address:
              data:
                address: "198.51.100.15/31"
                ip_namespace: "default"
        - kind: DcimPhysicalInterface
          data:
            name: et-0/0/2
            status: active
            description: "Transit customer: lis-office-edge-02"
            ip_address:
              data:
                address: "198.51.100.19/31"
                ip_namespace: "default"
