# The end of the Internet Access service of the cage on the Fabric port of the cage FRA: one
# TopologyProviderInterface per connection, riding on the physical port (its encapsulation) and named
# <port>.<S-tag>. It carries the S-tag (`vlan_id`) and the bandwidth, and the internet carrier
# (90_bindings/90_internet/02_circuits) ends on it and on THE INTERNET.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderInterface
  data:
    - device: EXT-FABRIC-FRA
      name: et-0/0/0.1301
      description: Equinix Internet Access of the FRA-COLO1 cage (5a1f2c30)
      status: active
      capabilities:
        - kind: ManagedInterfaceEncapsulation
          data:
            name: "EXT-FABRIC-FRA:et-0/0/0.1301"
            vlan_id: 1301
            parent: ["EXT-FABRIC-FRA", "et-0/0/0"]
      bandwidth: 10000
