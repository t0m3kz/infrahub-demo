---
# The one overlay process of the cage edge: every DCI EVPN session of the cage is built on it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: fra-colo1-edge-01-bgp
      status: active
      process_role: overlay
      local_as: AS4200094001
      router_id:
        data:
          address: "10.94.255.1/32"
          ip_namespace: default
          description: fra-colo1-edge-01 loopback
      capabilities: ["fra-colo1-edge-01"]
