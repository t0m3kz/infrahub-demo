# TopologyProviderConnect declarations in recursive dependency order.
# The provider's port of the metro: a TopologyProviderConnect, a slim device of the provider placed by its
# `location` (the cage), with no role, platform or template, that holds the physical Fabric port.
# The port is cabled to ams-colo1-edge-01 Ethernet1/1
# (02_cables.yml); the Internet Access service that starts on it has an interface of its own
# (03_fabric_interfaces.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnect
  data:
    - name: EXT-FABRIC-AMS
      description: Equinix Fabric port of the cage AMS, in the AMS-COLO1 cage (cabled to ams-colo1-edge-01 Ethernet1/1)
      status: active
      provider: P016
      location: AMS-COLO1
      bandwidth: 10000
      external_id: c4e8b1d7-6a02-4f39-95b3-72a0d8c6e4f5
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: et-0/0/0
            description: Fabric port 10G, cross-connected to the cage edge
            status: active
