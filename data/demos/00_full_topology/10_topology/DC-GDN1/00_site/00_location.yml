---
# The data center GDN1 in Gdansk, laid out like DC-KTW1 (10_topology/DC-KTW1): one suite (2 rows x 9 slots, the
# S_MIDDLE envelope of the pod), the border and edge rack here, the pod racks in 03_racks.yml. The metro is not in
# the bootstrap data, so this sample creates it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationMetro
  data:
    - name: "Gdansk"
      shortname: "gdn"
      parent: pl
      children:
        kind: LocationFacility
        data:
          - name: "GDN1"
            shortname: "gdn1"
            children:
              kind: LocationSuite
              data:
                - name: GDN1-SUITE-1
                  index: 1
                  shortname: "gdn1-suite-1"
                  parent: gdn1
                  rows: 2
                  racks_per_row: 9
                  children:
                    kind: LocationRack
                    data:
                      - name: GDN1-RACK-01
                        shortname: gdn1-rack-01
                        index: 1
                        row_index: 1
                        rack_type: network
