---
# The SVIs of the segment c900-db-p on both leaves (VLAN 300, in the PROD VRF of DC-GDN1). The rows of both leaves
# are nested under the deployment of the segment (03_tenant/01_segment.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Vlan300
      device: gdn1-leaf-01
      role: svi
      status: active
    - name: Vlan300
      device: gdn1-leaf-02
      role: svi
      status: active
