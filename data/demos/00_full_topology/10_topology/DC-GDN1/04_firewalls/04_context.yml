# PROD-only internal context; no Internet shortcut. Its member legs (03_legs.yml) and the facing border service ports
# are derived, never listed on the context (utils/service_contexts.py).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: shared-gdn1-fw-ha-prod
      deployment: DC-GDN1
      shared_devices: [gdn1-fw-01, gdn1-fw-02]
      vlan_id: 3000
