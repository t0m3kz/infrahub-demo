# PROD-only internal context, with both member legs and both facing border service ports; no Internet shortcut.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: shared-gdn1-fw-ha-prod
      cluster: gdn1-fw-ha
      vlan_id: 3000
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: gdn1-fw-01, name: ethernet1/1.3000}
        - kind: DcimVirtualInterface
          data: {device: gdn1-fw-02, name: ethernet1/1.3000}
        - kind: DcimPhysicalInterface
          data: {device: gdn1-bl-01, name: Ethernet1/25}
        - kind: DcimPhysicalInterface
          data: {device: gdn1-bl-02, name: Ethernet1/25}
