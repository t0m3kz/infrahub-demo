---
# The front ports of every panel of COLO-PAR, as add_patch_panel builds them from the panel_type (lc-24: 24 front ports,
# lc-upc), each on the rear port of the same number. 00_full runs no generator, so the ports are data and
# checks/patch_panel_pairing.py finds the panels complete. The jacks the cables use are also declared in
# 00_patch_panels.yml; both land on one port (upsert by panel and name).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimFrontPatchPanelPort
  data:
