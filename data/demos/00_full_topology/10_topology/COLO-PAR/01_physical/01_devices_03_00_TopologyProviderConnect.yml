# TopologyProviderConnect declarations in recursive dependency order.
# Google's and Webex's own ports in the cage: a TopologyProviderConnect each, placed by its `location`, with the one
# port the cage edge is cabled to (par-colo1-edge-01 Ethernet1/5 and Ethernet1/6, 02_cables.yml). The Cloud Router
# peering (20_C900/Cloud/03_transport) and the Webex peering (20_C900/SaaS/01_direct_connects.yml) ride on these
# ports.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnect
  data:
    - name: EXT-GCP-IC-PAR
      description: Google Dedicated Interconnect location in the PAR-COLO1 cage (one 10G port)
      status: active
      provider: P006
      location: PAR-COLO1
      bandwidth: 10000
      external_id: ic-fra-pop-1
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: ic-dedicated-port
            description: Google Dedicated Interconnect 10G port
            status: active
            interface_type: "10gbase-x-sfpp"
    - name: EXT-WEBEX-PAR
      description: Webex peering point in the PAR-COLO1 cage (one 1G port)
      status: active
      provider: P901
      location: PAR-COLO1
      bandwidth: 1000
      external_id: wbx-par-1
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: wbx-port-1
            description: Webex peering point port
            status: active
