---
# The patch panel of the cage (PP-EQX-FR2-01 of 30_all): a passive panel in the rack, not a device. Type lc-24:
# its 24 rear and 24 front ports are in 00_patch_panels_01_00 and _02_00 (no generator runs here); the one used
# jack is declared as a nested front port on its rear port (front "1" -> rear "1"), so the cables land on it in
# the same load.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPatchPanel
  data:
    - name: PP-PAR-COLO1-01
      panel_type: lc-24
      member_of_groups: [patch_panels]
      description: "PAR-COLO1 cage patch panel: jack 1 joins par-colo1-edge-01 to the Equinix Fabric port"
      rack: par-colo1-rack-01
      position: 42
      rack_face: front
      front_ports:
        - kind: DcimFrontPatchPanelPort
          data:
            name: "1"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["par-colo1-rack-01", "PP-PAR-COLO1-01"]
                name: "1"
                connector: lc-upc
