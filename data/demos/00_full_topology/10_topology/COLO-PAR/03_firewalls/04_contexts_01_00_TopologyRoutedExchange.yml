# TopologyRoutedExchange declarations in recursive dependency order.
# The routed exchange of the context between the PROD VRF and INTERNET; its legs are the context's legs of both members
# in those two VRFs (derived, utils/service_contexts.py exchange_legs).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyRoutedExchange
  data:
    - name: shared-par-xfw-ha-prod-PROD-INTERNET
      gateway: shared-par-xfw-ha-prod
      status: active
      vrf_a: [PAR, PROD]
      vrf_z: [PAR, INTERNET]
