# ManagedFirewallContext declarations in recursive dependency order.
# The Internet edge context of the PAR-COLO1 cage, with a PROD leg and an INTERNET leg, joined by the routed exchange
# below, and the public address (SNAT) of what the cage sends to the Internet. It lists its legs and the firewall ports
# of the cage edge as its capabilities. Data here; a generator builds the same objects on 30_all.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: shared-par-xfw-ha-prod
      deployment: PAR
      shared_devices: [par-colo1-xfw-01, par-colo1-xfw-02]
      vlan_id: 3001
      snat_address:
        data:
          address: "192.0.2.30/32"
          description: "SNAT address of shared-par-xfw-ha-prod"
          ip_namespace: "default"
      capabilities:
        - kind: DcimVirtualInterface
          data: {device: par-colo1-xfw-01, name: "ethernet1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: par-colo1-xfw-02, name: "ethernet1/1.3001"}
        - kind: DcimVirtualInterface
          data: {device: par-colo1-xfw-01, name: "ethernet1/1.3401"}
        - kind: DcimVirtualInterface
          data: {device: par-colo1-xfw-02, name: "ethernet1/1.3401"}
        - kind: DcimPhysicalInterface
          data: {device: par-colo1-edge-01, name: "Ethernet1/2"}
        - kind: DcimPhysicalInterface
          data: {device: par-colo1-edge-01, name: "Ethernet1/13"}
