# DcimCable declarations in recursive dependency order.
# Each firewall's uplink ethernet1/1 to a firewall port of the cage edge. Cables in data are never generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-PAR1-XFW01-EDGE01"
      type: smf
      deployment: "PAR-COLO1"
      endpoints:
        - kind: DcimPhysicalInterface
          data: {device: "par-colo1-xfw-01", name: "ethernet1/1"}
        - kind: DcimPhysicalInterface
          data: {device: "par-colo1-edge-01", name: "Ethernet1/2"}
    - name: "CBL-PAR1-XFW02-EDGE01"
      type: smf
      deployment: "PAR-COLO1"
      endpoints:
        - kind: DcimPhysicalInterface
          data: {device: "par-colo1-xfw-02", name: "ethernet1/1"}
        - kind: DcimPhysicalInterface
          data: {device: "par-colo1-edge-01", name: "Ethernet1/13"}
