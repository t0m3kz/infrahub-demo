---
# The static routes of the cage edge for the Internet edge context shared-par-xfw-ha-prod (04_contexts.yml): the PROD
# default route to the floating address of the pair's PROD leg (100.66.0.24/29, VIP .28), kept local to the edge (an
# edge resolves the VIP over its own transit L2VNI), and the return route of the pair's public address (SNAT
# 192.0.2.30/32) to the pair's INTERNET leg (100.66.32.24/29, VIP .28). On 30_all the context generator writes the
# same routes (generators/topology/context_routes.py, tracked); here they are plain data.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedStaticRoute
  data:
    - name: par-colo1-edge-01-prod-default
      prefix: "0.0.0.0/0"
      next_hop: "100.66.0.28"
      exported: false
      status: active
      vrf: ["PAR", "PROD"]
      next_hop_interface:
        kind: DcimVirtualInterface
        data: {device: par-colo1-xfw-01, name: "ethernet1/1.3001"}
      capabilities: ["par-colo1-edge-01"]
    - name: par-colo1-edge-01-internet-snat
      prefix: "192.0.2.30/32"
      next_hop: "100.66.32.28"
      exported: true
      status: active
      vrf: ["PAR", "INTERNET"]
      next_hop_interface:
        kind: DcimVirtualInterface
        data: {device: par-colo1-xfw-01, name: "ethernet1/1.3401"}
      capabilities: ["par-colo1-edge-01"]
