# ManagedVRF declarations in recursive dependency order.
# The INTERNET VRF instance of the PAR metro with the cage edge as its member: the cage edge has its own access to the
# second ISP (par1-ispb-77302-isp-b, its eBGP session is 90_bindings/90_internet/03_routing) and, behind the external
# firewall
# pair of the cage, the return route of the pair's public address (03_firewalls/05_routes.yml, which loads after).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "par-vrf-internet"
      security_zone: "INTERNET"
      deployment: "PAR"
      shared_devices:
        - "par-colo1-edge-01"
