# The legs of the contexts: each member's VLAN sub-interface of its uplink ethernet1/1, addressed from the leg's /29 in
# the VRF of the leg (members take .5 and .6, the pair's floating VIP is .4, the border leaves' anycast gateway .1).
# A leg is derived from its member and its vlan_id (utils/service_contexts.py), never listed on its context; the
# exchange (04_contexts_01) names the edge context's legs as its capabilities, the VRF of each leg lists it
# (90_bindings/95_vrf_interfaces/DC-KTW1.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "ethernet1/1.3000"
      vlan_id: 3000
      device: ktw1-fw-01
      parent_interface: ["ktw1-fw-01", "ethernet1/1"]
      role: service
      status: active
      ip_address:
        data:
          address: "100.66.0.5/29"
          ip_namespace: "default"
    - name: "ethernet1/1.3000"
      vlan_id: 3000
      device: ktw1-fw-02
      parent_interface: ["ktw1-fw-02", "ethernet1/1"]
