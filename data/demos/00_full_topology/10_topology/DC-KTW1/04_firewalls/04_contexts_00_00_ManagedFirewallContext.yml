# ManagedFirewallContext declarations in recursive dependency order.
# The firewall contexts of DC-KTW1, one per environment of C900 (production):
#   shared-ktw1-fw-ha-prod   on the internal pair; C900's east-west context (the footprint lists it, 90_bindings). It
#                            has a leg in PROD only: the DC has an Internet edge, so it keeps no INTERNET leg and no
#                            public address.
#   shared-ktw1-xfw-ha-prod  on the external pair; the Internet edge of the DC (the footprint lists it too), with a PROD
#                            leg and an INTERNET leg, joined by the routed exchange below, and the public address (SNAT)
#                            the traffic of the shared customers leaves with.
# The transit VLAN of a leg is the context's vlan_id plus the slot of its VRF (utils/exchange_transit.py: PROD 0,
# INTERNET 400). A context's legs (03_legs.yml: the sub-interfaces of each member's first uplink tagged with a transit
# VLAN) and the firewall ports of the border leaves that face its pair are derived, never listed on the context
# (utils/service_contexts.py). Contexts and legs are data here; a generator
# builds the same objects on 30_all.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: shared-ktw1-fw-ha-prod
      deployment: DC-KTW1
      shared_devices: [ktw1-fw-01, ktw1-fw-02]
      vlan_id: 3000
    - name: shared-ktw1-xfw-ha-prod
      deployment: DC-KTW1
      shared_devices: [ktw1-xfw-01, ktw1-xfw-02]
      vlan_id: 3001
      snat_address:
        data:
          address: "192.0.2.20/32"
          description: "SNAT address of shared-ktw1-xfw-ha-prod"
          ip_namespace: "default"
