# ManagedVRF declarations in recursive dependency order.
# The pod: the VRF of DC-KTW1 gets the new routing devices (the whole list, an upsert replaces it).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "dc-ktw1-vrf-prod"
      security_zone: "PROD"
      deployment: "DC-KTW1"
      shared_devices:
        - "ktw1-leaf-01"
        - "ktw1-leaf-02"
        - "ktw1-bl-01"
        - "ktw1-bl-02"
        - "ktw1-edge-01"
