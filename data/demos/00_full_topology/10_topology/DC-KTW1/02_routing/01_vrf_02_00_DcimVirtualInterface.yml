---
# The VPN tunnel interfaces of the edge (defined with the device in 01_physical) join the PROD routing instance. They
# end the VPN session circuits, so each names its VRF; the instance exists only here, after 01_vrf_*.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - {device: ktw1-edge-01, name: Tunnel1, vrf: [DC-KTW1, PROD]}
    - {device: ktw1-edge-01, name: Tunnel2, vrf: [DC-KTW1, PROD]}
    - {device: ktw1-edge-01, name: Tunnel4, vrf: [DC-KTW1, PROD]}
    - {device: ktw1-edge-01, name: Tunnel5, vrf: [DC-KTW1, PROD]}
    - {device: ktw1-edge-01, name: Tunnel6, vrf: [DC-KTW1, PROD]}
