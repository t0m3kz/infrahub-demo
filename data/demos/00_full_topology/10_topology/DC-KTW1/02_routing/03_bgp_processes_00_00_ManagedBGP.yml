# ManagedBGP declarations in recursive dependency order.
# The BGP processes of leaf and edge (overlay). The loopback that is a process's router id exists only for it, so it
# is nested under the process.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: ktw1-edge-01-bgp
      status: active
      process_role: overlay
      local_as: AS4200090001
      router_id:
        data:
          address: "10.90.255.1/32"
          ip_namespace: default
          description: ktw1-edge-01 loopback
      capabilities: ["ktw1-edge-01"]
    - name: ktw1-leaf-01-bgp
      status: active
      process_role: overlay
      local_as: AS4200090002
      router_id:
        data:
          address: "10.90.255.2/32"
          ip_namespace: default
          description: ktw1-leaf-01 loopback
      capabilities: ["ktw1-leaf-01"]
