---
# The panels of the data hall (passive, not devices). PP-KTW1-01 is in the border and edge rack, between the leaf and
# the edge (jack 1) and between border leaf 1 and the edge (jack 2). PP-KTW1-02 is the panel of the compute rack (jack
# 1 eno1, jack 2 eno2 of the server); PP-KTW1-03 and PP-KTW1-04 are the panels of the two leaf racks (jack 1 each, the
# horizontal run of the server's link to its leaf). Every panel is of type lc-24: its 24 rear and 24 front ports,
# each front on its rear, are in 00_patch_panels_01_00 and _02_00 (no generator runs here). The used jacks are declared
# here too, a nested front port on its rear port (front "n" -> rear "n", both upserted by panel and name), so the
# cables of 02_cables.yml land on them in the same load.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPatchPanel
  data:
    - name: PP-KTW1-01
      panel_type: lc-24
      member_of_groups: [patch_panels]
      description: "DC-KTW1 patch panel, jack 1 joins the leaf to the edge"
      rack: ktw1-rack-01
      position: 42
      rack_face: front
      front_ports:
        - kind: DcimFrontPatchPanelPort
          data:
            name: "1"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["ktw1-rack-01", "PP-KTW1-01"]
                name: "1"
                connector: lc-upc
        - kind: DcimFrontPatchPanelPort
          data:
            name: "2"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["ktw1-rack-01", "PP-KTW1-01"]
                name: "2"
                connector: lc-upc
    - name: PP-KTW1-02
      panel_type: lc-24
      member_of_groups: [patch_panels]
      description: "Compute rack panel: jack 1 is eno1 and jack 2 is eno2 of ktw1-srv-01"
      rack: ktw1-rack-02
      position: 42
      rack_face: front
      front_ports:
        - kind: DcimFrontPatchPanelPort
          data:
            name: "1"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["ktw1-rack-02", "PP-KTW1-02"]
                name: "1"
                connector: lc-upc
        - kind: DcimFrontPatchPanelPort
          data:
            name: "2"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["ktw1-rack-02", "PP-KTW1-02"]
                name: "2"
                connector: lc-upc
    - name: PP-KTW1-03
      panel_type: lc-24
      member_of_groups: [patch_panels]
      description: "Leaf rack panel of ktw1-leaf-01: jack 1 is the run to the compute rack"
      rack: ktw1-rack-03
      position: 42
      rack_face: front
      front_ports:
        - kind: DcimFrontPatchPanelPort
          data:
            name: "1"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["ktw1-rack-03", "PP-KTW1-03"]
                name: "1"
                connector: lc-upc
    - name: PP-KTW1-04
      panel_type: lc-24
      member_of_groups: [patch_panels]
      description: "Leaf rack panel of ktw1-leaf-02: jack 1 is the run to the compute rack"
      rack: ktw1-rack-04
      position: 42
      rack_face: front
      front_ports:
        - kind: DcimFrontPatchPanelPort
          data:
            name: "1"
            connector: lc-upc
            rear_port:
              kind: DcimRearPatchPanelPort
              data:
                panel: ["ktw1-rack-04", "PP-KTW1-04"]
                name: "1"
                connector: lc-upc
