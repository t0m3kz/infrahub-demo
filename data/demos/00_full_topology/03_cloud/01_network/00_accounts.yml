---
# One account per cloud, the spoke accounts, and the partner's account of the Google Partner Interconnect.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudAccount
  data:
    - name: "c900-aws-prod"
      account_id: "900000000001"
      environment: "p"
      provider: "P004"
      owner: "C900"
    - name: "c900-azure-prod"
      account_id: "90000000-0000-0000-0000-000000000002"
      environment: "p"
      provider: "P005"
      owner: "C900"
    - name: "c900-gcp-prod"
      account_id: "c900-prod-project"
      environment: "p"
      provider: "P006"
      owner: "C900"
    # The spoke accounts: three AWS accounts whose VPCs attach to the transit gateway of c900-aws-prod (shared with
    # them, the attachment lives in the spoke account), and three Azure subscriptions whose VNets peer with the hub
    # VNet of c900-azure-prod and use its ExpressRoute gateway (gateway transit). All PROD: a spoke never joins a
    # non-prod network.
    - name: "c900-aws-payments"
      account_id: "900000000011"
      environment: "p"
      provider: "P004"
      owner: "C900"
    - name: "c900-aws-analytics"
      account_id: "900000000012"
      environment: "p"
      provider: "P004"
      owner: "C900"
    - name: "c900-aws-shared"
      account_id: "900000000013"
      environment: "p"
      provider: "P004"
      owner: "C900"
    - name: "c900-azure-payments"
      account_id: "90000000-0000-0000-0000-000000000011"
      environment: "p"
      provider: "P005"
      owner: "C900"
    - name: "c900-azure-analytics"
      account_id: "90000000-0000-0000-0000-000000000012"
      environment: "p"
      provider: "P005"
      owner: "C900"
    - name: "c900-azure-identity"
      account_id: "90000000-0000-0000-0000-000000000013"
      environment: "p"
      provider: "P005"
      owner: "C900"
    # The Equinix account that runs the Managed Private Cloud (03_cloud/05_clusters): Equinix is the provider P016.
    - name: "c900-equinix-prod"
      account_id: "c900-equinix-par"
      environment: "p"
      provider: "P016"
      owner: "C900"
    # The partner's account: a hosted connection lives there while its peerings are in the customer's account.
    - name: "partner-fabric-gcp"
      account_id: "partner-fabric-project"
      environment: "p"
      provider: "P016"
