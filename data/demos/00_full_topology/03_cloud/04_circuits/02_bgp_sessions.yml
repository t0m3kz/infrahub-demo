---
# The handoff sessions, hand-written (no generator builds a session towards a cloud peering interface). A BGP peering
# has one process of ours and, as capabilities, our interface: a sub-interface, or a routed port. The other end is the
# peering interface at the far end of the session circuit that has the same interface as an end (the peer address and
# AS are its peer_ip and peer_asn), so no provider stub device is needed.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: BGP-DMC1-EDGE01-AWS-DX
      description: eBGP to the AWS transit virtual interface
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - eg-dmc101-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: eg-dmc101
            name: Ethernet1/3.1000
    - name: BGP-DMC1-EDGE01-AWS-DX-PRIV
      description: eBGP to the AWS private virtual interface
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - eg-dmc101-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: eg-dmc101
            name: Ethernet1/3.1100
    - name: BGP-DMC1-EDGE01-AZ-ER-PRI
      description: eBGP to the ExpressRoute primary peering
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - eg-dmc101-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: eg-dmc101
            name: Ethernet1/1.200
    - name: BGP-DMC1-EDGE01-AZ-ER-SEC
      description: eBGP to the ExpressRoute secondary peering
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - eg-dmc101-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: eg-dmc101
            name: Ethernet1/1.201
    - name: BGP-DMC1-EDGE01-GCP-IC
      description: eBGP to the GCP Cloud Router over the VLAN attachment
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - eg-dmc101-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: eg-dmc101
            name: Ethernet1/1.400
    # A routed port: the session sits on the physical Ethernet1/5 (address, no VLAN), not on a sub-interface.
    - name: BGP-DMC1-EDGE01-GCP-DED
      description: eBGP to the GCP Cloud Router over the dedicated routed port
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - eg-dmc101-bgp
      capabilities:
        - kind: DcimPhysicalInterface
          data:
            device: eg-dmc101
            name: Ethernet1/5
    - name: BGP-DC90-EDGE01-AWS-VPN-1
      description: eBGP through tunnel 1 to the AWS VPN
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - dc90-edge-01-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: dc90-edge-01
            name: Tunnel1
    - name: BGP-DC90-EDGE01-AWS-VPN-2
      description: eBGP through tunnel 2 to the AWS VPN
      session_type: EBGP
      peering_role: regular
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - dc90-edge-01-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: dc90-edge-01
            name: Tunnel2
