---
# The circuits of the legs. A circuit ends on interfaces through ONE edge, `capabilities` (the shared interface edge,
# min 1, max 2): an interface of ours and an interface of the other side, given by its HFID `[device, interface]`. The
# far end of a carrier is a port of a transport, the far end of a session is a peering interface of it (both nested
# under the transport in 03_cloud/03_transport), so the transports and their interfaces exist by now and nothing is
# created here. `locations` are authored here (no generator derives them on the throwaway branch).
#
# Carrier circuits are the physical wire. Every cloud leg lands in the colocation cage PAR-COLO1 (02_colo), where the
# cage edge par-colo1-edge-01 is: the Direct Connect and the Google Dedicated Interconnect are cross-connects from an
# edge port to the provider's port; ExpressRoute and the Google Partner Interconnect are Equinix Fabric virtual
# connections that start on the Fabric port of the cage (EXT-FABRIC-PAR), which the edge reaches through the patch
# panel (02_colo/01_physical/02_cables.yml). The last carrier, INET-KTW1-ISP-A, is the internet access of the DC edge.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: XC-PAR1-AWS-DX1
      circuit_id: XC-PAR1-AWS-DX1
      description: Cross-connect from the cage edge par-colo1-edge-01 to the first AWS Direct Connect port of the LAG
      provider: P004
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      locations:
        - PAR-COLO1
        - eu-central-1
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/3"]
        - ["dx-c900-fra-lag", "dxcon-1a"]
    - name: XC-PAR1-AWS-DX2
      circuit_id: XC-PAR1-AWS-DX2
      description: Cross-connect from the cage edge par-colo1-edge-01 to the second AWS Direct Connect port of the LAG
      provider: P004
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      locations:
        - PAR-COLO1
        - eu-central-1
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/4"]
        - ["dx-c900-fra-lag", "dxcon-1b"]
    - name: VC-PAR1-AZ-ER-PRI
      circuit_id: VC-PAR1-AZ-ER-PRI
      description: Fabric virtual connection from the cage Fabric port to the ExpressRoute circuit, primary link
      provider: P016
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      locations:
        - PAR-COLO1
        - westeurope
      capabilities:
        - ["EXT-FABRIC-PAR", "et-0/0/0"]
        - ["er-c900-weu", "msee-pri"]
    - name: VC-PAR1-AZ-ER-SEC
      circuit_id: VC-PAR1-AZ-ER-SEC
      description: Fabric virtual connection from the cage Fabric port to the ExpressRoute circuit, secondary link
      provider: P016
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      locations:
        - PAR-COLO1
        - westeurope
      capabilities:
        - ["EXT-FABRIC-PAR", "et-0/0/0"]
        - ["er-c900-weu", "msee-sec"]
    - name: VC-PAR1-GCP-IC1
      circuit_id: VC-PAR1-GCP-IC1
      description: Equinix Fabric virtual connection from the cage Fabric port to the Google Partner Interconnect
      provider: P016
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      locations:
        - PAR-COLO1
        - europe-west3
      capabilities:
        - ["EXT-FABRIC-PAR", "et-0/0/0"]
        - ["ic-c900-fra-1", "ic-port-1"]
    - name: XC-PAR1-GCP-DED1
      circuit_id: XC-PAR1-GCP-DED1
      description: Cross-connect to the Google Dedicated Interconnect port (routed port on both ends, no VLAN)
      provider: P006
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      locations:
        - PAR-COLO1
        - europe-west3
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/5"]
        - ["ic-ded-c900-fra", "ic-dedicated-port"]
    - name: INET-KTW1-ISP-A
      circuit_id: INET-KTW1-ISP-A
      description: Internet access of ktw1-edge-01 (carries the AWS VPN tunnels and the office tunnel to the DC)
      provider: P014
      circuit_type: internet
      status: active
      bandwidth: 1000
      locations:
        - DC-KTW1
        - ISP-A
      capabilities:
        - ["ktw1-edge-01", "Ethernet1/2"]
        - ["EXT-ISP-A-PE1", "et-0/0/0"]
