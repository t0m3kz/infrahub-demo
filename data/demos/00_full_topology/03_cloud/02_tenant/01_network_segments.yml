---
# The subnet of the AWS VPC.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkSegment
  data:
    - owner: "C900"
      customer_name: "subnet"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vpc-c900-prod"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.200.1.0/24"
      customer_deployment: "C900-P-DEMO-AWS-EU-CENTRAL-1"
---
# Two more cloud segments for the extra pairs of the traversal check. The spoke segment sits in the Azure spoke VNet,
# which only peers with the hub VNet the ExpressRoute gateway is attached to: the DC reaches it across `peers`. The
# isolated segment sits in a VPC with no attachment at all: nothing reaches it, and the check must say so.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkSegment
  data:
    - owner: "C900"
      customer_name: "spoke"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vnet-c900-weu-spoke"
      availability_zone: ["westeurope", "westeurope-1"]
      cidr_block: "10.203.1.0/24"
      customer_deployment: "C900-P-DEMO-AZURE-WESTEUROPE"
    - owner: "C900"
      customer_name: "isolated"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vpc-c900-isolated"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.204.1.0/24"
      customer_deployment: "C900-P-DEMO-AWS-EU-CENTRAL-1"
---
# A subnet in each spoke account. AWS: reached through the transit gateway; Azure: across the hub VNet's peering and
# its ExpressRoute gateway.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkSegment
  data:
    - owner: "C900"
      customer_name: "payments-aws"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vpc-c900-payments"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.205.1.0/24"
      customer_deployment: "C900-P-PAYMENTS-AWS-EU-CENTRAL-1"
    - owner: "C900"
      customer_name: "analytics-aws"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vpc-c900-analytics"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.206.1.0/24"
      customer_deployment: "C900-P-ANALYTICS-AWS-EU-CENTRAL-1"
    - owner: "C900"
      customer_name: "shared-aws"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vpc-c900-shared"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.207.1.0/24"
      customer_deployment: "C900-P-SHARED-AWS-EU-CENTRAL-1"
    - owner: "C900"
      customer_name: "payments-azure"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vnet-c900-payments-weu"
      availability_zone: ["westeurope", "westeurope-1"]
      cidr_block: "10.208.1.0/24"
      customer_deployment: "C900-P-PAYMENTS-AZURE-WESTEUROPE"
    - owner: "C900"
      customer_name: "analytics-azure"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vnet-c900-analytics-weu"
      availability_zone: ["westeurope", "westeurope-1"]
      cidr_block: "10.209.1.0/24"
      customer_deployment: "C900-P-ANALYTICS-AZURE-WESTEUROPE"
    - owner: "C900"
      customer_name: "identity-azure"
