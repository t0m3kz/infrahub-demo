---
# The footprint of C900 in the AWS account.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      account: "c900-aws-prod"
      customer_name: "demo-aws"
      parent: "eu-central-1"
---
# The footprint of C900 in the Azure account (the spoke and isolated segments for the extra pairs of the traversal
# check).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      account: "c900-azure-prod"
      customer_name: "demo-azure"
      parent: "westeurope"
---
# The footprints of C900 in the spoke accounts: one per account (a footprint has exactly one account), each holding the
# segments of its own networks (checks/customer_cloud_account.py CA2).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      account: "c900-aws-payments"
      customer_name: "payments-aws"
      parent: "eu-central-1"
    - owner: "C900"
      account: "c900-aws-analytics"
      customer_name: "analytics-aws"
      parent: "eu-central-1"
    - owner: "C900"
      account: "c900-aws-shared"
      customer_name: "shared-aws"
      parent: "eu-central-1"
    - owner: "C900"
      account: "c900-azure-payments"
      customer_name: "payments-azure"
      parent: "westeurope"
    - owner: "C900"
      account: "c900-azure-analytics"
      customer_name: "analytics-azure"
      parent: "westeurope"
    - owner: "C900"
      account: "c900-azure-identity"
      customer_name: "identity-azure"
      parent: "westeurope"
