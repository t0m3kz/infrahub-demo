---
# The VPN transport holds the tunnels as peering interfaces. AWS: the provider side is the hub, our side the customer
# gateway; each tunnel is a peering with no parent (a tunnel rides on our internet port, not on a port of the
# transport).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVPNConnection
  data:
    - name: vpn-c900-aws-euc1
      description: "AWS site-to-site VPN: two tunnels, BGP inside each /30"
      status: active
      account: c900-aws-prod
      region: eu-central-1
      customer_gateway: cgw-c900-ktw1
      gateway: tgw-c900-euc1
      interfaces:
        - kind: CloudPeeringInterface
          data:
            name: Tunnel1
            description: AWS VPN tunnel 1
            status: active
            scope: private
            routing: bgp
            tunnel_index: 1
            endpoint_ip: "203.0.113.50/32"
            tunnel_mode: ipsec
            crypto_profile: IPSEC-AES256-SHA256-DH14
            tunnel_key: c900-aws-vpn-t1-key
            mtu: 1436
            peer_ip:
              data:
                address: "169.254.10.1/30"
                ip_namespace: PROD
                description: AWS side of VPN tunnel 1
            peer_asn: AS64512
        - kind: CloudPeeringInterface
          data:
            name: Tunnel2
            description: AWS VPN tunnel 2
            status: active
            scope: private
            routing: bgp
            tunnel_index: 2
            endpoint_ip: "203.0.113.51/32"
            tunnel_mode: ipsec
            crypto_profile: IPSEC-AES256-SHA256-DH14
            tunnel_key: c900-aws-vpn-t2-key
            mtu: 1436
            peer_ip:
              data:
                address: "169.254.10.5/30"
                ip_namespace: PROD
                description: AWS side of VPN tunnel 2
            peer_asn: AS64512
