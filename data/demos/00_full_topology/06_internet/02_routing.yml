---
# The INTERNET VRF instance of DC90 with the edge as its member, the edge's internet process and the ISP's, and the
# eBGP transit session between them on Ethernet1/2 / et-0/0/0 (a physical port at both ends: no tunnel, no VIF). The
# ISP sends a default route, which is how everything behind it (the two public ranges) is reached.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "dc90-vrf-internet"
      namespace: "INTERNET"
      deployment: "DC90"
      shared_devices:
        - "dc90-edge-01"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "dc90-edge-01-inet-bgp"
      status: active
      process_role: regular
      local_as: "AS4200090001"
      router_id: ["198.51.100.10/31", "INTERNET"]
      capabilities: ["dc90-edge-01"]
    - name: "EXT-ISP-DEMO-PE1-bgp"
      status: active
      process_role: regular
      local_as: "AS64496"
      router_id: ["198.51.100.11/31", "INTERNET"]
      capabilities: ["EXT-ISP-DEMO-PE1"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "BGP-DC90-EDGE01-ISP-DEMO"
      description: "eBGP transit to the ISP: default route in, our public prefixes out"
      session_type: EBGP
      peering_role: regular
      address_families:
        - ["ipv4", "unicast"]
      bgp_processes:
        - "dc90-edge-01-inet-bgp"
        - "EXT-ISP-DEMO-PE1-bgp"
      capabilities:
        - kind: DcimPhysicalInterface
          data:
            device: dc90-edge-01
            name: Ethernet1/2
        - kind: DcimPhysicalInterface
          data:
            device: EXT-ISP-DEMO-PE1
            name: et-0/0/0
