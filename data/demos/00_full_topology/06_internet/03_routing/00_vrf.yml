---
# The INTERNET VRF instance of DC-KTW1 with the edge as its member; the edge's internet process and the ISP's, and the
# eBGP transit session between them on Ethernet1/2 / et-0/0/0 (a physical port at both ends: no tunnel, no VIF)
# follow. The ISP sends a default route, which is how everything behind it (the two public ranges) is reached.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "dc-ktw1-vrf-internet"
      namespace: "INTERNET"
      deployment: "DC-KTW1"
      shared_devices:
        - "ktw1-edge-01"
