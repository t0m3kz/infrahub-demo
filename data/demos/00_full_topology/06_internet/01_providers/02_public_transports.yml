---
# The public side of the two services: a transport per region, holding the port the internet carrier ends on (nested;
# INTERNET:bus is bootstrap data, data/bootstrap/03b_internet.yml). They are the same CloudDirectConnect as the
# private ones; nothing marks them public but the carrier that reaches INTERNET.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudDirectConnect
  data:
    - name: webex-c900-fra-pub
      description: "Public side of Webex Frankfurt: where the service is reached over the internet"
      status: active
      connection_type: physical
      provider: "P901"
      bandwidth: 10000
      saas_region: WEBEX-FRANKFURT
      owner: C900
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: pub-1
            description: Public service port of Webex Frankfurt
            status: active
    - name: s3-c900-euc1-pub
      description: "Public side of the object store API of eu-central-1, reached over the internet"
      status: active
      connection_type: physical
      provider: "P004"
      bandwidth: 10000
      account: c900-aws-prod
      region: eu-central-1
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: pub-1
            description: Public service port of the object store API
            status: active
