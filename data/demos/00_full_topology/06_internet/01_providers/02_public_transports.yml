---
# The public side of the cloud and SaaS services: a TopologyProviderConnect per region (the same kind as the Fabric port
# of a colocation cage, 02_colo), a slim device of the provider that holds the port the internet carrier ends on
# (nested; INTERNET:bus is bootstrap data, data/bootstrap/03b_internet.yml). It is the provider's internet-facing edge
# of the region, not a Direct Connect: nothing of ours is physical there, and the private connections
# (03_cloud/03_transport) stay in their own kinds.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnect
  data:
    - name: EXT-WEBEX-FRA
      description: "Public side of Webex Frankfurt: where the service is reached over the internet"
      status: active
      provider: "P901"
      bandwidth: 10000
      location: WEBEX-FRANKFURT
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: pub-1
            description: Public service port of Webex Frankfurt
            status: active
    - name: EXT-AWS-EUC1
      description: "Public side of AWS eu-central-1 (the object store API), reached over the internet"
      status: active
      provider: "P004"
      bandwidth: 10000
      location: eu-central-1
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: pub-1
            description: Public service port of the object store API
            status: active
    - name: EXT-AZURE-WEU
      description: "Public side of Azure westeurope (the blob storage API), reached over the internet"
      status: active
      provider: "P005"
      bandwidth: 10000
      location: westeurope
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: pub-1
            description: Public service port of the blob storage API
            status: active
    - name: EXT-GCP-EUW3
      description: "Public side of GCP europe-west3 (the object storage API), reached over the internet"
      status: active
      provider: "P006"
      bandwidth: 10000
      location: europe-west3
      interfaces:
        - kind: DcimPhysicalInterface
          data:
            name: pub-1
            description: Public service port of the object storage API
            status: active
