---
# THE INTERNET (one passive object with one shared interface, bootstrap data: data/bootstrap/03b_internet.yml) and the
# L1 that meets on it. Our edge port -> internet carrier -> ISP router; the ISP router's uplink -> internet carrier ->
# the interface of INTERNET; the public side of a SaaS region and of a cloud region -> internet carrier -> the same
# interface. So from dc90-edge-01 the public side of Webex and of the object store is reachable at L1 through either
# ISP. INTERNET has no routing: the addresses and prefixes of this scenario live in the INTERNET namespace
# (06_internet/00_addressing/01_prefixes.yml).
#
#   dc90-edge-01 Ethernet1/2 -- INET-DC90-ISP-DEMO   -- EXT-ISP-DEMO-PE1   et-0/0/0   (base sample, ISP-DEMO)
#                               EXT-ISP-DEMO-PE1    xe-0/1/0 -- UPL-ISP-DEMO   -+
#   dc90-edge-01 Ethernet1/1 -- INET-DC90-ISP-DEMO-B -- EXT-ISP-DEMO-B-PE1 et-0/0/0   (a second ISP)    |
#                               EXT-ISP-DEMO-B-PE1  xe-0/1/0 -- UPL-ISP-DEMO-B -+                      |
#   webex-c900-fra-pub pub-1 -- PUB-WEBEX-FRA (Webex Frankfurt, public side) ----+--> INTERNET:bus
#   s3-c900-euc1-pub   pub-1 -- PUB-S3-EUC1 (object store eu-central-1, public side) -+
#
# INTERNET has ONE interface, `bus`, of its own kind (TopologyInternetInterface), and every attachment keeps a carrier
# circuit of its own that ends on it: the kind is what lets many carriers share it (checks/carrier_circuit_ports.py).
# The carriers are `internet` circuits; the five ends that are not the bus are the ports of ISP routers and of the
# transports that stand for the public sides.
#
# The carriers. Locations are authored (no generator runs in this sample): a carrier has exactly two, one per end, and
# INTERNET is the location of its own end. INET-DC90-ISP-DEMO-B is an access carrier like the base sample's; the four
# others are attachments: their second end is the bus.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: INET-DC90-ISP-DEMO-B
      circuit_id: INET-DC90-ISP-DEMO-B
      description: Second internet access of dc90-edge-01
      provider: P023
      circuit_type: internet
      status: active
      bandwidth: 1000
      locations:
        - DC90
        - ISP-DEMO-B
      capabilities:
        - ["dc90-edge-01", "Ethernet1/1"]
        - ["EXT-ISP-DEMO-B-PE1", "et-0/0/0"]
    - name: UPL-ISP-DEMO
      circuit_id: UPL-ISP-DEMO
      description: Uplink of the ISP-DEMO router to the internet
      provider: P014
      circuit_type: internet
      status: active
      bandwidth: 100000
      locations:
        - ISP-DEMO
        - INTERNET
      capabilities:
        - ["EXT-ISP-DEMO-PE1", "xe-0/1/0"]
        - ["INTERNET", "bus"]
    - name: UPL-ISP-DEMO-B
      circuit_id: UPL-ISP-DEMO-B
      description: Uplink of the ISP-DEMO-B router to the internet
      provider: P023
      circuit_type: internet
      status: active
      bandwidth: 100000
      locations:
        - ISP-DEMO-B
        - INTERNET
      capabilities:
        - ["EXT-ISP-DEMO-B-PE1", "xe-0/1/0"]
        - ["INTERNET", "bus"]
    - name: PUB-WEBEX-FRA
      circuit_id: PUB-WEBEX-FRA
      description: Public side of Webex Frankfurt to the internet
      provider: P901
      circuit_type: internet
      status: active
      bandwidth: 10000
      locations:
        - WEBEX-FRANKFURT
        - INTERNET
      capabilities:
        - ["webex-c900-fra-pub", "pub-1"]
        - ["INTERNET", "bus"]
    - name: PUB-S3-EUC1
      circuit_id: PUB-S3-EUC1
      description: Public side of the object store API of eu-central-1 to the internet
      provider: P004
      circuit_type: internet
      status: active
      bandwidth: 10000
      locations:
        - eu-central-1
        - INTERNET
      capabilities:
        - ["s3-c900-euc1-pub", "pub-1"]
        - ["INTERNET", "bus"]
---
# The internet access of the colocation cage and of the office, next to the DC's (INET-DC90-ISP-DEMO,
# 03_cloud/04_circuits/00_carrier_circuits.yml, and INET-DC90-ISP-DEMO-B above): an `internet` carrier from the site's
# port to a free `customer` port of an ISP router of the sample, the pattern of 30_all's INET-LUMEN-EQXFR2 and of
# add_sdwan_edge's INET-<office>. Both ISP routers are attached to INTERNET (UPL-ISP-DEMO, UPL-ISP-DEMO-B: rule I3),
# so every site reaches every other site and the public sides of the services at L1 through the internet:
#
#   eg-dmc101 Ethernet1/14 -- INET-DMC1-ISP-DEMO-B -- EXT-ISP-DEMO-B-PE1 et-0/0/1   (cage, second ISP)
#   C900-OFFICE-EDGE1 GE1  -- INET-C900-OFFICE     -- EXT-ISP-DEMO-PE1   et-0/0/1   (office, first ISP)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: INET-DMC1-ISP-DEMO-B
      circuit_id: INET-DMC1-ISP-DEMO-B
      description: Internet access of the DMC1 cage edge
      provider: P023
      circuit_type: internet
      status: active
      bandwidth: 10000
      locations:
        - DMC1
        - ISP-DEMO-B
      capabilities:
        - ["eg-dmc101", "Ethernet1/14"]
        - ["EXT-ISP-DEMO-B-PE1", "et-0/0/1"]
    - name: INET-C900-OFFICE
      circuit_id: INET-C900-OFFICE
      description: Internet access of the C900 office SD-WAN edge (underlay of its tunnels)
      provider: P014
      circuit_type: internet
      status: active
      bandwidth: 1000
      locations:
        - C900-OFFICE
        - ISP-DEMO
      capabilities:
        - ["C900-OFFICE-EDGE1", "GE1"]
        - ["EXT-ISP-DEMO-PE1", "et-0/0/1"]
