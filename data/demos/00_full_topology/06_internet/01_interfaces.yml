---
# The two ends of the internet carrier get the transit /31: the edge port Ethernet1/2 (the public address the AWS
# customer gateway already names, 198.51.100.10) and the ISP router port et-0/0/0.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - device: "dc90-edge-01"
      name: "Ethernet1/2"
      description: "Internet access (INET-DC90-ISP-DEMO): transit to the ISP, tunnels ride on it"
      status: active
      ip_address: {data: {address: "198.51.100.10/31", ip_namespace: "INTERNET"}}
    - device: "EXT-ISP-DEMO-PE1"
      name: "et-0/0/0"
      description: "Transit customer: dc90-edge-01"
      status: active
      ip_address: {data: {address: "198.51.100.11/31", ip_namespace: "INTERNET"}}
