---
# The application of C900 (c900-web-shop-p) and its three components, nested: a component exists only for its
# application. Each component names its segment and its instances, the VMs of the three DCs: the frontend in DC-KTW1
# (c900-web-p, ktw1-vm-01/02), the backend in DC-WAW1 (c900-app-p, waw1-vm-01), the database in DC-GDN1 (c900-db-p,
# gdn1-vm-01), so a call between two tiers crosses the DCI mesh. After every DC (the VMs are in
# 20_C900/DC-*/03_tenant) and AFTER 96_segment_ports: the components join `app_components`, which starts
# add_app_component_segment, and its SVI pass deletes a role-svi interface that is not yet a member of a routed row
# (the rows get their SVI in 96), so this folder loads last.
# Nothing is generated in this sample (no VIP, no rules, no port tags: the leaf ports of each segment are authored).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: web-shop
      environment: p
      criticality: medium
      fqdn: shop.c900.demo.local
      owner: C900
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: frontend
            fqdn: www.shop.c900.demo.local
            component_type: frontend
            ports:
              - tcp/443
            network_segment: c900-web-p
            instances:
              - ktw1-vm-01
              - ktw1-vm-02
            member_of_groups:
              - app_components
          - name: backend
            fqdn: api.shop.c900.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: c900-app-p
            instances:
              - waw1-vm-01
            member_of_groups:
              - app_components
          - name: database
            fqdn: db.shop.c900.demo.local
            component_type: database
            ports:
              - tcp/5432
            network_segment: c900-db-p
            instances:
              - gdn1-vm-01
            member_of_groups:
              - app_components
