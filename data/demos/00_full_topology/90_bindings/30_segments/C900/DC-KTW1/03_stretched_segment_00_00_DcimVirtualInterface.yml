# DcimVirtualInterface declarations in recursive dependency order.
# A segment stretched over the DCI: c900-sync-p lives in DC-KTW1 and DC-WAW1 at once (`stretch_scope: dc_pair`), one
# L2 domain over EVPN between the two DCs (the overlay sessions of 02_dci_peerings.yml). Its VLAN scope is `shared`:
# its ONE VNI 40000 (the first of the global pool, the same in every DC it reaches) gives the VLAN id 2500, the SAME
# on all eight switches, which is what a trunk to a switch that cannot do VXLAN needs (the local ids of c900-web-p
# and c900-app-p are per switch). A third DC joins with one more realization under the same VNI and the same id.
# The anycast gateway 10.94.1.1/24 is the same in both DCs.
#
# It loads after both DCs: its footprints, switches and VRFs exist. A stretched segment is realized on every VTEP of
# each hosting DC, with or without a port of it (generators/segment_vlan.py), so the leaves and the border leaves have a
# row each: eight in all. Only the leaves have an SVI (four): a border leaf carries a stretched segment as VLAN and VNI
# only, it relays the DCI routes and has no host in it (utils/segment_addressing.py l2_only_on). Every SVI has the
# anycast gateway above, which is why a host keeps its gateway when it moves between the DCs. No workload is attached
# yet: a LAG or port in the segment's deployment (its `capabilities`) is all a host needs.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - {name: Vlan2500, device: ktw1-leaf-01, role: svi, status: active, ip_address: ["10.94.1.1/24", "default"]}
    - {name: Vlan2500, device: ktw1-leaf-02, role: svi, status: active, ip_address: ["10.94.1.1/24", "default"]}
