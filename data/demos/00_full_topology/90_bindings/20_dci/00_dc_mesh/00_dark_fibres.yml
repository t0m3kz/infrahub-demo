---
# The DCI mesh between the DCs: two dark fibres per pair of DCs, border leaf 1 to border leaf 1 and border
# leaf 2 to border leaf 2, on the downlinks 1/2-3 the border leaves give role dci (10_topology/DC-*/01_physical). Pure
# carriers, unowned shared underlay; the DCI session circuit that rides each one is 01_dci_circuits.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: ktw1-df10001-waw1
      circuit_id: DF10001
      description: ktw1-bl-01 to waw1-bl-01, 100G dark fibre
      provider: P016
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      locations:
        - DC-KTW1
        - DC-WAW1
      capabilities:
        - ["ktw1-bl-01", "Ethernet1/2"]
        - ["waw1-bl-01", "Ethernet1/2"]
    - name: ktw1-df10002-waw1
