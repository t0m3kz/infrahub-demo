      description: "DCI EVPN multihop ktw1-bl-01 <-> fra-colo1-edge-01 over ktw1-dci-a-fra1"
      session_type: EBGP_MULTIHOP
      peering_role: dci
      ttl: 2
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "ktw1-bl-01-bgp"
        - "fra-colo1-edge-01-bgp"
