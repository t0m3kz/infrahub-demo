# ManagedBGPPeering declarations in recursive dependency order.
# The mesh: every DC to every cage (two fibres, border leaf 1 and 2 to the cage edge) and every cage to every
# other cage (one fibre between the two edges).
apiVersion: infrahub.app/v1
kind: Object
