# TopologyCustomerDC declarations in recursive dependency order.
# C900's footprint in DC-WAW1 lists the firewall contexts that serve it (its dedicated one: the DC has no Internet
# edge). The same object as in 03_tenant/00_customer_dc.yml (an upsert by its keys) with the one link added: the
# contexts load after the footprint.
# The dedicated context is already declared under this customer's 04_firewalls; no boarding step is required.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C900"
      environment: "p"
      infrastructure_orchestrator: ansible_automation_platform
      parent: "DC-WAW1"
      serving_firewall_contexts: [c900-waw1-fw-01-waw1-fw-02-prod]
