# Upsert the existing C900 footprint from its keys, listing the firewall contexts that serve it: the DC has no
# Internet edge pair, so its internal context holds every rule.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: C900
      environment: p
      infrastructure_orchestrator: ansible_automation_platform
      parent: DC-GDN1
      design: S_100G
      serving_firewall_contexts: [shared-gdn1-fw-ha-prod]
