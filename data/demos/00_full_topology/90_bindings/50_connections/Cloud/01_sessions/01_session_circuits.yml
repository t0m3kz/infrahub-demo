# Session circuits are the routing on top: handoff (BGP) for the private legs, vpn for the two AWS tunnels (those
# still ride the internet access of the DC edge). peer_ip and peer_asn are the PROVIDER side of the leg (on the
# peering interface); our side is the sub-interface address of
# 10_topology/COLO-PAR/02_routing/01_virtual_interfaces.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    # AWS Direct Connect, transit: virtual interface (scope private) -> Direct Connect Gateway -> transit gateway.
    - name: par1-dxvif-fgt1a2b3-aws-900000000001
      description: 'Handoff: edge sub-interface to the transit virtual interface'
      provider: P004
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 10.255.128.0/31
        - "default"
      locations:
        - PAR-COLO1
        - eu-central-1
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/3.1000"]
        - ["dx-c900-fra-lag", "lag1.1000"]
    # AWS Direct Connect, private: virtual interface (scope private) -> virtual private gateway -> VPC.
    - name: par1-dxvif-fgp4c5d6-aws-900000000001
      description: 'Handoff: edge sub-interface to the private virtual interface'
      provider: P004
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 10.255.128.2/31
        - "default"
      locations:
        - PAR-COLO1
        - eu-central-1
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/3.1100"]
        - ["dx-c900-fra-lag", "lag1.1100"]
    # Azure ExpressRoute: ONE transport (the circuit), two peerings, a /30 each, both on the ExpressRoute Gateway.
    - name: par1-er-pri-azure-90000000-0000-0000-0000-000000000002
      description: 'Handoff: edge sub-interface to the primary private peering'
      provider: P005
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 10.255.128.8/30
        - "default"
      locations:
        - PAR-COLO1
        - westeurope
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/1.200"]
        - ["er-c900-weu", "er-c900-weu-pri"]
    - name: par1-er-sec-azure-90000000-0000-0000-0000-000000000002
      description: 'Handoff: edge sub-interface to the secondary private peering'
      provider: P005
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 10.255.128.12/30
        - "default"
      locations:
        - PAR-COLO1
        - westeurope
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/1.201"]
        - ["er-c900-weu", "er-c900-weu-sec"]
    # GCP Partner Interconnect: VLAN attachment (scope private) -> Cloud Router -> VPC.
    - name: par1-vlanatt1-gcp-c900-prod-project
      description: 'Handoff: edge sub-interface to the VLAN attachment'
      provider: P006
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 169.254.20.0/29
        - "default"
      locations:
        - PAR-COLO1
        - europe-west3
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/1.400"]
        - ["ic-c900-fra-1", "gcp-c900-vlan-att-1"]
    # GCP Dedicated Interconnect: a ROUTED PORT leg. Both ends are physical interfaces with an address and no VLAN
    # (Ethernet1/5 of the cage edge carries 169.254.30.2/29 itself, no sub-interface).
    - name: par1-ded1-gcp-c900-prod-project
      description: 'Handoff on a routed port: cage edge Ethernet1/5 to the Cloud Router peering, no VLAN'
      provider: P006
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 169.254.30.0/29
        - "default"
      locations:
        - PAR-COLO1
        - europe-west3
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/5"]
        - ["ic-ded-c900-fra", "gcp-c900-ded-1"]
    # AWS site-to-site VPN: ONE transport (the VPN connection), two tunnels, each a peering and the end of its own
    # session circuit, BGP inside a /30 each. The provider side (transit gateway) is on the transport.
    - name: ktw1-vpn-tun1-aws-900000000001
      description: VPN tunnel 1 from the edge to the AWS VPN connection
      provider: P004
      circuit_type: vpn
      status: active
      vrf: [DC-KTW1, "PROD"]
      link_prefix:
        - 169.254.10.0/30
        - "default"
      locations:
        - DC-KTW1
        - eu-central-1
      capabilities:
        - ["ktw1-edge-01", "Tunnel1"]
        - ["vpn-c900-aws-euc1", "Tunnel1"]
    - name: ktw1-vpn-tun2-aws-900000000001
      description: VPN tunnel 2 from the edge to the AWS VPN connection
      provider: P004
      circuit_type: vpn
      status: active
      vrf: [DC-KTW1, "PROD"]
      link_prefix:
        - 169.254.10.4/30
        - "default"
      locations:
        - DC-KTW1
        - eu-central-1
      capabilities:
        - ["ktw1-edge-01", "Tunnel2"]
        - ["vpn-c900-aws-euc1", "Tunnel2"]
