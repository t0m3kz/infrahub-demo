---
# The handoff session of Webex, hand-written like the cloud ones
# (90_bindings/50_connections/Cloud/01_sessions/02_bgp_sessions.yml): one
# process of ours,
# our sub-interface as capability, the peer address and AS are on the peering interface at the other end.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: BGP-PAR1-EDGE01-WEBEX
      description: eBGP to Webex
      session_type: EBGP
      peering_role: regular
      password: c900-webex-bgp-key
      ttl: 1
      address_families:
        - - ipv4
          - unicast
      bgp_processes:
        - par-colo1-edge-01-bgp
      capabilities:
        - kind: DcimVirtualInterface
          data:
            device: par-colo1-edge-01
            name: Ethernet1/6.300
