apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    - name: par1-wbxpeer1-webex-fra
      description: 'Handoff: edge sub-interface to the Webex peering'
      provider: P901
      circuit_type: handoff
      status: active
      vrf: [PAR, "PROD"]
      link_prefix:
        - 10.255.128.6/31
        - "default"
      locations:
        - PAR-COLO1
        - WEBEX-FRANKFURT
      capabilities:
        - ["par-colo1-edge-01", "Ethernet1/6.300"]
        - ["webex-c900-fra-xc", "webex-c900-fra"]
