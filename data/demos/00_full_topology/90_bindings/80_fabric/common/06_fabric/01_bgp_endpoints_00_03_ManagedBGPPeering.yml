      bgp_processes: ["ktw1-bl-01-bgp", "waw1-bl-01-bgp"]
      peering_role: dci
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["ktw1-bl-01", "Loopback0"], ["waw1-bl-01", "Loopback0"]]
