# ManagedBGPPeering declarations in recursive dependency order.
# Bind every authored EVPN session to its two actual loopbacks after all facilities have been loaded.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: BGP-WAW1-LEAF01-SPINE01
      bgp_processes: ["waw1-leaf-01-bgp", "waw1-spine-01-bgp"]
      peering_role: overlay
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["waw1-leaf-01", "Loopback0"], ["waw1-spine-01", "Loopback0"]]
    - name: BGP-WAW1-LEAF02-SPINE01
      bgp_processes: ["waw1-leaf-02-bgp", "waw1-spine-01-bgp"]
      peering_role: overlay
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["waw1-leaf-02", "Loopback0"], ["waw1-spine-01", "Loopback0"]]
    - name: BGP-WAW1-SPINE01-BL01
      bgp_processes: ["waw1-spine-01-bgp", "waw1-bl-01-bgp"]
      peering_role: overlay
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["waw1-spine-01", "Loopback0"], ["waw1-bl-01", "Loopback0"]]
    - name: BGP-WAW1-SPINE01-BL02
      bgp_processes: ["waw1-spine-01-bgp", "waw1-bl-02-bgp"]
      peering_role: overlay
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["waw1-spine-01", "Loopback0"], ["waw1-bl-02", "Loopback0"]]
    - name: BGP-WAW1-BL01-EDGE01
      bgp_processes: ["waw1-bl-01-bgp", "waw1-edge-01-bgp"]
      peering_role: overlay
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["waw1-bl-01", "Loopback0"], ["waw1-edge-01", "Loopback0"]]
    - name: BGP-WAW1-BL02-EDGE01
      bgp_processes: ["waw1-bl-02-bgp", "waw1-edge-01-bgp"]
      peering_role: overlay
      address_families: [["l2vpn", "evpn"]]
      session_type: EBGP_MULTIHOP
      ttl: 2
      send_extended_community: true
      capabilities: [["waw1-bl-02", "Loopback0"], ["waw1-edge-01", "Loopback0"]]
