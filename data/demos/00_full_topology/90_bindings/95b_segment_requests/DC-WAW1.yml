---
# The switch ports a person asks to carry each segment in DC-WAW1: the ports assigned to the segment's deployment
# (its interface `capabilities`), the intent (schemas/extensions/service/segment.yml). The segment reconcile
# realizes a request as the port's membership of its switch's VLAN row; 00_full runs no generator, so it authors
# the realization too (96_segment_ports), consistent with this file: per deployment, the ports listed here are
# exactly the members of its rows (tests/unit/test_full_topology_segments.py). An upsert of the list replaces it, so
# each deployment's whole list is here, once.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-app-p
      deployment: DC-WAW1
      capabilities:
        - kind: DcimLAGInterface
          data: {device: waw1-leaf-01, name: "Port-Channel10", lag_id: 10}
        - kind: DcimLAGInterface
          data: {device: waw1-leaf-02, name: "Port-Channel10", lag_id: 10}
    - segment: c900-internal-fw-waw1-p
      deployment: DC-WAW1
      capabilities:
        - kind: DcimPhysicalInterface
          data: {device: waw1-bl-01, name: "Ethernet1/25"}
        - kind: DcimPhysicalInterface
          data: {device: waw1-bl-02, name: "Ethernet1/25"}
        - kind: DcimPhysicalInterface
          data: {device: waw1-leaf-01, name: "Ethernet1/5"}
        - kind: DcimLAGInterface
          data: {device: waw1-leaf-01, name: "Port-Channel10", lag_id: 10}
        - kind: DcimLAGInterface
          data: {device: waw1-leaf-02, name: "Port-Channel10", lag_id: 10}
