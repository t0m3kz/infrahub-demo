---
# The switch ports of each segment deployment of DC-KTW1: a port carries a segment as a member of the segment's
# deployment in its device's hosting deployment, one of the deployment's `capabilities` (the interface edge,
# schemas/extensions/service/segment.yml). An upsert of that list replaces it, so each deployment's whole list is here,
# once, after every port it names is loaded (90_bindings loads last). The ports are a person's: no source on the edge,
# so the segment reconcile never removes them. Server ports (a bond, an eno1) are the trunks of a virtual switch's
# uplinks (checks/virtual_switch.py VS3); a border leaf's Ethernet1/25 is the service port facing the firewall pair
# that terminates the segment.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSegmentDeployment
  data:
    - segment: c900-web-p
      deployment: DC-KTW1
      capabilities:
        - kind: DcimLAGInterface
          data: {device: ktw1-leaf-01, name: "Port-Channel10"}
        - kind: DcimLAGInterface
          data: {device: ktw1-leaf-02, name: "Port-Channel10"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-leaf-01, name: "Ethernet1/1"}
        - kind: DcimLAGInterface
          data: {device: ktw1-srv-01, name: "bond0"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-srv-02, name: "eno1"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-srv-03, name: "eno1"}
    - segment: c900-internal-fw-ktw1-p
      deployment: DC-KTW1
      capabilities:
        - kind: DcimLAGInterface
          data: {device: ktw1-leaf-01, name: "Port-Channel10"}
        - kind: DcimLAGInterface
          data: {device: ktw1-leaf-02, name: "Port-Channel10"}
        - kind: DcimLAGInterface
          data: {device: ktw1-srv-01, name: "bond0"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-srv-02, name: "eno1"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-srv-03, name: "eno1"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-leaf-01, name: "Ethernet1/5"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-leaf-01, name: "Ethernet1/6"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-bl-01, name: "Ethernet1/25"}
        - kind: DcimPhysicalInterface
          data: {device: ktw1-bl-02, name: "Ethernet1/25"}
