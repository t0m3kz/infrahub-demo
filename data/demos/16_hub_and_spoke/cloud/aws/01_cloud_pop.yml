---
# Shared SD-WAN PoP directly in the cloud — AWS eu-central-1 (Frankfurt),
# same real region used by data/demos/11_cloud/aws and
# data/demos/15_customer_deployments/c003/cloud/aws/eu-central-1. A hub
# region terminating SD-WAN for multiple customer offices/branches instead
# of hairpinning through the DC. The hub itself is modeled as a
# TopologyCustomerCloud footprint owned by the OPERATOR organization (below)
# with `namespace: INTERNET` set — TopologyConnectableLocation now lives on
# TopologyCustomer (see schemas/extensions/topology/topology_customer.yml),
# not on the bare TopologyCloudRegion container, since connecting two
# customer deployments always means an explicit circuit between their own
# footprints. The region also owns a CloudInternetGateway, giving
# offices/branches direct-to-internet egress from the hub instead of
# backhauling to a DC breakout.
#
# eu-west-1 (Dublin) is a second, plain (non-hub) region — no operator
# footprint, no CloudInternetGateway — giving this demo two real AWS regions
# to spread customers/AZs across, same as cloud/azure and cloud/gcp now do.
# Each region has 3 AZs, matching real AWS az-count in these regions.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationMetro
  data:
    - name: "Frankfurt"
      shortname: "fra"
      parent: "de"
    - name: "Dublin"
      shortname: "dub"
      parent: "ie"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCloud
  data:
    - name: AWS
      children:
        kind: TopologyCloudRegion
        data:
          - name: "eu-central-1"
            status: active
            location: "fra"
            children:
              kind: TopologyCloudZone
              data:
                - name: eu-central-1a
                - name: eu-central-1b
                - name: eu-central-1c
          - name: "eu-west-1"
            status: active
            location: "dub"
            children:
              kind: TopologyCloudZone
              data:
                - name: eu-west-1a
                - name: eu-west-1b
                - name: eu-west-1c

---
# The operator's own organization — needed as `owner` for the hub SD-WAN PoP
# footprint below. OrganizationProvider, not OrganizationCustomer: the
# operator DELIVERS the hub infrastructure to its customers, the same role
# Equinix/AWS/Azure play elsewhere in this repo — TopologyCustomer.owner
# accepts either (peer: OrganizationEntity, the generic both inherit from),
# since a footprint's owner can be a customer or a provider depending on who
# it belongs to. Declared here rather than in data/bootstrap/02_providers.yml
# to keep this demo self-contained (same pattern as its own LocationMetro
# entries).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationProvider
  data:
    - name: "Network Operator"
      org_id: "OPERATOR"

---
# Hub footprint: the operator's own SD-WAN PoP, not a customer's. Its
# `namespace: INTERNET` is what ExchangeGatewayGenerator's hub-detection
# looks for on the OTHER end of an office/cloud/colocation footprint's
# circuit (see generators/topology/exchange_gateway.py) — traffic stops
# here instead of reaching straight into SHARED-SERVICES.
#
# `owner` is set via `kind:`+`data:` (upserting the OrganizationProvider
# created above), not a bare HFID string — OrganizationEntity (the generic
# TopologyCustomer.owner peers) declares no human_friendly_id, so a bare
# string reference against it can't resolve server-side.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner:
        kind: OrganizationProvider
        data:
          name: "Network Operator"
          org_id: "OPERATOR"
      customer_name: "sdwan-hub"
      environment: "p"
      status: active
      parent: "eu-central-1"
      namespace: "INTERNET"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudAccount
  data:
    - name: "sdwan-hub-aws"
      account_id: "999900001111"
      provider: "P004"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVirtualNetwork
  data:
    - name: "sdwan-hub-vpc"
      account: "sdwan-hub-aws"
      region: "eu-central-1"
      is_shared: true
      dns_support: true

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudInternetGateway
  data:
    - name: "sdwan-hub-igw"
      virtual_network: "sdwan-hub-vpc"
      account: "sdwan-hub-aws"
      status: active
