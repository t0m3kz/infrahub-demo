---
# C007 (Orbisan Ltd.) — TopologyCustomerDC footprint on DC8, one of two
# customers on that site (see ./c008.yml). Lives in the "default" namespace
# alongside shared services and every other customer deployment in this
# demo — no exchange gateway needed to reach them.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner:
        kind: OrganizationCustomer
        data:
          name: "Orbisan Ltd."
          org_id: "C007"
      environment: "p"
      status: active
      parent: "DC8"
      member_of_groups:
        - customer_deployments
