---
# C004 (Peakora AG) — TopologyCustomerColocation footprint on EQUINIX/WAW.
# Lives in the "default" namespace alongside shared services — no exchange
# gateway needed to reach them, regardless of the WAW1<->DC7 circuit
# (07_interconnects/colo_dc7_link/) it has for other traffic.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerColocation
  data:
    - owner:
        kind: OrganizationCustomer
        data:
          name: "Peakora AG"
          org_id: "C004"
      environment: "p"
      status: active
      parent: "WAW"
      member_of_groups:
        - customer_deployments
