---
# C001 (Nordix Ltd.) — TopologyCustomerOffice footprint under a
# TopologyOfficeCustomer node (owner lives there, groups all of C001's
# footprints under the shared OFFICES site anchor — see
# ../01_office_anchor.yml), owning its own building (waw-hq) — the physical
# office isn't operator-shared infra like a DC fabric, so it lives on the
# customer footprint, not on TopologyOffice itself. Reaches the operator's
# hub (INTERNET namespace) via a routed exchange terminating there (see
# 07_interconnects/office_hub/) — the hub is a real VRF boundary, unlike
# shared services, which lives in the same "default" namespace as this
# footprint.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerOffice
  data:
    - environment: "p"
      status: active
      parent:
        kind: TopologyOfficeCustomer
        data:
          owner:
            kind: OrganizationCustomer
            data:
              name: "Nordix Ltd."
              org_id: "C001"
          parent: "OFFICES"
      locations:
        - "waw-hq-c16"
      member_of_groups:
        - customer_deployments
