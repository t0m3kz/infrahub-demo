---
# Every topology kind gets at least one customer footprint, so the
# hub-and-spoke model can be exercised end-to-end across all four deployment
# types (DC/Colocation/Cloud/Office) — not just Office, which was the
# original scope of this demo.
#
#   TopologyCustomerDC          C003 + C006 on DC7,  -> route-target leak to
#                                C007 + C008 on DC8      SHARED-SERVICES.
#                                                        Two customers per DC
#                                                        (inter-customer
#                                                        isolation on one
#                                                        site) and two sites
#                                                        (inter-site DCI —
#                                                        DC7 <-> DC8 is NOT
#                                                        wired directly in
#                                                        this demo; both only
#                                                        reach SHARED-
#                                                        SERVICES, so any
#                                                        DC7<->DC8 or
#                                                        C003<->C007 traffic
#                                                        must be explicitly
#                                                        wired — query the
#                                                        namespaces/exchanges
#                                                        below and confirm
#                                                        none of that exists
#                                                        by default).
#                                                        C003 additionally
#                                                        gets a dedicated
#                                                        FirewallContext (see
#                                                        06_firewall_
#                                                        contexts.yml).
#   TopologyCustomerColocation  C004 on EQUINIX/WAW -> routed exchange to
#                                                      SHARED-SERVICES over a
#                                                      real WAW1<->DC7 circuit
#                                                      (04_colo/equinix/
#                                                      02_c004_dc7_link.yml).
#                                                      Works the same way as
#                                                      Cloud/Office below,
#                                                      since Colocation now
#                                                      inherits Connectable-
#                                                      Location directly.
#   TopologyCustomerCloud       C005 on AWS eu-central-1 -> namespace-only
#                                C009 on Azure westeurope    (no circuit
#                                C010 on GCP europe-west4    wired, so each
#                                                             just sits at
#                                                             namespace
#                                                             provisioning).
#                                                             Distinct owners
#                                                             (not C003)
#                                                             because
#                                                             human_friendly_id
#                                                             [owner,
#                                                             environment] is
#                                                             shared across the
#                                                             WHOLE generic.
#                                                             The operator's
#                                                             own hub footprint
#                                                             (owner:
#                                                             OPERATOR, see
#                                                             02_cloud/aws/
#                                                             01_cloud_pop.yml)
#                                                             is a separate,
#                                                             fifth one.
#   TopologyCustomerOffice      C001 (waw-hq) + C002 (waw-br1), both under
#                                                        the shared OFFICES
#                                                        site anchor -> routed
#                                                        exchange via circuit,
#                                                        terminating at the
#                                                        hub's INTERNET
#                                                        namespace (see
#                                                        08_office/02_office_
#                                                        hub_circuits.yml).
#                                                        Each footprint owns
#                                                        its own building
#                                                        (locations) — the
#                                                        physical office isn't
#                                                        operator-shared infra
#                                                        like a DC fabric, so
#                                                        it lives on the
#                                                        customer footprint,
#                                                        not on TopologyOffice
#                                                        itself.
#
# `owner` is set via the object loader's `kind:`+`data:` form, not a bare
# HFID string: TopologyCustomer.owner peers the generic OrganizationEntity
# (Customer and Provider both inherit from it — see schemas/extensions/
# topology/topology_customer.yml), and OrganizationEntity itself declares no
# human_friendly_id, so a bare string/HFID reference against it can't
# resolve (server-side "Relationship has not been initialized yet" /
# NODE_NOT_FOUND — confirmed empirically). `kind:`+`data:` with the SAME
# data already in data/bootstrap/03_clients.yml upserts onto the existing
# customer rather than creating a duplicate.
#
# Created BEFORE 08_office/01_office_edges.yml / 08_office/02_office_hub_
# circuits.yml / 04_colo/equinix/02_c004_dc7_link.yml so those circuits can
# reference these footprints directly via `locations`. The created-trigger
# fires on each of these before its circuit exists (for DC it doesn't need
# one at all), so Colocation/Office will log a warning and skip on first
# run — re-run `infrahubctl generator add_exchange_gateway
# name=<computed-name>` once circuits are loaded.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner:
        kind: OrganizationCustomer
        data:
          name: "Vaultex Inc."
          org_id: "C003"
      environment: "p"
      status: active
      parent: "DC7"
    - owner:
        kind: OrganizationCustomer
        data:
          name: "Lumivex SA"
          org_id: "C006"
      environment: "p"
      status: active
      parent: "DC7"
    - owner:
        kind: OrganizationCustomer
        data:
          name: "Orbisan Ltd."
          org_id: "C007"
      environment: "p"
      status: active
      parent: "DC8"
    - owner:
        kind: OrganizationCustomer
        data:
          name: "Krafven GmbH"
          org_id: "C008"
      environment: "p"
      status: active
      parent: "DC8"

