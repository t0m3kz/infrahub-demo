---
# Minimal VLAN/VNI/L3-VNI pools for the fake DC7/DC8 fabrics used in this
# demo — same pattern as data/demos/15_customer_deployments/00_dc_fabric/
# 01_pools.yml. Two DCs (DC7 + DC8, see 03_dc/01_datacenter.yml) let this
# demo exercise inter-site traffic: two customer footprints per DC (see
# 05_customer_footprints.yml) exercise inter-customer isolation on top of
# that. Non-overlapping ranges per DC avoid any pool collision.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: "dc7-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 1999
    - name: "dc7-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 10001
      end_range: 19999
    - name: "dc7-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
      end_range: 54999
    - name: "dc8-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 2000
      end_range: 3999
    - name: "dc8-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 20001
      end_range: 29999
    - name: "dc8-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 55001
      end_range: 59999
