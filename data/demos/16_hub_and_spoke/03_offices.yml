---
# Physical Office location — same DC/Colo/Cloud pattern, no owner/customer
# fields on TopologyOffice itself (see schemas/extensions/topology/
# topology_pop_office.yml). TopologyCustomerOffice footprints (one per
# customer, parent: TopologyOffice) are created in 06_customer_footprints.yml,
# BEFORE the per-customer SD-WAN circuits (10_office_hub_circuits.yml) exist
# — so ExchangeGatewayGenerator's created-trigger logs a warning and skips on
# first run; re-run it manually once circuits are loaded.
# LocationCountry "pl" already exists via data/bootstrap/01_locations.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationMetro
  data:
    - name: "Warsaw"
      shortname: "waw"
      parent: "pl"
      children:
        kind: LocationBuilding
        data:
          - name: "Warsaw HQ"
            shortname: "waw-hq"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyOffice
  data:
    - name: "OFFICES"
      site_type: hq
      locations:
        - "waw-hq"
