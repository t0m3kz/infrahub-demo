---
# Office Wi-Fi APs, managed by the colo-hosted WLC (../../colo/equinix/
# 03_controllers.yml's WAW1-WLC1) — deliberately cross-site: the controller
# lives at the colocation PoP, the APs it manages live at the office. A
# controller's `managed_devices` is not tied to co-location (same point
# dc/03_dc9_aci.yml makes with one APIC across two pods). APs attach to the
# shared TopologyOffice site anchor ("OFFICES"), not a per-customer
# footprint — office Wi-Fi is shared infrastructure, unlike the dedicated
# per-tenant SD-WAN edges in 02_office_edges.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "OFFICES-AP1"
      object_template: C9130AXI-B_AP
      status: active
      deployment: "OFFICES"
    - name: "OFFICES-AP2"
      object_template: C9130AXI-B_AP
      status: active
      deployment: "OFFICES"
    - name: "OFFICES-AP3"
      object_template: C9130AXI-B_AP
      status: active
      deployment: "OFFICES"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedControllerPhysical
  data:
    - name: "WAW1-WLC1"
      object_template: C9800-40_WLC
      status: active
      deployment: "WAW1"
      managed_devices:
        - "OFFICES-AP1"
        - "OFFICES-AP2"
        - "OFFICES-AP3"
