---
# Shared infrastructure services (DNS/NTP/monitoring) — one LINUX-SVC virtual
# server per physical location (DC7, DC8, EQUINIX/WAW1), each with an
# interface in the SHARED-SERVICES namespace (created in data/bootstrap/
# 22_shared_services_namespace.yml). Without this, "SHARED-SERVICES" was
# just a VRF name with nothing actually living in it — every customer's
# route-leak/routed exchange had a destination namespace but no real
# endpoint on the other end.
#
# DC7/DC8 reach SHARED-SERVICES via each customer's own
# TopologyRouteLeakExchange (05_customer_footprints.yml + the generator run
# — see docs/exchange_gateway.md). C004 (Colocation, WAW1) now reaches it
# automatically too, via a real WAW1<->DC7 circuit (04_colo/equinix/
# 02_c004_dc7_link.yml) — TopologyCustomerColocation inherits
# TopologyConnectableLocation directly, so ExchangeGatewayGenerator's
# circuit path applies the same way it does for Cloud/Office, no manual
# wiring needed anymore.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: "DC7-SVC1"
      object_template: LINUX-SVC
      status: active
      deployment: DC7
    - name: "DC8-SVC1"
      object_template: LINUX-SVC
      status: active
      deployment: DC8
    - name: "WAW1-SVC1"
      object_template: LINUX-SVC
      status: active
      deployment: WAW1

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.90.0.0/24"
      description: "Shared services server addressing"
      status: active
      ip_namespace: "SHARED-SERVICES"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "eth0"
      device: "DC7-SVC1"
      status: active
      ip_address:
        data:
          address: "10.90.0.1/24"
          ip_namespace: "SHARED-SERVICES"
    - name: "eth0"
      device: "DC8-SVC1"
      status: active
      ip_address:
        data:
          address: "10.90.0.2/24"
          ip_namespace: "SHARED-SERVICES"
    - name: "eth0"
      device: "WAW1-SVC1"
      status: active
      ip_address:
        data:
          address: "10.90.0.3/24"
          ip_namespace: "SHARED-SERVICES"
