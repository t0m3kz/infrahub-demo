---
# Multi-tenant firewall slicing on the DC7-FW1 cluster (see schemas/extensions/
# capabilities/ha.yml's ManagedFirewallContext): one dedicated VDOM/vsys per
# high-risk tenant (here C003, fintech_strict) plus a shared low-risk context
# (tenant unset) for everyone else. A single-device HA domain is enough to
# demonstrate the context split — DC7-FW1 stands in for a real HA pair.
#
# FirewallContext.tenant points at a concrete TopologyCustomer node (not the
# bare CoreOrganization), so C003's TopologyCustomerDC footprint (see
# 06_customer_footprints.yml, loaded before this file) is referenced by hfid
# below — this also lets the ExchangeGatewayGenerator auto-wire C003's VRF
# namespace to SHARED-SERVICES via the usual created-trigger.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallHA
  data:
    - name: "DC7-FW1-ha"
      status: active
      mode: active-passive
      capabilities:
        - "DC7-FW1"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallContext
  data:
    - name: "DC7-FW1-C003-dedicated"
      context_id: "vdom-c003"
      cluster: "DC7-FW1-ha"
      tenant: ["C003", "p"]
    - name: "DC7-FW1-shared-lowrisk"
      context_id: "vdom-shared"
      cluster: "DC7-FW1-ha"
