---
# DC8-BL1 <-> DC8-FW1 cabling + BGP — mirrors 09_dc7_fabric_cabling.yml for
# the second site. DC7 and DC8 are NOT interconnected in this demo (no DCI
# circuit, no shared exchange) — both only reach SHARED-SERVICES
# independently, so inter-site traffic (DC7 <-> DC8) and inter-customer
# traffic across sites (e.g. C003 on DC7 <-> C007 on DC8) require an
# explicit exchange that does not exist here by default. That absence is
# the point: query TopologyRouteLeakExchange/TopologyRoutedExchange after
# loading this demo and confirm DC7's and DC8's namespaces never appear on
# the same exchange.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-DC8-BL1-FW1-1"
      type: smf
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "DC8-BL1"
            name: "Ethernet25/1"
        - kind: DcimPhysicalInterface
          data:
            device: "DC8-FW1"
            name: "eth1"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 65080
      description: "DC8 fabric AS"
    - asn: 65081
      description: "DC8-FW1 AS"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.80.0.0/30"
      description: "DC8-BL1 <-> DC8-FW1 point-to-point"
      status: active

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - name: "Ethernet25/1"
      device: "DC8-BL1"
      status: active
      ip_address:
        data:
          address: "10.80.0.1/30"
    - name: "eth1"
      device: "DC8-FW1"
      status: active
      ip_address:
        data:
          address: "10.80.0.2/30"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "DC8-BL1-bgp-fw"
      status: active
      local_as: "AS65080"
      router_id: ["10.80.0.1/30", "default"]
      capabilities:
        - "DC8-BL1"
    - name: "DC8-FW1-bgp-fabric"
      status: active
      local_as: "AS65081"
      router_id: ["10.80.0.2/30", "default"]
      capabilities:
        - "DC8-FW1"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "DC8-BL1-DC8-FW1-ebgp"
      session_type: EBGP
      bgp_processes:
        - "DC8-BL1-bgp-fw"
        - "DC8-FW1-bgp-fabric"
      interface_capabilities:
        - ["DC8-BL1", "Ethernet25/1"]
        - ["DC8-FW1", "eth1"]
