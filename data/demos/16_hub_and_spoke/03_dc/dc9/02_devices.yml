        - leafs
    - name: DC9-POD1-LEAF2
      object_template: N9K-C9336C-FX2_LEAF
      status: active
      deployment: "DC9-9-POD-1"
      member_of_groups:
        - leafs
    - name: DC9-POD2-LEAF1
      object_template: N9K-C9336C-FX2_LEAF
      status: active
      deployment: "DC9-9-POD-2"
      member_of_groups:
        - leafs
    - name: DC9-POD2-LEAF2
      object_template: N9K-C9336C-FX2_LEAF
      status: active
      deployment: "DC9-9-POD-2"
