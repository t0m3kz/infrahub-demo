  data:
    - name: DC9-SPINE1
      object_template: N9K-C9336C-FX2_SPINE
      status: active
      deployment: DC9
      member_of_groups:
        - spines
    - name: DC9-SPINE2
      object_template: N9K-C9336C-FX2_SPINE
      status: active
      deployment: DC9
