---
# DC9 — Cisco ACI fabric, demonstrating ManagedControllerPhysical (see
# schemas/extensions/capabilities/controller.yml). Two pods, two leaf
# switches each (real Nexus 9000 ACI-capable hardware, N9K-C9336C-FX2 —
# same device type/template already used by DC6's spine/leaf in
# data/demos/01_data_center/dc6), one shared spine pair, and a single APIC
# (ManagedControllerPhysical, controller_type: aci_apic) whose
# `managed_devices` covers every leaf/spine across both pods — the point of
# this generic is exactly this: one controller, many devices, regardless of
# pod/rack placement. No pool/VXLAN build-out here (unlike DC7/DC8): DC9's
# purpose is the controller pattern, not another customer-isolation
# fixture.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: "DC9"
      index: 9
      size: L
      management_mode: managed_by_controller
      children:
        kind: TopologyPod
        data:
          - index: 1
            layout: L_MIDDLE
            deployment_type: middle_rack
            status: active
          - index: 2
            layout: L_MIDDLE
            deployment_type: middle_rack
            status: active
