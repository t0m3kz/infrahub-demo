---
# DC8-BL1 <-> DC8-FW1 cabling — mirrors ../dc7/01_cable.yml for the second
# site. DC7 and DC8 are NOT interconnected in this demo (no DCI circuit, no
# shared exchange) — both only reach SHARED-SERVICES independently, so
# inter-site traffic (DC7 <-> DC8) and inter-customer traffic across sites
# (e.g. C003 on DC7 <-> C007 on DC8) require an explicit exchange that does
# not exist here by default. That absence is the point: query
# TopologyRouteLeakExchange/TopologyRoutedExchange after loading this demo
# and confirm DC7's and DC8's namespaces never appear on the same exchange.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-DC8-BL1-FW1-1"
      type: smf
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "DC8-BL1"
            name: "Ethernet25/1"
        - kind: DcimPhysicalInterface
          data:
            device: "DC8-FW1"
            name: "eth1"
