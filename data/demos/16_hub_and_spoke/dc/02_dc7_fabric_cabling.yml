---
# DC7-BL1 <-> DC7-FW1 cabling + BGP — the only link in this demo that's a
# real physical DcimCable (both devices sit in the same DC). The border-leaf
# already has a dedicated role:firewall interface range
# (Ethernet[25-28]/1, see data/bootstrap/10_physical_devices_templates_
# arista_eos.yaml); the firewall's eth1/eth2 are its uplinks.
# This gives C003's dedicated ManagedFirewallContext (07_firewall_contexts.yml)
# an actual routed path to verify, instead of a floating capabilities-only
# HA domain with no wire behind it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-DC7-BL1-FW1-1"
      type: smf
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "DC7-BL1"
            name: "Ethernet25/1"
        - kind: DcimPhysicalInterface
          data:
            device: "DC7-FW1"
            name: "eth1"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 65070
      description: "DC7 fabric AS"
    - asn: 65071
      description: "DC7-FW1 AS"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.70.0.0/30"
      description: "DC7-BL1 <-> DC7-FW1 point-to-point"
      status: active

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - name: "Ethernet25/1"
      device: "DC7-BL1"
      status: active
      ip_address:
        data:
          address: "10.70.0.1/30"
    - name: "eth1"
      device: "DC7-FW1"
      status: active
      ip_address:
        data:
          address: "10.70.0.2/30"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "DC7-BL1-bgp-fw"
      status: active
      local_as: "AS65070"
      router_id: ["10.70.0.1/30", "default"]
      capabilities:
        - "DC7-BL1"
    - name: "DC7-FW1-bgp-fabric"
      status: active
      local_as: "AS65071"
      router_id: ["10.70.0.2/30", "default"]
      capabilities:
        - "DC7-FW1"

# router_id uses ["address", "namespace_name"] — IpamIPAddress's HFID is
# [address__value, ip_namespace__name__value] — since these addresses were
# created above without an explicit ip_namespace, they land in "default".

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "DC7-BL1-DC7-FW1-ebgp"
      session_type: EBGP
      bgp_processes:
        - "DC7-BL1-bgp-fw"
        - "DC7-FW1-bgp-fabric"
      interface_capabilities:
        - ["DC7-BL1", "Ethernet25/1"]
        - ["DC7-FW1", "eth1"]
