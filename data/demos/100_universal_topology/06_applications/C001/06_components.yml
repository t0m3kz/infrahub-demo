---
# C001 (Nordix Ltd.) — Application components

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppComponent
  data:

    # ── trade-portal / production ─────────────────────────────────────────────

    - name: web-frontend
      component_type: frontend
      parent: c001-trade-portal-p
      instances:
        - C001-WEB-VM-01
        - C001-WEB-VM-02
      network_segment: c001-web-frontend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: api-gateway
      component_type: backend
      parent: c001-trade-portal-p
      instances:
        - C001-APP-VM-01
        - C001-APP-VM-02
      network_segment: c001-app-backend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: order-db
      component_type: database
      parent: c001-trade-portal-p
      instances:
        - C001-DB-VM-01
        - C001-DB-VM-02
      network_segment: c001-database-p
      member_of_groups:
        - app_components

    - name: session-cache
      component_type: cache
      parent: c001-trade-portal-p
      instances:
        - C001-CACHE-VM-01
      network_segment: c001-cache-p
      member_of_groups:
        - app_components

    # ── trade-portal / nonprod ────────────────────────────────────────────────

    - name: web-frontend
      component_type: frontend
      parent: c001-trade-portal-n
      instances:
        - C001-WEB-NP-VM-01
      network_segment: c001-web-frontend-n
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: api-gateway
      component_type: backend
      parent: c001-trade-portal-n
      instances:
        - C001-APP-NP-VM-01
      network_segment: c001-app-backend-n
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: order-db
      component_type: database
      parent: c001-trade-portal-n
      instances:
        - C001-DB-NP-VM-01
      network_segment: c001-database-n
      member_of_groups:
        - app_components

    # ── auth-platform / production ────────────────────────────────────────────

    - name: auth-api
      component_type: backend
      parent: c001-auth-platform-p
      instances:
        - C001-AUTH-VM-01
        - C001-AUTH-VM-02
      network_segment: c001-app-backend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: identity-db
      component_type: database
      parent: c001-auth-platform-p
      instances:
        - C001-DB-VM-01
      network_segment: c001-database-p
      member_of_groups:
        - app_components

    # ── risk-engine / production ──────────────────────────────────────────────

    - name: analytics-worker
      component_type: worker
      parent: c001-risk-engine-p
      instances:
        - C001-RISK-VM-01
        - C001-RISK-VM-02
      network_segment: c001-app-backend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: risk-db
      component_type: database
      parent: c001-risk-engine-p
      instances:
        - C001-DB-VM-02
      network_segment: c001-database-p
      member_of_groups:
        - app_components
