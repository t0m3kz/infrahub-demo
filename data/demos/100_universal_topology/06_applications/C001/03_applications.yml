---
# C001 (Nordix Ltd.) — Applications
#
# trade-portal:   customer-facing trading platform (production + nonprod)
# auth-platform:  shared SSO / identity service (production only)
# risk-engine:    real-time trade risk analytics (production only)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: trade-portal
      environment: p
      criticality: critical
      security_profile: internet_exposed
      fqdn: trade-portal.c001.demo.local
      ingress_mode: frontend
      parent: C001
      member_of_groups:
        - app_applications

    - label: trade-portal
      environment: n
      criticality: medium
      security_profile: internet_exposed
      fqdn: trade-portal-np.c001.demo.local
      ingress_mode: frontend
      parent: C001
      member_of_groups:
        - app_applications

    - label: auth-platform
      environment: p
      criticality: critical
      security_profile: internet_exposed
      fqdn: auth-platform.c001.demo.local
      ingress_mode: frontend
      parent: C001
      member_of_groups:
        - app_applications

    - label: risk-engine
      environment: p
      criticality: high
      security_profile: fintech_strict
      fqdn: risk-engine.c001.internal.local
      ingress_mode: dns
      parent: C001
      member_of_groups:
        - app_applications

    - label: nlb-app
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: nlb-app.c001.demo.local
      ingress_mode: frontend
      parent: C001
      member_of_groups:
        - app_applications
