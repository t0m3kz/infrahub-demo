---
# nlb-app application anchor (kept with listener artifacts)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: nlb-app
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: nlb-app.c001.demo.local
      ingress_mode: frontend
      parent: C001
      member_of_groups:
        - app_applications

---
# Health check: TCP, 2 successes to go UP, 3 failures to go DOWN, 5s timeout
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LoadbalancerHealthCheck
  data:
    - check: tcp
      rise: 2
      fall: 3
      timeout: 5000

---
# VIP listeners on C001-NLB-APP-EU-CENTRAL-1
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LoadbalancerVIP
  data:
    - hostname: cnrd-nlb-app.example.com
      protocol: tcp
      port: 443
      status: active
      description: "TCP:443 listener — TLS passthrough to application tier"
      load_balancer: C001-NLB-APP-EU-CENTRAL-1
      load_balancing_algorithm: round_robin
      session_persistence: none
      health_checks:
        - - tcp
          - "2"
          - "3"
          - "5000"

    - hostname: cnrd-nlb-app.example.com
      protocol: tcp
      port: 80
      status: active
      description: "TCP:80 listener — plain HTTP to application tier"
      load_balancer: C001-NLB-APP-EU-CENTRAL-1
      load_balancing_algorithm: round_robin
      session_persistence: none
      health_checks:
        - - tcp
          - "2"
          - "3"
          - "5000"
