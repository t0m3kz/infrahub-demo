---
# C001 (Nordix Ltd.) — Nautobot IPAM/DCIM platform
#
# Deployment: AKS self-managed on C001-AKS-WESTEUROPE
# Cluster:    C001-AKS-WESTEUROPE  (Azure, westeurope)
# Node pool:  C001-AKS-NODEPOOL-WESTEUROPE (Standard_D4s_v3, autoscaling 2-8)
# Network:    c001-aks-zone1-p (172.17.10.0/24) — web + worker
#             c001-aks-zone2-p (172.17.20.0/24) — database + cache (data tier)
# Ingress:    Azure Application Gateway (AGIC) — no LB node in inventory
#
# All four components share the same node pool — pods are scheduled by
# Kubernetes based on resource requests / node selectors. The network segment
# per component reflects the VNet subnet the pod CIDR is drawn from.
#
# Components:
#   web      — Django/Gunicorn  (HTTPS 8080 → AGIC → 443 external)
#   worker   — Celery workers   (outbound only — no inbound port)
#   database — CloudNativePG    (TCP 5432, data subnet)
#   cache    — Redis StatefulSet (TCP 6379, data subnet)

# ── Application ───────────────────────────────────────────────────────────────
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: nautobot
      environment: p
      criticality: critical
      parent: C001
      member_of_groups:
        - app_applications

# ── AKS worker nodes (CloudInstance) ─────────────────────────────────────────
# Represent the actual AKS worker nodes provisioned from the node pool.
# Named after the pool with an index — Kubernetes schedules pods across them.
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudInstance
  data:
    - name: C001-AKS-NODE-WE-01
      cloud_id: aks-we-node-01
      instance_type: Standard_D4s_v3
      status: active
      account: CNRD-AZURE
      availability_zone: ["westeurope", "westeurope-1"]
      network_segment: c001-aks-zone1-p
      node_pool:
        - C001-AKS-WESTEUROPE
        - C001-AKS-NODEPOOL-WESTEUROPE

    - name: C001-AKS-NODE-WE-02
      cloud_id: aks-we-node-02
      instance_type: Standard_D4s_v3
      status: active
      account: CNRD-AZURE
      availability_zone: ["westeurope", "westeurope-2"]
      network_segment: c001-aks-zone2-p
      node_pool:
        - C001-AKS-WESTEUROPE
        - C001-AKS-NODEPOOL-WESTEUROPE

    - name: C001-AKS-NODE-WE-03
      cloud_id: aks-we-node-03
      instance_type: Standard_D4s_v3
      status: active
      account: CNRD-AZURE
      availability_zone: ["westeurope", "westeurope-1"]
      network_segment: c001-aks-zone1-p
      node_pool:
        - C001-AKS-WESTEUROPE
        - C001-AKS-NODEPOOL-WESTEUROPE

    - name: C001-AKS-NODE-WE-04
      cloud_id: aks-we-node-04
      instance_type: Standard_D4s_v3
      status: active
      account: CNRD-AZURE
      availability_zone: ["westeurope", "westeurope-2"]
      network_segment: c001-aks-zone2-p
      node_pool:
        - C001-AKS-WESTEUROPE
        - C001-AKS-NODEPOOL-WESTEUROPE

# ── Components ────────────────────────────────────────────────────────────────
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppComponent
  data:
    - name: web
      component_type: frontend
      parent: c001-nautobot-p
      network_segment: c001-aks-zone1-p
      instances:
        - C001-AKS-NODE-WE-01
        - C001-AKS-NODE-WE-03
      member_of_groups:
        - app_components

    - name: worker
      component_type: worker
      parent: c001-nautobot-p
      network_segment: c001-aks-zone1-p
      instances:
        - C001-AKS-NODE-WE-01
        - C001-AKS-NODE-WE-03
      member_of_groups:
        - app_components

    - name: database
      component_type: database
      parent: c001-nautobot-p
      network_segment: c001-aks-zone2-p
      instances:
        - C001-AKS-NODE-WE-02
        - C001-AKS-NODE-WE-04
      member_of_groups:
        - app_components

    - name: cache
      component_type: cache
      parent: c001-nautobot-p
      network_segment: c001-aks-zone2-p
      instances:
        - C001-AKS-NODE-WE-02
        - C001-AKS-NODE-WE-04
      member_of_groups:
        - app_components

# ── Dependencies ─────────────────────────────────────────────────────────────
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c001-nautobot-p-web--c001-nautobot-p-database
      source: c001-nautobot-p-web
      target: c001-nautobot-p-database
      protocol: tcp
      port_start: 5432
      description: "Web → PostgreSQL (ORM queries)"

    - name: c001-nautobot-p-web--c001-nautobot-p-cache
      source: c001-nautobot-p-web
      target: c001-nautobot-p-cache
      protocol: tcp
      port_start: 6379
      description: "Web → Redis (session + caching)"

    - name: c001-nautobot-p-worker--c001-nautobot-p-database
      source: c001-nautobot-p-worker
      target: c001-nautobot-p-database
      protocol: tcp
      port_start: 5432
      description: "Worker → PostgreSQL (job results)"

    - name: c001-nautobot-p-worker--c001-nautobot-p-cache
      source: c001-nautobot-p-worker
      target: c001-nautobot-p-cache
      protocol: tcp
      port_start: 6379
      description: "Worker → Redis (task queue)"

# ── Wire service ports onto components ───────────────────────────────────────
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppComponent
  data:
    - name: web
      component_type: frontend
      parent: c001-nautobot-p
      service_ports:
        - "8080/tcp"

    - name: database
      component_type: database
      parent: c001-nautobot-p
      service_ports:
        - "5432/tcp"

    - name: cache
      component_type: cache
      parent: c001-nautobot-p
      service_ports:
        - "6379/tcp"
