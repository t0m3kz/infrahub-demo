---
# C001 (Nordix Ltd.) — auth-platform production (fully nested)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: auth-platform
      environment: p
      criticality: critical
      security_profile: internet_exposed
      fqdn: auth-platform.c001.demo.local
      ingress_mode: frontend
      parent: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: auth-api
            component_type: backend
            network_segment: c001-app-backend-p
            proxy_service: DC3-PRX-HA
            instances:
              - C001-AUTH-VM-01
              - C001-AUTH-VM-02
            member_of_groups:
              - app_components

          - name: identity-db
            component_type: database
            network_segment: c001-database-p
            instances:
              - C001-DB-VM-01
            member_of_groups:
              - app_components
