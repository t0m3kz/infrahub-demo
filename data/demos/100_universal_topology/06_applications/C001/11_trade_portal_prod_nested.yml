---
# C001 (Nordix Ltd.) — trade-portal production (fully nested)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: trade-portal
      environment: p
      criticality: critical
      security_profile: internet_exposed
      fqdn: trade-portal.c001.demo.local
      ingress_mode: frontend
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            component_type: frontend
            network_segment: c001-web-frontend-p
            proxy_service: DC3-PRX-HA
            instances:
              - C001-WEB-VM-01
              - C001-WEB-VM-02
            member_of_groups:
              - app_components

          - name: api-gateway
            component_type: backend
            network_segment: c001-app-backend-p
            proxy_service: DC3-PRX-HA
            instances:
              - C001-APP-VM-01
              - C001-APP-VM-02
            member_of_groups:
              - app_components

          - name: order-db
            component_type: database
            network_segment: c001-database-p
            instances:
              - C001-DB-VM-01
              - C001-DB-VM-02
            member_of_groups:
              - app_components

          - name: session-cache
            component_type: cache
            network_segment: c001-cache-p
            instances:
              - C001-CACHE-VM-01
            member_of_groups:
              - app_components
