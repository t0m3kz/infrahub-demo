---
# C003 (Vaultex Inc.) — Applications
#
# vault-core:         secret management and key signing service (production only)
# compliance-portal:  audit dashboard and policy reporting (production only)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: vault-core
      environment: p
      criticality: critical
      security_profile: fintech_strict
      fqdn: vault-core.c003.internal.local
      ingress_mode: dns
      parent: C003
      member_of_groups:
        - app_applications

    - label: compliance-portal
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: compliance-portal.c003.demo.local
      ingress_mode: frontend
      parent: C003
      member_of_groups:
        - app_applications
