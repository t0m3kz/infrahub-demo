---
# C002 (SwiftGo GmbH) — Application components

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppComponent
  data:

    # ── shipment-tracker / production ─────────────────────────────────────────

    - name: web-frontend
      component_type: frontend
      parent: c002-shipment-tracker-p
      instances:
        - C002-WEB-VM-01
        - C002-WEB-VM-02
      network_segment: c002-web-frontend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: tracking-api
      component_type: backend
      parent: c002-shipment-tracker-p
      instances:
        - C002-APP-VM-01
        - C002-APP-VM-02
      network_segment: c002-app-backend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: shipment-db
      component_type: database
      parent: c002-shipment-tracker-p
      instances:
        - C002-DB-VM-01
      network_segment: c002-database-p
      member_of_groups:
        - app_components

    # ── shipment-tracker / nonprod ────────────────────────────────────────────

    - name: web-frontend
      component_type: frontend
      parent: c002-shipment-tracker-n
      instances:
        - C002-WEB-NP-VM-01
      network_segment: c002-web-frontend-n
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: tracking-api
      component_type: backend
      parent: c002-shipment-tracker-n
      instances:
        - C002-APP-NP-VM-01
      network_segment: c002-app-backend-n
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    # ── fleet-manager / production ────────────────────────────────────────────

    - name: dispatch-portal
      component_type: frontend
      parent: c002-fleet-manager-p
      instances:
        - C002-FLEET-WEB-VM-01
      network_segment: c002-web-frontend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: telematics-api
      component_type: backend
      parent: c002-fleet-manager-p
      instances:
        - C002-FLEET-APP-VM-01
      network_segment: c002-app-backend-p
      proxy_service: DC3-PRX-HA
      member_of_groups:
        - app_components

    - name: fleet-db
      component_type: database
      parent: c002-fleet-manager-p
      instances:
        - C002-FLEET-DB-VM-01
      network_segment: c002-database-p
      member_of_groups:
        - app_components
