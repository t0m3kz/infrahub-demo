---
# C002 (SwiftGo GmbH) — Global service port definitions
# AppServicePort nodes are globally shared — no component field.
# Component linkage is handled by the AppServicePortGenerator.
# Ports 80, 443, 5432, 8443 already defined in C001; listed here
# only to ensure they exist if C001 data is not loaded first.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppServicePort
  data:
    - port: 80
      protocol: tcp

    - port: 443
      protocol: tcp

    - port: 5432
      protocol: tcp

    - port: 8443
      protocol: tcp
