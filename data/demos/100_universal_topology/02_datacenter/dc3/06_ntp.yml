---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedNTP
  data:
    - name: DC3-NTP
      status: active
      capabilities:
        - DC3-BL1
        - DC3-BL2
        - DC3-POD1-SP1
        - DC3-POD1-SP2
        - DC3-POD1-L1
        - DC3-POD1-L2
        - DC3-POD1-L3
        - DC3-POD1-L4
        - DC3-POD2-SP1
        - DC3-POD2-SP2
        - DC3-POD2-L1
        - DC3-POD2-L2
        - DC3-POD2-L3
        - DC3-POD2-L4
      servers:
        kind: ManagedNTPServer
        data:
          - name: primary
            address:
              data:
                address: "162.159.200.1/32"
            prefer: true
            version: 4
          - name: secondary
            address:
              data:
                address: "162.159.200.123/32"
            prefer: false
            version: 4
