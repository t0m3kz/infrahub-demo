---
# F5 BIG-IP inline LB pair (DSC sync-failover group)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedLoadbalancerHA
  data:
    - name: DC3-LB-HA
      group_id: 2
      mode: active-passive
      priority: 100
      preempt: false
      member_of_groups:
        - ha_domains
      capabilities:
        - DC3-LB-01
        - DC3-LB-02
