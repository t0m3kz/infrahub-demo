---
# POD3 (VMware vSphere) and POD4 (Nutanix) MLAG domains
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedMLAG
  data:
    - name: DC3-POD3-L1-L2-MLAG
      status: active
      domain_id: 3
      reload_delay: 300
      reload_delay_non_mlag: 330
      member_of_groups:
        - mlag_domains
      capabilities:
        - DC3-POD3-L1
        - DC3-POD3-L2

    - name: DC3-POD4-L1-L2-MLAG
      status: active
      domain_id: 4
      reload_delay: 300
      reload_delay_non_mlag: 330
      member_of_groups:
        - mlag_domains
      capabilities:
        - DC3-POD4-L1
        - DC3-POD4-L2
