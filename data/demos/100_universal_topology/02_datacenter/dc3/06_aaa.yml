---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedAAA
  data:
    - name: DC3-AAA
      status: active
      capabilities:
        - DC3-BL1
        - DC3-BL2
        - DC3-POD1-SP1
        - DC3-POD1-SP2
        - DC3-POD1-L1
        - DC3-POD1-L2
        - DC3-POD1-L3
        - DC3-POD1-L4
        - DC3-POD2-SP1
        - DC3-POD2-SP2
        - DC3-POD2-L1
        - DC3-POD2-L2
        - DC3-POD2-L3
        - DC3-POD2-L4
      servers:
        kind: ManagedAAAServer
        data:
          - name: primary
            address:
              data:
                address: "10.0.0.200/32"
            protocol: tacacs
            port: 49
            timeout: 5
          - name: secondary
            address:
              data:
                address: "10.0.0.201/32"
            protocol: tacacs
            port: 49
            timeout: 5
