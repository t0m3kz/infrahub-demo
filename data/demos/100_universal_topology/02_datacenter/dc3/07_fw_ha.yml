---
# CP-26000 firewall pair (active-passive, Check Point ClusterXL)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallHA
  data:
    - name: DC3-FW-HA
      group_id: 1
      mode: active-passive
      priority: 100
      preempt: false
      ha_timer: standard
      member_of_groups:
        - ha_domains
      capabilities:
        - DC3-FW-01
        - DC3-FW-02
