---
# ── Cables ────────────────────────────────────────────────────────────────────
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    # ── FW-01 inside/outside ──────────────────────────────────────────────────
    - name: CBL-DC3-FW01-BL1-INSIDE
      type: smf
      deployment: DC3
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: DC3-FW-01
            name: eth1
        - kind: DcimPhysicalInterface
          data:
            device: DC3-BL1
            name: Ethernet0

    - name: CBL-DC3-FW01-LB01-INLINE
      type: smf
      deployment: DC3
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: DC3-FW-01
            name: eth2
        - kind: DcimPhysicalInterface
          data:
            device: DC3-LB-01
            name: "1.1"

    # ── FW-02 inside/outside + LB-02 inline ──────────────────────────────────
    - name: CBL-DC3-FW02-BL2-INSIDE
      type: smf
      deployment: DC3
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: DC3-FW-02
            name: eth1
        - kind: DcimPhysicalInterface
          data:
            device: DC3-BL2
            name: Ethernet0

    - name: CBL-DC3-FW02-LB02-INLINE
      type: smf
      deployment: DC3
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: DC3-FW-02
            name: eth2
        - kind: DcimPhysicalInterface
          data:
            device: DC3-LB-02
            name: "1.1"

    # ── HA sync — back-to-back ────────────────────────────────────────────────
    - name: CBL-DC3-FW01-FW02-HA-SYNC
      type: smf
      deployment: DC3
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: DC3-FW-01
            name: sync
        - kind: DcimPhysicalInterface
          data:
            device: DC3-FW-02
            name: sync
