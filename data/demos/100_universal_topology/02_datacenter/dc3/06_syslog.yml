---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedSyslog
  data:
    - name: DC3-Syslog
      status: active
      capabilities:
        - DC3-BL1
        - DC3-BL2
        - DC3-POD1-SP1
        - DC3-POD1-SP2
        - DC3-POD1-L1
        - DC3-POD1-L2
        - DC3-POD1-L3
        - DC3-POD1-L4
        - DC3-POD2-SP1
        - DC3-POD2-SP2
        - DC3-POD2-L1
        - DC3-POD2-L2
        - DC3-POD2-L3
        - DC3-POD2-L4
      servers:
        kind: ManagedSyslogServer
        data:
          - name: server-1
            address:
              data:
                address: "10.0.0.100/32"
            port: 514
            severity: informational
