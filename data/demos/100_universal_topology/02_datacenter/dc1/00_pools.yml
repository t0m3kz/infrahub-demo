---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    # ── DC1 ──────────────────────────────────────────────────────────────────
    - name: DC1-VLAN-POOL
      description: Tenant VLAN ID pool for DC1 (allocated per segment by add_segment)
      node: ManagedSegmentDeployment
      node_attribute: vlan_id
      start_range: 1000
      end_range: 3999

    - name: DC1-VNI-POOL
      description: L2 VNI pool for DC1 VXLAN segments
      node: ManagedSegmentDeployment
      node_attribute: vni
      start_range: 10001
      end_range: 39999
