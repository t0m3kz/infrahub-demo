---
# DC1 Security Intent demo (IP-first model, label mode examples)
# These intent rules are materialized by add_security_intent_rule generator.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityIntentRule
  data:
    - name: dc1-c001-intent-web-to-app-https
      match_mode: label
      priority: 110
      action: permit
      protocol: tcp
      port_start: 443
      log: true
      enabled: true
      description: "Intent: C001 web-tier to app-tier over HTTPS"
      policy: DC1-C001-EAST-WEST-POLICY
      source_zone: DC1-C001-WEB-ZONE
      destination_zone: DC1-C001-APP-ZONE
      source_tag: web-tier
      destination_tag: app-tier
      member_of_groups:
        - security_intent_rules

    - name: dc1-c001-intent-app-to-db-postgres
      match_mode: label
      priority: 120
      action: permit
      protocol: tcp
      port_start: 5432
      log: true
      enabled: true
      description: "Intent: C001 app-tier to database over PostgreSQL"
      policy: DC1-C001-EAST-WEST-POLICY
      source_zone: DC1-C001-APP-ZONE
      destination_zone: DC1-C001-DB-ZONE
      source_tag: app-tier
      destination_tag: database
      member_of_groups:
        - security_intent_rules

    - name: dc1-c002-intent-web-to-app-https
      match_mode: label
      priority: 110
      action: permit
      protocol: tcp
      port_start: 443
      log: true
      enabled: true
      description: "Intent: C002 web-tier to app-tier over HTTPS"
      policy: DC1-C002-EAST-WEST-POLICY
      source_zone: DC1-C002-WEB-ZONE
      destination_zone: DC1-C002-APP-ZONE
      source_tag: web-tier
      destination_tag: app-tier
      member_of_groups:
        - security_intent_rules
