---
# DC1 MLAG domains — leaf pairs providing redundant server access
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedMLAG
  data:
    - name: DC1-POD1-L1-L2-MLAG
      status: active
      domain_id: 1
      reload_delay: 300
      reload_delay_non_mlag: 330
      capabilities:
        - DC1-POD1-L1
        - DC1-POD1-L2

    - name: DC1-POD2-L1-L2-MLAG
      status: active
      domain_id: 2
      reload_delay: 300
      reload_delay_non_mlag: 330
      capabilities:
        - DC1-POD2-L1
        - DC1-POD2-L2

---
# DC1 LAG interfaces — leaf side (MLAG port-channels toward servers)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimLAGInterface
  data:
    # POD1-L1: LAG toward SRV-01 (mlag-id 1) and SRV-02 (mlag-id 2)
    - name: Port-Channel1
      device: DC1-POD1-L1
      status: active
      role: lag
      lag_id: 1
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD1-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD1-L1
            name: Ethernet1/1

    - name: Port-Channel2
      device: DC1-POD1-L1
      status: active
      role: lag
      lag_id: 2
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD1-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD1-L1
            name: Ethernet2/1

    - name: Port-Channel3
      device: DC1-POD1-L1
      status: active
      role: lag
      lag_id: 3
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD1-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD1-L1
            name: Ethernet3/1

    # POD1-L2: matching MLAG port-channels (same mlag-ids as L1)
    - name: Port-Channel1
      device: DC1-POD1-L2
      status: active
      role: lag
      lag_id: 1
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD1-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD1-L2
            name: Ethernet1/1

    - name: Port-Channel2
      device: DC1-POD1-L2
      status: active
      role: lag
      lag_id: 2
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD1-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD1-L2
            name: Ethernet2/1

    - name: Port-Channel3
      device: DC1-POD1-L2
      status: active
      role: lag
      lag_id: 3
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD1-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD1-L2
            name: Ethernet3/1

    # POD2-L1: LAG toward SRV-01 (mlag-id 1) and SRV-02 (mlag-id 2)
    - name: Port-Channel1
      device: DC1-POD2-L1
      status: active
      role: lag
      lag_id: 1
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD2-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD2-L1
            name: Ethernet1/1

    - name: Port-Channel2
      device: DC1-POD2-L1
      status: active
      role: lag
      lag_id: 2
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD2-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD2-L1
            name: Ethernet2/1

    # POD2-L2: matching MLAG port-channels
    - name: Port-Channel1
      device: DC1-POD2-L2
      status: active
      role: lag
      lag_id: 1
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD2-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD2-L2
            name: Ethernet1/1

    - name: Port-Channel2
      device: DC1-POD2-L2
      status: active
      role: lag
      lag_id: 2
      lacp_mode: active
      mtu: 9000
      minimum_links: 1
      mlag_domain: DC1-POD2-L1-L2-MLAG
      member_interfaces:
        - kind: DcimPhysicalInterface
          data:
            device: DC1-POD2-L2
            name: Ethernet2/1

