---
# ── HA domain ─────────────────────────────────────────────────────────────────
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedFirewallHA
  data:
    - name: DC2-FW-HA
      group_id: 1
      mode: active-passive
      priority: 100
      preempt: false
      ha_timer: aggressive
      member_of_groups:
        - ha_domains
      capabilities:
        - DC2-FW-01
        - DC2-FW-02
