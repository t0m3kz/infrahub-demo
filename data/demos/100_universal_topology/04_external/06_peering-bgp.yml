---
# External BGP peering — DE-CIX, BT, ACME, GLOBEX
#
# Each partner already has a device + circuit built in
# data/demos/100_universal_topology/05_interconnects/equinix-internet/ and
# equinix-partners/ — this file only adds what was missing to actually
# render a BGP session: a router-id loopback + ManagedBGP process on each
# EXT-* device, IP addresses on the circuit-facing interfaces, and the
# ManagedBGPPeering itself (the same pattern already used for DCI peerings
# in 05_interconnects/datacenter-equinix/04_dci_bgp.yml).
#
# ManagedExternalFabricPeering/ManagedExternalPeer (previously used here)
# had no relationship to a local interface/device at all — there was no way
# to derive a local port + IP for the session. ManagedBGPPeering already
# supports "internal device-to-device or external to a provider" natively
# (see schemas/extensions/capabilities/bgp.yml) and every local edge device
# already has its own ManagedBGP process (FR2/FR6/PA4-EDGE-01-DCI-BGP) that
# this reuses — one process, multiple peerings.
#
# Local device AS is always 65000 (company WAN edge, see
# 05_interconnects/datacenter-equinix/04_dci_bgp.yml). Remote ASNs:
#   DE-CIX  AS6695   (DE-CIX Management GmbH route server)
#   BT      AS5400   (British Telecommunications PLC)
#   ACME    AS64520  (private ASN, fictional partner)
#   GLOBEX  AS64521  (private ASN, fictional partner)

# ── Router-ID loopbacks on partner devices ────────────────────────────────────
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: Loopback0
      description: "Router-ID loopback — EXT-INET-DE-CIX-FR-01"
      role: loopback
      status: active
      device: EXT-INET-DE-CIX-FR-01
      ip_address:
        data:
          address: "10.255.0.20/32"
          ip_namespace: default

    - name: Loopback0
      description: "Router-ID loopback — EXT-INET-BT-01"
      role: loopback
      status: active
      device: EXT-INET-BT-01
      ip_address:
        data:
          address: "10.255.0.21/32"
          ip_namespace: default

    - name: Loopback0
      description: "Router-ID loopback — EXT-PARTNER-ACME-01"
      role: loopback
      status: active
      device: EXT-PARTNER-ACME-01
      ip_address:
        data:
          address: "10.255.0.22/32"
          ip_namespace: default

    - name: Loopback0
      description: "Router-ID loopback — EXT-PARTNER-GLOBEX-01"
      role: loopback
      status: active
      device: EXT-PARTNER-GLOBEX-01
      ip_address:
        data:
          address: "10.255.0.23/32"
          ip_namespace: default

---
# ── IP addressing on the circuit-facing interfaces (both sides) ──────────────
# DE-CIX and GLOBEX hand off over a virtual (fabric/MPLS-VPN) circuit — the
# VTI sub-interfaces on both sides get the point-to-point IPs. BT and ACME
# hand off over a dedicated physical circuit — the physical ports themselves
# get the IPs (no VTI needed).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "10.255.0.24/31"
      description: "FR2-EDGE-01 side — DE-CIX fabric handoff"
      ip_namespace: default
    - address: "10.255.0.25/31"
      description: "EXT-INET-DE-CIX-FR-01 side — DE-CIX fabric handoff"
      ip_namespace: default
    - address: "10.255.0.26/31"
      description: "FR6-EDGE-01 side — BT DIA handoff"
      ip_namespace: default
    - address: "10.255.0.27/31"
      description: "EXT-INET-BT-01 side — BT DIA handoff"
      ip_namespace: default
    - address: "10.255.0.28/31"
      description: "PA4-EDGE-01 side — ACME MPLS handoff"
      ip_namespace: default
    - address: "10.255.0.29/31"
      description: "EXT-PARTNER-ACME-01 side — ACME MPLS handoff"
      ip_namespace: default
    - address: "10.255.0.30/31"
      description: "AM1-EDGE-01 side — GLOBEX IP-VPN handoff"
      ip_namespace: default
    - address: "10.255.0.31/31"
      description: "EXT-PARTNER-GLOBEX-01 side — GLOBEX IP-VPN handoff"
      ip_namespace: default

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - device: FR2-EDGE-01
      name: VTI-FR2-DE-CIX
      ip_address:
        data:
          address: "10.255.0.24/31"
          ip_namespace: default
    - device: EXT-INET-DE-CIX-FR-01
      name: VTI-DE-CIX-FR2
      ip_address:
        data:
          address: "10.255.0.25/31"
          ip_namespace: default
    - device: AM1-EDGE-01
      name: VTI-AM1-GLOBEX
      ip_address:
        data:
          address: "10.255.0.30/31"
          ip_namespace: default
    - device: EXT-PARTNER-GLOBEX-01
      name: VTI-GLOBEX-AM1
      ip_address:
        data:
          address: "10.255.0.31/31"
          ip_namespace: default

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - device: FR6-EDGE-01
      name: Ethernet1/1
      ip_address:
        data:
          address: "10.255.0.26/31"
          ip_namespace: default
    - device: EXT-INET-BT-01
      name: Ethernet1/1
      ip_address:
        data:
          address: "10.255.0.27/31"
          ip_namespace: default
    - device: PA4-EDGE-01
      name: Ethernet1/1
      ip_address:
        data:
          address: "10.255.0.28/31"
          ip_namespace: default
    - device: EXT-PARTNER-ACME-01
      name: Ethernet1/1
      ip_address:
        data:
          address: "10.255.0.29/31"
          ip_namespace: default

---
# ── BGP processes on partner devices ──────────────────────────────────────────
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: EXT-INET-DE-CIX-FR-01-BGP
      status: active
      description: "DE-CIX route server BGP process — EXT-INET-DE-CIX-FR-01 (AS6695)"
      multipath: true
      capabilities:
        - EXT-INET-DE-CIX-FR-01
      router_id:
        - "10.255.0.20/32"
        - default
      local_as: "AS6695"

    - name: EXT-INET-BT-01-BGP
      status: active
      description: "BT internet transit BGP process — EXT-INET-BT-01 (AS5400)"
      multipath: true
      capabilities:
        - EXT-INET-BT-01
      router_id:
        - "10.255.0.21/32"
        - default
      local_as: "AS5400"

    - name: EXT-PARTNER-ACME-01-BGP
      status: active
      description: "ACME partner MPLS BGP process — EXT-PARTNER-ACME-01 (AS64520)"
      multipath: false
      capabilities:
        - EXT-PARTNER-ACME-01
      router_id:
        - "10.255.0.22/32"
        - default
      local_as: "AS64520"

    - name: EXT-PARTNER-GLOBEX-01-BGP
      status: active
      description: "GLOBEX partner IP-VPN BGP process — EXT-PARTNER-GLOBEX-01 (AS64521)"
      multipath: false
      capabilities:
        - EXT-PARTNER-GLOBEX-01
      router_id:
        - "10.255.0.23/32"
        - default
      local_as: "AS64521"

---
# ── BGP peering sessions — company WAN edge <-> partner ──────────────────────
# FR2/FR6/PA4/AM1-EDGE-01-DCI-BGP already exist (05_interconnects/
# datacenter-equinix/04_dci_bgp.yml) — one BGP process, multiple peerings.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: FR2-EDGE-01-DE-CIX-RS-BGP
      description: "eBGP — FR2-EDGE-01 (AS65000) <-> DE-CIX route server (AS6695)"
      session_type: EBGP
      bfd_enabled: false
      maximum_routes: 200000
      bgp_processes:
        - FR2-EDGE-01-DCI-BGP
        - EXT-INET-DE-CIX-FR-01-BGP
      interface_capabilities:
        - kind: DcimVirtualInterface
          data:
            device: FR2-EDGE-01
            name: VTI-FR2-DE-CIX
        - kind: DcimVirtualInterface
          data:
            device: EXT-INET-DE-CIX-FR-01
            name: VTI-DE-CIX-FR2

    - name: FR6-EDGE-01-BT-INET-BGP
      description: "eBGP — FR6-EDGE-01 (AS65000) <-> BT internet transit (AS5400)"
      session_type: EBGP
      bfd_enabled: true
      maximum_routes: 100000
      bgp_processes:
        - FR6-EDGE-01-DCI-BGP
        - EXT-INET-BT-01-BGP
      interface_capabilities:
        - kind: DcimPhysicalInterface
          data:
            device: FR6-EDGE-01
            name: Ethernet1/1
        - kind: DcimPhysicalInterface
          data:
            device: EXT-INET-BT-01
            name: Ethernet1/1

    - name: PA4-EDGE-01-ACME-PARTNER-BGP
      description: "eBGP — PA4-EDGE-01 (AS65000) <-> ACME partner MPLS (AS64520)"
      session_type: EBGP
      bfd_enabled: true
      maximum_routes: 50000
      bgp_processes:
        - PA4-EDGE-01-DCI-BGP
        - EXT-PARTNER-ACME-01-BGP
      interface_capabilities:
        - kind: DcimPhysicalInterface
          data:
            device: PA4-EDGE-01
            name: Ethernet1/1
        - kind: DcimPhysicalInterface
          data:
            device: EXT-PARTNER-ACME-01
            name: Ethernet1/1

    - name: AM1-EDGE-01-GLOBEX-PARTNER-BGP
      description: "eBGP — AM1-EDGE-01 (AS65000) <-> GLOBEX partner IP-VPN (AS64521)"
      session_type: EBGP
      bfd_enabled: true
      maximum_routes: 50000
      bgp_processes:
        - AM1-EDGE-01-DCI-BGP
        - EXT-PARTNER-GLOBEX-01-BGP
      interface_capabilities:
        - kind: DcimVirtualInterface
          data:
            device: AM1-EDGE-01
            name: VTI-AM1-GLOBEX
        - kind: DcimVirtualInterface
          data:
            device: EXT-PARTNER-GLOBEX-01
            name: VTI-GLOBEX-AM1
