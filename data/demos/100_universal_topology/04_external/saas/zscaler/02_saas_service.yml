---
# Zscaler ZIA — ManagedCloudProxyHA service capability
#
# Global node carries tenant contract metadata.
# Per-region nodes anchor the enforcement point at each PoP —
# the virtual circuit model (01_connectivity.yml) captures the actual
# tunnel endpoints; no need to duplicate them here.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCloudProxyHA
  data:
    - name: ZSCALER-ZIA
      provider: zscaler_zia
      tenant_id: "org-demo-001"
      service_tier: enterprise
      data_classification: confidential
      mode: cloud_managed
      status: active
      description: "Zscaler Internet Access — SASE enforcement for all internet-bound traffic"

    - name: ZSCALER-ZIA-EUROPE-WEST
      provider: zscaler_zia
      tenant_id: "org-demo-001"
      service_tier: enterprise
      data_classification: confidential
      mode: cloud_managed
      status: active
      description: "Zscaler ZIA — Europe West enforcement PoP (Amsterdam)"

    - name: ZSCALER-ZIA-EUROPE-CENTRAL
      provider: zscaler_zia
      tenant_id: "org-demo-001"
      service_tier: enterprise
      data_classification: confidential
      mode: cloud_managed
      status: active
      description: "Zscaler ZIA — Europe Central enforcement PoP (Frankfurt)"

---
# Link global service capability to topology node

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: ZSCALER-SASE
      saas_service: ZSCALER-ZIA

---
# Link per-region enforcement capabilities to SaasRegion nodes

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: ZSCALER-SASE-EUROPE-WEST
      saas_service: ZSCALER-ZIA-EUROPE-WEST
    - name: ZSCALER-SASE-EUROPE-CENTRAL
      saas_service: ZSCALER-ZIA-EUROPE-CENTRAL
