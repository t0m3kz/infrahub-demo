---
# Zscaler ZIA — ManagedCloudProxyHA service capability
#
# Linked to the ZSCALER-SASE topology node via saas_service.
# Carries operational metadata (tenant, tier, data classification) and
# anchors shared proxy policies applied to all tenants on this service.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCloudProxyHA
  data:
    - name: ZSCALER-ZIA
      provider: zscaler_zia
      tenant_id: "org-demo-001"
      service_tier: enterprise
      data_classification: confidential
      tunnel_endpoint: "gateway.zscaler.net"
      pac_url: "https://pac.zscaler.net/org-demo-001/proxy.pac"
      mode: cloud_managed
      status: active
      description: "Zscaler Internet Access — SASE enforcement for all internet-bound traffic"

---
# Link service capability back to topology node

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: ZSCALER-SASE
      saas_service: ZSCALER-ZIA
