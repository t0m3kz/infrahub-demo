---
# Zscaler SASE — cloud-delivered Secure Web Gateway / Zero Trust Network Access
#
# Two regional PoPs cover the topology:
#   ams2  — Amsterdam PoP (primary for UK/NL/ES offices and AM1 hub)
#   fra4  — Frankfurt PoP  (primary for DE/FR offices and FR6/PA4/PA6 hubs)
# Region names use Zscaler's own node identifiers (from config.zscaler.com/api/zscaler.net/cenr/json)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: ZSCALER-SASE
      provider: zscaler
      service_type: sase
      status: active
      description: "Zscaler Internet Access (ZIA) + Zscaler Private Access (ZPA) — SASE platform"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: ams2
            status: active
            location: ams
          - region_name: fra4
            status: active
            location: fra

---
# Zscaler PoP logical devices — one per regional node

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: EXT-SAAS-ZSCALER-AMS-01
      object_template: N9K-C9336C-FX2_EDGE
      status: active

    - name: EXT-SAAS-ZSCALER-FRA-01
      object_template: N9K-C9336C-FX2_EDGE
      status: active
