---
# Salesforce — service capability nodes
# Production and sandbox share the same regional PoP — linked via saas_services (cardinality many)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCRMService
  data:
    - name: SALESFORCE-PROD-SVC-ARE12
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: enterprise
      data_classification: restricted
      instance_url: "https://demo.my.salesforce.com"
      sandbox: false
      status: active
      description: "Salesforce CRM — production instance ARE12 (Amsterdam, AM3 superpod)"

    - name: SALESFORCE-SANDBOX-SVC-ARE12
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: standard
      data_classification: internal
      instance_url: "https://demo--sandbox.sandbox.my.salesforce.com"
      sandbox: true
      status: active
      description: "Salesforce CRM — sandbox instance ARE2S (Amsterdam, AM3 superpod)"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: SALESFORCE-ARE12
      parent: SALESFORCE
      region_name: are12
      saas_services:
        - SALESFORCE-PROD-SVC-ARE12
        - SALESFORCE-SANDBOX-SVC-ARE12
