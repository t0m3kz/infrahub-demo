---
# Salesforce — per-region service capability nodes
# Links service metadata to each TopologySaasRegion via saas_service.
# Instance identifiers from api.status.salesforce.com/v1/instances (EMEA production)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCRMService
  data:
    - name: SALESFORCE-PROD-SVC-ARE12
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: enterprise
      data_classification: restricted
      instance_url: "https://demo.my.salesforce.com"
      sandbox: false
      status: active
      description: "Salesforce CRM — instance ARE12 (Amsterdam, AM3 superpod)"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: SALESFORCE-PROD-ARE12
      saas_service: SALESFORCE-PROD-SVC-ARE12

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCRMService
  data:
    - name: SALESFORCE-SANDBOX-SVC-ARE2S
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: standard
      data_classification: internal
      instance_url: "https://demo--sandbox.sandbox.my.salesforce.com"
      sandbox: true
      status: active
      description: "Salesforce CRM sandbox — instance ARE2S (Amsterdam)"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: SALESFORCE-SANDBOX-ARE2S
      saas_service: SALESFORCE-SANDBOX-SVC-ARE2S
