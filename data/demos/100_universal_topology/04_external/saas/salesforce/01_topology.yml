---
# Salesforce CRM — customer relationship management SaaS
#
# Production and sandbox instances are modelled separately so change-approval
# flows can distinguish between prod and non-prod deployments.

# ── Production ────────────────────────────────────────────────────────────────

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: SALESFORCE-PROD
      provider: salesforce
      service_type: crm
      status: active
      description: "Salesforce CRM — production instance"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: emea-west
            status: active
            location: dub

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCRMService
  data:
    - name: SALESFORCE-PROD-SVC
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: enterprise
      data_classification: restricted
      instance_url: "https://demo.my.salesforce.com"
      sandbox: false
      status: active
      description: "Salesforce CRM production org — EMEA"

    - name: SALESFORCE-PROD-SVC-EMEA-WEST
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: enterprise
      data_classification: restricted
      instance_url: "https://demo.my.salesforce.com"
      sandbox: false
      status: active
      description: "Salesforce CRM — EMEA West PoP (Dublin), data residency eu-west-1"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: SALESFORCE-PROD
      saas_service: SALESFORCE-PROD-SVC

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: SALESFORCE-PROD-EMEA-WEST
      saas_service: SALESFORCE-PROD-SVC-EMEA-WEST

# ── Sandbox ───────────────────────────────────────────────────────────────────

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: SALESFORCE-SANDBOX
      provider: salesforce
      service_type: crm
      status: active
      description: "Salesforce CRM — sandbox / non-production instance"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: emea-west
            status: active
            location: dub

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCRMService
  data:
    - name: SALESFORCE-SANDBOX-SVC
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: standard
      data_classification: internal
      instance_url: "https://demo--sandbox.sandbox.my.salesforce.com"
      sandbox: true
      status: active
      description: "Salesforce CRM sandbox org — development and testing"

    - name: SALESFORCE-SANDBOX-SVC-EMEA-WEST
      provider: salesforce
      tenant_id: "sf-org-demo-001"
      service_tier: standard
      data_classification: internal
      instance_url: "https://demo--sandbox.sandbox.my.salesforce.com"
      sandbox: true
      status: active
      description: "Salesforce CRM sandbox — EMEA West PoP (Dublin)"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: SALESFORCE-SANDBOX
      saas_service: SALESFORCE-SANDBOX-SVC

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: SALESFORCE-SANDBOX-EMEA-WEST
      saas_service: SALESFORCE-SANDBOX-SVC-EMEA-WEST
