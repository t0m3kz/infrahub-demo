---
# Salesforce CRM — single topology for all Salesforce instances
#
# Production and sandbox share the same Amsterdam (AM3 superpod) infrastructure.
# Instance identifiers from api.status.salesforce.com/v1/instances

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: SALESFORCE
      provider: salesforce
      service_type: crm
      status: active
      description: "Salesforce CRM — production and sandbox instances"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: are12
            status: active
            location: ams
