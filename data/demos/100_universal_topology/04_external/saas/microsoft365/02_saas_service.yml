      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
      status: active
      description: "Microsoft Teams — EMEA West PoP (Amsterdam), recording region eu-west-1"

    - name: M365-TEAMS-SVC-EMEA-NORTH
      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
