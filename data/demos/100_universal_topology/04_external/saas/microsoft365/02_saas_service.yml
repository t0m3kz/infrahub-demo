---
# Microsoft 365 — service capability nodes per region
# Multiple services share the same regional PoP — linked via saas_services (cardinality many)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedConferencingService
  data:
    - name: M365-TEAMS-SVC-WESTEUROPE
      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
      status: active
      description: "Microsoft Teams — westeurope PoP (Amsterdam)"

    - name: M365-TEAMS-SVC-NORTHEUROPE
      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
      status: active
      description: "Microsoft Teams — northeurope PoP (Dublin)"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedStorageService
  data:
    - name: M365-STORAGE-SVC-WESTEUROPE
      provider: sharepoint
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      encryption_at_rest: true
      status: active
      description: "SharePoint/OneDrive — westeurope PoP (Amsterdam), EUR data residency"

    - name: M365-STORAGE-SVC-NORTHEUROPE
      provider: sharepoint
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      encryption_at_rest: true
      status: active
      description: "SharePoint/OneDrive — northeurope PoP (Dublin), EUR data residency"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: MICROSOFT-365-WESTEUROPE
      parent: MICROSOFT-365
      region_name: westeurope
      saas_services:
        - M365-TEAMS-SVC-WESTEUROPE
        - M365-STORAGE-SVC-WESTEUROPE
    - name: MICROSOFT-365-NORTHEUROPE
      parent: MICROSOFT-365
      region_name: northeurope
      saas_services:
        - M365-TEAMS-SVC-NORTHEUROPE
        - M365-STORAGE-SVC-NORTHEUROPE
