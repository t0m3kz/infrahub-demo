---
# Microsoft 365 — per-region service capability nodes
# Links service metadata to each TopologySaasRegion via saas_service.
# Region names: westeurope (Amsterdam), northeurope (Dublin) — Azure ARM identifiers

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedConferencingService
  data:
    - name: M365-TEAMS-SVC-WESTEUROPE
      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
      status: active
      description: "Microsoft Teams — westeurope PoP (Amsterdam)"

    - name: M365-TEAMS-SVC-NORTHEUROPE
      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
      status: active
      description: "Microsoft Teams — northeurope PoP (Dublin)"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaasRegion
  data:
    - name: M365-TEAMS-EMEA-WESTEUROPE
      parent: M365-TEAMS-EMEA
      region_name: westeurope
      saas_service: M365-TEAMS-SVC-WESTEUROPE
    - name: M365-TEAMS-EMEA-NORTHEUROPE
      parent: M365-TEAMS-EMEA
      region_name: northeurope
      saas_service: M365-TEAMS-SVC-NORTHEUROPE

