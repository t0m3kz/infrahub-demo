---
# Microsoft 365 — single topology for all M365 services
#
# Teams (conferencing) and SharePoint/OneDrive (storage) share the same
# Microsoft Azure infrastructure — one region node per PoP, multiple
# service capability nodes per region.
# Region names use Azure ARM identifiers (westeurope, northeurope)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: MICROSOFT-365
      provider: microsoft
      service_type: other
      status: active
      description: "Microsoft 365 — Teams, SharePoint, OneDrive"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: westeurope
            status: active
            location: ams
          - region_name: northeurope
            status: active
            location: dub
