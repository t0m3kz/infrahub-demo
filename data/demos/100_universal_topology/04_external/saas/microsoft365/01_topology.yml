---
# Microsoft 365 — two distinct SaaS services sharing Microsoft infrastructure
#
# Modelled as two separate TopologySaas nodes to reflect different service types:
#   M365-TEAMS-EMEA    — real-time conferencing (service_type: conferencing)
#   M365-STORAGE-EMEA  — file and object storage (service_type: storage)
#
# Both share the same regional PoP footprint (Amsterdam + Dublin for EMEA).

# ── Teams ─────────────────────────────────────────────────────────────────────

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: M365-TEAMS-EMEA
      provider: microsoft
      service_type: conferencing
      status: active
      description: "Microsoft Teams — EMEA conferencing and collaboration"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: emea-west
            status: active
            location: ams
          - region_name: emea-north
            status: active
            location: dub

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedConferencingService
  data:
    - name: M365-TEAMS-SVC
      provider: teams
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      media_optimization: true
      recording_region: "eu-west-1"
      status: active
      description: "Microsoft Teams enterprise tenant — EMEA region"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: M365-TEAMS-EMEA
      saas_service: M365-TEAMS-SVC

# ── SharePoint / OneDrive ────────────────────────────────────────────────────

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: M365-STORAGE-EMEA
      provider: microsoft
      service_type: storage
      status: active
      description: "Microsoft SharePoint and OneDrive — EMEA document storage"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: sharepoint-emea-west
            status: active
            location: ams
          - region_name: sharepoint-emea-north
            status: active
            location: dub

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedStorageService
  data:
    - name: M365-STORAGE-SVC
      provider: sharepoint
      tenant_id: "m365-tenant-demo-001"
      service_tier: enterprise
      data_classification: confidential
      storage_region: "eu-west-1"
      encryption_at_rest: true
      status: active
      description: "SharePoint Online + OneDrive — enterprise document platform"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: M365-STORAGE-EMEA
      saas_service: M365-STORAGE-SVC
