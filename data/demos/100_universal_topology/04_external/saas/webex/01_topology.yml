---
# Cisco Webex — conferencing and collaboration SaaS
#
# Two regional PoPs anchor the topology:
#   eu-frankfurt — Frankfurt (primary EMEA DC)
#   eu-amsterdam — Amsterdam (secondary EMEA DC)
# Webex does not publish per-PoP slug identifiers; eu-frankfurt/eu-amsterdam
# are logical names derived from Cisco's documented EMEA DC locations.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: WEBEX-EMEA
      provider: cisco
      service_type: conferencing
      status: active
      description: "Cisco Webex — video conferencing, messaging, and collaboration"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: eu-frankfurt
            status: active
            location: fra
          - region_name: eu-amsterdam
            status: active
            location: ams
