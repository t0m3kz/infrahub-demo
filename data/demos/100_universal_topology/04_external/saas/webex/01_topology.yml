---
# Cisco Webex — conferencing and collaboration SaaS
#
# Webex is a destination SaaS — no enforcement point on-prem.
# Traffic is subject to media_optimization (direct-media breakout) so RTP/SRTP
# bypasses proxy inspection and takes the most direct internet path.
#
# Two regional PoPs anchor the topology:
#   WEBEX-EMEA-WEST    — Dublin (serves UK, NL, ES offices)
#   WEBEX-EMEA-CENTRAL — Frankfurt (serves DE, FR offices)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: WEBEX-EMEA
      provider: cisco
      service_type: conferencing
      status: active
      description: "Cisco Webex — video conferencing, messaging, and collaboration"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: emea-west
            status: active
            location: dub

          - region_name: emea-central
            status: active
            location: fra

---
# ManagedConferencingService — operational metadata for Webex

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedConferencingService
  data:
    - name: WEBEX-EMEA-SVC
      provider: webex
      tenant_id: "webex-org-demo-001"
      service_tier: enterprise
      data_classification: internal
      media_optimization: true
      recording_region: "eu-west-1"
      status: active
      description: "Cisco Webex enterprise tenant — EMEA region"

---
# Link service capability to topology node

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: WEBEX-EMEA
      saas_service: WEBEX-EMEA-SVC
