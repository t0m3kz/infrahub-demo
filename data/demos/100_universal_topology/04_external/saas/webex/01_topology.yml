---
# Cisco Webex — conferencing and collaboration SaaS
#
# Two regional PoPs anchor the topology:
#   emea-west    — Dublin    (serves UK, NL, ES offices)
#   emea-central — Frankfurt (serves DE, FR offices)

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySaas
  data:
    - name: WEBEX-EMEA
      provider: cisco
      service_type: conferencing
      status: active
      description: "Cisco Webex — video conferencing, messaging, and collaboration"
      children:
        kind: TopologySaasRegion
        data:
          - region_name: emea-west
            status: active
            location: dub
          - region_name: emea-central
            status: active
            location: fra
