---
# L3 of the pod, by hand: the VRF of DC90 gets the new routing devices (the whole list, an upsert replaces it), each
# device an overlay process, and the EVPN overlay sessions leaf-01/02 - spine - border leaves - edge. The direct
# leaf-01 - edge session of the main sample stays.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "dc90-vrf-prod"
      namespace: "PROD"
      deployment: "DC90"
      shared_devices:
        - "dc90-leaf-01"
        - "dc90-leaf-02"
        - "dc90-bl-01"
        - "dc90-bl-02"
        - "dc90-edge-01"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - {name: "dc90-leaf-02-bgp", status: active, process_role: overlay, local_as: "AS4200090003", router_id: ["10.90.255.3/32", "PROD"], capabilities: ["dc90-leaf-02"]}  # yamllint disable-line rule:line-length
    - {name: "dc90-spine-01-bgp", status: active, process_role: overlay, local_as: "AS4200090004", router_id: ["10.90.255.4/32", "PROD"], capabilities: ["dc90-spine-01"]}  # yamllint disable-line rule:line-length
    - {name: "dc90-bl-01-bgp", status: active, process_role: overlay, local_as: "AS4200090005", router_id: ["10.90.255.5/32", "PROD"], capabilities: ["dc90-bl-01"]}  # yamllint disable-line rule:line-length
    - {name: "dc90-bl-02-bgp", status: active, process_role: overlay, local_as: "AS4200090006", router_id: ["10.90.255.6/32", "PROD"], capabilities: ["dc90-bl-02"]}  # yamllint disable-line rule:line-length
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - {name: "BGP-DC90-LEAF01-SPINE01", description: "EVPN overlay", session_type: EBGP, peering_role: overlay, address_families: [["l2vpn", "evpn"]], bgp_processes: ["dc90-leaf-01-bgp", "dc90-spine-01-bgp"]}  # yamllint disable-line rule:line-length
    - {name: "BGP-DC90-LEAF02-SPINE01", description: "EVPN overlay", session_type: EBGP, peering_role: overlay, address_families: [["l2vpn", "evpn"]], bgp_processes: ["dc90-leaf-02-bgp", "dc90-spine-01-bgp"]}  # yamllint disable-line rule:line-length
    - {name: "BGP-DC90-SPINE01-BL01", description: "EVPN overlay", session_type: EBGP, peering_role: overlay, address_families: [["l2vpn", "evpn"]], bgp_processes: ["dc90-spine-01-bgp", "dc90-bl-01-bgp"]}  # yamllint disable-line rule:line-length
    - {name: "BGP-DC90-SPINE01-BL02", description: "EVPN overlay", session_type: EBGP, peering_role: overlay, address_families: [["l2vpn", "evpn"]], bgp_processes: ["dc90-spine-01-bgp", "dc90-bl-02-bgp"]}  # yamllint disable-line rule:line-length
    - {name: "BGP-DC90-BL01-EDGE01", description: "EVPN overlay", session_type: EBGP, peering_role: overlay, address_families: [["l2vpn", "evpn"]], bgp_processes: ["dc90-bl-01-bgp", "dc90-edge-01-bgp"]}  # yamllint disable-line rule:line-length
    - {name: "BGP-DC90-BL02-EDGE01", description: "EVPN overlay", session_type: EBGP, peering_role: overlay, address_families: [["l2vpn", "evpn"]], bgp_processes: ["dc90-bl-02-bgp", "dc90-edge-01-bgp"]}  # yamllint disable-line rule:line-length
