---
# A small pod in front of the edge of data/demos/cloud_saas_model (load that directory first): the AS numbers and
# loopbacks of the new devices. Hand-typed like the rest of the sample (a pool would hand them out).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - {asn: 4200090003, owner: "P028", description: "dc90-leaf-02 (would come from PRIVATE-ASN32)"}
    - {asn: 4200090004, owner: "P028", description: "dc90-spine-01 (would come from PRIVATE-ASN32)"}
    - {asn: 4200090005, owner: "P028", description: "dc90-bl-01 (would come from PRIVATE-ASN32)"}
    - {asn: 4200090006, owner: "P028", description: "dc90-bl-02 (would come from PRIVATE-ASN32)"}
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - {address: "10.90.255.3/32", ip_namespace: "PROD", description: "dc90-leaf-02 loopback"}
    - {address: "10.90.255.4/32", ip_namespace: "PROD", description: "dc90-spine-01 loopback"}
    - {address: "10.90.255.5/32", ip_namespace: "PROD", description: "dc90-bl-01 loopback"}
    - {address: "10.90.255.6/32", ip_namespace: "PROD", description: "dc90-bl-02 loopback"}
