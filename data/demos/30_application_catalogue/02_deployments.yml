---
# ============================================================================
# Application Components — all three customers
# Each component links instances, network segments, listening ports, and VIPs.
# ============================================================================

# ── C001 (Nordix Ltd.) ────────────────────────────────────────────────────────

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppComponent
  data:

    # ── trade-portal / production ─────────────────────────────────────────────

    - name: web-frontend
      component_type: frontend
      parent: c001-trade-portal-p
      instances:
        - C001-WEB-VM-01
        - C001-WEB-VM-02
      network_segments:
        - c001-web-frontend-p
      vip_services:
        - - c001-trade-web.dc3.internal
          - https
          - "443"
        - - c001-trade-web.dc3.internal
          - http
          - "80"

    - name: api-gateway
      component_type: backend
      parent: c001-trade-portal-p
      instances:
        - C001-APP-VM-01
        - C001-APP-VM-02
      network_segments:
        - c001-app-backend-p
      vip_services:
        - - c001-trade-api.dc3.internal
          - https
          - "8443"

    - name: order-db
      component_type: database
      parent: c001-trade-portal-p
      instances:
        - C001-DB-VM-01
        - C001-DB-VM-02
      network_segments:
        - c001-database-p
      vip_services:
        - - c001-trade-db.dc3.internal
          - tcp
          - "5432"

    - name: session-cache
      component_type: cache
      parent: c001-trade-portal-p
      instances:
        - C001-CACHE-VM-01
      network_segments:
        - c001-cache-p
      service_ports:
        - 6379/tcp

    # ── trade-portal / nonprod ────────────────────────────────────────────────

    - name: web-frontend
      component_type: frontend
      parent: c001-trade-portal-n
      instances:
        - C001-WEB-NP-VM-01
      network_segments:
        - c001-web-frontend-n
      vip_services:
        - - c001-trade-web-n.dc3.internal
          - https
          - "443"

    - name: api-gateway
      component_type: backend
      parent: c001-trade-portal-n
      instances:
        - C001-APP-NP-VM-01
      network_segments:
        - c001-app-backend-n
      vip_services:
        - - c001-trade-api-n.dc3.internal
          - https
          - "8443"

    - name: order-db
      component_type: database
      parent: c001-trade-portal-n
      instances:
        - C001-DB-NP-VM-01
      network_segments:
        - c001-database-n
      vip_services:
        - - c001-trade-db-n.dc3.internal
          - tcp
          - "5432"

    # ── auth-platform / production ────────────────────────────────────────────

    - name: auth-api
      component_type: backend
      parent: c001-auth-platform-p
      instances:
        - C001-AUTH-VM-01
        - C001-AUTH-VM-02
      network_segments:
        - c001-app-backend-p
      vip_services:
        - - c001-auth-api.dc3.internal
          - https
          - "8443"

    - name: identity-db
      component_type: database
      parent: c001-auth-platform-p
      instances:
        - C001-DB-VM-01
      network_segments:
        - c001-database-p
      vip_services:
        - - c001-auth-db.dc3.internal
          - tcp
          - "5432"

    # ── risk-engine / production ──────────────────────────────────────────────

    - name: analytics-worker
      component_type: worker
      parent: c001-risk-engine-p
      instances:
        - C001-RISK-VM-01
        - C001-RISK-VM-02
      network_segments:
        - c001-app-backend-p
      vip_services:
        - - c001-risk-api.dc3.internal
          - https
          - "8443"

    - name: risk-db
      component_type: database
      parent: c001-risk-engine-p
      instances:
        - C001-DB-VM-02
      network_segments:
        - c001-database-p
      vip_services:
        - - c001-risk-db.dc3.internal
          - tcp
          - "5432"

