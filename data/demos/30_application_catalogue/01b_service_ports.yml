---
# Global service port definitions required by components in this catalogue.
# AppServicePort nodes are globally unique (port + protocol) and shared across components.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppServicePort
  data:
    - port: 80
      protocol: tcp

    - port: 443
      protocol: tcp

    - port: 5432
      protocol: tcp

    - port: 6379
      protocol: tcp

    - port: 8443
      protocol: tcp
