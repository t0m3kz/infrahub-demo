---
# Frankfurt colocation metro and zones (nested from colocation root)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: EQUINIX
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          # Frankfurt's on-ramp is declared, not hand-written, and on the zone
          # that holds it: add_colocation_zone (generators/topology/colocation_fabric.py)
          # creates the devices plus FR2's own loopback/management/technical
          # pools, sliced out of the global bootstrap supernets. The metro FR
          # only keeps the EVPN Multi-Site site (its VNI and ASN pools, from
          # add_colocation_metro). Declared on a zone rather than on every cage
          # for the same reason a DC declares its border-leafs rather than a pod
          # doing it — one pair fronts the whole metro, and FR6 reaches it over
          # a cross-connect. Edge pair, interlink and edge<->firewall cabling
          # all stay inside FR2; a link between zones is a circuit.
          #
          # This demo loads no data centers, so the `dci` ports on
          # N9K-C9316D-GX_EDGE (Ethernet1/[9-12], facing DC border-leafs) stay
          # free here. See data/demos/30_all for the on-ramp with DCs behind it.
          #
          # The firewall pair is the on-ramp's perimeter, declared the way a DC
          # declares its own: quantity 2 of a template carrying a role=ha sync
          # port (PA-5260_FIREWALL's HA1/HA2), which is what lets the generator
          # build the ManagedFirewallHA domain and the sync cable between the
          # two members. Not Panorama-managed — the zone declares no
          # controllers, so they land in the plain `firewalls` group.
          #
          # Declaring both roles on one zone is also what makes FR2 the only
          # zone here that gets cabled: the generator wires the firewall pair to
          # the edge pair on Ethernet1/[15-16] (role `firewall`) index-paired,
          # eg-fr201 to fw-fr201 only. Two links per couple, so five cables in all
          # once the HA sync link is counted.
          - name: FR
            design: "S"
            location: ["fra"]
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyColocationZone
              data:
                - name: FR2
                  design: "EDGE_FW"
                  member_of_groups:
                    - colocation_zones
                  fabric_templates:
                    - ["2", "edge", "N9K-C9316D-GX_EDGE"]
                    - ["2", "firewall", "PA-5260_FIREWALL"]
                - name: FR6
                  member_of_groups:
                    - colocation_zones
