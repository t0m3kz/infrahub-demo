---
# Amsterdam colocation metro and its virtual colocation (nested from colocation root)
#
# Equinix Amsterdam is one provider-hosted presence, not cages: the metro AM
# (the Multi-Site site) has a single TopologyVirtualColocation child, AM-NE
# (Equinix Network Edge). It is named differently from its metro because metro,
# zone and virtual colocation names share the device-name and pool-name space.
# A virtual colocation can only host virtual templates (TemplateDcimVirtualDevice),
# so add_virtual_colocation creates DcimVirtualDevices — instances we rent, not
# hardware we rack — and a `physical` template would be rejected here.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: EQUINIX
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          # C8000V_EDGE, not the N9K the other metros use: AM-NE can only host
          # virtual kit. It is a TemplateDcimVirtualDevice, so the generator
          # creates DcimVirtualDevices (eg-am-ne01, eg-am-ne02) — an Equinix
          # Network Edge instance we rent, not hardware we rack. The one
          # presence in the demo data that exercises the virtual path at all.
          - name: AM
            design: "S"
            location: ["ams"]
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyVirtualColocation
              data:
                - name: AM-NE
                  design: "EDGE"
                  # Routed to the virtual_colocation_terraform group: one Equinix Network Edge
                  # Terraform artifact for eg-am-ne01/02 (an HA pair).
                  infrastructure_orchestrator: terraform
                  # The provider order's contract data, printed into that file: the Equinix billing account
                  # (a demo value) and the owner, whose notification_emails the provider notifies.
                  provider_account_number: "1000001"
                  owner: "P028"
                  member_of_groups:
                    - virtual_colocations
                  fabric_templates:
                    - ["2", "edge", "C8000V_EDGE"]
