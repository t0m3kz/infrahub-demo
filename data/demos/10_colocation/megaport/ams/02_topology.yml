---
# Megaport Amsterdam access topology
#
# No fabric_templates, deliberately: an MCR is Megaport's own virtual router in
# Megaport's cloud, reached over a virtual cross-connect — we buy a port on it,
# we do not deploy kit into it. The metro and the MCR zone still join
# colocation_metros / colocation_zones because the created-triggers fire per kind
# and Infrahub fails a run whose target sits outside the generator definition's
# group, so add_colocation_metro and add_colocation_zone run here and no-op.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: MEGAPORT
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: AMS
            location: ["ams"]
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyColocationZone
              data:
                - name: MCR-AMS1
                  member_of_groups:
                    - colocation_zones
