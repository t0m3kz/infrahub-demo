---
# DC13 - the LISP demo fabric. Shaped like data/demos/01_data_center/dc2 (size M: no super-spine
# tier, a DC-level border-leaf tier, pods meshed spine to spine) with these differences:
#
#   - routing_strategy ospf-ibgp with an IPv4 underlay: the only pairing the lisp_fabric check
#     accepts (the IOS-XE template renders OSPFv2 only).
#   - overlay_control_plane lisp: no ManagedBGP at all, the border-leafs are the map-servers.
#   - two Catalyst 9500 border-leafs (the map-server pair), Catalyst 9300 leafs and access-leafs.
#     The spines are Arista EOS (their OSPF template exists); every VTEP role must be cisco_xe.
#   - no super-spine, hyper-spine or border-spine (a LISP fabric has no spine overlay role), no
#     firewall and no load balancer: the PROD SVIs of this scope are unprotected, because it
#     hosts nothing (cisco_xe renders the SVI ACL and VRF statics of a hosted segment, not PBR).
#   - mlag_create stays "no": cisco_xe refuses an MLAG domain.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC13
      index: 13
      parent: DC
      size: M
      routing_strategy: ospf-ibgp
      underlay_protocol: ipv4
      overlay_control_plane: lisp
      naming_convention: hierarchical
      fabric_templates:
        - ["2", "border-leaf", "C9500-32C_BORDER_LEAF"]
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          - index: 1
            layout: S_MIDDLE
            deployment_type: middle_rack
            suites: [mad-1-s-1]
            fabric_templates:
              - ["2", "spine", "DCS-7050CX3-32C-R_SPINE"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: mad-1-s-1-r-1-1
                  rack_type: network
                  parent: mad-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "C9300-48UXM_LEAF"]
                    - ["2", "access-leaf", "C9300-48UXM_ACCESS"]
          - index: 2
            layout: S_MIDDLE
            deployment_type: middle_rack
            suites: [mad-1-s-2]
            fabric_templates:
              - ["2", "spine", "DCS-7050CX3-32C-R_SPINE"]
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 1
                  row_index: 1
                  shortname: mad-1-s-2-r-1-1
                  rack_type: network
                  parent: mad-1-s-2
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "C9300-48UXM_LEAF"]
                    - ["2", "access-leaf", "C9300-48UXM_ACCESS"]
