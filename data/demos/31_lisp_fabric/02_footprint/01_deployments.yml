---
# The tenant's footprints in DC13: production (PROD VRF) and development (NON-PROD VRF), so the
# border-leafs register two L3 instance-ids. name is computed ({org_id}-{environment}-{parent}),
# do not set it. DC13 has no firewall, so add_customer_deployment_dc skips the firewall context.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "LISP1"
      environment: "p"
      status: active
      parent: "DC13"
      design: "M_DC"
      member_of_groups:
        - customer_deployments_dc
    - owner: "LISP1"
      environment: "d"
      status: active
      parent: "DC13"
      design: "M_DC"
      member_of_groups:
        - customer_deployments_dc
