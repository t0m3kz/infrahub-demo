---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - owner: "C002"
      customer_name: "web-frontend"
      environment: "p"
      security_zone: "PROD"
      arp_suppression: true
      customer_deployments: ["C002-P-DC6"]
      gateway:
        data:
          address: "10.2.10.1/24"
          description: "Anycast GW — C002 prod web-frontend (DC6)"
          ip_namespace: "default"
          ip_prefix:
            kind: IpamPrefix
            data:
              prefix: "10.2.10.0/24"
              description: "C002 prod web-frontend subnet (DC6)"
              status: active
              role: customer
              ip_namespace: "default"
