---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC14
      index: 14
      design: L
      parent: "Data Center"
      routing_strategy: ebgp-ebgp
      underlay_protocol: ipv6
      naming_convention: standard
      fabric_interface_sorting_method: top_down
      member_of_groups:
        - topologies_dc
      racks:
        kind: LocationRack
        data:
          # Multi-role DC core rack under Row 1 (row_index derived from LocationRackRow.index)
          - name: MUC-U1-SUITE-1-R1-1
            index: 1
            shortname: muc-u1-s-1-r-1-1
            rack_type: network
            parent: muc-u1-s-1-row-1
            fabric_templates:
              - ["2", "super-spine", "N9K-C9336C-FX2_SUPER_SPINE"]
              - ["2", "border-leaf", "N9K-C9364C-GX_BORDER_LEAF"]
      children:
        kind: TopologyPod
        data:
          - index: 1
            design: M_MIDDLE
            mlag_create: virtual
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - name: MUC-U1-SUITE-1-R1-2
                  index: 2
                  shortname: muc-u1-s-1-r-1-2
                  rack_type: network
                  parent: muc-u1-s-1-row-1
                  fabric_templates:
                    - ["2", "spine", "N9K-C9336C-FX2_SPINE"]
                - name: MUC-U1-SUITE-1-R1-5
                  index: 5
                  shortname: muc-u1-s-1-r-1-5
                  parent: muc-u1-s-1-row-1
                  object_template: STD-LEAF-RACK-FX3
                  member_of_groups: [topologies_rack]
                - name: MUC-U1-SUITE-1-R2-5
                  index: 5
                  shortname: muc-u1-s-1-r-2-5
                  parent: muc-u1-s-1-row-2
                  object_template: STD-LEAF-RACK-FX3
                  member_of_groups: [topologies_rack]
