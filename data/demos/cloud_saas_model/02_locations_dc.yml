---
# One data center with one suite, one rack (the patch panel's), and the topology objects the devices hang on.
apiVersion: infrahub.app/v1
version: "1.0"
kind: Object
spec:
  kind: LocationMetro
  data:
    - name: "Demo Metro"
      shortname: "dmo"
      parent: de
      children:
        kind: LocationFacility
        data:
          - name: "DMO-1"
            shortname: "dmo-1"
            children:
              kind: LocationSuite
              data:
                - name: DMO-1-Suite-1
                  index: 1
                  shortname: "dmo-1-s-1"
                  parent: dmo-1
                  rows: 1
                  racks_per_row: 2
                  children:
                    kind: LocationRack
                    data:
                      - name: DMO-1-S1-R1-1
                        shortname: dmo-1-s-1-r-1-1
                        index: 1
                        row_index: 1
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC90
      parent: "Data Center"
      index: 9
      design: S
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyExternalProviders
  data:
    - name: ISP-DEMO
      parent: "Internet"
      status: active
      provider: "P014"
