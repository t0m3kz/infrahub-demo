---
# L3 of the DC side, authored by hand (no generator): the VRF of the topology (PROD), the leaf SVI in it, the BGP
# processes of leaf and edge, the overlay peering between them, and the edge sub-interfaces that face the cloud and
# SaaS legs (our address of each /31 is typed here; a pool would hand it out). The handoff peerings are in 12_*.yml,
# after the circuits that create the connectors they end on.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVRF
  data:
    - name: "dc90-vrf-prod"
      namespace: "PROD"
      deployment: "DC90"
      shared_devices:
        - "dc90-leaf-01"
        - "dc90-edge-01"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Vlan100"
      device: "dc90-leaf-01"
      role: svi
      status: active
      vrf: ["DC90", "PROD"]
    - name: "Ethernet1/3.1000"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "AWS Direct Connect transit VIF, VLAN 1000"
      parent_interface: ["dc90-edge-01", "Ethernet1/3"]
      vrf: ["DC90", "PROD"]
      ip_address: {data: {address: "10.255.128.0/31", ip_namespace: "PROD"}}
    - name: "Ethernet1/4.200"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "ExpressRoute primary, private peering VLAN 200"
      parent_interface: ["dc90-edge-01", "Ethernet1/4"]
      vrf: ["DC90", "PROD"]
      ip_address: {data: {address: "10.255.128.2/31", ip_namespace: "PROD"}}
    - name: "Ethernet1/5.200"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "ExpressRoute secondary, private peering VLAN 200"
      parent_interface: ["dc90-edge-01", "Ethernet1/5"]
      vrf: ["DC90", "PROD"]
      ip_address: {data: {address: "10.255.128.4/31", ip_namespace: "PROD"}}
    - name: "Ethernet1/6.300"
      device: "dc90-edge-01"
      role: saas
      status: active
      description: "Webex private peering, VLAN 300"
      parent_interface: ["dc90-edge-01", "Ethernet1/6"]
      vrf: ["DC90", "PROD"]
      ip_address: {data: {address: "10.255.128.6/31", ip_namespace: "PROD"}}
    - name: "Tunnel1"
      device: "dc90-edge-01"
      role: cloud
      status: active
      description: "AWS site-to-site VPN tunnel 1 (source: the internet port)"
      ip_address: {data: {address: "169.254.10.2/30", ip_namespace: "PROD"}}
    - name: "Tunnel2"
      device: "dc90-edge-01"
      role: saas
      status: active
      description: "Zscaler tunnel"
      ip_address: {data: {address: "169.254.10.6/30", ip_namespace: "PROD"}}
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "dc90-edge-01-bgp"
      status: active
      process_role: overlay
      local_as: "AS4200090001"
      router_id: ["10.90.255.1/32", "PROD"]
      capabilities: ["dc90-edge-01"]
    - name: "dc90-leaf-01-bgp"
      status: active
      process_role: overlay
      local_as: "AS4200090002"
      router_id: ["10.90.255.2/32", "PROD"]
      capabilities: ["dc90-leaf-01"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "BGP-DC90-LEAF01-EDGE01"
      description: "EVPN overlay between the leaf (owner of the segment SVI) and the edge"
      session_type: EBGP
      peering_role: overlay
      address_families:
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "dc90-leaf-01-bgp"
        - "dc90-edge-01-bgp"
