---
# Address space of the sample. Link ranges (/31, /30) sit in the Handoff-PROD-IPv4 resource of the bootstrap data
# (10.255.128.0/20): an object file cannot allocate from a pool, so each /31 is typed here at the place the pool would
# hand it out (the first free /31 at the time). The generator will take them with allocate_next_ip_prefix.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - {prefix: "10.90.1.0/24", ip_namespace: "PROD", status: active, description: "DC segment c900-demo-web-p"}
    - {prefix: "10.200.0.0/16", ip_namespace: "PROD", status: active, description: "AWS VPC block"}
    - {prefix: "10.201.0.0/16", ip_namespace: "PROD", status: active, description: "Azure VNet block"}
    - {prefix: "10.90.255.0/24", ip_namespace: "PROD", status: active, description: "DC90 loopbacks"}
    - {prefix: "10.255.128.0/31", ip_namespace: "PROD", status: active, description: "Link: AWS Direct Connect VIF"}
    - {prefix: "10.255.128.2/31", ip_namespace: "PROD", status: active, description: "Link: ExpressRoute primary"}
    - {prefix: "10.255.128.4/31", ip_namespace: "PROD", status: active, description: "Link: ExpressRoute secondary"}
    - {prefix: "10.255.128.6/31", ip_namespace: "PROD", status: active, description: "Link: Webex private peering"}
    - {prefix: "169.254.10.0/30", ip_namespace: "PROD", status: active, description: "Link: AWS VPN tunnel 1 (by AWS)"}
    - {prefix: "169.254.10.4/30", ip_namespace: "PROD", status: active, description: "Link: Zscaler tunnel"}
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - {address: "10.90.1.1/24", ip_namespace: "PROD", description: "Gateway of c900-demo-web-p"}
    - {address: "10.90.255.1/32", ip_namespace: "PROD", description: "dc90-edge-01 loopback"}
    - {address: "10.90.255.2/32", ip_namespace: "PROD", description: "dc90-leaf-01 loopback"}
    # Provider side of each leg (the connector's peer_ip). Our side is the sub-interface address, 03_edge.yml.
    - {address: "10.255.128.1/31", ip_namespace: "PROD", description: "AWS side of the Direct Connect VIF"}
    - {address: "10.255.128.3/31", ip_namespace: "PROD", description: "Microsoft side, ExpressRoute primary"}
    - {address: "10.255.128.5/31", ip_namespace: "PROD", description: "Microsoft side, ExpressRoute secondary"}
    - {address: "10.255.128.7/31", ip_namespace: "PROD", description: "Webex side"}
    - {address: "169.254.10.1/30", ip_namespace: "PROD", description: "AWS side of VPN tunnel 1"}
