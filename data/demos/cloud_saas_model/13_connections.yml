---
# The service requests. Each is the one object that ties a leg: intent (type, the two facilities, our port, namespace,
# owner, account, the pools) and, one-sided, what realizes it. ip_pool is the pool our side is addressed from
# (Handoff-PROD-IPv4: 10.255.128.0/20); asn_pool is the pool of our private AS (PRIVATE-ASN32) where a leg needs one.
# The object file cannot allocate from a pool, so the addresses and AS numbers of the realized objects are typed in
# 06_dc_routing.yml and 10_connectors.yml. A connection loads last: everything it points at exists.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnection
  data:
    - name: "PC-C900-AWS-DX-PROD"
      description: "Dedicated Direct Connect to AWS eu-central-1, transit VIF to tgw-c900-euc1"
      connection_type: direct_connect
      redundancy: single
      status: active
      bandwidth: 10000
      locations: ["DC90", "eu-central-1"]
      near_port: ["dc90-edge-01", "Ethernet1/3"]
      ip_namespace: "PROD"
      owner: "C900"
      account: "c900-aws-prod"
      ip_pool: "Handoff-PROD-IPv4"
      asn_pool: "PRIVATE-ASN32"
      carrier_circuits: ["XC-DC90-AWS-DX1"]
      session_circuits: ["SC-C900-AWS-DX-PROD"]
      cloud_direct_connect: "dx-c900-fra-1"
      cloud_virtual_interfaces: ["vif-c900-aws-transit"]
    - name: "PC-C900-AZ-ER-PRI"
      description: "ExpressRoute primary leg to Azure westeurope"
      connection_type: hosted
      redundancy: primary
      status: active
      bandwidth: 1000
      locations: ["DC90", "westeurope"]
      near_port: ["dc90-edge-01", "Ethernet1/4"]
      ip_namespace: "PROD"
      owner: "C900"
      account: "c900-azure-prod"
      ip_pool: "Handoff-PROD-IPv4"
      carrier_circuits: ["VC-DC90-AZ-ER-PRI"]
      session_circuits: ["SC-C900-AZ-ER-PRI"]
      cloud_direct_connect: "er-c900-weu-pri"
      cloud_virtual_interfaces: ["vif-c900-azure-pri"]
    - name: "PC-C900-AZ-ER-SEC"
      description: "ExpressRoute secondary leg to Azure westeurope"
      connection_type: hosted
      redundancy: secondary
      status: active
      bandwidth: 1000
      locations: ["DC90", "westeurope"]
      near_port: ["dc90-edge-01", "Ethernet1/5"]
      ip_namespace: "PROD"
      owner: "C900"
      account: "c900-azure-prod"
      ip_pool: "Handoff-PROD-IPv4"
      carrier_circuits: ["VC-DC90-AZ-ER-SEC"]
      session_circuits: ["SC-C900-AZ-ER-SEC"]
      cloud_direct_connect: "er-c900-weu-sec"
      cloud_virtual_interfaces: ["vif-c900-azure-sec"]
    - name: "PC-C900-AWS-VPN-PROD"
      description: "Site-to-site VPN to AWS eu-central-1 over the internet carrier"
      connection_type: vpn
      status: active
      bandwidth: 1000
      locations: ["DC90", "eu-central-1"]
      near_port: ["dc90-edge-01", "Ethernet1/2"]
      ip_namespace: "PROD"
      owner: "C900"
      account: "c900-aws-prod"
      ip_pool: "Handoff-PROD-IPv4"
      carrier_circuits: ["INET-DC90-ISP-DEMO"]
      session_circuits: ["SC-C900-AWS-VPN-1"]
      cloud_vpn_connection: "vpn-c900-aws-euc1"
    - name: "PC-C900-WEBEX-PROD"
      description: "Webex private peering over a cross-connect"
      connection_type: saas_private
      status: active
      bandwidth: 1000
      locations: ["DC90", "WEBEX-FRANKFURT"]
      near_port: ["dc90-edge-01", "Ethernet1/6"]
      ip_namespace: "PROD"
      owner: "C900"
      ip_pool: "Handoff-PROD-IPv4"
      carrier_circuits: ["XC-DC90-WEBEX-1"]
      session_circuits: ["SC-C900-WEBEX-PROD"]
      saas_connection: "saas-c900-webex-fra"
    - name: "PC-C900-ZSCALER-INET"
      description: "Zscaler tunnel over the internet carrier, no BGP"
      connection_type: saas_internet
      status: active
      bandwidth: 1000
      locations: ["DC90", "ZSCALER-MUNICH I"]
      near_port: ["dc90-edge-01", "Ethernet1/2"]
      ip_namespace: "PROD"
      owner: "C900"
      ip_pool: "Handoff-PROD-IPv4"
      carrier_circuits: ["INET-DC90-ISP-DEMO"]
      session_circuits: ["SC-C900-ZSCALER-TUN1"]
      saas_connection: "saas-c900-zscaler-muc"
