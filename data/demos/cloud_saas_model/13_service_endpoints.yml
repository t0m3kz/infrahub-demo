---
# Loaded after the SaaS regions (09_saas.yml). Private paths to a service: an S3 gateway endpoint (route) and a
# Webex endpoint (address, in the SaaS region).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudServiceEndpoint
  data:
    - name: "vpce-c900-s3"
      description: "Gateway endpoint to the object store of the provider"
      status: active
      service_name: "s3"
      access: route
      virtual_network: "vpc-c900-prod"
      provider: "P004"
      segments:
        - "c900-demo-subnet-p"
    - name: "vpce-c900-webex"
      description: "Interface endpoint to the Webex service"
      status: active
      service_name: "webex"
      access: address
      virtual_network: "vpc-c900-prod"
      provider: "P901"
      saas_region: "WEBEX-FRANKFURT"
