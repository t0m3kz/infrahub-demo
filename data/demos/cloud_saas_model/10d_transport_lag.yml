---
# The bundle of the Direct Connect ports (10c): both members are ports of the same transport. The virtual interfaces
# ride on the bundle, not on a member.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimLAGInterface
  data:
    - device: "dx-c900-fra-lag"
      name: "lag1"
      description: "AWS Direct Connect LAG: dxcon-1a and dxcon-1b"
      status: active
      lag_id: 1
      lacp_mode: active
      minimum_links: 1
      member_interfaces:
        - ["dx-c900-fra-lag", "dxcon-1a"]
        - ["dx-c900-fra-lag", "dxcon-1b"]
