---
# Three devices from bootstrap templates (their interfaces come with the template): a leaf, the edge that carries
# the cloud and SaaS legs, and the ISP router at the far end of the internet carrier. Nothing generated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "dc90-leaf-01"
      object_template: N9K-C9364C-GX_LEAF_MR
      description: "Leaf with the tenant segment on Ethernet1/1"
      deployment: "DC90"
    - name: "dc90-edge-01"
      object_template: N9K-C9316D-GX_EDGE
      description: "Edge: Ethernet1/3 AWS, 1/4-1/5 Azure, 1/6 Webex, 1/7 GCP, 1/2 internet, 1/13 towards the leaf"
      deployment: "DC90"
    - name: "EXT-ISP-DEMO-PE1"
      object_template: MX204_ISP_PE
      owner: "P014"
      description: "ISP router: far end of the internet carrier (VPN and Zscaler legs)"
      deployment: "ISP-DEMO"
