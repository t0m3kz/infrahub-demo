---
# The cloud side: AWS eu-central-1 and Azure westeurope (regions host nothing), one account each, a VPC with a
# subnet and an instance on AWS, a transit gateway with its VPC attachment, a VNet on Azure.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCloud
  data:
    - name: AWS
      parent: "Cloud"
      children:
        kind: TopologyCloudRegion
        data:
          - name: eu-central-1
            status: active
            children:
              kind: TopologyCloudZone
              data:
                - name: eu-central-1a
    - name: AZURE
      parent: "Cloud"
      children:
        kind: TopologyCloudRegion
        data:
          - name: westeurope
            status: active
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudAccount
  data:
    - name: "c900-aws-prod"
      account_id: "900000000001"
      environment: "p"
      provider: "P004"
      owner: "C900"
    - name: "c900-azure-prod"
      account_id: "90000000-0000-0000-0000-000000000002"
      environment: "p"
      provider: "P005"
      owner: "C900"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVirtualNetwork
  data:
    - name: "vpc-c900-prod"
      account: "c900-aws-prod"
      region: "eu-central-1"
      cidr_blocks:
        - ["10.200.0.0/16", "PROD"]
    - name: "vnet-c900-weu"
      account: "c900-azure-prod"
      region: "westeurope"
      cidr_blocks:
        - ["10.201.0.0/16", "PROD"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGateway
  data:
    - name: "tgw-c900-euc1"
      description: "Transit gateway of the C900 AWS account"
      status: active
      region: "eu-central-1"
      account: "c900-aws-prod"
      asn: "AS64512"
      attached_virtual_networks:
        - "vpc-c900-prod"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGatewayAttachment
  data:
    - name: "tgwa-c900-vpc"
      attachment_type: vpc
      transit_gateway: "tgw-c900-euc1"
      owner_account: "c900-aws-prod"
      virtual_network: "vpc-c900-prod"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      account: "c900-aws-prod"
      customer_name: "demo-aws"
      parent: "eu-central-1"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkSegment
  data:
    - owner: "C900"
      customer_name: "demo-subnet"
      environment: "p"
      segment_type: "aws_vpc_subnet"
      virtual_network: "vpc-c900-prod"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.200.1.0/24"
      customer_deployment: "C900-DEMO-AWS-EU-CENTRAL-1"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudInstance
  data:
    - name: "c900-app-euc1-1"
      cloud_id: "i-0c900app000001"
      status: active
      instance_type: "m6i.large"
      os_type: linux
      private_ip: "10.200.1.11/24"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      account: "c900-aws-prod"
      network_segment: "c900-demo-subnet-p"
