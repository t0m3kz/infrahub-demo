---
# The cloud side: AWS eu-central-1 and Azure westeurope (regions host nothing), one account each, a VPC with a
# subnet and an instance on AWS, a transit gateway with its VPC attachment, a VNet on Azure, an IPsec profile.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCloud
  data:
    - name: AWS
      parent: "Cloud"
      children:
        kind: TopologyCloudRegion
        data:
          - name: eu-central-1
            status: active
            children:
              kind: TopologyCloudZone
              data:
                - name: eu-central-1a
    - name: AZURE
      parent: "Cloud"
      children:
        kind: TopologyCloudRegion
        data:
          - name: westeurope
            status: active
    - name: GCP
      parent: "Cloud"
      children:
        kind: TopologyCloudRegion
        data:
          - name: europe-west3
            status: active
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudAccount
  data:
    - name: "c900-aws-prod"
      account_id: "900000000001"
      environment: "p"
      provider: "P004"
      owner: "C900"
    - name: "c900-azure-prod"
      account_id: "90000000-0000-0000-0000-000000000002"
      environment: "p"
      provider: "P005"
      owner: "C900"
    - name: "c900-gcp-prod"
      account_id: "c900-prod-project"
      environment: "p"
      provider: "P006"
      owner: "C900"
    # The partner's account: a hosted connection lives there while its peerings are in the customer's account.
    - name: "partner-fabric-gcp"
      account_id: "partner-fabric-project"
      environment: "p"
      provider: "P016"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVirtualNetwork
  data:
    - name: "vpc-c900-prod"
      account: "c900-aws-prod"
      region: "eu-central-1"
      cidr_blocks:
        - ["10.200.0.0/16", "PROD"]
    - name: "vnet-c900-weu"
      account: "c900-azure-prod"
      region: "westeurope"
      cidr_blocks:
        - ["10.201.0.0/16", "PROD"]
    - name: "vpc-c900-gcp"
      account: "c900-gcp-prod"
      region: "europe-west3"
      cidr_blocks:
        - ["10.202.0.0/16", "PROD"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityIPsecProfile
  data:
    - name: "IPSEC-AES256-SHA256-DH14"
      description: "IKEv2 AES-256 SHA-256 DH14, ESP AES-256 SHA-256 with PFS 14 (the AWS VPN tunnel options)"
      status: active
      ike_version: ikev2
      ike_encryption: aes256
      ike_integrity: sha256
      ike_dh_group: 14
      ike_lifetime: 28800
      esp_encryption: aes256
      esp_integrity: sha256
      pfs_group: 14
      esp_lifetime: 3600
---
# The bundle of the AWS Direct Connect ports: two member ports (11_circuits.yml) ride on it, the virtual interfaces ride
# on the bundle, not on a member.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudDirectConnect
  data:
    - name: "dx-c900-fra-lag"
      description: "AWS Direct Connect LAG: two dedicated 10G ports"
      status: active
      connection_type: physical
      bandwidth: 20000
      account: "c900-aws-prod"
      region: "eu-central-1"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGateway
  data:
    - name: "tgw-c900-euc1"
      description: "Transit gateway of the C900 AWS account"
      status: active
      region: "eu-central-1"
      account: "c900-aws-prod"
      asn: "AS64512"
      attached_virtual_networks:
        - "vpc-c900-prod"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGatewayAttachment
  data:
    - name: "tgwa-c900-vpc"
      attachment_type: vpc
      transit_gateway: "tgw-c900-euc1"
      owner_account: "c900-aws-prod"
      virtual_network: "vpc-c900-prod"
---
# The cloud edge gateways, in the neutral vocabulary (the operator word is in the name):
#   cloud_edge_gateway  where a peering lands in the provider: dxgw (AWS Direct Connect Gateway, associated with the
#                       transit gateway), ergw (Azure ExpressRoute Gateway, in the VNet), cr (GCP Cloud Router)
#   vpn_gateway         vgw (AWS virtual private gateway, attached to the VPC)
#   customer_gateway    cgw (OUR side of the VPN: public address and AS)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudGateway
  data:
    - name: "dxgw-c900"
      description: "AWS Direct Connect Gateway, associated with the transit gateway"
      status: active
      gateway_type: cloud_edge_gateway
      account: "c900-aws-prod"
      region: "eu-central-1"
      transit_gateway: "tgw-c900-euc1"
    - name: "vgw-c900-euc1"
      description: "AWS virtual private gateway, attached to the VPC"
      status: active
      gateway_type: vpn_gateway
      account: "c900-aws-prod"
      region: "eu-central-1"
      virtual_network: "vpc-c900-prod"
    - name: "cgw-c900-dc90"
      description: "AWS customer gateway: the public address and AS of dc90-edge-01"
      status: active
      gateway_type: customer_gateway
      ip_address: "198.51.100.10/32"
      asn: 4200090001
      account: "c900-aws-prod"
      region: "eu-central-1"
    - name: "ergw-c900-weu"
      description: "Azure ExpressRoute Gateway in the VNet"
      status: active
      gateway_type: cloud_edge_gateway
      account: "c900-azure-prod"
      region: "westeurope"
      virtual_network: "vnet-c900-weu"
    - name: "cr-c900-euw3"
      description: "GCP Cloud Router in the VPC"
      status: active
      gateway_type: cloud_edge_gateway
      account: "c900-gcp-prod"
      region: "europe-west3"
      virtual_network: "vpc-c900-gcp"
---
# The VPN transport: no physical object, it holds the tunnels (two peering interfaces, 11_circuits.yml). Its provider
# side is the transit gateway (a virtual private gateway would be `gateway:`), its customer side our customer gateway.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVPNConnection
  data:
    - name: "vpn-c900-aws-euc1"
      description: "AWS site-to-site VPN: two tunnels, BGP inside each /30"
      status: active
      account: "c900-aws-prod"
      region: "eu-central-1"
      customer_gateway: "cgw-c900-dc90"
      transit_gateway: "tgw-c900-euc1"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C900"
      account: "c900-aws-prod"
      customer_name: "demo-aws"
      parent: "eu-central-1"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkSegment
  data:
    - owner: "C900"
      customer_name: "demo-subnet"
      environment: "p"
      segment_type: "cloud_subnet"
      virtual_network: "vpc-c900-prod"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      cidr_block: "10.200.1.0/24"
      customer_deployment: "C900-DEMO-AWS-EU-CENTRAL-1"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudInstance
  data:
    - name: "c900-app-euc1-1"
      cloud_id: "i-0c900app000001"
      status: active
      instance_type: "m6i.large"
      os_type: linux
      private_ip: "10.200.1.11/24"
      availability_zone: ["eu-central-1", "eu-central-1a"]
      account: "c900-aws-prod"
      network_segment: "c900-demo-subnet-p"
