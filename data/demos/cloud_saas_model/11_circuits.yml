---
# The circuits of the legs. A circuit ends on interfaces through ONE edge, `capabilities` (the shared interface edge,
# min 1, max 2): an interface of ours and an interface of the other side, given by its HFID `[device, interface]`. The
# far end of a carrier is a port of a transport (10c), the far end of a session is a peering interface of it (10e), so
# the transports and their interfaces exist by now (earlier files) and nothing is created here. `locations` are
# authored here (no generator derives them on the throwaway branch).
#
# Carrier circuits are the physical wire: our edge port to the provider's port. Session circuits are the routing on
# top: handoff (BGP) for the private legs, vpn for the two AWS tunnels, tunnel for Zscaler. peer_ip and peer_asn are
# the PROVIDER side of the leg (on the peering interface); our side is the sub-interface address of 06_dc_routing.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - name: XC-DC90-AWS-DX1
      circuit_id: XC-DC90-AWS-DX1
      description: Cross-connect from dc90-edge-01 to the first AWS Direct Connect port of the LAG
      provider: P004
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      locations:
        - DC90
        - eu-central-1
      capabilities:
        - ["dc90-edge-01", "Ethernet1/3"]
        - ["dx-c900-fra-lag", "dxcon-1a"]
    - name: XC-DC90-AWS-DX2
      circuit_id: XC-DC90-AWS-DX2
      description: Cross-connect from dc90-edge-01 to the second AWS Direct Connect port of the LAG
      provider: P004
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      locations:
        - DC90
        - eu-central-1
      capabilities:
        - ["dc90-edge-01", "Ethernet1/8"]
        - ["dx-c900-fra-lag", "dxcon-1b"]
    - name: VC-DC90-AZ-ER-PRI
      circuit_id: VC-DC90-AZ-ER-PRI
      description: Virtual connection to the ExpressRoute circuit, primary link
      provider: P016
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      locations:
        - DC90
        - westeurope
      capabilities:
        - ["dc90-edge-01", "Ethernet1/4"]
        - ["er-c900-weu", "msee-pri"]
    - name: VC-DC90-AZ-ER-SEC
      circuit_id: VC-DC90-AZ-ER-SEC
      description: Virtual connection to the ExpressRoute circuit, secondary link
      provider: P016
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      locations:
        - DC90
        - westeurope
      capabilities:
        - ["dc90-edge-01", "Ethernet1/5"]
        - ["er-c900-weu", "msee-sec"]
    - name: VC-DC90-GCP-IC1
      circuit_id: VC-DC90-GCP-IC1
      description: Virtual connection to the Google Partner Interconnect
      provider: P016
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      locations:
        - DC90
        - europe-west3
      capabilities:
        - ["dc90-edge-01", "Ethernet1/7"]
        - ["ic-c900-fra-1", "ic-port-1"]
    - name: XC-DC90-GCP-DED1
      circuit_id: XC-DC90-GCP-DED1
      description: Cross-connect to the Google Dedicated Interconnect port (routed port on both ends, no VLAN)
      provider: P006
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      locations:
        - DC90
        - europe-west3
      capabilities:
        - ["dc90-edge-01", "Ethernet1/9"]
        - ["ic-ded-c900-fra", "ic-dedicated-port"]
    - name: XC-DC90-WEBEX-1
      circuit_id: XC-DC90-WEBEX-1
      description: Cross-connect to the Webex peering point
      provider: P901
      circuit_type: cross_connect
      status: active
      bandwidth: 1000
      locations:
        - DC90
        - WEBEX-FRANKFURT
      capabilities:
        - ["dc90-edge-01", "Ethernet1/6"]
        - ["webex-c900-fra-xc", "wbx-port-1"]
    - name: INET-DC90-ISP-DEMO
      circuit_id: INET-DC90-ISP-DEMO
      description: Internet access of dc90-edge-01 (carries the VPN tunnels and the Zscaler tunnel)
      provider: P014
      circuit_type: internet
      status: active
      bandwidth: 1000
      locations:
        - DC90
        - ISP-DEMO
      capabilities:
        - ["dc90-edge-01", "Ethernet1/2"]
        - ["EXT-ISP-DEMO-PE1", "et-0/0/0"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    # AWS Direct Connect, transit: virtual interface (scope private) -> Direct Connect Gateway -> transit gateway.
    - name: SC-C900-AWS-DX-PROD
      description: 'Handoff: edge sub-interface to the transit virtual interface'
      provider: P004
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 10.255.128.0/31
        - PROD
      locations:
        - DC90
        - eu-central-1
      capabilities:
        - ["dc90-edge-01", "Ethernet1/3.1000"]
        - ["dx-c900-fra-lag", "lag1.1000"]
    # AWS Direct Connect, private: virtual interface (scope private) -> virtual private gateway -> VPC.
    - name: SC-C900-AWS-DX-PRIV
      description: 'Handoff: edge sub-interface to the private virtual interface'
      provider: P004
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 10.255.128.2/31
        - PROD
      locations:
        - DC90
        - eu-central-1
      capabilities:
        - ["dc90-edge-01", "Ethernet1/3.1100"]
        - ["dx-c900-fra-lag", "lag1.1100"]
    # Azure ExpressRoute: ONE transport (the circuit), two peerings, a /30 each, both on the ExpressRoute Gateway.
    - name: SC-C900-AZ-ER-PRI
      description: 'Handoff: edge sub-interface to the primary private peering'
      provider: P005
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 10.255.128.8/30
        - PROD
      locations:
        - DC90
        - westeurope
      capabilities:
        - ["dc90-edge-01", "Ethernet1/4.200"]
        - ["er-c900-weu", "er-c900-weu-pri"]
    - name: SC-C900-AZ-ER-SEC
      description: 'Handoff: edge sub-interface to the secondary private peering'
      provider: P005
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 10.255.128.12/30
        - PROD
      locations:
        - DC90
        - westeurope
      capabilities:
        - ["dc90-edge-01", "Ethernet1/5.200"]
        - ["er-c900-weu", "er-c900-weu-sec"]
    # GCP Partner Interconnect: VLAN attachment (scope private) -> Cloud Router -> VPC.
    - name: SC-C900-GCP-IC
      description: 'Handoff: edge sub-interface to the VLAN attachment'
      provider: P006
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 169.254.20.0/29
        - PROD
      locations:
        - DC90
        - europe-west3
      capabilities:
        - ["dc90-edge-01", "Ethernet1/7.400"]
        - ["ic-c900-fra-1", "gcp-c900-vlan-att-1"]
    # GCP Dedicated Interconnect: a ROUTED PORT leg. Both ends are physical interfaces with an address and no VLAN
    # (Ethernet1/9 carries 169.254.30.2/29 itself, no sub-interface).
    - name: SC-C900-GCP-DED
      description: 'Handoff on a routed port: edge Ethernet1/9 to the Cloud Router peering, no VLAN'
      provider: P006
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 169.254.30.0/29
        - PROD
      locations:
        - DC90
        - europe-west3
      capabilities:
        - ["dc90-edge-01", "Ethernet1/9"]
        - ["ic-ded-c900-fra", "gcp-c900-ded-1"]
    - name: SC-C900-WEBEX-PROD
      description: 'Handoff: edge sub-interface to the Webex peering'
      provider: P901
      circuit_type: handoff
      status: active
      ip_namespace: PROD
      link_prefix:
        - 10.255.128.6/31
        - PROD
      locations:
        - DC90
        - WEBEX-FRANKFURT
      capabilities:
        - ["dc90-edge-01", "Ethernet1/6.300"]
        - ["webex-c900-fra-xc", "webex-c900-fra"]
    # AWS site-to-site VPN: ONE transport (the VPN connection), two tunnels, each a peering and the end of its own
    # session circuit, BGP inside a /30 each. The provider side (transit gateway) is on the transport.
    - name: SC-C900-AWS-VPN-1
      description: VPN tunnel 1 from the edge to the AWS VPN connection
      provider: P004
      circuit_type: vpn
      status: active
      ip_namespace: PROD
      link_prefix:
        - 169.254.10.0/30
        - PROD
      locations:
        - DC90
        - eu-central-1
      capabilities:
        - ["dc90-edge-01", "Tunnel1"]
        - ["vpn-c900-aws-euc1", "Tunnel1"]
    - name: SC-C900-AWS-VPN-2
      description: VPN tunnel 2 from the edge to the AWS VPN connection
      provider: P004
      circuit_type: vpn
      status: active
      ip_namespace: PROD
      link_prefix:
        - 169.254.10.4/30
        - PROD
      locations:
        - DC90
        - eu-central-1
      capabilities:
        - ["dc90-edge-01", "Tunnel2"]
        - ["vpn-c900-aws-euc1", "Tunnel2"]
    - name: SC-C900-ZSCALER-TUN1
      description: Tunnel to the Zscaler enforcement node, no BGP
      provider: P030
      circuit_type: tunnel
      status: active
      locations:
        - DC90
        - ZSCALER-MUNICH I
      capabilities:
        - ["dc90-edge-01", "Tunnel3"]
        - ["zscaler-c900-muc", "Tunnel1"]
