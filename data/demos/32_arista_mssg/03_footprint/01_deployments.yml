---
# The tenant's production footprint in DC14 (PROD VRF), MSSG1-P-DC14, which the segments reference. Membership of
# customer_deployments_dc is required: the created-trigger dispatches
# add_customer_deployment_dc, which raises for non-members.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "MSSG1"
      environment: "p"
      parent: "DC14"
      design: "M_DC"
      member_of_groups: [customer_deployments_dc]
