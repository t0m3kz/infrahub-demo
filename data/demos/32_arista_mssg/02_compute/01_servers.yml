---
# DC14 POD-1 application hosts, one per row. PowerEdge-R640_SERVER brings two 25G uplink NICs
# (eno1/eno2); add_endpoint dual-homes them across the switch pair of the network rack that shares
# the host's row: the access-leaf pair in row 1, the leaf pair in row 2 (a row with no access-leaf
# falls back to its leafs). That is what puts the tenant VRF on BOTH tiers, and a VTEP renders
# `router segment-security` only when it carries a tenant VRF. Loaded after ../01_fabric/ has settled:
# the switch ports must exist when the endpoint generator looks for them.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: dc14-pod1-server-1
      object_template: PowerEdge-R640_SERVER
      owner: "MSSG1"
      rack: rom-1-s-1-r-1-1
      status: active
      position: 10
      platform: linux
      description: "DC14 POD-1 row 1 application host (access-leaf pair)"
      member_of_groups:
        - endpoints

    - name: dc14-pod1-server-2
      object_template: PowerEdge-R640_SERVER
      owner: "MSSG1"
      rack: rom-1-s-1-r-2-1
      status: active
      position: 10
      platform: linux
      description: "DC14 POD-1 row 2 application host (leaf pair)"
      member_of_groups:
        - endpoints
