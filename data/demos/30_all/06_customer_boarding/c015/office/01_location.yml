---
# Office footprint for C015 (Novantis), the isolated-route-table counterpart to
# c003/office/.
#
# C015's TGW attachment sits on rt-hub-isolated, so its office reaches on-prem
# and AWS but no other tenant. Two spokes with deliberately different route-table
# placement is what makes an edit to rt-hub-shared reach wider than one to
# rt-hub-isolated.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: "Paris Office"
      shortname: "par-office"
      parent: "par"
