---
# VPC aggregate (CIDR block) of the virtual network below, registered in the PROD
# VRF of its account (environment p). The subnet CIDR stays Text on the segment
# and must lie inside this block; the PROD namespace is never per-customer.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.40.0.0/16"
      ip_namespace: "PROD"
      status: active
