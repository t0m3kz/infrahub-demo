---
# Virtual network (VNet) for C004 in Azure westeurope.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVirtualNetwork
  data:
    - name: "peakora-vnet-prod"
      account: "peakora-azure-prod"
      region: "westeurope"
      is_default: false
      dns_support: true
      dns_hostnames: true
