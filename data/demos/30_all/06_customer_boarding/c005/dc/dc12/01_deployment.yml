---
# Customer C005 production footprint in DC12 (data/demos/30_all/03_dc/dc12/).
# TopologyCustomerDC's parent is the data center itself, not a pod: the
# customer's presence spans the whole fabric.
#
# design links to one of the S_DC/M_DC/L_DC/XL_DC boarding blueprints of
# data/bootstrap/21_customer_templates.yml.
#
# name is a computed attribute ({owner_org_id}-{environment}-{parent}) —
# read-only, do not set it explicitly.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C005"
      environment: "p"
      infrastructure_orchestrator: ansible_automation_platform
      parent: "DC12"
      design: "L_DC"
      member_of_groups:
        - customer_deployments_dc
