---
# C005 payment-core instances running in DC12 — the second leg of the two
# dc_pair-stretched segments, plus the DC12-local database tier. They run on
# C005's own prod hosts dc12-pod1-server-3 (row 1) and server-4 (row 2), never
# on the shared P027 non-prod hosts server-1/2 (../../../../03_dc/dc12/05_servers.yml):
# prod and non-prod never share a hypervisor.
# See ../dc10/02_instances.yml for the placement rationale and for why the VMs
# are filed here rather than under 03_dc/dc12/.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: c005-order-db-dc12-1
      object_template: LINUX-SVC
      hosting_device: dc12-pod1-server-3
      deployment: "C005-P-DC12"

    - name: c005-order-db-dc12-2
      object_template: LINUX-SVC
      hosting_device: dc12-pod1-server-4
      deployment: "C005-P-DC12"

    - name: c005-app-backend-dc12-1
      object_template: LINUX-SVC
      hosting_device: dc12-pod1-server-3
      deployment: "C005-P-DC12"

    - name: c005-event-bus-dc12-1
      object_template: LINUX-SVC
      hosting_device: dc12-pod1-server-4
      deployment: "C005-P-DC12"
