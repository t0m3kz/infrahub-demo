---
# No lan_prefixes: the office hosts its LAN itself, as the office-lan segment
# (../../../07_applications/c005/00_segments.yml), whose /24 comes from the
# tenant pool. The routes this office may announce into PROD over the SD-WAN VRF
# handoff (../../../08_interconnects/04_sdwan/06_vrf_handoff.yml) are derived
# from the segments it hosts (get_external_peer_prefixes).
#
# sdwan_gateway opts this office into add_sdwan_edge at creation, as C002's
# does (../../c002/office/02_deployment.yml). The office reaches the stretched
# colo-services-stretch segment over the gateway's PROD handoff into eg-fr201
# (../../../08_interconnects/04_sdwan/06_vrf_handoff.yml), so L3 VRF rather
# than an L2 extension.
#
# fabric_templates is the whole input of an office fabric (add_office_fabric,
# generators/topology/office_fabric.py): a distribution pair and an access pair
# of Catalyst 9000 (cisco_xe) design elements. Pools, device names, ports,
# cabling, the OSPF area, the loopbacks and the LISP site key are all derived.
# C005 is the only office with a fabric; the others stay a single SD-WAN edge.
# Both sdwan_gateway and fabric_templates are set, so the fabric also gets its WAN exit
# to C005-OFFICE-EDGE1: each distribution-switch is cabled to the edge and peers with it over
# eBGP in VRF PROD (same shape as the gateway's handoff in
# ../../../08_interconnects/04_sdwan/06_vrf_handoff.yml, but generated): the tag, the
# addresses, the AS numbers and the key are all derived, nothing more is declared here.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerOffice
  data:
    - owner: "C005"
      parent: "Campus and Office"
      locations: ["ams-branch"]
      member_of_groups: [customer_deployments_office]
      sdwan_gateway: "EQX-FR2-SDWAN-GW1"
      branch_to_branch: full_mesh
      # yamllint disable-line rule:line-length
      fabric_templates: [["2", "distribution-switch", "C9500-32C_DISTRIBUTION"], ["2", "access-switch", "C9300-48UXM_ACCESS_SWITCH"]]
