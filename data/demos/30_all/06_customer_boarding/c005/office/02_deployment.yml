---
# The Amsterdam Branch LAN, registered in the PROD VRF because the footprint
# below is environment p (the shared namespace, never a per-customer one).
# 10.210.0.0/16 is reserved for office LANs (10.210.<customer>.0/24) and
# collides with no on-prem segment, VPC aggregate or pool in data/. These
# lan_prefixes are the routes this office may announce into PROD over the
# SD-WAN VRF handoff (../../../08_interconnects/04_sdwan/06_vrf_handoff.yml).
# Created first: the footprint references it by its [prefix, namespace] hfid.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.210.5.0/24"
      ip_namespace: "PROD"
      status: active
      description: "C005 Amsterdam Branch office LAN"
---
# name is computed ({parent_owner_org_id}-{environment}) — read-only.
#
# sdwan_gateway opts this office into add_sdwan_edge at creation, as C002's
# does (../../c002/office/02_deployment.yml). The office reaches the stretched
# colo-services-stretch segment over the gateway's PROD handoff into eg-fr01
# (../../../08_interconnects/04_sdwan/06_vrf_handoff.yml), so L3 VRF rather
# than an L2 extension.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyOfficeCustomer
  data:
    - owner: "C005"
      parent: "Campus and Office"
      children:
        - kind: TopologyCustomerOffice
          data:
            environment: "p"
            locations:
              - "ams-branch"
            lan_prefixes:
              - ["10.210.5.0/24", "PROD"]
            member_of_groups:
              - customer_deployments_office
            sdwan_gateway: "EQX-FR2-SDWAN-GW1"
            branch_to_branch: full_mesh
