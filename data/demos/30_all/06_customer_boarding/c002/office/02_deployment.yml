# The Marseille Branch LAN, registered in the PROD routing zone (an office is always
# PROD; 10.210.<customer>.0/24). Created first: the footprint references it by
# its [prefix, namespace] hfid.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.210.2.0/24"
      ip_namespace: "default"
      status: active
      description: "C002 Marseille Branch office LAN"
