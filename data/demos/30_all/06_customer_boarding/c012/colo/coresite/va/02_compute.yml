---
# C012's cage kit in CoreSite VA1 — same shape as
# ../../../../c011/colo/coresite/ny/02_compute.yml, see there for the why.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "CS-VA1-SW1"
      object_template: PowerSwitch-S5224F-ON_ACCESS
      owner: "C012"
      status: active
      rack: va1-s1-r-1
      position: 40
      deployment: "VA1"
      description: "C012 CoreSite VA1 cage access switch"

    - name: "cs-va1-server-1"
      object_template: PowerEdge-R640_SERVER
      owner: "C012"
      status: active
      rack: va1-s1-r-1
      position: 10
      platform: linux
      deployment: "VA1"
      description: "C012 CoreSite VA1 application host"

    - name: "cs-va1-server-2"
      object_template: PowerEdge-R640_SERVER
      owner: "C012"
      status: active
      rack: va1-s1-r-1
      position: 12
      platform: linux
      deployment: "VA1"
      description: "C012 CoreSite VA1 application host"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-CS-VA1-SRV1-1"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-va1-server-1"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-VA1-SW1"
            name: "Ethernet1/1/1"

    - name: "CBL-CS-VA1-SRV1-2"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-va1-server-1"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-VA1-SW1"
            name: "Ethernet1/1/2"

    - name: "CBL-CS-VA1-SRV2-1"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-va1-server-2"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-VA1-SW1"
            name: "Ethernet1/1/3"

    - name: "CBL-CS-VA1-SRV2-2"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-va1-server-2"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-VA1-SW1"
            name: "Ethernet1/1/4"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVlanSegment
  data:
    - owner: "C012"
      environment: "p"
      customer_name: "nordix-prod"
      interface_capabilities:
        - ["CS-VA1-SW1", "Ethernet1/1/1"]
        - ["CS-VA1-SW1", "Ethernet1/1/2"]
        - ["CS-VA1-SW1", "Ethernet1/1/3"]
        - ["CS-VA1-SW1", "Ethernet1/1/4"]

---
# payment-edge instances, one of each component per host.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: c012-payment-ui-va1-1
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-va1-server-1
      deployment: "C012-P-VA"

    - name: c012-payment-ui-va1-2
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-va1-server-2
      deployment: "C012-P-VA"

    - name: c012-payment-engine-va1-1
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-va1-server-1
      deployment: "C012-P-VA"

    - name: c012-payment-engine-va1-2
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-va1-server-2
      deployment: "C012-P-VA"
