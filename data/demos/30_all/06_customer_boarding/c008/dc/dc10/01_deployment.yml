---
# Customer C008 production footprint in DC10, the second production tenant on
# the fabric next to C005 (and C007). Its trade-portal application
# (../../../../07_applications/c008/) calls C005's payment API, the one
# cross-customer flow in DC10: an approved AppDependency, so exactly one rule
# (and so one group contract) crosses the two customers' segments, and every
# other flow between them is denied (transforms/helpers/group_policy.py).
#
# design M_DC: no dedicated firewall, so DC10's shared context serves it,
# like C005-P-DC10.
#
# name is a computed attribute ({owner_org_id}-{environment}-{parent}) —
# read-only, do not set it explicitly.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C008"
      environment: "p"
      status: active
      infrastructure_orchestrator: github_actions
      parent: "DC10"
      design: "M_DC"
      member_of_groups:
        - customer_deployments_dc
