---
# C008 inventory-sync dev instances on the shared DC12 hosts. Every tier runs
# on both hosts, one per row, so neither access-leaf pair is a single point of
# failure. See ../../../c005/dc/dc10/02_instances.yml for why the VMs are
# filed next to their deployment.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: c008-sync-api-dc12-1
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-1
      deployment: "C008-D-DC12"

    - name: c008-sync-api-dc12-2
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-2
      deployment: "C008-D-DC12"

    - name: c008-sync-db-dc12-1
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-1
      deployment: "C008-D-DC12"

    - name: c008-sync-db-dc12-2
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-2
      deployment: "C008-D-DC12"
