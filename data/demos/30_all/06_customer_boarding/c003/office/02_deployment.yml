---
# name is computed ({parent_owner_org_id}-{environment}) — read-only.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyOfficeCustomer
  data:
    - owner: "C003"
      parent: "Campus and Office"
      children:
        - kind: TopologyCustomerOffice
          data:
            environment: "p"
            locations:
              - "muc-hq"
            member_of_groups:
              - customer_deployments_office
            # Opts into add_sdwan_edge (generators/topology/sdwan_edge.py), which
            # builds this office's edge, internet underlay and tunnel to GW1.
            sdwan_gateway: "EQX-FR2-SDWAN-GW1"
