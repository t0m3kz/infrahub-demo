---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerOffice
  data:
    - owner: "C003"
      parent: "Campus and Office"
      locations: ["muc-hq"]
      member_of_groups: [customer_deployments_office]
      # add_office_fabric (generators/office/office_fabric.py) builds the office's SD-WAN edge from the
      # sdwan-edge entry and one tunnel per gateway; the edge's internet access INET-<office> is data
      # (../../../08_interconnects/05_office_internet/01_circuits.yml).
      sdwan_gateways:
        - "EQX-FR2-SDWAN-GW1"
        - "EQX-PA4-SDWAN-GW1"
      fabric_templates: [["1", "sdwan-edge", "VCE-610_EDGE"]]
