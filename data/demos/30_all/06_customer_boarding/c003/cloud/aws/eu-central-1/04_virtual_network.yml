---
# Virtual network (VPC) for C003 in AWS eu-central-1.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudVirtualNetwork
  data:
    - name: "vaultex-vpc-prod"
      account: "vaultex-aws-prod"
      region: "eu-central-1"
      is_default: false
      dns_support: true
      dns_hostnames: true
      cidr_blocks:
        - ["10.30.0.0/16", "PROD"]
