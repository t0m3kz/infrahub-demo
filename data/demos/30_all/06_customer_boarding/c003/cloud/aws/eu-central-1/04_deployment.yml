---
# C003 cloud footprint in eu-central-1 (data/demos/11_cloud/), named C003-P-VAULTEX-AWS-EU-CENTRAL-1.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C003"
      environment: "p"
      account: "vaultex-aws-prod"
      customer_name: "vaultex-aws"
      parent: "eu-central-1"
      design: "S"
      # Loaded after its virtual networks (03_virtual_network.yml): the boarding attaches the networks it finds.
      # Attached to the shared hub of its region and environment (01_cloud/aws/04_hub_gateways.yml) by
      # add_customer_deployment_cloud: its own route table on the hub and one attachment per virtual network.
      connection: transit
      member_of_groups: [customer_deployments_cloud]
