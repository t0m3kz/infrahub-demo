---
# C001 colocation footprint in the FR metro (data/demos/10_colocation/).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerColocation
  data:
    - owner: "C001"
      environment: "p"
      parent: "FR"
      # FR2 holds the metro's firewall pair, so this footprint's FirewallContext lives there
      serving_zone: "FR2"
      member_of_groups: [customer_deployments_colocation]
