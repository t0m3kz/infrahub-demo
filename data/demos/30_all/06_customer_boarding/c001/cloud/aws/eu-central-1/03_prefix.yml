# The same prefix object is the destination of rule 10 of seg-c001-nordix-prod-p-egress
# (../../../../../08_interconnects/07_zone_policies/05_security_policy.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.10.0.0/16"
      ip_namespace: "PROD"
      status: active
