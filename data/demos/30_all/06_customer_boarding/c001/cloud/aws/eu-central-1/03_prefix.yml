---
# VPC aggregate (CIDR block) of the virtual network below, registered in the PROD
# VRF of its account (environment p). The PROD routing zone is never per-customer.
# The same prefix object is the destination of rule 10 of seg-c001-nordix-prod-p-egress
# (../../../../../08_interconnects/07_zone_policies/05_security_policy.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - security_zone: "PROD"
      prefix: "10.10.0.0/16"
      ip_namespace: "default"
      status: active
    # nordix-vpc-vpn is reachable only behind the AWS Site-to-Site VPN;
    # C001 registers this second aggregate behind that session, also in PROD.
    - security_zone: "PROD"
      prefix: "10.20.0.0/16"
      ip_namespace: "default"
      status: active
