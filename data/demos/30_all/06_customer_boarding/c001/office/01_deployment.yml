---
# Customer C001 deployment footprint. TopologyCustomerOffice's parent is
# TopologyOfficeCustomer — a node grouping all of C001's office footprints
# (one per environment/building) directly under TopologyLabel ("Campus and
# Office"). owner lives on TopologyOfficeCustomer, not on CustomerOffice
# itself.
#
# locations peers LocationFacility specifically (not the LocationCampus*
# hierarchy used by ../../../05_office/waw-1/01_locations.yml for capacity
# planning) — waw-hq is its own LocationFacility under the same "waw" Metro,
# referenced by hfid so it doesn't duplicate the Metro row. Requires
# 05_office/ to load before 06_customer_boarding/ (alphabetical folder
# order) so the "waw" LocationMetro already exists.
#
# name is a computed attribute ({parent_owner_org_id}-{environment}) —
# read-only, do not set it explicitly.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: "Warsaw HQ"
      shortname: "waw-hq"
      parent: "waw"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyOfficeCustomer
  data:
    - owner: "C001"
      parent: "Campus and Office"
      children:
        - kind: TopologyCustomerOffice
          data:
            environment: "p"
            locations:
              - "waw-hq"
            member_of_groups:
              - customer_deployments_office
