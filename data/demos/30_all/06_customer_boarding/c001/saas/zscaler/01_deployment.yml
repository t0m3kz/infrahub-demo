---
# Customer C001 deployment footprint inside an existing SaaS provider region
# from data/demos/30_all/04_saas/. TopologyCustomerSaas's parent is the
# region (TopologySaasRegion), not the provider itself.
#
# Requires the corresponding region to already exist:
#   - ZSCALER-MUNICH I  <- data/demos/30_all/04_saas/zscaler/00_topology.yml
#
# name is a computed attribute ({owner_org_id}-{customer_name}-{environment}-
# {parent}) — read-only, do not set it explicitly. customer_name is a unique
# per-tenant identifier (SaaS footprints are named independently, same as
# cloud).

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerSaas
  data:
    - owner: "C001"
      customer_name: "nordix-zscaler"
      environment: "p"
      status: active
      tenant_id: "nordix-ltd"
      parent: "ZSCALER-MUNICH I"
      member_of_groups:
        - customer_deployments
