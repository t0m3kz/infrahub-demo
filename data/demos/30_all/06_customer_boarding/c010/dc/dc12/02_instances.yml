---
# C010 reporting-portal dev instances on the shared DC12 hosts. Every tier
# runs on both hosts, one per row, so neither access-leaf pair is a single
# point of failure. See ../../../c005/dc/dc10/02_instances.yml for why the VMs
# are filed next to their deployment.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: c010-portal-ui-dc12-1
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-1
      deployment: "C010-D-DC12"

    - name: c010-portal-ui-dc12-2
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-2
      deployment: "C010-D-DC12"

    - name: c010-report-worker-dc12-1
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-1
      deployment: "C010-D-DC12"

    - name: c010-report-worker-dc12-2
      object_template: LINUX-SVC
      status: active
      hosting_device: dc12-pod1-server-2
      deployment: "C010-D-DC12"
