---
# C011's cage kit in CoreSite NY1: one access switch and two application
# hosts, all customer-owned (this is the customer's own cage, unlike the
# shared Equinix on-ramp routers in ../../../../../08_interconnects/
# 01_colo_onramp/, which are Internal-owned).
#
# The switch is NOT in the access-leafs group and NOT in a DC pod, so no
# fabric generator or device check touches it — colocation kit is hand-modelled
# end to end, which is also why the cables below are declared explicitly
# instead of being left to add_endpoint (that generator needs
# rack.pod.deployment_type, and a TopologyColocationZone has none).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "CS-NY1-SW1"
      object_template: PowerSwitch-S5224F-ON_ACCESS
      owner: "C011"
      status: active
      rack: ny1-s1-r-1
      position: 40
      deployment: "NY1"
      description: "C011 CoreSite NY1 cage access switch"

    - name: "cs-ny1-server-1"
      object_template: PowerEdge-R640_SERVER
      owner: "C011"
      status: active
      rack: ny1-s1-r-1
      position: 10
      platform: linux
      deployment: "NY1"
      description: "C011 CoreSite NY1 application host"

    - name: "cs-ny1-server-2"
      object_template: PowerEdge-R640_SERVER
      owner: "C011"
      status: active
      rack: ny1-s1-r-1
      position: 12
      platform: linux
      deployment: "NY1"
      description: "C011 CoreSite NY1 application host"

---
# Both NICs of each host land on the single cage switch: NIC-level redundancy
# without switch-level redundancy. That is deliberate — a one-switch cage is
# the honest small-colocation shape, and it gives the change-risk check a
# genuine shared-fate example to contrast with the DC pods, where the two
# rows' access-leaf pairs are independent.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-CS-NY1-SRV1-1"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-ny1-server-1"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-NY1-SW1"
            name: "Ethernet1/1/1"

    - name: "CBL-CS-NY1-SRV1-2"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-ny1-server-1"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-NY1-SW1"
            name: "Ethernet1/1/2"

    - name: "CBL-CS-NY1-SRV2-1"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-ny1-server-2"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-NY1-SW1"
            name: "Ethernet1/1/3"

    - name: "CBL-CS-NY1-SRV2-2"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "cs-ny1-server-2"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "CS-NY1-SW1"
            name: "Ethernet1/1/4"

---
# C011's VLAN segment surfaces on the cage switch ports the hosts are cabled
# to, through interface_capabilities — the same ManagedGenericInterfaces
# mechanism the VXLAN segment generator uses in the DCs
# (generators/topology/segment.py's _assign_segment_to_dc_interfaces). Hand-
# written here because ManagedVlanSegment has no generator.
#
# Upserted by its uniqueness constraint (owner + environment + customer_name),
# so this extends the segment created in
# ../../../../../07_applications/c011/00_segment.yml rather than a second one.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVlanSegment
  data:
    - owner: "C011"
      environment: "p"
      customer_name: "nordix-prod"
      interface_capabilities:
        - ["CS-NY1-SW1", "Ethernet1/1/1"]
        - ["CS-NY1-SW1", "Ethernet1/1/2"]
        - ["CS-NY1-SW1", "Ethernet1/1/3"]
        - ["CS-NY1-SW1", "Ethernet1/1/4"]

---
# edge-analytics instances, one of each component per host.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: c011-edge-ingress-ny1-1
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-ny1-server-1
      deployment: "C011-P-NY"

    - name: c011-edge-ingress-ny1-2
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-ny1-server-2
      deployment: "C011-P-NY"

    - name: c011-stream-worker-ny1-1
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-ny1-server-1
      deployment: "C011-P-NY"

    - name: c011-stream-worker-ny1-2
      object_template: LINUX-SVC
      status: active
      hosting_device: cs-ny1-server-2
      deployment: "C011-P-NY"
