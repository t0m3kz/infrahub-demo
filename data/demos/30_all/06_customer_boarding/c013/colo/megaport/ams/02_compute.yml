---
# C013's cage kit in Megaport MCR-AMS1 — same shape as
# ../../../../c011/colo/coresite/ny/02_compute.yml, see there for the why.
#
# Unlike C011/C012 this reuses the rack that already exists for the zone
# (../../../../../02_colo/megaport/ams/03_racks.yml), so no new location data
# is needed here.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "MCR-AMS1-SW1"
      object_template: PowerSwitch-S5224F-ON_ACCESS
      owner: "C013"
      status: active
      rack: mcr-ams1-s1-r-1
      position: 40
      deployment: "MCR-AMS1"
      description: "C013 Megaport AMS1 cage access switch"

    - name: "mcr-ams1-server-1"
      object_template: PowerEdge-R640_SERVER
      owner: "C013"
      status: active
      rack: mcr-ams1-s1-r-1
      position: 10
      platform: linux
      deployment: "MCR-AMS1"
      description: "C013 Megaport AMS1 application host"
      member_of_groups:
        - endpoints

    - name: "mcr-ams1-server-2"
      object_template: PowerEdge-R640_SERVER
      owner: "C013"
      status: active
      rack: mcr-ams1-s1-r-1
      position: 12
      platform: linux
      deployment: "MCR-AMS1"
      description: "C013 Megaport AMS1 application host"
      member_of_groups:
        - endpoints

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-MCR-AMS1-SRV1-1"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "mcr-ams1-server-1"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "MCR-AMS1-SW1"
            name: "Ethernet1/1/1"

    - name: "CBL-MCR-AMS1-SRV1-2"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "mcr-ams1-server-1"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "MCR-AMS1-SW1"
            name: "Ethernet1/1/2"

    - name: "CBL-MCR-AMS1-SRV2-1"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "mcr-ams1-server-2"
            name: "eno1"
        - kind: DcimPhysicalInterface
          data:
            device: "MCR-AMS1-SW1"
            name: "Ethernet1/1/3"

    - name: "CBL-MCR-AMS1-SRV2-2"
      type: copper
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "mcr-ams1-server-2"
            name: "eno2"
        - kind: DcimPhysicalInterface
          data:
            device: "MCR-AMS1-SW1"
            name: "Ethernet1/1/4"

---
# fraud-detection instances, one of each component per host.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualDevice
  data:
    - name: c013-scoring-api-ams-1
      object_template: LINUX-SVC
      status: active
      hosting_device: mcr-ams1-server-1
      deployment: "C013-P-AMS"

    - name: c013-scoring-api-ams-2
      object_template: LINUX-SVC
      status: active
      hosting_device: mcr-ams1-server-2
      deployment: "C013-P-AMS"

    - name: c013-feature-cache-ams-1
      object_template: LINUX-SVC
      status: active
      hosting_device: mcr-ams1-server-1
      deployment: "C013-P-AMS"

    - name: c013-feature-cache-ams-2
      object_template: LINUX-SVC
      status: active
      hosting_device: mcr-ams1-server-2
      deployment: "C013-P-AMS"
