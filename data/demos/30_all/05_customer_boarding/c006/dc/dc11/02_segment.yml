---
# VXLAN segment activated in C006's DC footprint (DC2).
# VLAN ID + VNI are not set here — the add_vxlan_segment generator
# allocates them from DC2's vlan_pool/vni_pool (see 00_dc_fabric/) and
# creates the ManagedSegmentDeployment realization record.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - owner: "C006"
      customer_name: "lumivex-prod"
      environment: "p"
      customer_deployments: [["C006", "p"]]
