---
# Cloud subnet (CloudNetworkSegment) for C004 in Azure westeurope-1.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkSegment
  data:
    - owner: "C004"
      customer_name: "peakora-subnet-prod"
      environment: "p"
      segment_type: "azure_vnet_subnet"
      virtual_network: "peakora-vnet-prod"
      availability_zone: ["westeurope", "westeurope-1"]
      cidr_block: ["10.40.1.0/24", "default"]
      customer_deployment: ["C004", "p"]
