---
# The internet, as one topology: every ISP is a TopologyExternalProviders under
# the "Internet" label, so their provider edges sit together in one place
# instead of being scattered across the colocation metros they happen to meet
# us in. Lumen and Cogent sell transit to the cages (../08_interconnects/06_internet/);
# Orange is the access ISP of the SD-WAN offices (02_access_edge.yml).
#
# Foundation stage (not 08_interconnects), because add_sdwan_edge runs in the
# next stage and needs Orange and its access PE to already exist.
#
# Only the FR and PA cages buy transit. The DCs have no circuit of their own:
# they reach the internet over the dark fibre to their cage (DC10/DC11 via FR2,
# DC12 via PA4, see ../08_interconnects/01_colo_onramp/), so a DC -> internet trace runs DC ->
# cage edge -> transit circuit -> ISP provider edge and stops there.
#
# Two ISPs per metro, one per edge, so losing one carrier or one edge never
# takes a metro offline.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyExternalProviders
  data:
    - name: ISP-LUMEN
      parent: "Internet"
      status: active
      provider: "P014"
    - name: ISP-COGENT
      parent: "Internet"
      status: active
      provider: "P023"
    - name: ISP-ORANGE
      parent: "Internet"
      status: active
      provider: "P019"
