---
# C001 "checkout" application: a private-access frontend (gated by an access
# profile) that also calls the external payment gateway. Authored directly —
# no separate request/approval object graph; a branch + proposed-change review
# is the approval step for anything declared here.
#
# The frontend's fqdn is the name the ZTNA broker publishes it under. Who may
# open it is the access-profile dependency in 03_checkout_dependencies.yml;
# without it the broker does not publish the frontend.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: checkout
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: checkout.c001.demo.local
      ingress_mode: dns
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: frontend
            fqdn: checkout.internal.c001.demo.local
            component_type: frontend
            ports:
              - tcp/443
            member_of_groups:
              - app_components
