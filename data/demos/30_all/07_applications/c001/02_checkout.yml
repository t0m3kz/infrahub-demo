---
# C001 "checkout" application: a private-access frontend (gated by an access
# profile) that also calls the external payment gateway. Companion to
# storefront (01_application.yml). Authored directly — no separate
# request/approval object graph; a branch + proposed-change review is the
# approval step for anything declared here.
#
# Who may open checkout-web, and on which port, is the access-profile
# dependency in 03_checkout_dependencies.yml. Without it the ZTNA broker
# does not publish the endpoint.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: checkout
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: checkout.c001.demo.local
      ingress_mode: dns
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: frontend
            component_type: frontend
            children:
              kind: AppEndpoint
              data:
                - name: checkout-web
                  endpoint_type: private_access
                  fqdn: checkout.internal.c001.demo.local
                - name: payment-gateway
                  endpoint_type: external_service
                  fqdn: api.paymentgw.example.com
            member_of_groups:
              - app_components
