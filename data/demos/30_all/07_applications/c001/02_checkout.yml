---
# C001 "checkout" application: a private-access frontend (gated by an access
# profile) that also calls the external payment gateway. Companion to
# storefront (01_application.yml). Authored directly — no separate
# request/approval object graph; a branch + proposed-change review is the
# approval step for anything declared here.
#
# checkout-web has no explicit access_profile: AppApplicationGenerator
# derives one (SecurityAccessProfile + SecurityIdentityGroup, named
# c001-private-access-standard / c001-engineering) from this app's
# security_profile, see generators/topology/application_security.py's
# _ensure_endpoint_access_profile.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: checkout
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: checkout.c001.demo.local
      ingress_mode: dns
      owner: C001
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: frontend
            component_type: frontend
            children:
              kind: AppEndpoint
              data:
                - name: checkout-web
                  endpoint_type: private_access
                  fqdn: checkout.internal.c001.demo.local
                  service_ports:
                    data:
                      - port: 443
                        protocol: tcp
                - name: payment-gateway
                  endpoint_type: external_service
                  fqdn: api.paymentgw.example.com
            member_of_groups:
              - app_components
