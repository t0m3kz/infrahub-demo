---
# VXLAN segment (local to one footprint) activated in C001's colocation footprint (FR). Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on the segment itself.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Nordix Ltd."
      org_id: "C001"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "nordix-prod"
            environment: "p"
            gateway:
              data:
                address: "10.1.101.1/24"
                description: "c001-nordix-prod-p anycast gateway"
                ip_namespace: "PROD"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.1.101.0/24"
                    description: "c001-nordix-prod-p (C001, FR)"
                    status: active
                    role: customer
                    ip_namespace: "PROD"
            customer_deployments:
              - "C001-P-FR"
            member_of_groups:
              - vxlan_segments
