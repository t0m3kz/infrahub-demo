---
# C001 segment in its Frankfurt colocation footprint; loads before the application using it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Nordix Ltd."
      org_id: "C001"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "nordix-prod"
            environment: "p"
            security_zone: "PROD"
            gateway:
              data:
                address: "10.1.101.1/24"
                description: "c001-nordix-prod-p anycast gateway"
                ip_namespace: "default"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.1.101.0/24"
                    description: "c001-nordix-prod-p (C001, FR)"
                    status: active
                    role: customer
                    ip_namespace: "default"
            customer_deployments:
              - "C001-P-FR"
            member_of_groups:
              - vxlan_segments
