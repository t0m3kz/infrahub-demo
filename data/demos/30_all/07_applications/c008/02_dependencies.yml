---
# Who calls whom inside inventory-sync. Source and target are component fqdns;
# without ports a dependency opens every port its target component lists in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c008-inventory-sync-sync-api-to-sync-db
      source: api.inventory-sync.c008.demo.local
      target: db.inventory-sync.c008.demo.local
      access_status: auto
      description: "Sync API stores inventory state in its database"
      member_of_groups:
        - app_dependencies
