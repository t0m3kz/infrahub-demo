---
# C008's segments: the dev segment of its DC12 development footprint and the
# production segment of its DC10 footprint (../../06_customer_boarding/c008/dc/).
# Loaded before 01_application.yml, whose components reference them by
# human_friendly_id; owner comes from the enclosing OrganizationCustomer.
# Prefix, gateway, VNI, VLANs, zone, tag and leaf ports are all derived
# (add_vxlan_segment, add_app_component_segment).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Krafven GmbH"
      org_id: "C008"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "krafven-dev"
            environment: "d"
            customer_deployments:
              - "C008-D-DC12"
            member_of_groups:
              - vxlan_segments

        # Production, local to DC10. A routed tenant segment in PROD, so it
        # gets its own group tag (c008-trade-portal-local-dc10-p) from the
        # segment generator; its only contract with C005 is the approved
        # trade-portal -> payment API rule (02_dependencies.yml).
        - kind: ManagedVxlanSegment
          data:
            customer_name: "trade-portal-local-dc10"
            environment: "p"
            customer_deployments:
              - "C008-P-DC10"
            member_of_groups:
              - vxlan_segments
