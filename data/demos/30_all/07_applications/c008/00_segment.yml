---
# Dev VLAN segment in C008's DC12 development footprint. Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Krafven GmbH"
      org_id: "C008"
      network_segments:
        - kind: ManagedVlanSegment
          data:
            customer_name: "krafven-dev"
            environment: "d"
            vlan_id: 108
            gateway:
              data:
                address: "10.8.108.1/24"
                description: "c008-krafven-dev-d anycast gateway"
                ip_namespace: "NON-PROD"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.8.108.0/24"
                    description: "c008-krafven-dev-d (C008, DC12)"
                    status: active
                    role: customer
                    ip_namespace: "NON-PROD"
            customer_deployment: "C008-D-DC12"
            security_zone: "NONPROD-ZONE"
