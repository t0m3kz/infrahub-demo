---
# C003 cloud-native sample application bound to existing AWS subnet segment.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: custody-api
      environment: p
      criticality: high
      security_profile: internet_exposed
      fqdn: custody-api.c003.demo.local
      ingress_mode: dns
      application_orchestrator: argocd
      owner: C003
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: api-frontend
            component_type: frontend
            network_segment: c003-vaultex-subnet-prod-p
            instances:
              - c003-api-frontend-euc1-1
              - c003-api-frontend-euc1-2
            service_ports:
              data:
                - port: 443
                  protocol: tcp
            member_of_groups:
              - app_components

          - name: api-backend
            component_type: backend
            network_segment: c003-vaultex-subnet-prod-p
            instances:
              - c003-api-backend-euc1-1
              - c003-api-backend-euc1-2
            service_ports:
              data:
                - port: 8443
                  protocol: tcp
            children:
              kind: AppEndpoint
              data:
                - name: api-backend-internal
                  endpoint_type: internal_service
                  fqdn: backend.custody-api.c003.demo.local
            member_of_groups:
              - app_components

---
# api-frontend and api-backend share one CloudNetworkSegment
# (c003-vaultex-subnet-prod-p) — exercises the cloud-security-group rule
# path (RulesPlanner.is_cloud_dependency / AppApplicationGenerator.
# _create_cloud_rule), which no other demo data reaches: c016 has no
# dependency at all, and every on-prem app dependency uses a
# ManagedNetworkSegment on both sides.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c003-custody-api-frontend-to-backend
      source: c003-custody-api-p-api-frontend
      target: ["c003-custody-api-p-api-backend", "api-backend-internal"]
      protocol: tcp
      port_start: 8443
      access_status: auto
      description: "Custody API frontend calls the internal backend API"
