---
# api-frontend and api-backend share one CloudNetworkSegment
# (c003-vaultex-subnet-prod-p) — exercises a SecurityPolicyRule between cloud
# segments on AWS (the cloud segment resolves to its cidr_block); c016 does
# the same on Azure. Every on-prem app dependency uses a ManagedNetworkSegment
# on both sides.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c003-custody-api-frontend-to-backend
      source: frontend.custody-api.c003.demo.local
      target: backend.custody-api.c003.demo.local
      description: "Custody API frontend calls the internal backend API"
      member_of_groups:
        - app_dependencies
