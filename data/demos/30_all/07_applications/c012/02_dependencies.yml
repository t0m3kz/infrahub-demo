---
# Who calls whom inside payment-edge, and on which port. The ports live only
# here; the target endpoints are declared on the components in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c012-payment-edge-payment-ui-to-payment-engine
      source: c012-payment-edge-p-payment-ui
      target: ["c012-payment-edge-p-payment-engine", "payment-engine-api"]
      protocol: tcp
      port_start: 8443
      access_status: auto
      description: "Payment UI calls the payment engine API"
      member_of_groups:
        - app_dependencies
