---
# Who calls whom inside payment-edge. Source and target are component fqdns;
# without ports a dependency opens every port its target component lists in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c012-payment-edge-payment-ui-to-payment-engine
      source: ui.payment-edge.c012.demo.local
      target: engine.payment-edge.c012.demo.local
      access_status: auto
      description: "Payment UI calls the payment engine API"
      member_of_groups:
        - app_dependencies
