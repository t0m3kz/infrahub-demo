---
# C012 colocation application sample for VA metro.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: payment-edge
      environment: p
      criticality: high
      security_profile: internal_standard
      fqdn: payment-edge.c012.demo.local
      ingress_mode: frontend
      owner: C012
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: payment-ui
            fqdn: ui.payment-edge.c012.demo.local
            component_type: frontend
            network_segment: c012-nordix-prod-p
            instances:
              - c012-payment-ui-va1-1
              - c012-payment-ui-va1-2
            member_of_groups:
              - app_components

          - name: payment-engine
            fqdn: engine.payment-edge.c012.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: c012-nordix-prod-p
            instances:
              - c012-payment-engine-va1-1
              - c012-payment-engine-va1-2
            member_of_groups:
              - app_components
