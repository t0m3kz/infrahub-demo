---
# Full customer application request example for the all-in-one demo.
# The approved request is materialized by add_application_deployment_request
# into catalogue objects, then the application generator creates enforcement.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDeploymentRequest
  data:
    - name: c001-checkout-request
      description: "Checkout application with private access and payment dependency"
      application_fqdn: checkout.c001.demo.local
      environment: production
      criticality: high
      security_profile: internet_exposed
      deployment_type: shared_platform
      region: eu-central
      status: approved
      customer: C001
      components:
        - kind: AppDeploymentRequestComponent
          data:
            name: checkout-frontend
            component_type: frontend
            replicas: 2
            endpoints:
              - kind: AppDeploymentRequestEndpoint
                data:
                  name: checkout-web
                  endpoint_type: private_access
                  fqdn: checkout.internal.c001.demo.local
                  protocol: tcp
                  port: 443
                  access_profile: c001-private-access-standard
              - kind: AppDeploymentRequestEndpoint
                data:
                  name: payment-gateway
                  endpoint_type: external_service
                  fqdn: api.paymentgw.example.com
                  protocol: tcp
                  port: 443
