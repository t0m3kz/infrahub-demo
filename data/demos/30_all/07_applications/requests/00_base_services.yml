---
# Customer-owned service assignments consumed by the request materializer.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedCloudProxy
  data:
    - name: c001-web-gateway
      description: "C001 shared-platform egress gateway"
      provider: zscaler_zia
      service_type: web_gateway
      owner: C001
      member_of_groups:
        - saas_proxies
    - name: c001-private-access
      description: "C001 shared-platform private-access broker"
      provider: zscaler_zpa
      service_type: private_access
      owner: C001
      member_of_groups:
        - saas_proxies
