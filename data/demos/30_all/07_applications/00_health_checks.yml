---
# The health checks a load_balanced component names (AppComponent.health_checks). The application generator puts them on
# every VIP of the component, on a load balancer context as on a cloud load balancer
# (generators/lb_vip.py _save_vip), so both worlds show the same checks. A component references one by its
# four-part HFID [check, rise, fall, timeout], all strings.
#
# Sorted before the customers' directories (c003, c005, ...), so they exist when the components load.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LoadbalancerHealthCheck
  data:
    - check: http
      rise: 3
      fall: 3
      timeout: 2000
    - check: tcp
      rise: 2
      fall: 3
      timeout: 1000
