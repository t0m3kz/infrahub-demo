---
# C005 application-oriented VXLAN segments for demo 30_all.
# Includes both local and stretched patterns used by AppComponent.network_segment.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on each segment. customer_deployments references the existing
# TopologyCustomerDC footprints from 06_customer_boarding/c005/dc/ by their
# computed name (DC10 is "p" -> C005-P-DC10, DC12 is "d" -> C005-D-DC12).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Drentec BV"
      org_id: "C005"
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "web-frontend-local-dc10"
            environment: "p"
            stretch_scope: local
            arp_suppression: true
            customer_deployments:
              - "C005-P-DC10"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "app-backend-stretch"
            environment: "p"
            stretch_scope: dc_pair
            arp_suppression: true
            # No explicit isolation_mode: AppApplicationGenerator derives
            # microsegmented for it (see _ensure_segment_isolation_mode) since
            # 01_application.yml's security_profile is fintech_strict. That in
            # turn is what makes the web-frontend -> app-backend AppDependency
            # (07_applications/c005/03_dependencies.yml) exercise the
            # return-rule reconciliation path — apply_on_switch has no
            # connection tracking, so the forward permit alone would otherwise
            # leave the response leg dropped.
            customer_deployments:
              - "C005-P-DC10"
              - "C005-D-DC12"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "database-local-dc12"
            environment: "d"
            stretch_scope: local
            arp_suppression: true
            customer_deployments:
              - "C005-D-DC12"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "message-queue-stretch"
            environment: "p"
            stretch_scope: dc_pair
            arp_suppression: true
            customer_deployments:
              - "C005-P-DC10"
              - "C005-D-DC12"
            member_of_groups:
              - vxlan_segments

        # Stretched DC10 <-> Equinix FR through the colocation's EVPN
        # Multi-Site border gateways (bl-dc101101 <-> eg-fr01 over
        # DF-DC10-EQXFR2). `global` because it crosses from a DC into a
        # different metro, not between two DCs of one pair.
        #
        # The PROD gateway makes it routable as well: every VTEP carrying it
        # (DC10 leafs/BLs and eg-fr01) gets an anycast SVI in VRF PROD, and
        # the C005 office reaches it over the SD-WAN gateway's PROD handoff
        # into eg-fr01 (../../08_interconnects/04_sdwan/06_vrf_handoff.yml).
        - kind: ManagedVxlanSegment
          data:
            customer_name: "colo-services-stretch"
            environment: "p"
            stretch_scope: global
            arp_suppression: true
            gateway:
              data:
                address: "10.5.50.1/24"
                description: "colo-services-stretch anycast gateway"
                ip_namespace: "PROD"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.5.50.0/24"
                    description: "colo-services-stretch (C005, DC10 <-> Equinix FR)"
                    status: active
                    role: customer
                    ip_namespace: "PROD"
            customer_deployments:
              - "C005-P-DC10"
              - "C005-P-FR"
            member_of_groups:
              - vxlan_segments
