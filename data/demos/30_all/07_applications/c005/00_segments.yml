---
# C005 application-oriented VXLAN segments for demo 30_all.
# Includes both local and stretched patterns used by AppComponent.network_segment.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on each segment. customer_deployments references the existing
# TopologyCustomerDC footprints from 06_customer_boarding/c005/dc/ by their
# computed name (C005-P-DC10 and C005-P-DC12; every segment here is prod, like
# payment-core, so each sits only on prod footprints).
#
# No gateway is typed: add_vxlan_segment allocates each segment's prefix and its
# anycast gateway (.1) from C005's own pool (c005-p-dc-ipv4, carved on the first request from
# Tenant-PROD-IPv4, data/bootstrap/23b_tenant_pools.yml, in a block of its design's size), keyed
# by the segment name, once. A /24 unless the segment states a host_count.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Drentec BV"
      org_id: "C005"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "web-frontend-local-dc10"
            environment: "p"
            # 4 instance(s) + 25% headroom
            host_count: 5
            security_zone: "PROD"
            customer_deployments:
              - "C005-P-DC10"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "app-backend-stretch"
            environment: "p"
            # 2 instance(s) + 25% headroom
            host_count: 3
            security_zone: "PROD"
            stretch_scope: dc_pair
            # No explicit isolation_mode: AppApplicationGenerator derives
            # microsegmented for it (see _ensure_segment_isolation_mode) since
            # 01_application.yml's security_profile is fintech_strict. That in
            # turn is what makes the web-frontend -> app-backend AppDependency
            # (07_applications/c005/03_dependencies.yml) an apply_on_switch
            # rule. The leaf ACL is stateless, so the destination segment's
            # leaf answers it with a return leg built from inbound_rules
            # (transforms/helpers/acl.py).
            customer_deployments:
              - "C005-P-DC10"
              - "C005-P-DC12"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "database-local-dc12"
            environment: "p"
            # 2 instance(s) + 25% headroom
            host_count: 3
            security_zone: "PROD"
            customer_deployments:
              - "C005-P-DC12"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "message-queue-stretch"
            environment: "p"
            # 2 instance(s) + 25% headroom
            host_count: 3
            security_zone: "PROD"
            stretch_scope: dc_pair
            customer_deployments:
              - "C005-P-DC10"
              - "C005-P-DC12"
            member_of_groups:
              - vxlan_segments

        # Stretched DC10 <-> Equinix FR through the colocation's EVPN
        # Multi-Site border gateways (bl-dc101101 <-> eg-fr201 over
        # DF-DC10-EQXFR2). `global` because it crosses from a DC into a
        # different metro, not between two DCs of one pair.
        #
        # Its PROD gateway makes it routable as well: every VTEP carrying it
        # (DC10 leafs/BLs and eg-fr201) gets an anycast SVI in VRF PROD, and
        # the C005 office reaches it over the SD-WAN gateway's PROD handoff
        # into eg-fr201 (../../08_interconnects/04_sdwan/06_vrf_handoff.yml).
        - kind: ManagedVxlanSegment
          data:
            customer_name: "colo-services-stretch"
            environment: "p"
            security_zone: "PROD"
            stretch_scope: global
            customer_deployments:
              - "C005-P-DC10"
              - "C005-P-FR"
            member_of_groups:
              - vxlan_segments

        # Terminated on DC10's shared PROD firewall context: its gateway (the .1 add_vxlan_segment takes from
        # C005's PROD pool, like every DC segment) is the floating VIP of the Check Point pair, with no address on a
        # member. The fabric only bridges the segment (a VLAN row and the L2 VNI on the border leaves, no SVI, VRF or
        # ACL) and the firewall renders the `<uplink trunk>.<vlan>` sub-interface with the VLAN of the border leaf
        # it is cabled to; add_vxlan_segment tags the border service ports facing the pair with the segment. The
        # context is generated when C005-P-DC10 is boarded (06_customer_boarding), so it exists by this stage:
        # `shared-{cluster}-{class}` on the HA `{first}-{second}` of the DC10 firewalls.
        - kind: ManagedVxlanSegment
          data:
            customer_name: "firewalled-dc10"
            environment: "p"
            security_zone: "PROD"
            firewall_gateway: true
            customer_deployments:
              - "C005-P-DC10"
            member_of_groups:
              - vxlan_segments

        # Hosted by the C005-OFFICE footprint itself, not by a DC: the office is a LISP site (SD-Access
        # style, add_office_fabric), so this is an L2 instance-id (VNI from the office's own pool) and an L3
        # EID in VRF PROD on its access and distribution switches. Local, like web-frontend-local-dc10: it
        # is never stretched.
        - kind: ManagedVxlanSegment
          data:
            customer_name: "office-lan"
            environment: "p"
            security_zone: "PROD"
            customer_deployments:
              - "C005-OFFICE"
            member_of_groups:
              - vxlan_segments
