---
# C005 application-oriented VXLAN segments for demo 30_all.
# Includes both local and stretched patterns used by AppComponent.network_segment.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on each segment. customer_deployments references the existing
# TopologyCustomerDC footprints from 06_customer_boarding/c005/dc/ by their
# computed name (DC10 is "p" -> C005-P-DC10, DC12 is "d" -> C005-D-DC12).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Drentec BV"
      org_id: "C005"
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "web-frontend-local-dc10"
            environment: "p"
            stretch_scope: local
            arp_suppression: true
            customer_deployments:
              - "C005-P-DC10"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "app-backend-stretch"
            environment: "p"
            stretch_scope: dc_pair
            arp_suppression: true
            # Microsegmented so the existing web-frontend -> app-backend
            # AppDependency (07_applications/c005/03_dependencies.yml)
            # exercises AppApplicationGenerator's return-rule reconciliation
            # (apply_on_switch has no connection tracking, so the forward
            # permit alone would otherwise leave the response leg dropped).
            isolation_mode: microsegmented
            customer_deployments:
              - "C005-P-DC10"
              - "C005-D-DC12"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "database-local-dc12"
            environment: "d"
            stretch_scope: local
            arp_suppression: true
            customer_deployments:
              - "C005-D-DC12"
            member_of_groups:
              - vxlan_segments

        - kind: ManagedVxlanSegment
          data:
            customer_name: "message-queue-stretch"
            environment: "p"
            stretch_scope: dc_pair
            arp_suppression: true
            customer_deployments:
              - "C005-P-DC10"
              - "C005-D-DC12"
            member_of_groups:
              - vxlan_segments
