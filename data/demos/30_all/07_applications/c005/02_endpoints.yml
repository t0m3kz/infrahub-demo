---
# Typed service endpoints for the firewall-path proof. The source and target
# components already live on different C005 segments in 01_application.yml.
# The ports are on the dependencies into these endpoints (03_dependencies.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppEndpoint
  data:
    - name: web-frontend-api
      endpoint_type: internal_service
      fqdn: api.payment-core.c005.demo.local
      parent: c005-payment-core-p-web-frontend
    - name: app-backend-api
      endpoint_type: internal_service
      fqdn: backend.payment-core.c005.demo.local
      parent: c005-payment-core-p-app-backend
    - name: order-db-postgres
      endpoint_type: internal_service
      fqdn: orders-db.payment-core.c005.demo.local
      parent: c005-payment-core-p-order-db
    - name: event-bus-amqp
      endpoint_type: internal_service
      fqdn: events.payment-core.c005.demo.local
      parent: c005-payment-core-p-event-bus
