---
# C005 sample application bound to demo VXLAN segments.
#
# Each component also names its instances — the VMs from
# ../../06_customer_boarding/c005/dc/dc10/02_instances.yml and its dc12 sibling.
# That is the compute leg of the graph: component -> VM -> hosting server ->
# cable -> access-leaf. Two instances per component, on hosts in different
# rows (and, for the stretched segments, different DCs), so losing one
# access-leaf pair degrades a component instead of taking it out.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: payment-core
      environment: p
      criticality: critical
      security_profile: fintech_strict
      fqdn: payment-core.c005.demo.local
      application_orchestrator: ansible_automation_platform
      owner: C005
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-frontend
            fqdn: api.payment-core.c005.demo.local
            component_type: frontend
            ports:
              - tcp/443
            load_balanced: true
            network_segment: c005-web-frontend-local-dc10-p
            instances:
              - c005-web-frontend-dc10-1
              - c005-web-frontend-dc10-2
            member_of_groups:
              - app_components

          # Second component of the microsegmented web-frontend segment: the
          # web-frontend -> session-store rule (03_dependencies.yml) is an
          # intra-segment flow, so it is a contract between their component
          # groups, and nothing else between them is permitted. On its own
          # hosts (server-3/4): no host port carries both components.
          - name: session-store
            fqdn: sessions.payment-core.c005.demo.local
            component_type: cache
            ports:
              - tcp/6379
            network_segment: c005-web-frontend-local-dc10-p
            instances:
              - c005-session-store-dc10-1
              - c005-session-store-dc10-2
            member_of_groups:
              - app_components

          - name: app-backend
            fqdn: backend.payment-core.c005.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: c005-app-backend-stretch-p
            instances:
              - c005-app-backend-dc10-1
              - c005-app-backend-dc12-1
            member_of_groups:
              - app_components

          - name: order-db
            fqdn: orders-db.payment-core.c005.demo.local
            component_type: database
            ports:
              - tcp/5432
            network_segment: c005-database-local-dc12-p
            instances:
              - c005-order-db-dc12-1
              - c005-order-db-dc12-2
            member_of_groups:
              - app_components

          - name: event-bus
            fqdn: events.payment-core.c005.demo.local
            component_type: message_queue
            ports:
              - tcp/5672
            network_segment: c005-message-queue-stretch-p
            instances:
              - c005-event-bus-dc10-1
              - c005-event-bus-dc12-1
            member_of_groups:
              - app_components
