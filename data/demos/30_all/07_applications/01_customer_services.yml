---
# Assign the customer-owned enforcement services used by application_security.py:
# egress_service carries this customer's target_fqdn dependencies, and
# private_access_service publishes the components its access profiles grant.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Nordix Ltd."
      org_id: C001
      egress_service: c001-web-gateway
      private_access_service: c001-private-access
