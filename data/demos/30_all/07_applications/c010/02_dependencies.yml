---
# Who calls whom inside reporting-portal. Source and target are component fqdns;
# without ports a dependency opens every port its target component lists in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c010-reporting-portal-portal-ui-to-report-worker
      source: ui.reporting-portal.c010.demo.local
      target: worker.reporting-portal.c010.demo.local
      access_status: auto
      description: "Portal UI queues report jobs on the worker"
      member_of_groups:
        - app_dependencies
