---
# Who calls whom inside reporting-portal, and on which port. The ports live only
# here; the target endpoints are declared on the components in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c010-reporting-portal-portal-ui-to-report-worker
      source: c010-reporting-portal-d-portal-ui
      target: ["c010-reporting-portal-d-report-worker", "report-worker-api"]
      protocol: tcp
      port_start: 8080
      access_status: auto
      description: "Portal UI queues report jobs on the worker"
      member_of_groups:
        - app_dependencies
