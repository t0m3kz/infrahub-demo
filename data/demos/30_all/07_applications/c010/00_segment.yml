---
# Dev VLAN segment in C010's DC12 development footprint. Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Zindra Corp."
      org_id: "C010"
      network_segments:
        - kind: ManagedVlanSegment
          data:
            customer_name: "zindra-dev"
            environment: "d"
            vlan_id: 109
            customer_deployment: "C010-D-DC12"
