---
# Dev segment of C010's DC12 development footprint. Loaded before
# 01_application.yml, whose components reference it by human_friendly_id;
# owner comes from the enclosing OrganizationCustomer. Prefix, gateway, VNI,
# VLANs, zone, tag and leaf ports are all derived (add_vxlan_segment,
# add_app_component_segment).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Zindra Corp."
      org_id: "C010"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "zindra-dev"
            environment: "d"
            customer_deployments:
              - "C010-D-DC12"
            member_of_groups:
              - vxlan_segments
