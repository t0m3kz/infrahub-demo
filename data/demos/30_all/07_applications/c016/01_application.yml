---
# C016 cloud-native application sample for Azure West Europe.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: billing-cloud
      environment: p
      criticality: medium
      security_profile: internet_exposed
      fqdn: billing-cloud.c016.demo.local
      ingress_mode: dns
      application_orchestrator: argocd
      owner: C016
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: billing-frontend
            fqdn: frontend.billing-cloud.c016.demo.local
            component_type: frontend
            network_segment: c016-prolexar-subnet-prod-p
            instances:
              - c016-billing-frontend-weu-1
              - c016-billing-frontend-weu-2
            member_of_groups:
              - app_components

          - name: billing-worker
            fqdn: worker.billing-cloud.c016.demo.local
            component_type: worker
            ports:
              - tcp/9000
            network_segment: c016-prolexar-subnet-prod-p
            instances:
              - c016-billing-worker-weu-1
              - c016-billing-worker-weu-2
            member_of_groups:
              - app_components
