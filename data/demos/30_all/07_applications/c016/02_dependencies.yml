---
# Who calls whom inside billing-cloud, and on which port. The ports live only
# here; the target endpoints are declared on the components in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c016-billing-cloud-billing-frontend-to-billing-worker
      source: c016-billing-cloud-p-billing-frontend
      target: ["c016-billing-cloud-p-billing-worker", "billing-worker-api"]
      protocol: tcp
      port_start: 9000
      access_status: auto
      description: "Billing frontend submits jobs to the worker"
      member_of_groups:
        - app_dependencies
