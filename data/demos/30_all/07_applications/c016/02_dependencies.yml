---
# Who calls whom inside billing-cloud. Source and target are component fqdns;
# without ports a dependency opens every port its target component lists in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c016-billing-cloud-billing-frontend-to-billing-worker
      source: frontend.billing-cloud.c016.demo.local
      target: worker.billing-cloud.c016.demo.local
      access_status: auto
      description: "Billing frontend submits jobs to the worker"
      member_of_groups:
        - app_dependencies
