---
# C011 colocation sample application on customer VLAN segment in NY metro.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: edge-analytics
      environment: p
      criticality: medium
      security_profile: internal_standard
      fqdn: edge-analytics.c011.demo.local
      ingress_mode: frontend
      application_orchestrator: github_actions
      owner: C011
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: edge-ingress
            fqdn: ingress.edge-analytics.c011.demo.local
            component_type: frontend
            ports:
              - tcp/443
            network_segment: c011-nordix-prod-p
            instances:
              - c011-edge-ingress-ny1-1
              - c011-edge-ingress-ny1-2
            member_of_groups:
              - app_components

          - name: stream-worker
            fqdn: stream.edge-analytics.c011.demo.local
            component_type: worker
            ports:
              - tcp/9092
            network_segment: c011-nordix-prod-p
            instances:
              - c011-stream-worker-ny1-1
              - c011-stream-worker-ny1-2
            member_of_groups:
              - app_components
