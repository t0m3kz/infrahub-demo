---
# VLAN segment activated in C011's colocation footprint (NY). Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on the segment itself.
#
# No switch ports here: add_app_component_segment
# (generators/topology/app_instance_segment.py) tags the cage switch ports the
# components' instances' hosts are cabled to (../../06_customer_boarding/
# c011/colo/*/*/03_cabling.yml), as it does a DC segment's leaf ports.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Flarex Ltd."
      org_id: "C011"
      network_segments:
        - kind: ManagedVlanSegment
          data:
            customer_name: "nordix-prod"
            environment: "p"
            vlan_id: 104
            gateway:
              data:
                address: "10.11.104.1/24"
                description: "c011-nordix-prod-p anycast gateway"
                ip_namespace: "PROD"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.11.104.0/24"
                    description: "c011-nordix-prod-p (C011, NY)"
                    status: active
                    role: customer
                    ip_namespace: "PROD"
            customer_deployment: "C011-P-NY"
