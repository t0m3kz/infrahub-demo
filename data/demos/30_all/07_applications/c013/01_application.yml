---
# C013 colocation analytics application sample for AMS metro.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: fraud-detection
      environment: p
      criticality: critical
      security_profile: fintech_strict
      fqdn: fraud-detection.c013.demo.local
      ingress_mode: frontend
      owner: C013
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: scoring-api
            component_type: backend
            network_segment: c013-nordix-prod-p
            instances:
              - c013-scoring-api-ams-1
              - c013-scoring-api-ams-2
            member_of_groups:
              - app_components

          - name: feature-cache
            component_type: cache
            network_segment: c013-nordix-prod-p
            instances:
              - c013-feature-cache-ams-1
              - c013-feature-cache-ams-2
            children:
              kind: AppEndpoint
              data:
                - name: feature-cache-redis
                  endpoint_type: internal_service
                  fqdn: cache.fraud-detection.c013.demo.local
            member_of_groups:
              - app_components
