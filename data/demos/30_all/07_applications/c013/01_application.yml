---
# C013 colocation analytics application sample for AMS metro.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: fraud-detection
      environment: p
      criticality: critical
      security_profile: fintech_strict
      fqdn: fraud-detection.c013.demo.local
      ingress_mode: frontend
      owner: C013
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: scoring-api
            component_type: backend
            network_segment: c013-nordix-prod-p
            service_ports:
              data:
                - port: 8443
                  protocol: tcp
            member_of_groups:
              - app_components

          - name: feature-cache
            component_type: cache
            network_segment: c013-nordix-prod-p
            service_ports:
              data:
                - port: 6379
                  protocol: tcp
            member_of_groups:
              - app_components
