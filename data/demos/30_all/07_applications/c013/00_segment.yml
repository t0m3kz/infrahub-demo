---
# VXLAN segment (local to one footprint) activated in C013's colocation footprint (AMS). Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on the segment itself.
#
# No switch ports here: add_app_component_segment
# (generators/topology/app_instance_segment.py) tags the cage switch ports the
# components' instances' hosts are cabled to (../../06_customer_boarding/
# c013/colo/*/*/03_cabling.yml), as it does a DC segment's leaf ports.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Mertova SA"
      org_id: "C013"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "nordix-prod"
            environment: "p"
            gateway:
              data:
                address: "10.13.106.1/24"
                description: "c013-nordix-prod-p anycast gateway"
                ip_namespace: "PROD"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.13.106.0/24"
                    description: "c013-nordix-prod-p (C013, AMS)"
                    status: active
                    role: customer
                    ip_namespace: "PROD"
            customer_deployments:
              - "C013-P-AMS"
            member_of_groups:
              - vxlan_segments
