---
# Who calls whom inside fraud-detection. Source and target are component fqdns;
# without ports a dependency opens every port its target component lists in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c013-fraud-detection-scoring-api-to-feature-cache
      source: scoring.fraud-detection.c013.demo.local
      target: cache.fraud-detection.c013.demo.local
      access_status: auto
      description: "Scoring API reads features from the cache"
      member_of_groups:
        - app_dependencies
