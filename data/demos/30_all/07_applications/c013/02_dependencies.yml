---
# Who calls whom inside fraud-detection, and on which port. The ports live only
# here; the target endpoints are declared on the components in
# 01_application.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppDependency
  data:
    - name: c013-fraud-detection-scoring-api-to-feature-cache
      source: c013-fraud-detection-p-scoring-api
      target: ["c013-fraud-detection-p-feature-cache", "feature-cache-redis"]
      protocol: tcp
      port_start: 6379
      access_status: auto
      description: "Scoring API reads features from the cache"
      member_of_groups:
        - app_dependencies
