---
# Core infrastructure services (DNS/NTP) of DC11: a VXLAN segment in the MANAGEMENT VRF, owned by the Infrastructure
# Services pseudo-customer (a segment's name is computed from its owner, here `infra-core-dns-ntp-p`).
#
# Tenants reach it through their firewall context's MANAGEMENT leg, source-NATed to the leg VIP (nothing here
# initiates towards a tenant); the rules that name it live in
# ../../08_interconnects/07_zone_policies/05_security_policy.yml.
#
# customer_deployments is C006-P-DC11: a segment needs a deployment, and INFRA has no footprint of its own. Reusing
# DC11's existing one adds no context and no leg; the footprint only says which DC's fabric carries the segment. It gets
# no tenant PBR redirect: its gateway namespace is of type management (get_customer_pbr_rules).
#
# Like every segment its VLAN is generated per switch and its ports come from the instances of its components
# (01_application.yml: two virtual machines hosted on the dc11-pod1 servers). The gateway is authored: the address
# generator keeps it. Its anycast SVI in VRF MANAGEMENT advertises 10.250.0.0/24 to the border leaves as an EVPN
# type-5 route.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Infrastructure Services"
      org_id: "INFRA"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "core-dns-ntp"
            description: "DC11 core infrastructure services (DNS, NTP)"
            environment: "p"
            gateway:
              data:
                address: "10.250.0.1/24"
                description: "infra-core-dns-ntp-p anycast gateway"
                ip_namespace: "MANAGEMENT"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.250.0.0/24"
                    description: "infra-core-dns-ntp-p (INFRA, DC11)"
                    status: active
                    role: customer
                    ip_namespace: "MANAGEMENT"
            customer_deployments:
              - "C006-P-DC11"
            member_of_groups:
              - vxlan_segments
            security_zone: "MANAGEMENT-ZONE"
