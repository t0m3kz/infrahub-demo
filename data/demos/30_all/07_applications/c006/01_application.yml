---
# C006 on-prem sample application on customer VLAN segment in DC11.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: erp-core
      environment: p
      criticality: critical
      security_profile: internal_standard
      fqdn: erp-core.c006.demo.local
      ingress_mode: frontend
      owner: C006
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-ui
            component_type: frontend
            network_segment: c006-nordix-prod-p
            service_ports:
              data:
                - port: 443
                  protocol: tcp
            member_of_groups:
              - app_components

          - name: erp-backend
            component_type: backend
            network_segment: c006-nordix-prod-p
            service_ports:
              data:
                - port: 8443
                  protocol: tcp
            member_of_groups:
              - app_components

          - name: erp-db
            component_type: database
            network_segment: c006-nordix-prod-p
            service_ports:
              data:
                - port: 5432
                  protocol: tcp
            member_of_groups:
              - app_components
