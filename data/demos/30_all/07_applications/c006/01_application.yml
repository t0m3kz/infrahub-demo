---
# C006 on-prem sample application on customer VLAN segment in DC11.
#
# instances are the VMs from ../../06_customer_boarding/c006/dc/dc11/02_instances.yml — every tier
# runs on both POD-1 hosts, one per row, so neither access-leaf pair is a
# single point of failure for a whole tier.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AppApplication
  data:
    - label: erp-core
      environment: p
      criticality: critical
      security_profile: internal_standard
      fqdn: erp-core.c006.demo.local
      ingress_mode: frontend
      application_orchestrator: github_actions
      owner: C006
      member_of_groups:
        - app_applications
      children:
        kind: AppComponent
        data:
          - name: web-ui
            fqdn: ui.erp-core.c006.demo.local
            component_type: frontend
            ports:
              - tcp/443
            network_segment: c006-nordix-prod-p
            instances:
              - c006-web-ui-dc11-1
              - c006-web-ui-dc11-2
            member_of_groups:
              - app_components

          - name: erp-backend
            fqdn: backend.erp-core.c006.demo.local
            component_type: backend
            ports:
              - tcp/8443
            network_segment: c006-nordix-prod-p
            instances:
              - c006-erp-backend-dc11-1
              - c006-erp-backend-dc11-2
            member_of_groups:
              - app_components

          - name: erp-db
            fqdn: db.erp-core.c006.demo.local
            component_type: database
            ports:
              - tcp/5432
            network_segment: c006-nordix-prod-p
            instances:
              - c006-erp-db-dc11-1
              - c006-erp-db-dc11-2
            member_of_groups:
              - app_components
