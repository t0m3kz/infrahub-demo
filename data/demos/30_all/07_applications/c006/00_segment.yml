---
# Segment of C006's DC11 footprint. Loaded before 01_application.yml, whose
# components reference it by human_friendly_id; owner comes from the
# enclosing OrganizationCustomer. Prefix, gateway, VNI, VLANs, zone, tag and
# leaf ports are all derived (add_vxlan_segment, add_app_component_segment).
# It is routed (anycast SVI in VRF PROD), so its leaf ACL, the DC11 shared
# context's routes and the internet egress rule in
# ../../08_interconnects/07_zone_policies/05_security_policy.yml have a prefix.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Lumivex SA"
      org_id: "C006"
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "nordix-prod"
            environment: "p"
            customer_deployments:
              - "C006-P-DC11"
            member_of_groups:
              - vxlan_segments
