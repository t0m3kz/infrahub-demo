---
# VLAN segment activated in C006's DC footprint (DC11). Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on the segment itself.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Lumivex SA"
      org_id: "C006"
      network_segments:
        - kind: ManagedVlanSegment
          data:
            customer_name: "nordix-prod"
            environment: "p"
            vlan_id: 103
            # Routed (anycast SVI in VRF PROD) so its leaf ACL, the DC11 shared
            # context's routes and the internet egress rule in
            # ../../08_interconnects/07_zone_policies/05_security_policy.yml have a prefix.
            gateway:
              data:
                address: "10.6.103.1/24"
                description: "c006-nordix-prod-p anycast gateway"
                ip_namespace: "PROD"
                ip_prefix:
                  kind: IpamPrefix
                  data:
                    prefix: "10.6.103.0/24"
                    description: "c006-nordix-prod-p (C006, DC11)"
                    status: active
                    role: customer
                    ip_namespace: "PROD"
            customer_deployment: "C006-P-DC11"
            # ManagedVlanSegment has no generator, so the access-leaf ports the
            # DC11 hosts (dc11-pod1-server-1/2, both NICs) are cabled to are
            # pinned by hand, as in ../c011/00_segment.yml; without them VLAN 103
            # reaches no leaf and its ACL/PBR are never rendered.
            interface_capabilities:
              - ["al-dc1111111501", "Ethernet1/1"]
              - ["al-dc1111111502", "Ethernet1/1"]
              - ["al-dc1111112501", "Ethernet1/1"]
              - ["al-dc1111112502", "Ethernet1/1"]
