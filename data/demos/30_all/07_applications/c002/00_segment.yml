---
# VXLAN segment (local to one footprint) activated in C002's colocation footprint (PA). Loaded before
# 01_application.yml since components there reference it by human_friendly_id.
# Nested under OrganizationCustomer (owner) via the network_segments reverse
# relationship — owner is set automatically from the parent, no need to
# repeat it on the segment itself.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "SwiftGo GmbH"
      org_id: "C002"
      member_of_groups:
        - customers
      network_segments:
        - kind: ManagedVxlanSegment
          data:
            customer_name: "swiftgo-prod"
            environment: "p"
            customer_deployments:
              - "C002-P-PA"
            member_of_groups:
              - vxlan_segments
