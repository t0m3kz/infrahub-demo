---
# Cross-connect eg-fr202 to Equinix Fabric et-0/0/1 through jack 1 of PP-EQX-FR2-01.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-FR2-EG-FR202-PP01-F1"
      type: smf
      deployment: "FR2"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "eg-fr202"
            name: "Ethernet1/2"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["fr2-s1-r-1", "PP-EQX-FR2-01"]
            name: "1"
            connector: "lc-upc"

    - name: "CBL-FR2-PP01-R1-EQX-FABRIC"
      type: smf
      deployment: "FR2"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["fr2-s1-r-1", "PP-EQX-FR2-01"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "EXT-EQX-FABRIC-FR2"
            name: "et-0/0/1"
