---
# An isolated cross-connect through the patch panel: the second edge of the FR2 cage, eg-fr202, to a second Equinix
# Fabric port (EXT-EQX-FABRIC-FR2 et-0/0/1) over jack 1 of PP-EQX-FR2-01:
#
#   eg-fr202 Ethernet1/2 --- front fr2-s1-r-1:PP-EQX-FR2-01:F1 | rear fr2-s1-r-1:PP-EQX-FR2-01:1
#   --- EXT-EQX-FABRIC-FR2 et-0/0/1
#
# Both ports are free (`customer` role of Ethernet1/[1-7] and et-0/0/[0-3]); no circuit, session or segment rides them,
# and the first Fabric cable (05_cage_cabling.yml, eg-fr201 Ethernet1/1) is untouched. Cables in data are never
# generated. Rear port 1 and front port 1 are one jack: the front port's `rear_port`, written by add_patch_panel.
# An end given as a nested object is an upsert and the loader validates the mandatory fields of its kind, so each panel
# port repeats the `connector` of its panel's type lc-24 (lc-upc), so the cable upserts the same port add_patch_panel
# builds.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - name: "CBL-FR2-EG-FR202-PP01-F1"
      type: smf
      deployment: "FR2"
      endpoints:
        - kind: DcimPhysicalInterface
          data:
            device: "eg-fr202"
            name: "Ethernet1/2"
        - kind: DcimFrontPatchPanelPort
          data:
            panel: ["fr2-s1-r-1", "PP-EQX-FR2-01"]
            name: "1"
            connector: "lc-upc"

    - name: "CBL-FR2-PP01-R1-EQX-FABRIC"
      type: smf
      deployment: "FR2"
      endpoints:
        - kind: DcimRearPatchPanelPort
          data:
            panel: ["fr2-s1-r-1", "PP-EQX-FR2-01"]
            name: "1"
            connector: "lc-upc"
        - kind: DcimPhysicalInterface
          data:
            device: "EXT-EQX-FABRIC-FR2"
            name: "et-0/0/1"
