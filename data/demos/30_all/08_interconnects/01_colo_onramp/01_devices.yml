---
# Shared on-ramp routers in the Equinix cages.
#
# These are operator kit, not customer kit: one router per cage, owned by
# Internal (P028), carrying every tenant's traffic between the DC fabrics and
# the cloud fabrics. That is the "underlay shared" half of the connectable-set
# split — a cage router and the dark fibre reaching it are shared facilities, so
# they terminate shared TopologyPhysicalCircuits, and per-customer
# TopologyVirtualCircuits ride over them (see ../03_virtual_circuits/).
#
# N9K-C9316D-GX_EDGE gives the port roles this leg needs: Ethernet1/1-9
# `customer`, Ethernet1/10-12 `dci` (facing the DC border leaves),
# Ethernet1/13-16 `uplink` (facing the cloud fabric).
#
# FR2 serves DC10 and DC11 (both Frankfurt); PA4 serves DC12.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "EQX-FR2-GW1"
      object_template: N9K-C9316D-GX_EDGE
      status: active
      owner: "P028"
      description: "Equinix FR2 shared on-ramp router (DC10/DC11 <-> AWS eu-central-1)"
      deployment: "FR2"

    - name: "EQX-PA4-GW1"
      object_template: N9K-C9316D-GX_EDGE
      status: active
      owner: "P028"
      description: "Equinix PA4 shared on-ramp router (DC12 <-> Azure westeurope)"
      deployment: "PA4"
