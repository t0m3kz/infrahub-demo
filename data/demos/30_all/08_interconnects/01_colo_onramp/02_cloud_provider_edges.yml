---
# The provider edges we meet in the cages, as seen from our side of the handoffs and carriers. They are the provider's
# kit, not ours: owned by the provider, in no device group (the two physical stubs deployed to a colocation zone are in
# `provider_stubs`, which keeps them out of the border-gateway lookup of generators/vlan_domain.py: they carry the
# `edge` role of their template), so no config artifact or device check targets them. They exist, like the ISP provider
# edges in ../06_internet/02_devices.yml, so a carrier, a cable or a handoff circuit has a second endpoint (and, for the
# Megaport Cloud Router and the cloud service edges, a remote AS).
#
# Two kinds, by the physicality of the end (a cable ends on a physical device, a virtual service on a virtual NIC):
#
#   Cloud regions (AWS eu-central-1, Azure westeurope) are provider places with no hardware: the provider side is ONE
#   CloudNetworkAppliance, a "service edge" of role `provider` (templates AWS_SERVICE_EDGE and AZURE_SERVICE_EDGE,
#   data/bootstrap/09_network_appliance_templates_cloud_service_edge.yaml), hosted by the region through
#   `appliances` (TopologyApplianceHosting). It has no port: each connection leg is a DcimVirtualInterface NIC
#   (`vnic-*`, declared below) that is the far end of a `virtual_connection` carrier, and the handoff sub-interface
#   `<nic>.<vlan>` rides on it. Nothing is cabled to it.
#
#     EXT-AWS-DX-FR2      the Direct Connect service edge of eu-central-1 (AS64512): vnic-fr2 is the leg of the cage
#                         FR2 (XC-EQXFR2-AWS-EUC1), vnic-amne the leg of the hosted Direct Connect from the Network
#                         Edge router eg-am-ne02 (FABRIC-AMNE02-AWS-EUC1). The region has a second appliance for the
#                         Site-to-Site VPN, EXT-AWS-VPN-EUC1 (../05_provider_connections/03_aws_vpn.yml): the VPN
#                         gateway speaks its own Amazon-side AS64513 and a device carries ONE BGP process, so the
#                         two services of the one provider in the one region are two appliances.
#     EXT-AZURE-ER-PA4    the ExpressRoute service edge of westeurope (AS12076): vnic-pri and vnic-sec are the
#                         primary and secondary leg (XC-EQXPA4-AZURE-WEU-PRI and -SEC), the existing carriers
#                         the provider connections PC-PA4-AZURE-WEU-PRI-PROD and PC-PA4-AZURE-WEU-SEC-PROD adopt
#
#   Physical provider kit stays a DcimPhysicalDevice (MX204_ISP_PE is the generic provider-edge stand-in template;
#   only its et-0/0/0 port is used, as the far end of the cross-connect or cable and the parent of the handoff
#   sub-interface, plus a Loopback0 router-id for the routers that peer with us):
#
#   EXT-MEGAPORT-MCR1   the Megaport zone MCR-PAR1 (../../02_colo/megaport/par). A Megaport MCR is a
#                       cloud-neutral virtual router that Megaport runs in its own enabled facility, so the
#                       facility it is deployed to is Megaport's, not a cloud region; a zone is a facility a
#                       circuit end derives from. The far end of XC-EQXPA4-MEGAPORT
#   EXT-EQX-FABRIC-FR2  the cage FR2 itself: Equinix's Fabric port sits in the same IBX, so the hop to
#                       eg-fr201 is a cable (05_cage_cabling.yml), not a circuit
#
# Created before ../05_provider_connections/, whose stubs' loopbacks reference them by device name, and before
# 03_carrier_circuits.yml and 05_cage_cabling.yml (this directory), whose carriers and cable end on them. `deployment`
# is the facility: add_circuit derives each carrier's far end from the end device's deployment (the circuit data lists
# only the cage).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkAppliance
  data:
    - name: "EXT-AWS-DX-FR2"
      object_template: AWS_SERVICE_EDGE
      description: "AWS Direct Connect service edge of eu-central-1 (far end of the Direct Connect connections)"
      deployment: "eu-central-1"
    - name: "EXT-AZURE-ER-PA4"
      object_template: AZURE_SERVICE_EDGE
      description: "Azure ExpressRoute service edge of westeurope (far end of the ExpressRoute legs)"
      deployment: "westeurope"
---
# One virtual NIC per connection leg: the far end of the leg's virtual_connection carrier and the parent of the handoff
# sub-interface the provider-connection generator adds (`vnic-fr2.1000`). No hardware, so no parent port and no cable.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "vnic-fr2"
      device: "EXT-AWS-DX-FR2"
      role: uplink
      status: active
      description: "Direct Connect leg of the FR2 cage (PC-FR2-AWS-EUC1-PROD)"
    - name: "vnic-amne"
      device: "EXT-AWS-DX-FR2"
      role: uplink
      status: active
      description: "Hosted Direct Connect leg of the Network Edge router eg-am-ne02 (PC-AMNE-AWS-EUC1-PROD)"
    - name: "vnic-pri"
      device: "EXT-AZURE-ER-PA4"
      role: uplink
      status: active
      description: "ExpressRoute primary leg of the PA4 cage (PC-PA4-AZURE-WEU-PRI-PROD)"
    - name: "vnic-sec"
      device: "EXT-AZURE-ER-PA4"
      role: uplink
      status: active
      description: "ExpressRoute secondary leg of the PA4 cage (PC-PA4-AZURE-WEU-SEC-PROD)"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "EXT-MEGAPORT-MCR1"
      object_template: MX204_ISP_PE
      owner: "P033"
      description: "Megaport Cloud Router (MCR) in Paris (far end of XC-EQXPA4-MEGAPORT)"
      deployment: "MCR-PAR1"
      member_of_groups:
        - provider_stubs
    - name: "EXT-EQX-FABRIC-FR2"
      object_template: MX204_ISP_PE
      owner: "P016"
      description: "Equinix Fabric port in the FR2 IBX (cabled to eg-fr201, Fabric connections to AM-NE)"
      deployment: "FR2"
      member_of_groups:
        - provider_stubs
