---
# The provider edges we meet in the cages, as seen from our side of the handoffs and carriers. They are the provider's
# kit, not ours: owned by the provider, in no device group (the two physical stubs deployed to a colocation zone are in
# `provider_stubs`, which keeps them out of the border-gateway lookup of generators/vlan_domain.py: they carry the
# `edge` role of their template), so no config artifact or device check targets them. They exist, like the ISP provider
# edges in ../06_internet/02_devices.yml, so a carrier, a cable or a handoff circuit has a second endpoint (and, for the
# Megaport Cloud Router, a remote AS).
#
# Two kinds, by what the far end is:
#
#   Cloud regions (AWS eu-central-1, Azure westeurope) host nothing of ours: the provider side of a connection is a
#   cloud TRANSPORT (CloudDirectConnect), an interface holder in the region (`region`) and in an account of the
#   network team (01_cloud_accounts.yml). It holds only the peerings: the virtual interface of a leg is a
#   CloudPeeringInterface of the transport that rides on the provider's port (the AWS one is authored in
#   ../03_virtual_circuits/02_aws_prod_handoff.yml). The PORTS are the provider's own, a TopologyProviderConnect where
#   they physically are (the last documents of this file): in the cage for the dedicated Direct Connect (a cable from
#   the cage edge, 05_cage_cabling.yml) and in the region for the far ends of the `virtual_connection` carriers of
#   03_carrier_circuits.yml.
#
#     dx-30all-euc1-fr2   AWS Direct Connect of eu-central-1, the leg of the cage FR2: a PHYSICAL connection on the
#                         dedicated 10G port `dxcon-fr2` of EXT-AWS-DX-FR2 (not a LAG: a single connection)
#     dx-30all-euc1-amne  the hosted Direct Connect from the Network Edge router eg-am-ne02 (FABRIC-AMNE02-AWS-EUC1): a
#                         LOGICAL connection on the 1G port `dxcon-amne` of EXT-AWS-DX-EUC1, lives in the Equinix
#                         account (`partner_account`)
#     er-30all-weu        the Azure ExpressRoute circuit of westeurope: ONE logical transport whose two links are the
#                         ports `msee-pri` and `msee-sec` of EXT-AZURE-ER-WEU (the primary and secondary MSEE,
#                         XC-EQXPA4-AZURE-WEU-PRI and -SEC, the carriers that share a `redundancy_group`)
#
#   The two AWS legs are two transports: they are two Direct Connect connections of different kinds (dedicated at the
#   cage, hosted through a partner) that share no LAG. AWS runs the Site-to-Site VPN of the same region as a
#   CloudVPNConnection, not modelled here.
#
#   Physical provider kit stays a DcimPhysicalDevice (MX204_ISP_PE is the generic provider-edge stand-in template;
#   only its et-0/0/0 port is used, as the far end of the cross-connect or cable and the parent of the handoff
#   sub-interface, plus a Loopback0 router-id for the routers that peer with us):
#
#   EXT-MEGAPORT-MCR1   the Megaport zone MCR-PAR1 (../../02_colo/megaport/par). A Megaport MCR is a
#                       cloud-neutral virtual router that Megaport runs in its own enabled facility, so the
#                       facility it is deployed to is Megaport's, not a cloud region; a zone is a facility a
#                       circuit end derives from. The far end of XC-EQXPA4-MEGAPORT
#
#   The Equinix Fabric ports are not a stub of that kind: EXT-EQX-FABRIC-FR2 is a TopologyProviderConnect, the
#   provider's port of the metro FR (the last document of this file). Equinix's Fabric port sits in the same IBX, so
#   the hop to eg-fr201 is a cable (05_cage_cabling.yml), not a circuit
#
# Created before 03_carrier_circuits.yml and 05_cage_cabling.yml (this directory), whose carriers and cable end on
# them. A physical stub's `deployment` is the facility: add_circuit derives the far end of a carrier from the end
# device's deployment, or from a provider connect's `location` (the circuit data lists only the cage).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudDirectConnect
  data:
    - name: "dx-30all-euc1-fr2"
      description: "AWS Direct Connect of eu-central-1, dedicated 10G port at the FR2 cage (XC-EQXFR2-AWS-EUC1)"
      status: active
      connection_type: physical
      provider: "P004"
      bandwidth: 10000
      account: "net-hub-aws-prod"
      region: "eu-central-1"
    - name: "dx-30all-euc1-amne"
      description: "AWS hosted Direct Connect of eu-central-1 through the Network Edge router eg-am-ne02 (FABRIC-AMNE02-AWS-EUC1)"  # yamllint disable-line rule:line-length
      status: active
      connection_type: logical
      provider: "P004"
      bandwidth: 1000
      account: "net-hub-aws-prod"
      partner_account: "equinix-network-edge"
      region: "eu-central-1"
    - name: "er-30all-weu"
      description: "Azure ExpressRoute circuit of westeurope: primary and secondary link (XC-EQXPA4-AZURE-WEU-PRI and -SEC)"  # yamllint disable-line rule:line-length
      status: active
      connection_type: logical
      provider: "P005"
      bandwidth: 10000
      account: "net-hub-azure-prod"
      region: "westeurope"
---
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "EXT-MEGAPORT-MCR1"
      object_template: MX204_ISP_PE
      owner: "P033"
      description: "Megaport Cloud Router (MCR) in Paris (far end of XC-EQXPA4-MEGAPORT)"
      deployment: "MCR-PAR1"
      member_of_groups:
        - provider_stubs
---
# The Equinix Fabric port of the cage FR: a TopologyProviderConnect, a slim device of the provider placed by its
# `location` (the cage), with no role, platform or template, that holds the physical Fabric ports. et-0/0/0 is cabled
# to eg-fr201 (05_cage_cabling.yml) and et-0/0/1 to eg-fr202 through the patch panel (07_patch_panel_cabling.yml);
# the Fabric connection that starts on et-0/0/0 has an interface of its own (02a_fabric_interfaces.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnect
  data:
    - name: "EXT-EQX-FABRIC-FR2"
      description: "Equinix Fabric ports of the metro FR, in the FR2 IBX (cabled to eg-fr201 and eg-fr202)"
      status: active
      provider: "P016"
      location: "FR2"
      bandwidth: 10000
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - name: "et-0/0/0"
      device: "EXT-EQX-FABRIC-FR2"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "Fabric port, cabled to eg-fr201 Ethernet1/1"
    - name: "et-0/0/1"
      device: "EXT-EQX-FABRIC-FR2"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "Fabric port, cabled to eg-fr202 Ethernet1/2 through PP-EQX-FR2-01"
---
# The provider's own ports of the Direct Connect and ExpressRoute legs: a TopologyProviderConnect each, placed by its
# `location`, with the ports the carriers end on and the virtual interfaces of the transports ride on. EXT-AWS-DX-FR2
# stands in the FR2 cage and is cabled to eg-fr201 Ethernet1/13 (05_cage_cabling.yml); the two others stand in their
# region, the far ends of the Fabric virtual connections (03_carrier_circuits.yml).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnect
  data:
    - name: "EXT-AWS-DX-FR2"
      description: "AWS Direct Connect location in the FR2 cage (the dedicated 10G port)"
      status: active
      provider: "P004"
      location: "FR2"
      bandwidth: 10000
    - name: "EXT-AWS-DX-EUC1"
      description: "AWS Direct Connect edge of eu-central-1 (the hosted connection port)"
      status: active
      provider: "P004"
      location: "eu-central-1"
      bandwidth: 1000
    - name: "EXT-AZURE-ER-WEU"
      description: "Microsoft Enterprise Edge of westeurope for ExpressRoute (primary and secondary link)"
      status: active
      provider: "P005"
      location: "westeurope"
      bandwidth: 10000
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - name: "dxcon-fr2"
      device: "EXT-AWS-DX-FR2"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "Direct Connect dedicated port, cabled to eg-fr201 Ethernet1/13"
    - name: "dxcon-amne"
      device: "EXT-AWS-DX-EUC1"
      interface_type: 1000base-x-sfp
      role: cloud
      status: active
      description: "Hosted Direct Connect port, leg of the Network Edge router eg-am-ne02"
    - name: "msee-pri"
      device: "EXT-AZURE-ER-WEU"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "ExpressRoute primary link (primary MSEE)"
    - name: "msee-sec"
      device: "EXT-AZURE-ER-WEU"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "ExpressRoute secondary link (secondary MSEE)"
