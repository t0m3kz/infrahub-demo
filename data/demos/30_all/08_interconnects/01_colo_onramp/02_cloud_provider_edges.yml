---
# The provider edges we meet in the cages, as seen from our side of the handoffs and carriers. They are the provider's
# kit, not ours: owned by the provider, in no device group (the two physical stubs deployed to a colocation zone are in
# `provider_stubs`, which keeps them out of the border-gateway lookup of generators/vlan_domain.py: they carry the
# `edge` role of their template), so no config artifact or device check targets them. They exist, like the ISP provider
# edges in ../06_internet/02_devices.yml, so a carrier, a cable or a handoff circuit has a second endpoint (and, for the
# Megaport Cloud Router, a remote AS).
#
# Two kinds, by what the far end is:
#
#   Cloud regions (AWS eu-central-1, Azure westeurope) host nothing: the provider side of a connection is a cloud
#   TRANSPORT (CloudDirectConnect), an interface holder in the region (`region`) and in an account of the network team
#   (01_cloud_accounts.yml). Its ports are DcimPhysicalInterface, the far ends of the `virtual_connection` carriers of
#   03_carrier_circuits.yml; the virtual interface of a leg is a CloudPeeringInterface of the transport that rides on a
#   port (the AWS one is authored in ../03_virtual_circuits/02_aws_prod_handoff.yml). Nothing is cabled to a transport.
#
#     dx-30all-euc1-fr2   AWS Direct Connect of eu-central-1, the leg of the cage FR2 (XC-EQXFR2-AWS-EUC1): a PHYSICAL
#                         connection, one dedicated 10G port `dxcon-fr2` (not a LAG: a single connection)
#     dx-30all-euc1-amne  the hosted Direct Connect from the Network Edge router eg-am-ne02 (FABRIC-AMNE02-AWS-EUC1): a
#                         LOGICAL connection, one 1G port `dxcon-amne`, lives in the Equinix account (`partner_account`)
#     er-30all-weu        the Azure ExpressRoute circuit of westeurope: ONE logical transport with its two links as
#                         ports, `msee-pri` and `msee-sec` (the primary and secondary MSEE, XC-EQXPA4-AZURE-WEU-PRI and
#                         -SEC, the carriers that share a `redundancy_group`)
#
#   The two AWS legs are two transports, not one with two ports: they are two Direct Connect connections of different
#   kinds (dedicated at the cage, hosted through a partner) that share no LAG, and the members of a LAG are the only
#   case where several connections are the ports of one transport. AWS runs the Site-to-Site VPN of the same region as a
#   CloudVPNConnection, not modelled here.
#
#   Physical provider kit stays a DcimPhysicalDevice (MX204_ISP_PE is the generic provider-edge stand-in template;
#   only its et-0/0/0 port is used, as the far end of the cross-connect or cable and the parent of the handoff
#   sub-interface, plus a Loopback0 router-id for the routers that peer with us):
#
#   EXT-MEGAPORT-MCR1   the Megaport zone MCR-PAR1 (../../02_colo/megaport/par). A Megaport MCR is a
#                       cloud-neutral virtual router that Megaport runs in its own enabled facility, so the
#                       facility it is deployed to is Megaport's, not a cloud region; a zone is a facility a
#                       circuit end derives from. The far end of XC-EQXPA4-MEGAPORT
#   EXT-EQX-FABRIC-FR2  the cage FR2 itself: Equinix's Fabric port sits in the same IBX, so the hop to
#                       eg-fr201 is a cable (05_cage_cabling.yml), not a circuit
#
# Created before 03_carrier_circuits.yml and 05_cage_cabling.yml (this directory), whose carriers and cable end on
# them. A physical stub's `deployment` is the facility: add_circuit derives the far end of a carrier from the end
# device's deployment (the circuit data lists only the cage); a transport has `region` instead, and the carriers of
# 03_carrier_circuits.yml list the region next to the cage.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudDirectConnect
  data:
    - name: "dx-30all-euc1-fr2"
      description: "AWS Direct Connect of eu-central-1, dedicated 10G port at the FR2 cage (XC-EQXFR2-AWS-EUC1)"
      status: active
      connection_type: physical
      provider: "P004"
      bandwidth: 10000
      account: "net-hub-aws-prod"
      region: "eu-central-1"
    - name: "dx-30all-euc1-amne"
      description: "AWS hosted Direct Connect of eu-central-1 through the Network Edge router eg-am-ne02 (FABRIC-AMNE02-AWS-EUC1)"  # yamllint disable-line rule:line-length
      status: active
      connection_type: logical
      provider: "P004"
      bandwidth: 1000
      account: "net-hub-aws-prod"
      partner_account: "equinix-network-edge"
      region: "eu-central-1"
    - name: "er-30all-weu"
      description: "Azure ExpressRoute circuit of westeurope: primary and secondary link (XC-EQXPA4-AZURE-WEU-PRI and -SEC)"  # yamllint disable-line rule:line-length
      status: active
      connection_type: logical
      provider: "P005"
      bandwidth: 10000
      account: "net-hub-azure-prod"
      region: "westeurope"
---
# The ports of the transports: the far ends of the virtual_connection carriers (03_carrier_circuits.yml) and the
# parents of the virtual interfaces. A role of `cloud` says what the port faces.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    - name: "dxcon-fr2"
      device: "dx-30all-euc1-fr2"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "Direct Connect dedicated port, leg of the FR2 cage"
    - name: "dxcon-amne"
      device: "dx-30all-euc1-amne"
      interface_type: 1000base-x-sfp
      role: cloud
      status: active
      description: "Hosted Direct Connect port, leg of the Network Edge router eg-am-ne02"
    - name: "msee-pri"
      device: "er-30all-weu"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "ExpressRoute primary link (primary MSEE)"
    - name: "msee-sec"
      device: "er-30all-weu"
      interface_type: 10gbase-x-sfpp
      role: cloud
      status: active
      description: "ExpressRoute secondary link (secondary MSEE)"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "EXT-MEGAPORT-MCR1"
      object_template: MX204_ISP_PE
      owner: "P033"
      description: "Megaport Cloud Router (MCR) in Paris (far end of XC-EQXPA4-MEGAPORT)"
      deployment: "MCR-PAR1"
      member_of_groups:
        - provider_stubs
    - name: "EXT-EQX-FABRIC-FR2"
      object_template: MX204_ISP_PE
      owner: "P016"
      description: "Equinix Fabric port in the FR2 IBX (cabled to eg-fr201, Fabric connections to AM-NE)"
      deployment: "FR2"
      member_of_groups:
        - provider_stubs
