---
# The jacks of PP-EQX-FR2-01: front port N is wired to rear port N. The panel template creates the ports unpaired (an
# object template cannot point a child at a sibling), so this file upserts each front port of the panel (by its
# [panel, name] uniqueness) with its `rear_port`. tests/unit/test_patch_panel_data.py pins that every front port of a
# panel in the demo data is paired.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimFrontPatchPanelPort
  parameters:
    expand_range: true
  data:
    - panel: ["fr2-s1-r-1", "PP-EQX-FR2-01"]
      name: "[1-24]"
      connector: "lc-upc"
      rear_port: "fr2-s1-r-1:PP-EQX-FR2-01:[1-24]"
