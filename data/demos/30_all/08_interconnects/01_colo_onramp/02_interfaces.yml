---
# Ethernet1/35 is the first free `uplink` port on each border leaf (Ethernet1/33
# and 1/34 already face the spines), and Ethernet1/[9-12] are the cage router's
# `dci` ports. The cage end takes the even (first) address of each /127, the DC end the odd one.
#
# Both ends are generated devices — bl-* by add_dc, eg-* by add_colocation_metro
# (from the metro's fabric_templates, see ../../02_colo/equinix/*/02_topology.yml)
# — so this file only loads once those generators have settled. The 30_all staged
# load guarantees that: `interconnects` is the last stage and waits for a quiet
# task queue after each earlier one (tests/integration/test_constants.py's
# ALL_DEMO_LOAD_STAGES).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalInterface
  data:
    # Cage side — `dci` ports, one per DC served by the cage.
    - name: "Ethernet1/10"
      device: "eg-fr01"
      status: active
      description: "Dark fibre to DC10 (bl-dc101101)"
      ip_address:
        data:
          address: "fd00:2500::/127"
    - name: "Ethernet1/11"
      device: "eg-fr01"
      status: active
      description: "Dark fibre to DC11 (bl-dc1111101)"
      ip_address:
        data:
          address: "fd00:2500::2/127"
    - name: "Ethernet1/10"
      device: "eg-pa01"
      status: active
      description: "Dark fibre to DC12 (bl-dc1212101)"
      ip_address:
        data:
          address: "fd00:2500::4/127"

    # DC side — the border leaves' first free uplink.
    - name: "Ethernet1/35"
      device: "bl-dc101101"
      status: active
      description: "Dark fibre to Equinix FR2 (eg-fr01)"
      ip_address:
        data:
          address: "fd00:2500::1/127"
    - name: "Ethernet1/35"
      device: "bl-dc1111101"
      status: active
      description: "Dark fibre to Equinix FR2 (eg-fr01)"
      ip_address:
        data:
          address: "fd00:2500::3/127"
    - name: "Ethernet1/35"
      device: "bl-dc1212101"
      status: active
      description: "Dark fibre to Equinix PA4 (eg-pa01)"
      ip_address:
        data:
          address: "fd00:2500::5/127"
