---
# The shared underlay of the colo on-ramp.
#
# Every circuit here is deliberately *unowned*: no `owner`, because these are
# shared facilities carrying every tenant. A carrier circuit is a pure carrier:
# it has no role and builds no session. What rides it is a virtual circuit of a
# kind, listed in ../03_virtual_circuits/ (the DCI sessions of the dark fibres,
# one Interconnect circuit per fibre) or the handoffs of ../04_sdwan/.
# Tenant impact is a traversal,
# not a circuit: from a
# fibre or a cage port, circuit -> its ports -> the segments, peerings and
# circuits on them.
#
# Three circuit shapes, by the physicality of the ends:
#
#   dark_fiber         DC <-> colocation cage   (TopologyDataCenter <-> ColocationZone)
#   cross_connect      cage <-> the physical router of a provider in its own zone (the Megaport MCR)
#   virtual_connection cage <-> the virtual NIC of a provider-hosted service edge or appliance: a cloud region's
#                      service edge (AWS Direct Connect, Azure ExpressRoute) or an Equinix Network Edge router.
#                      A cloud region has no hardware, so nothing is cabled there; the leg is a virtual service
#
# Without the second shape the traversal reaches the cage and stops, which is
# the DC-boundary blind spot this whole leg exists to close.
#
# `locations` lists the cage. The on-ramp edges deploy to their zone (a facility),
# so add_circuit (generators/topology/circuit.py) derives both ends from the end
# devices' deployments: the edge's zone, the border leaf's DC, the provider
# service edge's cloud region (02_cloud_provider_edges.yml). The cage listed here must
# be that same zone: add_circuit refuses an authored zone that contradicts the
# edge's deployment.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    # --- DC <-> cage dark fibre ---------------------------------------------
    # The fibre is a carrier only. Its DCI session (an underlay /31 plus the loopback-to-loopback
    # EVPN session) comes from the Interconnect circuit that lists the same two ports
    # (../03_virtual_circuits/01_dci_interconnects.yml), built by add_virtual_circuit between the
    # border leaf's and the cage edge's overlay BGP processes. Ethernet1/35 and Ethernet1/36 are
    # the border leaf's free uplinks (Ethernet1/[33-34] go to the two super-spines),
    # Ethernet1/[10-11] the cage router's `dci` ports. Each metro has TWO border gateways, so each
    # DC lands one fibre on the "01" edge (Ethernet1/35) and one on the "02" edge (Ethernet1/36)
    # of the metro it fronts.
    - circuit_id: "DF-DC10-EQXFR2"
      member_of_groups: [carrier_circuits]
      name: "DF-DC10-EQXFR2"
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      provider: "P016"
      description: "DC10 border leaf to Equinix FR2 cage, 100G dark fibre"
      locations:
        - "FR2"
      capabilities:
        - ["bl-dc101101", "Ethernet1/35"]
        - ["eg-fr201", "Ethernet1/10"]

    - circuit_id: "DF-DC11-EQXFR2"
      member_of_groups: [carrier_circuits]
      name: "DF-DC11-EQXFR2"
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      provider: "P016"
      description: "DC11 border leaf to Equinix FR2 cage, 100G dark fibre"
      locations:
        - "FR2"
      capabilities:
        - ["bl-dc1111101", "Ethernet1/35"]
        - ["eg-fr201", "Ethernet1/11"]

    - circuit_id: "DF-DC12-EQXPA4"
      member_of_groups: [carrier_circuits]
      name: "DF-DC12-EQXPA4"
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      provider: "P016"
      description: "DC12 border leaf to Equinix PA4 cage, 100G dark fibre"
      locations:
        - "PA4"
      capabilities:
        - ["bl-dc1212101", "Ethernet1/35"]
        - ["eg-pa401", "Ethernet1/10"]

    - circuit_id: "DF-DC10-EQXFR2-B"
      member_of_groups: [carrier_circuits]
      name: "DF-DC10-EQXFR2-B"
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      provider: "P016"
      description: "DC10 border leaf to Equinix FR2 cage, second 100G dark fibre (second border gateway)"
      locations:
        - "FR2"
      capabilities:
        - ["bl-dc101101", "Ethernet1/36"]
        - ["eg-fr202", "Ethernet1/10"]

    - circuit_id: "DF-DC11-EQXFR2-B"
      member_of_groups: [carrier_circuits]
      name: "DF-DC11-EQXFR2-B"
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      provider: "P016"
      description: "DC11 border leaf to Equinix FR2 cage, second 100G dark fibre (second border gateway)"
      locations:
        - "FR2"
      capabilities:
        - ["bl-dc1111101", "Ethernet1/36"]
        - ["eg-fr202", "Ethernet1/11"]

    - circuit_id: "DF-DC12-EQXPA4-B"
      member_of_groups: [carrier_circuits]
      name: "DF-DC12-EQXPA4-B"
      circuit_type: dark_fiber
      status: active
      bandwidth: 100000
      provider: "P016"
      description: "DC12 border leaf to Equinix PA4 cage, second 100G dark fibre (second border gateway)"
      locations:
        - "PA4"
      capabilities:
        - ["bl-dc1212101", "Ethernet1/36"]
        - ["eg-pa402", "Ethernet1/10"]

    # --- cage <-> cloud region service edges ---------------------------------
    # The cloud end is the region, not a zone: an AZ is finer than any provider
    # commits to for a Direct Connect or ExpressRoute hand-off. The region has no
    # hardware, so the far end is the virtual NIC of the provider's service edge
    # (a CloudNetworkAppliance, 02_cloud_provider_edges.yml) and the carrier is a
    # provider-delivered virtual_connection. The XC- ids keep the name of the
    # cross-connect they were before the region lost its fake router.
    - circuit_id: "XC-EQXFR2-AWS-EUC1"
      member_of_groups: [carrier_circuits]
      name: "XC-EQXFR2-AWS-EUC1"
      circuit_type: virtual_connection
      status: active
      bandwidth: 10000
      provider: "P016"
      description: "Equinix FR2 cage to AWS eu-central-1, Direct Connect 10G, on the Direct Connect service edge NIC"
      locations:
        - "FR2"
      capabilities:
        - ["eg-fr201", "Ethernet1/13"]
        - ["EXT-AWS-DX-FR2", "vnic-fr2"]

    # The Azure ExpressRoute on-ramp: one virtual connection per ExpressRoute leg, each its own carrier.
    # The legs land on two different cage edges (eg-pa401, eg-pa402) and on two NICs of the one ExpressRoute
    # service edge (vnic-pri, vnic-sec), the way Microsoft asks for them; the two carriers share
    # `redundancy_group`, which is what relates the two connections (one connection per leg).
    - circuit_id: "XC-EQXPA4-AZURE-WEU-PRI"
      member_of_groups: [carrier_circuits]
      name: "XC-EQXPA4-AZURE-WEU-PRI"
      circuit_type: virtual_connection
      status: active
      bandwidth: 10000
      redundancy_group: "AZURE-WEU-PA4"
      provider: "P016"
      description: "Equinix PA4 cage to Azure westeurope, ExpressRoute primary leg, 10G"
      locations:
        - "PA4"
      capabilities:
        - ["eg-pa401", "Ethernet1/13"]
        - ["EXT-AZURE-ER-PA4", "vnic-pri"]

    - circuit_id: "XC-EQXPA4-AZURE-WEU-SEC"
      member_of_groups: [carrier_circuits]
      name: "XC-EQXPA4-AZURE-WEU-SEC"
      circuit_type: virtual_connection
      status: active
      bandwidth: 10000
      redundancy_group: "AZURE-WEU-PA4"
      provider: "P016"
      description: "Equinix PA4 cage to Azure westeurope, ExpressRoute secondary leg, 10G"
      locations:
        - "PA4"
      capabilities:
        - ["eg-pa402", "Ethernet1/13"]
        - ["EXT-AZURE-ER-PA4", "vnic-sec"]

    # Megaport: the Cloud Router (MCR) of Megaport's Paris facility, reached from the PA4 cage over one
    # cross-connect. The stub EXT-MEGAPORT-MCR1 is deployed to the zone MCR-PAR1 (../../02_colo/megaport/par),
    # which add_circuit derives as the far end. Equinix sells the cross-connect, Megaport the service.
    - circuit_id: "XC-EQXPA4-MEGAPORT"
      member_of_groups: [carrier_circuits]
      name: "XC-EQXPA4-MEGAPORT"
      circuit_type: cross_connect
      status: active
      bandwidth: 10000
      provider: "P016"
      description: "Equinix PA4 cage to the Megaport Cloud Router (MCR) in Paris, 10G"
      locations:
        - "PA4"
      capabilities:
        - ["eg-pa401", "Ethernet1/1"]
        - ["EXT-MEGAPORT-MCR1", "et-0/0/0"]

    # --- Equinix Fabric virtual connections ----------------------------------
    # A provider-delivered virtual connection is a carrier like a cross-connect: Equinix runs it inside its own
    # platform, so an end may be the virtual NIC of a provider-hosted Network Edge router (no cable) and a port hosts
    # several of them (checks/carrier_circuit_ports.py). The first one leaves
    # eg-fr201 on the port that is also cabled to Equinix's own Fabric port (05_cage_cabling.yml); the second lands on
    # its own NIC (vnic-amne) of the AWS Direct Connect service edge, next to the one (vnic-fr2) of
    # XC-EQXFR2-AWS-EUC1.
    - circuit_id: "FABRIC-FR2-AMNE01"
      member_of_groups: [carrier_circuits]
      name: "FABRIC-FR2-AMNE01"
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      provider: "P016"
      description: "Equinix Fabric virtual connection, FR2 cage to the Network Edge router eg-am-ne01 in AM-NE, 1G"
      locations:
        - "FR2"
      capabilities:
        - ["eg-fr201", "Ethernet1/1"]
        - ["eg-am-ne01", "Ethernet1/1"]

    - circuit_id: "FABRIC-AMNE02-AWS-EUC1"
      member_of_groups: [carrier_circuits]
      name: "FABRIC-AMNE02-AWS-EUC1"
      circuit_type: virtual_connection
      status: active
      bandwidth: 1000
      provider: "P016"
      description: "Equinix Fabric virtual connection, Network Edge router eg-am-ne02 to AWS eu-central-1 (hosted Direct Connect), 1G"  # yamllint disable-line rule:line-length
      locations:
        - "AM-NE"
      capabilities:
        - ["eg-am-ne02", "Ethernet1/1"]
        - ["EXT-AWS-DX-FR2", "vnic-amne"]
