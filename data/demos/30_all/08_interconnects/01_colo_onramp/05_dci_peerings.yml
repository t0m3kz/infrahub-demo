---
# Address families the DCI sessions carry: IPv6 unicast for the remote site's
# VIP/VTEP reachability, L2VPN EVPN for the stretched segments themselves.
# Upserted by HFID [afi, safi], so this is safe whether or not a generator
# (generators/routing.py _ensure_evpn_af_node) already created l2vpn/evpn.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingBGPAddressFamily
  data:
    - afi: ipv6
      safi: unicast
      description: "IPv6 unicast"
    - afi: l2vpn
      safi: evpn
      description: "L2VPN EVPN overlay"
---
# EVPN Multi-Site DCI sessions, one per dark fibre — directly connected eBGP
# (ttl 1) between the DC's border gateway overlay process and the metro edge's
# (add_colocation_metro creates the edge side, add_dc/pod the DC side).
#
# peering_role dci is what keeps these out of the underlay peer group
# (transforms/helpers/bgp.py groups ttl-1 sessions as UNDERLAY-PEERS otherwise)
# and what marks their local interface for `evpn multisite dci-tracking`.
#
# Data-driven rather than generated: the add_circuit generator's target group
# (physical_circuits) has no members, and no generator sees both ends of a
# dark fibre — same reason the interfaces in 02_interfaces.yml are hand-written.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGPPeering
  data:
    - name: "DCI-DC10-EQXFR2"
      description: "EVPN Multi-Site DCI bl-dc101101 <-> eg-fr01 over DF-DC10-EQXFR2"
      session_type: EBGP
      peering_role: dci
      ttl: 1
      bfd_enabled: true
      send_community: true
      send_extended_community: true
      address_families:
        - ["ipv6", "unicast"]
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "bl-dc101101-bgp-overlay"
        - "eg-fr01-bgp-overlay"
      interface_capabilities:
        - ["bl-dc101101", "Ethernet1/35"]
        - ["eg-fr01", "Ethernet1/10"]
    - name: "DCI-DC11-EQXFR2"
      description: "EVPN Multi-Site DCI bl-dc1111101 <-> eg-fr01 over DF-DC11-EQXFR2"
      session_type: EBGP
      peering_role: dci
      ttl: 1
      bfd_enabled: true
      send_community: true
      send_extended_community: true
      address_families:
        - ["ipv6", "unicast"]
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "bl-dc1111101-bgp-overlay"
        - "eg-fr01-bgp-overlay"
      interface_capabilities:
        - ["bl-dc1111101", "Ethernet1/35"]
        - ["eg-fr01", "Ethernet1/11"]
    - name: "DCI-DC12-EQXPA4"
      description: "EVPN Multi-Site DCI bl-dc1212101 <-> eg-pa01 over DF-DC12-EQXPA4"
      session_type: EBGP
      peering_role: dci
      ttl: 1
      bfd_enabled: true
      send_community: true
      send_extended_community: true
      address_families:
        - ["ipv6", "unicast"]
        - ["l2vpn", "evpn"]
      bgp_processes:
        - "bl-dc1212101-bgp-overlay"
        - "eg-pa01-bgp-overlay"
      interface_capabilities:
        - ["bl-dc1212101", "Ethernet1/35"]
        - ["eg-pa01", "Ethernet1/10"]
