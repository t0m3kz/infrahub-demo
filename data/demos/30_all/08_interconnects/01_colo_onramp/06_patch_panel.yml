---
# The patch panel of the FR2 cage's cross-connect (07_patch_panel_cabling.yml). A DcimPatchPanel is not a device: it has
# no role, no artifact and no capabilities, only 24 rear ports and 24 front ports from the PP-24-LC template
# (data/bootstrap/10_physical_devices_templates_patch_panel_rear.yaml and _front.yaml). The template cannot pair a front
# port with its rear port, so the next file does (06b_patch_panel_mapping.yml). Both load before the cables that land on
# the ports (the files of this folder load in name order).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPatchPanel
  data:
    - name: "PP-EQX-FR2-01"
      object_template: PP-24-LC
      description: "FR2 cage patch panel (cross-connect to the Equinix Fabric port)"
      rack: fr2-s1-r-1
