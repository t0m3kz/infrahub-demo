---
# The patch panel of the FR2 cage's cross-connect (07_patch_panel_cabling.yml). A DcimPatchPanel is not a device: it has
# no role, no artifact and no capabilities, only the 24 rear and 24 front ports of its type lc-24, which the generator
# add_patch_panel builds, each front port on its rear port (group trigger of patch_panels, which the panel declares).
# The panel loads before the cables that land on the ports (the files of this folder load in name order).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPatchPanel
  data:
    - name: "PP-EQX-FR2-01"
      panel_type: lc-24
      description: "FR2 cage patch panel (cross-connect to the Equinix Fabric port)"
      rack: fr2-s1-r-1
      member_of_groups:
        - patch_panels
