---
# Firewall-level enforcement for colo-hosted cloud/partner/SaaS interconnects.
# Every destination is reachable: the AWS rule names the VPC block C001 registers behind the
# AWS transit VIF session (nordix-vpc-prod, 06_customer_boarding/c001/cloud), the Acme rule
# the prefix C001 registers behind the partner tunnel (01_partner_tunnel.yml), and the Zscaler rule
# the Internet segment (a SaaS PoP is public space: nothing registers it). Both prefix objects
# live in PROD, declared where they are registered; no prefix is declared for the policy alone.
# These are rules of C001's "nordix-prod" segment
# (data/demos/30_all/07_applications/c001/00_segment.yml), so they live in that
# segment's own policy — every rule does: seg-<segment>-egress is the one
# policy per segment, shared with the rules the application generator writes
# for the segment's AppDependencies (they take index >= 100; these hand-written
# ones stay below). The destination is a registered prefix on the far side of the
# interconnect, or the Internet segment, not a tenant segment.
#
# default_action: deny means nothing beyond the explicit permits reaches
# AWS/Acme/the internet from this segment. How each flow is enforced follows
# leaf PBR (transforms/helpers/firewall_pbr.py::get_customer_pbr_rules): a permit to a
# prefix in the segment's own VRF (the AWS VPC block and the Acme range, PROD prefixes the
# tenant VRF routes because the border learns them) is bypassed — it stays on the fabric and
# the leaf ACL enforces it; a permit to the Internet segment (the Zscaler rule) is never
# bypassed and is redirected to the FR metro firewall context.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityPolicy
  data:
    - name: seg-c001-nordix-prod-p-egress
      description: "Egress contract of c001-nordix-prod-p, incl. its colo-hosted cloud/partner/SaaS interconnects"
      segment: "c001-nordix-prod-p"
      default_action: deny
      enabled: true
      rules:
        data:
          - index: 10
            name: nordix-prod-to-aws
            action: permit
            protocol: tcp
            port_start: 443
            source_segment: "c001-nordix-prod-p"
            # The VPC block of nordix-vpc-prod (a PROD prefix object, not a copy in `default`).
            destination_prefixes:
              - ["10.10.0.0/16", "PROD"]
            log: false
            description: "Nordix web/app tier to its AWS VPC over HANDOFF-FR2-AWS-EUC1-PROD"

          - index: 20
            name: nordix-prod-to-partner-acme
            action: permit
            protocol: tcp
            port_start: 8080
            source_segment: "c001-nordix-prod-p"
            destination_prefixes:
              - ["198.18.0.0/24", "PROD"]
            log: true
            description: "Nordix to Acme Logistics B2B extranet over C001-PARTNER-ACME-FR2"

          - index: 30
            name: nordix-prod-to-saas-zscaler
            action: permit
            protocol: tcp
            port_start: 443
            source_segment: "c001-nordix-prod-p"
            # A SaaS security PoP is internet space: the Internet segment, not a registered prefix.
            destination_segment: "internet"
            apply_on_switch: false
            log: false
            description: "Nordix web tier to the Zscaler cloud security PoP, an internet destination"
---
# Internet egress of DC11. C006's "nordix-prod" segment (a VXLAN segment in
# DC11's shared PAN-OS firewall context) may open https to the Internet segment
# (data/bootstrap/27_external_segments.yml): a segment with no prefix, in
# INTERNET-ZONE. The firewall renders it as zone INTERNET-ZONE, destination
# any. The leaf ACL cannot say "anything but internal", so it denies every
# NON_INTERNET_PREFIXES range first and only then permits any
# (transforms/helpers/acl.py). apply_on_switch stays false: a switch-enforced
# rule would pull the segment's whole ACL onto the leaf (_leaf_enforces).
# Index below 100 like the hand-written rules above.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityPolicy
  data:
    - name: seg-c006-nordix-prod-p-egress
      description: "Egress contract of c006-nordix-prod-p, incl. its internet egress"
      segment: "c006-nordix-prod-p"
      default_action: deny
      enabled: true
      rules:
        data:
          - index: 10
            name: nordix-prod-to-internet-https
            action: permit
            protocol: tcp
            port_start: 443
            source_segment: "c006-nordix-prod-p"
            destination_segment: "internet"
            apply_on_switch: false
            log: false
            description: "Lumivex ERP tier to the internet over https, through the DC11 firewall"

          # Core services (DNS, NTP) of DC11: the infra segment sits in
          # MANAGEMENT-ZONE (../../07_applications/infra/00_segment.yml). The
          # firewall source-NATs these flows behind its MANAGEMENT leg VIP and
          # nothing in MANAGEMENT-ZONE may initiate towards a tenant.
          - index: 20
            name: nordix-prod-to-core-dns
            action: permit
            protocol: udp
            port_start: 53
            source_segment: "c006-nordix-prod-p"
            destination_segment: "infra-core-dns-ntp-p"
            apply_on_switch: false
            log: false
            description: "Lumivex ERP tier to the DC11 core DNS, through the DC11 firewall"

          - index: 30
            name: nordix-prod-to-core-ntp
            action: permit
            protocol: udp
            port_start: 123
            source_segment: "c006-nordix-prod-p"
            destination_segment: "infra-core-dns-ntp-p"
            apply_on_switch: false
            log: false
            description: "Lumivex ERP tier to the DC11 core NTP, through the DC11 firewall"
