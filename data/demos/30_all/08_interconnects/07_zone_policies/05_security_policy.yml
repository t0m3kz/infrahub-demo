---
# Firewall-level enforcement for colo-hosted cloud/partner/SaaS interconnects.
# These are rules of C001's "nordix-prod" segment
# (data/demos/30_all/07_applications/c001/00_segment.yml), so they live in that
# segment's own policy — every rule does: seg-<segment>-egress is the one
# policy per segment, shared with the rules the application generator writes
# for the segment's AppDependencies (they take index >= 100; these hand-written
# ones stay below). The destination is a prefix (04_destination_prefixes.yml)
# on the far side of the interconnect, not a segment.
#
# default_action: deny means nothing beyond the explicit permits reaches
# AWS/Acme/Zscaler from this segment — and getting there at all still
# requires the traffic to have been PBR-redirected to the FR metro firewall
# first (transforms/helpers/firewall.py::get_border_leaf_pbr_rules), since
# that redirect doesn't look at destination — this policy is the SECOND gate,
# not a way to skip the first.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityPolicy
  data:
    - name: seg-c001-nordix-prod-p-egress
      description: "Egress contract of c001-nordix-prod-p, incl. its colo-hosted cloud/partner/SaaS interconnects"
      segment: "c001-nordix-prod-p"
      default_action: deny
      enabled: true
      rules:
        data:
          - index: 10
            name: nordix-prod-to-aws
            action: permit
            protocol: tcp
            port_start: 443
            source_segment: "c001-nordix-prod-p"
            destination_prefixes:
              - ["10.40.0.0/16", "default"]
            log: false
            description: "Nordix web/app tier to AWS transit hub over VC-C001-EQXFR-AWS-EUC1"

          - index: 20
            name: nordix-prod-to-partner-acme
            action: permit
            protocol: tcp
            port_start: 8080
            source_segment: "c001-nordix-prod-p"
            destination_prefixes:
              - ["198.18.0.0/24", "default"]
            log: true
            description: "Nordix to Acme Logistics B2B extranet over C001-PARTNER-ACME-FR2"

          - index: 30
            name: nordix-prod-to-saas-zscaler
            action: permit
            protocol: tcp
            port_start: 443
            source_segment: "c001-nordix-prod-p"
            destination_prefixes:
              - ["198.51.100.0/24", "default"]
            log: false
            description: "Nordix web tier to Zscaler cloud security PoP"
