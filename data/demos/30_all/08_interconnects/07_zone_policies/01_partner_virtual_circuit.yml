---
# Partner-acme B2B extranet, modelled as a second IPsec tunnel riding C001's
# existing internet underlay (INET-C001-OFFICE, which add_sdwan_edge built for the
# C001-OFFICE together with its C001-OFFICE-EDGE1 edge) rather than a new dedicated
# physical cross-connect.
#
# A dedicated 1:1 cross-connect was tried first and rejected:
# TopologyPhysicalCircuit's cross_connect/dark_fiber types are a hard,
# tested invariant of shared *unowned* underlay with exactly two
# TopologyConnectableLocation endpoints (tests/integration/
# test_62_all_demo_interconnects.py::test_01_verify_physical_circuits) — a
# partner has no TopologyConnectableLocation of its own, and a
# customer-owned single-ended cross_connect violates both rules. Riding the
# existing internet-type underlay as a second overlay (same pattern as the
# office's own SD-WAN tunnel) needs no new physical circuit at all, and is
# realistic: most B2B partner integrations really are IPsec over internet, not
# a private cross-connect.
#
# Terminates on the same shared SD-WAN gateway as C001-OFFICE-SDWAN-FR2, on its own
# sub-interface: one gateway trunk carries several tunnels. Its tunnel id 1002
# is hand-assigned, below the SD-WAN tunnel-id pool (2000-9999) the generated
# office tunnels draw from, so the two never collide.
#
# Loaded with the interconnects, after the compute_and_customers stage whose
# add_sdwan_edge runs created INET-C001-OFFICE and C001-OFFICE-EDGE1 (a later loader run,
# so these references are not same-run HFID lookups).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "eth0.1002"
      device: "EQX-FR2-SDWAN-GW1"
      role: uplink
      status: active
      description: "C001 partner-acme IPsec tunnel termination"
      parent_interface: ["EQX-FR2-SDWAN-GW1", "eth0"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyVirtualCircuit
  data:
    - name: "C001-PARTNER-ACME-FR2"
      member_of_groups: [virtual_circuits]
      link_type: vpn_ipsec
      transport_mode: internet_backed
      status: active
      bandwidth: 200
      encryption: true
      tunnel_id: 1002
      provider: "P019"
      owner: "C001"
      description: "Nordix to B2B extranet partner Acme Logistics, IPsec over the Warsaw HQ internet underlay"
      locations:
        - "C001-OFFICE"
        - "FR2"
      capabilities:
        - ["C001-OFFICE-EDGE1", "GE1"]
        - ["EQX-FR2-SDWAN-GW1", "eth0.1002"]
