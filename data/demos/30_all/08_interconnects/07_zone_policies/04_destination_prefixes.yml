---
# Destination-side selectors for 05_security_policy.yml's SecurityPolicyRules.
# These are the reachable networks on the FAR side of a colo interconnect —
# not our own VRF-scoped addressing, so they sit in the `default` namespace
# rather than PROD/NON-PROD (see SecurityPolicyRule.destination_prefixes,
# schemas/extensions/security/security.yml — a prefix-based selector, used
# here instead of forcing the far side into a ManagedNetworkSegment/
# SecurityZone it doesn't fit: it has no OrganizationCustomer owner and no
# VNI/segment lifecycle of its own).
#
# 10.40.0.0/16 is the range of C004's Azure VNet (peakora-vnet-prod), not an AWS hub
# VPC: no handoff session accepts it, so the rule aiming at it is unreachable (an
# open data gap, see the border-filtering PR). Partner/SaaS use RFC5737/RFC2544
# documentation ranges rather than a real company's public space; neither is
# registered behind any BGP session either.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.40.0.0/16"
      ip_namespace: "default"
      status: active
      role: public
      description: "C004 Azure VNet peakora-vnet-prod range; no handoff session accepts it (no Azure handoff)"

    - prefix: "198.18.0.0/24"
      ip_namespace: "default"
      status: active
      role: public
      description: "Acme Logistics B2B extranet — reachable range over the IPsec tunnel C001-PARTNER-ACME-FR2"

    - prefix: "198.51.100.0/24"
      ip_namespace: "default"
      status: active
      role: public
      description: "Zscaler cloud security PoP — reachable range over the FR colo interconnect"
