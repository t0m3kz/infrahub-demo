# TopologySessionCircuit declarations in recursive dependency order.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    - vrf: [C001-OFFICE, "PROD"]
      name: "C001-PARTNER-ACME-FR2"
      circuit_type: tunnel
      member_of_groups: [virtual_circuits]
      status: active
      provider: "P035"
      description: "Nordix to B2B extranet partner Acme Logistics, IPsec over the internet, via the SD-WAN gateway"
      locations:
        - "C001-OFFICE"
        - "FR2"
      capabilities:
        - ["EQX-FR2-SDWAN-GW1", "eth1"]
        - ["EXT-ACME-EDGE1", "et-0/0/0"]
      registered_prefixes:
        - ["198.18.0.0/24", "default"]
