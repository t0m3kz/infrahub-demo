---
# The AWS side of the Direct Connect connections, the stub EXT-AWS-DX-FR2
# (../01_colo_onramp/02_cloud_provider_edges.yml): its router-id, its AS and its BGP process. Authored once and shared
# by every connection that lands on it
# (PC-FR2-AWS-EUC1-PROD and PC-AMNE-AWS-EUC1-PROD): the generator of a provider connection creates only what is
# per connection (the sub-interface of the session on each end, the session circuit), never the stub.
#
# The router-id is a loopback, not a link address: the link addresses are generated with the session circuit.
# 10.255.64.0/24 holds the loopbacks of the party devices we model as stubs, clear of the handoff pools
# (10.255.128.0/18) and of every authored range.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Loopback0"
      device: "EXT-AWS-DX-FR2"
      role: loopback
      status: active
      description: "Router-id of the AWS Direct Connect router"
      ip_address:
        data:
          address: "10.255.64.1/32"
          ip_namespace: "PROD"
---
# 64512 is the default Amazon-side ASN of a Direct Connect gateway / Transit Gateway. The 2-byte private range is
# unused by the fabrics here (their ASNs are 4-byte, 42xxxxxxxx). The connections name it as their `provider_as`.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 64512
      owner: "P004"
      description: "AWS Amazon-side ASN (tgw-30all-euc1 via the Direct Connect connections)"
---
# The AWS side's BGP process. AWS configures it, not a transform here: it exists so the generated session has a remote
# AS (the handoff's party ASN is this process's local_as) and a second endpoint. It is the device's only ManagedBGP
# process, which is how the generator picks it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "EXT-AWS-DX-FR2-bgp"
      status: active
      local_as: "AS64512"
      router_id: ["10.255.64.1/32", "PROD"]
      capabilities:
        - "EXT-AWS-DX-FR2"
---
# BGP auth keys of the AWS connections. Demo-only secrets, like the API token in the README.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingPassword
  data:
    - name: "eqx-fr2-aws-vif-key"
      description: "BGP auth key for the eg-fr201 <-> EXT-AWS-DX-FR2 PROD transit connection"
      password: "demo-eqx-fr2-aws-vif"
    - name: "eqx-am-ne-aws-vif-key"
      description: "BGP auth key for the eg-am-ne02 <-> EXT-AWS-DX-FR2 PROD transit connection"
      password: "demo-eqx-am-ne-aws-vif"
