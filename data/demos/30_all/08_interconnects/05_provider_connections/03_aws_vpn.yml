---
# An AWS Site-to-Site VPN, the one `internet_vpn` connection onto a VPC: FR2 reaches nordix-vpc-vpn (C001, a VPC that is
# not on the Transit Gateway hub) over the internet. MODEL ONLY: the inventory, the addressing and the eBGP sessions are
# generated, but no IPsec or tunnel template exists (no lab-verified syntax), so the transform and the check report
# the tunnel as unrendered (WARNING) and nothing is configured on eg-fr201 for it.
#
#   path_type / service   internet_vpn / private: tunnels over the near facility's internet carrier onto one virtual
#                         network. FR2 has two internet-fed edges (eg-fr201 on Lumen, eg-fr202 on Cogent), so the
#                         connection lists the carrier it leaves by, INET-LUMEN-EQXFR2: the tunnels are
#                         Tunnel<n> interfaces of eg-fr201 riding on its Ethernet1/14
#   account               nordix-aws-prod: the connection has no `owner` of its own, it is C001's through the account
#   attached_network      nordix-vpc-vpn, 10.20.0.0/16 (../../06_customer_boarding/c001/cloud/aws/eu-central-1/)
#   provider_as           AS64513, the Amazon side of the VPN gateway (its own ASN, so it is told from the Direct
#                         Connect service edge EXT-AWS-DX-FR2, AS64512, that shares the region; the appliance's own
#                         BGP process below)
#   link_prefixes         the two 169.254.0.0/30 ranges AWS hands out, one per tunnel: provider assigned (flavour
#                         aws/internet_vpn: /30, two links, the provider end the lower address), never allocated
#                         from our pools. The generator pairs them onto the two session circuits by prefix order:
#                         PC-FR2-AWS-EUC1-VPN-PROD-L1 gets 169.254.10.0/30, -L2 gets 169.254.10.4/30.
#
# The far end is the VPN gateway's service edge, a second CloudNetworkAppliance of the region eu-central-1 (the Direct
# Connect one, EXT-AWS-DX-FR2, stays the only BGP process of its device): the two services speak different Amazon-side
# ASes and a device carries ONE BGP process, so one provider and one region have two appliances here. Only the
# appliance and its AS are authored: the generator gives it its Loopback0 (router-id, from Provider-Stub-Loopback-IPv4),
# its BGP process in `provider_as` and the Tunnel<n> interfaces.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkAppliance
  data:
    - name: "EXT-AWS-VPN-EUC1"
      object_template: AWS_SERVICE_EDGE
      description: "AWS Site-to-Site VPN gateway of eu-central-1 (far end of PC-FR2-AWS-EUC1-VPN-PROD)"
      deployment: "eu-central-1"
---
# The VPN gateway speaks its own Amazon-side ASN (a virtual private gateway takes a custom one): the connection's
# `provider_as` is how the generator tells this appliance from the Direct Connect one in the same region.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 64513
      owner: "P004"
      description: "AWS Amazon-side ASN of the Site-to-Site VPN gateway of eu-central-1"
---
# The tunnel ranges AWS assigns: a /30 per tunnel from 169.254.0.0/16, in the connection's namespace.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "169.254.10.0/30"
      ip_namespace: "PROD"
      status: active
      description: "AWS VPN tunnel 1 of PC-FR2-AWS-EUC1-VPN-PROD, assigned by AWS"
    - prefix: "169.254.10.4/30"
      ip_namespace: "PROD"
      status: active
      description: "AWS VPN tunnel 2 of PC-FR2-AWS-EUC1-VPN-PROD, assigned by AWS"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnection
  data:
    - name: "PC-FR2-AWS-EUC1-VPN-PROD"
      member_of_groups: [provider_connections]
      description: "PROD Site-to-Site VPN FR2 cage <-> AWS eu-central-1, two tunnels onto nordix-vpc-vpn (AS64513)"
      path_type: internet_vpn
      service: private
      status: active
      bandwidth: 1250
      near: "FR2"
      far: "eu-central-1"
      ip_namespace: "PROD"
      account: "nordix-aws-prod"
      provider_as: "AS64513"
      attached_network: "nordix-vpc-vpn"
      carrier_circuits:
        - "INET-LUMEN-EQXFR2"
      link_prefixes:
        - ["169.254.10.0/30", "PROD"]
        - ["169.254.10.4/30", "PROD"]
