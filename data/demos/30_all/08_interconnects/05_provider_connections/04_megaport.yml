---
# Megaport, as a PROD provider connection: our PA4 cage edge eg-pa401 Ethernet1/1.1300 <-> the Megaport Cloud Router
# (MCR) stub's EXT-MEGAPORT-MCR1 et-0/0/0.1300, VLAN 1300 on both. It is the example of a cloud-neutral
# network-as-a-service provider: a Megaport MCR is a virtual router in Megaport's own facility that the customer reaches
# over a cross-connect and then sells onwards to any cloud, so it has no account, no attached network or gateway and no
# cloud region of its own. The far facility is the Megaport zone MCR-PAR1 the stub is deployed to
# (../01_colo_onramp/02_cloud_provider_edges.yml).
#
# The carrier is the cross-connect XC-EQXPA4-MEGAPORT (../01_colo_onramp/03_carrier_circuits.yml): eg-pa401 Ethernet1/1
# and the stub's et-0/0/0. Equinix sells the cross-connect, Megaport the service (profile megaport: a /31 from OUR pool,
# one session). Nothing of the session is authored: add_provider_connection builds the session circuit
# PC-PA4-MEGAPORT-PROD-L1 with its sub-interfaces and add_virtual_circuit the /31 from Handoff-PROD-IPv4 and the eBGP
# session between eg-pa401's overlay process and EXT-MEGAPORT-MCR1-bgp. The party's ASN is that process's local_as
# (the connection's `provider_as`, the same AS). The stub's router-id, AS and BGP process are authored below, like
# every stub: the generator reads them the moment the connection is created.
#
# Unowned shared on-ramp, in PROD like every handoff of the cage edges.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    # The MCR's router-id: a loopback, not a link address (those are generated with the session circuit).
    # 10.255.64.0/24 holds the loopbacks of the party devices we model as stubs, clear of the handoff
    # pools (10.255.128.0/18); .1 is the AWS router, .2 the SD-WAN gateway.
    - name: "Loopback0"
      device: "EXT-MEGAPORT-MCR1"
      role: loopback
      status: active
      description: "Router-id of the Megaport Cloud Router"
      ip_address:
        data:
          address: "10.255.64.3/32"
          ip_namespace: "PROD"
---
# Megaport's public ASN (an MCR peers with it).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 133937
      owner: "P033"
      description: "AS133937 - Megaport (Megaport Cloud Router)"
---
# The MCR's BGP process. Megaport configures it, not a transform here: it exists so the generated session has a remote
# AS and a second endpoint. It is the device's only ManagedBGP process, which is how the generator picks it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "EXT-MEGAPORT-MCR1-bgp"
      status: active
      local_as: "AS133937"
      router_id: ["10.255.64.3/32", "PROD"]
      capabilities:
        - "EXT-MEGAPORT-MCR1"
---
# Demo-only secret, like the API token in the README.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingPassword
  data:
    - name: "eqx-pa4-megaport-key"
      description: "BGP auth key for the eg-pa401 <-> EXT-MEGAPORT-MCR1 PROD connection"
      password: "demo-eqx-pa4-megaport"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnection
  data:
    - name: "PC-PA4-MEGAPORT-PROD"
      member_of_groups: [provider_connections]
      description: "PROD Megaport connection PA4 cage <-> Megaport Cloud Router EXT-MEGAPORT-MCR1 (AS133937)"
      path_type: dedicated
      service: private
      status: active
      bandwidth: 10000
      vlan_id: 1300
      near: "PA4"
      far: "MCR-PAR1"
      ip_namespace: "PROD"
      provider_as: "AS133937"
      password: "eqx-pa4-megaport-key"
      carrier_circuits:
        - "XC-EQXPA4-MEGAPORT"
