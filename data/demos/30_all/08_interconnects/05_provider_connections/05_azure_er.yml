---
# Azure ExpressRoute, private peering, as TWO provider connections with a PROVIDER-ASSIGNED /30 each: one connection per
# leg (the primary and the secondary), PA4 cage <-> Azure westeurope. The legs are related by the `redundancy_group` of
# their carriers, not by a shared connection. It used to be the idle on-ramp of the demo: the appliance existed, nothing
# rode it.
#
#   PC-PA4-AZURE-WEU-PRI-PROD   near port eg-pa401 Ethernet1/13 (an `uplink` port adopted explicitly), the existing
#                               carrier XC-EQXPA4-AZURE-WEU-PRI <-> EXT-AZURE-ER-PA4 vnic-pri,
#                               link range 10.255.72.0/30, session circuit PC-PA4-AZURE-WEU-PRI-PROD-L1
#   PC-PA4-AZURE-WEU-SEC-PROD   near port eg-pa402 Ethernet1/13, the existing carrier
#                               XC-EQXPA4-AZURE-WEU-SEC <-> EXT-AZURE-ER-PA4 vnic-sec,
#                               link range 10.255.72.4/30, session circuit PC-PA4-AZURE-WEU-SEC-PROD-L1
#                               (../01_colo_onramp/03_carrier_circuits.yml;
#                               ../01_colo_onramp/02_cloud_provider_edges.yml: EXT-AZURE-ER-PA4 is the ExpressRoute
#                               service edge of westeurope, a CloudNetworkAppliance with one NIC per leg)
#
#   flavour azure/dedicated     ONE /30 link per connection, our end the lower address, BFD; the range is the
#                               connection's `link_prefixes`, never allocated from our pools (Handoff-PROD-IPv4 stays
#                               untouched).
#   account / attached          peakora-azure-prod (C004) and its VNet peakora-vnet-prod, 10.40.0.0/16: the block is
#                               registered by the VNet's account owner behind both sessions
#   provider_as                 AS12076, Microsoft's ASN, the far process of both sessions (the appliance's only BGP
#                               process)
#   vlan_id                     1400, the S-tag of the peering on both legs
#
# The appliance's router-id, AS and BGP process are authored below, like every stub. The key is shared by the two legs.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Loopback0"
      device: "EXT-AZURE-ER-PA4"
      role: loopback
      status: active
      description: "Router-id of the Azure ExpressRoute service edge"
      ip_address:
        data:
          address: "10.255.64.5/32"
          ip_namespace: "PROD"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 12076
      owner: "P005"
      description: "AS12076 - Microsoft (Azure ExpressRoute)"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "EXT-AZURE-ER-PA4-bgp"
      status: active
      local_as: "AS12076"
      router_id: ["10.255.64.5/32", "PROD"]
      capabilities:
        - "EXT-AZURE-ER-PA4"
---
# The two link ranges, one per ExpressRoute leg, in the connection's namespace and clear of the handoff pools.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.255.72.0/30"
      ip_namespace: "PROD"
      status: active
      description: "ExpressRoute primary link of PC-PA4-AZURE-WEU-PRI-PROD"
    - prefix: "10.255.72.4/30"
      ip_namespace: "PROD"
      status: active
      description: "ExpressRoute secondary link of PC-PA4-AZURE-WEU-SEC-PROD"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingPassword
  data:
    - name: "eqx-pa4-azure-er-key"
      description: "BGP auth key for the eg-pa40x <-> EXT-AZURE-ER-PA4 PROD ExpressRoute legs"
      password: "demo-eqx-pa4-azure-er"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnection
  data:
    - name: "PC-PA4-AZURE-WEU-PRI-PROD"
      member_of_groups: [provider_connections]
      description: "PROD ExpressRoute private peering PA4 <-> Azure westeurope, primary leg (AS12076)"
      path_type: dedicated
      status: active
      bandwidth: 10000
      vlan_id: 1400
      near: "PA4"
      far: "westeurope"
      near_port: ["eg-pa401", "Ethernet1/13"]
      ip_namespace: "PROD"
      account: "peakora-azure-prod"
      provider_as: "AS12076"
      attached_network: "peakora-vnet-prod"
      password: "eqx-pa4-azure-er-key"
      link_prefixes:
        - ["10.255.72.0/30", "PROD"]
    - name: "PC-PA4-AZURE-WEU-SEC-PROD"
      member_of_groups: [provider_connections]
      description: "PROD ExpressRoute private peering PA4 <-> Azure westeurope, secondary leg (AS12076)"
      path_type: dedicated
      status: active
      bandwidth: 10000
      vlan_id: 1400
      near: "PA4"
      far: "westeurope"
      near_port: ["eg-pa402", "Ethernet1/13"]
      ip_namespace: "PROD"
      account: "peakora-azure-prod"
      provider_as: "AS12076"
      attached_network: "peakora-vnet-prod"
      password: "eqx-pa4-azure-er-key"
      link_prefixes:
        - ["10.255.72.4/30", "PROD"]
