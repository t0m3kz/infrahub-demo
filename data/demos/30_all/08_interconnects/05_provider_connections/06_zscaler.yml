---
# A SaaS private peering: C001's range behind a Zscaler Enforcement Node, reached from the FR2 cage over two tunnels on
# the internet. It is the one connection whose far end is a SaaS region (04_saas/zscaler/00_topology.yml) and the one
# with an `owner` of its own: a SaaS has no cloud account to derive the owner from, so the subscribing customer, C001,
# is named on the connection, and it registers ONE range behind the far side (`registered_prefixes`, below).
#
#   path_type             internet_vpn: two tunnels (primary and secondary node, flavour zscaler/internet_vpn: a /30
#                         per tunnel from OUR pool Handoff-PROD-IPv4, multihop TTL 2) over the near facility's
#                         internet carrier
#   near_port             eg-fr201 Ethernet1/14, the port of INET-LUMEN-EQXFR2 the tunnels leave by (FR2 has two
#                         internet-fed edges, eg-fr202 on Cogent is the other), so the connection names its edge
#   far                   ZSCALER-MUNICH I, a TopologySaasRegion; the node is the hosted function EXT-ZSCALER-MUC1, a
#                         CloudNetworkAppliance of device type ZEN on platform zscaler_zen (data/bootstrap/
#                         09_network_appliance_templates_zscaler.yaml) with role `provider`: nothing is rendered for it
#   registered_prefixes   198.18.1.0/24, the private application range of C001 reachable through Zscaler: the border
#                         policy accepts it from the session and announces it to C001's other external sessions only
#                         (utils/ownership.py exchange_policies). Provider space: it is exempt from the shared-prefix
#                         conflict when each owner holds it behind its own session
#   provider_as           AS22616, Zscaler's ASN, the far process of both sessions: the node has no authored
#                         Loopback0 or process, the generator builds them (router-id from Provider-Stub-Loopback-IPv4)
#
# MODEL ONLY, like every vpn: the tunnels are reported as unrendered (WARNING), no tunnel template exists.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudNetworkAppliance
  data:
    - name: "EXT-ZSCALER-MUC1"
      object_template: ZSCALER_ZEN
      description: "Zscaler Enforcement Node of Munich I (far end of PC-FR2-ZSCALER-MUC-PROD)"
      deployment: "ZSCALER-MUNICH I"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingAutonomousSystem
  data:
    - asn: 22616
      owner: "P030"
      description: "AS22616 - Zscaler"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "198.18.1.0/24"
      ip_namespace: "PROD"
      status: active
      description: "C001 private application range behind Zscaler (PC-FR2-ZSCALER-MUC-PROD)"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyProviderConnection
  data:
    - name: "PC-FR2-ZSCALER-MUC-PROD"
      member_of_groups: [provider_connections]
      description: "PROD Zscaler private peering FR2 cage <-> Zscaler Munich I, two tunnels, C001 range 198.18.1.0/24"
      path_type: internet_vpn
      status: active
      bandwidth: 500
      near: "FR2"
      far: "ZSCALER-MUNICH I"
      near_port: ["eg-fr201", "Ethernet1/14"]
      ip_namespace: "PROD"
      owner: "C001"
      provider_as: "AS22616"
      registered_prefixes:
        - ["198.18.1.0/24", "PROD"]
