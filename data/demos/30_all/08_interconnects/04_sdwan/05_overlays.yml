---
# The SD-WAN gateway's backhaul into the cloud hub.
#
# The per-office tunnels are not here: add_sdwan_edge (generators/topology/
# sdwan_edge.py) builds each office's `<office>-SDWAN-FR2` tunnel, its
# `INET-<office>` internet underlay and the gateway's `eth0.<tunnel_id>`
# termination when the office opts in with sdwan_gateway. This circuit is what
# makes the office leg reach the cloud at all: without it the traversal walks
# office -> gateway and stops, because the gateway's onward path is a virtual
# circuit, not a cable. It is `physical_backed` because it rides the real
# cross-connect out of the cage.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyVirtualCircuit
  data:
    # Shared, therefore unowned — the same rule the physical underlay follows.
    # It terminates on the gateway's trunk (eth0, parent of every tunnel
    # sub-interface) and on the cage router's fabric port, so every tenant tunnel
    # depends on it transitively while no tenant owns it.
    - name: "VC-SDWAN-FR2-AWS-EUC1"
      member_of_groups: [virtual_circuits]
      link_type: direct_connect_aws
      transport_mode: physical_backed
      status: active
      bandwidth: 1000
      encryption: false
      provider: "P004"
      description: "Shared SD-WAN gateway backhaul from FR2 into the AWS transit hub"
      locations:
        - "FR2"
        - "eu-central-1"
      physical_circuits:
        - "XC-EQXFR2-AWS-EUC1"
      capabilities:
        - ["EQX-FR2-SDWAN-GW1", "eth0"]
        - ["eg-fr01", "Ethernet1/13"]
