# The handoff circuit, in PROD. Unowned shared on-ramp: both ends are in the FR2 cage (the
# gateway and the cage router), so the one location is the cage, and the carrier is the cable
# of ../01_colo_onramp/10_cage_cabling.yml. Provider: VeloCloud (P035), the SD-WAN
# service provider, who operates the gateway.
#
# The session is the generated HANDOFF-FR2-SDWAN-GW1-PROD-bgp, peering_role regular on a
# PROD routing domain: the circuit's security_zone, not its default IPAM address, makes
# transforms/helpers/bgp.py render it under `vrf PROD` on eg-fr201, outside every peer
# group. peering_role regular there makes it an external tenant-VRF peer, filtered by
# RM-<session>-IN, which accepts only the
# far end's registered prefixes, and RM-<session>-OUT announces only the PROD on-prem segment
# prefixes of the customers who registered them. The far end here is EQX-FR2-SDWAN-GW1, so the
# registered prefixes are the PROD lan_prefixes (owner: the office's owner) and the PROD
# segments hosted by every TopologyCustomerOffice whose sdwan_gateway is GW1 (owner: the
# segment's owner): C002's hand-authored lan_prefixes 10.210.2.0/24, the /24 add_sdwan_edge allocates from
# Tenant-PROD-IPv4 for every office with neither lan_prefixes nor fabric_templates (C001, C003, C015), and
# C005's hosted office-lan segment (get_external_peer_prefixes in transforms/helpers/bgp_external.py), plus the
# prefixes registered on a tunnel behind the gateway. The session's owners are those customers, so each
# owner's PROD segments are announced.
# This is no cloud service.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    - name: "HANDOFF-FR2-SDWAN-GW1-PROD"
      circuit_type: handoff
      member_of_groups: [virtual_circuits]
      status: active
      provider: "P035"
      description: "PROD handoff eg-fr201 <-> EQX-FR2-SDWAN-GW1 (office routes into the stretched segments)"
      vrf: [FR, "PROD"]
      password: "eqx-fr2-sdwan-handoff-key"
      locations:
        - "FR2"
      capabilities:
        - ["eg-fr201", "Ethernet1/12.1900"]
        - ["EQX-FR2-SDWAN-GW1", "eth0.1900"]
