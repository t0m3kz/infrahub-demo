---
# SD-WAN leg: three branch offices onto one shared gateway in the Equinix FR2 cage.
#
# The gateway is a ManagedControllerPhysical on VCG-VA_GATEWAY, not the virtual
# VCG-VA_CLOUD — per data/bootstrap/10_physical_devices_templates_controllers.yaml
# a colocation-hosted SD-WAN gateway is a controller on real hardware, and this one
# sits in the same cage as EQX-FR2-GW1 (../01_colo_onramp/01_devices.yml). Putting
# it there rather than in a cloud PoP is deliberate: the cage is where the
# cross-connect into AWS already lands, so office traffic and DC traffic converge on
# one facility and a cage-level change has a blast radius spanning both.
#
# Shared, so owned by Internal (P028) like the cage router. Only the per-tenant
# overlays in 03_overlays.yml carry a customer owner.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedControllerPhysical
  data:
    - name: "EQX-FR2-SDWAN-GW1"
      object_template: VCG-VA_GATEWAY
      status: active
      owner: "P028"
      description: "Shared SD-WAN gateway in the Equinix FR2 cage (offices <-> hub)"
      deployment: "FR2"

---
# Per-tenant tunnel terminations on the gateway's single uplink. VCG-VA_GATEWAY
# templates exactly one port (eth0), which is the point: one shared trunk carries
# every tenant's tunnel, so the sub-interface is the only thing that keeps them
# apart. A change to eth0 itself takes down all three tenants; a change to
# eth0.1003 takes down one. The traversal can only make that distinction because
# the tunnels are modelled as separate interfaces.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "eth0.1001"
      device: "EQX-FR2-SDWAN-GW1"
      role: uplink
      status: active
      description: "C001 SD-WAN tunnel termination"
      parent_interface: ["EQX-FR2-SDWAN-GW1", "eth0"]
    - name: "eth0.1003"
      device: "EQX-FR2-SDWAN-GW1"
      role: uplink
      status: active
      description: "C003 SD-WAN tunnel termination"
      parent_interface: ["EQX-FR2-SDWAN-GW1", "eth0"]
    - name: "eth0.1015"
      device: "EQX-FR2-SDWAN-GW1"
      role: uplink
      status: active
      description: "C015 SD-WAN tunnel termination"
      parent_interface: ["EQX-FR2-SDWAN-GW1", "eth0"]

---
# Branch edges, one per office footprint. Unlike the cage gateway these are
# dedicated per-tenant hardware, so each carries its customer as `owner` and sits
# on that customer's own TopologyCustomerOffice deployment.
#
# `deployment` resolves through the TopologyDeployment generic, whose hfid is a
# single name__value — so "C001-P" is the computed name of the office footprint,
# exactly as "FR2" is the name of the cage zone above.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "C001-EDGE1"
      object_template: VCE-610_EDGE
      status: active
      owner: "C001"
      description: "Nordix Warsaw HQ SD-WAN edge"
      deployment: "C001-P"
    - name: "C003-EDGE1"
      object_template: VCE-610_EDGE
      status: active
      owner: "C003"
      description: "Vaultex Munich HQ SD-WAN edge"
      deployment: "C003-P"
    - name: "C015-EDGE1"
      object_template: VCE-610_EDGE
      status: active
      owner: "C015"
      description: "Novantis Paris Office SD-WAN edge"
      deployment: "C015-P"
