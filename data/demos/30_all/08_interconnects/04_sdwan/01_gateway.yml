---
# SD-WAN leg: three branch offices onto one shared gateway in the Equinix FR2 cage,
# managed by one shared Orchestrator (VCO).
#
# The Gateway is a plain DcimPhysicalDevice on VCG-VA_GATEWAY — it is managed BY
# the Orchestrator below, not a controller itself (see the template's own comment
# in data/bootstrap/10_physical_devices_templates_velocloud.yaml for why an earlier
# version of this file modelled it as ManagedControllerPhysical with
# controller_type: sdwan_orchestrator, which was wrong: that conflated the
# Gateway with the Orchestrator's role). It sits in the same cage as eg-fr01, the
# Frankfurt on-ramp router generated from the metro's fabric_templates
# (../../02_colo/equinix/fr/02_topology.yml). Putting it there rather than in a
# cloud PoP is deliberate: the cage is where the cross-connect into AWS already
# lands, so office traffic and DC traffic converge on one facility and a
# cage-level change has a blast radius spanning both.
#
# Shared facility, so owned by Internal (P028) rather than any tenant — only the
# per-tenant overlays in 05_overlays.yml carry a customer owner. This one is still
# hand-written (not generator-managed) because it's shared, rare, low-churn
# infrastructure, unlike the per-office Edge/tunnel/circuit the add_sdwan_edge
# generator provisions (generators/topology/sdwan_edge.py).
#
# Created before 02_gateway_interfaces.yml, whose sub-interfaces reference it by
# device name.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "EQX-FR2-SDWAN-GW1"
      object_template: VCG-VA_GATEWAY
      status: active
      owner: "P028"
      description: "Shared SD-WAN gateway in the Equinix FR2 cage (offices <-> hub)"
      deployment: "FR2"
      member_of_groups:
        - sdwan_gateways
---
# The Orchestrator — manages the Gateway above plus every office Edge the
# add_sdwan_edge generator creates (generators/topology/sdwan_edge.py appends to
# managed_devices; the Gateway is added here by hand since it's hand-authored).
#
# Business policy (branch_to_branch mesh capability) is NOT set here — it lives
# directly on TopologyCustomerOffice.branch_to_branch (schemas/extensions/
# topology/topology_customer.yml), one plain attribute per office/site,
# matching how real VeloCloud business-policy profiles are assigned per edge
# rather than globally on the orchestrator. See the office demo data below for
# where an office opts in.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedControllerVirtual
  data:
    - name: "EQX-FR2-SDWAN-VCO1"
      object_template: VCO-VA_ORCHESTRATOR
      status: active
      owner: "P028"
      description: "Shared SD-WAN orchestrator managing the FR2 gateway and every office edge"
      deployment: "FR2"
      member_of_groups:
        - sdwan_orchestrators
      managed_devices:
        - "EQX-FR2-SDWAN-GW1"
---
# C002's office opts into add_sdwan_edge here, not at creation time in
# ../../06_customer_boarding/c002/office/02_deployment.yml — this Gateway
# didn't exist yet at that point in the staged load (06_customer_boarding
# loads before 08_interconnects; see tests/integration/test_constants.py's
# ALL_DEMO_LOAD_STAGES). Setting sdwan_gateway here, now that the Gateway
# exists, is an update on an already-created TopologyCustomerOffice — it
# fires trigger-customer-office-sdwan-update-gateway (data/events/
# 99_actions.yml), the same relationship-update trigger a real office opting
# in after initial boarding would hit. Unlike C001/C003/C015 (hand-authored
# Edge/tunnel/circuits in 03_edges.yml/05_overlays.yml), C002's are entirely
# generator-produced by SdwanEdgeGenerator once this update lands.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerOffice
  data:
    - parent: "C002"
      environment: "p"
      locations:
        - "mar-branch"
      member_of_groups:
        - customer_deployments_office
      sdwan_gateway: "EQX-FR2-SDWAN-GW1"
      branch_to_branch: full_mesh
