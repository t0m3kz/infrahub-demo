---
# The hub itself, its route tables and its link towards us are in 01_cloud/aws (loaded before any footprint boards).
# The attachments of the transit footprints C003 (vaultex) and C015 (novantis) are generated by
# add_customer_deployment_cloud: each footprint's networks on its own table rt-<footprint>, propagating into it and into
# rt-hub-shared (the hybrid attachment's table, so on-prem reaches them), and the hybrid attachment propagating into
# each footprint's table (so they reach on-prem). No two customers share a routing domain (cloud_connection R13).
#
# C001's VPC has an account and no footprint, so nothing boards it: its attachment is authored here, on its own table
# rt-hub-isolated, propagating into rt-hub-shared so on-prem reaches it.
#
# `owner_account` is the tenant's own account while `gateway` belongs to net-hub-aws-prod: that asymmetry is the
# cross-account attachment, the edge that lets the traversal cross an account boundary.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudGatewayAttachment
  data:
    - name: "tgwa-vpc-nordix"
      cloud_id: "tgw-attach-0nordixvpc"
      description: "Nordix (C001) production VPC onto its own hub domain (target of egress rule 10)"
      status: active
      gateway: "tgw-30all-euc1"
      owner_account: "nordix-aws-prod"
      member_of_groups: [cloud_attachment_ranges]
      virtual_network: "nordix-vpc-prod"
      associated_route_table: "rt-hub-isolated"
      propagates_to_route_tables:
        - "rt-hub-isolated"
        - "rt-hub-shared"
