---
# Cross-account attachments onto the hub.
#
# `owner_account` is the tenant's own account while `transit_gateway` belongs to
# net-hub-aws-prod — that asymmetry *is* the cross-account attachment, and it is
# the edge that lets the traversal cross an account boundary at all.
#
# Route-table placement is the interesting part for risk scoring:
#   vaultex (C003)  -> rt-hub-shared    can reach on-prem and other shared tenants
#   novantis (C015) -> rt-hub-isolated  reaches on-prem only
# so an edit to rt-hub-shared has a strictly larger blast radius than one to
# rt-hub-isolated, and the check can show that difference rather than assert it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGatewayAttachment
  data:
    # The on-prem side: the transit VIF, owned by the network account itself.
    - name: "tgwa-hybrid-eqx-fr2"
      cloud_id: "tgw-attach-0hybridfr2"
      description: "Hybrid attachment carrying on-prem DC traffic in over Equinix FR2"
      status: active
      attachment_type: hybrid
      transit_gateway: "tgw-30all-euc1"
      owner_account: "net-hub-aws-prod"
      # hybrid_endpoint is set from the VIF side in
      # ../05_cloud_endpoints/01_transit_vif.yml: its
      # peer is the CloudHybridAttachment generic, which is an attribute-less
      # marker and so declares no human_friendly_id for a bare reference to
      # resolve against.
      associated_route_table: "rt-hub-shared"
      propagates_to_route_tables:
        - "rt-hub-shared"
        - "rt-hub-isolated"

    # Tenant VPCs, each attached from its own account.
    - name: "tgwa-vpc-vaultex"
      cloud_id: "tgw-attach-0vaultexvpc"
      description: "Vaultex (C003) production VPC onto the shared hub domain"
      status: active
      attachment_type: vpc
      transit_gateway: "tgw-30all-euc1"
      owner_account: "vaultex-aws-prod"
      virtual_network: "vaultex-vpc-prod"
      associated_route_table: "rt-hub-shared"
      propagates_to_route_tables:
        - "rt-hub-shared"

    - name: "tgwa-vpc-novantis"
      cloud_id: "tgw-attach-0novantisvpc"
      description: "Novantis (C015) production VPC, isolated from other tenants"
      status: active
      attachment_type: vpc
      transit_gateway: "tgw-30all-euc1"
      owner_account: "novantis-aws-prod"
      virtual_network: "novantis-vpc-prod"
      associated_route_table: "rt-hub-isolated"
      propagates_to_route_tables:
        - "rt-hub-isolated"
