---
# Cross-account attachments onto the hub.
#
# `owner_account` is the tenant's own account while `transit_gateway` belongs to
# net-hub-aws-prod — that asymmetry *is* the cross-account attachment, and it is
# the edge that lets the traversal cross an account boundary at all.
#
# Route-table placement (association = the table an attachment's traffic is
# looked up in; propagation = the tables that learn its CIDRs):
#   vaultex (C003)   associated rt-hub-shared,   propagates to rt-hub-shared
#   nordix (C001)    associated rt-hub-shared,   propagates to rt-hub-shared
#   novantis (C015)  associated rt-hub-isolated, propagates to rt-hub-isolated
#                    and rt-hub-shared
#   hybrid (on-prem) associated rt-hub-shared,   propagates to both
#
# Novantis must reach on-prem. Traffic arriving from on-prem over the transit
# VIF is looked up in the hybrid attachment's table, rt-hub-shared, so without
# novantis propagating there on-prem has no route to 10.150.0.0/16 (and the
# colo edge's inbound filter, which mirrors that table through
# transforms/helpers/bgp_external.py vif_registered_blocks, does not accept it).
#
# Consequence: novantis is no longer isolated from vaultex. vaultex is
# associated with rt-hub-shared as well, so it now learns 10.150.0.0/16 and its
# traffic to novantis is delivered. Only the return leg is missing today
# (rt-hub-isolated holds no vaultex route), which keeps two-way flows from
# working but is one propagation or static away from full reachability: it is
# not route-table separation. An AWS Transit Gateway attachment has exactly one
# association, so the single hybrid attachment cannot sit on both tables.
# Follow-up (not modelled here): true isolation between the two tenants while
# both reach on-prem needs a second hybrid attachment (its own transit VIF)
# associated with rt-hub-isolated, so novantis propagates only into
# rt-hub-isolated again.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGatewayAttachment
  data:
    # The on-prem side: the transit VIF, owned by the network account itself.
    - name: "tgwa-hybrid-eqx-fr2"
      cloud_id: "tgw-attach-0hybridfr2"
      description: "Hybrid attachment carrying on-prem DC traffic in over Equinix FR2"
      status: active
      attachment_type: hybrid
      transit_gateway: "tgw-30all-euc1"
      owner_account: "net-hub-aws-prod"
      # hybrid_endpoint is set from the VIF side in
      # ../05_cloud_endpoints/01_transit_vif.yml: its
      # peer is the CloudHybridAttachment generic, which is an attribute-less
      # marker and so declares no human_friendly_id for a bare reference to
      # resolve against.
      associated_route_table: "rt-hub-shared"
      propagates_to_route_tables:
        - "rt-hub-shared"
        - "rt-hub-isolated"

    # Tenant VPCs, each attached from its own account.
    - name: "tgwa-vpc-vaultex"
      cloud_id: "tgw-attach-0vaultexvpc"
      description: "Vaultex (C003) production VPC onto the shared hub domain"
      status: active
      attachment_type: vpc
      transit_gateway: "tgw-30all-euc1"
      owner_account: "vaultex-aws-prod"
      virtual_network: "vaultex-vpc-prod"
      associated_route_table: "rt-hub-shared"
      propagates_to_route_tables:
        - "rt-hub-shared"

    - name: "tgwa-vpc-nordix"
      cloud_id: "tgw-attach-0nordixvpc"
      description: "Nordix (C001) production VPC onto the shared hub domain (target of egress rule 10)"
      status: active
      attachment_type: vpc
      transit_gateway: "tgw-30all-euc1"
      owner_account: "nordix-aws-prod"
      virtual_network: "nordix-vpc-prod"
      associated_route_table: "rt-hub-shared"
      propagates_to_route_tables:
        - "rt-hub-shared"

    - name: "tgwa-vpc-novantis"
      cloud_id: "tgw-attach-0novantisvpc"
      description: "Novantis (C015) production VPC; propagates into rt-hub-shared so on-prem can reach it"
      status: active
      attachment_type: vpc
      transit_gateway: "tgw-30all-euc1"
      owner_account: "novantis-aws-prod"
      virtual_network: "novantis-vpc-prod"
      associated_route_table: "rt-hub-isolated"
      # rt-hub-shared: the hybrid attachment's table, see the header.
      propagates_to_route_tables:
        - "rt-hub-isolated"
        - "rt-hub-shared"
