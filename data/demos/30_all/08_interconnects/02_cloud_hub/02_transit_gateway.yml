---
# The hub itself. Its two routing domains are declared in 03_route_tables.yml,
# once this exists to be referenced by name.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudTransitGateway
  data:
    - name: "tgw-30all-euc1"
      cloud_id: "tgw-0a1b2c3d4e5f60718"
      description: "30_all shared Transit Gateway hub, AWS eu-central-1"
      status: active
      dns_support: true
      vpn_ecmp_support: true
      # Boolean "does this TGW auto-associate a default route table", not a
      # pointer — which table is default is carried by rt-hub-shared.is_default.
      default_route_table: true
      region: "eu-central-1"
      account: "net-hub-aws-prod"
