---
# The hub itself and the Direct Connect gateway that lands the on-prem link. Its two routing domains are declared in
# 03_route_tables.yml, once this exists to be referenced by name.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudGateway
  data:
    - name: "tgw-30all-euc1"
      cloud_id: "tgw-0a1b2c3d4e5f60718"
      description: "30_all shared transit gateway hub, AWS eu-central-1"
      status: active
      gateway_type: hub
      region: "eu-central-1"
      account: "net-hub-aws-prod"
    - name: "dxgw-30all"
      description: "30_all Direct Connect gateway (global): the on-prem link lands here, associated with the hub"
      status: active
      gateway_type: edge
      account: "net-hub-aws-prod"
