# Each ISP provider edge's BGP process. Its config is the carrier's business,
# not a transform here: it exists so the peerings below have a remote AS and a
# second endpoint, and so the cage edge's transform can render its side.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedBGP
  data:
    - name: "EXT-LUMEN-FRA1-bgp"
      status: active
      local_as: "AS3356"
      router_id: ["203.0.113.0/31", "default"]
      capabilities:
        - "EXT-LUMEN-FRA1"
    - name: "EXT-COGENT-FRA1-bgp"
      status: active
      local_as: "AS174"
      router_id: ["203.0.113.2/31", "default"]
      capabilities:
        - "EXT-COGENT-FRA1"
    - name: "EXT-LUMEN-PAR1-bgp"
      status: active
      local_as: "AS3356"
      router_id: ["203.0.113.4/31", "default"]
      capabilities:
        - "EXT-LUMEN-PAR1"
    - name: "EXT-COGENT-PAR1-bgp"
      status: active
      local_as: "AS174"
      router_id: ["203.0.113.6/31", "default"]
      capabilities:
        - "EXT-COGENT-PAR1"
