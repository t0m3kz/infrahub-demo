---
# The uplink of every ISP router to THE INTERNET (data/bootstrap/03b_internet.yml, rule I3 of
# checks/circuit_placement.py): one `internet` carrier per router, from its uplink port to INTERNET:bus (the Lumen and
# Cogent provider edges of ../06_internet/02_devices.yml on xe-0/1/0, Orange's access PE of ../../04_internet on
# et-0/0/0), so a public side is reachable at L1 through any ISP. Shared underlay, unowned; the carriers share the bus
# by its kind. Only the ISP is listed: add_circuit derives INTERNET from the end device itself. Not transit: no
# address, no peering (the transit folder pairs every circuit with one). The partner's router (EXT-ACME-EDGE1) has
# none: it buys access from Cogent, so its access reaches the INTERNET through Cogent's attachment.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCarrierCircuit
  data:
    - circuit_id: "UPL-EXT-LUMEN-FRA1"
      member_of_groups: [carrier_circuits]
      name: "UPL-EXT-LUMEN-FRA1"
      circuit_type: internet
      status: active
      bandwidth: 10000
      provider: "P014"
      description: "Uplink of EXT-LUMEN-FRA1 to the internet"
      locations:
        - "ISP-LUMEN"
      capabilities:
        - ["EXT-LUMEN-FRA1", "xe-0/1/0"]
        - ["INTERNET", "bus"]
    - circuit_id: "UPL-EXT-LUMEN-PAR1"
      member_of_groups: [carrier_circuits]
      name: "UPL-EXT-LUMEN-PAR1"
      circuit_type: internet
      status: active
      bandwidth: 10000
      provider: "P014"
      description: "Uplink of EXT-LUMEN-PAR1 to the internet"
      locations:
        - "ISP-LUMEN"
      capabilities:
        - ["EXT-LUMEN-PAR1", "xe-0/1/0"]
        - ["INTERNET", "bus"]
    - circuit_id: "UPL-EXT-COGENT-FRA1"
      member_of_groups: [carrier_circuits]
      name: "UPL-EXT-COGENT-FRA1"
      circuit_type: internet
      status: active
      bandwidth: 10000
      provider: "P023"
      description: "Uplink of EXT-COGENT-FRA1 to the internet"
      locations:
        - "ISP-COGENT"
      capabilities:
        - ["EXT-COGENT-FRA1", "xe-0/1/0"]
        - ["INTERNET", "bus"]
    - circuit_id: "UPL-EXT-COGENT-PAR1"
      member_of_groups: [carrier_circuits]
      name: "UPL-EXT-COGENT-PAR1"
      circuit_type: internet
      status: active
      bandwidth: 10000
      provider: "P023"
      description: "Uplink of EXT-COGENT-PAR1 to the internet"
      locations:
        - "ISP-COGENT"
      capabilities:
        - ["EXT-COGENT-PAR1", "xe-0/1/0"]
        - ["INTERNET", "bus"]
    - circuit_id: "UPL-EXT-ORANGE"
