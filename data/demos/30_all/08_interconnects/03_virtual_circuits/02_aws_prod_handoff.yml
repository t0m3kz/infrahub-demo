# The PROD handoff of C001 (Nordix) to AWS eu-central-1, authored by hand: eg-fr201 Ethernet1/13.1000 <-> the private
# virtual interface `dxcon-fr2.1000` of the Direct Connect transport dx-30all-euc1-fr2
# (../01_colo_onramp/03_cloud_transports.yml), carried by the cable XC-EQXFR2-AWS-EUC1 on
# Ethernet1/13 (../01_colo_onramp/10_cage_cabling.yml) to the port dxcon-fr2 of EXT-AWS-DX-FR2.
#
# add_virtual_circuit does NOT build this session: the far end is a cloud peering interface, so there is no party BGP
# process to peer with and nothing to allocate on the cloud side. Everything is authored: our /31 (10.255.143.254/31,
# the last link of Handoff-PROD-IPv4, data/bootstrap/26_handoff_pools.yml: the pool hands out the lowest free /31 to
# the generated handoffs, so the two never meet), the provider side as the virtual interface's `peer_ip` and `peer_asn`
# (AS64512, the Amazon side of the Direct Connect gateway), the sub-interface with its address and the eBGP peering.
#
# The route from the VIF to the Nordix VPC is the cloud model, not a prefix list: the VIF lands on the Direct Connect
# gateway dxgw-30all (../02_cloud_hub/02_transit_gateway.yml), which the hybrid attachment tgwa-hybrid-eqx-fr2 joins to
# the hub tgw-30all-euc1, whose attachment tgwa-vpc-nordix reaches the virtual network nordix-vpc-prod (10.10.0.0/16,
# account nordix-aws-prod, owner C001). That VPC block is what the session accepts for owner C001 (rule 10,
# nordix-prod-to-aws, ../07_zone_policies/05_security_policy.yml). eg-fr201 already holds the PROD instance through
# the SD-WAN handoff (../04_sdwan/06_vrf_handoff.yml), whose generator joins the device to the VRF.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.255.143.254/31"
      description: "PROD handoff eg-fr201 <-> AWS Direct Connect VIF dxcon-fr2.1000 (C001)"
      status: active
      ip_namespace: "default"
