        - ["eg-pa401", "Ethernet1/10"]

    - name: "ICX-DC10-EQXFR2-B"
      circuit_type: dci
      member_of_groups: [virtual_circuits]
      status: active
      provider: "P016"
      description: "DCI DC10 <-> Equinix FR2 over DF-DC10-EQXFR2-B"
      locations:
        - "DC10"
        - "FR2"
      capabilities:
        - ["bl-dc101101", "Ethernet1/36"]
        - ["eg-fr202", "Ethernet1/10"]

    - name: "ICX-DC11-EQXFR2-B"
      circuit_type: dci
      member_of_groups: [virtual_circuits]
      status: active
