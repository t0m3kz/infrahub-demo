---
# The Equinix Fabric hop from our FR2 cage to the Network Edge router eg-am-ne01 of AM-NE
# (02_colo/equinix/am), as one PROD Handoff circuit: our cage edge's sub-interface eg-fr201
# Ethernet1/1.1200 <-> the router's sub-interface Ethernet1/1.1200, VLAN 1200 on both. The second
# hop of the AM-NE chain, eg-am-ne02 into the AWS hub, is ../05_cloud_endpoints/00_vif_handoff_am_ne.yml.
#
# The DC/cage -> NE hop is an Equinix Fabric virtual connection, not carried over the fibre: Equinix
# runs it inside its own platform, from its Fabric port in the FR2 IBX to the NE router. The only
# physical thing of ours under it is the patch from eg-fr201 Ethernet1/1 to that Fabric port
# (../01_colo_onramp/05_cage_cabling.yml, the stub EXT-EQX-FABRIC-FR2), which is the carrier the
# circuit is derived from: the cage end's sub-interface rides it on its PARENT port. The NE end needs
# no carrier (a provider-hosted appliance has no port of ours), so one carried end is enough.
#
# eBGP IPv4, not EVPN: a Cisco C8000V is not an EVPN peer. The session is between the two BGP
# processes the devices already have: eg-fr201's overlay process and eg-am-ne01's
# eg-am-ne01-bgp-overlay (generated by add_virtual_colocation, in the AM metro's site AS).
#
# Nothing of the session is authored: the addresses come from Handoff-PROD-IPv4
# (data/bootstrap/26_handoff_pools.yml). add_virtual_circuit (generators/topology/virtual_circuit.py)
# allocates a /31 from it, addresses BOTH sub-interfaces (both devices have an overlay process, so the
# lower address goes to the first by name, eg-am-ne01) and upserts the eBGP session
# HANDOFF-FR2-AMNE-PROD-bgp. The sub-interfaces below carry no address; the circuit is last in this
# file because the generator reads them (and the key) the moment it is created.
#
# Unowned shared on-ramp (the router eg-am-ne01 is the platform's, ordered under the Equinix
# Network Edge account, not a tenant's), in PROD like every handoff of eg-fr201. Provider Equinix
# (P016): Equinix sells the Fabric virtual connection, the service that carries the session.
# Locations: the cage and the provider-hosted presence AM-NE (both TopologyFacility).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimVirtualInterface
  data:
    - name: "Ethernet1/1.1200"
      device: "eg-fr201"
      role: uplink
      status: active
      description: "PROD Fabric handoff to eg-am-ne01"
      parent_interface: ["eg-fr201", "Ethernet1/1"]
    - name: "Ethernet1/1.1200"
      device: "eg-am-ne01"
      role: uplink
      status: active
      description: "PROD Fabric handoff to eg-fr201"
      parent_interface: ["eg-am-ne01", "Ethernet1/1"]
---
# Demo-only secret, like the API token in the README.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingPassword
  data:
    - name: "eqx-fr2-am-ne-handoff-key"
      description: "BGP auth key for the eg-fr201 <-> eg-am-ne01 PROD Fabric handoff"
      password: "demo-eqx-fr2-am-ne-handoff"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologySessionCircuit
  data:
    - name: "HANDOFF-FR2-AMNE-PROD"
      circuit_type: handoff
      member_of_groups: [virtual_circuits]
      status: active
      provider: "P016"
      description: "PROD Equinix Fabric handoff eg-fr201 <-> Network Edge router eg-am-ne01"
      ip_namespace: "PROD"
      password: "eqx-fr2-am-ne-handoff-key"
      locations:
        - "FR2"
        - "AM-NE"
      capabilities:
        - ["eg-fr201", "Ethernet1/1.1200"]
        - ["eg-am-ne01", "Ethernet1/1.1200"]
