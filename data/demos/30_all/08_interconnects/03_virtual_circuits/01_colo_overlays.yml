---
# The overlay half of the connectable-set split: per-customer virtual circuits
# riding the shared physical underlay of ../01_colo_onramp/03_physical_circuits.yml.
#
# Every circuit here carries its own `owner`, and its underlay is derived, never
# declared: the physical dependencies at the circuit's own ports (the physical circuits
# in each port's `capabilities`). Underlay impact is traced from the other side: a
# change to an unowned dark fibre or cage port has no customer on it directly, and only
# becomes a customer-visible risk through the overlays on its ports. From a physical
# circuit that is two hops, circuit -> its ports -> the virtual circuits on them
# (filter each port's `capabilities` by kind TopologyVirtualCircuit: an interface's
# capabilities also return segments and peerings). Editing DF-DC10-EQXFR2 hits exactly
# the tenants whose virtual circuits have a port on it.
#
# Termination is expressed through `capabilities` (ManagedGenericInterfaces)
# rather than any circuit-specific relationship on the interface — that is the one
# uniform answer to "what is this port doing", and the traversal walks outward from
# a changed interface along it.
#
# The cloud side is NOT set here. `cloud_endpoints` peers the CloudHybridAttachment
# generic, an attribute-less marker with no human_friendly_id, so it is set from the
# concrete CloudVirtualInterface in ../05_cloud_endpoints/01_transit_vif.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyVirtualCircuit
  data:
    # --- DC -> AWS eu-central-1 over the Equinix FR2 cage --------------------
    # Two hops of underlay each, derived from the ports: the dark fibre out of the DC
    # (the border-leaf port) and the cage's cross-connect into the region (the cage
    # edge port). A tenant's reach into AWS therefore depends
    # on both, which is precisely the DC-boundary blind spot this leg closes.
    - name: "VC-C005-DC10-AWS-EUC1"
      member_of_groups: [virtual_circuits]
      link_type: direct_connect_aws
      transport_mode: physical_backed
      status: active
      bandwidth: 1000
      encryption: false
      provider: "P004"
      owner: "C005"
      description: "Drentec DC10 production footprint into the AWS transit hub"
      locations:
        - "C005-P-DC10"
        - "eu-central-1"
      capabilities:
        - ["bl-dc101101", "Ethernet1/35"]
        - ["eg-fr201", "Ethernet1/13"]

    - name: "VC-C006-DC11-AWS-EUC1"
      member_of_groups: [virtual_circuits]
      link_type: direct_connect_aws
      transport_mode: physical_backed
      status: active
      bandwidth: 1000
      encryption: false
      provider: "P004"
      owner: "C006"
      description: "Lumivex DC11 production footprint into the AWS transit hub"
      locations:
        - "C006-P-DC11"
        - "eu-central-1"
      capabilities:
        - ["bl-dc1111101", "Ethernet1/35"]
        - ["eg-fr201", "Ethernet1/13"]

    # --- DC -> Azure westeurope over the Equinix PA4 cage --------------------
    # No cloud endpoint: only the AWS hub is modelled, so this one terminates at
    # the region. It still proves the second colo is on a genuinely separate
    # underlay — a PA4 change cannot reach the FR2 tenants and vice versa.
    - name: "VC-C008-DC12-AZURE-WEU"
      member_of_groups: [virtual_circuits]
      link_type: express_route_azure
      transport_mode: physical_backed
      status: active
      bandwidth: 1000
      encryption: false
      provider: "P005"
      owner: "C008"
      description: "Krafven DC12 production footprint into Azure westeurope"
      locations:
        - "C008-P-DC12"
        - "westeurope"
      capabilities:
        - ["bl-dc1212101", "Ethernet1/35"]
        - ["eg-pa401", "Ethernet1/13"]

    # --- Colo cage -> cloud, no DC in the path ------------------------------
    # C001 buys Equinix Fabric from its own FR cage rather than backhauling from
    # a DC, so this circuit rides only the cross-connect. It shares that one
    # underlay with the two DC circuits above, which is what makes
    # XC-EQXFR2-AWS-EUC1 the highest-fan-out object in the leg.
    #
    # One capability on purpose. The DC circuits above end on a tenant port (the
    # border leaf) and on the cage edge's hand-off port; C001 has no device of
    # its own in the cage (the shared fw-fr201/02 serve it through a firewall
    # context), so its tenant end IS the cage edge's hand-off port, and the
    # cloud end is the transit VIF (cloud_endpoints), not a device port. A
    # second capability would have to be AWS's own router port, which none of
    # the overlays names. checks/circuit_placement.py places the tenant end
    # from that one port (eg-fr201 is deployed to FR2, a zone of C001-P-FR's
    # metro FR), and test_62 expects one interface
    # (tests/integration/test_constants.py).
    - name: "VC-C001-EQXFR-AWS-EUC1"
      member_of_groups: [virtual_circuits]
      link_type: equinix_fabric
      transport_mode: physical_backed
      status: active
      bandwidth: 500
      encryption: false
      provider: "P016"
      owner: "C001"
      description: "Nordix Equinix FR cage into the AWS transit hub over Fabric"
      locations:
        - "C001-P-FR"
        - "eu-central-1"
      capabilities:
        - ["eg-fr201", "Ethernet1/13"]
