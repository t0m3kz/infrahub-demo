---
# The hub's link towards us: its attachment to the Direct Connect gateway the on-prem VIF lands on. Traffic from
# on-prem is looked up in its table, rt-hub-shared, so a network on-prem reaches propagates there; the hub links
# propagate into each footprint's table (add_customer_deployment_cloud), so every footprint reaches us.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CloudGatewayAttachment
  data:
    - name: "tgwa-hybrid-eqx-fr2"
      cloud_id: "tgw-attach-0hybridfr2"
      description: "Hybrid attachment carrying on-prem DC traffic in over Equinix FR2"
      status: active
      gateway: "tgw-30all-euc1"
      owner_account: "net-hub-aws-prod"
      member_of_groups: [cloud_attachment_ranges]
      # Target: the Direct Connect gateway the on-prem link lands on (an attachment has exactly one target).
      peer_gateway: "dxgw-30all"
      associated_route_table: "rt-hub-shared"
      propagates_to_route_tables:
        - "rt-hub-shared"
        - "rt-hub-isolated"
