---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyConnectivityRequest
  data:
    - name: REQ-DC10-EQXFR2-DCI
      description: Dual 100G DCI interconnect between DC10 and Equinix FR2 colocation cage
      connectivity_type: dci
      bandwidth_mbps: 100000
      redundancy: dual
      provider: "P016"
      source: "DC10"
      destination: "FR2"
      member_of_groups:
        - connectivity_requests

    - name: REQ-DC10-AWS-EU-CENTRAL-1
      description: Dedicated cloud on-ramp from DC10 to AWS eu-central-1
      connectivity_type: cloud_onramp
      bandwidth_mbps: 10000
      redundancy: dual
      source: "DC10"
      destination: "eu-central-1"
      member_of_groups:
        - connectivity_requests

    - name: REQ-EQXFR2-ZSCALER-MUNICH
      description: Private SaaS peering from Equinix FR2 to Zscaler Munich I
      connectivity_type: saas_peering
      bandwidth_mbps: 10000
      redundancy: single
      provider: "P030"
      source: "FR2"
      destination: "ZSCALER-MUNICH I"
      member_of_groups:
        - connectivity_requests
