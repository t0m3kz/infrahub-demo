---
# DC12 — controller-managed fabric AND firewall AND load-balancer, all at
# once ("all of them" — compare DC11's firewall/LB-only split): DCNM
# governs the cisco_nxos switching fabric (controller_type: dcnm, fabric
# roles match by controller_type alone — see generators/devices.py's
# _FABRIC_CONTROLLER_TYPES); Check Point SMS governs the checkpoint_gaia
# firewall pair (security_manager); F5 BIG-IQ governs the f5_tmos
# load-balancer pair (lb_manager). Every device this DC creates —
# super-spine/border-leaf/spine/firewall/load-balancer — routes into one
# of these 3 controllers' managed_devices instead of a CoreStandardGroup.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenter
  data:
    - name: DC12
      parent: "DC"
      index: 12
      size: L
      routing_strategy: ebgp-ebgp
      underlay_protocol: ipv6
      naming_convention: standard
      connectivity_mode: pbr
      fabric_templates:
        - ["2", "super-spine", "N9K-C9336C-FX2_SUPER_SPINE"]
        - ["2", "border-leaf", "N9K-C9336C-FX2_BORDER_LEAF"]
        - ["2", "firewall", "CP-26000_FIREWALL"]
        - ["2", "load-balancer", "BIG-IP-i5800_LOAD_BALANCER"]
      fabric_interface_sorting_method: top_down
      controllers:
        - "DC12-DCNM1"
        - "DC12-CPSMS1"
        - "DC12-BIGIQ1"
      member_of_groups:
        - topologies_dc
      children:
        kind: TopologyPod
        data:
          # POD-1 carries the compute layer: one network rack per row with a
          # leaf pair plus a 25G access-leaf pair, and one compute rack per row
          # holding the application servers (05_servers.yml). POD-2 stays
          # greenfield — spare fabric capacity.
          - index: 1
            layout: S_MIDDLE
            deployment_type: middle_rack
            suites: [mil-1-s-1]
            fabric_templates:
              - ["2", "spine", "N9K-C9336C-FX2_SPINE"]
            mlag_create: virtual
            member_of_groups:
              - topologies_pod
            racks:
              kind: LocationRack
              data:
                - index: 5
                  row_index: 1
                  shortname: mil-1-s-1-r-1-5
                  rack_type: network
                  parent: mil-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "N9K-C9336C-FX2_LEAF_MR"]
                    - ["2", "access-leaf", "N9K-C93180YC-EX_ACCESS"]
                - index: 5
                  row_index: 2
                  shortname: mil-1-s-1-r-2-5
                  rack_type: network
                  parent: mil-1-s-1
                  member_of_groups: [topologies_rack]
                  fabric_templates:
                    - ["2", "leaf", "N9K-C9336C-FX2_LEAF_MR"]
                    - ["2", "access-leaf", "N9K-C93180YC-EX_ACCESS"]
                # Compute racks: no fabric templates of their own. The endpoint
                # generator cables their servers to the access-leaf pair in the
                # network rack that shares their row.
                - index: 1
                  row_index: 1
                  shortname: mil-1-s-1-r-1-1
                  rack_type: compute
                  parent: mil-1-s-1
                  member_of_groups: [topologies_rack]
                - index: 1
                  row_index: 2
                  shortname: mil-1-s-1-r-2-1
                  rack_type: compute
                  parent: mil-1-s-1
                  member_of_groups: [topologies_rack]
          - index: 2
            layout: S_MIDDLE
            deployment_type: middle_rack
            suites: [mil-1-s-2]
            fabric_templates:
              - ["2", "spine", "N9K-C9336C-FX2_SPINE"]
            member_of_groups:
              - topologies_pod
