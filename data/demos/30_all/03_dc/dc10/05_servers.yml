---
# DC10 POD-1 application hosts.
#
# Hosts come in row pairs, so the two rows' access-leaf pairs are genuinely
# independent failure domains: a component with an instance on each host of a
# pair survives losing either pair. server-1/2 carry C005's payment-core,
# server-3/4 its session store (a second component of the microsegmented
# web-frontend segment, on its own host ports: one port and VLAN never carry
# two component groups), server-5/6 C008's trade portal. PowerEdge-R640_SERVER brings two 25G uplink
# NICs (eno1/eno2); add_endpoint dual-homes them across the access-leaf pair
# in the network rack that shares the host's row, and sets the host's
# deployment to POD-1 on the way.
#
# Each host is owned by the customer whose VMs run on it
# (06_customer_boarding/<customer>/dc/<dc>/02_instances.yml), so ownership
# follows the workload rather than whoever racked the box. DC12's server-1/2
# are the exception: shared non-prod hosts owned by the technology partner
# (P027), next to C005's own prod pair server-3/4. Prod and non-prod never
# share a hypervisor (checks/hypervisor_environment.py).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: dc10-pod1-server-1
      object_template: PowerEdge-R640_SERVER
      owner: "C005"
      rack: fra-1-s-1-r-1-1
      status: active
      position: 10
      platform: linux
      description: "DC10 POD-1 row 1 application host"
      member_of_groups:
        - endpoints

    - name: dc10-pod1-server-2
      object_template: PowerEdge-R640_SERVER
      owner: "C005"
      rack: fra-1-s-1-r-2-1
      status: active
      position: 10
      platform: linux
      description: "DC10 POD-1 row 2 application host"
      member_of_groups:
        - endpoints

    - name: dc10-pod1-server-3
      object_template: PowerEdge-R640_SERVER
      owner: "C005"
      rack: fra-1-s-1-r-1-1
      status: active
      position: 11
      platform: linux
      description: "DC10 POD-1 row 1 application host (C005 session store)"
      member_of_groups:
        - endpoints

    - name: dc10-pod1-server-4
      object_template: PowerEdge-R640_SERVER
      owner: "C005"
      rack: fra-1-s-1-r-2-1
      status: active
      position: 11
      platform: linux
      description: "DC10 POD-1 row 2 application host (C005 session store)"
