            children:
              kind: LocationSuite
              data:
                - name: FRA-1-Suite-1
                  index: 1
                  shortname: "fra-1-s-1"
                  parent: fra-1
                  rows: 2
                  # One network rack (leaf + access-leaf pair) and one compute
                  # rack (application servers) per row — see 01_topology.yml.
                  racks_per_row: 9
                - name: FRA-1-Suite-2
                  index: 2
                  shortname: "fra-1-s-2"
                  parent: fra-1
                  rows: 2
                  racks_per_row: 1
                - name: FRA-1-Suite-3
                  index: 3
                  shortname: "fra-1-s-3"
                  parent: fra-1
                  rows: 1
                  racks_per_row: 1
