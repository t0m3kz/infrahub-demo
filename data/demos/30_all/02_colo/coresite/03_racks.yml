---
# CoreSite cage racks, same shape as ../equinix/fr/03_racks.yml: a suite per
# building, racks inside it, each rack pinned to the TopologyColocationZone it
# physically sits in via `pod`.
#
# Only the two buildings that actually hold customer kit get a rack — NY1
# (C011's cage) and VA1 (C012's cage). NY2/VA2/SV1 stay location-only until
# something is installed in them.
#
# These racks deliberately carry no rack_type/fabric_templates: LocationRack.pod
# here is a colocation zone, not a TopologyPod, so the rack generator has nothing
# to build (it bails out on the missing deployment_type — see
# generators/topology/rack.py's generate()).
#
# topologies_rack membership is still required. trigger-rack-generator-on-created
# (data/events/99_actions.yml) fires add_rack for every LocationRack created, and
# Infrahub rejects a generator run whose target is outside the definition's group
# ("Target <id> is not part of the group <id>") — a non-member colocation rack
# turns into a FAILED task on every load instead of a no-op run.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: NY1
      shortname: ny1
      parent: nyc
      children:
        kind: LocationSuite
        data:
          - suite_name: NY1
            index: 1
            shortname: ny1-s1
            rows: 1
            racks_per_row: 1
            children:
              kind: LocationRack
              data:
                - shortname: ny1-s1-r-1
                  index: 1
                  row_index: 1
                  pod: NY1
                  member_of_groups: [topologies_rack]

    - name: VA1
      shortname: va1
      parent: iad
      children:
        kind: LocationSuite
        data:
          - suite_name: VA1
            index: 1
            shortname: va1-s1
            rows: 1
            racks_per_row: 1
            children:
              kind: LocationRack
              data:
                - shortname: va1-s1-r-1
                  index: 1
                  row_index: 1
                  pod: VA1
                  member_of_groups: [topologies_rack]
