---
# Megaport Paris access topology
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: MEGAPORT
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: PAR
            location: ["par"]
            routing_filter_enforce: true
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyColocationZone
              data:
                - name: MCR-PAR1
                  member_of_groups:
                    - colocation_zones
