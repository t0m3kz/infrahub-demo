---
# Megaport Frankfurt racks
#
# topologies_rack membership is not about DC fabrics: it is what keeps the
# created-rack trigger from failing on a colocation rack — see
# ../../coresite/03_racks.yml for the full why.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: MCR-FRA1
      shortname: mcr-fra1
      parent: fra
      children:
        kind: LocationSuite
        data:
          - suite_name: MCR-FRA1
            index: 1
            shortname: mcr-fra1-s1
            rows: 1
            racks_per_row: 1
            children:
              kind: LocationRack
              data:
                - shortname: mcr-fra1-s1-r-1
                  index: 1
                  row_index: 1
                  pod: MCR-FRA1
                  member_of_groups: [topologies_rack]
