---
# Megaport Frankfurt access topology
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: MEGAPORT
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: FRA
            location: ["fra"]
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyColocationZone
              data:
                - name: MCR-FRA1
