---
# SD-WAN hub: one shared gateway in the Equinix FR2 cage, managed by one shared
# Orchestrator (VCO). Every branch office reaches it through
# generators/topology/sdwan_edge.py (add_sdwan_edge), which builds the office's
# Edge, internet underlay and tunnel (ending on the gateway's public port eth1).
#
# Loaded with the foundation stage (after FR2 in 02_topology.yml), not with the
# interconnects: an office opts in by naming this gateway in sdwan_gateway when
# it is created (../../../06_customer_boarding/c0*/office/02_deployment.yml), so
# the gateway and its orchestrator have to exist before the offices do.
# add_colocation_metro never touches either: it builds only the metro's own
# fabric_templates kit (eg-fr201/02, fw-fr201/02), its pools and cabling.
#
# The Gateway is a plain DcimPhysicalDevice on VCG-VA_GATEWAY — it is managed BY
# the Orchestrator below, not a controller itself (see the template's own comment
# in data/bootstrap/10_physical_devices_templates_velocloud.yaml). It sits in the
# same cage as eg-fr201, the Frankfurt on-ramp router generated from the metro's
# fabric_templates (02_topology.yml). Putting it there rather than in a cloud PoP
# is deliberate: the cage is where the cross-connect into AWS already lands, so
# office traffic and DC traffic converge on one facility and a cage-level change
# has a blast radius spanning both.
#
# Shared facility, so owned by Internal (P028) rather than any tenant — only the
# per-office kit the generator builds carries a customer owner. Hand-written (not
# generator-managed) because it is shared, rare, low-churn infrastructure.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPhysicalDevice
  data:
    - name: "EQX-FR2-SDWAN-GW1"
      object_template: VCG-VA_GATEWAY
      status: active
      owner: "P028"
      description: "Shared SD-WAN gateway in the Equinix FR2 cage (offices <-> hub)"
      deployment: "FR2"
      member_of_groups:
        - sdwan_gateways
---
# The Orchestrator — manages the Gateway above plus every office Edge the
# add_sdwan_edge generator creates (generators/topology/sdwan_edge.py appends to
# managed_devices; the Gateway is added here by hand since it's hand-authored).
#
# Business policy (branch_to_branch mesh capability) is NOT set here — it lives
# directly on TopologyCustomerOffice.branch_to_branch (schemas/extensions/
# topology/topology_customer.yml), one plain attribute per office, matching how
# real VeloCloud business-policy profiles are assigned per edge rather than
# globally on the orchestrator.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedControllerVirtual
  data:
    - name: "EQX-FR2-SDWAN-VCO1"
      object_template: VCO-VA_ORCHESTRATOR
      owner: "P028"
      description: "Shared SD-WAN orchestrator managing the FR2 gateway and every office edge"
      deployment: "FR2"
      member_of_groups:
        - sdwan_orchestrators
      managed_devices:
        - "EQX-FR2-SDWAN-GW1"
