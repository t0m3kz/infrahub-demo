---
# Equinix Frankfurt colocation metro and its zones.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: EQUINIX
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: FR
            design: "S"
            location: ["fra"]
            routing_filter_enforce: true
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyColocationZone
              data:
                - name: FR2
                  design: "EDGE_FW"
                  member_of_groups:
                    - colocation_zones
                  fabric_templates:
                    - ["2", "edge", "N9K-C9316D-GX_EDGE"]
                    - ["2", "internal-firewall", "PA-5260_FIREWALL"]
                - name: FR6
                  member_of_groups:
                    - colocation_zones
