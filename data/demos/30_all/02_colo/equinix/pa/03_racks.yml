---
# Paris Equinix racks: PA4 and PA6
#
# topologies_rack membership is not about DC fabrics: it is what keeps the
# created-rack trigger from failing on a colocation rack — see
# ../../coresite/03_racks.yml for the full why.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationFacility
  data:
    - name: PA4
      shortname: pa4
      parent: par
      children:
        kind: LocationSuite
        data:
          - suite_name: PA4
            index: 4
            shortname: pa4-s1
            rows: 1
            racks_per_row: 2
            children:
              kind: LocationRack
              data:
                - shortname: pa4-s1-r-1
                  index: 1
                  row_index: 1
                  pod: PA4
                  member_of_groups: [topologies_rack]
                - shortname: pa4-s1-r-2
                  index: 2
                  row_index: 1
                  pod: PA4
                  member_of_groups: [topologies_rack]
    - name: PA6
      shortname: pa6
      parent: par
      children:
        kind: LocationSuite
        data:
          - suite_name: PA6
            index: 6
            shortname: pa6-s1
            rows: 1
            racks_per_row: 2
            children:
              kind: LocationRack
              data:
                - shortname: pa6-s1-r-1
                  index: 1
                  row_index: 1
                  pod: PA6
                  member_of_groups: [topologies_rack]
                - shortname: pa6-s1-r-2
                  index: 2
                  row_index: 1
                  pod: PA6
                  member_of_groups: [topologies_rack]
