---
# Paris colocation metro and zones (nested from colocation root)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: EQUINIX
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          # Declared on-ramp kit on PA4 — see the FR note in ../fr/02_topology.yml
          # for the port roles N9K-C9316D-GX_EDGE brings. Paris fronts DC12;
          # like Frankfurt, both edges are border gateways linked by the
          # interlink. PA6 carries nothing.
          - name: PA
            design: "S"
            location: ["par"]
            routing_filter_enforce: true
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyColocationZone
              data:
                - name: PA4
                  design: "EDGE"
                  member_of_groups:
                    - colocation_zones
                  fabric_templates:
                    - ["2", "edge", "N9K-C9316D-GX_EDGE"]
                - name: PA6
                  member_of_groups:
                    - colocation_zones
