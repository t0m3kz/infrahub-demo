---
# Amsterdam colocation metro and its virtual colocation (nested from colocation root)
#
# Equinix Amsterdam is one provider-hosted presence, not cages: the metro AM
# (the Multi-Site site) has a single TopologyVirtualColocation child, AM-NE
# (Equinix Network Edge). It is named differently from its metro because metro,
# zone and virtual colocation names share the device-name and pool-name space.
# AM-NE hosts an edge pair of its own: eg-am-ne01 and eg-am-ne02 are
# CloudNetworkAppliances (C8000V_EDGE), two independent Network Edge routers we rent,
# not hardware we rack, ordered through Terraform (02_account.yml holds the
# billing account of that order). They are the one virtual edge pair of this demo;
# the handoff circuits HANDOFF-FR2-AMNE-PROD (08_interconnects/03_virtual_circuits/02_am_ne_handoff.yml)
# and HANDOFF-AMNE-AWS-EUC1-PROD (08_interconnects/05_cloud_endpoints/00_vif_handoff_am_ne.yml)
# terminate on their Ethernet1/1 sub-interfaces.
# AM-NE still joins virtual_colocations because the created-trigger fires per kind and
# would raise on a non-member. data/demos/10_colocation gives it the same pair on its own.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyColocation
  data:
    - name: EQUINIX
      parent: "Colocation"
      children:
        kind: TopologyColocationMetro
        data:
          - name: AM
            design: "S"
            location: ["ams"]
            member_of_groups:
              - colocation_metros
            children:
              kind: TopologyVirtualColocation
              data:
                - name: AM-NE
                  design: "EDGE"
                  # Routed to the virtual_colocation_terraform group: one Equinix Network Edge
                  # Terraform artifact, one equinix_network_device per router (eg-am-ne01, eg-am-ne02).
                  infrastructure_orchestrator: terraform
                  # The provider order's contract data, printed into that file (02_account.yml).
                  account: "equinix-network-edge"
                  member_of_groups:
                    - virtual_colocations
                  fabric_templates:
                    - ["2", "edge", "C8000V_EDGE"]
