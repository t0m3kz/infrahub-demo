---
# Minimal VLAN/VNI/L3-VNI pools for DC1-DC6 — enough for the
# add_vxlan_segment generator to allocate real pool-backed values when
# testing VXLAN network segments against these fake fabrics.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: "dc1-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 3999
    - name: "dc1-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 10001
      end_range: 16777215
    - name: "dc1-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
      end_range: 59999

    - name: "dc2-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 3999
    - name: "dc2-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 10001
      end_range: 16777215
    - name: "dc2-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
      end_range: 59999

    - name: "dc3-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 3999
    - name: "dc3-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 10001
      end_range: 16777215
    - name: "dc3-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
      end_range: 59999

    - name: "dc4-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 3999
    - name: "dc4-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 10001
      end_range: 16777215
    - name: "dc4-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
      end_range: 59999

    - name: "dc5-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 3999
    - name: "dc5-vni-pool"
