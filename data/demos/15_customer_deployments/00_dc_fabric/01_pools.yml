      node_attribute: "vni"
      start_range: 10001
      end_range: 16777215
    - name: "dc5-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
      end_range: 59999

    - name: "dc6-vlan-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vlan_id"
      start_range: 100
      end_range: 3999
    - name: "dc6-vni-pool"
      node: "ManagedSegmentDeployment"
      node_attribute: "vni"
      start_range: 10001
      end_range: 16777215
    - name: "dc6-l3vni-pool"
      node: "IpamNamespace"
      node_attribute: "l3_vni"
      start_range: 50001
