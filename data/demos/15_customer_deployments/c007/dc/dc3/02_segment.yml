---
# VXLAN segment activated in C007's DC footprint (DC3).
# VLAN ID + VNI are not set here — the add_vxlan_segment generator
# allocates them from DC3's vlan_pool/vni_pool (see 00_dc_fabric/) and
# creates the ManagedSegmentDeployment realization record.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - owner: "C007"
      customer_name: "orbisan-prod"
      environment: "p"
      customer_deployments: [["C007", "p"]]
