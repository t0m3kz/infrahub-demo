---
# Customer C015 deployment footprint inside an existing cloud region from
# data/demos/11_cloud/. TopologyCustomerCloud's parent is the region
# (TopologyCloudRegion), not the individual zone.
#
# Requires the corresponding region to already exist:
#   - eu-central-1 (AWS)  <- data/demos/11_cloud/aws/
#
# name is a computed attribute ({owner_org_id}-{customer_name}-{environment}-
# {parent}) — read-only, do not set it explicitly. customer_name is a unique
# per-cloud-account identifier (VXLAN across DC+Colo can't stretch into
# cloud, so cloud footprints are named independently).

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerCloud
  data:
    - owner: "C015"
      customer_name: "novantis-aws"
      environment: "p"
      status: active
      parent: "eu-central-1"
