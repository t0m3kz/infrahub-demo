---
# C001 (Nordix Ltd.) — DC6 deployment footprint.
#
# TopologyCustomerDC is the customer's presence inside DC6 (parent = the DC
# itself, not a pod — see data/demos/30_all/06_customer_boarding/*/dc/*/01_deployment.yml
# for the reference pattern). Its tenant namespace is derived from the
# footprint's environment (one of the 4 fixed namespaces in
# data/bootstrap/22_namespaces.yml) — no per-customer VRF.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C001"
      environment: "p"
      status: active
      parent: "DC6"
      design: "M_DC"
      member_of_groups:
        - customer_deployments_dc
    - owner: "C001"
      environment: "t"
      status: active
      parent: "DC6"
      design: "S_DC"
      member_of_groups:
        - customer_deployments_dc
