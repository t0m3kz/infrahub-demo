---
# C002 (SwiftGo GmbH) — environment VRF namespaces.
#
# One IpamNamespace per environment actually used by this customer's
# segments (segment.environment: p|n|s|d|t -> {ORG_ID}-{SUFFIX}).
# l3_vni is NOT set here — VrfNamespaceGenerator allocates it from the
# shared GLOBAL-L3VNI pool once member_of_groups: vrf_namespaces triggers it.
#
# Suffix map: p=PROD, n=NONPROD, s=STAGING, d=DEV, t=TEST

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamNamespace
  data:
    - name: "C002-PROD"
      description: "SwiftGo GmbH production VRF"
      member_of_groups:
        - vrf_namespaces
