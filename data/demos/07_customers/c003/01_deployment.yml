---
# C003 (Vaultex Inc.) — DC6 deployment footprint.
#
# TopologyCustomerDC is the customer's presence inside DC6 (parent = the DC
# itself, not a pod — see data/demos/15_customer_deployments/*/dc/*/01_deployment.yml
# for the reference pattern). Creating it (member_of_groups: customer_deployments)
# event-triggers ExchangeGatewayGenerator (generators/topology/customer_deployment.py),
# which get-or-creates the customer's VRF namespace ("{ORG_ID}-{ENV}", i.e.
# "C003-P") tagged into vrf_namespaces so add_vrf_namespace allocates its L3
# VNI, then wires a route-leak exchange to SHARED-SERVICES. No manual
# IpamNamespace file needed — 02_segments.yml (loads after this, once the
# generator has run) references the namespace it creates.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerDC
  data:
    - owner: "C003"
      environment: "p"
      status: active
      parent: "DC6"
      design: "M_DC"
      member_of_groups:
        - customer_deployments
    - owner: "C003"
      environment: "s"
      status: active
      parent: "DC6"
      design: "S_DC"
      member_of_groups:
        - customer_deployments
