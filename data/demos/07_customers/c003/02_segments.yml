---
# C003 (Vaultex Inc.) — production subnets and VXLAN segments.
#
# Loads after 01_deployment.yml's TopologyCustomerDC has triggered
# ExchangeGatewayGenerator (event-driven — see _phase_07_customers in
# tasks/demo.py, which waits for it before loading this file), so the
# "C003-P" VRF namespace already exists.
#
# ManagedVxlanSegment has no prefixes relationship — subnets/gateways live
# independently in the customer's IP namespace (see
# data/demos/100_universal_topology/06_applications/C002/00_namespaces.yml
# for the reference pattern); the segment only references its gateway IP
# by HFID tuple [address, ip_namespace_name].

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "10.3.10.0/24"
      description: "C003 prod web-frontend subnet (DC6)"
      status: active
      role: customer
      ip_namespace: "C003-P"

    - prefix: "10.3.20.0/24"
      description: "C003 prod app-backend subnet (DC6)"
      status: active
      role: customer
      ip_namespace: "C003-P"

    - prefix: "10.3.30.0/24"
      description: "C003 prod database subnet (DC6)"
      status: active
      role: customer
      ip_namespace: "C003-P"

    - prefix: "10.3.40.0/24"
      description: "C003 prod cache subnet (DC6)"
      status: active
      role: customer
      ip_namespace: "C003-P"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "10.3.10.1/24"
      description: "Anycast GW — C003 prod web-frontend (DC6)"
      ip_namespace: "C003-P"

    - address: "10.3.20.1/24"
      description: "Anycast GW — C003 prod app-backend (DC6)"
      ip_namespace: "C003-P"

    - address: "10.3.30.1/24"
      description: "Anycast GW — C003 prod database (DC6)"
      ip_namespace: "C003-P"

    - address: "10.3.40.1/24"
      description: "Anycast GW — C003 prod cache (DC6)"
      ip_namespace: "C003-P"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    - owner: "C003"
      customer_name: "web-frontend"
      environment: "p"
      arp_suppression: true
      customer_deployments: [["C003", "p"]]
      gateway: ["10.3.10.1/24", "C003-P"]
      member_of_groups:
        - vxlan_segments

    - owner: "C003"
      customer_name: "app-backend"
      environment: "p"
      arp_suppression: true
      customer_deployments: [["C003", "p"]]
      gateway: ["10.3.20.1/24", "C003-P"]
      member_of_groups:
        - vxlan_segments

    - owner: "C003"
      customer_name: "database"
      environment: "p"
      arp_suppression: true
      customer_deployments: [["C003", "p"]]
      gateway: ["10.3.30.1/24", "C003-P"]
      member_of_groups:
        - vxlan_segments

    - owner: "C003"
      customer_name: "cache"
      environment: "p"
      arp_suppression: true
      customer_deployments: [["C003", "p"]]
      gateway: ["10.3.40.1/24", "C003-P"]
      member_of_groups:
        - vxlan_segments
