---
# VXLAN segments — EVPN overlay with per-customer VRF isolation
#
# gateway: [gateway_ip, namespace] tuple (HFID lookup) — the segment's anycast
# gateway IpamIPAddress. VRF/subnet are derived from gateway.ip_prefix, so the
# gateway address must fall inside a prefix already created in 02_prefixes.yml.
# deployments: set per-demo file; triggers SegmentDeployment allocation
#
# HFID: {owner}__{environment}__{customer_name}
# Example: "CNRD__production__web-frontend"

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedVxlanSegment
  data:
    # ==========================================
    # Nordix Ltd. — Production (3-tier app)
    # ==========================================
    - customer_name: "web-frontend"
      environment: "p"
      owner: "Nordix Ltd."
      arp_suppression: true
      gateway:
        - "10.1.10.1/24"
        - "C001-PROD"
      member_of_groups:
        - vxlan_segments

    - customer_name: "app-backend"
      environment: "p"
      owner: "Nordix Ltd."
      arp_suppression: true
      gateway:
        - "10.1.20.1/24"
        - "C001-PROD"
      member_of_groups:
        - vxlan_segments

    - customer_name: "database"
      environment: "p"
      owner: "Nordix Ltd."
      arp_suppression: true
      gateway:
        - "10.1.30.1/24"
        - "C001-PROD"
      member_of_groups:
        - vxlan_segments

    # ==========================================
    # Nordix Ltd. — Non-Production
    # ==========================================
    - customer_name: "web-frontend"
      environment: "n"
      owner: "Nordix Ltd."
      arp_suppression: true
      gateway:
        - "10.1.110.1/24"
        - "C001-NONPROD"
      member_of_groups:
        - vxlan_segments

    # ==========================================
    # CSWM — Production
    # ==========================================
    - customer_name: "web-frontend"
      environment: "p"
      owner: "SwiftGo GmbH"
      arp_suppression: true
      gateway:
        - "10.2.10.1/24"
        - "C002-PROD"
      member_of_groups:
        - vxlan_segments

    - customer_name: "app-backend"
      environment: "p"
      owner: "SwiftGo GmbH"
      arp_suppression: true
      gateway:
        - "10.2.20.1/24"
        - "C002-PROD"
      member_of_groups:
        - vxlan_segments

    # ==========================================
    # Shared Services (L2+L3, no specific customer)
    # ==========================================
    - customer_name: "shared-infra"
      environment: "p"
      owner: "Nordix Ltd."
      arp_suppression: false
      gateway:
        - "10.255.1.1/24"
        - "SHARED-SERVICES"
      member_of_groups:
        - vxlan_segments
