---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPhysicalDevice
  data:
    - template_name: BIG-IP-i5800_LOAD_BALANCER
      owner: "P027"
      device_type: BIG-IP-i5800
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      role: load-balancer
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: BIG-IP-i5800_LOAD_BALANCER_mgmt
            name: mgmt
            role: management
            interface_type: 1000base-t
          - template_name: BIG-IP-i5800_LOAD_BALANCER_1.1
            name: "1.1"
            role: customer
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_1.2
            name: "1.2"
            role: customer
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_1.3
            name: "1.3"
            role: ha
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_2.1
            name: "2.1"
            role: uplink
            interface_type: 100gbase-x-qsfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_2.2
            name: "2.2"
            role: uplink
            interface_type: 100gbase-x-qsfp28

    - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE
      owner: "P027"
      device_type: BIG-IP-i5800
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      role: load-balancer
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE_mgmt
            name: mgmt
            role: management
            interface_type: 1000base-t
          - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE_1.1
            name: "1.1"
            role: customer
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE_1.2
            name: "1.2"
            role: customer
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE_1.3
            name: "1.3"
            role: ha
            interface_type: 25gbase-x-sfp28
          # 2.1 faces the firewall (middle leg of the inline chain), 2.2 faces
          # back to the border-leaf (return leg) — two distinct physical ports
          # so neither leg's cable competes for the other's port. The plain
          # BIG-IP-i5800_LOAD_BALANCER template's two "uplink" ports are
          # undifferentiated and only correct for pbr mode's single BLF<->LB leg.
          - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE_2.1
            name: "2.1"
            role: uplink
            interface_type: 100gbase-x-qsfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_INLINE_2.2
            name: "2.2"
            role: downlink
            interface_type: 100gbase-x-qsfp28
