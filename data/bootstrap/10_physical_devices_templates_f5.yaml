---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPhysicalDevice
  data:
    - template_name: BIG-IP-i5800_LOAD_BALANCER
      owner: "P027"
      device_type: BIG-IP-i5800
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      role: load-balancer
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: BIG-IP-i5800_LOAD_BALANCER_mgmt
            name: mgmt
            role: management
            interface_type: 1000base-t
          - template_name: BIG-IP-i5800_LOAD_BALANCER_1.1
            name: "1.1"
            role: customer
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_1.2
            name: "1.2"
            role: customer
            interface_type: 25gbase-x-sfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_1.3
            name: "1.3"
            role: ha
            interface_type: 25gbase-x-sfp28
          # 2.1 ("uplink") is pbr mode's border-leaf-facing port, and inline
          # mode's firewall-facing middle-leg port. 2.2 ("downlink") is only
          # used in inline mode, for the return leg back to border-leaf — kept
          # as a distinct role/port so inline mode's two legs never compete for
          # the same physical port (pbr mode only ever uses 2.1, leaving 2.2 idle).
          - template_name: BIG-IP-i5800_LOAD_BALANCER_2.1
            name: "2.1"
            role: uplink
            interface_type: 100gbase-x-qsfp28
          - template_name: BIG-IP-i5800_LOAD_BALANCER_2.2
            name: "2.2"
            role: downlink
            interface_type: 100gbase-x-qsfp28
