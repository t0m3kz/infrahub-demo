---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPhysicalDevice
  data:
    - template_name: SRX-1500
      owner: P027
      device_type: SRX-1500
      platform: junos
      software_image: junos-23.4R2
      role: firewall
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: SRX-1500_fxp0
            name: fxp0
            role: management
            interface_type: 1000base-t
          - template_name: SRX-1500_ge-0/0/[0-3]
            name: ge-0/0/[0-3]
            role: downlink
            interface_type: 1000base-t
