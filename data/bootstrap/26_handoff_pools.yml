---
# Link pools for handoff and vpn session circuits, one per routing domain and
# named Handoff-<SecurityZone.name>-IPv4. The generator picks the pool from
# the circuit's security_zone. Every pool and resource prefix uses built-in
# default IPAM, independently of the routed zone.
#
# These pools serve a session circuit whose link range comes from OUR pool: a handoff (cloud on-ramp, Equinix or
# Megaport service, SD-WAN gateway handoff) and a vpn. A /31 is allocated per circuit (HANDOFF_PREFIX_LENGTH), both
# ends are addressed from it.
#
# 10.255.128.0/18 split in /20s (2048 /31 links each): PROD .128, NONPROD .144, INTERNET .160, MANAGEMENT .176.
# Clear of the authored 10.255.5.x handoffs of data/demos/30_all/08_interconnects/.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Handoff-PROD-IPv4
      description: "Handoff P2P /31 links in the PROD VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.255.128.0/20
            description: "Handoff P2P space, PROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: Handoff-NONPROD-IPv4
      description: "Handoff P2P /31 links in the NONPROD VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.255.144.0/20
            description: "Handoff P2P space, NONPROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: Handoff-INTERNET-IPv4
      description: "Handoff P2P /31 links in the INTERNET VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.255.160.0/20
            description: "Handoff P2P space, INTERNET VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: Handoff-MANAGEMENT-IPv4
      description: "Handoff P2P /31 links in the MANAGEMENT VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.255.176.0/20
            description: "Handoff P2P space, MANAGEMENT VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"
