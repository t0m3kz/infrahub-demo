---
# Customer Deployment Templates - the service tiers
# The reusable tiers a customer footprint picks with `design`, one kind per facility (data center, colocation,
# cloud). Loaded at bootstrap time, referenced by TopologyCustomerDC, TopologyCustomerColocation and
# TopologyCustomerCloud instances. The tiers are named S, M, L and XL in every kind (the kinds are distinct nodes).
# In the DC kind S and M use the shared firewall/load balancer capacity, L and XL are dedicated.
#
# What reads a row:
#   dedicated_firewall / dedicated_loadbalancer - generators/customers/firewall_context.py (DC)
#   max_segments  - checks/customers/customer_quota.py, an ERROR when a footprint with this design has more network
#     segments (naming the footprint in customer_deployments, or its cloud subnets) than the tier allows
#   ports_<n>g    - checks/customers/customer_quota.py (DC), host-facing leaf/access ports of that speed tagged with the
#     footprint's segments (0 = none of that speed allowed)
#   max_virtual_networks - checks/customers/customer_quota.py (cloud), the virtual networks of the footprint's account
#   address_prefix_length - DC and colocation: the IPv4 block generators/segments/segment_addressing.py carves from
#     the environment's tenant pool (Tenant-PROD-IPv4 / Tenant-NONPROD-IPv4) for the customer's own prefix pool when
#     the footprint is boarded; the customer's segments are addressed from it.
#     Cloud: the routed range of the footprint (one account in one cloud region), IPv4 only, carved at boarding
#     into the customer's cloud pool; nothing draws from that pool yet (it exists for the later routed-range
#     allocation per virtual network), and the cloud tiers have none of the three numbers below.
#   segment_prefix_length - DC and colocation: the IPv4 prefix of a segment that states no host_count (24 in every
#     tier; a host_count sizes the prefix instead).
#   ipv6_prefix_length - DC and colocation: the IPv6 block carved from Tenant-PROD-IPv6 / Tenant-NONPROD-IPv6 for
#     the customer's IPv6 pool.
#   ipv6_segment_prefix_length - DC and colocation: the prefix of an IPv6 segment (64 in every tier: anything else
#     breaks SLAAC).
#   checks/customers/customer_quota.py requires the IPv4 block to hold max_segments segments of segment_prefix_length
#   and the IPv6 block max_segments segments of ipv6_segment_prefix_length.
#
# The tiers are sized for an enterprise tenant, not for the demo data: S a small application (8 segments, a /21),
# M a business unit (24, a /19), L a large platform with its own firewall and load balancer (64, a /18), XL a whole
# line of business (128, a /17). Each IPv4 block holds its segments at /24 with room to spare, each IPv6 block is
# 256 or more /64 per segment quota, and every column grows from tier to tier. The worst case of data/demos/30_all
# (every footprint at its tier's full block) stays inside one /13 tenant supernet per environment
# (tests/unit/generators/test_limits_consistency.py). A cloud tier allows one /29 routed slice per virtual network
# (CLOUD_RANGE_PREFIX_LENGTH) in its routed range.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerTemplateDC
  data:
    - name: "S"
      description: "Shared firewall/LB. Up to 8 segments, 16 x 25G ports, a /21 block."
      dedicated_firewall: false
      dedicated_loadbalancer: false
      max_segments: 8
      address_prefix_length: 21
      segment_prefix_length: 24
      ipv6_prefix_length: 56
      ipv6_segment_prefix_length: 64
      ports_25g: 16
      ports_100g: 0

    - name: "M"
      description: "Shared firewall/LB. Up to 24 segments, 48 x 25G and 4 x 100G ports, a /19 block."
      dedicated_firewall: false
      dedicated_loadbalancer: false
      max_segments: 24
      address_prefix_length: 19
      segment_prefix_length: 24
      ipv6_prefix_length: 52
      ipv6_segment_prefix_length: 64
      ports_25g: 48
      ports_100g: 4

    - name: "L"
      description: "Dedicated firewall and LB. Up to 64 segments, 96 x 25G and 16 x 100G ports, a /18 block."
      dedicated_firewall: true
      dedicated_loadbalancer: true
      max_segments: 64
      address_prefix_length: 18
      segment_prefix_length: 24
      ipv6_prefix_length: 48
      ipv6_segment_prefix_length: 64
      ports_25g: 96
      ports_100g: 16

    - name: "XL"
      description: "Dedicated firewall and LB. Up to 128 segments, 192 x 25G and 32 x 100G ports, a /17 block."
      dedicated_firewall: true
      dedicated_loadbalancer: true
      max_segments: 128
      address_prefix_length: 17
      segment_prefix_length: 24
      ipv6_prefix_length: 44
      ipv6_segment_prefix_length: 64
      ports_25g: 192
      ports_100g: 32
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerTemplateColo
  data:
    - name: "S"
      description: "Up to 8 segments, a /21 block."
      max_segments: 8
      address_prefix_length: 21
      segment_prefix_length: 24
      ipv6_prefix_length: 56
      ipv6_segment_prefix_length: 64

    - name: "M"
      description: "Up to 24 segments, a /19 block."
      max_segments: 24
      address_prefix_length: 19
      segment_prefix_length: 24
      ipv6_prefix_length: 52
      ipv6_segment_prefix_length: 64

    - name: "L"
      description: "Up to 64 segments, a /18 block."
      max_segments: 64
      address_prefix_length: 18
      segment_prefix_length: 24
      ipv6_prefix_length: 48
      ipv6_segment_prefix_length: 64

    - name: "XL"
      description: "Up to 128 segments, a /17 block."
      max_segments: 128
      address_prefix_length: 17
      segment_prefix_length: 24
      ipv6_prefix_length: 44
      ipv6_segment_prefix_length: 64
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyCustomerTemplateCloud
  data:
    - name: "S"
      description: "Up to 8 segments in 2 virtual networks, a /28 routed range."
      max_segments: 8
      max_virtual_networks: 2
      address_prefix_length: 28

    - name: "M"
      description: "Up to 24 segments in 8 virtual networks, a /26 routed range."
      max_segments: 24
      max_virtual_networks: 8
      address_prefix_length: 26

    - name: "L"
      description: "Up to 64 segments in 16 virtual networks, a /25 routed range."
      max_segments: 64
      max_virtual_networks: 16
      address_prefix_length: 25

    - name: "XL"
      description: "Up to 128 segments in 32 virtual networks, a /24 routed range."
      max_segments: 128
      max_virtual_networks: 32
      address_prefix_length: 24
