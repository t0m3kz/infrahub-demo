---
# Software images — representative releases per platform defined in 05_platforms.yml.
# Naming convention: {platform_name}-{version}
# Must load after 05_platforms.yml (platform references resolve by HFID).

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimSoftwareImage
  data:

    # ── Arista EOS ────────────────────────────────────────────────────────────
    - name: arista_eos-4.28.3M
      version: "4.28.3M"
      platform: arista_eos
      description: "EOS 4.28 LTS — maintenance release, approved for existing deployments only"

    - name: arista_eos-4.30.4M
      version: "4.30.4M"
      platform: arista_eos
      description: "EOS 4.30 LTS — approved, superseded by 4.32"

    - name: arista_eos-4.32.1F
      version: "4.32.1F"
      platform: arista_eos
      description: "EOS 4.32 — current recommended image for all new deployments"

    # ── Linux (Ubuntu LTS) ────────────────────────────────────────────────────
    - name: linux-20.04.6
      version: "20.04.6"
      platform: linux
      description: "Ubuntu 20.04 LTS (Focal) — EoS reached April 2025, do not use for new builds"

    - name: linux-22.04.3
      version: "22.04.3"
      platform: linux
      description: "Ubuntu 22.04 LTS (Jammy) — recommended for all VM deployments"

    - name: linux-24.04.1
      version: "24.04.1"
      platform: linux
      description: "Ubuntu 24.04 LTS (Noble) — approved for new greenfield builds"

