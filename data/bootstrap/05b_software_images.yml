      description: "Gaia R81.10 — approved for existing deployments, migrate to R81.20"

    - name: checkpoint_gaia-R81.20
      version: "R81.20"
      platform: checkpoint_gaia
      description: "Gaia R81.20 — current recommended release for all firewall deployments"

    # ── F5 TMOS ───────────────────────────────────────────────────────────────
    - name: f5_tmos-16.1.4
      version: "16.1.4"
      platform: f5_tmos
      description: "TMOS 16.1 LTS — approved, migrate to 17.1 at next maintenance window"

    - name: f5_tmos-17.1.1
      version: "17.1.1"
      platform: f5_tmos
      description: "TMOS 17.1 — current recommended release"

