---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateManagedControllerPhysical
  data:
    - template_name: APIC-L3
      device_type: APIC-L3
      platform: linux
      software_image: linux-22.04.3
      controller_type: aci_apic
      role: controller
      status: provisioning
      owner: P027
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: APIC-L3_eth0
            name: eth0
            role: uplink
            interface_type: 1000base-t
          - template_name: APIC-L3_eth1
            name: eth1
            role: uplink
            interface_type: 1000base-t
          - template_name: APIC-L3_mgmt0
            name: mgmt0
            role: management
            interface_type: 1000base-t
    - template_name: C9800-40
      device_type: C9800-40
      platform: cisco_ios
      software_image: cisco_ios-17.12.4
      controller_type: wlc
      role: controller
      status: provisioning
      owner: P027
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: C9800-40_TenGigabitEthernet0/0/[0-3]
            name: TenGigabitEthernet0/0/[0-3]
            role: uplink
            interface_type: 10gbase-x-sfpp
          - template_name: C9800-40_mgmt0
            name: mgmt0
            role: management
            interface_type: 1000base-t
    - template_name: MDS-NDFC
      device_type: MDS-NDFC
      platform: linux
      software_image: linux-22.04.3
      controller_type: dcnm
      role: controller
      status: provisioning
      owner: P027
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: MDS-NDFC_eth0
            name: eth0
            role: uplink
            interface_type: 1000base-t
          - template_name: MDS-NDFC_mgmt0
            name: mgmt0
            role: management
            interface_type: 1000base-t
    - template_name: VCG-VA
      device_type: VCG-VA
      platform: velocloud
      software_image: velocloud-6.0.0
      controller_type: sdwan_orchestrator
      role: controller
      status: provisioning
      owner: P027
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: VCG-VA_eth0
            name: eth0
            role: uplink
            interface_type: 1000base-t
