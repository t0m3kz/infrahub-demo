    # ports four ways instead of the plain SPINE's two: downlink to this
    # pod's leafs (halved vs. SPINE's Ethernet[1-24]/1, since a micro-pod
    # has far fewer leafs), uplink for the inter-pod back-to-back mesh
    # (same role name as SPINE's uplink — pod.py's sibling-mesh cabling
    # doesn't need to know which device role it's cabling), and dedicated
    # firewall/load-balancer ports mirroring BORDER_LEAF's — this pod's own
