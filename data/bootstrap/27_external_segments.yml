---
# Networks outside every customer's control. The internet is a segment so
# policy rules can name it as a source or destination like any other; it has
# no prefix, gateway or deployment; its owner is the Internet
# pseudo-customer, because a segment's name is computed from its owner
# (generators/segment_firewall.py resolves its zone like any segment's).
# org_id and customer_name are the same token, so the computed name is just
# "internet" (no env suffix) and policy rules reference it as "internet".
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationCustomer
  data:
    - name: "Internet"
      org_id: "INTERNET"
      member_of_groups:
        - customers
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ManagedExternalSegment
  data:
    - owner: "INTERNET"
      customer_name: "Internet"
      environment: "p"
      description: "The public internet — any address outside the managed namespaces"
      segment_type: vlan
      pbr_enabled: false
      security_zone: "INTERNET-ZONE"
