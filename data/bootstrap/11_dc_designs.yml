---
# Data Center Design Templates - Pure Size/Capacity Templates
# These define ONLY the size/tier envelope for a data center fabric —
# max pods, max super-spine/hyper-spine/border-leaf counts, and address
# space sizing. Routing architecture (routing_strategy, underlay_protocol)
# is NOT part of the design — it's a free per-DC-instance choice, set
# directly on TopologyDataCenter (alongside naming_convention,
# connectivity_mode, management_mode). This decouples "how big" from
# "how it routes": two DCs of the same size can use different routing
# strategies, and two DCs on different routing strategies can be the
# same size.
#
# Exactly 4 designs, T-shirt sized:
#   S  — back-to-back (no super-spine tier), no border-leaf tier either.
#        Micro-fabric pattern: each pod's own border-spine collapses
#        spine + border-leaf, with its own per-pod firewall/load-balancer.
#   M  — back-to-back (no super-spine tier), WITH a separate DC-level
#        border-leaf tier (fronted by its own firewall/load-balancer).
#        Unlike S, border-leaf here is a real device, not collapsed.
#   L  — classic 3-tier: super-spine + border-leaf.
#   XL — classic 3-tier + a 4th hyper-spine tier above super-spine.
#
# Pool prefix lengths are sized by max_pods (larger designs get more
# address space). Management is always IPv4 regardless of the DC
# instance's underlay_protocol choice.
# P2P addressing: /31 for IPv4, /127 for IPv6 (auto-derived from the
# DC instance's own underlay_protocol, not from this design).
#
# The DC generator uses these when the DC instance has no pools set.
# Once pools exist on the DC instance they are reused and these values
# are ignored.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyDataCenterDesign
  data:
    - name: "S"
      description: >
        Small — micro-fabric, back-to-back (no super-spine tier: pods mesh
        their own border-spines directly to sibling pods), no DC-level
        border-leaf/firewall/load-balancer tier either. Those live on each
        pod's own border-spine instead (see TopologyPodDesign
        "S_BORDER_SPINE_POD" and the "border-spine" device role). Routing
        strategy/underlay protocol are chosen per-DC-instance.
      max_pods: 4
      max_super_spines_per_fabric: 0
      max_hyper_spines_per_fabric: 0
      max_spines_per_pod: 2
      max_border_leafs_per_fabric: 0
      loopback_prefix_length: 120
      technical_prefix_length: 117
      management_prefix_length: 26

    - name: "M"
      description: >
        Medium — back-to-back (no super-spine tier: pods mesh their own
        spines directly to sibling pods), but WITH a dedicated DC-level
        border-leaf tier (fronted by its own firewall/load-balancer) —
        unlike "S", border-leaf here is a real separate device, not
        collapsed into a per-pod border-spine. Routing strategy/underlay
        protocol are chosen per-DC-instance.
      max_pods: 4
      max_super_spines_per_fabric: 0
      max_hyper_spines_per_fabric: 0
      max_spines_per_pod: 4
      max_border_leafs_per_fabric: 2
      loopback_prefix_length: 119
      technical_prefix_length: 115
      management_prefix_length: 25

    - name: "L"
      description: >
        Large — classic 3-tier Clos: leaf -> spine -> super-spine, DC-level
        border-leaf fronted by firewall/load-balancer. Routing
        strategy/underlay protocol are chosen per-DC-instance. Sized for up
        to 8 pods, but a DC can instantiate fewer pods/devices than the cap
        allows (e.g. a small 2-pod fabric using the "L" design template).
      max_pods: 8
      max_super_spines_per_fabric: 4
      max_hyper_spines_per_fabric: 0
      max_spines_per_pod: 4
      max_border_leafs_per_fabric: 2
      loopback_prefix_length: 118
      technical_prefix_length: 114
      management_prefix_length: 24

    - name: "XL"
      description: >
        Extra Large — classic 3-tier Clos plus a 4th hyper-spine tier above
        super-spine (leaf -> spine -> super-spine -> hyper-spine), full-mesh
        cabled/routed between super-spine and hyper-spine. Sized for
        hyperscale deployments (up to 16 pods). Routing strategy/underlay
        protocol are chosen per-DC-instance.
      max_pods: 16
      max_super_spines_per_fabric: 4
      max_hyper_spines_per_fabric: 2
      max_spines_per_pod: 4
      max_border_leafs_per_fabric: 4
      loopback_prefix_length: 117
      technical_prefix_length: 113
      management_prefix_length: 23
