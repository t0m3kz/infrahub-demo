---
# Tunnel ID pool for generators/topology/sdwan_edge.py's SdwanEdgeGenerator —
# one per office Edge <-> Gateway overlay tunnel_id, allocated the same
# from_pool way InterconnectRequestGenerator allocates GRE keys
# (generators/topology/interconnect.py). Deliberately its own pool, disjoint
# from GLOBAL-INTERCONNECT-GRE-KEY (24_interconnect_pools.yml, 1-65535,
# scoped to link_type=gre cross-connect tunnels) even though both ultimately
# write TopologyVirtualCircuit.tunnel_id — mixing SD-WAN office overlays and
# WAN cross-connect GRE tunnels into one shared ID space would make "which
# kind of tunnel is number 4021" unanswerable without also checking link_type.
#
# Range starts above the three offices' hand-picked values (1001/1003/1015,
# data/demos/30_all/08_interconnects/04_sdwan/05_overlays.yml) so a
# generator-provisioned office never collides with one of those.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: GLOBAL-SDWAN-TUNNEL-ID
      description: Tunnel ID pool for generator-provisioned SD-WAN office overlays (link_type=sd_wan)
      node: TopologyVirtualCircuit
      node_attribute: tunnel_id
      start_range: 2000
      end_range: 9999
