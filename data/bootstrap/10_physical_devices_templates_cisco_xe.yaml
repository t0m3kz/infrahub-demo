---
# Catalyst 9000 (cisco_xe) campus templates of an office LISP fabric
# (generators/topology/office_fabric.py): the distribution-switch is the
# co-located border and control-plane node, the access-switch the fabric edge.
# The device types (C9300-48UXM, C9500-32C) come from 06_device_types.yml.
#
# Port names and speeds are approximate datasheet values chosen so the generator's
# speed-aware cabling finds a match: access-switch uplink 100G (a C9300X style
# 2x100G network module) to distribution-switch downlink 100G, and the two
# distribution-switches to each other on `interlink`. No lab has run any of it
# (unverified-no-lab).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPhysicalDevice
  data:
    - template_name: C9500-32C_DISTRIBUTION
      owner: "P027"
      device_type: C9500-32C
      platform: cisco_xe
      software_image: cisco_xe-17.12.4
      role: distribution-switch
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: C9500-32C_DISTRIBUTION_HundredGigE1/0/[1-24]
            name: HundredGigE1/0/[1-24]
            role: downlink
            interface_type: 100gbase-x-qsfp28
          - template_name: C9500-32C_DISTRIBUTION_HundredGigE1/0/25
            name: HundredGigE1/0/25
            role: interlink
            interface_type: 100gbase-x-qsfp28
          - template_name: C9500-32C_DISTRIBUTION_GigabitEthernet0/0
            name: GigabitEthernet0/0
            role: management
            interface_type: 1000base-t
    - template_name: C9300-48UXM_ACCESS_SWITCH
      owner: "P027"
      device_type: C9300-48UXM
      platform: cisco_xe
      software_image: cisco_xe-17.12.4
      role: access-switch
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: C9300-48UXM_ACCESS_SWITCH_TenGigabitEthernet1/0/[1-48]
            name: TenGigabitEthernet1/0/[1-48]
            role: customer
            interface_type: 10gbase-t
          - template_name: C9300-48UXM_ACCESS_SWITCH_HundredGigE1/1/[1-2]
            name: HundredGigE1/1/[1-2]
            role: uplink
            interface_type: 100gbase-x-qsfp28
          - template_name: C9300-48UXM_ACCESS_SWITCH_GigabitEthernet0/0
            name: GigabitEthernet0/0
            role: management
            interface_type: 1000base-t
