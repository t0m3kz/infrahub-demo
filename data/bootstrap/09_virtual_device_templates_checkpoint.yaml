---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimVirtualDevice
  data:
    # Dedicated per-customer instances, one per sizing tier, hosted on the
    # DC's physical pair when a customer's design asks for dedicated_firewall
    # / dedicated_loadbalancer (generators/firewall_context.py).
    - template_name: CloudGuard_EDGE_CUSTOMER_S
      owner: "P027"
      device_type: CloudGuard
      role: firewall
      platform: checkpoint_gaia
      software_image: checkpoint_gaia-R81.20
      status: active
      cpu: 2
      memory: 8
      storage: 60
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: CloudGuard_EDGE_CUSTOMER_S_eth0
            name: eth0
            role: management
          - template_name: CloudGuard_EDGE_CUSTOMER_S_eth[1-6]
            name: eth[1-6]
            role: uplink
          - template_name: CloudGuard_EDGE_CUSTOMER_S_eth7
            name: eth7
            role: ha
    - template_name: CloudGuard_EDGE_CUSTOMER_M
      owner: "P027"
      device_type: CloudGuard
      role: firewall
      platform: checkpoint_gaia
      software_image: checkpoint_gaia-R81.20
      status: active
      cpu: 4
      memory: 16
      storage: 120
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: CloudGuard_EDGE_CUSTOMER_M_eth0
            name: eth0
            role: management
          - template_name: CloudGuard_EDGE_CUSTOMER_M_eth[1-6]
            name: eth[1-6]
            role: uplink
          - template_name: CloudGuard_EDGE_CUSTOMER_M_eth7
            name: eth7
            role: ha
    - template_name: CloudGuard_EDGE_CUSTOMER_L
      owner: "P027"
      device_type: CloudGuard
      role: firewall
      platform: checkpoint_gaia
      software_image: checkpoint_gaia-R81.20
      status: active
      cpu: 8
      memory: 32
      storage: 240
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: CloudGuard_EDGE_CUSTOMER_L_eth0
            name: eth0
            role: management
          - template_name: CloudGuard_EDGE_CUSTOMER_L_eth[1-6]
            name: eth[1-6]
            role: uplink
          - template_name: CloudGuard_EDGE_CUSTOMER_L_eth7
            name: eth7
            role: ha
    - template_name: CloudGuard_EDGE_CUSTOMER_XL
      owner: "P027"
      device_type: CloudGuard
      role: firewall
      platform: checkpoint_gaia
      software_image: checkpoint_gaia-R81.20
      status: active
      cpu: 16
      memory: 64
      storage: 480
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: CloudGuard_EDGE_CUSTOMER_XL_eth0
            name: eth0
            role: management
          - template_name: CloudGuard_EDGE_CUSTOMER_XL_eth[1-6]
            name: eth[1-6]
            role: uplink
          - template_name: CloudGuard_EDGE_CUSTOMER_XL_eth7
            name: eth7
            role: ha
