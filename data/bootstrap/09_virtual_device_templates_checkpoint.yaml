---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimVirtualDevice
  data:
    - template_name: CloudGuard
      owner: P027
      device_type: CloudGuard
      role: firewall
      platform: checkpoint_gaia
      software_image: checkpoint_gaia-R81.20
      status: active
      cpu: 2
      memory: 8
      storage: 100
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: CloudGuard_eth0
            name: eth0
            role: management
          - template_name: CloudGuard_eth[1-6]
            name: eth[1-6]
            role: customer
          - template_name: CloudGuard_eth7
            name: eth7
            role: ha
