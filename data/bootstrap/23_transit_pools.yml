# Per-VRF /29 transit pools for firewall-context legs (see
# generators/firewall_context.py and utils/exchange_transit.py). Each pool
# and its resource prefix use built-in default IPAM; the pool name selects
# the routing domain, whose SecurityZone is defined in 24_security_zones.yml.
# One pool per fixed VRF, RFC 6598 100.66.0.0/18 split in /20s:
# PROD .0, NONPROD .16, INTERNET .32, MANAGEMENT .48. 100.66.64.0/18 holds the
# load-balancer legs (/29, .64 PROD and .80 NONPROD) and VIP ranges (/26, .96 and .112).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: FW-Transit-PROD-IPv4
      description: "FirewallContext transit /29 legs in the PROD VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 29
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.0.0/20
            description: "RFC 6598 transit space, PROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"
    - name: FW-Transit-NONPROD-IPv4
      description: "FirewallContext transit /29 legs in the NONPROD VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 29
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.16.0/20
            description: "RFC 6598 transit space, NONPROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: FW-Transit-INTERNET-IPv4
      description: "FirewallContext transit /29 legs in the INTERNET VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 29
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.32.0/20
            description: "RFC 6598 transit space, INTERNET VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: FW-Transit-MANAGEMENT-IPv4
      description: "FirewallContext transit /29 legs in the MANAGEMENT VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 29
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.48.0/20
            description: "RFC 6598 transit space, MANAGEMENT VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: LB-Leg-PROD-IPv4
      description: "LoadbalancerContext one-arm /29 legs in the PROD VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 29
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.64.0/20
            description: "RFC 6598 load-balancer leg space, PROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: LB-Leg-NONPROD-IPv4
      description: "LoadbalancerContext one-arm /29 legs in the NONPROD VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 29
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.80.0/20
            description: "RFC 6598 load-balancer leg space, NONPROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: LB-VIP-PROD-IPv4
      description: "LoadbalancerContext routed VIP /26 ranges in the PROD VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 26
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.96.0/20
            description: "RFC 6598 load-balancer VIP space, PROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"

    - name: LB-VIP-NONPROD-IPv4
      description: "LoadbalancerContext routed VIP /26 ranges in the NONPROD VRF (RFC 6598)"
      default_prefix_type: IpamPrefix
      default_prefix_length: 26
      resources:
        kind: IpamPrefix
        data:
          - prefix: 100.66.112.0/20
            description: "RFC 6598 load-balancer VIP space, NONPROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: technical
            ip_namespace: "default"
      ip_namespace: "default"
