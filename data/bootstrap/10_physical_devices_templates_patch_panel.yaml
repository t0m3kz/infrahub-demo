---
# Passive patch panel templates. A panel is DcimPatchPanel, not a device (schemas/extensions/dcim/patch_panel.yml): its
# rear ports are its components and each rear port's front ports are ITS components, so the pairing of a jack is the
# structure the template creates (an object template copies an attribute relationship as it is and cannot point a
# front port at a sibling, but it materializes component children level by level). A ranged nested list multiplies
# (rear [1-24] x front [1-24] = 576 fronts), so every jack is written out in full (rear port N with its front port N):
# edit a template by hand or by script; tests/unit/test_patch_panel_schema.py pins the shape. Instantiated with
# `object_template:` like a device template; the panel gets its name and rack in data.
#
#   PP-24-LC, PP-48-LC   N jacks, LC/UPC, one front port per rear port
#   PP-12-SC             12 jacks, SC/UPC
#   PP-24-RJ45           24 jacks, RJ45
#   PP-CASSETTE-MPO12    4 cassettes: a rear MPO-12 port each carrying 12 LC/UPC front ports (48 LC in 1U)
apiVersion: infrahub.app/v1
kind: Object
