---
# Passive patch panel templates. A panel is DcimPatchPanel, not a device (schemas/extensions/dcim/patch_panel.yml): a
# jack is two ports of one name, a `front` and a `rear` one, and the pair is how a cross-connect continues through the
# panel. Instantiated with `object_template:` like a device template; the panel gets its name and rack in data.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPatchPanel
  data:
    - template_name: PP-24-LC
      description: "24-jack fibre patch panel, LC/UPC"
      ports:
        kind: TemplateDcimPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: PP-24-LC_front_[1-24]
            name: "[1-24]"
            face: front
            connector: lc-upc
          - template_name: PP-24-LC_rear_[1-24]
            name: "[1-24]"
            face: rear
            connector: lc-upc

    - template_name: PP-24-RJ45
      description: "24-jack copper patch panel, RJ45"
      ports:
        kind: TemplateDcimPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: PP-24-RJ45_front_[1-24]
            name: "[1-24]"
            face: front
            connector: rj45
          - template_name: PP-24-RJ45_rear_[1-24]
            name: "[1-24]"
            face: rear
            connector: rj45
