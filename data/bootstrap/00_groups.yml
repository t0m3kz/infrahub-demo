---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    - name: cores
      description: Core Routers
    - name: linux_devices
      description: Linux Devices
    - name: leafs
      description: All leaf switches
    - name: tors
      description: All ToR switches (VTEP — tor-deployment, connects to spines)
    - name: l2-leafs
      description: All L2-leaf switches (L2-only aggregation — middle_rack/mixed, connects to leafs)
    - name: access-leafs
      description: All access-leaf switches (VXLAN-EVPN VTEP — connects to leafs, not spines)
    - name: access-switches
      description: All access-switches (campus LISP fabric edge nodes of an office)
    - name: distribution-switches
      description: All distribution-switches (co-located LISP border and control-plane nodes of an office)
    - name: border-leafs
      description: All border leafs
    - name: border-spines
      description: All border spines (collapsed spine + border-leaf, micro-fabric pods)
    - name: spines
      description: All spines
    - name: super-spines
      description: All super spines
    - name: hyper-spines
      description: All hyper spines
    - name: firewalls
      description: All firewalls
    - name: loadbalancers
      description: All load balancers
    - name: cloud_loadbalancers
      description: All cloud load balancers (AWS/Azure/GCP)
    - name: oobs
      description: All OOB devices
    - name: consoles
      description: All console devices
    - name: edges
      description: All edge devices
    - name: endpoints
      description: All endpoint devices (servers)
    - name: topologies_dc
      description: Data Center
    - name: topologies_pod
      description: Data Center Pod
    - name: topologies_rack
      description: Data Center Rack
    - name: topologies_pop
      description: POP Topologies
    - name: topologies_clab
      description: Containerlab Topologies
    - name: equinix_pop
      description: Equinix POPs
    - name: vxlan_segments
      description: VXLAN Segments (EVPN overlay)
    - name: cloud_accounts
      description: Cloud accounts (AWS/Azure/GCP) — one Terraform/Pulumi artifact per account
    - name: saas_proxies
      description: SaaS forwarding proxies (Zscaler, Prisma, Netskope, etc.)
    - name: onprem_proxies
      description: On-premises forwarding proxies (Squid, BlueCoat, Cisco WSA, etc.)
    - name: sdwan_edges
      description: VeloCloud SD-WAN branch edge appliances (VCE)
    - name: sdwan_gateways
      description: Arista SD-WAN hub gateways (VCG) deployed at colocation or cloud sites
    - name: provider_stubs
      description: Provider stub routers inside a colocation zone (Fabric port, Megaport MCR); never border gateways
    - name: sdwan_orchestrators
      description: Arista SD-WAN Orchestrators (VCO) — on-premises or private cloud deployments
    - name: ha_domains
      description: HA domains (firewall + load balancer) — membership tracking only, no generator dispatch
    - name: mlag_domains
      description: MLAG domains — generator target for MLAGWiringGenerator
    - name: app_applications
      description: Application instances — generator target for AppApplicationGenerator
    - name: app_components
      description: Application component instances
    - name: app_dependencies
      description: Application dependency edges — generator target for AppApplicationGenerator (add_app_dependency)
    - name: topology_ansible
      description: Customer deployment footprints routed to Ansible-based infrastructure orchestration
    - name: topology_github_actions
      description: Customer deployment footprints routed to GitHub Actions-based infrastructure orchestration
    - name: topology_terraform
      description: Customer deployment footprints routed to Terraform/OpenTofu-based infrastructure orchestration
    - name: topology_argocd
      description: Customer deployment footprints routed to Argo CD-based platform orchestration
    - name: virtual_colocation_terraform
      description: Virtual colocations (Equinix Network Edge) routed to Terraform/OpenTofu orchestration
    - name: application_ansible
      description: Applications routed to Ansible Automation Platform delivery workflows
    - name: application_github_actions
      description: Applications routed to GitHub Actions delivery workflows
    - name: application_argocd
      description: Applications routed to Argo CD delivery workflows
    - name: managed_controllers
      description: Management/orchestration controllers (ACI APIC, DCNM, Panorama, Check Point SMS, F5 BIG-IQ, NetScaler-ADM, ...) — target for controller payload artifacts  # yamllint disable-line rule:line-length

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    - name: customer_deployments_dc
      description: TopologyCustomerDC footprints — generator target for CustomerDeploymentDCExchangeGenerator and TopologyOrchestratorRoutingGenerator (add_customer_dc_orchestrator_routing)  # yamllint disable-line rule:line-length
    - name: customer_deployments_colocation
      description: TopologyCustomerColocation footprints — generator target for CustomerDeploymentColocationExchangeGenerator and TopologyOrchestratorRoutingGenerator (add_customer_colocation_orchestrator_routing)  # yamllint disable-line rule:line-length
    - name: customer_deployments_cloud
      description: TopologyCustomerCloud footprints — generator target for TopologyOrchestratorRoutingGenerator (add_customer_cloud_orchestrator_routing)  # yamllint disable-line rule:line-length
    - name: customer_deployments_office
      description: TopologyCustomerOffice footprints — generator target for SdwanEdgeGenerator (no-ops unless sdwan_gateway is set) and OfficeFabricGenerator (no-ops unless fabric_templates is set). Formerly CustomerDeploymentOfficeExchangeGenerator, removed per docs/exchange_gateway.md. Also the target of TopologyOrchestratorRoutingGenerator (add_customer_office_orchestrator_routing).  # yamllint disable-line rule:line-length
    - name: colocation_metros
      description: "TopologyColocationMetro regions, the Multi-Site site holder — generator target for ColocationMetroGenerator (add_colocation_metro), which now only creates the metro's VNI and ASN pools. Every metro joins because the created-trigger fires per kind and would raise on a non-member"  # yamllint disable-line rule:line-length
    - name: colocation_zones
      description: "TopologyColocationZone cages, the kit owners — generator target for ColocationZoneGenerator (add_colocation_zone), which builds the zone's pools, edge pair and firewalls from its fabric_templates. Every zone joins, even one without fabric_templates, because the created-trigger fires per kind and would raise on a non-member"  # yamllint disable-line rule:line-length
    - name: virtual_colocations
      description: "TopologyVirtualColocation provider-hosted presences (Equinix Network Edge, Megaport MCR) — generator target for VirtualColocationGenerator (add_virtual_colocation), which builds the presence's pools and virtual edge devices from its fabric_templates. Every one joins, even one without fabric_templates, because the created-trigger fires per kind and would raise on a non-member"  # yamllint disable-line rule:line-length
    - name: physical_circuits
      description: "TopologyPhysicalCircuit, a pure carrier — generator target for PhysicalCircuitGenerator (add_circuit), which derives its facility locations and builds no session"  # yamllint disable-line rule:line-length
    - name: virtual_circuits
      description: "TopologyInterconnectCircuit and TopologyHandoffCircuit — target of the virtual-circuit session generator, which builds their BGP sessions. TopologyTunnelCircuit is not a member: the SD-WAN orchestrator owns its overlay routing"  # yamllint disable-line rule:line-length
