---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    - name: cores
      description: Core Routers
    - name: linux_devices
      description: Linux Devices
    - name: leafs
      description: All leaf switches
    - name: tors
      description: All ToR switches (VTEP — tor-deployment, connects to spines)
    - name: l2-leafs
      description: All L2-leaf switches (L2-only aggregation — middle_rack/mixed, connects to leafs)
    - name: access-leafs
      description: All access-leaf switches (VXLAN-EVPN VTEP — connects to leafs, not spines)
    - name: border-leafs
      description: All border leafs
    - name: border-spines
      description: All border spines (collapsed spine + border-leaf, micro-fabric pods)
    - name: spines
      description: All spines
    - name: super-spines
      description: All super spines
    - name: hyper-spines
      description: All hyper spines
    - name: firewalls
      description: All firewalls
    - name: loadbalancers
      description: All load balancers
    - name: loadbalancer_devices
      description: Physical devices running load balancer software
    - name: cloud_loadbalancers
      description: All cloud load balancers (AWS/Azure/GCP)
    - name: oobs
      description: All OOB devices
    - name: consoles
      description: All console devices
    - name: edges
      description: All edge devices
    - name: endpoints
      description: All endpoint devices (servers)
    - name: provisioning_circuits
      description: Provisioning Circuits
    - name: topologies_dc
      description: Data Center
    - name: topologies_pod
      description: Data Center Pod
    - name: topologies_rack
      description: Data Center Rack
    - name: topologies_pop
      description: POP Topologies
    - name: topologies_clab
      description: Containerlab Topologies
    - name: equinix_pop
      description: Equinix POPs
    - name: topologies_server
      description: Group for servers in topologies
    - name: virtual_fabrics
      description: Virtual Fabric Customer Deployments
    - name: vxlan_segments
      description: VXLAN Segments (EVPN overlay)
    - name: vrf_namespaces
      description: VRF Namespaces (EVPN L3VNI allocation)
    - name: dci_peering_services
      description: DCI Peering Services (inter-DC BGP peerings)
    - name: physical_circuits
      description: Physical topology circuits (cross-connects, dark fiber, etc.)
    - name: virtual_circuits
      description: Virtual topology circuits (Equinix Fabric, cloud interconnects, etc.)
    - name: cloud_accounts
      description: Cloud accounts (AWS/Azure/GCP) — one Terraform/Pulumi artifact per account
    - name: saas_proxies
      description: SaaS forwarding proxies (Zscaler, Prisma, Netskope, etc.)
    - name: onprem_proxies
      description: On-premises forwarding proxies (Squid, BlueCoat, Cisco WSA, etc.)
    - name: sdwan_edges
      description: VeloCloud SD-WAN branch edge appliances (VCE)
    - name: sdwan_gateways
      description: Arista SD-WAN hub gateways (VCG) deployed at colocation or cloud sites
    - name: sdwan_orchestrators
      description: Arista SD-WAN Orchestrators (VCO) — on-premises or private cloud deployments
    - name: ha_domains
      description: HA domains (firewall + load balancer) — membership tracking only, no generator dispatch
    - name: mlag_domains
      description: MLAG domains — generator target for MLAGWiringGenerator
    - name: loadbalancer_vips
      description: Load balancer VIP services — generator target for LoadbalancerBackendNexthopGenerator
    - name: app_applications
      description: Application instances — generator target for AppApplicationGenerator
    - name: app_components
      description: Application component instances
    - name: app_dependencies
      description: Application dependency edges
    - name: topology_ansible
      description: Customer deployment footprints routed to Ansible-based infrastructure orchestration
    - name: topology_github_actions
      description: Customer deployment footprints routed to GitHub Actions-based infrastructure orchestration
    - name: topology_terraform
      description: Customer deployment footprints routed to Terraform/OpenTofu-based infrastructure orchestration
    - name: topology_argocd
      description: Customer deployment footprints routed to Argo CD-based platform orchestration
    - name: application_ansible
      description: Applications routed to Ansible Automation Platform delivery workflows
    - name: application_github_actions
      description: Applications routed to GitHub Actions delivery workflows
    - name: application_argocd
      description: Applications routed to Argo CD delivery workflows
    - name: customer_deployments
      description: All customer deployment footprints (TopologyCustomerDC/Colocation/Cloud/Office) — generator target for TopologyOrchestratorRoutingGenerator, which queries all 4 kinds in one pass  # yamllint disable-line rule:line-length
    - name: customer_quotations
      description: Customer sizing/pricing requests for QuotationDCGenerator and OfficeQuotationGenerator
    - name: managed_controllers
      description: Management/orchestration controllers (ACI APIC, DCNM, Panorama, Check Point SMS, F5 BIG-IQ, NetScaler-ADM, ...) — target for controller payload artifacts  # yamllint disable-line rule:line-length

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreGeneratorGroup
  data:
    - name: customer_deployments_dc
      description: TopologyCustomerDC footprints — generator target for CustomerDeploymentDCExchangeGenerator
    - name: customer_deployments_colocation
      description: TopologyCustomerColocation footprints — generator target for CustomerDeploymentColocationExchangeGenerator  # yamllint disable-line rule:line-length
    - name: customer_deployments_cloud
      description: TopologyCustomerCloud footprints — generator target for CustomerDeploymentCloudExchangeGenerator
    - name: customer_deployments_office
      description: TopologyCustomerOffice footprints — generator target for CustomerDeploymentOfficeExchangeGenerator
