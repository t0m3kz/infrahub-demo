---
# Arista SD-WAN (formerly VeloCloud) device templates
# VCE-610: branch edge appliance (physical, 1RU)
# VCG-VA_GATEWAY: physical gateway appliance (colocation-hosted)
#
# Interface naming:
#   GE1-GE4  — WAN/LAN copper GigabitEthernet ports on VCE-610
#   eth0     — VCG-VA gateway uplink
#   mgmt0    — out-of-band management
#
# The Gateway is managed BY the Orchestrator (VCO-VA_ORCHESTRATOR,
# ManagedControllerVirtual, controller_type: sdwan_orchestrator — see
# 09_virtual_device_templates_controllers.yaml), not a controller itself: it
# doesn't manage a fleet of anything, it's just the on-ramp appliance edges
# tunnel to. Both VCG-VA_GATEWAY here and its cloud-hosted virtual sibling
# VCG-VA_CLOUD (09_virtual_device_templates_velocloud.yaml) are plain
# Dcim*Device templates for exactly that reason — a previous version of this
# template modelled the physical variant as ManagedControllerPhysical with
# controller_type: sdwan_orchestrator, which was simply wrong (that's the
# Orchestrator's role, and a Gateway/Orchestrator pair collapsed into one
# device is not this project's SD-WAN architecture). The SD-WAN overlay
# (DMPO sessions) is orchestrated automatically by the VCO — no tunnel
# interfaces are modelled on either the Edge or the Gateway here.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPhysicalDevice
  data:
    # -------------------------------------------------------------------------
    # VCE-610 — Branch Edge (WAN uplinks + LAN downlinks)
    # GE1: primary WAN, GE2: secondary WAN, GE3-GE4: LAN
    # -------------------------------------------------------------------------
    - template_name: VCE-610_EDGE
      owner: "P027"
      device_type: VCE-610
      platform: velocloud
      software_image: velocloud-6.0.0
      role: edge
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: VCE-610_EDGE_GE1
            name: GE1
            role: uplink
            interface_type: 1000base-t
          - template_name: VCE-610_EDGE_GE2
            name: GE2
            role: uplink
            interface_type: 1000base-t
          - template_name: VCE-610_EDGE_GE3
            name: GE3
            role: downlink
            interface_type: 1000base-t
          - template_name: VCE-610_EDGE_GE4
            name: GE4
            role: downlink
            interface_type: 1000base-t
          - template_name: VCE-610_EDGE_mgmt0
            name: mgmt0
            role: management
            interface_type: 1000base-t

    # -------------------------------------------------------------------------
    # VCG-VA — physical Gateway appliance hosted at a colocation PoP
    # (height=0, no rack slot — same device_type as the cloud-hosted virtual
    # VCG-VA_CLOUD in 09_virtual_device_templates_velocloud.yaml, just
    # deployed on physical hardware at a colo instead of a cloud VM).
    # -------------------------------------------------------------------------
    - template_name: VCG-VA_GATEWAY
      owner: "P027"
      device_type: VCG-VA
      platform: velocloud
      software_image: velocloud-6.0.0
      role: edge
      status: provisioning
      interfaces:
        kind: TemplateDcimPhysicalInterface
        data:
          - template_name: VCG-VA_GATEWAY_eth0
            name: eth0
            role: uplink
            interface_type: 1000base-t
      member_of_groups:
        - sdwan_gateways
