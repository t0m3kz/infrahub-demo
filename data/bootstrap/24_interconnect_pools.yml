---
# Pools consumed by generators/topology/interconnect.py's
# InterconnectRequestGenerator for connection_kind=virtual legs. Disjoint
# from GLOBAL-L3VNI (50001-59999, data/bootstrap/18_vni_pools.yml) and from
# the PROD/NON-PROD/INTERNET/MANAGEMENT l3_vni values (30000-40001,
# data/bootstrap/22_namespaces.yml) — this is WAN/interconnect-scoped, never
# widened into either of those.
#
# GRE-key allocation is scoped to link_type=gre only (a GRE key just needs
# local uniqueness, so this range is a reasonable simplification, not a
# protocol requirement). vpn_ipsec/vpn_ssl get no pool allocation at all —
# IPsec SPI is IKE-negotiated, SSL VPN has no wire-level numeric ID, so
# pretending otherwise would mislead anyone mapping this onto real config.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: GLOBAL-INTERCONNECT-VNI
      description: VNI pool for auto-generated TopologyVirtualCircuit link_type=vxlan legs
      node: TopologyVirtualCircuit
      node_attribute: vni
      start_range: 100000
      end_range: 109999
    - name: GLOBAL-INTERCONNECT-GRE-KEY
      description: GRE key pool for auto-generated TopologyVirtualCircuit link_type=gre legs
      node: TopologyVirtualCircuit
      node_attribute: tunnel_id
      start_range: 1
      end_range: 65535
