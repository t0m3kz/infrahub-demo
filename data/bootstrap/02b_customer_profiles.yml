---
# T-shirt-sized customer deployment profiles — sizing/policy defaults used to
# board a customer onto DC/colocation infrastructure. Referenced by
# OrganizationCustomer.profile (see 03_clients.yml). Must load before
# 03_clients.yml so customers can reference these by name/HFID.

apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationProfile
  data:
    - name: "Starter"
      description: "Single-environment pilot — minimal footprint"
      tier: small
      allowed_environments: ["p"]
      global_subnet_size: 26
      max_network_segments: 2

    - name: "Standard"
      description: "Production + non-production"
      tier: medium
      allowed_environments: ["p", "n"]
      global_subnet_size: 24
      max_network_segments: 4

    - name: "Business"
      description: "Full environment spread"
      tier: large
      allowed_environments: ["p", "n", "s", "d"]
      global_subnet_size: 22
      max_network_segments: 8

    - name: "Enterprise"
      description: "Maximum sizing — all environments, large segment footprint"
      tier: xlarge
      allowed_environments: ["p", "n", "s", "d", "t"]
      global_subnet_size: 20
      max_network_segments: 16
