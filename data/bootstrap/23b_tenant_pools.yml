---
# Per-VRF tenant segment pools: add_vxlan_segment (generators/topology/segment.py)
# allocates every gateway-less VXLAN tenant segment one /24 from the pool of
# its environment's routing domain (`p` -> PROD, every other value -> NONPROD),
# keyed by the segment name, and puts the anycast gateway on .1. A segment
# whose gateway is authored keeps it.
#
# Same shape as 23_transit_pools.yml: every pool and resource prefix uses
# built-in default IPAM. The pool name selects the segment's routing domain;
# there is no dependency on the later zone declarations.
#
# Two disjoint /13s, so a tenant prefix is unique across both VRFs as well as
# within one: 10.176.0.0/13 PROD, 10.184.0.0/13 NONPROD (2048 /24s each).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Tenant-PROD-IPv4
      description: "Tenant segment /24s in the PROD VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 24
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.176.0.0/13
            description: "Tenant segment space, PROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: customer
            ip_namespace: "default"
      ip_namespace: "default"

    - name: Tenant-NONPROD-IPv4
      description: "Tenant segment /24s in the NONPROD VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 24
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.184.0.0/13
            description: "Tenant segment space, NONPROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: customer
            ip_namespace: "default"
      ip_namespace: "default"
