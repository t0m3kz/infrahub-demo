---
# Per-VRF tenant pools: the supernets the customers' own prefix pools are carved from.
# add_vxlan_segment (generators/topology/segment_addressing.py) addresses every gateway-less
# VXLAN tenant segment out of its customer's pool ({org_id}-{environment}-{dc|colocation}-ipv4,
# created by the customer's first segment request from a block of its design's
# address_prefix_length, grown by another block when it runs out), keyed by the segment name,
# a /24 unless the segment states a host_count, and puts the anycast gateway on .1. The
# environment's routing domain (`p` -> PROD, every other value -> NONPROD) picks the pool
# here. A segment of an office has no design and takes its /24 from this pool directly.
# A segment whose gateway is authored keeps it.
#
# Same shape as 23_transit_pools.yml: every pool and resource prefix uses
# built-in default IPAM. The pool name selects the segment's routing domain;
# there is no dependency on the later zone declarations.
#
# Two disjoint /13s, so a tenant prefix is unique across both VRFs as well as
# within one: 10.176.0.0/13 PROD, 10.184.0.0/13 NONPROD (2048 /24s each).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Tenant-PROD-IPv4
      description: "Tenant segment /24s in the PROD VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 24
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.176.0.0/13
            description: "Tenant segment space, PROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: customer
            ip_namespace: "default"
      ip_namespace: "default"

    - name: Tenant-NONPROD-IPv4
      description: "Tenant segment /24s in the NONPROD VRF"
      default_prefix_type: IpamPrefix
      default_prefix_length: 24
      resources:
        kind: IpamPrefix
        data:
          - prefix: 10.184.0.0/13
            description: "Tenant segment space, NONPROD VRF"
            status: active
            member_type: prefix
            is_pool: true
            role: customer
            ip_namespace: "default"
      ip_namespace: "default"
