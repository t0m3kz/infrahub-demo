---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimVirtualDevice
  data:
    # Dedicated per-customer instances, one per sizing tier, hosted on the
    # DC's physical pair when a customer's design asks for dedicated_firewall
    # / dedicated_loadbalancer (generators/firewall_context.py).
    - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_S
      owner: "P027"
      device_type: BIG-IP-VE
      role: load-balancer
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      status: active
      cpu: 2
      memory: 8
      storage: 60
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_S_mgmt
            name: mgmt
            role: management
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_S_eth[1-4]
            name: eth[1-4]
            role: customer
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_S_ha
            name: ha
            role: ha
    - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_M
      owner: "P027"
      device_type: BIG-IP-VE
      role: load-balancer
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      status: active
      cpu: 4
      memory: 16
      storage: 120
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_M_mgmt
            name: mgmt
            role: management
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_M_eth[1-4]
            name: eth[1-4]
            role: customer
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_M_ha
            name: ha
            role: ha
    - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_L
      owner: "P027"
      device_type: BIG-IP-VE
      role: load-balancer
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      status: active
      cpu: 8
      memory: 32
      storage: 240
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_L_mgmt
            name: mgmt
            role: management
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_L_eth[1-4]
            name: eth[1-4]
            role: customer
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_L_ha
            name: ha
            role: ha
    - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_XL
      owner: "P027"
      device_type: BIG-IP-VE
      role: load-balancer
      platform: f5_tmos
      software_image: f5_tmos-17.1.1
      status: active
      cpu: 16
      memory: 64
      storage: 480
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_XL_mgmt
            name: mgmt
            role: management
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_XL_eth[1-4]
            name: eth[1-4]
            role: customer
          - template_name: BIG-IP-VE_LOAD_BALANCER_CUSTOMER_XL_ha
            name: ha
            role: ha
