---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimVirtualDevice
  data:
    - template_name: C8000V_EDGE
      owner: "P027"
      device_type: C8000V
      role: edge
      platform: cisco_xe
      software_image: cisco_xe-17.12.4
      status: active
      cpu: 2
      memory: 8
      storage: 100
      # How Equinix Network Edge orders this instance (read by the virtual colocation Terraform
      # artifact, transforms/colocation/virtual_colocation.py). DEMO VALUES: not verified against
      # the Equinix API, check type/package/version/term in the Equinix portal before applying.
      provider_type_code: C8000V
      provider_package_code: network-essentials
      provider_version: 17.12.01a
      provider_term_length: 12
      interfaces:
        kind: TemplateDcimPhysicalInterface
        parameters:
          expand_range: true
        data:
          - template_name: C8000V_EDGE_Ethernet1/[1-24]
            name: Ethernet1/[1-24]
            role: customer
          - template_name: C8000V_EDGE_mgmt0
            name: mgmt0
            role: management
