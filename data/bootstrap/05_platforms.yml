---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPlatform
  data:
    - name: cisco_ios
      containerlab_os: ios

    - name: cisco_xr
      containerlab_os: cisco_xrv

    - name: cisco_xe
      containerlab_os: cisco_xrv

    - name: cisco_nxos
      containerlab_os: cisco_n9kv

    - name: dell_sonic
      containerlab_os: linux

    - name: juniper_junos
      containerlab_os: juniper_vjunosswitch

    - name: arista_eos
      containerlab_os: ceos

    - name: sonic
      containerlab_os: sonic-vm

    - name: linux
      containerlab_os: linux

    - name: checkpoint_gaia
      containerlab_os: gaia

    - name: netscaler
      containerlab_os: netscaler

    - name: haproxy_technologies
      containerlab_os: linux

    - name: f5_tmos
      containerlab_os: linux

    - name: paloalto_panos
      containerlab_os: linux

    # Zscaler Enforcement Node: a SaaS region's hosted function (a CloudNetworkAppliance stub, role provider,
    # nothing is rendered for it), so it has no config template.
    - name: zscaler_zen
      containerlab_os: linux

    # The software of a cluster (ManagedCluster.software_image): hypervisors and Kubernetes distributions. Nothing is
    # rendered for them, so they have no config template.
    - name: vsphere
      description: "VMware vSphere (ESXi and vCenter)"
    - name: proxmox
      description: "Proxmox VE"
    - name: nutanix
      description: "Nutanix AHV"
    - name: rke2
      description: "Rancher RKE2 (on-prem Kubernetes)"
    - name: eks
      description: "Amazon EKS (managed Kubernetes)"
    - name: aks
      description: "Azure AKS (managed Kubernetes)"
