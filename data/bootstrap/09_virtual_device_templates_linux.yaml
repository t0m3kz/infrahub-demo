---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimVirtualDevice
  data:
    - template_name: NGINX
      owner: P027
      device_type: NGINX
      platform: linux
      software_image: linux-22.04.3
      role: load-balancer
      status: active
      cpu: 2
      memory: 2
      interfaces:
        kind: TemplateDcimVirtualInterface
        data:
          - template_name: NGINX_private
            name: private
            role: management
    - template_name: LINUX-SVC
      owner: P027
      device_type: LINUX-SVC
      platform: linux
      software_image: linux-22.04.3
      role: endpoint
      status: active
      cpu: 2
      memory: 4
      interfaces:
        kind: TemplateDcimVirtualInterface
        data:
          - template_name: LINUX-SVC_eth0
            name: eth0
            role: uplink
