---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimVirtualDevice
  data:
    - template_name: HA-PROXY
      device_type: HA-PROXY
      platform: linux
      software_image: linux-22.04.3
      role: load-balancer
      status: active
      cpu: 2
      memory: 2
      interfaces:
        kind: TemplateDcimVirtualInterface
        data:
          - template_name: HA-PROXY_LOAD-BALANCER_private
            name: private
            role: management
    - template_name: NGINX
      device_type: NGINX
      platform: linux
      software_image: linux-22.04.3
      role: load-balancer
      status: active
      cpu: 2
      memory: 2
      interfaces:
        kind: TemplateDcimVirtualInterface
        data:
          - template_name: NGINX_LOAD-BALANCER_private
            name: private
            role: management
