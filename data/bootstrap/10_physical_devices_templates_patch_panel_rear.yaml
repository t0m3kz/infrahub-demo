---
# Passive patch panel templates, part 1 of 2: the REAR ports (schemas/extensions/dcim/patch_panel.yml). A panel is
# DcimPatchPanel, not a device. Part 2 (10_physical_devices_templates_patch_panel_front.yaml) adds the FRONT ports to
# the same templates, so a panel created with `object_template:` gets both lists on its page. A template carries the
# ports but not the pairing of a front port with its rear port: an object template copies an attribute relationship as
# it is and cannot point at a sibling. The pairing is a data file next to the panel (a ranged front block with a ranged
# `rear_port`), and tests/unit/test_patch_panel_data.py pins that every demo front port is paired.
#
#   PP-24-LC, PP-48-LC   N jacks, LC/UPC
#   PP-12-SC             12 jacks, SC/UPC
#   PP-24-RJ45           24 jacks, RJ45
#   PP-CASSETTE-MPO12    4 cassettes: a rear MPO-12 port each, 12 LC/UPC front ports each (48 LC in 1U)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimPatchPanel
  data:
    - template_name: PP-24-LC
      description: "24-jack fibre patch panel, LC/UPC"
      rear_ports:
        kind: TemplateDcimRearPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: "PP-24-LC_rear_[1-24]"
            name: "[1-24]"
            connector: lc-upc

    - template_name: PP-48-LC
      description: "48-jack fibre patch panel, LC/UPC"
      rear_ports:
        kind: TemplateDcimRearPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: "PP-48-LC_rear_[1-48]"
            name: "[1-48]"
            connector: lc-upc

    - template_name: PP-12-SC
      description: "12-jack fibre patch panel, SC/UPC"
      rear_ports:
        kind: TemplateDcimRearPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: "PP-12-SC_rear_[1-12]"
            name: "[1-12]"
            connector: sc-upc

    - template_name: PP-24-RJ45
      description: "24-jack copper patch panel, RJ45"
      rear_ports:
        kind: TemplateDcimRearPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: "PP-24-RJ45_rear_[1-24]"
            name: "[1-24]"
            connector: rj45

    - template_name: PP-CASSETTE-MPO12
      description: "4-cassette fibre enclosure: a rear MPO-12 per cassette, 12 LC/UPC front ports each"
      rear_ports:
        kind: TemplateDcimRearPatchPanelPort
        parameters:
          expand_range: true
        data:
          - template_name: "PP-CASSETTE-MPO12_rear_[1-4]"
            name: "[1-4]"
            connector: mpo-12
