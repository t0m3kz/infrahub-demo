---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TopologyElement
  data:
    # Cisco Middle Rack Leafs
    - quantity: 2
      role: leaf
      template: N9K-C9336C-FX2_LEAF_MR
    # Reference-fabric variant (GX, NX-OS 10.6(3)F): DC10
    - quantity: 2
      role: leaf
      template: N9K-C9364C-GX_LEAF_MR

    # Cisco ToR (VTEP — tor-deployment, connects directly to spines)
    - quantity: 2
      role: tor
      template: N9K-C9336C-FX2_TOR
    # 25G access-leaf — the customer ports match the server templates' NICs, so
    # this is the element to pick for a rack that has endpoints cabled to it.
    - quantity: 2
      role: access-leaf
      template: N9K-C93180YC-EX_ACCESS
    # Reference-fabric variant (FX3, NX-OS 10.6(3)F): DC10
    - quantity: 2
      role: access-leaf
      template: N9K-C93180YC-FX3_ACCESS
    # Cisco L2-Leaf (L2-only — middle_rack/mixed deployments, connects to leafs)
    - quantity: 2
      role: l2-leaf
      template: N9K-C9336C-FX2_TOR

    # Cisco Edge
    - quantity: 2
      role: edge
      template: N9K-C9316D-GX_EDGE
    # ... and its virtual counterpart, for a virtual colocation
    # (data/demos/10_colocation/equinix/am, AM-NE) — a
    # provider-hosted instance we rent rather than hardware we rack, so the
    # template is a TemplateDcimVirtualDevice and the generator builds
    # DcimVirtualDevices from it.
    - quantity: 2
      role: edge
      template: C8000V_EDGE
    # Catalyst 9000 office fabric (cisco_xe): the distribution pair is the LISP site's
    # border and control plane, the access pair its fabric edge
    # (TopologyCustomerOffice.fabric_templates, generators/topology/office_fabric.py).
    - quantity: 2
      role: distribution-switch
      template: C9500-32C_DISTRIBUTION
    - quantity: 2
      role: access-switch
      template: C9300-48UXM_ACCESS_SWITCH

    # Arista Middle Rack Leafs
    - quantity: 2
      role: leaf
      template: DCS-7050CX3-32C-R_LEAF_MR
    - quantity: 8
      role: leaf
      template: DCS-7050CX3-32C-R_LEAF_MR
    # Arista Mixed Rack Leafs
    - quantity: 2
      role: leaf
      template: DCS-7050CX3-32C-R_LEAF_MIXED
    # Arista ToRs (VTEP — tor-deployment)
    - quantity: 2
      role: tor
      template: DCS-7050CX3-32C-R_TOR
    # Arista L2-Leafs (L2-only — middle_rack/mixed deployments)
    - quantity: 2
      role: l2-leaf
      template: DCS-7050CX3-32C-R_TOR

    # Dell Middle Rack Leafs
    - quantity: 2
      role: leaf
      template: PowerSwitch-S5232F-ON_LEAF_MR

    # Dell ToRs (VTEP — tor-deployment)
    - quantity: 2
      role: tor
      template: PowerSwitch-S5224F-ON_TOR
    # Dell L2-Leafs (L2-only — middle_rack/mixed deployments)
    - quantity: 2
      role: l2-leaf
      template: PowerSwitch-S5224F-ON_TOR
    - quantity: 4
      role: l2-leaf
      template: PowerSwitch-S5224F-ON_TOR

    # Edgecore Leafs
    - quantity: 2
      role: leaf
      template: Edgecore-7726-32X-O_LEAF_MR
    # Edgecore L2-Leaf (L2-only — middle_rack/mixed deployments)
    - quantity: 2
      role: l2-leaf
      template: Edgecore-7AS7326-56X-O-48V-F_TOR

    # Spines (DC/Pod-level fabric_templates)
    - quantity: 2
      role: spine
      template: N9K-C9336C-FX2_SPINE
    - quantity: 2
      role: spine
      template: N9K-C9364C-GX_SPINE
    - quantity: 2
      role: spine
      template: DCS-7050CX3-32C-R_SPINE
    - quantity: 4
      role: spine
      template: DCS-7050CX3-32C-R_SPINE
    - quantity: 2
      role: spine
      template: PowerSwitch-S5232F-ON_SPINE

    # Edgecore Spines
    - quantity: 2
      role: spine
      template: Edgecore-7726-32X-O_SPINE

    # Super-Spines (DC-level fabric_templates)
    - quantity: 2
      role: super-spine
      template: N9K-C9336C-FX2_SUPER_SPINE
    - quantity: 4
      role: super-spine
      template: DCS-7050CX3-32C-R_SUPER_SPINE

    # Dell Super-Spines
    - quantity: 4
      role: super-spine
      template: PowerSwitch-S5232F-ON_SUPER_SPINE

    # Hyper-Spines (DC-level fabric_templates, XL fabrics only — see
    # TopologyDataCenterDesign "XL_EBGP_EBGP" and role: hyper-spine)
    - quantity: 2
      role: hyper-spine
      template: DCS-7050CX3-32C-R_HYPER_SPINE

    # Border Leafs (DC-level fabric_templates)
    - quantity: 2
      role: border-leaf
      template: N9K-C9336C-FX2_BORDER_LEAF
    # Reference-fabric variant (GX, NX-OS 10.6(3)F): DC10
    - quantity: 2
      role: border-leaf
      template: N9K-C9364C-GX_BORDER_LEAF
    - quantity: 2
      role: border-leaf
      template: DCS-7050CX3-32C-R_BORDER_LEAF
    - quantity: 2
      role: border-leaf
      template: PowerSwitch-S5232F-ON_BORDER_LEAF

    # Border Spines (collapsed spine + border-leaf, pod-level fabric_templates
    # in border-spine micro-fabrics — see TopologyPodDesign "S_BORDER_SPINE_POD")
    - quantity: 2
      role: border-spine
      template: DCS-7050CX3-32C-R_BORDER_SPINE

    # Border-leaf-attached firewalls (DC-level fabric_templates)
    - quantity: 2
      role: firewall
      template: CP-26000_FIREWALL
    - quantity: 2
      role: firewall
      template: PA-5260_FIREWALL

    # Border-leaf-attached load-balancers (DC-level fabric_templates)
    - quantity: 2
      role: load-balancer
      template: BIG-IP-i5800_LOAD_BALANCER
    - quantity: 2
      role: load-balancer
      template: NetScaler-MPX-26000-100G_LOAD_BALANCER
