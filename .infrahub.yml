  - name: add_app_application
    file_path: generators/topology/application_security.py
    targets: app_applications
    query: application
    class_name: AppApplicationGenerator
    execute_in_proposed_change: false
    execute_after_merge: false
    parameters:
      name: name__value
    watch:
      files:
        - generators/
        - utils/
        # Read at run time by the VIP producer (generators/lb_vip.py).
        - queries/topology/add/lb_segment_gateways.gql
        - queries/topology/add/lb_serving_contexts.gql
  # Same generator, entered from a dependency: the application trigger fires
  # before the dependencies of a freshly loaded application exist, and a
  # dependency added later changes no AppApplication at all. It only fans out
  # add_app_application to the affected application and writes nothing.
  - name: add_app_dependency
    file_path: generators/topology/application_security.py
    targets: app_dependencies
    query: app_dependency
    class_name: AppApplicationGenerator
    execute_in_proposed_change: false
    execute_after_merge: false
    parameters:
      name: name__value
    watch:
      files:
        - generators/
        - utils/
  # Same generator, entered from a component that moved to another segment,
  # changed its ports or instances, or turned load_balanced (or back): it
  # fans out add_app_application to its own application and every
  # application calling the component, and writes nothing itself (only
  # add_app_application owns an application's rules).
  - name: add_app_component
    file_path: generators/topology/application_security.py
    targets: app_components
    query: app_component
    class_name: AppApplicationGenerator
    execute_in_proposed_change: false
    execute_after_merge: false
    parameters:
      fqdn: fqdn__value
    watch:
      files:
        - generators/
        - utils/
  # Same target group as add_app_component, different concern: tags the
  # switch interface(s) this component's instances are cabled to with its
  # network_segment — see generators/topology/app_instance_segment.py.
  - name: add_app_component_segment
    file_path: generators/topology/app_instance_segment.py
    targets: app_components
