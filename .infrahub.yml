---
jinja2_transforms:
  # Containerlab
  - name: topology_clab
    description: Template to generate a containerlab topology
    query: topology_simulator
    template_path: templates/clab_topology.j2
    watch:
      files: []

artifact_definitions:
  - name: edge_config
    artifact_name: edge
    content_type: text/plain
    targets: edges
    transformation: edge
    parameters:
      device: name__value
  - name: leaf_config
    artifact_name: leaf
    content_type: text/plain
    targets: leafs
    transformation: leaf
    parameters:
      device: name__value
  - name: borderleaf_config
    artifact_name: border-leaf
    content_type: text/plain
    targets: border-leafs
    transformation: border_leaf
    parameters:
      device: name__value
  - name: borderspine_config
    artifact_name: border-spine
    content_type: text/plain
    targets: border-spines
    transformation: border_spine
    parameters:
      device: name__value
  - name: tor_config
    artifact_name: tor
    content_type: text/plain
    targets: tors
    transformation: tor
    parameters:
      device: name__value
  - name: l2_leaf_config
    artifact_name: l2-leaf
    content_type: text/plain
    targets: l2-leafs
    transformation: l2_leaf
    parameters:
      device: name__value
  - name: access_leaf_config
    artifact_name: access-leaf
    content_type: text/plain
    targets: access-leafs
    transformation: access_leaf
    parameters:
      device: name__value
  - name: access_switch_config
    artifact_name: access-switch
    content_type: text/plain
    targets: access-switches
    transformation: access_switch
    parameters:
      device: name__value
  - name: distribution_switch_config
    artifact_name: distribution-switch
    content_type: text/plain
    targets: distribution-switches
    transformation: distribution_switch
    parameters:
      device: name__value
  - name: spine_config
    artifact_name: spine
    content_type: text/plain
    targets: spines
    transformation: spine
    parameters:
      device: name__value
  - name: super_spine_config
    artifact_name: super-spine
    content_type: text/plain
    targets: super-spines
    transformation: super_spine
    parameters:
      device: name__value
  - name: hyper_spine_config
    artifact_name: hyper-spine
    content_type: text/plain
    targets: hyper-spines
    transformation: super_spine
    parameters:
      device: name__value
  - name: loadbalancer_config
    artifact_name: loadbalancer
    content_type: text/plain
    targets: loadbalancers
    transformation: loadbalancer
    parameters:
      device: name__value
  - name: proxy_config
    artifact_name: proxy
    content_type: text/plain
    targets: onprem_proxies
    transformation: proxy
    parameters:
      device: name__value
  - name: proxy_cloud_config
    artifact_name: proxy-cloud-policy
    content_type: application/json
    targets: saas_proxies
    transformation: proxy-cloud
    parameters:
      instance: name__value
  # Cloud Load Balancer Terraform HCL
  - name: cloud_lb_terraform
    artifact_name: terraform-vars
    content_type: text/plain
    targets: cloud_loadbalancers
    transformation: loadbalancer-cloud
    parameters:
      instance: name__value
  # Containerlab
  - name: Containerlab Topology
    artifact_name: containerlab-topology
    content_type: text/plain
    targets: topologies_clab
    transformation: topology_clab
    parameters:
      name: name__value

  - name: Cable matrix for DC
    artifact_name: topology-cabling
    content_type: text/csv
    targets: topologies_dc
    transformation: topology_cabling
    parameters:
      id: id

  # Equinix POP
  - name: equinix_pop_config
    artifact_name: equinix_pop
    content_type: text/plain
    targets: equinix_pop
    transformation: equinix_pop
    parameters:
      name: name__value
  - name: firewall_config
    artifact_name: firewall
    content_type: text/plain
    targets: firewalls
    transformation: firewall
    parameters:
      device: name__value
  # Controller payload — one artifact_definition for every ManagedController
  # in managed_controllers; controller_type/vendor are passed alongside the
  # object's own name so the transform can dispatch to the right vendor
  # builder without any per-controller querying/matching in Python.
  - name: controller_payload
    artifact_name: controller-payload
    content_type: application/json
    targets: managed_controllers
    transformation: controller-payload
    parameters:
      controller: name__value
      controller_type: controller_type__value
      vendor: platform__name__value
  # - name: rack_elevation
  #   artifact_name: rack_elevation
  #   content_type: image/svg+xml
  #   targets: topologies_rack
  #   transformation: rack_elevation
  #   parameters:
  #     name: name__value
  - name: cloud_vpc_terraform
    artifact_name: vpc-terraform
    content_type: text/plain
    targets: cloud_accounts
    transformation: cloud-vpc-terraform
    parameters:
      account: name__value
  # One Equinix Network Edge Terraform file per virtual colocation routed to
  # terraform (infrastructure_orchestrator): the virtual_colocation_terraform
  # group. Not topology_terraform (a customer footprint's tfvars).
  - name: virtual_colocation_terraform
    artifact_name: terraform
    content_type: text/plain
    targets: virtual_colocation_terraform
    transformation: virtual-colocation-terraform
    parameters:
      instance: name__value
  - name: topology_orchestrator_ansible_inventory
    artifact_name: ansible-inventory
    content_type: text/plain
    targets: topology_ansible
    transformation: topology-orchestrator-ansible
    parameters:
      name: name__value
  - name: topology_orchestrator_terraform_vars
    artifact_name: terraform-vars
    content_type: text/plain
    targets: topology_terraform
    transformation: topology-orchestrator-terraform
    parameters:
      name: name__value
  - name: topology_orchestrator_argocd_manifest
    artifact_name: argocd-application
    content_type: application/json
    targets: topology_argocd
    transformation: topology-orchestrator-argocd
    parameters:
      name: name__value
  - name: topology_orchestrator_github_actions_dispatch
    artifact_name: github-actions-dispatch
    content_type: application/json
    targets: topology_github_actions
    transformation: topology-orchestrator-github-actions
    parameters:
      name: name__value
  - name: application_orchestrator_ansible_inventory
    artifact_name: ansible-inventory
    content_type: text/plain
    targets: application_ansible
    transformation: application-orchestrator-ansible
    parameters:
      name: name__value
  - name: application_orchestrator_argocd_manifest
    artifact_name: argocd-application
    content_type: application/json
    targets: application_argocd
    transformation: application-orchestrator-argocd
    parameters:
      name: name__value
  - name: application_orchestrator_github_actions_dispatch
    artifact_name: github-actions-dispatch
    content_type: application/json
    targets: application_github_actions
    transformation: application-orchestrator-github-actions
    parameters:
      name: name__value

check_definitions:
  - name: validate_spine
    class_name: CheckSpine
    file_path: checks/spine.py
    targets: spines
    parameters:
      device: name__value
  - name: validate_leaf
    class_name: CheckLeaf
    file_path: checks/leaf.py
    targets: leafs
    parameters:
      device: name__value
  - name: validate_edge
    class_name: CheckEdge
    file_path: checks/edge.py
    targets: edges
    parameters:
      device: name__value
  - name: validate_loadbalancer
    class_name: CheckLoadBalancer
    file_path: checks/loadbalancer.py
    targets: loadbalancers
    parameters:
      device: name__value
  - name: validate_proxy
    class_name: CheckProxy
    file_path: checks/proxy.py
    targets: onprem_proxies
    parameters:
      device: name__value
  - name: validate_tor
    class_name: CheckToR
    file_path: checks/tor.py
    targets: tors
    parameters:
      device: name__value
  - name: validate_access_leaf
    class_name: CheckAccessLeaf
    file_path: checks/access_leaf.py
    targets: access-leafs
    parameters:
      device: name__value
  - name: validate_border_leaf
    class_name: CheckBorderLeaf
    file_path: checks/border_leaf.py
    targets: border-leafs
    parameters:
      device: name__value
  - name: validate_border_spine
    class_name: CheckBorderSpine
    file_path: checks/border_spine.py
    targets: border-spines
    parameters:
      device: name__value
  - name: validate_super_spine
    class_name: CheckSuperSpine
    file_path: checks/super_spine.py
    targets: super-spines
    parameters:
      device: name__value
  - name: validate_firewall
    class_name: CheckFirewall
    file_path: checks/firewall.py
    targets: firewalls
    parameters:
      device: name__value
  - name: validate_sdwan_orchestrator
    class_name: CheckSdwanOrchestrator
    file_path: checks/sdwan.py
    targets: sdwan_orchestrators
    parameters:
      controller: name__value
  - name: validate_segment_placement
    class_name: CheckSegmentPlacement
    file_path: checks/segment_placement.py
  - name: validate_segment_security
    class_name: CheckSegmentSecurity
    file_path: checks/segment_security.py
  # Targetless: a footprint's usage spans every segment naming it and every
  # port those segments tag, not one device.
  - name: validate_customer_quota
    class_name: CheckCustomerQuota
    file_path: checks/customer_quota.py
  # Targetless: reads every segment and the firewall contexts PBR redirects to.
  - name: validate_tenant_svi_protection
    class_name: CheckTenantSviProtection
    file_path: checks/tenant_svi_protection.py
  # Targetless: a context's carrier is a border or edge port, not the leaf.
  - name: validate_pbr_firewall_reachability
    class_name: CheckPbrFirewallReachability
    file_path: checks/pbr_firewall_reachability.py
  # Targetless: a segment's sites and a site's VTEPs span the fleet; a data
  # center is a reference fabric only when every one of its VTEPs is.
  - name: validate_reference_fabric
    class_name: CheckReferenceFabric
    file_path: checks/reference_fabric.py
  # Targetless: a tag is unique across all customers or all segments, and a
  # customer owns segments of many topologies.
  - name: validate_routing_tags
    class_name: CheckRoutingTags
    file_path: checks/routing_tags.py
  # Targetless: the invariants span topologies (namespaces, the INTERNET VRF,
  # cloud Transit Gateways and virtual interfaces), not one device.
  - name: validate_routing_invariants
    class_name: CheckRoutingInvariants
    file_path: checks/routing_invariants.py
  # Targetless like the two above: the invariants are properties of a whole
  # fabric (route-target agreement, VNI uniqueness), so there is no single
  # device to target — every device in the fabric looks correct in isolation.
  - name: validate_evpn_fabric
    class_name: CheckEvpnFabric
    file_path: checks/evpn_fabric.py
  # Targetless: the LISP profile of an office (platform, map-server, site key,
  # segment VRFs, WAN exit) is a property of a whole site, not of one device.
  - name: validate_lisp_fabric
    class_name: CheckLispFabric
    file_path: checks/lisp_fabric.py
  # Targetless: a port is shared between circuits, so the rule spans every
  # physical circuit, not one device or one circuit.
  - name: validate_physical_circuit_ports
    class_name: CheckPhysicalCircuitPorts
    file_path: checks/physical_circuit_ports.py
  # Targetless: the rules span the carriers found on a virtual circuit's
  # ports, so one query reads every physical circuit and every Tunnel,
  # Interconnect and Handoff circuit.
  - name: validate_circuit_placement
    class_name: CheckCircuitPlacement
    file_path: checks/circuit_placement.py
  # Targetless: a pod's design is judged against every suite hosting a rack of
  # it, so one query reads every rack with its suite and its pod's design.
  - name: validate_suite_capacity
    class_name: CheckSuiteCapacity
    file_path: checks/suite_capacity.py
  # Targetless: a name must be unique across metros, zones and virtual
  # colocations, and a footprint's serving zone is judged against its metro.
  - name: validate_colocation_placement
    class_name: CheckColocationPlacement
    file_path: checks/colocation_placement.py
  # Targetless: a dependency spans two applications, and an external target
  # is no object at all.
  - name: validate_app_dependency
    class_name: CheckAppDependency
    file_path: checks/app_dependency.py
  # Targetless: the rule is per hypervisor, and a host's VMs belong to many
  # customers' footprints.
  - name: validate_hypervisor_environment
    class_name: CheckHypervisorEnvironment
    file_path: checks/hypervisor_environment.py
  # Targetless: the rule is per virtual device and per network appliance, wherever it is deployed.
  - name: validate_virtual_device_placement
    class_name: CheckVirtualDevicePlacement
    file_path: checks/virtual_device_placement.py
  # Targetless: the rule is per NIC of every hosted virtual device.
  - name: validate_virtual_nic_pinning
    class_name: CheckVirtualNicPinning
    file_path: checks/virtual_nic_pinning.py
  # Targetless: the rule is per port carrying an infrastructure VLAN.
  - name: validate_vlan_domain_membership
    class_name: CheckVlanDomainMembership
    file_path: checks/vlan_domain_membership.py
  # Targetless: a rule's source segment spans footprints, and the hardware that
  # enforces it (firewall pair, legs, exchange, ports, SNAT) belongs to the
  # contexts serving them.
  - name: validate_internet_egress
    class_name: CheckInternetEgress
    file_path: checks/internet_egress.py
  # Targetless: a DC pool holds its pods' pools, so one query reads every
  # data center and pod with the slices of their pools.
  - name: validate_pool_utilization
    class_name: CheckPoolUtilization
    file_path: checks/pool_utilization.py

