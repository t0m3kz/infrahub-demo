---
apiVersion: v1
kind: Namespace
metadata:
  name: infrahub-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-bridge
  namespace: infrahub-system
---
# RBAC: bridge needs to patch annotations on XRs across all claim namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-bridge
rules:
  - apiGroups:
      - fcp.allianz.io
      - egress.composite.app-gateway.allianz.io
      - ingress.composite.app-gateway.allianz.io
      - platform.foundation.allianz.io
    resources: ["*"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-bridge
subjects:
  - kind: ServiceAccount
    name: crossplane-bridge
    namespace: infrahub-system
---
apiVersion: v1
kind: Secret
metadata:
  name: crossplane-bridge-config
  namespace: infrahub-system
type: Opaque
stringData:
  INFRAHUB_API_TOKEN: "change-me"
  SERVICENOW_URL: ""
  SERVICENOW_USER: ""
  SERVICENOW_PASS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-bridge
  namespace: infrahub-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crossplane-bridge
  template:
    metadata:
      labels:
        app: crossplane-bridge
    spec:
      serviceAccountName: crossplane-bridge
      containers:
        - name: bridge
          image: crossplane-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: INFRAHUB_URL
              value: "http://infrahub-server.infrahub-system.svc:8000"
            - name: INFRAHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crossplane-bridge-config
                  key: INFRAHUB_API_TOKEN
            - name: SERVICENOW_URL
              valueFrom:
                secretKeyRef:
                  name: crossplane-bridge-config
                  key: SERVICENOW_URL
                  optional: true
            - name: SERVICENOW_USER
              valueFrom:
                secretKeyRef:
                  name: crossplane-bridge-config
                  key: SERVICENOW_USER
                  optional: true
            - name: SERVICENOW_PASS
              valueFrom:
                secretKeyRef:
                  name: crossplane-bridge-config
                  key: SERVICENOW_PASS
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: crossplane-bridge
  namespace: infrahub-system
spec:
  selector:
    app: crossplane-bridge
  ports:
    - port: 8090
      targetPort: 8090
